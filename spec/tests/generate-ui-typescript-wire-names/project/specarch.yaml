specarch: "0.1"
info: { title: Catalogue, version: 1.0.0, wireNames: snake_case }
stages: [implementation]
stakeholders:
  owner: { description: The product owner. }
enums:
  ShelfName: { type: string, enum: [fiction, reference] }
  BookStatus: { type: string, enum: [shelved, retired] }
schemas:
  ShelfPlace:
    description: Where a book stands.
    type: object
    properties:
      roomName: { type: string, title: Room, maxLength: 40 }
      shelfNumber: { type: integer, format: int32, title: Shelf number, minimum: 1 }
    required: [roomName]
entities:
  Keeper:
    type: object
    properties:
      keeperId: { type: string, format: uuid, readOnly: true }
      fullName: { type: string, title: Full name, maxLength: 120 }
    required: [keeperId, fullName]
    primaryKey: [keeperId]
  Book:
    type: object
    properties:
      bookId: { type: string, format: uuid, readOnly: true }
      bookTitle: { type: string, title: Title, minLength: 1, maxLength: 200 }
      shelfName: { $ref: "#/enums/ShelfName", title: Shelf }
      bookStatus: { $ref: "#/enums/BookStatus", title: Status }
      shelfPlace: { $ref: "#/schemas/ShelfPlace", title: Where it stands }
      keeperId: { type: string, format: uuid, title: Keeper }
      keeperName: { type: string, title: Keeper's name, maxLength: 120 }
    required: [bookId, bookTitle, shelfName, bookStatus]
    primaryKey: [bookId]
    relations:
      keeper: { target: Keeper, kind: many-to-one, via: keeperId }
errors:
  book-not-found: { status: 404, title: No such book, condition: No book has this id. }
  title-taken: { status: 409, title: The title is taken, condition: Another book has this title. }
  book-on-loan: { status: 409, title: The book is on loan, condition: A member holds the book. }
permissions:
  books.read: { description: See the catalogue. }
  books.write: { description: Change the catalogue. }
  public: { description: Open to everyone. }
roles:
  librarian: { description: Keeps the catalogue., permissions: [books.read, books.write] }
paths:
  /sessions/current:
    get:
      operationId: getSession
      summary: Who is signed in
      permission: public
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedIn: { type: boolean }
                  grantedPermissions: { type: array, items: { type: string, maxLength: 100 }, maxItems: 50 }
                required: [signedIn, grantedPermissions]
  /keepers:
    get:
      operationId: listKeepers
      summary: The keepers
      permission: books.read
      listOf:
        entity: Keeper
        searchable: [fullName]
        pageSize: { default: 20, maximum: 50 }
      responses:
        "200":
          description: The keepers.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Keeper" } }
  /books:
    get:
      operationId: listBooks
      summary: The books
      permission: books.read
      parameters:
        - { name: shelfName, in: query, schema: { $ref: "#/enums/ShelfName" } }
      listOf:
        entity: Book
        filterable: [bookStatus]
        pageSize: { default: 25, maximum: 100 }
      responses:
        "200":
          description: The books.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Book" } }
  /books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBook
      summary: One book
      permission: books.read
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: { $ref: "#/entities/Book" }
        "404": { description: No such book., problem: book-not-found }
    put:
      operationId: changeBook
      summary: Change a book
      permission: books.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookTitle: { type: string, minLength: 1, maxLength: 200 }
                shelfName: { $ref: "#/enums/ShelfName" }
                shelfPlace: { $ref: "#/schemas/ShelfPlace" }
                keeperId: { type: string, format: uuid }
                keeperName: { type: string, maxLength: 120 }
              required: [bookTitle, shelfName]
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: { $ref: "#/entities/Book" }
        "404": { description: No such book., problem: book-not-found }
        "409": { description: The title is taken., problem: title-taken }
  /books/{bookId}/retire:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retireBook
      summary: Take a book out of the catalogue, saying why
      permission: books.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                retireReason: { type: string, title: Why it is retired, minLength: 3, maxLength: 300 }
              required: [retireReason]
      responses:
        "204": { description: Retired. }
        "409": { description: The book is on loan., problem: book-on-loan }
pages:
  books-list:
    kind: list
    title: Books
    route: /books
    entity: Book
    permission: books.read
    source: listBooks
    columns: [bookTitle, shelfName, bookStatus]
    filters: [shelfName, bookStatus]
    onSelect: { navigate: book-view, with: { bookId: bookId } }
    actions:
      - { label: Retire, kind: operation, target: retireBook, permission: books.write, when: 'bookStatus == "shelved"', confirm: "Retire this book?", reason: retireReason, then: { message: The book is retired. } }
  book-view:
    kind: view
    title: Book
    route: /books/{bookId}
    entity: Book
    permission: books.read
    source: getBook
    sections:
      - { title: Book, fields: [bookTitle, shelfName, bookStatus] }
      - { title: Where it stands, fields: [shelfPlace] }
    fieldConditions:
      shelfPlace: { hiddenWhen: 'bookStatus == "retired"' }
    states:
      failed:
        book-not-found: { message: There is no such book. }
    actions:
      - { label: Change, kind: navigate, target: book-edit, permission: books.write }
  book-edit:
    kind: form
    title: Change a book
    route: /books/{bookId}/edit
    entity: Book
    permission: books.write
    source: getBook
    submit: changeBook
    fields: [bookTitle, shelfName, keeperId, keeperName, shelfPlace]
    pickers:
      keeperId: { source: listKeepers, shows: [fullName], fills: { keeperName: fullName } }
    fieldConditions:
      shelfName: { readOnlyWhen: "size(bookTitle) == 0" }
    checks:
      title-long-enough: { expression: "size(bookTitle) >= 2", message: A title has two letters or more., field: bookTitle }
    states:
      failed:
        book-not-found: { message: There is no such book. }
        title-taken: { message: Another book has this title., field: bookTitle }
    onSubmitted: { navigate: book-view, with: { bookId: bookId }, message: The book is changed. }
accessibility: { standard: WCAG 2.2, level: AA }
theme:
  tokens:
    color:
      $type: color
      ink: { $value: { colorSpace: srgb, components: [0, 0, 0] } }
      paper: { $value: { colorSpace: srgb, components: [1, 1, 1] } }
  pairs:
    - { text: color.ink, background: color.paper, use: text }
