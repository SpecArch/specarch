decisions:
  ADR-004:
    title: A waiver is a request of its own that names the amount and the reason, and the fee stands until the request is approved
    status: accepted
    date: "2026-10-25"
    context: |
      Once the fee is fixed at return (ADR-003) a waiver has a definite
      amount to name. Letting the librarian who asks set the loan's fee to
      zero would leave no record of what was charged, who asked and who
      let it go, which the supervisor's approval (LIB-8) is there to make
      visible.
    decision: |
      A waiver is a FeeWaiverRequest that names the loan, the amount to
      waive and the reason, started by requestFeeWaiver and taken through
      the fee-waiver workflow; the fee stands on the loan until a desk
      supervisor approves the request, and waiveFee then waives it.
    consequences: |
      The request stays as the record of what was waived, why, and who
      approved it. A member whose request waits is still charged; a
      request not approved within its deadline is refused and the fee
      stands.
    restsOn: [ADR-003]
    satisfies: [LIB-8]
    why: A request of its own, approved by a second person, is the one way the amount, the reason and the approval are all readable afterwards; a fee set to zero by the person who asked would make the waiver a change nobody can read back.
