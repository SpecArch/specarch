  # specarch-problem: question: open_question: (must, decision) How do the roles go on the wire: info.roleNames upper_snake or each role as it is named? It blocks roles. Decided by system-owner. Answer with a decision record that names Q-7 under answers. [Q-7]
  Q-7:
    question: 'How do the roles go on the wire: info.roleNames upper_snake or each role as it is named?'
    kind: decision
    priority: must
    blocks: [roles]
    decidedBy: system-owner
    options: ['info.roleNames upper_snake, as Permissions of access has it', 'each role as it is named, as Lending desk grants has it']
    why: 'The sources disagree: Permissions of access says info.roleNames upper_snake, and Lending desk grants says each role as it is named. A token''s roles claim and the tables a permission check reads write each role one way, so the merge leaves info.roleNames out rather than choose between them.'
    cites:
      - {source: code, clause: access role AUDITOR, says: AUDITOR grants loans.read and public.}
      - {source: desk, clause: examples/lending-desk/sources/code role desk-staff, says: 'desk-staff grants fines.waive, loans.read, loans.write and members.write.'}
