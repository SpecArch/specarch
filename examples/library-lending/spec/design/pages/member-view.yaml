# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-0.1.schema.json
pages:
  member-view:
    kind: view
    title: Member
    route: /members/{memberId}
    entity: Member
    permission: members.read
    source: getMember
    sections:
      - { title: Member, fields: [cardNumber, fullName, email, tier] }
      - { title: Membership, fields: [joinedOn, membershipEndsOn, outstandingFees] }
      - { title: Contact, fields: [address, phones] }
    states:
      failed:
        member-not-found: { message: There is no member with this card. }
    actions:
      - { label: Lend a book, kind: navigate, target: loan-form, permission: loans.create }
      - { label: Lend copies, kind: navigate, target: member-loans, permission: loans.create }
      - { label: Deactivate, kind: operation, target: deactivateMember, permission: members.write, when: 'status == "active"', confirm: "Deactivate this member? They will borrow nothing more.", reason: reason, then: { message: The member is deactivated. } }
