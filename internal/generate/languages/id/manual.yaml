translations:
  "# %s: user manual": "# %s: manual pengguna"
  "Version %s of the specification: %s, %s and %s. For the people who use the system: who may open which page, how to reach it, the tasks done across pages step by step, what each page asks for and answers, and what each command takes, does and answers.": "Spesifikasi versi %s: %s, %s, dan %s. Untuk orang yang memakai sistem: siapa yang boleh membuka halaman mana, cara menuju ke sana, task yang dikerjakan lintas halaman langkah demi langkah, apa yang diminta dan dijawab tiap halaman, serta apa yang diterima, dikerjakan, dan dijawab tiap command."
  "task": "task"
  "tasks": "task"
  "page": "halaman"
  "pages": "halaman"
  "command": "command"
  "commands": "command"
  "Who uses it": "Siapa yang memakainya"
  "The specification has no role a person holds; the roles under roles, with the permissions the pages need, say who may open each page.": "Spesifikasi ini tidak punya role yang dipegang orang; role di roles, beserta permission yang dibutuhkan halaman, menentukan siapa yang boleh membuka tiap halaman."
  "Each role a person holds, and the pages it opens. A person holding several roles opens the pages of each.": "Tiap role yang dipegang orang, dan halaman yang dibukanya. Orang yang memegang beberapa role bisa membuka halaman dari masing-masing role."
  "| Role | Who they are | Pages they open |": "| Role | Siapa mereka | Halaman yang dibuka |"
  "Each role a person holds, and the pages it opens and the commands it runs. A person holding several roles opens the pages and runs the commands of each.": "Tiap role yang dipegang orang, halaman yang dibukanya, dan command yang dijalankannya. Orang yang memegang beberapa role bisa membuka halaman dan menjalankan command dari masing-masing role."
  "| Role | Who they are | Pages they open | Commands they run |": "| Role | Siapa mereka | Halaman yang dibuka | Command yang dijalankan |"
  "Anyone opens these pages, signed in or not: ": "Siapa pun bisa membuka halaman ini, sudah sign-in atau belum: "
  "Every person opens these pages once signed in, whatever their roles: ": "Setiap orang bisa membuka halaman ini setelah sign-in, apa pun role-nya: "
  "After signing in, a person is shown the home of the first of their roles that has one, in the order the session gives them: ": "Setelah sign-in, orang ditampilkan halaman home dari role pertama miliknya yang punya home, sesuai urutan yang diberikan session: "
  "Anyone who has the program runs these commands: ": "Siapa pun yang punya program ini bisa menjalankan command berikut: "
  "Finding your way": "Navigasi"
  "The specification has no menus; the entries a person picks a page from are written under menus.": "Spesifikasi ini tidak punya menu; entry tempat orang memilih halaman ditulis di menus."
  "The menus, and the page each entry opens. An entry is shown only to who may open its page.": "Menu, dan halaman yang dibuka tiap entry. Sebuah entry hanya ditampilkan kepada yang boleh membuka halamannya."
  "The specification has no flows; a task a person does across pages, with who does it and each page on the way, is written under flows.": "Spesifikasi ini tidak punya flow; task yang dikerjakan orang lintas halaman, beserta siapa yang mengerjakannya dan tiap halaman yang dilewati, ditulis di flows."
  "Done by ": "Dikerjakan oleh "
  "%d. Open %s from the menu.": "%d. Buka %s dari menu."
  "Pages": "Halaman"
  "The specification has no pages; each screen a person opens, with its fields and actions, is written under pages.": "Spesifikasi ini tidak punya halaman; tiap layar yang dibuka orang, beserta field dan aksinya, ditulis di pages."
  "Commands": "Command"
  "The specification has no commands; each command a person types, with its arguments, options and exit statuses, is written under commands.": "Spesifikasi ini tidak punya command; tiap command yang diketik orang, beserta argument, option, dan exit status-nya, ditulis di commands."
  "The specification names no program, so each command is written by its words alone; the name a person types before them is written under info.program. ": "Spesifikasi ini tidak menyebut nama program, jadi tiap command ditulis dengan kata-katanya saja; nama yang diketik orang sebelumnya ditulis di info.program. "
  "Each command is typed after the program's name, ": "Tiap command diketik setelah nama program, "
  ", in a terminal. ": ", di terminal. "
  "%s- %s: opens the %s page": "%s- %s: membuka halaman %s"
  "On the %s page, ": "Di halaman %s, "
  "select the row you want.": "pilih baris yang diinginkan."
  "send the form.": "kirim form-nya."
  "fill in ": "isi "
  ", and send it.": ", lalu kirim."
  "go on.": "lanjutkan."
  "the menu ": "menu "
  "a row selected on the %s page": "baris yang dipilih di halaman %s"
  "the action %s on the %s page": "aksi %s di halaman %s"
  "the link %s on the %s page": "link %s di halaman %s"
  "Reached from ": "Dibuka dari "
  "This screen is built by hand for this system rather than drawn from the specification, so how it looks and works is the project's.": "Layar ini dibuat manual untuk sistem ini, bukan digambar dari spesifikasi, jadi tampilan dan cara kerjanya ditentukan proyek."
  "| Column | What it shows |": "| Kolom | Yang ditampilkan |"
  "The list can be narrowed by ": "List ini bisa difilter berdasarkan "
  "| Field | What it shows |": "| Field | Yang ditampilkan |"
  "| Field | What to enter | Required |": "| Field | Yang diisi | Wajib |"
  "%s are added as rows, each with %s": "%s ditambahkan sebagai baris, masing-masing dengan %s"
  ", up to ": ", maksimal "
  "Checked before it is sent: ": "Dicek sebelum dikirim: "
  "**%s**: opens the %s page.": "**%s**: membuka halaman %s."
  "**: opens ": "**: membuka "
  ", outside the system.": ", di luar sistem."
  "Where its links lead:": "Tujuan link-nya:"
  "What can be done here:": "Yang bisa dilakukan di sini:"
