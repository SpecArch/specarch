  # specarch-problem: question: open_question: (must, decision) GET /v1/reports/export is reached by v1.export.get and v1.reports.get, and neither implies the other. Which one is its permission? Decided by system-owner. Answer with a decision record that names Q-14 under answers. [Q-14]
  Q-14:
    question: GET /v1/reports/export is reached by v1.export.get and v1.reports.get, and neither implies the other. Which one is its permission?
    kind: decision
    priority: must
    blocks: ['#/paths/~1v1~1reports~1export/get/permission']
    decidedBy: system-owner
    why: An operation needs exactly one permission, and rules that reach it with none covering the others leave it ambiguous.
  # specarch-problem: question: open_question: (could, decision) v2.get reaches no route of the route table (auditor reaches /v2/* with GET). Is it left from a route that was removed, or does it guard a route the table does not show? Decided by system-owner. Answer with a decision record that names Q-15 under answers. [Q-15]
  Q-15:
    question: v2.get reaches no route of the route table (auditor reaches /v2/* with GET). Is it left from a route that was removed, or does it guard a route the table does not show?
    kind: decision
    priority: could
    blocks: ['#/permissions/v2.get']
    decidedBy: system-owner
    why: A rule no route matches grants nothing today, and would grant a route added later that matches it without anyone writing it.
    cites:
      - {source: code, clause: access role auditor, says: auditor reaches /v2/* with GET.}
