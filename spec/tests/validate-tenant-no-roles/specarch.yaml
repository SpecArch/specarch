specarch: "0.3"
info: { title: Case, version: 1.0.0 }
entities:
  Note:
    type: object
    properties:
      id: { type: string, maxLength: 36 }
      text: { type: string, maxLength: 500 }
    required: [id, text]
    primaryKey: [id]
  Loan:
    type: object
    properties:
      id: { type: string, maxLength: 36 }
      organisationId: { type: string, maxLength: 36 }
    required: [id, organisationId]
    primaryKey: [id]
caller:
  description: Who is making the call.
  properties:
    organisationId: { type: string, maxLength: 36, description: The organisation every caller belongs to. }
tenant:
  property: organisationId
  key: organisationId
