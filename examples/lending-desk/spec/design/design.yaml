# yaml-language-server: $schema=../../../../schema/specarch-fragment-design-0.1.schema.json
entities:
  Member:
    description: A card holder.
    type: object
    properties:
      cardNumber: { type: string, maxLength: 10, pattern: "^[0-9]{10}$", sensitivity: internal, description: The number printed on the card. }
      fullName: { type: string, minLength: 1, maxLength: 200, sensitivity: personal }
      phoneNumber: { type: string, sensitivity: personal, description: "In the manual and not in the database; Q-6 asks whether to build it." }
      address: { $ref: "#/schemas/Address", description: Where the member lives; a member may give none. }
    required: [cardNumber, fullName]
    primaryKey: [cardNumber]
    satisfies: [LEND-1]
    origin: stated
    cites:
      - { source: desk-manual, clause: "2.1", says: "A member is known by the card number printed on the card, and the desk records the member's full name." }
      - { source: desk-manual, clause: "2", says: "The desk keeps a member's card number (internal), full name (personal) and phone number (personal)." }
      - { source: desk-code, clause: "lending/model.go:14", says: "Member has CardNumber, 10 digits, and FullName." }
      - { source: desk-code, clause: "migrations/001_init.sql:1", says: "card_number CHAR(10) is the key; full_name VARCHAR(200) NOT NULL." }
      - { source: desk-code, clause: "lending/model.go:17", says: "Member has an Address, nil when the member gave none." }
  Book:
    description: One copy on the shelves.
    type: object
    properties:
      barcode: { type: string, minLength: 1, maxLength: 20 }
      title: { type: string, minLength: 1, maxLength: 300 }
    required: [barcode, title]
    primaryKey: [barcode]
    satisfies: [LEND-2]
    origin: stated
    cites:
      - { source: desk-manual, clause: "3.1", says: "Desk staff scan the book's barcode." }
      - { source: desk-code, clause: "migrations/001_init.sql:6", says: "barcode VARCHAR(20) is the key; title VARCHAR(300) NOT NULL." }
  Loan:
    description: One book lent to one member.
    type: object
    properties:
      id: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, readOnly: true, description: "A BIGSERIAL key, bounded so that a JSON reader keeps every digit." }
      cardNumber: { type: string, maxLength: 10, pattern: "^[0-9]{10}$" }
      barcode: { type: string, minLength: 1, maxLength: 20 }
      loanedOn: { type: string, format: date, readOnly: true }
      dueOn: { type: string, format: date, readOnly: true }
      returnedOn: { type: [string, "null"], format: date, readOnly: true }
    required: [id, cardNumber, barcode, loanedOn, dueOn]
    primaryKey: [id]
    relations:
      member: { target: Member, kind: many-to-one, via: cardNumber, onDelete: restrict }
      book: { target: Book, kind: many-to-one, via: barcode, onDelete: restrict }
    satisfies: [LEND-2, LEND-4, LEND-6]
    origin: stated
    cites:
      - { source: desk-manual, clause: "3.3", says: "The due date is printed on the slip." }
      - { source: desk-code, clause: "lending/model.go:35", says: "Loan has ID, CardNumber, Barcode, LoanedOn, DueOn and ReturnedOn, which is empty until the book is back." }
      - { source: desk-code, clause: "migrations/001_init.sql:11", says: "loans references members and books; returned_on may be null." }

schemas:
  Address:
    description: Where a member lives. One that is given has its street and city.
    type: object
    properties:
      street: { type: string, minLength: 1, maxLength: 200, sensitivity: personal }
      city: { type: string, minLength: 1, maxLength: 100, sensitivity: personal }
      postcode: { type: string, maxLength: 20, sensitivity: personal }
    required: [street, city]
    origin: stated
    cites:
      - { source: desk-code, clause: "lending/model.go:22", says: "Address has Street, City and Postcode; one that is given has its street and city, and the postcode may be left out." }
      - { source: desk-code, clause: "migrations/003_member_address.sql:1", says: "members gets address_street VARCHAR(200), address_city VARCHAR(100) and address_postcode VARCHAR(20), with a check that an address is wholly absent or has its street and city." }

permissions:
  members.write:
    description: Register members.
    satisfies: [LEND-1]
    origin: stated
    cites:
      - { source: desk-code, clause: "lending/routes.go:37", says: "POST /members checks members.write." }
  loans.write:
    description: Lend, renew and check in books.
    satisfies: [LEND-2, LEND-5, LEND-6]
    origin: stated
    cites:
      - { source: desk-code, clause: "lending/routes.go:38", says: "POST /loans and POST /loans/{loanId}/return check loans.write." }
  loans.read:
    description: See the loans of a member.
    satisfies: [LEND-7]
    origin: inferred
    why: Undocumented, from code; it stands or falls with LEND-7 and Q-2.
    cites:
      - { source: desk-code, clause: "lending/routes.go:42", says: "GET /members/{cardNumber}/loans checks loans.read." }

roles:
  desk-staff:
    description: Staff at the lending desk.
    permissions: [members.write, loans.write, loans.read]
    origin: stated
    cites:
      - { source: desk-manual, clause: "2.2", says: "Desk staff register new members." }
      - { source: desk-code, clause: "seeds/001_roles.sql:3", says: "desk-staff grants members.write, loans.write and loans.read." }

paths:
  /members:
    # specarch-problem: warning: test_case_missing: operation registerMember has no red scenario for "denied without members.write"; add under tests register-member-denied-without-members-write: { operation: registerMember, scenario: red, covers: [denied without members.write], given: "a caller without members.write", when: "registerMember is called", then: "it is refused as not allowed" } [test_case_missing.585bd96d@design/design.yaml#/paths/~1members/post]
    # specarch-problem: warning: test_case_missing: operation registerMember has no red scenario for "cardNumber not matching its pattern"; add under tests register-member-card-number-not-matching-its-pattern: { operation: registerMember, scenario: red, covers: [cardNumber not matching its pattern], given: "...", when: "registerMember is called with cardNumber in the wrong form", then: "it is refused" } [test_case_missing.8225af9c@design/design.yaml#/paths/~1members/post]
    # specarch-problem: warning: test_case_missing: operation registerMember has no red scenario for "missing fullName"; add under tests register-member-missing-full-name: { operation: registerMember, scenario: red, covers: [missing fullName], given: "...", when: "registerMember is called without fullName", then: "it is refused" } [test_case_missing.d8c1b4d0@design/design.yaml#/paths/~1members/post]
    # specarch-problem: warning: test_case_missing: operation registerMember has no red scenario for "missing cardNumber"; add under tests register-member-missing-card-number: { operation: registerMember, scenario: red, covers: [missing cardNumber], given: "...", when: "registerMember is called without cardNumber", then: "it is refused" } [test_case_missing.f0ddd858@design/design.yaml#/paths/~1members/post]
    # specarch-problem: warning: test_golden_missing: operation registerMember has no golden scenario; add one under tests, for example register-member-succeeds: { operation: registerMember, scenario: golden, given: "a caller with members.write", when: "registerMember is called with values inside every limit", then: "it answers 201: The member is registered." } [test_golden_missing@design/design.yaml#/paths/~1members/post]
    post:
      operationId: registerMember
      summary: Register a member
      permission: members.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/entities/Member" }
      responses:
        "201": { description: The member is registered. }
      satisfies: [LEND-1]
      origin: stated
      cites:
        - { source: desk-manual, clause: "2.2", says: "Desk staff register new members." }
        - { source: desk-code, clause: "lending/routes.go:47", says: "RegisterMember answers 201." }
  /loans:
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "denied without loans.write"; add under tests lend-book-denied-without-loans-write: { operation: lendBook, scenario: red, covers: [denied without loans.write], given: "a caller without loans.write", when: "lendBook is called", then: "it is refused as not allowed" } [test_case_missing.2bfe73d3@design/design.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "not found cardNumber"; add under tests lend-book-not-found-card-number: { operation: lendBook, scenario: red, covers: [not found cardNumber], given: "no Member has that cardNumber", when: "lendBook is called with that cardNumber", then: "it is refused as not found" } [test_case_missing.2e91489b@design/design.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "missing barcode"; add under tests lend-book-missing-barcode: { operation: lendBook, scenario: red, covers: [missing barcode], given: "...", when: "lendBook is called without barcode", then: "it is refused" } [test_case_missing.68aaa23d@design/design.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "cardNumber not matching its pattern"; add under tests lend-book-card-number-not-matching-its-pattern: { operation: lendBook, scenario: red, covers: [cardNumber not matching its pattern], given: "...", when: "lendBook is called with cardNumber in the wrong form", then: "it is refused" } [test_case_missing.6ccbe6b8@design/design.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "missing cardNumber"; add under tests lend-book-missing-card-number: { operation: lendBook, scenario: red, covers: [missing cardNumber], given: "...", when: "lendBook is called without cardNumber", then: "it is refused" } [test_case_missing.e24ae930@design/design.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "not found barcode"; add under tests lend-book-not-found-barcode: { operation: lendBook, scenario: red, covers: [not found barcode], given: "no Book has that barcode", when: "lendBook is called with that barcode", then: "it is refused as not found" } [test_case_missing.fb83227a@design/design.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_golden_missing: operation lendBook has no golden scenario; add one under tests, for example lend-book-succeeds: { operation: lendBook, scenario: golden, given: "a caller with loans.write", when: "lendBook is called with values inside every limit", then: "it answers 201: The loan." } [test_golden_missing@design/design.yaml#/paths/~1loans/post]
    post:
      operationId: lendBook
      summary: Lend a book
      permission: loans.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardNumber: { type: string, maxLength: 10, pattern: "^[0-9]{10}$" }
                barcode: { type: string, minLength: 1, maxLength: 20 }
              required: [cardNumber, barcode]
      responses:
        "201":
          description: The loan.
          content:
            application/json:
              schema: { $ref: "#/entities/Loan" }
        "409": { description: The member already has five books on loan. }
      satisfies: [LEND-2, LEND-3]
      origin: stated
      cites:
        - { source: desk-manual, clause: "3.1", says: "Desk staff lend a book by scanning the member's card and the book's barcode." }
        - { source: desk-code, clause: "lending/routes.go:59", says: "LendBook answers 409 when the member has MaxOpenLoans books out, and 201 otherwise." }
  /loans/{loanId}/return:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 } }
    # specarch-problem: warning: test_case_missing: operation returnBook has no red scenario for "denied without loans.write"; add under tests return-book-denied-without-loans-write: { operation: returnBook, scenario: red, covers: [denied without loans.write], given: "a caller without loans.write", when: "returnBook is called", then: "it is refused as not allowed" } [test_case_missing.69b798fb@design/design.yaml#/paths/~1loans~1{loanId}~1return/post]
    # specarch-problem: warning: test_case_missing: operation returnBook has no red scenario for "not found loanId"; add under tests return-book-not-found-loan-id: { operation: returnBook, scenario: red, covers: [not found loanId], given: "no record has that loanId", when: "returnBook is called with that loanId", then: "it is refused as not found" } [test_case_missing.e34b1cce@design/design.yaml#/paths/~1loans~1{loanId}~1return/post]
    # specarch-problem: warning: test_golden_missing: operation returnBook has no golden scenario; add one under tests, for example return-book-succeeds: { operation: returnBook, scenario: golden, given: "a caller with loans.write", when: "returnBook is called with values inside every limit", then: "it answers 200: The loan is closed." } [test_golden_missing@design/design.yaml#/paths/~1loans~1{loanId}~1return/post]
    post:
      operationId: returnBook
      summary: Check a book in
      permission: loans.write
      responses:
        "200": { description: The loan is closed. }
      satisfies: [LEND-6]
      origin: stated
      cites:
        - { source: desk-manual, clause: "5.1", says: "Checking a book in closes the loan." }
        - { source: desk-code, clause: "lending/routes.go:73", says: "ReturnBook closes the loan and answers 200." }
  /loans/{loanId}/renew:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 } }
    # specarch-problem: warning: test_case_missing: operation renewLoan has no red scenario for "denied without loans.write"; add under tests renew-loan-denied-without-loans-write: { operation: renewLoan, scenario: red, covers: [denied without loans.write], given: "a caller without loans.write", when: "renewLoan is called", then: "it is refused as not allowed" } [test_case_missing.b47830b9@design/design.yaml#/paths/~1loans~1{loanId}~1renew/post]
    # specarch-problem: warning: test_case_missing: operation renewLoan has no red scenario for "not found loanId"; add under tests renew-loan-not-found-loan-id: { operation: renewLoan, scenario: red, covers: [not found loanId], given: "no record has that loanId", when: "renewLoan is called with that loanId", then: "it is refused as not found" } [test_case_missing.b53498e4@design/design.yaml#/paths/~1loans~1{loanId}~1renew/post]
    # specarch-problem: warning: test_golden_missing: operation renewLoan has no golden scenario; add one under tests, for example renew-loan-succeeds: { operation: renewLoan, scenario: golden, given: "a caller with loans.write", when: "renewLoan is called with values inside every limit", then: "it answers 200: The loan, with its new due date." } [test_golden_missing@design/design.yaml#/paths/~1loans~1{loanId}~1renew/post]
    post:
      operationId: renewLoan
      summary: Renew a loan
      permission: loans.write
      responses:
        "200": { description: "The loan, with its new due date." }
      satisfies: [LEND-5]
      origin: stated
      why: The manual has the member ask at the desk, so desk staff renew, under the permission the other loan changes use. The service does not serve it yet; Q-4 asks whether to build it.
      cites:
        - { source: desk-manual, clause: "4.1", says: "A member may renew a loan once, for one more loan period, by asking at the desk before the due date." }
  /members/{cardNumber}/loans:
    parameters:
      - { name: cardNumber, in: path, required: true, schema: { type: string, pattern: "^[0-9]{10}$" } }
    # specarch-problem: warning: test_case_missing: operation listMemberLoans has no red scenario for "not found cardNumber"; add under tests list-member-loans-not-found-card-number: { operation: listMemberLoans, scenario: red, covers: [not found cardNumber], given: "no record has that cardNumber", when: "listMemberLoans is called with that cardNumber", then: "it is refused as not found" } [test_case_missing.2ae43bc7@design/design.yaml#/paths/~1members~1{cardNumber}~1loans/get]
    # specarch-problem: warning: test_case_missing: operation listMemberLoans has no red scenario for "cardNumber not matching its pattern"; add under tests list-member-loans-card-number-not-matching-its-pattern: { operation: listMemberLoans, scenario: red, covers: [cardNumber not matching its pattern], given: "...", when: "listMemberLoans is called with cardNumber in the wrong form", then: "it is refused" } [test_case_missing.856e2e15@design/design.yaml#/paths/~1members~1{cardNumber}~1loans/get]
    # specarch-problem: warning: test_case_missing: operation listMemberLoans has no red scenario for "denied without loans.read"; add under tests list-member-loans-denied-without-loans-read: { operation: listMemberLoans, scenario: red, covers: [denied without loans.read], given: "a caller without loans.read", when: "listMemberLoans is called", then: "it is refused as not allowed" } [test_case_missing.adf94778@design/design.yaml#/paths/~1members~1{cardNumber}~1loans/get]
    # specarch-problem: warning: test_golden_missing: operation listMemberLoans has no golden scenario; add one under tests, for example list-member-loans-succeeds: { operation: listMemberLoans, scenario: golden, given: "a caller with loans.read", when: "listMemberLoans is called with values inside every limit", then: "it answers 200: The member's loans." } [test_golden_missing@design/design.yaml#/paths/~1members~1{cardNumber}~1loans/get]
    get:
      operationId: listMemberLoans
      summary: The loans of one member
      permission: loans.read
      responses:
        "200":
          description: The member's loans.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Loan" } }
      satisfies: [LEND-7]
      origin: inferred
      why: Undocumented, from code; Q-2 asks whether it is wanted.
      cites:
        - { source: desk-code, clause: "lending/routes.go:91", says: "ListMemberLoans answers 200 with the member's loans." }
