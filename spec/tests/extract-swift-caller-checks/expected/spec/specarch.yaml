# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v1.4.0/schema/specarch-design-1.0.schema.json
specarch: "1.0.0"
info:
  title: Swift source of server
  version: 0.1.0
  description: |
    The Swift source under server, read at commit 447a701621614dab0dfb82b44fcd1b8273bdd454 by SwiftSyntax 604.0.0 through the code-facts dump, by its syntax alone, with the property lists, build settings and Core Data models there read as data. Every element cites the line that declares it; what the source does not say as a literal, or through an idiom the reader knows, is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design, deployment]
sources:
  code:
    kind: code
    title: The code repository
    edition: 447a701621614dab0dfb82b44fcd1b8273bdd454
    url: ../repo
    clauses:
      - {clause: server/Sources/App/Guards.swift, title: 'Swift source, read by its syntax'}
      - {clause: server/Sources/App/routes.swift, title: 'Swift source, read by its syntax'}
    reading: parsed
