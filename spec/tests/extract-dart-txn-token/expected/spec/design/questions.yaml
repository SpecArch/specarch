  # specarch-problem: question: open_question: (must, decision) svc/lib/server.dart:12: the handler of POST /invoices/{invoiceId}/send reads the Txn-Token header, so the operation accepts a transaction token. Declare it under tokens with tokenType txn_token and its claims, name it in the operation's token, and list the services that call it on a person's behalf in via. Decided by system-owner. Answer with a decision record that names Q-5 under answers. [Q-5]
  Q-5:
    question: 'svc/lib/server.dart:12: the handler of POST /invoices/{invoiceId}/send reads the Txn-Token header, so the operation accepts a transaction token. Declare it under tokens with tokenType txn_token and its claims, name it in the operation''s token, and list the services that call it on a person''s behalf in via.'
    kind: decision
    priority: must
    blocks: ['#/paths/~1invoices~1{invoiceId}~1send/post/token', '#/paths/~1invoices~1{invoiceId}~1send/post/via']
    decidedBy: system-owner
    why: The Txn-Token header carries a transaction token and nothing else (the Transaction Tokens draft, section 12); its claims and the immediate callers are the design's, and the code shows only that the header is read.
    cites:
      - {source: code, clause: 'svc/lib/server.dart:12', says: Reads the header Txn-Token.}
