# yaml-language-server: $schema=../../../schema/specarch-fragment-requirements-1.0.schema.json
requirements:
  SA-146:
    statement: specarch validate shall warn, in both builds, at the element to change and in the problems file, about seven design weaknesses a specification shows before code exists - object_unscoped, internal_key_exposed, refusal_reveals_record, query_from_caller, duties_unseparated, secret_unprotected and audit_not_append_only - and a specification shall be able to say what they read - the security controls a requirement asks for (separationOfDuties, auditTrail), that an entity's records are appendOnly, that a field is hashed at rest, and how long a secret setting's value is used (rotation).
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An operation that reaches one record by its key with permission signedIn and no row policy on its entity is warned object_unscoped at its permission; the same operation with a permission a role grants, or a row policy on the entity, is not.
      - A path parameter named loanId of type integer, and a response carrying an entity's integer primary key, are warned internal_key_exposed; the same with a uuid key is not.
      - A 403 on an operation that reaches one record by its key with permission signedIn is warned refusal_reveals_record; a 404 in its place is not.
      - A query parameter sort or filter of type string with no enum, and a request body property sql, are warned query_from_caller; a sort parameter with an enum and a body property order are not.
      - A requirement whose controls list separationOfDuties with no set satisfying it, and a permission that satisfies such a requirement and no satisfying set names, are warned duties_unseparated; a set satisfying the requirement and naming the permission quiets both.
      - An entity's password field with no atRest, and a secret setting with no rotation, are warned secret_unprotected; atRest hashed and rotation P90D quiet them.
      - A requirement whose controls list auditTrail with no entity satisfying it, an entity that satisfies it without appendOnly, an appendOnly entity that an operation deletes, and an appendOnly entity with transitions or that a command's guard names, are warned audit_not_append_only; an appendOnly entity that nothing changes quiets them.
      - A hashed field in a primary key, a unique constraint, or a list's searchable, filterable or sortable is reported as at_rest or list_of.
      - Both validator builds print the same lines for each case.
    verification: test
    needs: [NEED-1, NEED-6]
    why: A weakness written into the design is built into every stack the design is generated for, and costs least to change while it is still a line of the specification; a warning at that line, naming what to change, makes the security decision visible to the person who writes it and to the reviewer (ADR-247).
    cites:
      - source: owasp-api-security-top-10
        clause: "API1:2023"
        says: "Broken object level authorisation is the most common and most damaging API weakness: an endpoint that takes an object's identifier must check that the caller may act on that object."
  SA-147:
    statement: The problems file's SARIF log shall tag each design security rule it lists under tool.driver.rules with properties.tags [security], under a rule id that stays the same from release to release, so a tool reading the log beside its findings in the code groups and cites them.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - specarch document problems over a specification that warns a design security rule writes that rule under tool.driver.rules with properties.tags holding security, and a rule that is not a security rule with no properties.
      - The rule ids are the names of the Rule enum, so a second run and a later release write the same ids.
    verification: test
    needs: [NEED-1, NEED-6]
    why: SARIF readers group results by a rule's tags, and a tool that traces a finding from the specification into the code needs a name it can cite across releases (ADR-247, ADR-156).
