  releaseWatcher:
    description: Asks the registry for a new release of each service and installs it
    runs: always
    configuration: [registryAddress, logLevel, apiToken]
    signals:
      SIGTERM:
        description: 'stops: the service manager sends it to stop the process, and kills the process when it has not ended within the time'
        within: PT30S
      SIGHUP:
        description: 'reloads: the service manager sends it when the process is reloaded'
    restart:
      when: onFailure
      delay: PT5S
      # specarch-problem: warning: process: process releaseWatcher is given up after its limit, and no monitor watches it, so nobody is told it has stopped; name the monitor under monitors [process@design/processes.yaml#/processes/releaseWatcher/restart/limit]
      limit:
        times: 5
        within: PT10M
    health:
      description: it tells the service manager it is alive (sd_notify WATCHDOG=1) at least once each PT2M, and the service manager takes silence as a failure
      every: PT2M
    origin: stated
    cites:
      - {source: code, clause: units/release-watcher.service, says: 'Line 2: Description=Asks the registry for a new release of each service and installs it; the description'}
      - {source: code, clause: units/release-watcher.service, says: 'Line 9: Type=notify; a service that is not oneshot runs until it is stopped, so it runs always'}
      - {source: code, clause: units/release-watcher.service, says: 'Line 12: Environment= sets REGISTRY_ADDRESS, LOG_LEVEL, API_TOKEN; the settings it reads, their values not copied'}
      - {source: code, clause: units/release-watcher.service, says: 'Line 17: TimeoutStopSec=30s; the time the service manager waits before it kills the process'}
      - {source: code, clause: units/release-watcher.service, says: 'Line 11: ExecReload= sends SIGHUP to $MAINPID; a reload sends SIGHUP; the command is not copied, since it may carry a secret'}
      - {source: code, clause: units/release-watcher.service, says: 'Line 14: Restart=on-failure; when it is started again'}
      - {source: code, clause: units/release-watcher.service, says: 'Line 15: RestartSec=5s; the delay before it is started again'}
      - {source: code, clause: units/release-watcher.service, says: 'Line 5: StartLimitBurst=5; the starts after which it is given up'}
      - {source: code, clause: units/release-watcher.service, says: 'Line 6: StartLimitIntervalSec=10min; within this time'}
      - {source: code, clause: units/release-watcher.service, says: 'Line 18: WatchdogSec=2min; the watchdog'}
