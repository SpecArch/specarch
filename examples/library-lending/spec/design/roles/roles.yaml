# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-0.3.schema.json
roles:
  librarian:
    description: Staff at the desk.
    permissions: [members.read, members.write, catalogue.read, loans.read, loans.create, loans.return, fees.request]
  head-librarian:
    description: Staff who decide what a lost copy costs the library; they do not lend.
    permissions: [loans.read, loans.writeoff]
  member:
    description: A card holder, who sees only their own loans.
    permissions: [catalogue.read, loans.read]
    rows:
      Loan: memberId == caller.memberId
    satisfies: [LIB-6]
    why: A member reads only the loans whose memberId is their own; the rule is written here once and holds for every operation, page and job that reads a loan, and a caller with no member identifier reaches no loan through it.
  scheduler:
    description: The system itself, running the nightly jobs; no person signs in as it.
    permissions: [loans.read]
  desk-supervisor:
    description: The supervisor of the desk, who approves what one librarian may not do alone.
    permissions: [loans.read, fees.approve]
    satisfies: [LIB-8]
  auditor:
    description: The finance system's reconciliation, which reads the day's loans to settle the fee ledger; no person holds it.
    permissions: [loans.read]
