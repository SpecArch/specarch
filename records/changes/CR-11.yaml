specarchRecord: "1.0.0"
kind: change
id: CR-11
title: Let a task page's answer lead to the caller's home with navigate callerHome, checked by both validators and opened by the three ui generators
raisedBy: specification-author
raised: "2026-10-28"
phase: development
type: perfective
urgency: normal
reason: A task page used by several roles could only name one page to go to after its answer, so a person was sent to another role's page instead of back to their own home.
affects:
  adds:
    - "#/decisions/ADR-206"
    - "#/tests/validate-caller-home"
    - "#/tests/validate-caller-home-refused"
    - "#/tests/validate-caller-home-no-home"
    - "#/tests/derive-caller-home"
  changes: ["#/enums/Rule"]
impact: minor
decision:
  by: specification-author
  date: "2026-10-28"
  outcome: approved
  why: callerHome is a reserved word in navigate, refused where the caller is unknown and an error only when no role names a home; no 1.2.0 file names it, since a 1.2.0 file has no role home to lead to, so no file that is clean on 1.2.0 gets a new error, and a minor release carries it (ADR-186, ADR-206).
release: 1.3.0
status: released
