specarch: "1.0.0"
info: { title: Case, version: 1.0.0 }
algorithms:
  lateFee:
    description: Fee charged when a copy comes back after its due date, capped at the book's replacement cost.
    inputs:
      daysLate: { type: integer, format: int32, minimum: 0 }
      dailyRate: { type: string, format: decimal, precision: 10, scale: 2 }
      replacementCost: { type: string, format: decimal, precision: 10, scale: 2 }
    output: { type: string, format: decimal, precision: 10, scale: 2 }
    formula: min(decimal(daysLate, 0) * dailyRate, replacementCost)
    examples:
      - { name: returned on time, inputs: { daysLate: 0, dailyRate: "0.50", replacementCost: "25.00" }, expected: "0.00" }
      - { name: one week late, inputs: { daysLate: 7, dailyRate: "0.50", replacementCost: "25.00" }, expected: "3.50" }
      - { name: capped at replacement cost, inputs: { daysLate: 90, dailyRate: "0.50", replacementCost: "25.00" }, expected: "25.00" }
    pseudocode: return the smaller of daysLate times dailyRate and replacementCost
