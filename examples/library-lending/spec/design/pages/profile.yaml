# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-1.0.schema.json
pages:
  profile:
    kind: view
    title: My profile
    route: /profile
    entity: Member
    permission: signedIn
    source: getProfile
    sections:
      - { title: Card, fields: [cardNumber, fullName, email, tier] }
      - { title: Membership, fields: [joinedOn, membershipEndsOn, outstandingFees] }
    states:
      failed:
        member-not-found: { message: "Your account holds no library card, so there is no member record to show." }
    satisfies: [LIB-6]
    why: Every person who holds a card sees their own record and what they owe; the page needs no permission granted by role, so a role added later has it too, and staff, who hold no card, are told so.
