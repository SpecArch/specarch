specarch: "0.1"
info: { title: Case, version: 1.0.0 }
permissions:
  public: { description: Open to everyone. }
paths:
  /cards:
    get:
      operationId: listCards
      summary: List cards
      permission: public
      idempotencyKey: Idempotency-Key
      responses:
        "200": { description: The cards. }
    post:
      operationId: issueCard
      summary: Issue a card
      permission: public
      idempotencyKey: Idempotency-Key
      parameters:
        - { name: Idempotency-Key, in: query, schema: { type: string } }
      responses:
        "201": { description: Issued. }
