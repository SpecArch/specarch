specarchRecord: "1.0.0"
kind: change
id: CR-26
title: "Keep who said what and when as records: specarch log, decide --record, the communications and timeline documents, and the rules evidence, record_cited and unheard"
raisedBy: specification-author
raised: "2026-11-03"
phase: development
type: perfective
urgency: normal
reason: What a stakeholder said, and when, lived in notes and chats outside the specification, so a decision could not cite it and a stakeholder nobody had heard went unnoticed until acceptance.
