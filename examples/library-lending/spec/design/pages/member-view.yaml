# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-1.0.schema.json
pages:
  member-view:
    kind: view
    title: Member
    route: /members/{memberId}
    entity: Member
    permission: members.read
    source: getMember
    sections:
      - { title: Member, fields: [cardNumber, fullName, email, tier] }
      - { title: Membership, fields: [joinedOn, membershipEndsOn, outstandingFees] }
      - { title: Contact, fields: [address, phones] }
    fieldConditions:
      address: { hiddenUnless: members.write }
      phones: { hiddenUnless: members.write }
    why: The desk that registers members uses the contact section; a supervisor who reads a member's record to decide a fee waiver has no use for it, so it is left off their screen. This is screen layout, not a privacy rule; getMember still answers address and phones to every caller with members.read, and a role that must never receive them would need them left out of that response.
    states:
      failed:
        member-not-found: { message: There is no member with this card. }
    actions:
      - { label: Lend a book, kind: navigate, target: loan-form, permission: loans.create }
      - { label: Lend copies, kind: navigate, target: member-loans, permission: loans.create }
      - { label: Deactivate, kind: operation, target: deactivateMember, permission: members.write, when: 'status == "active"', confirm: "Deactivate this member? They will borrow nothing more.", reason: reason, then: { message: The member is deactivated. } }
