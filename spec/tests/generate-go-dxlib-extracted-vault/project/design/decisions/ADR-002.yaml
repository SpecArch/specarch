decisions:
  ADR-002:
    title: Does the running system register POST /downloadAttachment? It is declared at api/endpoints.go:49, and no list the running system printed was read with it.
    status: accepted
    date: "2026-10-20"
    context: |-
      Q-2 asked: Does the running system register POST /downloadAttachment? It
      is declared at api/endpoints.go:49, and no list the running system
      printed was read with it. It blocked #/paths/~1downloadAttachment/post.
      Syntax shows a declaration and not what runs; the document dxlib emits,
      or a route table, says what the running system registers, and merging it
      answers this.
    decision: |-
      Yes: Define registers it on the vault's API at start-up, as it registers
      every endpoint of the file.
    consequences: |-
      #/paths/~1downloadAttachment/post is written from this answer, carrying
      origin decided and decidedIn ADR-002.
    answers: [Q-2]
    decidedBy: system-owner
    origin: stated
    cites:
      - {source: vault-owner, says: 'Yes: Define registers it on the vault''s API at start-up, as it registers every endpoint of the file.'}
