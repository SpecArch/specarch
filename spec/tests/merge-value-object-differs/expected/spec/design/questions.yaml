questions:
  Q-1:
    question: Are the columns address_city, address_postcode and address_street of Members the field address, the schema Address kept in columns? The column address_city has maxLength 80, and address.city has 100; the code has no check that address is either wholly absent or has its required parts.
    kind: decision
    priority: must
    blocks: ['#/entities/Members/properties/address']
    decidedBy: system-owner
    why: specarch generate sql writes the field as these columns, and the code's differ from them. The merge reads columns as a field only where they are what the field writes, so it joins nothing here (ADR-077).
    cites:
      - {source: code, clause: migrations public.members, says: Table public.members.}
      - {source: api, clause: /components/schemas/Members, says: 'The schema Members, with the properties cardNumber and address.'}
      - {source: api, clause: /components/schemas/Address, says: 'The schema Address, with the properties street, city and postcode.'}
