# yaml-language-server: $schema=../../../schema/specarch-fragment-test-1.0.schema.json
command: extract
level: system
scenario: golden
given: "a code-facts dump of an Express server in TypeScript whose app.use() checks every route's audience against a setting, whose routes admit two clients named in an array literal at one route, check the immediate caller against an array literal at one route and against a setting at another, admit one application named as a string at a route whose permission two other routes check without it, and pass the event writer there by its name, without a call; and at one more route pass two client checks in turn whose lists differ, the second given a reason string after the client it names; and mount a router whose route checks its own permission under a use() that passes a client check before the router; and an implementation file naming each under permissionChecks, clientChecks, applicationChecks, callerChecks, audienceChecks and eventWriters, with the argument that carries the names"
when: "extract javascript is run on the dump with the implementation file"
then: "it reads the gates as extract go does: writes the literal clients as the operation's callers and the literal service as the other's via, each with a must question to declare them that holds the errors at callers and via; asks for the via of the route whose names come from the setting, naming it; asks for the through the application check narrows, naming the two routes that check the same permission without it; asks at the tokens for the audience the setting gives, citing the use() call; names the event writer and writes nothing from it; writes the clients both checks list as the callers of the route with two, asking which it is meant to admit; asks whether the string after the named argument is a name, writing it nowhere; writes the client the mount's check names as the callers of the mounted route, citing the check at the use() that mounts the router, and counts the audience check of the application's earlier use() at the mounted route too, 6 operations in all; reads every route's permission as before; and exits 0"
verifies: [SA-89]
