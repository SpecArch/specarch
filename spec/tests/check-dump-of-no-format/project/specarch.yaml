specarch: "0.1"
info: { title: Case, version: 1.0.0 }
stages: [implementation]
stakeholders:
  owner: { description: The product owner. }
entities:
  Branch:
    type: object
    properties:
      code: { type: string, maxLength: 8 }
      name: { type: string, maxLength: 100 }
    required: [code, name]
    primaryKey: [code]
  Copy:
    type: object
    properties:
      id: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
      branchCode: { type: string, maxLength: 8 }
      title: { type: string, maxLength: 200 }
      label: { type: [string, "null"], maxLength: 4 }
      reference: { type: string, format: uuid, generatedDefault: identifier, readOnly: true }
    required: [id, branchCode, title, reference]
    primaryKey: [id]
    relations:
      branch: { target: Branch, kind: many-to-one, via: branchCode, onDelete: restrict }
    constraints:
      copies_title_given: { kind: check, expression: "title != \"\"", message: A copy has a title. }
permissions:
  copies.read: { description: See the copies. }
  copies.write: { description: Add copies., implies: [copies.read] }
roles:
  clerk: { description: Shelves copies., permissions: [copies.write] }
  visitor: { description: Looks the copies up., permissions: [copies.read] }
paths:
  /copies:
    get:
      operationId: listCopies
      summary: List the copies
      permission: copies.read
      responses:
        "200": { description: The copies. }
    post:
      operationId: addCopy
      summary: Add a copy
      permission: copies.write
      responses:
        "201": { description: The copy. }
  /copies/{copyId}:
    parameters:
      - { name: copyId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 } }
    get:
      operationId: showCopy
      summary: Show a copy
      permission: copies.read
      responses:
        "200": { description: The copy. }
