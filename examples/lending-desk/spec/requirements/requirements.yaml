# yaml-language-server: $schema=../../../../schema/specarch-fragment-requirements-0.1.schema.json
stakeholders:
  desk-staff:
    description: Staff at the lending desk, who register members, lend books and take them back.
    origin: stated
    cites:
      - { source: desk-manual, clause: "2.2", says: "Desk staff register new members and hand out the card." }
  member:
    description: A card holder who borrows books.
    origin: stated
    cites:
      - { source: desk-manual, clause: "2.1", says: "Anyone with a library card may borrow." }
  catalogue-team:
    description: The team that keeps the book records, which the desk only reads.
    origin: stated
    cites:
      - { source: desk-manual, clause: "3.4", says: "The catalogue team keeps the book records: it adds each copy with its barcode and title, and changes them." }
  desk-manager:
    description: The person in charge of the desk, who settles what the manual and the service should say.
    origin: inferred
    why: Neither source names who decides; someone must settle where the manual and the code disagree, and the desk's own head is the nearest role to it.

requirements:
  LEND-1:
    statement: Desk staff shall register a member by card number and full name.
    kind: functional
    priority: must
    status: accepted
    origin: stated
    cites:
      - { source: desk-manual, clause: "2.1", says: "A member is known by the card number printed on the card, and the desk records the member's full name." }
      - { source: desk-manual, clause: "2.2", says: "Desk staff register new members." }
      - { source: desk-code, clause: "lending/routes.go:37", says: "POST /members, checked against members.write." }
  LEND-2:
    statement: Desk staff shall lend a book to a member by the member's card number and the book's barcode.
    kind: functional
    priority: must
    status: accepted
    origin: stated
    cites:
      - { source: desk-manual, clause: "3.1", says: "Desk staff lend a book by scanning the member's card and the book's barcode." }
      - { source: desk-code, clause: "lending/routes.go:38", says: "POST /loans, checked against loans.write." }
  LEND-3:
    statement: A member shall have at most five books on loan at a time.
    kind: functional
    priority: must
    status: accepted
    origin: stated
    cites:
      - { source: desk-manual, clause: "3.2", says: "A member may have at most five books on loan at a time." }
      - { source: desk-code, clause: "lending/model.go:11", says: "MaxOpenLoans is 5; LendBook answers 409 at the limit." }
  LEND-4:
    kind: functional
    priority: must
    status: accepted
    origin: stated
    why: Both sources set a loan period, and they set different ones, so the statement waits for Q-1.
    cites:
      - { source: desk-manual, clause: "3.3", says: "The loan period is 21 days." }
      - { source: desk-code, clause: "lending/model.go:8", says: "LoanPeriod is 14 days." }
      - { source: desk-code, clause: "migrations/001_init.sql:18", says: "The loans table checks that due_on is loaned_on plus 14." }
  LEND-5:
    statement: Desk staff shall renew a loan once, before its due date, for one more loan period.
    kind: functional
    priority: should
    status: accepted
    origin: stated
    cites:
      - { source: desk-manual, clause: "4.1", says: "A member may renew a loan once, for one more loan period, by asking at the desk before the due date." }
  LEND-6:
    statement: Desk staff shall check a returned book in by its barcode, which closes the loan.
    kind: functional
    priority: must
    status: accepted
    origin: stated
    cites:
      - { source: desk-manual, clause: "5.1", says: "Desk staff check a returned book in by scanning its barcode, which closes the loan." }
      - { source: desk-code, clause: "lending/routes.go:39", says: "POST /loans/{loanId}/return, checked against loans.write." }
  LEND-7:
    statement: Desk staff shall list the loans of one member.
    kind: functional
    priority: should
    status: accepted
    origin: inferred
    why: Undocumented, from code. The service serves GET /members/{cardNumber}/loans; the manual never mentions it. Q-2 asks the desk manager to confirm it.
    cites:
      - { source: desk-code, clause: "lending/routes.go:42", says: "GET /members/{cardNumber}/loans, checked against loans.read." }

questions:
  Q-1:
    question: Is the loan period 21 days, as the manual says, or 14 days, as the service does?
    kind: decision
    priority: must
    blocks: ["#/requirements/LEND-4/statement"]
    decidedBy: desk-manager
    options: ["21 days: the service is wrong and changes", "14 days: the manual is wrong and changes"]
    why: The manual and the code disagree, and neither says which is current.
    cites:
      - { source: desk-manual, clause: "3.3", says: "The loan period is 21 days." }
      - { source: desk-code, clause: "lending/model.go:8", says: "LoanPeriod is 14 days." }
      - { source: desk-code, clause: "migrations/001_init.sql:18", says: "The loans table checks that due_on is loaned_on plus 14." }
  Q-2:
    question: The service lists a member's loans, which the manual never mentions. Is that wanted, and who may use it?
    kind: decision
    priority: should
    blocks: ["#/requirements/LEND-7"]
    decidedBy: desk-manager
    options: ["Keep it for desk staff, and add it to the manual", "Take it out of the service"]
    why: Undocumented, from code.
  Q-3:
    question: How is each requirement shown to be met?
    kind: decision
    priority: must
    blocks:
      - "#/requirements/LEND-1/acceptance"
      - "#/requirements/LEND-2/acceptance"
      - "#/requirements/LEND-3/acceptance"
      - "#/requirements/LEND-4/acceptance"
      - "#/requirements/LEND-5/acceptance"
      - "#/requirements/LEND-6/acceptance"
      - "#/requirements/LEND-7/acceptance"
    decidedBy: desk-manager
    why: Neither the manual nor the code gives acceptance criteria, and the code has no tests to read them from.
