# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-0.3.schema.json
caller:
  description: Who is calling.
  properties:
    memberId: { type: [string, "null"], format: uuid, description: The member signed in. }
entities:
  Loan:
    description: A book lent to a member.
    type: object
    primaryKey: [id]
    properties:
      id: { type: string, format: uuid, description: The loan. }
      memberId: { type: string, format: uuid, description: The member. }
permissions:
  loans.read: { description: See loans. }
roles:
  member:
    description: A card holder.
    permissions: [loans.read]
    rows: { Loan: memberId == caller.memberId }   # flow style

  librarian:
    description: Staff at the desk.
    permissions: [loans.read]
