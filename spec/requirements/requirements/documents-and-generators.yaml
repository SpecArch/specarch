# yaml-language-server: $schema=../../../schema/specarch-fragment-requirements-1.0.schema.json
requirements:
  SA-7:
    statement: specarch document and specarch generate shall write only into the folder the target owns, and with --check shall fail when the committed output differs.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A run writes the target's files into its folder and nothing elsewhere.
      - A run with --check on output edited by hand names the file and exits 1, writing nothing.
    verification: test
    needs: [NEED-3]
  SA-8:
    statement: Every generated file shall name its source specification, version and meta-model, and a hand-written Markdown document shall change only between its markers.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - The first line of a generated document names the root file, its version and the meta-model.
      - A marked region is rewritten and every other line of the document is unchanged.
    verification: test
    needs: [NEED-3]
  SA-26:
    statement: specarch document shall write the change and defect register and the release notes from the records beside a specification, kept current with --check like the other documents.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - The register lists open change requests and defects before the closed ones, each with its status, what it affects and its decision.
      - The release notes list the releases newest first, each with its changes and fixes grouped as added, changed, removed and fixed.
    verification: test
    needs: [NEED-3, NEED-5]
    why: Reviewers and operators read what changed and why in documents; kept apart from the specification, the history stays out of it and still reaches them.
  SA-14:
    statement: A code target that specarch does not build in shall be produced by the plug-in specarch-gen-<target> found on PATH, which receives the validated specification on its standard input and answers with the files to write, so that specarch writes them, checks them and keeps them inside the target's folder.
    kind: interface
    priority: should
    status: accepted
    acceptance:
      - specarch generate <target> with no built-in generator and no plug-in on PATH says so and exits 2.
      - A plug-in's answer that names a path outside the output folder is refused and nothing is written.
    verification: test
    needs: [NEED-7]
    cites:
      - source: protoc-plugins
        says: "A plug-in reads a CodeGeneratorRequest from standard input and writes a CodeGeneratorResponse to standard output; protoc writes the files, so a plug-in never touches the disk."
  SA-15:
    statement: Every document specarch writes shall show an element's why as an Insight and each of its citations as a Note, next to the element, and shall end with the sources its Notes cite.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An element with a why gets one paragraph labelled Insight, and each citation one paragraph labelled Note that names the source's title, edition, the clause and what it says.
      - An element shown as a row of a table gets its Insight and Notes after the table, labelled with the row's name.
      - A document whose Notes cite sources ends with a table of exactly those sources.
    verification: test
    needs: [NEED-6]
    why: A reader can skip every Insight and Note and still read the document, or read only them to follow the reasoning; a label on each makes both possible.
  SA-16:
    statement: specarch document shall write, besides the technical specification, the requirements specification, the test plan, the traceability matrix, the deployment guide and the commissioning procedure with its sign-off sheet.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - Each of the five targets writes <target>.md into the folder it owns, with the generated-from header.
      - The commissioning procedure has a Result column for every step and a sign-off sheet with a row for every signer.
    verification: test
    needs: [NEED-3, NEED-5]
    cites:
      - source: iso-29119-3
        clause: "7.2 and 8.3"
        says: "A test plan and test case specifications are the test documentation items of a project."
  SA-46:
    statement: An implementation file shall mark an element another stakeholder owns, one mapping at a time, naming that stakeholder; no generator shall write a marked element, and validate, diff, gaps and the gates shall still read it.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An entity whose mapping names a stakeholder under ownedBy gets no table from generate sql and no schema from generate openapi, while a foreign key or a reference to it is still written.
      - An operation whose mapping names a stakeholder under ownedBy gets no operation from generate openapi.
      - A page, or a menu or a menu entry, whose mapping names a stakeholder under ownedBy gets no page and no menu entry from generate ui; a mapping may name a menu or an entry of one, '#/menus/<menu>/items/<entry>', as it names any other element, and one that points at nothing is refused, the same in both builds.
      - validate and gaps read the marked element as before, and a question that blocks it still holds generation up.
      - ownedBy naming no stakeholder of the specification is reported, the same in both builds.
    verification: test
    needs: [NEED-2, NEED-8]
    why: A system read from its sources often holds parts another team builds and changes, such as a shared table or a service behind the same gateway; the specification must describe them, since the project's code depends on them and its sources cite them, but a project that generated them would overwrite the other team's work or fight it on every change.
  SA-58:
    statement: specarch generate bpmn shall write, through a plug-in, each workflow of a specification as a BPMN 2.0 XML file with its diagram, and the diagram as SVG, that specarch extract workflows reads back to the same workflow, each problem marked at the element it concerns and a draft labelled as one.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - Each workflow is one process in a file of its own, in the sequential subset of ADR-054, with BPMN DI shapes and edges laid out by a fixed rule, so two runs write the same bytes.
      - extract workflows reads a generated file back to the workflow's description, step names and kinds, approvers, deadlines, and refusal or escalation, and names its trigger and operations in the questions that merge fills; an approval that is the last step comes back as one.
      - Each warning and open question at an element a file shows is marked as an XML comment before that element, in the BPMN file and in the SVG; a problem of one workflow is marked only in that workflow's files.
      - Output generated with --unapproved from a specification no approval record covers says it is a draft, in the BPMN file and visibly in the SVG.
    verification: test
    needs: [NEED-3, NEED-10]
    why: A workflow is reviewed by people who read BPMN diagrams and run BPMN engines, so the design must reach them in that format; written by hand, the diagram drifts from the workflow on the first change, and one that cannot be read back cannot take a change made in a modeller back into the specification.
  SA-59:
    statement: specarch generate shall mark every warning and open question at the entry each generated file shows for it, shall write a draft labelled as one in every file when --unapproved lets it past open questions or a missing approval, and shall write the rest of a target's output with an entry the target cannot express marked at that entry and exit 1.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - generate --unapproved on a specification with a must question that blocks an entity writes the target's files, each saying it is a draft and naming the question, and the entity's entry carries the question's mark.
      - A warning at an operation is marked above its handler in Go, in x-specarch-marks on the operation in OpenAPI, and a warning at an entity above its table in SQL.
      - A target that cannot express one entry writes the rest with an error mark at that entry, prints the error and exits 1; SQL writes no migration then, and an approved run over a migration a draft wrote is an error.
      - generate without --out passes over a specification that names no output folder for the target with an output_folder warning and writes the others.
    verification: test
    needs: [NEED-3, NEED-8]
    why: The people who answer the questions judge a result faster from the code and screens than from documents, and a compiler that stops at the first gap hides every other one; a draft that says what it is, with each gap at its entry, shows both without letting unapproved code pass for approved.
  SA-60:
    statement: specarch document html shall write a specification as one HTML page that opens from the disk with no server and makes no request, with an overview first, every element under an anchor named by its pointer, and every problem linked to the entry it marks and marked at that entry.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - The page is one index.html with its styles, its script and its diagrams inside it, a Content-Security-Policy that allows no request, and the generated-from header after its doctype; two runs write the same bytes.
      - Every element shown has an id equal to its pointer, with what an id or a fragment cannot hold percent-encoded, and no id appears twice.
      - Each error, warning and open question is listed in the order of the problems file and links to the deepest element the page shows that holds its pointer, and that element shows a mark linking back; an element an open question blocks says so and links to the question.
      - Entities are drawn as an SVG diagram with their fields and relations, each workflow as specarch generate bpmn draws it, and each page that specarch generate ui writes as its screen without scripts; a page with no screen says why.
      - An invalid specification is written all the same, from what could be read, with its errors marked.
    verification: test
    needs: [NEED-3, NEED-10]
    why: Reviewers and testers read a specification long before it is finished and seldom read YAML; one page they can open anywhere, search, and link into by an element's id lets them name exactly what a remark is about, which is what takes it back into the specification.
  SA-61:
    statement: specarch generate --check shall compare a folder of pages built by hand with what the target writes, saying for each file whether it matches and, for a page's data, which values differ.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - A file the plug-in marks as an object literal is read on both sides in the subset of TypeScript that is also JSON5 and compared by value, so formatting, comments, quotes and trailing commas do not count; each differing value is named by its path, with the value on disk and the one generated.
      - A file on disk outside the subset is reported as not comparable, with the line and what was found, and never as matching.
      - A file built by hand, which has no generated header, matches when it equals what the target writes without its header, draft notice and problem marks; it says so in a line of its own and is not counted as differing. A generated file is still compared byte for byte.
      - The library lending example's sign-in and second-factor schemas, written by hand before the generator, compare equal, and a list schema with one column changed is reported as that column.
    verification: test
    needs: [NEED-2]
    why: Most screens of a project that comes to SpecArch were built by hand; before the generated ones replace them, the owner needs to see, page by page, where the specification and the built screen disagree, without the noise of formatting.
  SA-71:
    statement: specarch generate sqlc shall write the sqlc queries the design derives against the tables generate sql writes, and leave every other query to be written by hand beside them.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - An operation that posts an entity is an insert of every column but the ones the database draws and the soft-delete flag, answering the record; a read, a replacement or an amendment by one path parameter, of an entity whose key is one field, reads or changes the record by its key, a softly deleted record left out, an amendment keeping a column the request leaves out.
      - An operation with listOf on an entity is a page of it and its total, filtered by each filterable field and each query parameter that names a field, searched case-insensitively over the searchable fields, and sorted by the wire name of each sortable field either way, then by the key.
      - A list of a view, a list under a path parameter, a list with a query parameter that names no field held in one column, and a read or change of an entity whose key is not one field are warnings at the operation, and their queries are left to be written by hand; an entity another stakeholder owns gets no query.
      - A dialect other than PostgreSQL or MariaDB is an error at the target. A query file in the output folder that the plug-in did not write is never overwritten; generate --check compares it, and it matches when it equals what the target writes but for its header.
      - The queries compile under sqlc against the migrations, and the lending desk's query file written by hand differs from the generated one only where the specification and its database disagree.
    verification: test
    needs: [NEED-2, NEED-8]
    why: A project on sqlc writes its queries by hand, and most of them are the same few shapes of every entity; writing those from the design keeps them in step with the tables, and a comparison with the file written by hand shows where the two disagree before the generated one replaces it.
  SA-87:
    statement: specarch generate scripts shall write, for each guarded operation or command whose change the design says, by a keyword or by the guard's writes, a script that refuses unless the guard's precondition holds on exactly the records it names, makes the change only when told to apply it, checks the exact count of records changed, and changes nothing when it is run again; every other guarded change is left to be written by hand.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - A guarded entry that triggers transitions of the guard's entity with one to state, none of their from states, sets the state field to it, on the record by its key when the operation's path has one parameter, and otherwise on every record in a from state for which the precondition holds; a guarded PUT of the entity by one path parameter sets every column a caller may set; a guarded DELETE by one path parameter deletes the record, or sets its soft-delete flag; any other guarded entry whose guard has writes sets the fields it names, each to the value the operator gives or to a literal, beside a transition it triggers when there is one, or deletes the records, on the record by its key when the path has one parameter, and otherwise on every record for which the precondition holds that does not already hold every value set.
      - The script counts the records the change would write, with the key, the from states, the precondition and the soft-delete flag in its condition, and refuses unless the count is recordsChanged; the change carries the same condition, and the script refuses unless it wrote recordsChanged records and a record changed by its key holds what was written.
      - A variable the change needs that is not set is refused by name before anything is read, unless its column may be null, when leaving it out sets the column to NULL.
      - Without the variable apply set to true, the script runs every check and rolls back, saying how many records would change; a record by its key that already holds what the change writes is reported as already applied and left as it is.
      - A guarded POST, a guarded PATCH and a guarded command that triggers no transition, each with no writes, a writes that sets a field stored encrypted, transitions of one trigger with two to states, a transition back to the state it leaves, a keyed change whose recordsChanged is not 1, an entity whose key is not one field, a PUT that sets a field stored encrypted and a PUT that sets no column a caller may set are warnings at the guard, and their scripts are left to be written by hand. A dialect other than PostgreSQL or MariaDB is an error at the target, and a script in the output folder that the plug-in did not write is never overwritten.
    verification: test
    needs: [NEED-2]
    why: A data change typed by hand against a live system is where a wrong condition changes a thousand records instead of one; a script written from the guard checks the state it expects, shows the change before making it and counts what it changed, so the mistake is refused rather than committed.
  SA-90:
    statement: specarch document shall write the user manual from the flows, menus, pages, roles, problem types and commands, and the operations guide from the endpoints, jobs, channels, dependencies, monitors, procedures, settings and deployments, and a problem type shall say what the person who meets it does next, a command what the person who ran it does after each status it fails with, a monitor what the operator does when its objective is missed, and a job that keeps an item apart who handles a kept item, where it is kept and what they do with it.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - specarch document manual writes manual.md with the roles that open a page, each with the pages it opens, a role a job acts as or a client holds left out unless a flow names it as its actor; the menus; each flow's steps as numbered instructions; and each page's purpose, who opens it, its fields or columns, its actions with their confirmation, and per problem it names the message, the condition and the remedy.
      - The manual has a section per command with its usage line from the program's name and the command's words, who runs it, its arguments and options, what it reads, writes and prints, and each exit status with what it means and its remedy.
      - specarch document operations writes operations.md with the environments and their hosts, a checklist row per monitor, job and dependency, each monitor's response, each job's trigger, role and retries, each channel's carrier, publishers and consumers, each dependency's callers, the endpoints with their permissions, the settings, and the backup, restore and rollback steps.
      - The operations guide writes, under the jobs, for each job that keeps an item apart, where a kept item is, the role that handles it and the steps to look at it, try it again or discard it, or one sentence naming deadLetter when the job has none.
      - A specification with no pages, flows, commands, monitors or jobs still gets both documents, each empty section one sentence naming the key that fills it, and its errors marked as in every document.
      - A problem type without remedy, a command without remedies or a program name, and a monitor without response are read as before, with no error or warning, the same in both builds.
      - A job's deadLetter whose role is not a role, or on a job whose retries do not keep an item apart, is refused as job, the same in both builds.
      - A command's remedy keyed by status 0, or by a status its exitCodes does not list, is refused as exit_code, the same in both builds.
    verification: test
    needs: [NEED-3, NEED-5]
    why: The people who use a system and the people who run it read a manual and an operations guide, not a technical specification; written by hand both drift from the pages and the procedures, and written from the specification they show early what a page asks of a person, which is where a change request starts.
    cites:
      - source: iso-12207
        clause: "6.4.12"
        says: "The operation process uses the system in its intended environment and supports its users."
  SA-116:
    statement: specarch generate seed shall write, through specarch-gen-seed, a development seed for the tables generate sql writes, made-up rows drawn from the entities with a fixed seed, so that the file is the same bytes on every run, loads into a database the migrations have just built, and holds nothing about a real person.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - seed.sql holds one INSERT per row, the tables in an order every foreign key can be satisfied in, the count of each entity from settings.rows (ten where it names none), a header naming the dialect, the type-rendering version and the seed, and the same bytes on every run with the same specification and settings; another seed gives other rows.
      - Every value follows its field, as the type-rendering idiom renders the column; an integer, a number and a decimal lie within the field's minimum, maximum, exclusive bounds and multipleOf, at its precision and scale; text has its minLength and maxLength and names the field and the row, or holds the row's number padded to minLength where the field's words do not fit; a pattern gives a value matching it; an enum one of its values; a date, an instant, a time, a duration, a uuid and binary data each in the dialect's literal; an email, a URI, a host name and an address lie in the ranges reserved for documentation; a field's examples are the first rows' values, read from the design's field when the column keeps a value object as JSON, each member of an object example typed by the schema's part, and a key or unique counts on from after them, repeating none.
      - A key and a unique constraint never repeat across the rows; a check constraint holds for every row, evaluated as a fixture's record is, a list given as its length; an optional field is NULL in some rows and given in others; a value object kept in columns is present or absent as a whole with its required parts set; one kept as JSON, a list and a map are JSON text, a list of scalars PostgreSQL's array; a foreign key points at a row of the file, an optional one at NULL in some rows, a relation to the entity itself at an earlier row, and a one-to-one relation at the row of the same rank, NULL beyond the other side's rows when it is optional; the audit columns hold a fixed instant and the actor seed, and the soft-delete flag is false; a generated default is written out, so a child's key names it.
      - The dialect is the seed target's, the sql target's when it names none, PostgreSQL otherwise, and two that differ are an error at the target; a required field encrypted at rest, a required relation to an entity that gets no rows or that another stakeholder owns, a cycle of required relations, a required one-to-one relation with too few rows on the other side, and an entity no row of which satisfies its constraints in a hundred draws are errors at the entry, the entity gets no rows and the file says so, the rest is written, and the run exits 1; a field that is a key or unique whose values are fewer than the rows is an error at the field naming the count.
      - An entity another stakeholder owns gets no rows; settings.rows naming an entity that is not one, or one another stakeholder owns, a count below zero or a seed that is not a whole number is an error at the target. The plug-in never truncates, deletes or runs against a database.
    verification: test
    needs: [NEED-2, NEED-10]
    why: A project writes the fake records its developers work against by hand, in SQL, and they drift from the specification at every change of a field, an enum or a relation; drawing them from the entities with a fixed seed keeps them in step and byte-identical, so generate --check reads a stale seed as it reads a stale migration.
  SA-121:
    statement: specarch generate deploy shall write, through specarch-gen-deploy, each deployment of an implementation file as a Compose file, Kubernetes manifests or a cloud-init file per host, as the deploy target's settings name the form, from the specification's environments, configuration, migrations, release and rollback and the deployment's servers, links and values; shall write the release, the rollback and each migration as a runbook; shall write, for a Compose deployment named under fresh, the script that builds an environment from nothing, loads the migrations and the seed, runs the implementation's test suite there and tears it down; and shall reference every secret where the form reads it from the host, never writing a value for it.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - A compose deployment is written as <deployment>/compose.yaml with one service per server that runs something of the implementation, the database server as a container of the sql target's dialect with a named volume, the ports it listens on published, the links from a server as depends_on, and <deployment>/<deployment>.env holding every non-secret setting's value, the deployment's or the schema's default; a kubernetes deployment as <deployment>/kubernetes.yaml with a Namespace, a ConfigMap of the values, a Deployment and a Service per service server, a StatefulSet with a volume claim of the size settings.storage names per database server, and a NetworkPolicy allowing the links into a server and nothing else; a cloud-init deployment as one <deployment>/<server>.cloud-init.yaml per host, installing podman and running the server's image under systemd through a Quadlet unit with the values in a file the unit reads.
      - A secret setting appears in every file only as a reference, in Compose as ${NAME:?reason}, on Kubernetes as a secretKeyRef into the Secret <system>-secrets, in cloud-init as /etc/<system>/secrets.env, whose variables the unit checks before it starts; a database's password is referenced the same way as <SERVER>_PASSWORD in every form, the host unit copying that line of secrets.env under the image's own variable into /run/<system>/<server>.env before it starts; no file holds a value for either; and a setting's variable is its key in upper snake case in every form.
      - release.sh, rollback.sh and migrations/<name>.sh print each step of the stage with its action and its check, in order, and go on only on yes; --yes answers every step; a migration's --rollback runs its rollback steps, and a migration without them refuses --rollback with its description.
      - For a compose deployment named under settings.fresh, <deployment>/fresh.sh runs the build task, starts the Compose project under a name made for the run alone, waits for the database, creates on postgresql each role of the design as the database role the row policies name, loads the sql target's migrations in order and the seed target's seed.sql into it through the container's own client, runs testing.run with the values in the environment, and takes the project down with its volumes on any exit; the secrets of the run come from the environment the script runs in, and the run publishes the deployment's own ports, so the suite reaches each server at localhost on its port.
      - A deployment with no form or a form that is not compose, kubernetes or cloud-init, a deployment named in the settings that the file does not have, a kubernetes or cloud-init deployment named under fresh, a server with no image, a Kubernetes database with no storage, a database of a dialect other than postgresql or mariadb, and a setting with no value in a deployment and no default are each an error at the target or the setting, the server or value left out is named in a comment where it would be, the rest is written, and the run exits 1; a server that is a dependency of the design is named with its URL and gets no container.
    verification: test
    needs: [NEED-3, NEED-10]
    why: A compose file, a set of manifests or a host image written by hand repeats what the implementation file's deployment already says and drifts from it at the next setting or port; a full regression run on an environment an earlier test left behind passes or fails on what that test wrote; and the quickest way to run a thing by hand is to write its password next to it, so the generated files leave every secret to the host (ADR-227).
