specarch: "0.3"
info: { title: Case, version: 1.0.0 }
entities:
  Country:
    type: object
    properties:
      code: { type: string, maxLength: 2 }
    required: [code]
    primaryKey: [code]
  Region:
    type: object
    properties:
      code: { type: string, maxLength: 8 }
      organisationId: { type: string, maxLength: 36 }
    required: [code, organisationId]
    primaryKey: [code]
  Loan:
    type: object
    properties:
      id: { type: string, maxLength: 36 }
      organisationId: { type: integer, format: int32 }
    required: [id, organisationId]
    primaryKey: [id]
caller:
  description: Who is making the call.
  properties:
    organisationId: { type: string, maxLength: 36, description: The organisation every caller belongs to. }
tenant:
  property: organisationId
  key: organisationId
  shared: [Country, Region, Countries]
permissions:
  loans.read: { description: See loans. }
roles:
  staff:
    description: Staff of one organisation.
    permissions: [loans.read]
