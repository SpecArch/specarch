# yaml-language-server: $schema=../../../schema/specarch-fragment-design-1.0.schema.json
commands:
  log:
    summary: Record one communication with a stakeholder, from what the analyst reports in chat, as a record beside the specification
    description: |
      Validates its input first and prints the errors of an invalid
      specification, then works on what could be read (ADR-065). Writes
      one communication record, `records/communications/COM-<n>.yaml`
      beside the specification's folder, under the next number after the
      largest any communication record carries, from the options alone:
      who said it and to whom (`--from`, `--to`, roles), when (`--at`, an
      instant with its offset), how (`--channel`), what it is (`--type`),
      the words (`--words`, with `--form` saying whether they are verbatim
      or a summary), who wrote it down (`--recorded-by`), and what it
      touches (`--question`, `--decision`, `--element`, `--change`,
      `--defect`, `--idea`, each repeatable). The command guesses
      nothing: every one of who, when, how, what and what was said that is
      not given comes back as a line on standard output, one per missing
      option, saying what to ask the analyst and the option to give it
      with, and nothing is written, with exit 1; with `--json` the same
      under `log.missing`, each with its option, the question to put and
      the choices the specification offers (ADR-220).

      Refuses, with exit 1 and nothing written, a role that is not a
      stakeholder, an instant not written as RFC 3339 with its offset, a
      channel, type, form or direction outside their values, a question
      that is neither open nor answered by a decision, a decision,
      element, change, defect, idea, session or source the specification
      and its records do not have, an answer (`--type answer`) that names
      no question, a reply on a record that is not a question, and an
      evidence file that is not under `records/`. Each evidence file is
      read and its SHA-256 and media type written into the record, the
      media type from the file's extension or given after `=` as
      `--evidence <path>=<media type>`; the validator later refuses a
      record whose file no longer matches (`evidence`).

      Prints on standard output the record's path, and for an answer the
      `specarch decide` line that records it as the decision, citing the
      record with `--record`. With `--dry-run` it prints the record it
      would write and writes nothing.
    permission: public
    arguments:
      - name: folder
        description: The folder holding the specification; the record goes into records/communications/ beside it.
        required: true
        schema: { type: string }
    options:
      direction:
        description: in when the stakeholder said it to the project, out when the project said it to the stakeholder.
        schema: { type: string, enum: [in, out] }
      from:
        description: Who said it, by role; a stakeholder of the specification, never a person.
        schema: { type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$" }
      to:
        description: Who it was said to, by role.
        schema: { type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$" }
      at:
        description: When it was said, an instant with its offset as RFC 3339 writes it, such as 2026-10-31T10:15:00+07:00; the date and the offset are asked for when the analyst gave a time alone.
        schema: { type: string, format: date-time }
      channel:
        description: "How it was said: meeting, chat, email, call or document."
        schema: { type: string, enum: [meeting, chat, email, call, document] }
      type:
        description: "What it is: answer (to a question of the specification), question (the stakeholder asked), request, information or objection."
        schema: { type: string, enum: [answer, question, request, information, objection] }
      words:
        description: What was said, as given or summarised.
        schema: { type: string, minLength: 1 }
      form:
        description: verbatim when --words holds the words as they were said or written, summary when it is a summary of them.
        schema: { type: string, enum: [verbatim, summary] }
      reply:
        description: What was said back, for a question the stakeholder asked; in the same form as the words.
        schema: { type: string, minLength: 1 }
      person:
        description: A label for the person on the stakeholder's side when the role alone does not say who; left out of the documents for everyone.
        schema: { type: string, minLength: 1 }
      recorded-by:
        description: The role that writes it down, usually the analyst's.
        schema: { type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$" }
      session:
        description: The session or test session record it was said in, by ID.
        schema: { type: string, pattern: "^[A-Z][A-Z0-9]{1,15}-[A-Za-z0-9._]+$" }
      source:
        description: "The declared source it belongs to, by key: the interview it was part of."
        schema: { type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$" }
      evidence:
        description: A file under records/ that shows it, by its path, with the media type after = when the extension does not say it; repeatable.
        schema: { type: array, items: { type: string, minLength: 1 } }
      question:
        description: A question of the specification it is about, open or answered, by ID; repeatable, and required for an answer.
        schema: { type: array, items: { type: string, pattern: "^[A-Z][A-Z0-9]{0,15}-[A-Za-z0-9._]+$" } }
      decision:
        description: A decision it is about, by ID; repeatable.
        schema: { type: array, items: { type: string, pattern: "^ADR-[0-9]{3,}$" } }
      element:
        description: "A requirement ID or a #/ pointer it is about; repeatable."
        schema: { type: array, items: { type: string, minLength: 1 } }
      change:
        description: A change request it is about, by ID; repeatable.
        schema: { type: array, items: { type: string, pattern: "^[A-Z][A-Z0-9]{1,15}-[A-Za-z0-9._]+$" } }
      defect:
        description: A defect it is about, by ID; repeatable.
        schema: { type: array, items: { type: string, pattern: "^[A-Z][A-Z0-9]{1,15}-[A-Za-z0-9._]+$" } }
      idea:
        description: An idea it is about, by ID; repeatable.
        schema: { type: array, items: { type: string, pattern: "^[A-Z][A-Z0-9]{1,15}-[A-Za-z0-9._]+$" } }
      dry-run:
        description: Check everything and write nothing; print the record it would write as would write <path>.
        schema: { type: boolean, default: false }
    reads:
      - { path: "{folder}", description: "The specification, and the records beside it: the communication records for the next ID, the sessions and the records the links name." }
      - { path: "records/<evidence path>", description: "Each evidence file, to take its SHA-256." }
    writes:
      - { path: "records/communications/COM-<n>.yaml", description: "The communication record, under the next number; refused when a file of that name exists." }
    standardOutput: The errors of an invalid specification; then, when something is missing, one line per missing option saying what to ask; or the path written and, for an answer, the decide line to run next.
    standardError: A usage message on a usage error, the reason a refusal, and one line naming the record written.
    exitCodes:
      "0": the record is written
      "1": nothing written, since a required option is missing or a value names what the specification does not have; or written, while the specification has errors
      "2": usage error, or a file that could not be read or written
    remedies:
      "1": "Read the lines on standard output: ask the analyst each question they put, and run the command again with the option each names; a refusal on standard error names the value to correct."
      "2": "Read the usage message or the reason on standard error, correct the command line or the path it names, and run it again."
    satisfies: [SA-118]
    why: |
      What a stakeholder said is the source of most of a specification,
      and it reaches the analyst in a chat, a call or a meeting that
      leaves no record of who said it and when. Typed into the record by
      an agent from the analyst's words, it stays traceable only if the
      agent fills nothing in: a guessed role or time is worse than none,
      since it reads as a fact. So the command takes every field as an
      option and sends back what is missing as the questions to ask,
      rather than reading free text and inferring.
    cites:
      - source: iso-29148
        clause: "6.4.3"
        says: "Each requirement is traceable to its source: the stakeholder need or the document it comes from."
  log test-run:
    summary: Record one run of the tests, from a JUnit XML results file, as a test-run record beside the specification, each result mapped to its test
    description: |
      Validates its input first and prints the errors of an invalid
      specification, then works on what could be read (ADR-065). Reads
      the JUnit XML file `--results` names, which must be under
      `records/` beside the specification's folder (such as
      `records/evidence/`), a `testsuites` or a `testsuite` element
      holding `testcase` elements, and writes one test-run record,
      `records/test-runs/TR-<n>.yaml`, under the next number after the
      largest any test-run record carries: the environment
      (`--environment`), the version (`--version`, a release record), the
      build (`--build`) and the specification's digest (`--digest`) when
      known, the instant (`--at`, with its offset), the role that ran it
      (`--by`), the results file as evidence with its media type and
      SHA-256, and one result per testcase in the file's order, with the
      name as the file writes it, the outcome (passed, failed, error or
      skipped, from the testcase's failure, error or skipped child) and
      the failure's message. Nothing else is read from the file: its
      timestamp has no offset, and its hostname is no environment of the
      specification. Every one of the results file, the environment, the
      instant and the role that is not given comes back as a line on
      standard output saying what to ask, and nothing is written, with
      exit 1; with `--json` under `log.missing` (ADR-220).

      Each result names the test of the specification it maps to: the
      testcase's name, cut at the first `/` (a subtest) and with a
      trailing `()` taken off, is the test's name, or `Test` or `test`
      followed by the name in Pascal case (the functions
      specarch-gen-tests-go and specarch-gen-tests-swift write), or
      begins with the name and a colon (the display name of the Swift
      and Dart tests). A testcase that maps to no test, or to two, is
      kept in the record without a test and printed as a line `unmapped:
      <name>: <why>` on standard output, under `log.unmapped` with
      `--json`; the validator warns `test_unmapped` at it until its test
      is named (ADR-230).

      `--open-defect <test>`, repeatable, opens a defect for a test that
      failed or errored in the run, with `--severity` and `--phase`
      given: `records/defects/DEF-<n>.yaml`, status reported, reported by
      the run's role on the date of the run's instant, violating the
      requirements the test verifies, or the element the test is about
      when it verifies none, naming the test, observed from the first
      failure's message and expected from the test's then; for the
      acceptance and production phases its environment is the run's, and
      for acceptance its build is the run's version, digest and build.
      Each failed result of that test links the defect. A failure no
      `--open-defect` names opens nothing.

      Refuses, with exit 1 and nothing written, a results file that is
      not under `records/`, cannot be read, is not JUnit XML or holds no
      testcase; an environment, a version or a role the specification
      and its records do not have; a digest not written as sha256: and 64
      hexadecimal digits; an instant not written as RFC 3339 with its
      offset; an `--open-defect` for a test that is not one of the
      specification's or that did not fail in the run, one without
      `--severity` or `--phase`, a severity or phase outside their values,
      an acceptance defect without `--version`, and a test that verifies
      nothing and is about no element. Prints on standard output the
      unmapped lines, then the record's path and the path of each defect
      opened. With `--dry-run` it prints the records it would write and
      writes nothing.
    permission: public
    arguments:
      - name: folder
        description: The folder holding the specification; the record goes into records/test-runs/ beside it.
        required: true
        schema: { type: string }
    options:
      results:
        description: The JUnit XML file of the run, by its path under records/, such as records/evidence/TR-3-junit.xml; it becomes the record's evidence.
        schema: { type: string, minLength: 1 }
      environment:
        description: The environment of the specification the tests ran in.
        schema: { type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$" }
      version:
        description: The version of the build, a release record, planned or released, when the build is one.
        schema: { type: string, minLength: 1 }
      build:
        description: The build that was tested, such as a commit or an image tag with its digest.
        schema: { type: string, minLength: 1 }
      digest:
        description: "The digest of the specification the build was generated from, as sha256: and 64 hexadecimal digits, as the approval record keeps it."
        schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
      at:
        description: When the run started, an instant with its offset as RFC 3339 writes it, such as 2026-11-03T14:05:00+07:00.
        schema: { type: string, format: date-time }
      by:
        description: The role that ran the tests, a stakeholder of the specification.
        schema: { type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$" }
      open-defect:
        description: A test that failed or errored in the run, by name, to open a defect for; repeatable.
        schema: { type: array, items: { type: string, minLength: 1 } }
      severity:
        description: "How badly the defects opened stop the system from meeting its requirements: critical, major, minor or cosmetic."
        schema: { type: string, enum: [critical, major, minor, cosmetic] }
      phase:
        description: "Where the defects opened were found: development, acceptance or production."
        schema: { type: string, enum: [development, acceptance, production] }
      dry-run:
        description: Check everything and write nothing; print each record it would write.
        schema: { type: boolean, default: false }
    reads:
      - { path: "{folder}", description: "The specification and its tests, and the records beside it: the test-run and defect records for the next IDs, and the releases." }
      - { path: "records/<results path>", description: "The JUnit XML file, for its testcases and its SHA-256." }
    writes:
      - { path: "records/test-runs/TR-<n>.yaml", description: "The test-run record, under the next number; refused when a file of that name exists." }
      - { path: "records/defects/DEF-<n>.yaml", description: "One defect for each --open-defect, under the next numbers; refused when a file of that name exists." }
    standardOutput: The errors of an invalid specification; then, when something is missing, one line per missing option saying what to ask; or one unmapped line per testcase that maps to no test, the path of the record written and the path of each defect opened.
    standardError: A usage message on a usage error, the reason a refusal, and one line naming the record written with its counts.
    exitCodes:
      "0": the record is written; a testcase that maps to no test is printed and kept, and does not change the status
      "1": nothing written, since a required option is missing or a value names what the specification and its records do not have, or the results file is refused; or written, while the specification has errors
      "2": usage error, or a file that could not be read or written
    remedies:
      "1": "Read the lines on standard output and the reason on standard error: give each missing option, move the results file under records/, or correct the value named, and run it again."
      "2": "Read the usage message or the reason on standard error, correct the command line or the path it names, and run it again."
    satisfies: [SA-125]
    why: |
      A results file is written by a CI job and thrown away, and with it
      the answer to which requirement was shown met on which build. Kept
      under records/ as the evidence of a record that maps each testcase
      to its test, it ties the run to the requirements and elements the
      tests verify. The command maps by the names the generators write
      and keeps what it cannot map, rather than guessing a test or
      dropping the line, and opens a defect only for a failure the person
      running it names, since a test fails for a flaky host as well as
      for a fault.
    cites:
      - source: iso-29119-3
        clause: "8"
        says: "Actual results, test results and the test execution log are dynamic test documentation items: what was run, when, and with what outcome."
