# Generated by specarch-gen-openapi from ../spec/specarch.yaml, version 0.1.0; meta-model 0.1. Do not edit this file: change the YAML and generate again.
openapi: 3.1.0
info:
  title: Library Lending
  version: 0.1.0
  description: |
    A small public library lends books to its members. Members borrow a copy,
    keep it for a fixed loan period, and pay a late fee when they return it
    after the due date. This example exists to exercise every concept of the
    meta-model in one place, across every stage of the life cycle; it is not
    a real library's system.
paths:
  /books:
    get:
      operationId: listBooks
      summary: Browse the catalogue
      parameters:
        - name: q
          in: query
          description: Free-text search over title and author.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Matching books.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
      security: []
      x-specarch-permission: public
      x-specarch-satisfies:
        - LIB-2
  /loans:
    get:
      operationId: listLoans
      summary: List loans
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/LoanStatus'
        - name: memberId
          in: query
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - dueOn
              - -dueOn
              - loanedAt
              - -loanedAt
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Matching loans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Loan'
                  totalItems:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9007199254740991
                  totalPages:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - items
                  - totalItems
                  - totalPages
      security:
        - bearerAuth: []
      x-specarch-permission: loans.read
    post:
      operationId: createLoan
      summary: Lend a copy to a member
      description: |
        Refused when the member already holds the maximum open loans for their
        tier, has outstanding fees, or the book has no copy available.
      parameters:
        - name: Idempotency-Key
          in: header
          description: Chosen by the client for each new loan, so that a lost answer can be retried without lending twice.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: string
                  format: uuid
                memberId:
                  type: string
                  format: uuid
              required:
                - memberId
                - bookId
      responses:
        "201":
          description: The new loan, with the due date set from the member's tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        "409":
          description: Loan limit reached, fees outstanding, or no copy available.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-specarch-problem: lending-refused
      security:
        - bearerAuth: []
      x-specarch-permission: loans.create
      x-specarch-limits:
        maxRequestBytes: 1024
        rate:
          burst: 60
          per: PT1M
          requests: 30
      x-specarch-emits:
        - loan.lifecycle/LoanCreated
      x-specarch-satisfies:
        - LIB-3
  /loans/{loanId}/lost:
    parameters:
      - name: loanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: reportLost
      summary: Record a lost copy and charge its replacement cost
      responses:
        "200":
          description: The closed loan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        "409":
          description: The loan is already closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-specarch-problem: loan-closed
        "503":
          description: The fee ledger is unavailable, and the loan stays as it was.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-specarch-problem: fee-ledger-unavailable
      security:
        - bearerAuth: []
      x-specarch-permission: loans.return
      x-specarch-emits:
        - loan.lifecycle/LoanLost
  /loans/{loanId}/return:
    parameters:
      - name: loanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: returnLoan
      summary: Record the return of a copy
      responses:
        "200":
          description: The closed loan, with the late fee computed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        "409":
          description: The loan is already closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-specarch-problem: loan-closed
        "503":
          description: The fee ledger is unavailable, and the loan stays as it was.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-specarch-problem: fee-ledger-unavailable
      security:
        - bearerAuth: []
      x-specarch-permission: loans.return
      x-specarch-emits:
        - loan.lifecycle/LoanReturned
      x-specarch-satisfies:
        - LIB-4
        - LIB-5
  /members:
    get:
      operationId: listMembers
      summary: List members
      responses:
        "200":
          description: All members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
      security:
        - bearerAuth: []
      x-specarch-permission: members.read
    post:
      operationId: createMember
      summary: Register a new member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 200
                tier:
                  $ref: '#/components/schemas/MembershipTier'
              required:
                - fullName
                - email
                - tier
      responses:
        "201":
          description: The member, with card number assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        "409":
          description: Email address already registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-specarch-problem: email-taken
      security:
        - bearerAuth: []
      x-specarch-permission: members.write
      x-specarch-satisfies:
        - LIB-1
  /members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMember
      summary: One member with their loans
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        "404":
          description: No such member.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          x-specarch-problem: member-not-found
      security:
        - bearerAuth: []
      x-specarch-permission: members.read
components:
  schemas:
    Book:
      type: object
      description: A title the library owns, with the number of physical copies.
      properties:
        author:
          type: string
          minLength: 1
          maxLength: 200
        copiesAvailable:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
        copiesOwned:
          type: integer
          format: int32
          minimum: 0
        id:
          type: string
          format: uuid
          readOnly: true
        isbn:
          type: string
          pattern: ^[0-9]{13}$
        replacementCost:
          type: string
          format: decimal
          x-specarch-precision: 10
          x-specarch-scale: 2
        title:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - id
        - isbn
        - title
        - author
        - copiesOwned
        - copiesAvailable
        - replacementCost
    Loan:
      type: object
      description: One copy of one book lent to one member for a period.
      properties:
        bookId:
          type: string
          format: uuid
        dueOn:
          type: string
          format: date
          readOnly: true
        id:
          type: string
          format: uuid
          readOnly: true
        lateFee:
          type: string
          format: decimal
          description: Computed by the lateFee algorithm when the copy is returned; zero until then.
          readOnly: true
          x-specarch-precision: 10
          x-specarch-scale: 2
        loanedAt:
          type: string
          format: date-time
          readOnly: true
        memberId:
          type: string
          format: uuid
        returnedAt:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/LoanStatus'
      required:
        - id
        - memberId
        - bookId
        - loanedAt
        - dueOn
        - status
        - lateFee
    LoanStatus:
      type: string
      enum:
        - open
        - overdue
        - returned
        - lost
      x-specarch-valueDescriptions:
        lost: the member reported the copy lost; the replacement cost was charged
        open: the copy is with the member and the due date has not passed
        overdue: the due date has passed and the copy is still out
        returned: the copy is back on the shelf
    Member:
      type: object
      description: A person with a library card.
      properties:
        cardNumber:
          type: string
          description: Printed on the card; assigned when the member joins.
          pattern: ^[0-9]{8}$
        email:
          type: string
          format: email
          description: Encrypted at rest, and found by a salted hash of it, since it must stay unique.
          maxLength: 320
          x-specarch-sensitivity: personal
          x-specarch-atRest: encrypted
          x-specarch-lookup: hash
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          x-specarch-sensitivity: personal
        id:
          type: string
          format: uuid
          readOnly: true
        joinedOn:
          type: string
          format: date
          readOnly: true
        membershipEndsOn:
          type: string
          format: date
          description: The last day the card is valid; set a year after joining and moved on by each renewal.
          readOnly: true
        outstandingFees:
          type: string
          format: decimal
          description: Sum of unpaid late fees and replacement charges, in the library's currency.
          readOnly: true
          x-specarch-precision: 10
          x-specarch-scale: 2
        tier:
          $ref: '#/components/schemas/MembershipTier'
        createdAt:
          type: string
          format: date-time
          description: When the record was created; set by the system.
          readOnly: true
        createdBy:
          type: string
          description: Who created the record; set by the system.
          readOnly: true
        lastModifiedAt:
          type: string
          format: date-time
          description: When the record was last changed; set by the system.
          readOnly: true
        lastModifiedBy:
          type: string
          description: Who last changed the record; set by the system.
          readOnly: true
      required:
        - id
        - cardNumber
        - fullName
        - email
        - tier
        - joinedOn
        - membershipEndsOn
        - outstandingFees
      x-specarch-audited: true
      x-specarch-deletion: soft
    MembershipTier:
      type: string
      enum:
        - standard
        - extended
      x-specarch-valueDescriptions:
        extended: up to 6 open loans, 28-day loan period
        standard: up to 3 open loans, 21-day loan period
    Problem:
      type: object
      description: A problem details object, RFC 9457.
      properties:
        type:
          type: string
          format: uri-reference
          description: The problem type; about:blank when it has none of its own.
        title:
          type: string
          description: A short summary of the problem type, the same for every occurrence.
        status:
          type: integer
          format: int32
          description: The HTTP status code.
        detail:
          type: string
          description: An explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: This occurrence.
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
  x-specarch-problems:
    email-taken:
      status: 409
      title: Email address already registered
      condition: A member with the same email address exists.
    fee-ledger-unavailable:
      status: 503
      title: The fee ledger is unavailable
      condition: The fee ledger failed or did not answer in time, and the loan stays as it was.
    lending-refused:
      status: 409
      title: The copy cannot be lent
      condition: The member holds the most open loans their tier allows, has outstanding fees, or the book has no copy available.
    loan-closed:
      status: 409
      title: The loan is already closed
      condition: The loan was returned or reported lost before.
    member-not-found:
      status: 404
      title: No such member
      condition: No member has the id in the path.
