specarch: "0.1"
info: { title: Member desk, version: 1.0.0 }
stakeholders:
  owner: { description: The product owner. }
entities:
  Member:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      fullName: { type: string, minLength: 1, maxLength: 200 }
    required: [id, fullName]
    primaryKey: [id]
permissions:
  members.read: { description: See members. }
  members.write: { description: Register and remove members. }
roles:
  desk: { description: The desk., permissions: [members.read, members.write] }
paths:
  /members:
    get:
      operationId: listMembers
      summary: The members
      permission: members.read
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Member" } }
    post:
      operationId: createMember
      summary: Register a member
      permission: members.write
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/entities/Member" }
      responses:
        "201":
          description: The member.
          content:
            application/json:
              schema: { $ref: "#/entities/Member" }
  /members/{memberId}:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMember
      summary: One member
      permission: members.read
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema: { $ref: "#/entities/Member" }
    delete:
      operationId: removeMember
      summary: Remove a member
      permission: members.write
      responses:
        "204": { description: Removed. }
pages:
  members-list:
    kind: list
    title: Members
    route: /members
    entity: Member
    permission: members.read
    source: listMembers
    columns: [fullName]
    onSelect: { navigate: member-view, with: { memberId: id } }
    actions:
      - { label: Remove, kind: operation, target: removeMember, then: { message: Member removed. } }
      - { label: Remove and show, kind: operation, target: removeMember, then: { navigate: member-veiw } }
      - { label: Remove and open, kind: operation, target: removeMember, then: { navigate: member-view, with: { id: id } } }
  member-form:
    kind: form
    title: Register member
    route: /members/new
    entity: Member
    permission: members.write
    submit: createMember
    fields: [fullName]
    onSubmitted: { navigate: member-view, with: { memberId: memberid }, message: Member registered. }
  member-view:
    kind: view
    title: Member
    route: /members/{memberId}
    entity: Member
    permission: members.read
    source: getMember
    fields: [fullName]
    onSubmitted: { message: Saved. }
    actions:
      - { label: Register another, kind: navigate, target: member-form, then: { message: Opened. } }
