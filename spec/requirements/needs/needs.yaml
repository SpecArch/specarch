# yaml-language-server: $schema=../../../schema/specarch-fragment-requirements-0.1.schema.json
needs:
  NEED-1:
    statement: I want a specification that cannot quietly be wrong, so that the code built from it is right.
    stakeholders: [specification-author, implementer]
    status: accepted
  NEED-2:
    statement: I want to write a design once and build it in more than one language.
    stakeholders: [implementer]
    status: accepted
  NEED-3:
    statement: I want the documents and diagrams to come from the specification, so they never drift from it.
    stakeholders: [reviewer, specification-author]
    status: accepted
  NEED-4:
    statement: I want a big specification split over many files, each about one thing, so I can find what I am looking for.
    stakeholders: [specification-author, reviewer]
    status: accepted
  NEED-5:
    statement: I want the whole life of the system in one place, from the first requirement to the day it is accepted.
    stakeholders: [reviewer, operator]
    status: accepted
  NEED-6:
    statement: I want to see why something is the way it is, and which standard asks for it.
    stakeholders: [reviewer]
    status: accepted
  NEED-7:
    statement: I want one tool to learn and install, not one program per task.
    stakeholders: [specification-author, ci-job]
    status: accepted
  NEED-8:
    statement: I want to build a specification from the documents and code that exist, without inventing what they do not say, and to see at every step what is still missing and what can already be made.
    stakeholders: [specification-author, reviewer]
    status: accepted
  NEED-9:
    statement: I want the tests a specification implies, with the ones that matter most written first and the rest listed with the reason they were left out.
    stakeholders: [specification-author, implementer]
    status: accepted
