# yaml-language-server: $schema=../../../schema/specarch-fragment-design-0.2.schema.json
decisions:
  ADR-141:
    title: A gateway that forwards by a token claim is a design element of its own under gateways, after RFC 9110's gateway, with the token it verifies, the claim it reads, the dependency each value selects, its own refusals and no permission, and its forwards fix the token's audience
    status: proposed
    date: "2026-10-19"
    context: |
      docs/gateway.md, ask 1. A service in front of an estate's services
      registers routes only for its health and its metrics, and forwards
      every other request, whatever its method and path, to the service
      the bearer token's audience names, after verifying the token's
      signature against the issuer's keys. The meta-model could not hold
      it: an entry under paths is one method on one path with a
      permission and a handler, a path parameter holds one segment, and
      the readers set a catch-all aside with a line, so the behaviour the
      service exists for was missing from its specification, and the
      table of services was listed by gaps as a surface not read.
    decision: |
      The design gains gateways, a section keyed by a camelCase name,
      each a description; token, the key under tokens of the token the
      gateway verifies, with the word and meaning an operation's token
      has; claim, the name of a claim that token declares, whose value
      selects the service; forwards, a list of rows, each a value, the
      claim's value, and a dependency, the key of a dependency of kind
      system or identityProvider the request is forwarded to as received;
      calls, the dependencies called besides the forwards, the identity
      provider whose keys it fetches among them; middlewares, as an
      operation's; and refusals, what the gateway answers itself, in a
      middleware's form. A gateway names no permission and the schema has
      no key for one. It forwards every request no operation under paths
      answers; a path it must not forward is an operation that answers
      it, closed with nobody when nobody may reach it. A claim whose
      value is a list selects a service when exactly one of its values is
      a forward's, and is refused when two are.

      The validator, in both builds, reports as the rule gateway at the
      entry a token not declared, a claim the token does not declare, an
      empty forwards, a value twice, a dependency not declared or of kind
      database, messageBroker or fileStore, a forward's dependency under
      calls, and, when the claim is aud, the token marked default or named
      by an operation. token_audience (ADR-109) treats the aud of a token
      a gateway forwards by aud as fixed by the forwards and refuses const
      or enum on it. ADR-097's one default is counted among the tokens no
      gateway forwards by aud: a specification whose every token is
      forwarded, as a gateway module with only its health and its metrics
      is, declares no default, its operations accept no token, as those of
      a specification with no tokens do, and generate openapi writes no
      bearer scheme for it; a gateway module whose own operations accept a
      token declares and defaults that token as ADR-097 has it.
      middleware, middleware_missing, dependency and problem
      reach a gateway as they reach an operation; link_missing (ADR-137)
      gains the gateway's forwards and calls, and the implementation
      schema's designRef admits gateways so a package implements one and
      the server that runs the package runs it. In the umbrella run, a
      token a gateway forwards by aud is left out of the refusal of two
      modules accepting one aud value, and gateway reports a forward
      whose value is none of the aud values the module its dependency's
      specification names accepts, when that module is given; a module
      not given leaves the forward unresolved, no error.

      The derived cases, with the gateway a subject of tests: forwarded
      to <dependency> per forward; refused with no token, refused with a
      bad signature, denied with expired <token>; refused with an unknown
      <claim>; refused with a <claim> naming two forwarded services; and
      dependency fails <name> and dependency times out <name> for every
      dependency forwarded to or called. The technical specification's
      chapter 3 draws the gateway's edges in the context diagram, chapter
      6 gains a section per gateway with a sequence diagram of one
      forwarded request, the test plan lists its cases, and generate
      openapi writes nothing for it and prints a line naming it.
    why: |
      The word is RFC 9110's, section 3.7: a gateway, also a reverse
      proxy, is an intermediary that acts as an origin server for the
      outbound connection and forwards received requests inbound to
      another server or servers; upstream was not taken because the RFC
      gives it a direction that changes with the message, backend because
      it is a product's word, and proxy because ADR-136 gives it to a
      server in front of a service. claim is RFC 7519's. A section of its
      own rather than a catch-all operation under paths because OpenAPI
      has no catch-all, a path parameter holds one segment, and an
      operation must name a permission the gateway does not check.

      The table is design because a client must know which audience to
      ask the issuer for (RFC 8707's resource parameter) and what a wrong
      one is answered with; where each service is in an environment is a
      deployment's fact, a server with dependency per deployment
      (ADR-136), and the setting the code reads is declared as every
      setting is. The issuer is said by iss with const on the token, RFC
      8414's issuer identifier, and the algorithm by the token's signature
      (ADR-097, RFC 8725 section 3.1), so no issuer or keys key is added;
      where the keys are, the issuer's jwks_uri, is a deployment's fact.
      The identity provider is what the gateway calls, so the context
      diagram and the link check see it with no special case.

      No permission, and still fail-closed (SA-5): the gateway decides
      nothing and answers no request of its own, the service it forwards
      to checks the permission of every path as it would without the
      gateway, and the gate is a token the issuer signed for a service
      the table holds; a request without one is refused, and the derived
      cases make that a test. The caller-context's rule that every hop's
      route has a permission is about a hop with routes of its own; a
      gateway has none, and it is no hop of the delegation chain either,
      since it presents nothing of its own.

      The forwards fix the audience because RFC 7519, section 4.1.3, is
      met the way a gateway meets it: the principal processing the token
      identifies itself with a value in aud, and the gateway identifies
      itself with every value in its table on the services' behalf, while
      each service still checks that aud names itself (RFC 9068, section
      4). Writing the enum on the claim beside the table would say one
      list twice and give the validator a disagreement to report, which
      the Low IQ Tax forbids; const or enum on that aud is refused as aud
      on a Txn-Token is (ADR-109). The one-default rule leaves the
      forwarded token out because ADR-097's reason for it, that a service
      accepts one token nearly everywhere, does not hold for a gateway
      whose own operations accept none, and a second token declared only
      to carry default would be a placeholder. The umbrella's
      one-audience refusal would otherwise refuse every gateway, since
      its forwards are the audiences of the modules it fronts; leaving
      its token out and
      checking that each value is an audience the module accepts turns
      the false refusal into the check a reader cannot do by eye. The
      refusals are written and not
      derived because the statuses are the project's choice, 404 or 403
      for an unknown audience. A prefix or a method list is left out
      because paths already carves the space and no system asked for a
      partial gateway; the shape admits them.

      The compiler test holds: a file with no gateways, and a token with
      no gateway, read and render as before; a wrong row is an error at
      the row and the section still draws the other forwards. The
      acceptance test holds: the gateway's section is the first page the
      services' teams read, and a remark on it changes one row. The
      element stacks on 0.3's step 4 (tokens) and the diagram keywords'
      items 2 and 4, so its build item follows them.
    consequences: |
      The design schema, its fragment schema and the Swift embed gain
      gateways; the implementation schema's designRef admits gateways;
      the rule gateway is new, token_audience and link_missing grow, in
      both builds, with cases; derive gains the cases and the rank table
      a row; document techspec draws the edges and the section, the test
      plan the rows, generate openapi the line; the convention's section
      and origin rows are added; the library estate gains a gateway
      module. The forward table's reader is ADR-142, the Go reader's
      fixes ADR-143.
    satisfies: [SA-75]
