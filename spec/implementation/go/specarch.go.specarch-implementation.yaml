# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.5.0/schema/specarch-implementation-0.1.schema.json
specarchImplementation: "0.1"

info:
  title: SpecArch toolchain in Go
  version: 0.1.0
  description: |
    The Go implementation of the specification in `spec/`: one static binary,
    `specarch`, installed with `go install ./cmd/specarch`.

implements:
  file: ../../specarch.yaml
  version: 0.6.0-dev

stack:
  language: { name: Go, version: "1.27" }
  toolchain: { name: go, version: "1.27.2", description: The minimum in go.mod. CI builds with the latest stable release. }
  platforms: [darwin/arm64, darwin/amd64, linux/amd64, linux/arm64, windows/amd64]

libraries:
  github.com/santhosh-tekuri/jsonschema/v6:
    version: v6.0.3
    licence: Apache-2.0
    purpose: JSON Schema 2020-12 validation against the schemas in `schema/`; the same library the repository's pinned `jv` check used.
  golang.org/x/text:
    version: v0.42.0
    licence: BSD-3-Clause
    purpose: Message printing for the schema library. Pinned above 0.39.0, which fixes GO-2026-5970.
  go.yaml.in/yaml/v3:
    version: v3.0.5
    licence: MIT AND Apache-2.0
    purpose: YAML parsing into a node tree, which keeps the line of every value for diagnostics.
  cel.dev/cel-go:
    version: v0.32.0
    licence: Apache-2.0
    purpose: The CEL parser; only its parser is used.
  cel.dev/expr:
    version: v0.25.1
    licence: Apache-2.0
    purpose: CEL's expression tree types, needed by the parser.
  github.com/antlr4-go/antlr/v4:
    version: v4.13.1
    licence: BSD-3-Clause
    purpose: The parser runtime the CEL grammar is generated for.
  google.golang.org/protobuf:
    version: v1.36.10
    licence: BSD-3-Clause
    purpose: Needed by the CEL parser's tree types.
  google.golang.org/genproto/googleapis/api:
    version: v0.0.0-20240826202546-f6391c0de4c7
    licence: Apache-2.0
    purpose: Needed by the CEL parser's tree types.
  google.golang.org/genproto/googleapis/rpc:
    version: v0.0.0-20240826202546-f6391c0de4c7
    licence: Apache-2.0
    purpose: Needed by the CEL parser's tree types.
  golang.org/x/exp:
    version: v0.0.0-20240823005443-9b4947da3948
    licence: BSD-3-Clause
    purpose: Needed by the CEL parser.

layout:
  cmd/specarch:
    description: The command line. Argument handling, finding the specifications under folders, running plug-ins, printing the diagnostics and the exit status.
    implements: ["#/commands/validate", "#/commands/gaps", "#/commands/document", "#/commands/approve", "#/commands/generate", "#/commands/extract", "#/commands/merge", "#/commands/diff", "#/commands/derive", "#/commands/idioms", "#/commands/idioms diff", "#/commands/version", "#/entities/SpecFile", "#/entities/GeneratedFile", "#/algorithms/exitStatus", "#/algorithms/checkStatus"]
  schema:
    description: The JSON Schemas, embedded into the binary from the files editors use.
  idioms:
    description: The shipped idioms, one folder per concern, embedded into the binary; a release fixes the set.
  internal/extract:
    description: "The readers of specarch extract: the commit read (git, run with no user or system configuration), the outline, database, router, documents, OpenAPI, permissions, pages and workflows readers, the Go reader on the standard library's go/parser with dxlib's registration calls and the rule that maps dxlib_module's privilege names, the Swift reader of a code-facts dump with the property lists, build settings and Core Data models it reads as data, the subset of TypeScript a page schema is read in, the subset of BPMN 2.0 a workflow is read in, the check of a dump against the commit it names, the translation of SQL checks into the expression subset, and the tree writer; and the merge of their trees, with the newest commit of a repository read at several found by git's ancestry, a requirement that gives a number of days joined to the one check that names it, a question another tree answers, by giving a key or an element the asking tree gives only by name, or a question kept before it asks left out, the name a question gives written at the key it blocks once another tree declares it, a placeholder source reported, a permission granted and checked by nothing reported, and an operation a printed and a parsed tree do not both give asked about."
  internal/source:
    description: Reads a YAML file into a node tree and a plain value, with the line of every node; finds unquoted dates and duplicate keys.
  internal/spec:
    description: Reads a specification from disk, the root file and the stage folders, and merges it into one document in which every node remembers its file; reports the layout problems.
  cmd/specarch-gen-sql:
    description: The plug-in behind generate sql. Reads the request on standard input, answers the migration and the snapshot on standard output, and never touches the disk.
    implements: ["#/commands/generate"]
  internal/gensql:
    description: The SQL migrations in four dialects, each column through the type-rendering idiom, with check expressions translated per dialect, the views after the tables, and a snapshot of the schema; an entity or view another stakeholder owns gets no statement, and the snapshot lists it as owned.
  internal/ownership:
    description: Reads the ownedBy marks of an implementation file's mappings, which every generator that builds code or data follows by leaving the owned elements out.
  internal/mark:
    description: The rule every generator plug-in places the request's problems by, at the deepest entry its output shows, a question at what it blocks and a target's own problem where the whole output is marked, and the mark's text each target writes in its comment form.
  internal/typerows:
    description: Matches a field to a row of a type rendering, for the validator and the generators alike.
  cmd/specarch-gen-openapi:
    description: The plug-in behind generate openapi. Reads the request on standard input, answers the OpenAPI document on standard output, and never touches the disk.
    implements: ["#/commands/generate"]
  internal/genopenapi:
    description: The OpenAPI 3.1 document in the standard dialect, the design field for field, with the problem catalogue and lists paged through the paginated-list idiom; and in the dxlib dialect, what dxlib's reader binds.
  cmd/specarch-gen-go-dxlib:
    description: The plug-in behind generate go-dxlib. Reads the request on standard input, answers the Go file on standard output, and never touches the disk.
    implements: ["#/commands/generate"]
  cmd/specarch-gen-bpmn:
    description: The plug-in behind generate bpmn. Reads the request on standard input, answers each workflow's BPMN file and SVG on standard output, and never touches the disk.
    implements: ["#/commands/generate"]
  internal/genbpmn:
    description: Each workflow as a BPMN 2.0 process in the subset extract workflows reads, with BPMN DI laid out by a fixed rule, the same diagram as SVG, and the problems marked as XML comments before their elements.
  cmd/specarch-gen-ui:
    description: The plug-in behind generate ui. Reads the request on standard input, answers the screens on standard output, and never touches the disk.
    implements: ["#/commands/generate"]
  internal/genui:
    description: The list pages for the web in plain JavaScript, the events they raise, and the theme as CSS custom properties.
  cmd/specarch-gen-ui-typescript:
    description: The plug-in behind generate ui for an implementation file in TypeScript. Reads the request on standard input, answers the screens on standard output, and never touches the disk.
    implements: ["#/commands/generate"]
  internal/genuits:
    description: The task, list and form pages and the views for the web on Next.js and Carbon, with child rows, actions that run an operation after a confirmation and its reason, forms that start an approval and inboxes, each a schema of data and a thin page.tsx, a client file that hands on the hooks a project writes, the guard and the menu from one decision, the derived tests, the components that read the schemas, the strings in every language the settings name with the check that each key has an entry, the server routes that forward the operations the pages call with the session's token, and the theme over Carbon's through the design-tokens idiom, drawn through the ui-components idiom's names.
  internal/gendxlib:
    description: The Go file of a service on dxlib, its tables, handlers, seeds and tasks, read from the design through the dxlib dialect's names and types.
  cmd/specarch-gen-tests-go:
    description: The plug-in behind generate tests for a Go implementation file. Reads the request on standard input, answers the Go test file on standard output, and never touches the disk.
    implements: ["#/commands/generate"]
  cmd/specarch-gen-tests-swift:
    description: The plug-in behind generate tests for a Swift implementation file. Reads the request on standard input, answers the Swift Testing file on standard output, and never touches the disk.
    implements: ["#/commands/generate"]
  cmd/specarch-gen-tests-dart:
    description: The plug-in behind generate tests for a Dart implementation file, a Flutter app's included. Reads the request on standard input, answers the Dart library and test file on standard output, and never touches the disk.
    implements: ["#/commands/generate"]
  internal/gentests:
    description: The tests a specification implies, as the three test plug-ins write them. The specification is read once into a model of tests and worked examples, and written in Go, in Swift for Swift Testing, or in Dart for package:test or flutter_test, each with the Harness the project implements beside it; design tests become tests through it, worked examples unit tests of the algorithm's mapping.
  internal/semver:
    description: Semantic Versioning 2.0.0 versions, their precedence, and the step one needs from another, with the step before 1.0.0; the release rules and diff measure a release with it.
  internal/diff:
    description: Compares two merged specifications element by element, finds the public interface, and classifies each difference by the version step it needs.
  internal/approval:
    description: The approval record beside a specification, its digest of the specification's files, and where a version's approval stands against the files now.
  internal/expr:
    description: The expression subset. Parses with the cel-go parser, refuses what is outside the subset, type-checks with CEL's strict rules, and evaluates with exact integers and decimals.
  internal/generate:
    description: The document targets. techspec writes the arc42 document and its Mermaid diagrams and rewrites the regions between markers in hand-written Markdown; requirements, testplan, traceability, deployment and commissioning write the other documents; questions writes the open questions and what they hold up, the text gaps prints. Every one renders why as an Insight, each citation as a Note, an element's origin as an Origin line and the open questions about it as Open question paragraphs.
    implements: ["#/algorithms/markersWellFormed"]
  internal/problems:
    description: The problems of a specification, valid or not, gathered from validate's diagnostics and the open questions into one list with ids, columns and notes, written as problems.txt and as a SARIF 2.1.0 log, and marked above their entries in the YAML files of the specification.
    implements: ["#/entities/Problem", "#/entities/ProblemNote", "#/enums/ProblemSeverity"]
  internal/validate:
    description: Schema validation with plain messages, the interface boundary, cross-references across the tree, fail-closed access, concrete integers, expressions, worked examples, tests and their derived cases with the rank of each and the cases left out, the life-cycle links and traceability warnings, the open questions and what they cover, origin, implementation references, and the records beside the specification.
    implements: ["#/entities/Diagnostic", "#/enums/Rule", "#/enums/Severity", "#/algorithms/referenceResolves", "#/algorithms/permissionGranted", "#/algorithms/workedExampleHolds"]

mappings:
  "#/entities/Diagnostic": { target: validate.Diagnostic, description: "A struct; `String()` prints the one-line form." }
  "#/entities/SpecFile": { target: main.input, description: "A root folder, an implementation file or a file given by name; the versions are read where they are checked." }
  "#/enums/Rule": { target: validate.Rule, description: "A string type with one constant per value; validate.Rules lists them, and a test checks they equal the design's enum." }
  "#/enums/Severity": { target: validate.Severity }
  "#/entities/Problem": { target: problems.Problem, description: "A struct; `String()` prints the problem line, and its notes follow it." }
  "#/entities/ProblemNote": { target: problems.Note, description: "A struct inside its problem, in order; `String()` prints the note line." }
  "#/enums/ProblemSeverity": { target: problems.Severity }
  "#/commands/validate": { target: main.runValidate }
  "#/commands/gaps": { target: main.runGaps, description: "Prints generate.Questions, the text the questions document target writes." }
  "#/commands/approve": { target: main.runApprove, description: "Writes the record through the approval package after checking the documents with generate.Document." }
  "#/commands/version": { target: main.runVersion }
  "#/commands/document": { target: main.runDocument }
  "#/commands/generate": { target: main.runGenerate, description: "Refuses through main.gate while a question blocks what the target reads or the approval is missing or void; then runs the plug-in with main.runPlugin; the request and answer are the pluginRequest and pluginResponse structs." }
  "#/commands/extract": { target: main.runExtract, description: "Runs the reader of the source, extract.Outline, extract.Database, extract.Router or extract.Documents, after extract.Open has named the commit read and refused what no commit names; extract.Tree writes the tree from ordered YAML nodes." }
  "#/commands/merge": { target: main.runMerge, description: "Loads each tree with spec.Load and refuses one validate.CheckSpec reports an error in; extract.Merge joins the sources, the elements and the questions, and extract.Tree writes the result." }
  "#/commands/derive": { target: main.runDerive, description: "Writes validate.Drafts, the drafts of the cases the warnings name." }
  "#/commands/idioms": { target: main.runIdioms, description: "Prints validate.IdiomUses, the idioms each implementation file resolves to." }
  "#/commands/idioms diff": { target: main.runIdiomsDiff }
  "#/commands/diff": { target: main.runDiff, description: "Lists diff.Compare's changes, then checks the release record beside the new folder." }
  "#/enums/DocumentTarget": { target: main.documentTargets }
  "#/enums/GeneratorTarget": { target: main.builtGenerators, description: Empty; every target is a plug-in. }
  "#/entities/GeneratedFile": { target: main.planned, description: "A path and the content a target wants there; --check compares it with the disk." }
  "#/algorithms/checkStatus": { target: main.checkPlan }
  "#/algorithms/markersWellFormed": { target: generate.RewriteMarkers }
  "#/algorithms/exitStatus": { target: the end of main.runValidate }
  "#/algorithms/workedExampleHolds": { target: validate.checker.checkExample }
  "#/algorithms/permissionGranted": { target: validate.checker.checkAccess }
  "#/algorithms/referenceResolves": { target: the validate.checker.check... methods for each kind of reference }

targets:
  techspec:
    output: ../../../docs
    description: SpecArch's own technical specification, written from the specification and this file, and kept current by CI.
  requirements:
    output: ../../../docs
    description: The requirements specification, kept current by CI.
  testplan:
    output: ../../../docs
    description: The test plan and test cases, kept current by CI.
  traceability:
    output: ../../../docs
    description: The traceability matrix, kept current by CI.
  deployment:
    output: ../../../docs
    description: The deployment guide, kept current by CI.
  commissioning:
    output: ../../../docs
    description: The commissioning procedure and sign-off sheet, kept current by CI.
  questions:
    output: ../../../docs
    description: The open questions and what they hold up, kept current by CI.
  problems:
    output: ../../../docs
    description: Every error, warning and open question, as problems.txt and problems.sarif, kept current by CI.
  changes:
    output: ../../../docs
    description: The change and defect register, from the records beside the specification, kept current by CI.
  releases:
    output: ../../../docs
    description: The release notes, from the records beside the specification, kept current by CI.

bindings:
  cli:
    framework: standard library
    description: "Hand-written argument handling over `os.Args`; three commands do not justify a CLI library."

tasks:
  build: { run: go build ./..., ci: true }
  test: { run: go test ./..., ci: true }
  vet: { run: go vet ./..., ci: true }
  vulncheck: { run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./..., ci: true }
  validate-specs:
    run: go run ./cmd/specarch validate spec examples
    description: The validator checks its own specification and every example.
    ci: true
  documents-current:
    run: for target in techspec requirements testplan traceability deployment commissioning questions; do go run ./cmd/specarch document $target --check spec examples || exit 1; done
    description: The committed technical specifications match their specifications.
    ci: true
  install: { run: go install ./cmd/specarch }
  sbom:
    run: syft dir:. -o syft-json=sbom.json && grype sbom:sbom.json && osv-scanner scan source -r .
    description: Run on every dependency change; the result goes in the commit message.

testing:
  framework: go test
  run: go test ./...
  platforms: [linux/amd64, darwin/arm64]
  fixtures: The conformance suite is the tests stage of the specification, `spec/tests/`; each test folder holds the design test, the case's arguments and output in `case.yaml`, the input files and the expected output. The Go tests read it and add none of their own.
  mocks: None. Every test runs the real program on real files.
  suites:
    conformance:
      description: |
        Runs every test folder of `spec/tests/` that has a `case.yaml`
        through the program's own entry point, in a copy of that folder,
        and compares the exit status, the standard output and every file
        written with the case's expected/ folder. It also checks that every
        test of a command has a `case.yaml` and that the validator's rules
        are exactly the specification's Rule enum.
      run: go test ./cmd/specarch
      level: system
      designTestsOf:
        - { command: validate }
        - { command: gaps }
        - { command: document }
        - { command: approve }
        - { command: generate }
        - { command: extract }
        - { command: merge }
        - { command: idioms }
        - { command: idioms diff }
        - { command: version }
      ci: true
    shipped-idioms:
      description: Checks every shipped idiom against the idiom schema, that each is named after its file, and that it cites only the sources it declares.
      run: go test ./internal/validate
      level: unit
      implementationOnly: true
      ci: true
    generated-sql:
      description: Renders the library lending example on all four dialects and checks the column types, checks, defaults, encrypted columns and foreign keys each must have; the key-width and unwritable-check refusals; the snapshot on a second run; and the views on each dialect, their counts of softly deleted records, no column for rows and no SQL view for a view of rows only, and their drop and create around a change of an entity they read; and an owned entity given no table, keeping its foreign keys and listed in the snapshot.
      run: go test ./internal/gensql
      level: unit
      implementationOnly: true
      ci: true
    generated-openapi:
      description: Generates the library lending example's OpenAPI document and checks it parses, pages its list through the idiom, answers its refusals with problem documents and carries the audit fields; that a list by POST takes its paging in the body; the views as read-only schemas in both dialects, a path through an optional relation allowing null, a count as a 64-bit integer and rows as a required read-only array of the relation's target; the owned entities and operations left out; and the dxlib dialect's document, which dxlib's own reader reads and validates when SPECARCH_DXLIB names a dxlib checkout, as on the owner's Mac, and is skipped without one, as in CI.
      run: go test ./internal/genopenapi
      level: unit
      implementationOnly: true
      ci: true
    generated-ui:
      description: Generates the library lending example's screens and checks they are the files committed in the example, the loans list among them written by hand first; and refuses a target that is not plain JavaScript for the web, one without a language, and a filter the list's operation cannot take; and leaves out a page another stakeholder owns.
      run: go test ./internal/genui
      level: unit
      implementationOnly: true
      ci: true
    generated-go-dxlib:
      description: Generates the dxlib fixture's Go file and checks it holds the tables, the handlers with their standard operations and checks, the seeds without public and the task; that a list over a view sets the table's list view and two views of one entity are refused; that an owned operation gets no handler and an owned job no task while the table handles stay; and compiles it against dxlib beside stub bodies and jobs when SPECARCH_DXLIB names a dxlib checkout, and is skipped without one, as in CI.
      run: go test ./internal/gendxlib
      level: unit
      implementationOnly: true
      ci: true
    generated-tests:
      description: Generates the tests of the library lending example in Go, Swift and Dart and compiles them beside a harness that does nothing (go vet; swift build when a Swift 6 toolchain is on PATH; dart analyze, against a stand-in for each framework, when dart is), so a generated file that would not compile in a project fails here.
      run: go test ./internal/gentests
      level: unit
      implementationOnly: true
      ci: true
    generated-screens:
      description: Unit tests of the Next.js and Carbon screens' generator, for what the conformance cases reach only through whole runs; every key of the screens' own texts a component names has a text, and a translation that misses a key, drops a placeholder or lacks its file fails while one that keeps a key no screen uses is warned of.
      run: go test ./internal/genuits
      level: unit
      implementationOnly: true
      ci: true
    expressions:
      description: Unit tests of the expression package, for cases the conformance suite reaches only indirectly (rounding, floor and ceil of negative decimals, integer overflow).
      run: go test ./internal/expr
      level: unit
      implementationOnly: true
      ci: true

decisions:
  ADR-101:
    title: Go, one static binary
    status: accepted
    date: "2026-10-07"
    context: The validator must be installable by anyone with one command and run in CI without a runtime.
    decision: Go. `go install` builds it from source; the binary has no runtime dependency.
    consequences: The schema library is a Go module. Document targets are Go too, in the same binary; code targets are plug-ins in any language.
  ADR-102:
    title: santhosh-tekuri/jsonschema as the schema library
    status: accepted
    date: "2026-10-07"
    context: |
      `jv`, the command of this library, is a common way to check a file
      against the schemas alone. Using the same library means a file passes
      the schema check in both.
    decision: |
      Use `github.com/santhosh-tekuri/jsonschema/v6` with format assertion
      on, and require `golang.org/x/text` v0.42.0 so GO-2026-5970 (fixed in
      0.39.0) is not in the build.
    consequences: The same files pass as with `jv`. The schemas are embedded and registered under their `$id`, so validation needs no network.
  ADR-103:
    title: The CEL parser from cel-go, with SpecArch's own checker and evaluator
    status: accepted
    date: "2026-10-07"
    context: |
      The design fixes expressions as a subset of CEL with exact numbers.
      A parser of SpecArch's own could drift from CEL's syntax without
      anyone noticing. CEL's own evaluator works in binary floating point
      and would get money wrong.
    decision: |
      Parse with the parser of `cel.dev/cel-go`, so every accepted
      expression is real CEL syntax. Walk the tree it returns and refuse
      every node outside the subset. Type-check and evaluate with code of
      our own, using `math/big.Rat` for every number; a number literal's
      exact text is read back from the source, not from the parser's
      float.
    consequences: |
      The parser brings ANTLR, protobuf and their support modules into the
      build; each is listed under libraries with its licence and scanned.
      Parser errors are rewritten into one plain sentence.
  ADR-104:
    title: The YAML node tree, not decoding into structs
    status: accepted
    date: "2026-10-07"
    context: Every diagnostic needs the line of the value it is about.
    decision: |
      Parse with `go.yaml.in/yaml/v3` into `yaml.Node`, keep the tree for
      lines, and convert it to plain values by tag for the schema check.
      It is the maintained successor of the archived `gopkg.in/yaml.v3`.
    consequences: Rules walk the node tree directly. A date without quotes is caught by its tag before the schema check.
