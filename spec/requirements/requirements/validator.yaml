# yaml-language-server: $schema=../../../schema/specarch-fragment-requirements-1.0.schema.json
requirements:
  SA-1:
    statement: specarch validate shall check every specification and implementation file given against the JSON Schema of its kind and meta-model version.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A file that breaks the schema is reported with rule schema, its file, line and YAML path.
      - A file that passes the schema and every other rule produces no output and status 0.
    verification: test
    needs: [NEED-1]
    why: The schema is the one definition of a file's shape; checking it first means every later rule can assume the shape.
  SA-2:
    statement: Every reference inside a specification shall resolve to an object of the right kind in the same specification, wherever its file is in the tree.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A misspelt relation target, enum, operation, page, algorithm, decision, requirement, need, stakeholder, source or environment is reported with its own rule, naming the file and line of the reference.
      - A name defined in two files of the specification is reported with both files.
      - An operation, command or page's enabledBy that is not a setting of configuration, or names one that is not boolean, is reported as setting; a valid one derives the case disabled by <setting>, the element refused with the setting off.
    verification: test
    needs: [NEED-1, NEED-4]
  SA-3:
    statement: Every check constraint, condition of a unique constraint and formula shall parse and type-check in the fixed expression language.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An expression outside the subset is refused with a message naming the construct.
      - An expression that mixes types without a written conversion is refused with the conversion to write.
      - A unique constraint's where is an expression over the entity's fields that gives true or false, like a check; a where on a check constraint is refused.
    verification: test
    needs: [NEED-1]
  SA-4:
    statement: Every worked example's formula, evaluated on its inputs with exact arithmetic, shall give its expected value.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An example whose expected value is off by one cent is reported with the computed value.
    verification: test
    needs: [NEED-1]
  SA-5:
    statement: Access shall be fail-closed; every permission used is declared, and every declared permission is granted by a role or is public.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An operation, command or page without a permission is a schema error.
      - A permission no role grants is reported, also when it has no description; only a must question that blocks the permission itself covers it.
      - A separation-of-duties set names two or more declared permissions, none of them public, and a cardinality from 2 to the number it names; a role that grants that many of the set is refused (separation_of_duties), and the techspec lists, for each set, the combinations of roles that together reach it, as roles never to be given to one person.
    verification: test
    needs: [NEED-1]
  SA-6:
    statement: Every problem shall be reported, one line each, with file, line, YAML path and rule; the exit status is 0 when valid, 1 when invalid, 2 on a usage or read error.
    kind: interface
    priority: must
    status: accepted
    acceptance:
      - A run on a folder with three problems in two files prints three lines and exits 1.
      - A run with no arguments prints how to use the command and exits 2.
    verification: test
    needs: [NEED-1]
    cites:
      - source: go-tool
        says: "The Go tools print one problem per line as file:line, which editors and CI already parse."
  SA-9:
    statement: A specification and its implementations shall be separate files; a specification holds no stack-specific key and an implementation file adds no design.
    kind: constraint
    priority: must
    status: accepted
    acceptance:
      - A stack-specific extension key in a specification is reported as stack_key.
      - A design keyword in an implementation file is reported as design_key.
    verification: test
    needs: [NEED-2]
  SA-10:
    statement: An implementation file's implements and pointers shall resolve in the specification it names, at the same version.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An implementation written against an older version of its specification is reported as implements.
      - A pointer to an object the specification does not have is reported as design_ref.
    verification: test
    needs: [NEED-2]
  SA-51:
    statement: specarch shall list every problem of a specification, valid or not, in one problems file and its SARIF 2.1.0 form, each error, warning and open question with a stable id, file, line and column, JSON pointer, rule, a message saying how to fix it, and notes at the sources it came from and the entries it blocks, and every file specarch writes shall mark the entry a problem touches.
    kind: interface
    priority: must
    status: accepted
    acceptance:
      - "specarch document problems on a specification with an error, a warning and a must question writes problems.txt with one line each in the form file:line:column: severity: pointer: rule: message [id], sorted by file and line, the question followed by a note at each source it cites and each entry it blocks, and exits 1."
      - The same run writes problems.sarif, a SARIF 2.1.0 log with the same results, the question as kind open and level none, and each id as a partial fingerprint; a second run writes the same bytes.
      - A specification with no problem gets a problems file that says so.
      - A fragment with one entry that does not parse reports one yaml_syntax error at that entry's line and pointer, keeps its other entries, and reports no reference to the broken entry's name; an implementation file with a broken entry still names the problems file's folder.
    verification: test
    needs: [NEED-1, NEED-8]
    why: People fix a specification the way they fix code, from a compiler's list of problems, one place at a time; a tool that refuses an invalid specification, or lists errors and questions in different places, hides what the author has to fix.
    cites:
      - source: sarif
        clause: result
        says: "A result names its rule, its kind and level, its locations, and partial fingerprints that recognise it in a later run."
  SA-74:
    statement: specarch model shall print, in both builds, one JSON document in RFC 8785's canonical form that holds, for every specification of the folders given, the merged document, every node's file, line and column, every resolved reference with the keyword that made it, the layout problems, and each implementation file and estate, so that a program reads a specification as specarch does without a loader of its own.
    kind: interface
    priority: must
    status: accepted
    acceptance:
      - specarch model on a folder with a valid specification prints one JSON document whose positions name, for every entry the problems file could name, the file, line and column the problems file would report, and whose references list every satisfies, verifies, $ref, target, permission, emits, calls, decidedIn and implements link with its from, to and through; the Go build and the Swift build print the same bytes.
      - A folder with a layout problem is printed with that problem in the problems file's form and exit status 0; a folder with no specification, or one that cannot be read, is exit status 2 and the reason on standard error.
      - The validator's errors, warnings and open questions are not in the document; the problems file is their one list.
    verification: test
    needs: [NEED-3, NEED-7]
    why: An editor or any other program that draws from a specification would otherwise load the files itself, a second loader in another language that drifts from the first; one command in both builds, printing one byte form, gives it what specarch reads and lets the conformance suite hold the two builds to the same document.
  SA-95:
    statement: specarch shall read every file by the version its version line declares, 1.0.0 and any later 1.0 patch, and every earlier version beside it (0.3, 0.2 and 0.1 of the meta-model, 0.1 of the other formats), each earlier version with a warning naming specarch upgrade; a version line it does not read shall be an error at the line, the file read as 1.0.0 so that every other problem is still listed; and a key meta-model 1.0.0 renamed shall be read under its old spelling as its replacement, with a warning, until 2.0.0.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A specification that says specarch "1.0.0", or a later 1.0 patch such as "1.0.4", validates with the output the same file gives on "0.3" less the version warning, in both builds.
      - A specification that says "1.2.0", "1.0" or what is no version is reported with meta_model_version at the line, naming the versions read, the three-part spelling for a short one, and that a later specarch reads a later one, with every other problem of the file still listed.
      - A file on 1.0 that gives a role's rows or the handover's source is warned with meta_model_deprecated at the key, naming rowPolicies or sourceDelivery and specarch upgrade, and is read as the new key; one that gives both spellings in one object is an error at the old key.
      - A file on 0.3 or earlier is checked against the 0.3 schema and keeps its rules and its output, the rows rule named row_policies.
      - specarch upgrade, in both builds, moves a specification and every file it is read from to 1.0.0, editing only the version lines, the editor hints and the renamed keys and leaving every other byte as it was; with --dry-run it prints each change and writes nothing; it lists each step left to the author, an error the move brings, a key given under both spellings or a file the parser cannot read, as a problem line and exits 1, and a second run changes nothing.
      - An implementation file, a record, an idiom and an estate say their own format's version, 1.0.0 or a later 1.0 patch, or 0.1 beside it, each checked against its version's schema; a version line of theirs the program does not read is an error at the line, and the file is still read as 1.0.0; specarch version names every format's versions.
    verification: test
    needs: [NEED-1, NEED-7]
    why: A file's version line is its promise of which rules it is written against (ADR-055); reading every version side by side keeps every specification that exists valid while the format moves on, and an author learns from one warning what moves the file and with which command (ADR-186).
  SA-100:
    statement: specarch try shall evaluate one algorithm's formula, in both builds, on each of its worked examples or on inputs given on the command line, with the specification's definition of the algorithm or a proposed one read from a file in its place, and print for each evaluation its inputs, every operation and call of the formula with the value it gave, in the order they were computed, the result and, for an example, the expected value and whether it holds.
    kind: functional
    priority: must
    status: proposed
    acceptance:
      - specarch try on the library lending example's lateFee prints a summary line, then each of its four examples with its inputs, each sub-expression of the formula that was computed with its value, decimals at the scale the formula gives them, the result and the expected value, all four passing, and exits 0; the Go build and the Swift build print the same lines.
      - An example whose expected value the formula does not give is printed as failing with the result beside the expected value, and an example the formula cannot compute is printed with the steps computed before the failure and the reason; either exits 1.
      - "The operand of && or || that is not read and the branch of ?: that is not taken are not printed."
      - --example prints one example by its name, and the validator's lines of the examples it does not evaluate are printed and exit 1; --inputs evaluates the inputs written as an example's inputs are and prints the result with no expected value; an input given there that does not fit its field is printed with the reason and exits 1.
      - --file reads the algorithm from a fragment file in place of the specification's, each key it gives taking the place of the specification's key and the others kept, so a proposed formula is tried on the examples the specification holds; the specification's files are not changed.
      - An algorithm the specification does not have is refused, naming the ones it has, and exits 1; a usage error, a folder or file that cannot be read, or --example with --inputs exits 2.
      - With --json the Go build prints the evaluations as data beside the lines.
    verification: test
    needs: [NEED-1, NEED-10]
    why: A reader decides on a rule faster and more accurately from its result on a case they recognise than from its formula; validate says only that an example does not hold, so the result of a passing example, the steps that gave a wrong one and the effect of a proposed formula on the examples were worked out by hand, which is the cost the goal names (ADR-195).
