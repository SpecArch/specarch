translations:
  "state does not match": "state tidak cocok"
  "code used twice": "code dipakai dua kali"
  "signature invalid": "signature tidak valid"
  "issuer differs": "issuer berbeda"
  "identity token expired": "identity token kedaluwarsa"
  "nonce replayed": "nonce dipakai ulang"
  "Sign-in through ": "Sign-in lewat "
  "A person signs in through %s at %s, the identity provider, with OpenID Connect's authorisation code flow and PKCE's S256 method (RFC 6749, 4.1; RFC 7636). %s leaves the application for the provider's authorisation endpoint, which its discovery document names; the provider sends the person back to %s with the code and the state, and the callback exchanges the code at the provider for %s, the identity token. The provider's issuer and its keys, and the client_id of %s, are the deployment's: deployments.<environment>.signIn.issuerUrl and jwksUri, and clients.%s.clientId, in the implementation file.": "Seseorang sign-in lewat %s di %s, identity provider-nya, dengan authorisation code flow OpenID Connect dan metode S256 dari PKCE (RFC 6749, 4.1; RFC 7636). %s meninggalkan aplikasi menuju authorisation endpoint provider, yang disebut di discovery document-nya; provider mengirim orang itu kembali ke %s dengan code dan state, lalu callback menukar code itu di provider dengan %s, yaitu identity token. Issuer provider dan key-nya, serta client_id dari %s, ditentukan per deployment: deployments.<environment>.signIn.issuerUrl dan jwksUri, serta clients.%s.clientId, di file implementasi."
  "The callback refuses the sign-in, and starts no session, on each of these, each a derived case of ": "Callback menolak sign-in, dan tidak memulai session, pada setiap kondisi berikut, masing-masing derived case dari "
  "| Check | Derived case | Security event | Severity | Asked for by |": "| Pengecekan | Derived case | Security event | Severity | Diminta oleh |"
  "the state is the one the sign-in request set in this browser": "state-nya sama dengan yang di-set request sign-in di browser ini"
  "the code has not been exchanged before": "code-nya belum pernah ditukar sebelumnya"
  "the identity token's signature verifies with the provider's keys": "signature identity token terverifikasi dengan key provider"
  "iss is the deployment's issuerUrl": "iss sama dengan issuerUrl deployment"
  "exp has not passed": "exp belum lewat"
  "nonce is the one this sign-in sent, used once": "nonce sama dengan yang dikirim sign-in ini, dipakai sekali"
  "When the person signs out at the provider, the provider calls %s on the back channel (OpenID Connect Back-Channel Logout 1.0), which only the service clients its callers list may call.": "Saat orang itu sign-out di provider, provider memanggil %s lewat back channel (OpenID Connect Back-Channel Logout 1.0), yang hanya boleh dipanggil oleh service client yang terdaftar di callers-nya."
  "No page": "Tidak ada halaman"
  "  participant B as Browser\n": "  participant B as Browser\n"
  "  participant I as %s\n": "  participant I as %s\n"
  "  B->>B: navigate signIn: a new state, nonce and PKCE verifier, kept in the __Host-sign-in cookie\n": "  B->>B: navigate signIn: state, nonce, dan PKCE verifier baru, disimpan di cookie __Host-sign-in\n"
  "  B->>I: GET the discovery document at issuerUrl\n": "  B->>I: GET discovery document di issuerUrl\n"
  "  B->>I: authorisation request: code, client_id of %s, redirect_uri %s, openid, state, nonce, S256 challenge\n": "  B->>I: authorisation request: code, client_id dari %s, redirect_uri %s, openid, state, nonce, S256 challenge\n"
  "  I-->>B: the person signs in, and is sent back to %s with the code and the state\n": "  I-->>B: orang itu sign-in, lalu dikirim kembali ke %s dengan code dan state\n"
  "  B->>S: GET %s, the code and the state, with the cookie\n": "  B->>S: GET %s, code dan state, dengan cookie\n"
  "  S->>S: the state is the cookie's\n": "  S->>S: state sama dengan milik cookie\n"
  "  S->>I: token request: the code and the PKCE verifier, within %s\n": "  S->>I: token request: code dan PKCE verifier, dalam waktu %s\n"
  "  I-->>S: %s, the identity token\n": "  I-->>S: %s, identity token\n"
  "  S->>S: the signature with the provider's keys, iss, aud, exp, the nonce once\n": "  S->>S: signature dengan key provider, iss, aud, exp, nonce sekali pakai\n"
  "  S-->>B: %s %s\n": "  S-->>B: %s %s\n"
  "  I->>S: %s %s, when the person signs out at the provider\n": "  I->>S: %s %s, saat orang itu sign-out di provider\n"
same:
  - "RFC 6749, 10.12; RFC 9700, 4.7"
  - "RFC 6749, 4.1.2; RFC 9700, 4.5"
  - "OpenID Connect Core, 3.1.3.7, step 6"
  - "OpenID Connect Core, 3.1.3.7, step 2; RFC 9700, 4.4"
  - "OpenID Connect Core, 3.1.3.7, step 9"
  - "OpenID Connect Core, 3.1.3.7, step 11"
