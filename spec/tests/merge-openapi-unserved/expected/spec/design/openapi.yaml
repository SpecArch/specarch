entities:
  Loan:
    type: object
    properties:
      id: {type: integer, readOnly: true}
      cardNumber: {type: string, pattern: "^[0-9]{10}$"}
      barcode: {type: string, maxLength: 20}
      loanedOn: {type: string, format: date}
      dueOn: {type: string, format: date}
      returnedOn: {type: [string, "null"], format: date}
    required: [id, cardNumber, barcode, loanedOn, dueOn]
    origin: stated
    cites:
      - {source: openapi, clause: /components/schemas/Loan, says: 'The schema Loan, with the properties id, cardNumber, barcode, loanedOn, dueOn and returnedOn.'}
  Member:
    type: object
    properties:
      cardNumber: {type: string, pattern: "^[0-9]{10}$"}
      fullName: {type: string, maxLength: 200}
    required: [cardNumber, fullName]
    origin: stated
    cites:
      - {source: openapi, clause: /components/schemas/Member, says: 'The schema Member, with the properties cardNumber and fullName.'}
paths:
  /loans:
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "denied without loans.write"; add under tests lend-book-denied-without-loans-write: { operation: lendBook, scenario: red, covers: [denied without loans.write], given: "a caller without loans.write", when: "lendBook is called", then: "it is refused as not allowed" } [test_case_missing.2bfe73d3@design/openapi.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "missing barcode"; add under tests lend-book-missing-barcode: { operation: lendBook, scenario: red, covers: [missing barcode], given: "...", when: "lendBook is called without barcode", then: "it is refused" } [test_case_missing.68aaa23d@design/openapi.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "cardNumber not matching its pattern"; add under tests lend-book-card-number-not-matching-its-pattern: { operation: lendBook, scenario: red, covers: [cardNumber not matching its pattern], given: "...", when: "lendBook is called with cardNumber in the wrong form", then: "it is refused" } [test_case_missing.6ccbe6b8@design/openapi.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_case_missing: operation lendBook has no red scenario for "missing cardNumber"; add under tests lend-book-missing-card-number: { operation: lendBook, scenario: red, covers: [missing cardNumber], given: "...", when: "lendBook is called without cardNumber", then: "it is refused" } [test_case_missing.e24ae930@design/openapi.yaml#/paths/~1loans/post]
    # specarch-problem: warning: test_golden_missing: operation lendBook has no golden scenario; add one under tests, for example lend-book-succeeds: { operation: lendBook, scenario: golden, given: "a caller with loans.write", when: "lendBook is called with values inside every limit", then: "it answers 201: The new loan, with its due date." } [test_golden_missing@design/openapi.yaml#/paths/~1loans/post]
    post:
      operationId: lendBook
      summary: Lend a book to a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardNumber: {type: string, pattern: "^[0-9]{10}$"}
                barcode: {type: string, maxLength: 20}
              required: [cardNumber, barcode]
      responses:
        "201":
          description: The new loan, with its due date.
          content:
            application/json:
              schema: {$ref: '#/entities/Loan'}
        "409":
          description: The member already has the most books on loan at a time.
      origin: stated
      cites:
        - {source: openapi, clause: /paths/~1loans/post, says: 'POST /loans: Lend a book to a member.'}
        - {source: code, clause: examples/lending-desk/sources/code POST /loans, says: POST /loans checks loans.write; its handler is LendBook.}
      permission: loans.write
  /loans/{loanId}/renew:
    parameters:
      - name: loanId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    # specarch-problem: warning: test_case_missing: operation renewLoan has no red scenario for "not found loanId"; add under tests renew-loan-not-found-loan-id: { operation: renewLoan, scenario: red, covers: [not found loanId], given: "no record has that loanId", when: "renewLoan is called with that loanId", then: "it is refused as not found" } [test_case_missing@design/openapi.yaml#/paths/~1loans~1{loanId}~1renew/post]
    # specarch-problem: warning: test_golden_missing: operation renewLoan has no golden scenario; add one under tests, for example renew-loan-succeeds: { operation: renewLoan, scenario: golden, given: "any caller", when: "renewLoan is called with values inside every limit", then: "it answers 200: The loan, with its new due date." } [test_golden_missing@design/openapi.yaml#/paths/~1loans~1{loanId}~1renew/post]
    post:
      operationId: renewLoan
      summary: Renew a loan once, for one more loan period
      responses:
        "200":
          description: The loan, with its new due date.
          content:
            application/json:
              schema: {$ref: '#/entities/Loan'}
        "409":
          description: The loan was renewed already, or is past its due date.
      origin: stated
      cites:
        - {source: openapi, clause: '/paths/~1loans~1{loanId}~1renew/post', says: 'POST /loans/{loanId}/renew: Renew a loan once, for one more loan period.'}
  /loans/{loanId}/return:
    parameters:
      - name: loanId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    # specarch-problem: warning: test_case_missing: operation returnBook has no red scenario for "denied without loans.write"; add under tests return-book-denied-without-loans-write: { operation: returnBook, scenario: red, covers: [denied without loans.write], given: "a caller without loans.write", when: "returnBook is called", then: "it is refused as not allowed" } [test_case_missing.69b798fb@design/openapi.yaml#/paths/~1loans~1{loanId}~1return/post]
    # specarch-problem: warning: test_case_missing: operation returnBook has no red scenario for "not found loanId"; add under tests return-book-not-found-loan-id: { operation: returnBook, scenario: red, covers: [not found loanId], given: "no record has that loanId", when: "returnBook is called with that loanId", then: "it is refused as not found" } [test_case_missing.e34b1cce@design/openapi.yaml#/paths/~1loans~1{loanId}~1return/post]
    # specarch-problem: warning: test_golden_missing: operation returnBook has no golden scenario; add one under tests, for example return-book-succeeds: { operation: returnBook, scenario: golden, given: "a caller with loans.write", when: "returnBook is called with values inside every limit", then: "it answers 200: The closed loan." } [test_golden_missing@design/openapi.yaml#/paths/~1loans~1{loanId}~1return/post]
    post:
      operationId: returnBook
      summary: Check a returned book in, which closes the loan
      responses:
        "200":
          description: The closed loan.
          content:
            application/json:
              schema: {$ref: '#/entities/Loan'}
      origin: stated
      cites:
        - {source: openapi, clause: '/paths/~1loans~1{loanId}~1return/post', says: 'POST /loans/{loanId}/return: Check a returned book in, which closes the loan.'}
        - {source: code, clause: 'examples/lending-desk/sources/code POST /loans/{loanId}/return', says: 'POST /loans/{loanId}/return checks loans.write; its handler is ReturnBook.'}
      permission: loans.write
  /members:
    # specarch-problem: warning: test_case_missing: operation registerMember has no red scenario for "denied without members.write"; add under tests register-member-denied-without-members-write: { operation: registerMember, scenario: red, covers: [denied without members.write], given: "a caller without members.write", when: "registerMember is called", then: "it is refused as not allowed" } [test_case_missing.585bd96d@design/openapi.yaml#/paths/~1members/post]
    # specarch-problem: warning: test_case_missing: operation registerMember has no red scenario for "cardNumber not matching its pattern"; add under tests register-member-card-number-not-matching-its-pattern: { operation: registerMember, scenario: red, covers: [cardNumber not matching its pattern], given: "...", when: "registerMember is called with cardNumber in the wrong form", then: "it is refused" } [test_case_missing.8225af9c@design/openapi.yaml#/paths/~1members/post]
    # specarch-problem: warning: test_case_missing: operation registerMember has no red scenario for "missing fullName"; add under tests register-member-missing-full-name: { operation: registerMember, scenario: red, covers: [missing fullName], given: "...", when: "registerMember is called without fullName", then: "it is refused" } [test_case_missing.d8c1b4d0@design/openapi.yaml#/paths/~1members/post]
    # specarch-problem: warning: test_case_missing: operation registerMember has no red scenario for "missing cardNumber"; add under tests register-member-missing-card-number: { operation: registerMember, scenario: red, covers: [missing cardNumber], given: "...", when: "registerMember is called without cardNumber", then: "it is refused" } [test_case_missing.f0ddd858@design/openapi.yaml#/paths/~1members/post]
    # specarch-problem: warning: test_golden_missing: operation registerMember has no golden scenario; add one under tests, for example register-member-succeeds: { operation: registerMember, scenario: golden, given: "a caller with members.write", when: "registerMember is called with values inside every limit", then: "it answers 201: The member, registered." } [test_golden_missing@design/openapi.yaml#/paths/~1members/post]
    post:
      operationId: registerMember
      summary: Register a new member
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/entities/Member'}
      responses:
        "201":
          description: The member, registered.
          content:
            application/json:
              schema: {$ref: '#/entities/Member'}
      origin: stated
      cites:
        - {source: openapi, clause: /paths/~1members/post, says: 'POST /members: Register a new member.'}
        - {source: code, clause: examples/lending-desk/sources/code POST /members, says: POST /members checks members.write; its handler is RegisterMember.}
      permission: members.write
  /members/{cardNumber}/loans:
    parameters:
      - name: cardNumber
        in: path
        description: The number printed on the member's card.
        required: true
        schema:
          type: string
          pattern: "^[0-9]{10}$"
          examples:
            - "0000012345"
