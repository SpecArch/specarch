entities:
  Loan:
    description: One copy lent to a member.
    type: object
    properties:
      id: { type: string, format: uuid }
      bookId: { type: string, format: uuid }
      shelfId: { type: string, format: uuid }
    required: [id, bookId, shelfId]
    primaryKey: [id]
    relations:
      book: { target: Book, kind: many-to-one, via: bookId }
      shelf: { target: Shelf, kind: many-to-one, via: shelfId }
