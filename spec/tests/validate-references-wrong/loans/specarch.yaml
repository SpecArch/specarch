specarch: "0.1"
info: { title: Loans, version: 1.0.0, name: loans }
permissions:
  public: { description: Open to everyone. }
dependencies:
  customerRegistry:
    description: The registry of customers, whose numbers the loans keep.
    timeout: PT2S
    specification: customer-registry
    version: 2.3.0
  mailer:
    description: The mail relay.
    timeout: PT5S
entities:
  Loan:
    type: object
    properties:
      id: { type: string, format: uuid }
      customerId: { type: string, format: uuid }
      address: { $ref: "customerRegistry#/schemas/Adress" }
      sender: { $ref: "mailer#/schemas/Sender" }
      branch: { $ref: "branchRegistry#/entities/Branch" }
    required: [id, customerId]
    primaryKey: [id]
    relations:
      customer: { target: "customerRegistry#/entities/Customer", kind: many-to-one, via: customerId }
      guarantor: { target: "customerRegistry#/entities/Customer", kind: many-to-one, via: guarantorNo }
      accounts: { target: "customerRegistry#/entities/Customer", kind: one-to-many, via: loanId }
paths:
  /loans:
    post:
      operationId: createLoan
      summary: Create a loan
      permission: public
      responses:
        "201": { description: The loan. }
      calls: ["customerRegistry#/paths/~1customers/delete"]
pages:
  customers:
    kind: list
    title: Customers
    route: /customers
    permission: public
    entity: "customerRegistry#/entities/Customer"
    source: "customerRegistry#/paths/~1customers/get"
    columns: [fullName, email]
  customer:
    kind: view
    title: Customer
    route: /customers/:id
    permission: public
    entity: Loan
    source: "customerRegistry#/paths/~1customers/get"
    fields: [customerId]
  new-loan:
    kind: form
    title: New loan
    route: /loans/new
    permission: public
    entity: Loan
    submit: createLoan
    fields: [customerId]
    pickers:
      customerId: { source: "customerRegistry#/paths/~1customers/get", shows: [fullName, phone], fills: { id: email } }
