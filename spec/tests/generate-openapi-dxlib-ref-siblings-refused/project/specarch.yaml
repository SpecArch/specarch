specarch: "0.1"
info: { title: Catalogue, version: 1.0.0 }
stages: [implementation]
stakeholders:
  owner: { description: The product owner. }
enums:
  Shelf:
    type: string
    enum: [fiction, reference]
entities:
  Book:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      title: { type: string, minLength: 1, maxLength: 300 }
      shelf: { $ref: "#/enums/Shelf", enum: [fiction] }
    required: [id, title, shelf]
    primaryKey: [id]
errors:
  book-not-found: { status: 404, title: No such book, condition: No book has the id. }
permissions:
  books.read: { description: See books. }
roles:
  desk: { description: The desk., permissions: [books.read] }
paths:
  /books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBook
      summary: One book
      permission: books.read
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: { $ref: "#/entities/Book" }
        "404": { description: No such book., problem: book-not-found }
