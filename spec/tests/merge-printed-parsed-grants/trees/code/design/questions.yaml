  Q-3:
    question: The check RequireChecks runs only when the setting DESK_CHECKS_ON is true. Is a false DESK_CHECKS_ON ever meant to let every request through, or should the check refuse every request whatever it says?
    kind: decision
    priority: must
    blocks: [roles]
    decidedBy: system-owner
    why: A check switched off by a setting fails open without an error, so no role's grants hold while it is off.
    cites:
      - {source: code, clause: 'api/endpoints.go:26', says: RequireChecks lets every request through while DESK_CHECKS_ON is false.}
