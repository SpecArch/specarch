specarch: "0.1"
info: { title: Catalogue, version: 1.0.0 }
stages: [implementation]
stakeholders:
  owner: { description: The product owner. }
enums:
  Shelf: { type: string, enum: [fiction, reference] }
  BookStatus: { type: string, enum: [shelved, retired] }
schemas:
  Location:
    description: Where a book stands.
    type: object
    properties:
      room: { type: string, title: Room, maxLength: 40 }
      shelfNumber: { type: integer, format: int32, title: Shelf number, minimum: 1 }
    required: [room]
entities:
  Book:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      title: { type: string, title: Title, minLength: 1, maxLength: 200 }
      shelf: { $ref: "#/enums/Shelf", title: Shelf }
      status: { $ref: "#/enums/BookStatus", title: Status }
      location: { $ref: "#/schemas/Location", title: Location }
      tags: { type: array, title: Tags, items: { type: string, maxLength: 30 }, maxItems: 5 }
      price: { type: string, format: decimal, precision: 8, scale: 2, title: Price }
      shelvedOn: { type: string, format: date, title: Shelved on }
    required: [id, title, shelf, status]
    primaryKey: [id]
errors:
  book-on-loan: { status: 409, title: The book is on loan, condition: A member holds the book. }
  book-not-found: { status: 404, title: No such book, condition: No book has this id. }
permissions:
  books.read: { description: See the catalogue. }
  books.write: { description: Change the catalogue. }
roles:
  librarian: { description: Keeps the catalogue., permissions: [books.read, books.write] }
paths:
  /books:
    get:
      operationId: listBooks
      summary: The books
      permission: books.read
      parameters:
        - { name: shelf, in: query, schema: { $ref: "#/enums/Shelf" } }
      listOf:
        entity: Book
        pageSize: { default: 25, maximum: 100 }
      responses:
        "200":
          description: The books.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Book" } }
    post:
      operationId: addBook
      summary: Add a book
      permission: books.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                shelf: { $ref: "#/enums/Shelf" }
              required: [title, shelf]
      responses:
        "201":
          description: The book.
          content:
            application/json:
              schema: { $ref: "#/entities/Book" }
  /books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBook
      summary: One book
      permission: books.read
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: { $ref: "#/entities/Book" }
        "404": { description: No such book., problem: book-not-found }
  /books/{bookId}/retire:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retireBook
      summary: Take a book out of the catalogue, saying why
      permission: books.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                why: { type: string, title: Why it is retired, minLength: 3, maxLength: 300 }
              required: [why]
      responses:
        "204": { description: Retired. }
        "409": { description: The book is on loan., problem: book-on-loan }
pages:
  books-list:
    kind: list
    title: Books
    route: /books
    entity: Book
    permission: books.read
    source: listBooks
    columns: [title, shelf, status]
    filters: [shelf]
    onSelect: { navigate: book-view, with: { bookId: id } }
    actions:
      - { label: Add a book, kind: navigate, target: book-form, permission: books.write, confirm: "Leave the list?" }
      - { label: Retire, kind: operation, target: retireBook, permission: books.write, when: 'int("2") > 1', confirm: "Retire this book?", reason: why, then: { message: The book is retired. } }
      - { label: Retire quietly, kind: operation, target: retireBook, permission: books.write, then: { message: The book is retired. } }
      - { label: Open its shelf, kind: navigate, target: shelf-view, permission: books.read, with: { shelfName: shelf } }
  shelf-view:
    kind: view
    title: Shelf
    route: /shelves/{shelfName}
    entity: Book
    permission: books.read
    source: getBook
    fields: [title]
    actions:
      - { label: Next shelf, kind: navigate, target: book-view, permission: books.read }
  book-view:
    kind: view
    title: Book
    route: /books/{bookId}
    entity: Book
    permission: books.read
    source: getBook
    sections:
      - { title: Book, fields: [title, shelf, status] }
      - { title: Where it stands, fields: [location, tags, price] }
    fieldConditions:
      location: { hiddenWhen: 'status == "retired"' }
      tags: { hiddenWhen: 'price > decimal("10.00", 2)' }
    states:
      failed:
        book-not-found: { message: There is no such book. }
        book-on-loan: { message: "A member holds this book, so it stays shelved." }
    actions:
      - { label: All books, kind: navigate, target: books-list, permission: books.read }
      - { label: Its shelf, kind: navigate, target: shelf-view, permission: books.read }
      - { label: Retire, kind: operation, target: retireBook, permission: books.write, when: 'status == "shelved"', confirm: "Retire this book?", reason: why, then: { navigate: books-list, message: The book is retired. } }
  book-form:
    kind: form
    title: Add a book
    route: /books/new
    entity: Book
    permission: books.write
    submit: addBook
    fields: [title, shelf]
    onSubmitted: { navigate: book-view, with: { bookId: id }, message: The book is added. }
menus:
  catalogue:
    title: Catalogue
    items:
      all: { title: All books, page: books-list }
      add: { title: Add a book, page: book-form }
      one: { title: One book, page: book-view }
accessibility: { standard: WCAG 2.2, level: AA }
theme:
  tokens:
    color:
      $type: color
      ink: { $value: { colorSpace: srgb, components: [0, 0, 0] } }
      paper: { $value: { colorSpace: srgb, components: [1, 1, 1] } }
  pairs:
    - { text: color.ink, background: color.paper, use: text }
