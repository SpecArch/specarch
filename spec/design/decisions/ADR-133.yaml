# yaml-language-server: $schema=../../../schema/specarch-fragment-design-0.2.schema.json
decisions:
  ADR-133:
    title: A layout entry says which packages it depends on under dependsOn, CycloneDX's word, which extract go fills from the imports and the component diagram draws
    status: proposed
    date: "2026-10-19"
    context: |
      docs/diagrams.md, gap A. An implementation file's layout lists the
      packages of one implementation with the design objects each
      implements, and nothing says which package calls which. A
      component diagram drawn from it, C4's third level, has one box per
      package and no arrow, so a reviewer of the architecture sees the
      parts and not the structure, and an editor that draws the diagram
      from the specification has nothing to draw the edges from.
    decision: |
      A layout entry gains dependsOn, a list of keys of the same layout:
      the packages this one calls, imports or links against. The
      validator, in both builds, reports as the rule depends_on at the
      entry a name that is no key of the layout and an entry that names
      itself; a cycle is not reported. The rule is its own, not layout,
      which already means the file tree: one rule name keeps one meaning. An entry without the key says nothing of
      its dependencies, and the schema does not require it.

      extract go --implementation fills it for each package from the
      imports of its files that name another package of the same module,
      by that package's layout key, and nothing outside the module. The
      other readers fill it when their code-facts dumps carry imports.

      The technical specification's chapter 5 draws, per implementation
      file, the component diagram between the markers components
      <stack>: a flowchart with a node per layout entry, labelled with its
      key and the count of design objects it implements, an edge per
      dependsOn, and the libraries drawn apart.
    why: |
      The word is CycloneDX's, taken with its exact meaning: in a software
      bill of materials each component names under dependsOn the
      components it depends on, which is this edge. C4 writes the verb of
      a relationship in prose and the Structurizr DSL has no keyword for
      it, so there was no word to take there; imports is Go's and Python's
      word and not Java's or Swift's; uses is UML's usage dependency,
      close but not the same, and a borrowed word is never redefined.

      The key is in the implementation file because what a package
      depends on is one stack's structure, as the layout itself is; a
      design that said it would say something of a stack it does not
      know. A cycle is not an error because Go forbids one and Java, Swift
      and TypeScript allow one, and the file describes the code as it is.
      The reader fills it from the imports because an import is what the
      code says and nothing more, which is the readers' test.

      The compiler test holds: a name not in the layout is an error at
      the entry and the diagram still draws every other edge, and an
      implementation file without the key reads, validates and renders as
      before. The acceptance test holds: the arrows are the first thing a
      reviewer of an architecture asks for, they are shown the day the
      reader fills them, and a wrong arrow is one entry's list to change.
    consequences: |
      The implementation schema gains dependsOn on a layout entry; the
      rule depends_on is new in both builds, with a case; extract go's
      implementation output gains the key with a case; document techspec
      gains the components marker; SpecArch's own Go implementation file
      is filled by its own reader. The origin table of docs/conventions.md
      gains the row when the item is built.
    satisfies: [SA-9, SA-16]
