roles:
  branch-manager:
    origin: stated
    cites:
      - {source: code, clause: engine/flows/fines.json, says: The workflow table names role branch-manager as an approver of step manager check of workflow fine-waiver.}
  desk-supervisor:
    origin: stated
    cites:
      - {source: code, clause: engine/flows/fines.json, says: The workflow table names role desk-supervisor as an approver of step supervisor check of workflow fine-waiver.}
      - {source: code, clause: engine/flows/fines.json, says: The workflow table names role desk-supervisor as an approver of step Supervisor-Check of workflow fine-waiver.}
workflows:
  fine-waiver:
    description: A fine is waived after a branch manager and then a desk supervisor approve.
    steps:
      - name: managerCheck
        kind: approval
        approvers: [branch-manager]
        onDeadline: escalate
        escalateTo: supervisorCheck
      - name: supervisorCheck
        kind: approval
        approvers: [desk-supervisor]
        onDeadline: refuse
      - name: supervisorCheck2
        kind: approval
        approvers: [desk-supervisor]
      - name: waive
        kind: operation
    origin: stated
    cites:
      - {source: code, clause: engine/flows/fines.json, says: 'The workflow table prints workflow fine-waiver, with the steps manager check, supervisor check, Supervisor-Check and waive in that order.'}
