arguments: [capabilities]
exitStatus: 0
standardOutput: |
  specarch 1.4.0

  Formats
    meta-model: writes 1.0.0, reads 1.0.0 and any later 1.0 patch, 0.3, 0.2, 0.1
    implementation file: writes 1.0.0, reads 1.0.0 and any later 1.0 patch, 0.1
    record: writes 1.0.0, reads 1.0.0 and any later 1.0 patch, 0.1
    idiom: writes 1.0.0, reads 1.0.0 and any later 1.0 patch, 0.1
    estate: writes 1.0.0, reads 1.0.0 and any later 1.0 patch, 0.1
    vocabulary: writes 1.0.0, reads 1.0.0 and any later 1.0 patch, 0.1

  Commands
    specarch approve --by <by> [--date <date>] [--dry-run] <paths>...
        Record that the documents were read and the specification is approved.
    specarch capabilities [--json]
        List what this program and the plug-ins on PATH can do; with --json as
        a tool listing a program reads.
    specarch check <specification> [--allowlist <allowlist>] [--since <since>]
      <dumps>...
        Compare a specification with the dumps of the running code, for a CI
        gate.
    specarch compare <folder> [--test-run <test-run>]...
      [--results <results>]... [--scan <scan>]...
      [--measurements <measurements>]... [--out <out>] [--dry-run]
      <implementations>...
        Compare alternative implementation files of one specification in one
        table, from their test results, scan findings and measurements.
    specarch decide <question> <folder> --by <by> --answer <answer>
      [--source <source>] [--record <record>] [--date <date>] [--dry-run]
        Answer an open question with a decision record and take the question
        out.
    specarch decision rests <decision> <folder>
        Print the decisions that rest on a decision, nearest first.
    specarch decision why <decision> <folder>
        Print the chain of decisions a decision rests on, earliest first.
    specarch derive [--fill] [--dry-run] <paths>...
        Write a draft test for every derived case no test covers, and with
        --fill add the fixture, input and expect the design fixes to each test
        that has none.
    specarch diff <old> <new>
        Compare two versions of a specification and check the release between
        them.
    specarch document <target> [--out <out>] [--check] [--audience <audience>]
      [--dry-run] <paths>...
        Write a document from a specification.
    specarch extract <source> --out <out> [--implementation <implementation>]
      [--facts <facts>] [--routes <routes>] [--language <language>]
      [--vocabulary <vocabulary>] [--given-outside] [--entity <entity>]
      [--template <template>] [--instructions <instructions>]
      [--implementation-out <implementation-out>] [--table]
      [--source-key <source-key>] [--dry-run] <paths>...
        Write a specification from existing code or documents.
    specarch facts <language> <folder> <dump> [--dry-run]
        Write the code-facts dump extract reads of a committed folder.
    specarch gaps [--next] <paths>...
        List the open questions and what they hold up.
    specarch generate <target> [--out <out>] [--check] [--estate <estate>]...
      [--environment <environment>] [--unapproved] [--dry-run] [--as-is]
      [--package <package>] <paths>...
        Write code or data from a specification.
    specarch guide [--agent]
        Print the order of work, for a person or, with --agent, for an agent.
    specarch help [<topic>...]
        Explain an area of SpecArch or one command, from the text built into
        the program.
    specarch idioms <paths>...
        List the idioms each implementation file uses, and how.
    specarch idioms diff <idiom> <paths>...
        Print a shipped idiom's parts beside each override's.
    specarch init <folder> [--title <title>] [--profile <profile>] [--dry-run]
        Write the smallest specification that validates into a new folder.
    specarch log <folder> [--direction <direction>] [--from <from>]
      [--to <to>] [--at <at>] [--channel <channel>] [--type <type>]
      [--words <words>] [--form <form>] [--reply <reply>] [--person <person>]
      [--recorded-by <recorded-by>] [--session <session>] [--source <source>]
      [--evidence <evidence>]... [--question <question>]...
      [--decision <decision>]... [--element <element>]...
      [--change <change>]... [--defect <defect>]... [--idea <idea>]...
      [--dry-run]
        Record one communication with a stakeholder, from what the analyst
        reports in chat, as a record beside the specification.
    specarch log test-run <folder> [--results <results>]
      [--environment <environment>] [--version <version>] [--build <build>]
      [--digest <digest>] [--at <at>] [--by <by>]
      [--open-defect <open-defect>]... [--severity <severity>]
      [--phase <phase>] [--dry-run]
        Record one run of the tests, from a JUnit XML results file, as a
        test-run record beside the specification, each result mapped to its
        test.
    specarch mcp
        Serve every command as a tool of the Model Context Protocol, over
        standard input and output.
    specarch merge --out <out> [--vocabulary <vocabulary>]... [--dry-run]
      <trees>...
        Merge the partial specifications the readers wrote into one.
    specarch model <paths>...
        Print the specifications as one JSON document, for a program.
    specarch run <package> [--results <results>] [--base-url <base-url>]
      [--server <server>] [--callers <callers>] [--setup <setup>] [--dry-run]
        Run a test package against its environment and write the results as
        JUnit XML.
    specarch skill --out <out> [--check] [--dry-run]
        Write an agent skill for SpecArch, in the Agent Skills format, from
        the program's own command definitions.
    specarch try <name> <folder> [--example <example>] [--inputs <inputs>]
      [--file <file>]
        Evaluate an algorithm, or the mappings of an operation's calls, on
        their worked examples and print each step.
    specarch upgrade [--dry-run] [--to <to>] <paths>...
        Move a specification and its files to the newest version of each
        format, or list what moving them changes.
    specarch validate <paths>...
        Check specifications and implementation files.
    specarch version
        Print the program version and the meta-model versions it reads.

  Document targets: techspec, requirements, testplan, traceability,
    deployment, commissioning, handover, questions, problems, comparison,
    changes, releases, communications, timeline, testruns, progress, html,
    manual, operations
  Extract sources: outline, database, router, documents, tables, openapi,
    permissions, pages, workflows, gateway, systemd, go, swift, javascript,
    dart, tests

  Plug-ins found on PATH
    none: put the specarch-gen-<target> executables on PATH to generate code.

  Limits
  - No promise of complete generation: a plug-in writes what its target covers
    from the specification, marks each problem at its entry, and names what it
    does not write; the rest is written by hand.
  - Hand-written islands: keep code written by hand in files a target does not
    write, since generate writes every file its plug-in answers (sqlc and
    scripts never write over a file they did not write); `generate --check`
    reads a file without the generated header as built by hand and says
    whether it matches the output but for the header; an element an
    implementation file marks ownedBy a stakeholder is generated nowhere.
  - A specification is never complete: an incomplete one is still read, and
    every gap is a problem or a question rather than a refusal to read.
  - The program never runs or deploys the code it generates; a plug-in is
    found on PATH, answers on standard output and never touches the disk, and
    specarch writes its files.
  - Prompts: none. Every command runs without asking anything, so no --yes
    exists; a step that needs a person is a command the person runs (decide,
    approve).

  specarch capabilities --json prints all of it, with each command's inputs as
  JSON Schema, its outputs and its exit codes.
