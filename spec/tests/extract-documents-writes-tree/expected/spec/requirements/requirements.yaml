  # specarch-problem: warning: requirement_unsatisfied: no design element satisfies requirement HANDBOOK-1; add satisfies: [HANDBOOK-1] to the entity, operation, command, page, algorithm or decision that meets it [requirement_unsatisfied@requirements/requirements.yaml#/requirements/HANDBOOK-1]
