  # specarch-problem: question: open_question: (must, decision) POST /invoices/{invoiceId}/send calls requireClients with "reporting" and "mailer" and requireClient with "mailer" in turn, and each refuses a caller it does not list, so only mailer passes every one, written as its callers. Which callers is it meant to admit? Decided by system-owner. Answer with a decision record that names Q-13 under answers. [Q-13]
  Q-13:
    question: POST /invoices/{invoiceId}/send calls requireClients with "reporting" and "mailer" and requireClient with "mailer" in turn, and each refuses a caller it does not list, so only mailer passes every one, written as its callers. Which callers is it meant to admit?
    kind: decision
    priority: must
    blocks: ['#/paths/~1invoices~1{invoiceId}~1send/post/callers']
    decidedBy: system-owner
    why: Checks in sequence admit only the names every one lists; lists that disagree are as often a mistake as a narrowing, so the set the code admits is written and asked, never one list chosen.
    cites:
      - {source: code, clause: 'server/src/app.ts:14', says: Calls requireClients with "reporting" and "mailer".}
      - {source: code, clause: 'server/src/app.ts:14', says: Calls requireClient with "mailer".}
