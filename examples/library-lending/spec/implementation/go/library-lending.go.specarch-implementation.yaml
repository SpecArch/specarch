# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v1.2.0/schema/specarch-implementation-1.0.schema.json
specarchImplementation: "1.0.0"

info:
  title: Library Lending in Go and PostgreSQL
  version: 0.1.0
  description: |
    How one stack would build the lending example. No code for it exists in
    this repository; the file shows what belongs in an implementation file
    and what stays in the specification.

implements:
  file: ../../specarch.yaml
  version: 0.1.0

stack:
  language: { name: Go, version: "1.26" }
  toolchain: { name: go, version: "1.26.0" }

libraries:
  github.com/oapi-codegen/oapi-codegen/v2:
    version: v2.8.0
    licence: Apache-2.0
    purpose: Turns the generated OpenAPI document into a strict server interface and request and response types.
    scope: tool
  github.com/oapi-codegen/runtime:
    version: v1.7.0
    licence: Apache-2.0
    purpose: Runtime helpers the generated server code calls.
  github.com/go-chi/chi/v5:
    version: v5.3.2
    licence: MIT
    purpose: HTTP router.
  github.com/jackc/pgx/v5:
    version: v5.11.0
    licence: MIT
    purpose: PostgreSQL driver.

layout:
  internal/api:
    description: Generated server interface and types. Never edited by hand.
    implements: ["#/paths/~1books/get", "#/paths/~1loans/post", "#/paths/~1loans~1{loanId}~1return/post"]
  internal/lending:
    description: Hand-written handlers that implement the generated interface, and the late-fee algorithm.
    implements: ["#/algorithms/lateFee", "#/entities/Loan"]
    dependsOn: [internal/api]
  internal/worker:
    description: The nightly jobs, run on a host of their own so that a long run never slows the desk.
    implements: ["#/jobs/markOverdue"]
    dependsOn: [internal/lending]
  migrations:
    description: Generated forward migrations, new files only.

mappings:
  "#/entities/Loan": { target: table loans }
  "#/entities/Member": { target: table members }
  "#/entities/Book": { target: table books }
  "#/caller/properties/memberId":
    target: "CAST(NULLIF(current_setting('library.member_id', true), '') AS UUID)"
    description: "The service sets library.member_id on the connection for a signed-in member with SET LOCAL, and sets nothing for staff, so the setting reads NULL and the member's row security policy holds for no row."
  "#/algorithms/lateFee": { target: lending.LateFee, description: "Takes and returns `decimal.Decimal` values with scale 2." }
  "#/paths/~1loans/post":
    target: lending.Server.CreateLoan
    settings: { x-oapi-codegen-middlewares: [requirePermission] }

bindings:
  http:
    framework: github.com/go-chi/chi/v5
    description: The generated strict handler is mounted on a chi router; a middleware checks the operation's permission before the handler runs.
  storage:
    framework: github.com/jackc/pgx/v5
    description: Money columns are `numeric(10,2)`.

targets:
  techspec:
    output: ../../../docs
  requirements:
    output: ../../../docs
  testplan:
    output: ../../../docs
  traceability:
    output: ../../../docs
  deployment:
    output: ../../../docs
  commissioning:
    output: ../../../docs
  handover:
    output: ../../../docs
    description: What the library's IT staff receive to build and run production, kept current by CI.
  manual:
    output: ../../../docs
    description: The desk's manual, from the flows, menus and pages, kept current by CI.
  operations:
    output: ../../../docs
    description: What the library's IT staff look at and do each day to keep the system running, kept current by CI.
  questions:
    output: ../../../docs
  problems:
    output: ../../../docs
  changes:
    output: ../../../docs
  releases:
    output: ../../../docs
  communications:
    output: ../../../docs
  timeline:
    output: ../../../docs
  testruns:
    output: ../../../docs
  progress:
    output: ../../../docs
  html:
    output: ../../../site
    description: The whole specification as one page to open from the disk, kept current by CI.
  openapi:
    output: ../../../openapi
    tool: oapi-codegen
    description: The interface as an OpenAPI 3.1 document, from which oapi-codegen writes the strict server interface into the package api.
    settings:
      package: api
      generate: { chi-server: true, strict-server: true, models: true }
      securityScheme: { name: bearerAuth, type: http, scheme: bearer, bearerFormat: JWT }
  sql:
    output: ../../../migrations
    dialect: postgresql
    description: Forward migrations, new files only, with the snapshot of the schema they built beside them.
  seed:
    output: ../../../seed
    description: "The rows a developer runs the service against, drawn from the entities with a fixed seed into the tables the migrations build: the catalogue alone, since a member's email is encrypted at rest and members, their loans and the waivers of their fees are made through the service."
    settings:
      rows: { Book: 12, Member: 0, Loan: 0, FeeWaiverRequest: 0 }
      seed: 2026
  sqlc:
    output: ../../../queries
    dialect: postgresql
    description: The queries the design derives, for sqlc to compile against the migrations; every other query is written by hand beside them.
  ui:
    output: ../../../web
    platform: web
    framework: plain-javascript
    description: The screens as plain JavaScript in the browser, from the design's pages, events, states and theme.
    settings:
      language: en
      tokens: { text: color.text, background: color.background, accent: color.accent, danger: color.danger, border: color.border, space: space.small, font: font.body }
      session: { operation: getSession, signedIn: signedIn, permissions: permissions, roles: roles }
  tests:
    output: internal/lending
  bpmn:
    output: ../../../workflows
    description: Each workflow as a BPMN 2.0 file with its diagram, for a BPMN modeller or engine, and the diagram as SVG for the documents.
  deploy:
    output: ../../../deploy
    description: "Each deployment as the files that put the system there: the developer's machine as a Compose project with the script of a fresh environment, staging as Kubernetes manifests, and the library's hosts as one cloud-init file each, running the images under systemd; every secret referenced, never written."
    settings:
      deployments:
        local: { form: compose }
        staging: { form: kubernetes }
        production: { form: cloud-init }
      images:
        api: localhost/library-lending-api:latest
        worker: localhost/library-lending-api:latest
        db: docker.io/library/postgres:16
      storage:
        db: 20Gi
      fresh: [local]

tasks:
  generate: { run: go generate ./... }
  test: { run: go test ./..., ci: true }
  build:
    run: podman build --platform linux/amd64 -f Containerfile -t library-lending-api .
    description: Builds the service's image from the tagged commit; the Containerfile pins the toolchain and the base images by digest.
  sbom:
    run: syft dir:. -o syft-json=sbom.json && grype sbom:sbom.json
    description: Writes the software bill of materials of the build and scans it; both files go with the release.

testing:
  framework: go test
  run: go test ./...
  suites:
    service:
      description: The service's own code, package by package; the design tests run through the tests target's output in internal/lending.
      run: go test ./...
      level: unit
      implementationOnly: true
      ci: true

deployments:
  local:
    description: A developer's machine.
    environment: development
    servers:
      - { name: api, url: "http://localhost:8080", listens: [{ port: 8080, protocol: http }], runs: { packages: [internal/api, internal/lending] }, description: The API. }
      - { name: db, kind: database, url: "postgresql://localhost:5432", listens: [{ port: 5432, protocol: postgresql }], runs: { targets: [sql] }, description: A PostgreSQL 16 container the developer starts. }
    links:
      - { from: api, to: db, port: 5432 }
    method:
      tool: podman compose 5.4
      files: ../../../deploy/local
      description: The Compose project the deploy target writes; fresh.sh beside it builds a throwaway copy, loads the migrations and the seed, runs the suites and takes it down.
    configuration:
      dailyRate: "0.50"
      notificationChannelUrl: "http://localhost:8081/events"
  staging:
    description: The staging host the librarians try a release on.
    environment: staging
    servers:
      - { name: api, url: "https://staging.library.example", listens: [{ port: 8080, protocol: http }], runs: { packages: [internal/api, internal/lending] }, description: The API behind the staging screens. }
      - { name: db, kind: database, url: "postgresql://db.staging.library.internal:5432", listens: [{ port: 5432, protocol: postgresql }], runs: { targets: [sql] }, description: The staging loans database. }
    links:
      - { from: api, to: db, port: 5432 }
    method:
      tool: kubectl 1.33
      files: ../../../deploy/staging
      description: The manifests the deploy target writes, applied into the namespace library-lending-staging; the Secret library-lending-secrets is made from the vendor's secret store before the first apply.
    configuration:
      dailyRate: "0.50"
      notificationChannelUrl: "https://notify-staging.library.example/events"
  production:
    description: The library's own hosts, which its IT staff build for and run.
    environment: production
    servers:
      - { name: api, url: "https://library.example", zone: application, listens: [{ port: 8080, protocol: http }], runs: { packages: [internal/api, internal/lending] }, description: The API behind the desk screens. }
      - { name: worker, url: "http://worker.library.internal", zone: application, runs: { packages: [internal/worker, internal/lending] }, description: The host that runs the nightly jobs. }
      - { name: db, kind: database, url: "postgresql://db.library.internal:5432", zone: data, listens: [{ port: 5432, protocol: postgresql }], runs: { targets: [sql] }, description: The loans database. }
      - { name: bus, dependency: eventBus, url: "amqps://bus.library.internal:5671", zone: data, listens: [{ port: 5671, protocol: amqp }], description: "The library's broker in this environment." }
    links:
      - { from: api, to: db, port: 5432 }
      - { from: api, to: bus, port: 5671, description: The loan events. }
      - { from: worker, to: db, port: 5432 }
      - { from: worker, to: bus, port: 5671, description: LoanOverdue for each loan the job marks. }
    build:
      description: The image is built from the tagged commit with the build task, on any machine with the pinned toolchain; the binary is built with -trimpath and the module cache verified against go.sum, so the image's layers do not depend on the machine.
      task: build
      baseImages:
        - name: docker.io/library/golang:1.26-bookworm
          digest: "sha256:7d0d0ab5bcb7b2e4b9c9c0f6a1b5a4e2d3c4b5a6978879a0b1c2d3e4f5a6b7c8"
          purpose: Builds the binary.
        - name: gcr.io/distroless/static-debian12:nonroot
          digest: "sha256:3f6a5d4c3b2a19087f6e5d4c3b2a1908f7e6d5c4b3a291807f6e5d4c3b2a1908"
          purpose: Runs the binary, with no shell and no package manager.
      reproducible: The build is bit-for-bit reproducible, so the digest of the library's image equals the digest in the release notes when the same tag, toolchain and base images are used; a different digest means a different input, and the library compares the two software bills of materials to find it.
      sbom: sbom
    method:
      tool: cloud-init 24.4
      files: ../../../deploy/production
      description: One cloud-init file per host, which the deploy target writes; each host installs podman and runs its image under systemd, reading the settings from the file the deploy target writes and the secrets from /etc/library-lending/secrets.env, which the library's IT staff write on the host; the image reference and the settings are the only lines that change between releases.
    infrastructure:
      cpu: Two cores for the API host; four for the database host.
      memory: One gigabyte for the API host; four gigabytes for the database host.
      storage: Twenty gigabytes for the database at the start, growing by about one gigabyte a year, and ninety nights of dumps in the backup store.
      network: The desk's screens reach the API host over HTTPS; the API host reaches the database host and the notification service; nothing reaches the database host but the API host and the backup job.
      ports: The API host listens on 8080 behind the library's HTTPS proxy; the database host on 5432.
      services: PostgreSQL 16 and the library's notification service, which notificationChannelUrl names.
    configuration:
      dailyRate: "0.50"
      notificationChannelUrl: "https://notify.library.example/events"
    monitors:
      catalogue-latency:
        tool: Prometheus
        description: The service's request histogram for listBooks.
        alert: the desk's on-call channel
      overdue-notices-sent:
        tool: Prometheus
        description: The count of loans marked overdue against the count of LoanOverdue messages published, per night.
        alert: the desk's on-call channel

decisions:
  ADR-101:
    title: PostgreSQL numeric for money
    status: accepted
    date: "2026-10-07"
    context: The specification carries money as decimal strings with a precision and scale (ADR-002 there).
    decision: Every decimal field becomes `numeric(precision, scale)` in PostgreSQL and a decimal type in Go, never a float.
    consequences: Sums in SQL and in Go agree to the cent.
