      int: { $value: [!!int 1, !!int -1, !!int 0x1F, !!int 017, !!int 0o17, !!int 0b1, !!int 1_000, !!int _1, !!int 1_, !!int 1.5, !!int 1e3, !!int .inf, !!int true, !!int null, !!int abc, !!int "7", !!int 18446744073709551616, !!int 18446744073709551615, !!int 0b+1, !!int 2001-12-14, !!int ''] }
      float: { $value: [!!float 1, !!float -1, !!float 0x1F, !!float 017, !!float 1.5, !!float .5, !!float 1., !!float 1e3, !!float 1e400, !!float .inf, !!float -.inf, !!float .nan, !!float .Inf, !!float inf, !!float Infinity, !!float 1_0.5, !!float true, !!float null, !!float abc, !!float "2.5", !!float 18446744073709551615, !!float 0b101, !!float 0o17, !!float 0x1p3, !!float .5_0, !!float 1e-400, !!float -0] }
      str: { $value: [!!str 1, !!str 0x1F, !!str 1.5, !!str .inf, !!str true, !!str null, !!str ~, !!str 2001-12-14, !!str abc, !!str "q"] }
      bool: { $value: [!!bool true, !!bool True, !!bool TRUE, !!bool false, !!bool False, !!bool yes, !!bool no, !!bool on, !!bool off, !!bool y, !!bool 1, !!bool 0, !!bool null, !!bool abc, !!bool "true", !!bool tRue, !!bool ""] }
      null: { $value: [!!null null, !!null ~, !!null "", !!null 1, !!null true, !!null abc ] }
