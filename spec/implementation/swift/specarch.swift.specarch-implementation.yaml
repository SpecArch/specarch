# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.5.0/schema/specarch-implementation-0.1.schema.json
specarchImplementation: "0.1"

info:
  title: SpecArch toolchain in Swift
  version: 0.1.0
  description: |
    A second implementation of the specification in `spec/`, for macOS,
    built from the same specification as the Go one. It offers the validate
    and version commands and passes the same conformance cases; the
    documents, the generators, gaps, approve, diff, derive and idioms are built in Go only.

implements:
  file: ../../specarch.yaml
  version: 0.6.0-dev

stack:
  language: { name: Swift, version: "6.0", description: Swift 6 language mode with strict concurrency checking. }
  toolchain: { name: Swift Package Manager, version: "6.0", description: The swift-tools-version in Package.swift; the minimum toolchain. }
  platforms: [darwin/arm64, darwin/amd64]

libraries:
  github.com/jpsim/Yams:
    version: 6.2.2
    licence: MIT
    purpose: YAML parsing, with the libyaml C library bundled inside it. Pinned in Package.swift and Package.resolved.
  github.com/swiftlang/swift-syntax:
    version: 604.0.0
    licence: Apache-2.0
    purpose: "Parsing Swift source in the Swift reader of specarch extract, readers/swift, which writes the code-facts dump the Go build reads (ADR-087); not linked into the validator. Pinned exactly in readers/swift/Package.swift and Package.resolved, and the Go build refuses a dump another version made. SBOM scan on 2026-10-09: syft 1.54.0, grype 0.120.0 and osv-scanner 2.6.0 found no vulnerability."

layout:
  swift/Package.swift:
    description: The package. One library, one executable, one test target.
  swift/Sources/specarch:
    description: The executable; it passes the arguments to the library and exits with its status.
  swift/Sources/SpecArchKit:
    description: Everything else. Reading YAML, reading a specification tree into one document, the JSON Schema evaluator and its messages, the specification and implementation checks, the expression subset, tests and their derived cases with the rank of each, the life-cycle links, the open questions and origin, the records beside the specification, and the commands.
    implements: ["#/commands/validate", "#/commands/version", "#/entities/Diagnostic", "#/entities/SpecFile", "#/enums/Rule", "#/enums/Severity", "#/algorithms/exitStatus", "#/algorithms/referenceResolves", "#/algorithms/permissionGranted", "#/algorithms/workedExampleHolds"]
  swift/embed-schemas.sh:
    description: Writes the schemas of schema/ into the library as Swift source; a test fails when they differ.
  readers/swift:
    description: "The Swift reader of specarch extract, a package of its own with one executable, code-facts-swift: it parses Swift source with SwiftSyntax and writes the facts specarch extract swift reads as a code-facts dump (ADR-087). tools/code-facts/dump-swift.sh runs it on the tracked Swift files of a committed folder."

mappings:
  "#/entities/Diagnostic": { target: SpecArchKit.Diagnostic, description: "A struct; its description is the one-line form." }
  "#/entities/SpecFile": { target: SpecArchKit.Input, description: "A root folder, an implementation file or a file given by name; SpecArchKit.Spec reads a root folder into one merged document." }
  "#/enums/Rule": { target: SpecArchKit.Rule, description: A String enum with one case per value; a test checks they equal the design's enum. }
  "#/enums/Severity": { target: SpecArchKit.Severity }
  "#/commands/validate": { target: SpecArchKit.runValidate }
  "#/commands/version": { target: SpecArchKit.run }
  "#/commands/document": { target: SpecArchKit.run, description: "Exits 2: this build offers no document target." }
  "#/commands/gaps": { target: SpecArchKit.run, description: "Exits 2: the report is a document, built in Go only; the rules about questions are in this build." }
  "#/commands/approve": { target: SpecArchKit.run, description: "Exits 2: the record is written by the Go build only." }
  "#/commands/generate": { target: SpecArchKit.run, description: "Exits 2: this build runs no generator." }
  "#/commands/extract": { target: SpecArchKit.run, description: "Exits 2: the readers are built in Go only." }
  "#/commands/derive": { target: SpecArchKit.run, description: "Exits 2: writing tests is built in Go only; the derivation it writes is in this build." }
  "#/commands/idioms": { target: SpecArchKit.run, description: "Exits 2: listing the idioms is built in Go only; the idiom checks are in this build." }
  "#/commands/idioms diff": { target: SpecArchKit.run, description: "Exits 2, as idioms does." }
  "#/commands/diff": { target: SpecArchKit.run, description: "Exits 2: the comparison of two versions is built in Go only; the release rules are in this build." }
  "#/algorithms/exitStatus": { target: the end of SpecArchKit.runValidate }
  "#/algorithms/workedExampleHolds": { target: SpecArchKit.Checker.checkExample }
  "#/algorithms/permissionGranted": { target: SpecArchKit.Checker.checkAccess }

bindings:
  cli:
    framework: standard library
    description: "Hand-written argument handling over CommandLine.arguments, as in the Go build."

tasks:
  build: { run: swift build -c release --package-path swift, ci: true }
  test: { run: swift test --package-path swift, ci: true }
  validate-specs:
    run: swift/.build/release/specarch validate spec examples
    description: The Swift build checks the specification it was built from, and every example.
    ci: true
  embed-schemas: { run: swift/embed-schemas.sh, description: Run after a change to schema/. }
  sbom:
    run: syft dir:swift -o syft-json=sbom.json && grype sbom:sbom.json && osv-scanner scan source -r swift
    description: Run on every dependency change; the result goes in the commit message.

testing:
  framework: Swift Testing
  run: swift test --package-path swift
  platforms: [darwin/arm64]
  fixtures: The conformance suite, the tests stage of the specification, `spec/tests/`; the Swift tests read it and add none of their own.
  mocks: None. Every test runs the real program on real files.
  suites:
    conformance:
      description: |
        Runs every test folder of `spec/tests/` for the validate and version commands
        through the library's own entry point, in a copy of the case's
        folder, and compares the exit status, the standard output and the
        files after the run. It also checks that every test of those
        commands has a `case.yaml`, that the rules equal the specification's Rule enum,
        and that the embedded schemas equal the files in schema/.
      run: swift test --package-path swift --filter ConformanceTests
      level: system
      designTestsOf:
        - { command: validate }
        - { command: version }
      ci: true
    expressions:
      description: Unit tests of the expression subset, including the column CEL gives each kind of node.
      run: swift test --package-path swift --filter ExprTests
      level: unit
      implementationOnly: true
      ci: true

decisions:
  ADR-201:
    title: Swift and the Swift Package Manager, for macOS
    status: accepted
    date: "2026-10-07"
    context: The design should be implementable in a second language with nothing changed but the implementation file.
    decision: Swift 6 with the Swift Package Manager; Foundation and the standard library wherever they do the job.
    consequences: The macOS build needs no Go toolchain. It offers validate and version; generate exits 2 until a Swift generator is wanted.
  ADR-202:
    title: Yams for YAML, with SpecArch's own tag resolution
    status: accepted
    date: "2026-10-07"
    context: |
      Yams wraps libyaml and keeps every node's line, counted from 1, with a
      block scalar's line on its indicator, as yaml.v3 does. It leaves plain
      scalars untagged, and it refuses a repeated key outright, reporting
      only where the mapping starts.
    decision: |
      Parse with Yams and resolve plain scalars by YAML 1.2's core schema
      (null, bool, int, float, timestamp), as yaml.v3 does. When Yams refuses
      a repeated key, rename every later repeat in the text, keeping all
      lines in place, and parse again, so each repeat is reported on its own
      line with its path. The repeat keeps its own name in the node tree and
      is left out of the plain value, as yaml.v3 does, so merging the files
      of a specification sees what the Go build sees. Report a YAML error's
      line by the rule yaml.v3 uses: the line its context starts, or the
      problem's line when the context is on the first line; a scanner error
      on that line, a parser error on the line before, corrected for the
      unclosed-block messages.
    consequences: |
      Diagnostics agree line for line with the Go build. For a few broken
      files libyaml's newer version inside Yams explains the error
      differently from yaml.v3 (an unclosed quote is one); the line and the
      rule may then differ. A key repeated inside a flow mapping, such as
      `{ a: 1, a: 2 }`, is refused as yaml_syntax at the mapping, where the
      Go build reports duplicate_key for the repeat and checks the rest.
  ADR-203:
    title: A JSON Schema evaluator for exactly the keywords the schemas use
    status: accepted
    date: "2026-10-07"
    context: |
      No Swift JSON Schema library reports errors in the shape the
      diagnostics need, and the messages must be the same sentences as the
      Go build's.
    decision: |
      A small evaluator in SpecArchKit for the keywords of the two schemas.
      Loading a schema with any other keyword fails, and a test loads both,
      so a schema change cannot be ignored without anyone noticing. Regular
      expressions run on ICU through NSRegularExpression, not RE2; the
      schemas' patterns mean the same in both.
    consequences: The schemas stay the single definition. A new keyword in a schema is a failing test until the evaluator implements it.
  ADR-204:
    title: A hand-written parser for the CEL subset, with CEL's positions
    status: accepted
    date: "2026-10-07"
    context: There is no CEL parser for Swift, and error columns must match the Go build's, which come from cel-go.
    decision: |
      A recursive-descent parser of the subset with CEL's precedence. It
      places an identifier at its first character, an operator at the
      operator and a call at its opening bracket, as cel-go does, and
      refuses what is outside the subset with the same sentences.
    consequences: No dependency. A test pins the columns of each kind of node.
  ADR-205:
    title: Foundation Decimal for every exact number
    status: accepted
    date: "2026-10-07"
    context: The design asks for exact decimal and integer arithmetic. Swift has no arbitrary-precision number in its standard library.
    decision: Int, uint and decimal values are Foundation Decimal, exact to 38 significant digits, with range checks for int and uint as in the Go build.
    consequences: |
      Results agree with the Go build, which uses unbounded rationals,
      wherever a value has 38 digits or fewer. The design does not yet bound
      a decimal's precision; that is reported as a finding.
