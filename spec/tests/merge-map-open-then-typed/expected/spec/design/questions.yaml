    question: 'Which is right for #/entities/Holds/properties/counts/additionalProperties/type: string or integer?'
    kind: decision
    priority: must
    blocks: ['#/entities/Holds/properties/counts/additionalProperties/type']
    decidedBy: system-owner
    options: ['string, as Lending desk database has it', 'integer, as Catalogue database has it']
    consequences:
      string, as Lending desk database has it: 'The specification writes string at #/entities/Holds/properties/counts/additionalProperties/type, and the documents and code made from it follow; Catalogue database, which says otherwise, is then to change to match it.'
      integer, as Catalogue database has it: 'The specification writes integer at #/entities/Holds/properties/counts/additionalProperties/type, and the documents and code made from it follow; Lending desk database, which says otherwise, is then to change to match it.'
    why: 'The sources disagree: Lending desk database says string, and Catalogue database says integer. The merge keeps string, as Lending desk database, the first tree given, has it, so the field is read until the question is answered; it is not a choice between them. Catalogue database''s format int32 goes with its type and is left out.'
    cites:
      - {source: desk, clause: migrations public.holds, says: 'Table public.holds, kept in step with the catalogue''s.'}
