# yaml-language-server: $schema=../../../schema/specarch-fragment-test-1.0.schema.json
command: extract
level: system
scenario: golden
given: "a repository holding a Go module on chi whose server checks every route's audience against a setting, admits two clients named in a list literal at one route, checks the immediate caller against a list literal at one route and against a setting at another, admits one application named as a string at a route whose permission two other routes check without it, wraps that route in an event writer, and has its handler read the Txn-Token header; and at one more route calls two client checks in turn whose lists differ, the second passing a reason string after the client it names; and an implementation file naming each under permissionChecks, clientChecks, applicationChecks, callerChecks, audienceChecks and eventWriters, with the argument that carries the names"
when: "extract go is run on the module with the implementation file"
then: "it writes the literal clients as the operation's callers and the literal service as the other's via, each with a must question to declare them that holds the errors at callers and via; asks for the via of the route whose names come from the setting, naming it; asks for the through the application check narrows, naming the two routes that check the same permission without it; asks at the tokens for the audience the setting gives; asks at the operation whose handler reads the Txn-Token header for its transaction token and via; names the event writer and writes nothing from it; writes the clients both checks list as the callers of the route with two, asking which it is meant to admit; asks whether the string after the named argument is a name, writing it nowhere; and exits 0"
verifies: [SA-89]
