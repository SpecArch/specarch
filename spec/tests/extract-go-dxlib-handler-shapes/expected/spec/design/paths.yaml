        - {source: code, clause: 'api/handlers.go:73', says: 'The handler of POST /tasks/update answers with WriteResponseAsJSON(http.StatusOK, nil, utils.JSON{"task_id", "done"}).'}
        - {source: code, clause: 'api/handlers.go:78', says: 'The handler of POST /tasks/update answers with WriteResponseAsJSON(status, nil, utils.JSON{"task_id"}).'}
        - {source: code, clause: 'api/handlers.go:81', says: 'The handler of POST /tasks/update answers with WriteResponseAsJSON(http.StatusOK, nil, utils.JSON{"task_id"}).'}
