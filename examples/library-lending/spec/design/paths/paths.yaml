# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-0.1.schema.json
paths:
  /books:
    get:
      operationId: listBooks
      summary: Browse the catalogue
      permission: public
      parameters:
        - name: q
          in: query
          description: Free-text search over title and author.
          schema: { type: string, maxLength: 200 }
      listOf:
        entity: Book
        pageSize: { default: 20, maximum: 100 }
      responses:
        "200":
          description: Matching books.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Book" } }
      satisfies: [LIB-2]

  /sessions:
    post:
      operationId: signIn
      summary: Sign in with an email address and a password
      description: |
        Opens a session for the member or librarian the email address
        belongs to. The answer does not say whether the address or the
        password was wrong.
      permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, title: Email address }
                password: { type: string, format: password, minLength: 8, maxLength: 200, title: Password, writeOnly: true }
              required: [email, password]
      responses:
        "200": { description: Signed in; the session starts. }
        "201": { description: "The password is right, and the account confirms each sign-in with a second factor: a sign-in challenge is opened for five minutes and kept with the browser, and the session starts once confirmSecondFactor accepts its code." }
        "401": { description: The email address or the password is wrong., problem: sign-in-refused }

  /sessions/current:
    get:
      operationId: getSession
      summary: Who is signed in, and what they may do
      description: |
        Answers whether the caller's session is open and the permissions
        its roles grant, so the screens show only the menu entries and
        pages the caller may open. A caller without a session is answered
        too, signed out and with no permission; the service still checks
        each operation's permission itself.
      permission: public
      responses:
        "200":
          description: The caller's session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedIn: { type: boolean, title: Signed in }
                  permissions:
                    type: array
                    title: Permissions
                    items: { type: string, maxLength: 100 }
                    maxItems: 100
                    uniqueItems: true
                required: [signedIn, permissions]

  /sessions/second-factor:
    post:
      operationId: confirmSecondFactor
      summary: Confirm a sign-in with the code of a second factor
      description: |
        Confirms the sign-in challenge signIn opened, with the six-digit
        code of the authenticator app the account set up. The session
        starts when the code is right; a challenge that is wrong five
        times, or older than five minutes, is closed, and sign-in starts
        again.
      permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: "^[0-9]{6}$", maxLength: 6, title: Code from the authenticator app }
              required: [code]
      responses:
        "200": { description: Signed in; the session starts. }
        "401": { description: "The code is wrong, or the sign-in challenge is closed.", problem: second-factor-refused }

  /password-resets:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset code
      description: |
        Sets the password of the member or librarian a reset code was
        sent to. The code is used once and expires; the confirmation is
        sent with the password, so the service checks it too.
      permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, minLength: 1, maxLength: 200, title: Reset code }
                newPassword: { type: string, format: password, minLength: 8, maxLength: 200, title: New password, writeOnly: true }
                confirmPassword: { type: string, format: password, minLength: 8, maxLength: 200, title: New password again, writeOnly: true }
              required: [code, newPassword, confirmPassword]
      responses:
        "204": { description: The password is set; sign in with it. }
        "409": { description: "The reset code is wrong, used or expired.", problem: reset-code-refused }

  /members:
    get:
      operationId: listMembers
      summary: List members
      permission: members.read
      parameters:
        - { name: tier, in: query, schema: { $ref: "#/enums/MembershipTier" } }
      listOf:
        entity: Member
        sortable: [fullName, joinedOn]
        searchable: [cardNumber, fullName]
        pageSize: { default: 20, maximum: 100 }
      responses:
        "200":
          description: All members.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Member" } }
    post:
      operationId: createMember
      summary: Register a new member
      permission: members.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, format: email }
                tier: { $ref: "#/enums/MembershipTier" }
                address: { $ref: "#/schemas/PostalAddress" }
                phones: { type: array, items: { $ref: "#/schemas/PhoneNumber" }, maxItems: 3 }
              required: [fullName, email, tier]
      responses:
        "201":
          description: The member, with card number assigned.
          content:
            application/json:
              schema: { $ref: "#/entities/Member" }
        "409": { description: Email address already registered., problem: email-taken }
      satisfies: [LIB-1]

  /members/{memberId}:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMember
      summary: One member with their loans
      permission: members.read
      responses:
        "200":
          description: The member, with their loans.
          content:
            application/json:
              schema: { $ref: "#/views/MemberWithLoans" }
        "404": { description: No such member., problem: member-not-found }

  /members/{memberId}/loans:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: lendCopies
      summary: Lend several copies to a member at once
      description: |
        Lends every copy asked for, or none: refused when the loans would take
        the member past the open loans their tier allows, the member has
        outstanding fees, or a book has no copy available.
      permission: loans.create
      idempotencyKey: Idempotency-Key
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chosen by the client for each new set of loans, so that a lost answer can be retried without lending twice.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loans:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    type: object
                    properties:
                      bookId: { type: string, format: uuid }
                    required: [bookId]
              required: [loans]
      responses:
        "201":
          description: The new loans, each with its due date set from the member's tier.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loans: { type: array, items: { $ref: "#/entities/Loan" } }
                required: [loans]
        "404": { description: No such member., problem: member-not-found }
        "409": { description: "Loan limit reached, fees outstanding, no copy available, or due too late.", problem: lending-refused }
      satisfies: [LIB-3]

  /members/{memberId}/deactivate:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: deactivateMember
      summary: Deactivate a member, who then borrows nothing more
      permission: members.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: "Why the member is deactivated, kept with the record." }
              required: [reason]
      responses:
        "200":
          description: The member, inactive.
          content:
            application/json:
              schema: { $ref: "#/entities/Member" }
        "404": { description: No such member., problem: member-not-found }

  /loans:
    get:
      operationId: listLoans
      summary: List loans
      permission: loans.read
      parameters:
        - { name: status, in: query, schema: { $ref: "#/enums/LoanStatus" } }
        - { name: memberId, in: query, schema: { type: string, format: uuid } }
      listOf:
        entity: Loan
        sortable: [dueOn, loanedAt]
        pageSize: { default: 20, maximum: 100 }
      responses:
        "200":
          description: Matching loans.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Loan" } }
    post:
      operationId: createLoan
      summary: Lend a copy to a member
      description: |
        Refused when the member already holds the maximum open loans for their
        tier, has outstanding fees, or the book has no copy available, or when
        the copy is due later than the member's tier allows.
      permission: loans.create
      idempotencyKey: Idempotency-Key
      limits:
        maxRequestBytes: 1024
        rate: { requests: 30, per: PT1M, burst: 60 }
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chosen by the client for each new loan, so that a lost answer can be retried without lending twice.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId: { type: string, format: uuid }
                bookId: { type: string, format: uuid }
                lentOn: { type: string, format: date }
                dueOn: { type: string, format: date }
              required: [memberId, bookId, lentOn, dueOn]
      responses:
        "201":
          description: The new loan.
          content:
            application/json:
              schema: { $ref: "#/entities/Loan" }
        "409": { description: "Loan limit reached, fees outstanding, or no copy available.", problem: lending-refused }
      emits: [loan.lifecycle/LoanCreated]
      satisfies: [LIB-3]

  /loans/{loanId}/return:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: returnLoan
      summary: Record the return of a copy
      permission: loans.return
      algorithm: lateFee
      responses:
        "200":
          description: The closed loan, with the late fee computed.
          content:
            application/json:
              schema: { $ref: "#/entities/Loan" }
        "409": { description: The loan is already closed., problem: loan-closed }
        "503": { description: "The fee ledger is unavailable, and the loan stays as it was.", problem: fee-ledger-unavailable }
      emits: [loan.lifecycle/LoanReturned]
      calls: [feeLedger]
      guard: { entity: Loan, precondition: 'status == "open" || status == "overdue"', recordsChanged: 1 }
      satisfies: [LIB-4, LIB-5]

  /loans/{loanId}/lost:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reportLost
      summary: Record a lost copy and charge its replacement cost
      permission: loans.return
      responses:
        "200":
          description: The closed loan.
          content:
            application/json:
              schema: { $ref: "#/entities/Loan" }
        "409": { description: The loan is already closed., problem: loan-closed }
        "503": { description: "The fee ledger is unavailable, and the loan stays as it was.", problem: fee-ledger-unavailable }
      emits: [loan.lifecycle/LoanLost]
      calls: [feeLedger]
      guard: { entity: Loan, precondition: 'status == "open" || status == "overdue"', recordsChanged: 1 }

  /loans/{loanId}/fee-waivers:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestFeeWaiver
      summary: Ask for a loan's late fee to be waived
      description: |
        Starts the fee-waiver workflow. The fee stands until a desk supervisor
        approves the request.
      permission: fees.request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: string, format: decimal, precision: 10, scale: 2 }
                reason: { type: string, minLength: 1, maxLength: 500 }
              required: [amount, reason]
      responses:
        "202":
          description: The request is accepted and waits for a desk supervisor.
          content:
            application/json:
              schema: { $ref: "#/entities/FeeWaiverRequest" }
      satisfies: [LIB-8]

  /fee-waivers:
    get:
      operationId: listFeeWaivers
      summary: List the requests to waive a late fee that wait for a desk supervisor
      permission: fees.approve
      listOf:
        entity: FeeWaiverRequest
        pageSize: { default: 20, maximum: 100 }
      responses:
        "200":
          description: The waiting requests.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/FeeWaiverRequest" } }
      satisfies: [LIB-8]

  /fee-waivers/{waiverId}/waive:
    parameters:
      - { name: waiverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: waiveFee
      summary: Waive the late fee an approved request names
      permission: fees.approve
      responses:
        "200":
          description: The fee is waived.
          content:
            application/json:
              schema: { $ref: "#/entities/FeeWaiverRequest" }
      satisfies: [LIB-8]

  /fee-waivers/{waiverId}/approve:
    parameters:
      - { name: waiverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveFeeWaiver
      summary: Approve a request to waive a late fee, at its approve step
      description: |
        Answers the approve step of the fee-waiver workflow. The fee is
        waived once the request is approved.
      permission: fees.approve
      responses:
        "200":
          description: The request is approved.
          content:
            application/json:
              schema: { $ref: "#/entities/FeeWaiverRequest" }
      satisfies: [LIB-8]

  /fee-waivers/{waiverId}/refuse:
    parameters:
      - { name: waiverId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: refuseFeeWaiver
      summary: Refuse a request to waive a late fee, at its approve step, saying why
      description: |
        Answers the approve step of the fee-waiver workflow. The request
        ends refused and the fee stands; the reason is kept with it for the
        librarian who asked.
      permission: fees.approve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: "Why the request is refused, kept with it." }
              required: [reason]
      responses:
        "200":
          description: The request is refused.
          content:
            application/json:
              schema: { $ref: "#/entities/FeeWaiverRequest" }
      satisfies: [LIB-8]
