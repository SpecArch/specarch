# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.5.0/schema/specarch-design-0.1.schema.json
specarch: "0.1"
info:
  title: Pages of web/pages
  version: 0.1.0
  description: |
    The pages and operations the file-system router rooted at web/pages serves, read from the files git tracks there at commit ca6b70e0078ed565818bb130017a6f3a9ce7a8da, with the content of each page that has a schema file from that file. Every page and operation cites its file; what the files' places and the schemas do not say is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: ca6b70e0078ed565818bb130017a6f3a9ce7a8da
    url: ../repo
    clauses:
      - {clause: web/package.json, title: The package that names the framework}
      - {clause: 'web/pages/api/members/[memberId].js', title: 'The route file of /api/members/{memberId}'}
      - {clause: web/pages/api/members/index.js, title: The route file of /api/members}
      - {clause: web/pages/api/ping.js, title: The route file of /api/ping}
      - {clause: web/pages/index.jsx, title: The page file of /}
      - {clause: web/proxy.js, title: Middleware the router runs before the routes it covers}
      - {clause: web/src/auth.js, title: 'Source the router''s files import, read through the code-facts dump'}
