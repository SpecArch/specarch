questions:
  Q-1:
    question: For the page at /members, what are its kind (list, form, view or task), its title, the entity it shows, the operation it reads, the operation it submits to and the columns it lists?
    kind: decision
    priority: must
    blocks: ['#/pages/members/kind', '#/pages/members/title', '#/pages/members/entity', '#/pages/members/source', '#/pages/members/submit', '#/pages/members/columns']
    decidedBy: system-owner
    why: The folders name a page's route and not what it shows.
  Q-2:
    question: Which permission does the page at /members check, or is it open to everyone (public)?
    kind: decision
    priority: must
    blocks: ['#/pages/members/permission']
    decidedBy: system-owner
    why: The folders name a page's route and not who may open it, and a page open to everyone is how an open screen is usually found, so it is asked, never assumed.
  Q-3:
    question: The page at /sign-in submits to operation signIn, which its schema names; this tree does not declare it, so it waits for the tree that does. Is it that operation?
    kind: decision
    priority: must
    blocks: ['#/pages/sign-in/submit']
    decidedBy: system-owner
    names: signIn
    why: The schema names the operation and not its method or path, so the page's submit waits for the tree that declares it; specarch merge writes it once one does.
  Q-4:
    question: 'Not held: app/sign-in/page.schema.ts: entity Member is for a list, a form or a view, and the page is a task, which submits without loading a record; left out. Does the specification need it, written another way or described by hand?'
    kind: decision
    priority: could
    blocks: ['#/pages/sign-in']
    decidedBy: system-owner
    why: The source says it, and the meta-model cannot hold it as the source writes it, so the reader left it out or wrote it as the question says. Nothing waits for the answer.
    cites:
      - {source: code, clause: app/sign-in/page.schema.ts, says: 'Not held: entity Member is for a list, a form or a view, and the page is a task, which submits without loading a record; left out.'}
