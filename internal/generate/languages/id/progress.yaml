translations:
  "# %s: progress": "# %s: progres"
  "Version %s of the specification: %s, %s, from the specification and the records beside it. Every figure is counted from what the specification and its records hold; no estimate is made, and an effort nobody recorded is shown as missing.": "Spesifikasi versi %s: %s, %s, dari spesifikasi dan record di sampingnya. Setiap angka dihitung dari isi spesifikasi dan record-nya; tidak ada estimasi yang dibuat, dan effort yang tidak dicatat siapa pun ditampilkan sebagai belum ada."
  "open question": "pertanyaan terbuka"
  "open questions": "pertanyaan terbuka"
  "This document is for everyone: the internal elements, and the questions only about them, are not counted.": "Dokumen ini untuk semua orang: elemen internal, dan pertanyaan yang hanya tentang elemen itu, tidak dihitung."
  "Size": "Ukuran"
  "The elements of each stage, a section of named elements counted by its entries and a section that holds one thing, such as the release, as one. The open questions are counted under Open work, not here.": "Elemen di tiap stage: bagian yang berisi elemen bernama dihitung per entry, dan bagian yang hanya berisi satu hal, seperti release, dihitung satu. Pertanyaan terbuka dihitung di Pekerjaan terbuka, bukan di sini."
  "| Stage | Elements | Sections |": "| Stage | Elemen | Bagian |"
  "| Total | %d | |": "| Total | %d | |"
  "Open work": "Pekerjaan terbuka"
  "Unheard roles": "Role yang belum didengar"
  "The validator warns no role unheard.": "Validator tidak memberi warning role yang belum didengar."
  "%s the validator warns unheard: a role that something accepted relies on, while no record shows it was heard.": "%s yang diberi warning belum didengar oleh validator: role yang diandalkan oleh sesuatu yang sudah diterima, sementara tidak ada record yang menunjukkan role itu pernah didengar."
  "role": "role"
  "roles": "role"
  "Stakeholder list": "Daftar stakeholder"
  "Effort": "Effort"
  "Burn-up": "Burn-up"
  "Confirmed: %s confirmed the list of %s complete on %s": "Dikonfirmasi: %s mengonfirmasi daftar %s sudah lengkap pada %s"
  "no role named": "tidak ada role yang disebut"
  "no date written": "tidak ada tanggal tertulis"
  ", recorded in the source ": ", dicatat di sumber "
  "The validator marks the confirmation with %s:": "Validator menandai konfirmasi ini dengan %s:"
  "problem": "masalah"
  "problems": "masalah"
  "Not confirmed: the open must %s %s %s up the list of %s until %s answered, so a role nobody has named yet may still be missing.": "Belum dikonfirmasi: %s must terbuka %s %s daftar %s sampai %s dijawab, jadi role yang belum disebut siapa pun mungkin masih belum ada."
  "question": "pertanyaan"
  "questions": "pertanyaan"
  "holds": "menahan"
  "hold": "menahan"
  "it is": "pertanyaan itu"
  "they are": "pertanyaan-pertanyaan itu"
  "Not confirmed: the specification records no role confirming the list of %s complete, so a role nobody has named yet may still be missing.": "Belum dikonfirmasi: spesifikasi tidak mencatat role yang mengonfirmasi daftar %s sudah lengkap, jadi role yang belum disebut siapa pun mungkin masih belum ada."
  "No question is open.": "Tidak ada pertanyaan yang terbuka."
  "- %s: priority %s (not counted as must, should or could; one of them is expected)": "- %s: prioritas %s (tidak dihitung sebagai must, should, atau could; seharusnya salah satunya)"
  "%s: %d must, %d should, %d could": "%s: %d must, %d should, %d could"
  ", %d with another priority": ", %d dengan prioritas lain"
  ", by the role that decides each or must provide what it asks for. A must question holds up everything that reads what it blocks; a should question holds up code generation and approval; a could question holds up nothing. The questions document lists each one.": ", per role yang memutuskan masing-masing atau yang harus memberikan apa yang ditanyakan. Pertanyaan must menahan semua yang membaca bagian yang diblokirnya; pertanyaan should menahan code generation dan approval; pertanyaan could tidak menahan apa pun. Dokumen pertanyaan mendaftar semuanya."
  "| Decided by | Must | Should | Could | Other priority | Total |": "| Diputuskan oleh | Must | Should | Could | Prioritas lain | Total |"
  "| Decided by | Must | Should | Could | Total |": "| Diputuskan oleh | Must | Should | Could | Total |"
  "Total": "Total"
  "%s a priority that is not must, should or could:": "%s prioritas yang bukan must, should, atau could:"
  "question has": "pertanyaan punya"
  "questions have": "pertanyaan punya"
  "%s (not counted: not a number; a positive number of hours is expected)": "%s (tidak dihitung: bukan angka; seharusnya jumlah jam yang positif)"
  "%s (not counted: not above 0; a positive number of hours is expected)": "%s (tidak dihitung: tidak di atas 0; seharusnya jumlah jam yang positif)"
  "a mapping": "sebuah mapping"
  "No change request is recorded.": "Tidak ada change request yang tercatat."
  "%s recorded beside the specification, with the effort each records in hours. ": "%s tercatat di samping spesifikasi, dengan effort yang dicatat masing-masing dalam jam. "
  "change request is": "change request"
  "change requests are": "change request"
  "Estimated": "Estimasi"
  "Spent": "Terpakai"
  " %d of %d %s no effort and %s counted as missing: %s. No figure is filled in.": " %d dari %d %s effort dan%.0s dihitung sebagai belum ada: %s. Tidak ada angka yang diisikan."
  "records": "tidak mencatat"
  "record": "tidak mencatat"
  "is": ""
  "are": ""
  " Every change request records its effort.": " Setiap change request mencatat effort-nya."
  "| Change request | Status | Estimated hours | Spent hours |": "| Change request | Status | Estimasi jam | Jam terpakai |"
  ": no change request records it.": ": tidak ada change request yang mencatatnya."
  "%s: %s hours over the %d of %d that record it.": "%s: %s jam dari %d di antara %d yang mencatatnya."
  "names no section that Size counts": "tidak menyebut bagian yang dihitung di Ukuran"
  "names a whole section, not one element": "menyebut satu bagian utuh, bukan satu elemen"
  "names an extension key, not an element": "menyebut key extension, bukan elemen"
  "names an element the specification does not hold": "menyebut elemen yang tidak ada di spesifikasi"
  "One point per release, oldest first. Each counts, from the first release to it, the distinct elements that the change requests it includes name under affects adds and changes, a requirement named by its ID or its pointer once and a pointer inside an element as that element, and a reference to what Size does not count named below the table and left out: approved once the request's decision approves it and it is not withdrawn or rejected, generated once the request is implemented or released, so the specification and the code carry it. The specification holds %s now, the scope line. A release that includes no change request does not rise; the elements the first version was written with are counted under Size, not here.": "Satu titik per release, yang terlama lebih dulu. Masing-masing menghitung, dari release pertama sampai release itu, elemen berbeda yang disebut di affects adds dan changes oleh change request yang dimuatnya; requirement yang disebut dengan ID atau pointer-nya dihitung sekali, pointer di dalam sebuah elemen dihitung sebagai elemen itu, dan referensi ke apa yang tidak dihitung Ukuran disebut di bawah tabel dan tidak dihitung: approved begitu keputusan request-nya meng-approve dan tidak di-withdraw atau di-reject, generated begitu request-nya diimplementasikan atau di-release, sehingga spesifikasi dan code memuatnya. Spesifikasi saat ini memuat %s, yaitu garis scope. Release yang tidak memuat change request tidak naik; elemen yang ada sejak versi pertama ditulis dihitung di Ukuran, bukan di sini."
  "No release is recorded.": "Tidak ada release yang tercatat."
  "| Release | Status | Date | Change requests | Elements approved | Elements generated | Elements in the specification |": "| Release | Status | Tanggal | Change request | Elemen approved | Elemen generated | Elemen di spesifikasi |"
  "- %s names %s: not counted, it %s.": "- %s menyebut %s: tidak dihitung, karena %s."
  "not yet": "belum"
  "%s under affects %s not counted, since Size does not count what %s:": "%s di affects%.0s tidak dihitung, karena Ukuran tidak menghitung apa yang %s:"
  "reference": "referensi"
  "references": "referensi"
  "it names": "disebutnya"
  "they name": "disebutnya"
