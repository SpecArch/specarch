  api:
    claim: aud
    forwards:
      - {value: 'https://loans.library.example', dependency: loans}
      - {value: 'https://catalogue.library.example', dependency: catalogue}
      - {value: 'https://reports.library.example', dependency: reports}
    origin: stated
    cites:
      - {source: gateway-table, clause: gateway, says: 'The gateway api forwards by the claim aud, to the services of 3 rows.'}
      - {source: gateway-table, clause: gateway, says: 'Row 1 of the gateway table: Forwards a request whose aud is https://loans.library.example to loans.'}
      - {source: gateway-table, clause: gateway, says: 'Row 2 of the gateway table: Forwards a request whose aud is https://catalogue.library.example to catalogue.'}
      - {source: gateway-table, clause: gateway, says: 'Row 3 of the gateway table: Forwards a request whose aud is https://reports.library.example to reports.'}
