permissions:
  loans.read:
    origin: inferred
    why: 'dxlib names the privilege LOANS.READ, and by the rule of ADR-076 a privilege named in capitals, digits and underscores, in segments joined by dots, is the permission of that name in lower case with every underscore a dot: loans.read.'
    cites:
      - {source: code, clause: 'api/endpoints.go:17', says: POST /loans/list checks LOANS.READ in its privileges.}
  loans.write:
    origin: stated
    cites:
      - {source: code, clause: 'api/endpoints.go:38', says: POST /loans/renew checks loans.write in its privileges.}
paths:
  /loans/list:
    # specarch-problem: warning: test_case_missing: operation postLoansList has no red scenario for "denied without loans.read"; add under tests post-loans-list-denied-without-loans-read: { operation: postLoansList, scenario: red, covers: [denied without loans.read], given: "a caller without loans.read", when: "postLoansList is called", then: "it is refused as not allowed" } [test_case_missing@design/paths.yaml#/paths/~1loans~1list/post]
    # specarch-problem: warning: test_golden_missing: operation postLoansList has no golden scenario; add one under tests, for example post-loans-list-succeeds: { operation: postLoansList, scenario: golden, given: "a caller with loans.read", when: "postLoansList is called", then: "it succeeds" } [test_golden_missing@design/paths.yaml#/paths/~1loans~1list/post]
    post:
      operationId: postLoansList
      summary: List loans
      description: Lists the loans.
      permission: loans.read
      responses:
        "404":
          problem: loan-not-found
        "422": {}
      origin: stated
      cites:
        - {source: code, clause: 'api/endpoints.go:17', says: 'NewEndPoint registers POST /loans/list; its handler is ListLoans, its middlewares are RequireSession, and it checks LOANS.READ.'}
        - {source: code, clause: 'api/loans.go:10', says: The handler of POST /loans/list reads the parameter member and answers 404 LOAN_NOT_FOUND and 422 LOAN_OVERDUE.}
  /loans/renew:
    # specarch-problem: warning: test_case_missing: operation postLoansRenew has no red scenario for "denied without loans.write"; add under tests post-loans-renew-denied-without-loans-write: { operation: postLoansRenew, scenario: red, covers: [denied without loans.write], given: "a caller without loans.write", when: "postLoansRenew is called", then: "it is refused as not allowed" } [test_case_missing@design/paths.yaml#/paths/~1loans~1renew/post]
    # specarch-problem: warning: test_golden_missing: operation postLoansRenew has no golden scenario; add one under tests, for example post-loans-renew-succeeds: { operation: postLoansRenew, scenario: golden, given: "a caller with loans.write", when: "postLoansRenew is called", then: "it succeeds" } [test_golden_missing@design/paths.yaml#/paths/~1loans~1renew/post]
    post:
      operationId: postLoansRenew
      summary: Renew a loan
      description: Renews a loan for another period.
      permission: loans.write
      responses:
        "400": {}
        "409": {}
        "422": {}
      origin: stated
      cites:
        - {source: code, clause: 'api/endpoints.go:38', says: 'NewEndPoint registers POST /loans/renew; its handler is a function literal, it has no middleware, and it checks loans.write.'}
        - {source: code, clause: 'api/endpoints.go:40', says: 'The handler of POST /loans/renew reads the parameters id and note and answers 409 LOAN_OVERDUE, 409 LOAN_ON_HOLD, 422 and 400.'}
  /loans/{id}:
    parameters:
      - {name: id, in: path, required: true}
    # specarch-problem: warning: test_case_missing: operation getLoansById has no red scenario for "not found id"; add under tests get-loans-by-id-not-found-id: { operation: getLoansById, scenario: red, covers: [not found id], given: "no record has that id", when: "getLoansById is called with that id", then: "it is refused as not found" } [test_case_missing@design/paths.yaml#/paths/~1loans~1{id}/get]
    # specarch-problem: warning: test_golden_missing: operation getLoansById has no golden scenario; add one under tests, for example get-loans-by-id-succeeds: { operation: getLoansById, scenario: golden, given: "any caller", when: "getLoansById is called with values inside every limit", then: "it succeeds" } [test_golden_missing@design/paths.yaml#/paths/~1loans~1{id}/get]
    get:
      operationId: getLoansById
      summary: Show a loan
      origin: stated
      cites:
        - {source: code, clause: 'api/endpoints.go:21', says: 'NewEndPoint registers GET /loans/{id}; its handler is handlers.ShowLoan, it has no middleware, and it checks no privilege.'}
errors:
  loan-not-found:
    status: 404
    origin: stated
    cites:
      - {source: code, clause: 'api/loans.go:13', says: Answers 404 with the reason LOAN_NOT_FOUND.}
  loan-on-hold:
    status: 409
    origin: stated
    cites:
      - {source: code, clause: 'api/endpoints.go:49', says: Answers 409 with the reason LOAN_ON_HOLD.}
