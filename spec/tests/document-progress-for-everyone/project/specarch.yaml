specarch: "1.0.0"
info: { title: Case, version: 1.1.0 }
stakeholders:
  librarian: { description: Runs the lending desk. }
needs:
  NEED-1:
    statement: Members may not take more than they bring back.
    stakeholders: [librarian]
requirements:
  CASE-1:
    statement: A member shall borrow at most five books at once.
    kind: functional
    priority: must
    status: proposed
    acceptance: [A sixth loan is refused.]
    needs: [NEED-1]
  CASE-2:
    statement: Staff shall see which loans look risky.
    kind: functional
    priority: should
    status: proposed
    acceptance: [The desk's page marks each risky loan.]
    needs: [NEED-1]
    audience: internal
questions:
  Q-1:
    question: How many books may a member hold?
    kind: decision
    priority: must
    blocks: ["#/requirements/CASE-1"]
    decidedBy: librarian
  Q-2:
    question: What makes a loan risky?
    kind: decision
    priority: should
    blocks: ["#/requirements/CASE-2"]
    decidedBy: librarian
