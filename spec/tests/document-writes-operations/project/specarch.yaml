specarch: "0.1"
info: { title: Shop, version: 1.0.0, description: A small shop that takes orders. }
environments:
  staging: { description: Where a release is tried., promotesTo: production }
  production: { description: The shop's host. }
entities:
  Order:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      total: { type: string, format: decimal, precision: 10, scale: 2 }
    required: [id, total]
    primaryKey: [id]
permissions:
  orders.write: { description: Take an order. }
  orders.read: { description: See orders. }
  orders.approve: { description: Approve a large order. }
roles:
  clerk: { description: Staff at the till., permissions: [orders.write] }
  night-batch: { description: The nightly jobs., permissions: [orders.read] }
  manager: { description: The shop's manager., permissions: [orders.approve] }
dependencies:
  broker:
    description: The shop's message broker.
    kind: messageBroker
    protocol: amqp
    timeout: PT1S
  payments:
    description: The card payment provider.
    protocol: https
    timeout: PT5S
    why: A customer waits at the till, so a slow provider is given up after five seconds.
channels:
  order.events:
    description: What happens to an order.
    carriedBy: [broker]
    messages:
      OrderTaken: { summary: An order was taken., payload: { $ref: "#/entities/Order" } }
      OrderApproved: { summary: A large order was approved., payload: { $ref: "#/entities/Order" } }
  till.local:
    description: The till's own queue.
    messages:
      ReceiptPrinted: { summary: A receipt was printed., payload: { $ref: "#/entities/Order" } }
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Take an order
      permission: orders.write
      emits: [order.events/OrderTaken]
      calls: [payments]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/entities/Order" } } }
      responses:
        "201":
          description: The order.
          content: { application/json: { schema: { $ref: "#/entities/Order" } } }
  /orders/{orderId}/approval:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: askApproval
      summary: Ask the manager to approve a large order
      permission: orders.write
      responses:
        "202": { description: The order waits for the manager. }
workflows:
  large-order:
    description: An order is approved by the manager within a day after it is taken.
    trigger: askApproval
    subject: Order
    steps:
      - { name: approve, kind: approval, approvers: [manager], permission: orders.approve, deadline: P1D, onDeadline: refuse }
    emits: [order.events/OrderApproved]
jobs:
  settleDay:
    description: Every night, settles the day's card payments.
    trigger: { schedule: "0 1 * * *" }
    role: night-batch
    calls: [payments]
    retries: { limit: 3, then: deadLetter }
    deadLetter:
      role: manager
      description: A payment that failed every try is kept on the back-office list of unsettled payments, with the provider's answer to its last try.
      steps:
        - { name: Look at it, action: "Open the unsettled payments, and read the provider's answer to the payment's last try.", check: Why it failed is known. }
        - { name: Try it again, action: "If the provider has answered since, start settleDay by hand for that payment.", check: The payment is settled and leaves the list. }
        - { name: Discard it, action: "If the payment is refused for good, discard it from the list and tell the customer.", check: The list no longer holds it and the customer knows. }
  countStock:
    description: Every night, counts the stock left on the shelves.
    trigger: { schedule: "0 3 * * *" }
    role: night-batch
    retries: { limit: 1, then: deadLetter }
  printReceipt:
    description: Prints a receipt for each order taken.
    trigger: { consumes: order.events/OrderTaken }
    role: night-batch
    emits: [till.local/ReceiptPrinted]
    retries: { limit: 2, then: discard }
  sweep:
    description: Removes stale sessions.
    trigger: { every: PT1H }
    role: night-batch
configuration:
  taxRate:
    description: The sales tax rate.
    secret: false
    schema: { type: string, format: decimal, precision: 4, scale: 2 }
  databaseUrl:
    description: Where the database is; it comes from the host's secret store.
    secret: true
    schema: { type: string, format: uri }
monitors:
  till-latency:
    description: How long taking an order takes.
    environment: production
    objective: Nine orders in ten are taken within a second over each day.
    response:
      - { name: Look at the provider, action: Open the payment provider's status page., check: The provider's state is known. }
      - { name: Tell the shop, action: "If the provider is slow, tell the staff to take cash.", check: The staff know. }
  receipts-printed:
    description: Whether every order taken has its receipt.
    environment: production
    objective: Every order taken in a day has a printed receipt by closing.
backup:
  description: The orders are dumped every night.
  steps:
    - { name: Dump, action: Dump the database to the backup store., check: The dump restores on a scratch host. }
