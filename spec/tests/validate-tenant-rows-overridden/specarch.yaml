specarch: "0.3"
info: { title: Case, version: 1.0.0 }
entities:
  Organisation:
    type: object
    properties:
      id: { type: string, maxLength: 36 }
    required: [id]
    primaryKey: [id]
  Loan:
    type: object
    properties:
      id: { type: string, maxLength: 36 }
      organisationId: { type: string, maxLength: 36 }
      memberId: { type: string, maxLength: 36 }
    required: [id, organisationId, memberId]
    primaryKey: [id]
  Ledger:
    type: object
    properties:
      id: { type: string, maxLength: 36 }
      organisationId: { type: integer, format: int32 }
    required: [id, organisationId]
    primaryKey: [id]
caller:
  description: Who is making the call.
  properties:
    organisationId: { type: string, maxLength: 36, description: The organisation every caller belongs to. }
    memberId: { type: [string, "null"], maxLength: 36, description: The member signed in; null for staff. }
tenant:
  property: organisationId
  key: organisationId
permissions:
  loans.read: { description: See loans. }
roles:
  member:
    description: A card holder, who sees only their own loans.
    permissions: [loans.read]
    rows:
      Organisation: id == caller.organisationId
      Loan: organisationId == caller.organisationId && ownerId == caller.memberId
      Ledger: id == caller.organisationId
  staff:
    description: Staff of one organisation.
    permissions: [loans.read]
    rows:
      Organisation: id == caller.organisationId
      Ledger: id == caller.organisationId
