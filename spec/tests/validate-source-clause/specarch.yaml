      - { source: desk-code, clause: "migrations/001_init.sql:18", says: "The loans table checks that due_on is loaned_on plus 21." }
  CASE-2:
    statement: A member shall hold at most five loans.
    kind: functional
    priority: must
    status: accepted
    acceptance: [A sixth loan is refused.]
    verification: test
    needs: [NEED-1]
    why: The manual sets the limit.
    cites:
