translations:
  "Cases told as a sequence across the operations, requirements, entity changes and tests the design defines, grouped by topic (ADR-251); a step with a condition is an alternative or failure branch of the steps before it.": "Kasus yang diceritakan sebagai urutan lintas operasi, requirement, perubahan entity, dan test yang didefinisikan di design, dikelompokkan per topik (ADR-251); step yang punya kondisi adalah cabang alternatif atau cabang gagal dari step sebelumnya."
  "Each requirement and the scenarios whose steps name it; a requirement of priority must that no scenario names is a gap below.": "Tiap requirement dan skenario yang step-nya menyebut requirement itu; requirement berprioritas must yang tidak disebut skenario mana pun tercatat sebagai gap di bawah."
  "Each scenario, the requirements its steps name, the operations they call and the tests that check a step or prove the scenario.": "Tiap skenario, requirement yang disebut step-nya, operasi yang dipanggil, dan test yang mengecek sebuah step atau membuktikan skenarionya."
  "Requirements of priority must no scenario names": "Requirement berprioritas must yang tidak disebut skenario mana pun"
  "Requirements to scenarios": "Requirement ke skenario"
  "Scenarios to requirements": "Skenario ke requirement"
  "| Requirement | Priority | Scenarios |": "| Requirement | Prioritas | Skenario |"
  "| Scenario | Topic | Requirements | Operations | Tests |": "| Skenario | Topik | Requirement | Operasi | Test |"
  "  Note over %s,S: %d. when %s\n": "  Note over %s,S: %d. jika %s\n"
  "%d, when %s": "%d, jika %s"
  "For %s; %s, %s.": "Untuk %s; %s, %s."
  "No test proves it yet: a golden or red test names it under proves.": "Belum ada test yang membuktikannya: test golden atau red menyebutnya di proves."
  "No topic": "Tanpa topik"
  "Proved by ": "Dibuktikan oleh "
  "branch": "cabang"
  "branches": "cabang"
  "entity ": "entity "
  "entity %s: %s": "entity %s: %s"
  "requirements ": "requirement "
  "step": "step"
  "steps": "step"
  "tests ": "test "
  "| Step | Actor | Before | What happens | Exercises | Result |": "| Step | Aktor | Sebelumnya | Yang terjadi | Yang diuji | Hasil |"
  "The runtime scenarios: each case as a sequence across the operations above, the requirements and the entity changes, grouped by topic (ADR-251); a step with a condition is an alternative or failure branch.": "Skenario runtime: tiap kasus sebagai urutan lintas operasi di atas, requirement, dan perubahan entity, dikelompokkan per topik (ADR-251); step yang punya kondisi adalah cabang alternatif atau cabang gagal."
same:
  - "  actor %s as %s\n"
