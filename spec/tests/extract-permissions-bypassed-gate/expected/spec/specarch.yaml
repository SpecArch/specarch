specarch: "0.2"
info:
  title: Permissions of access
  version: 0.1.0
  description: |
    The roles and the permissions each grants, as the permission check built from access reads them, from the permission table permissions.json, made at commit d314cc28850e82347b136cc5cdf532adb2e64ee6; and the routes the router built from api registers, from the route table routes.json, made at commit 2c69862cb0dbbfc698c2b3772d73d773e51b5b80, each route that checks no permission taking the one the table's rules give it. Every role, permission and operation cites its table; what the tables do not say is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: 2c69862cb0dbbfc698c2b3772d73d773e51b5b80
    url: ../service
    clauses:
      - {clause: access, title: The grants the permission check built from here reads}
      - {clause: api, title: The routes the router built from here registers}
    reading: printed
