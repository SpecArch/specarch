specarch: "0.1"
info: { title: Case, version: 1.0.0 }
algorithms:
  same:
    inputs:
      x: { type: number, format: double }
    output: { type: number, format: double }
    formula: x
    examples:
      - { name: octal, inputs: { x: 017 }, expected: 15 }
      - { name: underscores, inputs: { x: 1_000.5 }, expected: 1000.5 }
      - { name: hexadecimal, inputs: { x: 0x1F }, expected: 31 }
      - { name: tagged binary, inputs: { x: !!float 0b101 }, expected: 5 }
      - { name: infinity, inputs: { x: .inf }, expected: .inf }
      - { name: tagged text, inputs: { x: !!float abc }, expected: 0 }
    pseudocode: return x
