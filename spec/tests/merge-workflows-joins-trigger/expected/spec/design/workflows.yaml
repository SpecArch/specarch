roles:
  desk-supervisor:
    origin: stated
    cites:
      - {source: code, clause: examples/lending-desk/sources/workflows/write-off.bpmn, says: 'Line 23: Role desk-supervisor is a potential owner of user task approve.'}
workflows:
  # specarch-problem: warning: test_case_missing: workflow write-off has no red scenario for "deadline passes at approve"; add under tests write-off-deadline-passes-at-approve: { workflow: write-off, scenario: red, covers: [deadline passes at approve], given: "a request waiting at approve", when: "P2D passes with no answer", then: "the request ends refused and the operation of writeOff is not called" } [test_case_missing.481426cb@design/workflows.yaml#/workflows/write-off]
  # specarch-problem: warning: test_case_missing: workflow write-off has no red scenario for "requester approves own request"; add under tests write-off-requester-approves-own-request: { workflow: write-off, scenario: red, covers: [requester approves own request], given: "a request made by a caller who also holds the permission of approve", when: "the requester approves it", then: "it is refused, because the person who made a request never approves it, and the request still waits" } [test_case_missing.9680fae3@design/workflows.yaml#/workflows/write-off]
  # specarch-problem: warning: test_case_missing: workflow write-off has no red scenario for "approval without the permission of approve"; add under tests write-off-approval-without-the-permission-of-approve: { workflow: write-off, scenario: red, covers: [approval without the permission of approve], given: "a caller without the permission of approve", when: "they approve a request waiting at approve", then: "it is refused as not allowed, and the request still waits" } [test_case_missing.ec3f2953@design/workflows.yaml#/workflows/write-off]
  # specarch-problem: warning: test_case_missing: workflow write-off has no red scenario for "refused at approve"; add under tests write-off-refused-at-approve: { workflow: write-off, scenario: red, covers: [refused at approve], given: "a request waiting at approve", when: "a caller with the permission of approve refuses it", then: "the request ends refused and the operation of writeOff is not called" } [test_case_missing.f61e985f@design/workflows.yaml#/workflows/write-off]
  # specarch-problem: warning: test_golden_missing: workflow write-off has no golden scenario; add one under tests, for example write-off-succeeds: { workflow: write-off, scenario: golden, given: "a caller with loans.write", when: "a request is made through requestWriteOff and is approved at approve", then: "it answers 202, then the operation of writeOff is called, and the request ends approved" } [test_golden_missing@design/workflows.yaml#/workflows/write-off]
  write-off:
    description: A lost book's loan is written off only after a desk supervisor approves, within two days.
    trigger: requestWriteOff
    steps:
      - name: approve
        kind: approval
        approvers: [desk-supervisor]
        deadline: P2D
        onDeadline: refuse
      - name: writeOff
        kind: operation
    origin: stated
    cites:
      - {source: code, clause: examples/lending-desk/sources/workflows/write-off.bpmn, says: 'Line 16: Process write-off defines the workflow, with the tasks approve and writeOffStep in that order.'}
