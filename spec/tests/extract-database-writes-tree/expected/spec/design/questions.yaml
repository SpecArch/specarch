questions:
  Q-1:
    question: 'What is a user told when each constraint of table public.branches fails: branches_fine_not_negative, branches_name_unique?'
    kind: decision
    priority: must
    blocks: ['#/entities/Branches/constraints/branches_fine_not_negative/message', '#/entities/Branches/constraints/branches_name_unique/message']
    decidedBy: system-owner
    why: A constraint carries the message a user reads, and a database catalogue holds none.
