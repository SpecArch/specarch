entities:
  Loan:
    type: object
    properties:
      id: { type: integer, format: int32 }
      dueOn: { maxLength: 20, description: When the loan is due. }
    primaryKey: [id]
    constraints:
      due_in_time: { message: A loan is due in time. }
    satisfies: [CASE-1]
questions:
  Q-1:
    question: What type does a loan's dueOn have, a date or a text the desk writes?
    kind: decision
    priority: must
    blocks: ["#/entities/Loan/properties/dueOn"]
    decidedBy: owner
  Q-2:
    question: What does the rule due_in_time check?
    kind: decision
    priority: must
    blocks: ["#/entities/Loan/constraints/due_in_time"]
    decidedBy: owner
