# yaml-language-server: $schema=../../../schema/specarch-fragment-requirements-1.0.schema.json
requirements:
  SA-17:
    statement: A specification shall be able to say what it does not yet know as an open question that names what is asked, who decides, what it blocks and how urgent it is; and the validator shall accept a required key missing exactly where a must question says it is unknown, and nowhere else.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An entity written as an empty mapping and blocked by a must question validates with no error, and its missing keys are listed under the question by specarch gaps.
      - The same entity without the question is reported with the missing keys.
      - A question whose blocks names nothing in the specification, whose decider is not a stakeholder, or which sits in another stage's folder, is reported.
      - An accepted decision that answers a question still present is reported.
    verification: test
    needs: [NEED-8]
    why: A placeholder looks like data and every tool downstream treats it as data; a question says in the specification itself that something is not known, so nothing can be built on it unseen.
    cites:
      - source: iso-29148
        clause: "5.2.6"
        says: "A complete set of requirements holds no to-be-defined, to-be-specified or to-be-resolved clause; resolving them is iterative, within a time set by risk and dependency."
      - source: ieee-830
        clause: "4.3.3"
        says: "A to-be-determined item is accompanied by why it is open, what must be done to close it, who is responsible and by when."
  SA-18:
    statement: Every element of a specification may say how it is known, stated, inferred or decided, and the validator shall check that a stated element cites a source, an inferred one says why, and a decided one names an accepted decision.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An element with origin stated and no citation, one with origin inferred and no why, and one with origin decided naming no decision or a proposed one, are each reported.
      - When the root file says the specification tracks origin, every element of a section without one is reported as a warning.
    verification: test
    needs: [NEED-8]
  SA-19:
    statement: specarch gaps shall list the open questions by stage with what each blocks and who decides, and shall say for every document and code target whether it is ready, a draft or waiting; the same text shall be the document target questions, and every other document shall mark the open questions about its elements.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A specification with two must questions in two stages prints them under their stages, lists the missing keys of a blocked element, and exits 1.
      - A specification without open questions prints that it has none and exits 0.
      - A requirements document whose requirement a question blocks starts with a Draft notice and shows the question under the requirement.
    verification: test
    needs: [NEED-8, NEED-3]
  SA-20:
    statement: specarch generate shall refuse to run a target while a must or should question blocks a section it reads, and shall refuse without a record that a stakeholder read the current documents and approved the specification's files as they are, unless --unapproved is given; specarch approve shall write that record only when the documents on disk are current.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - generate on a specification with an approval record whose digest matches writes its files; after one byte of one file changes it refuses, and runs with --unapproved.
      - approve refuses while a configured document differs from what the specification generates, and writes records/approvals/<version>.yaml once the documents are current.
    verification: test
    needs: [NEED-8]
    cites:
      - source: iso-29148
        clause: "6.3.3.6"
        says: "Requirements validation is subject to approval by the project authority and the key stakeholders."
  SA-30:
    statement: A specification built from existing documents and existing code shall cite each element to the document section or the code file and line it came from, mappings of an implementation file included, and specarch gaps shall show for every source that lists its outline which elements each section or file produced and which produced nothing.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A mapping stated without a citation is reported as origin_citation, and one inferred without a reason as origin_reason, in both builds.
      - gaps on a specification whose manual and code list their clauses prints, per source, the elements under each clause, the count of clauses that produced nothing, and every citation that names a clause outside the outline.
    verification: test
    needs: [NEED-8]
    why: The owner of an existing system reads a partial specification to find out what the documents and the code really say and where they part; a section of either that produced nothing is the first thing to look at, and it cannot be seen without the outline.
  SA-44:
    statement: specarch extract shall read one surface of an existing system into a specification tree in which every element carries its origin and cites where it was read, name the commit it read, refuse a source no commit names, and give byte-identical output for the same sources at the same commit.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - extract database on a committed catalogue dump writes a tree that validate accepts with no errors, and a second run writes the same bytes.
      - A column type the meta-model cannot hold is printed as a line naming it, and is a could question in the tree citing its table.
      - extract database reads a partition as the table it is a partition of, with one entity for the table and none for a partition, one could question at the entity listing the partitions with their bounds, and one for each constraint, index or column setting a partition has of its own, citing the partition's entry.
      - A dump older than the last change to the path it was made from, a path with changes not committed and a shallow clone are each refused with status 1.
      - extract outline on a folder writes a source listing its files as clauses, and gaps on that tree lists each of them as producing nothing.
      - extract router on a committed route table writes one operation per method and path pair, with its path parameters and the permission it checks, that validate accepts with no errors, and a route that checks no permission is a must question.
      - extract openapi on a document in dxlib's dialect writes the one privilege an operation's x-dxlib-privileges names as its permission and declares it, maps a name in dxlib_module's capitals by the rule of ADR-076 and declares that permission inferred, and asks a must question for an operation that names none, more than one, public, two names that give one permission or a name the rule cannot map.
      - extract go on a committed Go module on dxlib writes each endpoint NewEndPoint registers with literal values as an operation citing its registration's and its handler's file and line, with the parameters the handler reads and the problems it answers, in a code source with reading parsed, and asks a must question for a registration in a loop, behind a condition or computed, and for a parameter read the endpoint does not declare.
      - extract go on a committed Go module on dxlib and dxlib_module also writes each table NewModelDBTable declares with literal names as the entity extract database writes for it, the roles its seeds grant with the permissions mapped by the rule of ADR-076, and each setting it reads or a dxlib configuration file holds under configuration, and asks a must question for each gate on a setting it finds in an endpoint's middleware, in the words extract permissions uses.
      - extract permissions maps a privilege in dxlib_module's capitals by the rule of ADR-076 and declares the permission inferred, and asks a must question on a grant of EVERYTHING, a name the rule cannot map and two names that give one permission.
      - extract workflows on a committed BPMN 2.0 file writes one workflow per process with its approvals, deadlines and operation steps, that validate accepts with no errors, prints a line with the file's line for each element outside the sequential subset and writes it as a could question citing that line, and asks for the operations the file names with a must question that names them.
    verification: test
    needs: [NEED-8]
    why: Reading a large system by hand misses the element nobody happened to look at, and a citation without the commit it was read at goes stale while still looking precise; extraction is rerun to see what changed, so any difference that is not a change in the sources hides the one that is.
  SA-45:
    statement: specarch merge shall merge the partial specification trees the readers write into one specification that keeps the citations of every tree, turn every disagreement between the trees into a must question that cites both, and give byte-identical output for the same trees in the same order.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - The database and router trees of one repository, read at different commits, merge into one specification with one code source at the newer commit, which validate accepts with no errors and gaps reads, and a second run writes the same bytes.
      - Two trees that give the same key of the same element different values merge into the element without that key and a must question citing both.
      - Two trees that grant one role different permissions, neither declaring a permission the other grants the role, merge into the role with every grant of both and both trees' citations and no question on the grants; a permission one tree grants that another declares and does not grant the role is left out with a must question naming it.
      - A request body one tree gives as a reference to a named schema and another as a shape written in place merges into the reference when the shapes agree in all both say, into the element without the schema and a must question naming the difference when a key both give differs, and into the reference with a should question when only the properties listed differ; the merged specification validates with no error in either order.
      - A schema one tree gives and an entity another gives under one name merge into both entries and a must question blocking the schema, citing both, that asks whether they are one element or two; the merged specification validates with no error.
      - An element only the code has, merged with a documents tree that speaks of its section, is written inferred, starting its why with "Undocumented, from code.", with a question that is must for an operation, a permission, a role, a personal or credential field, or a source given outside, and should otherwise.
      - A tree validate reports an error in, and a source two trees declare differently, are each refused with status 1.
      - A question that names the operation a workflow's trigger refers to is left out as joined, and the trigger written, when another tree declares that operation; a name no tree declares keeps its question.
      - A printed tree and a parsed tree of one repository merge into operations with both trees' citations; the parsed tree's question whether the running system registers an operation is left out where the printed tree has it, an operation only the parsed tree declares is a must question citing its line, and one only the printed tree has a could question.
      - The same rows compare entities with a catalogue tree and roles with a permission table tree; a role both give grants what the permission table grants, a grant only a seed makes is a must question and one only the table holds a could question, and a gate on one check that both trees ask is asked once with both citations.
    verification: test
    needs: [NEED-8]
    why: The comparison between surfaces, and between the documents and the code, is where a specification extracted from an existing system finds what is wrong with it; done by hand it is skipped where the two look alike, and a choice made quietly between two sources hides the disagreement the owner must settle.
  # specarch-problem: warning: requirement_unverified: no test, commissioning check or monitor verifies requirement SA-57; add verifies: [SA-57] to the test that shows it is met [requirement_unverified@requirements/requirements/refinement.yaml#/requirements/SA-57]
  SA-57:
    statement: Every output SpecArch generates shall name the element of the specification it came from, and a remark made at the user acceptance test shall be recorded as a change request or a defect that names the build it is about, where it was seen, what was observed and what was expected, and why the result was not what was wanted, and shall enter the specification as a decision, a question or a rejection, with what it reaches listed before anything changes.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - A web page generated from a page of the specification carries the page's pointer and the pointer of each field and action it draws, and a build for an environment that shows the trace shows the pointer, the version and the digest on screen.
      - A change request in the acceptance phase without the build, what was observed or what was expected is reported, and so is one analysed without a cause.
      - A decision that answers a change request whose decision is not approved is reported.
      - The changes document lists, under each open change request, the tests, outputs, documents and approval its pointers reach.
    verification: test
    needs: [NEED-10]
    why: People never write a complete specification, and the people who will use a system see it first at the user acceptance test; a remark that cannot name the element it is about, or that has no way back into the specification, is lost or applied by hand where the next generation overwrites it.
  SA-64:
    statement: specarch extract documents shall read a document in any language whose words a vocabulary gives, the English one SpecArch ships or a project's file, write the language on the source, and give for it the elements it gives for the same document in English; specarch merge shall read a number of days in a requirement by the vocabulary of its source's language.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - extract documents with --vocabulary on a document written in a second language gives the counts, the requirements' priorities, the entities' types, required fields and sensitivities, and the questions the same document in English gives, and writes language on the source.
      - extract documents with no vocabulary named reads the document by the English vocabulary and writes the tree it wrote before vocabularies were data, byte for byte.
      - A vocabulary that lists one word in two lists of one group, such as two sensitivities, is refused with the file, the line and the two lists; a language tag SpecArch ships no vocabulary for, given with no file, is refused with the keys a vocabulary holds.
      - A leading table column headed with the vocabulary's row-number word is skipped in every table, and --given-outside writes givenOutside on the source.
      - merge reads a requirement's number of days in the units and number words of its source's language, from the shipped vocabulary or the one given with --vocabulary, and says once per source that its requirements are not compared when there is neither.
    verification: test
    needs: [NEED-8]
    why: A document in another language gave its outline and nothing else, every table a could line, since the commitment words, the headers and the units were English in the code; a wrong or missing word has to be one line in a data file that the project changes without a release.
  SA-72:
    statement: specarch check shall compare a specification with the route tables, permission tables and catalogue dumps of its code, read by the readers of specarch extract, print every difference as a problem at its entry, and exit 1 on a difference the allowlist does not name or a line of the allowlist that names none.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - An operation the router does not serve, a route the specification does not name and a permission that differs between them are each an error, at the operation or at the route's line in the dump.
      - A grant only one of the specification and the permission table holds, after each side's grants are widened by the permissions they imply, is an error at the role or at the grant's line in the dump.
      - A table, a column, a type as PostgreSQL spells it, a nullability, a generated default, a primary key, a foreign key, a unique constraint, a check constraint's name or a listed plain index that differs between the tables generate sql writes and the catalogue is an error; the text of a check and an index the mapping does not list are reports that never fail.
      - A partition of the catalogue is never compared and never a table the specification does not hold; a partitioned table's index, which the catalogue prints with ON ONLY, is compared as any plain index.
      - Each problem ends with an id that names the rule and what the difference is about, the same wherever the entry is written; a difference whose id the allowlist holds is counted and not printed, and the run exits 0 when every difference is allowed or a report.
      - A line of the allowlist that no failing difference matches or that repeats one is an error at that line; with --since, so is a line the allowlist did not hold at that revision.
    verification: test
    needs: [NEED-1, NEED-8]
    why: A specification nobody compares with its code drifts and is then read by nobody; a gate that fails on every old difference is switched off, and one whose allowlist may grow lets the drift back in.
  SA-76:
    statement: specarch extract gateway shall read a gateway table the project's printer wrote from what the gateway loads into a gateway with its forwards, dependencies and settings, asking for what the table does not say; and specarch check shall compare a specification's gateways with it.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - extract gateway on a table with two rows writes the gateway with its claim and two forwards, two dependencies of kind system with their protocol from the addresses, two settings, and must questions for the gateway's description and token and for each dependency's description and timeout, byte-identical twice; a table with a repeated value or a key the format lacks is refused with the reason; with --implementation-out and an environment it writes that deployment's servers with name, url and dependency.
      - check reports a forward only the specification holds as forward_not_served, one only the table holds as forward_not_specified, one the table sends to another dependency as forward_differs and a claim that differs as claim_differs, each an error the allowlist may name, forward_differs a report when the row names no service.
      - merge leaves the fallback question of SA-79 out when a gateway table's tree answers it, one gateway to one question over the whole merge, every tree's fallback handler's question before any tree's catch-all route's, each pass over the trees in the order given, and keeps a question no gateway is left for open with a line.
    verification: test
    needs: [NEED-8]
    why: The table a gateway forwards by was readable by nothing, and a gateway no check compares with its table drifts as every other part of a specification nobody compares with its code does.
  SA-79:
    statement: specarch extract go shall read a route whose path is a package-level constant of the module or whose method list is a package-level list no statement of the module changes as it reads a literal one, and shall ask a must question at every fallback handler and catch-all route, in place of silence or a line.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - extract go writes a route registered with Match on a package-level list of method constants and a path from a package-level constant, in the same package or another of the module, as it writes one with a literal list and path, and asks the must question naming the line for a list assigned, appended to or declared again in a second place, in its own package or in another package of the module through the import.
      - extract go asks a must question at a NoRoute, NoMethod, NotFound or MethodNotAllowed registration, at a NotFoundHandler, MethodNotAllowedHandler or HTTPErrorHandler field set on a router a name holds or a struct of the module keeps in a field, at a ServeMux pattern of / with no method given a handler that is no router, at a route whose path ends in a catch-all, a gorilla/mux variable whose pattern can match a slash among them, and at gorilla/mux's PathPrefix given a handler that is no router, each counted as a registration and blocking the design stage until the gateways section exists and gateways after; a fallback in a loop or behind a condition asks the question every registration there asks.
    verification: test
    needs: [NEED-8]
    why: A route registered through the module's own constants was a question where the code was plain, and a handler that takes every unmatched request was dropped with no question, which is the one thing a reader may never do.
  SA-85:
    statement: specarch decide shall answer an open question in one step, writing an accepted decision record under the next ID that names the question under answers and the stakeholder under decidedBy, taking the question out of its file with the author's other lines left as they were, and printing the entries the question blocked with the keys missing there; and problems.sarif shall carry for every open question, as properties of its result and of the run, what an agent queue needs to put the question to the person who decides and to feed the answer back without reading any other file.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - decide on a must question that blocks two keys of a requirement writes design/decisions/ADR-002.yaml beside ADR-001 with the question as title, the answer as decision, the question's ID under answers and the stakeholder under decidedBy, leaves the requirements file without the question and with every other line unchanged, prints the requirement's file and line with the pointer of each key, and exits 0.
      - decide on a question that is the only one of its file removes the questions key with it, and removes the file when nothing but comments is left.
      - decide is refused, with nothing written, for a question ID the specification does not hold, naming the open ones; for a stakeholder it does not declare; for a source the root file does not declare; and, when the specification tracks origin, without --source.
      - A question's result in problems.sarif carries the question's text and its Insight beside its priority, kind, decider, options and blocked entries, and the run names the specification's folder relative to the log, so that a dispatcher runs specarch decide from the log alone.
    verification: test
    needs: [NEED-8]
    why: Writing the decision and removing the question by hand is two edits in two files under a number that must be the next one, which an agent got wrong often enough; and a dispatcher that must parse the question out of a message, or open the specification to find its folder, is one that reads the text instead.
    cites:
      - source: ieee-830
        clause: "4.3.3"
        says: "A to-be-determined item is accompanied by why it is open, what must be done to close it, who is responsible and by when."
  SA-86:
    statement: specarch document comparison shall write the old documents against the refined specification, derived from the elements' origin, their citations and the decisions and from no other input - the stated elements kept from each source by clause, the inferred ones clarified with what they were concluded from, the decided ones added or corrected with their decision and its reason, and the clauses of each source's outline that no element cites - so that a reviewer sees what the refinement changed before approving.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A specification whose manual lists five clauses, with two stated elements citing it, an inferred requirement, a decided requirement citing nothing, a decided entity citing the manual and a could question citing a clause gets a comparison with the stated elements under the manual by clause, the inferred requirement with its reason, the decided requirement as added and the decided entity as corrected with their decisions, the clause only the question cites as asked about, the clause nothing cites as dropped, and an element without origin listed with its warning.
      - A decision's citation of a clause leaves the clause dropped when no element cites it, and a stated element whose citation names no source is listed under Kept with the validator's error at it.
      - The comparison is never a draft, is not a row of the outputs table and is not among the documents an approval is of.
    verification: test
    needs: [NEED-8]
    why: Before approving, the reviewer wants to see what the refinement changed against what the old documents said, and whether anything of them was left behind; read by hand from the citations that is slow and skipped where the two look alike.
    cites:
      - source: iso-29148
        clause: "6.3.3.6"
        says: "Requirements validation is subject to approval by the project authority and the key stakeholders."
  SA-97:
    statement: A decision record shall name the earlier decisions it rests on under restsOn; the validator shall refuse a restsOn entry naming a decision that does not exist and a chain that comes back to its own decision, each at the entry, and shall warn at a decision that is not itself superseded resting on a superseded one, naming the successor; and specarch decision why shall print the chain a decision rests on, earliest first, and specarch decision rests the decisions that rest on it, nearest first, each with a summary line first and one decision per line.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A decision whose restsOn names a decision the specification does not have is an error decision at that entry, naming the nearest ID; a decision whose restsOn chain comes back to it is an error decision_cycle at every restsOn entry on the cycle, each naming the chain from its decision; a decision that is not superseded resting on a superseded one is a warning decision_superseded at the entry, naming the successor; and a superseded decision resting on a superseded one warns nothing.
      - decision why on the last of a chain of three prints that it rests on 2 decisions and the three lines earliest first, each with its ID, title, status, date and the decisions it rests on; decision rests on the first prints that 2 decisions rest on it, its own line and the two lines nearest first; and both exit 0.
      - decision why and decision rests on an ID that is not a decision of the specification are refused, naming the decisions there are, and exit 1; without the ID or the folder they exit 2.
    verification: test
    needs: [NEED-6]
    why: A specification is layered decisions, and a reader who changes one wants to know what it rests on and what rests on it before the change; written as links the toolchain checks, the chain is read in one command rather than reconstructed from the records, which is the goal of docs/principles.md.
    cites:
      - source: adr-nygard
        says: "A decision record is never edited once accepted; a later decision supersedes it, and the record says which."
