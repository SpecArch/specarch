questions:
  # specarch-problem: question: open_question: (must, decision) Section message "Loan limits": attachment 1: Annex A says "It must be paid at the desk.", and does not name what it commits; which element is it? It blocks requirements. Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: 'Section message "Loan limits": attachment 1: Annex A says "It must be paid at the desk.", and does not name what it commits; which element is it?'
    kind: decision
    priority: must
    blocks: [requirements]
    decidedBy: system-owner
    why: A sentence that names its subject only by a word such as it or they cannot be placed as one element without guessing.
    cites:
      - {source: loan-limits, clause: 'message "Loan limits": attachment 1: Annex A', says: It must be paid at the desk.}
  # specarch-problem: question: open_question: (must, decision) Which kind is each requirement read from the document: LOANLIMITS-1, LOANLIMITS-2, LOANLIMITS-3, LOANLIMITS-4, LOANLIMITS-5, LOANLIMITS-6? Functional, quality, interface or constraint. Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: 'Which kind is each requirement read from the document: LOANLIMITS-1, LOANLIMITS-2, LOANLIMITS-3, LOANLIMITS-4, LOANLIMITS-5, LOANLIMITS-6? Functional, quality, interface or constraint.'
    kind: decision
    priority: must
    blocks: ['#/requirements/LOANLIMITS-1/kind', '#/requirements/LOANLIMITS-2/kind', '#/requirements/LOANLIMITS-3/kind', '#/requirements/LOANLIMITS-4/kind', '#/requirements/LOANLIMITS-5/kind', '#/requirements/LOANLIMITS-6/kind']
    decidedBy: system-owner
    why: A document states what is committed, not which kind of requirement it is.
  # specarch-problem: question: open_question: (could, decision) Not held: message "Loan limits": attachment 1: a picture at paragraph 9: a picture is not read; what it shows becomes a requirement only once a sentence says it. Does the specification need it, written another way or described by hand? It blocks requirements. Decided by system-owner. Answer with a decision record that names Q-4 under answers. [Q-4]
