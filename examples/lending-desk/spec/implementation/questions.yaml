questions:
  Q-4:
    question: Renewing a loan is in the manual but not in the service. Build it as the manual describes, or take it out of the manual?
    kind: decision
    priority: should
    blocks: [implementation]
    decidedBy: desk-manager
    options: ["Build it", "Take it out of the manual and the specification"]
    why: Not built yet. The manual describes renewal (clause 4.1); the service serves no renew route and has no handler for one (lending/routes.go:14).
    cites:
      - { source: desk-manual, clause: "4.1", says: "A member may renew a loan once." }
      - { source: desk-code, clause: "lending/routes.go:14", says: "Routes serves no renew route." }
  Q-6:
    question: The manual has a phone number for each member, which is personal, and the database has no column for it. Build it as the manual describes, or take it out of the manual?
    kind: decision
    priority: must
    blocks: [implementation]
    decidedBy: desk-manager
    options: ["Build it", "Take it out of the manual and the specification"]
    why: Not built yet, and the field is personal, so it is not left at should.
    cites:
      - { source: desk-manual, clause: "2", says: "The desk keeps a member's phone number, which is personal." }
      - { source: desk-code, clause: "migrations/001_init.sql:1", says: "members has card_number and full_name only." }
  Q-7:
    question: The service serves GET /members/{cardNumber}, which answers a member's card number and full name to anyone, checking no permission, and neither the manual nor the API document mentions it. Is it to stay, and behind which permission? It is left out of this specification until this is answered.
    kind: decision
    priority: must
    blocks: [implementation]
    decidedBy: desk-manager
    options: ["Keep it, behind a permission desk staff hold", "Take it out of the service", "Keep it open to everyone"]
    why: Undocumented, from code, and it answers a personal field to a caller who shows no permission, which is how an open endpoint is usually found. An operation's permission cannot be left out of the design, so the route waits here rather than as a guess.
    cites:
      - { source: desk-code, clause: "lending/routes.go:20", says: "GET /members/{cardNumber} checks no permission." }
      - { source: desk-code, clause: "lending/routes.go:55", says: "ShowMember answers one member's card number and full name." }
