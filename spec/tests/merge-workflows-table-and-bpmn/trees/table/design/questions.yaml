questions:
  # specarch-problem: question: open_question: (must, decision) Which entity holds the request of workflow write-off while it waits? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: Which entity holds the request of workflow write-off while it waits?
    kind: decision
    priority: must
    blocks: ['#/workflows/write-off/subject']
    decidedBy: system-owner
    why: The workflow table has no key for the record the request is kept in; the subject is where a page reads where the request is.
  # specarch-problem: question: open_question: (must, decision) Workflow write-off is started by operation requestWriteOff, which the workflow table names as its trigger; the table does not declare it, so it waits for the tree that does. Is it that operation? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: Workflow write-off is started by operation requestWriteOff, which the workflow table names as its trigger; the table does not declare it, so it waits for the tree that does. Is it that operation?
    kind: decision
    priority: must
    blocks: ['#/workflows/write-off/trigger']
    decidedBy: system-owner
    names: requestWriteOff
    why: The table names the operation and not its method or path, so the workflow's trigger waits for the tree that declares it; specarch merge writes it once one does.
  # specarch-problem: question: open_question: (must, decision) Which permission does step approve of workflow write-off check? It cannot be the permission of the operation that starts the workflow. Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: Which permission does step approve of workflow write-off check? It cannot be the permission of the operation that starts the workflow.
    kind: decision
    priority: must
    blocks: ['#/workflows/write-off/steps/0/permission']
    decidedBy: system-owner
    why: The workflow table names who may approve and not the permission the approval checks.
