# Written by specarch decide; answers Q-4. Edit it as any decision.
decisions:
  ADR-224:
    title: Does approval stay whole, with the cost of approving again kept down by diff against the approval, or may part of a specification be approved?
    status: accepted
    date: "2026-10-31"
    context: |-
      Q-4 asked: Does approval stay whole, with the cost of approving again
      kept down by diff against the approval, or may part of a specification
      be approved? The options were: Approval stays whole; diff between the
      approved specification and the working tree shows the approver only what
      changed; Part of a specification may be approved. It blocked
      #/decisions/ADR-083. ADR-019 approves exactly what was read; an approval
      of a part is an approval of a digest no document shows.
    decision: |-
      Approval stays whole: the digest is over every file, because approval is
      of exactly what was read (ADR-019). The cost of approving again is kept
      down by diff, not by approving part of a specification: the approval
      record gains the commit it was made at, and diff between that commit and
      the working tree lists every changed element with the change request or
      defect that covers it, its version check skipped when both sides have
      the same info.version.
    consequences: |-
      This decision rests on ADR-083, which stays as it is written unless this
      decision supersedes it. The version check is skipped only inside one
      version not yet released, as a round of acceptance is: when a release
      record beside the old folder marks that version released, diff reports
      the version that never stepped, because a release under the number of
      one already shipped breaks Semantic Versioning's rule that a released
      version's contents never change.
    answers: [Q-4]
    decidedBy: owner
    restsOn: [ADR-083]
    origin: stated
    cites:
      - {source: owner-review-2026-10-31, says: 'Approval stays whole: the digest is over every file, because approval is of exactly what was read (ADR-019). The cost of approving again is kept down by diff, not by approving part of a specification: the approval record gains the commit it was made at, and diff between that commit and the working tree lists every changed element with the change request or defect that covers it, its version check skipped when both sides have the same info.version.'}
