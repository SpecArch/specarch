  "No release is recorded beside the specification, so version %s is the only version this book knows. A release record under records/releases/ adds a row here.": "Belum ada release yang dicatat di samping spesifikasi, jadi versi %s adalah satu-satunya versi yang diketahui buku ini. Release record di records/releases/ akan menambah baris di sini."
  "The releases recorded beside the specification, newest first, with the change requests and defects each includes.": "Release yang dicatat di samping spesifikasi, dari yang terbaru, beserta change request dan defect yang masuk di tiap release."
