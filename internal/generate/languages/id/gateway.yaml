translations:
  "signed with ": "ditandatangani dengan "
  "issued by ": "diterbitkan oleh "
  "Verifies %s before it reads anything else, reads its claim %s, and forwards every request no operation of this specification answers, as received, to the service the value names. It checks no permission: the service checks its own.": "Memverifikasi %s sebelum membaca apa pun, membaca claim %s, lalu meneruskan setiap request yang tidak dijawab operasi mana pun di spesifikasi ini, apa adanya, ke service yang disebut nilai tersebut. Gateway tidak mengecek permission: service mengecek permission-nya sendiri."
  "| Value of %s | Forwarded to | Specification |": "| Nilai %s | Diteruskan ke | Spesifikasi |"
  " first, in that order.": " lebih dulu, sesuai urutan itu."
  "Runs no middleware.": "Tidak menjalankan middleware."
  "| Status | Problem type | When |": "| Status | Tipe problem | Kapan |"
  "Tested by ": "Dites oleh "
  "  participant G as Gateway %s\n": "  participant G as Gateway %s\n"
  "  participant I%d as %s\n": "  participant I%d as %s\n"
  "  participant S as the service the ": "  participant S as service yang dipilih "
  "  C->>G: any request no operation answers, with a %s token\n": "  C->>G: request apa pun yang tidak dijawab operasi, dengan token %s\n"
  "  G->>I%d: the signing keys, within %s\n": "  G->>I%d: signing key, dalam waktu %s\n"
  "  I%d-->>G: the keys\n": "  I%d-->>G: key-nya\n"
  "  G->>G: verify the token, read %s, find its forward\n": "  G->>G: verifikasi token, baca %s, cari tujuan forward-nya\n"
  "  G->>S: the request as received\n": "  G->>S: request apa adanya\n"
  "  S-->>G: the answer\n": "  S-->>G: jawabannya\n"
  "  G-->>C: the answer as received\n": "  G-->>C: jawaban apa adanya\n"
