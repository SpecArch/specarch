    # specarch-problem: warning: test_golden_missing: operation listMemberLoans has no golden scenario; add one under tests, for example list-member-loans-succeeds: { operation: listMemberLoans, scenario: golden, given: "a caller with loans.read", when: "listMemberLoans is called with values inside every limit", then: "it answers 200: The member's loans, open and returned." } [test_golden_missing@design/openapi.yaml#/paths/~1members~1{cardNumber}~1loans/get]
    get:
      operationId: listMemberLoans
      summary: List the loans of one member
      responses:
        "200":
