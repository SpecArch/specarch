  refund:
    description: A refund is routed by its amount, checked by a clerk, paid, and closed once the payment is confirmed.
    steps:
      - name: route
        kind: decision
        branches:
          - when: amountCents > 10000
            to: approve
          - when: amountCents == 0
            end: refused
          - otherwise: true
            to: check
      - name: approve
        kind: approval
        approvers: [manager]
        deadline: P2D
        onDeadline: refuse
      - name: check
        kind: task
        performers: [clerk]
        deadline: P1D
        onDeadline: escalate
        escalateTo: recheck
      - name: recheck
        kind: task
        performers: [manager]
      - name: hold
        kind: operation
      - name: pay
        kind: operation
        onFailure:
          end: failed
      - name: confirmed
        kind: wait
        deadline: P5D
        onDeadline: refuse
      - name: cool
        kind: wait
        after: P1D
      - name: due
        kind: wait
        at: payBy
      - name: close
        kind: operation
        onFailure:
          to: due2
      - name: due2
        kind: wait
        after: PT1H
    origin: stated
    cites:
      - {source: code, clause: workflows/refund.bpmn, says: 'Line 31: Process refund defines the workflow, with the tasks step-route, step-approve, step-check, step-recheck, step-hold, step-pay, step-confirmed, step-cool, step-due, step-close and step-due2 in that order.'}
