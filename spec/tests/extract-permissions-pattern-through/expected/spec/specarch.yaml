specarch: "1.0.0"
info:
  title: Permissions of access
  version: 0.1.0
  description: |
    The roles and the permissions each grants, as the permission check built from access reads them, from the permission table permissions.json, made at commit f2ac338b73a6342f9693c29e57940ad7fc3f0faa; and the routes the router built from api registers, from the route table routes.json, made at commit 4738214b4d72506210afa1e6e9882f60ec7b7677, each route that checks no permission taking the one the table's rules give it. Every role, permission and operation cites its table; what the tables do not say is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: 4738214b4d72506210afa1e6e9882f60ec7b7677
    url: ../service
    clauses:
      - {clause: access, title: The grants the permission check built from here reads}
      - {clause: api, title: The routes the router built from here registers}
    reading: printed
