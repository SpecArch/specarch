translations:
  "%s document": "dokumen %s"
  "code target %s": "target code %s"
  "%s (open in %s, which names %s)": "%s (terbuka di %s, yang menyebut %s)"
  "%s (open in %s)": "%s (terbuka di %s)"
  " (not given)": " (tidak diberikan)"
  "**Draft:** %s %s this document (%s); see the open questions document, or run specarch gaps.": "**Draft:** %s %s dokumen ini (%s); lihat dokumen pertanyaan terbuka, atau jalankan specarch gaps."
  "**Origin:** stated.": "**Asal:** dinyatakan."
  "**Origin:** stated in ": "**Asal:** dinyatakan di "
  "**Origin:** inferred.": "**Asal:** disimpulkan."
  "**Origin:** decided in %s, %s.": "**Asal:** diputuskan di %s, %s."
  "**Origin:** decided in %s.": "**Asal:** diputuskan di %s."
  "**Open question %s%s:** %s Decided by %s.": "**Pertanyaan terbuka %s%s:** %s Diputuskan oleh %s."
  "# %s: open questions": "# %s: pertanyaan terbuka"
  "Version %s of the specification has no open question: nothing it says waits on a decision or on material from a stakeholder.": "Spesifikasi versi %s tidak punya pertanyaan terbuka: tidak ada isinya yang menunggu keputusan atau bahan dari stakeholder."
  "Version %s of the specification: %s (%d must, %d should, %d could). A must question holds up everything that reads what it blocks; a should question holds up code generation and approval until the stakeholder confirms what was inferred; a could question holds up nothing. Each is answered by the stakeholder named, with a decision record that names the question under answers; the question is then removed.": "Spesifikasi versi %s: %s (%d must, %d should, %d could). Pertanyaan must menahan semua yang membaca bagian yang diblokirnya; pertanyaan should menahan code generation dan approval sampai stakeholder mengonfirmasi apa yang disimpulkan; pertanyaan could tidak menahan apa pun. Masing-masing dijawab oleh stakeholder yang disebut, dengan decision record yang menyebut pertanyaan itu di answers; setelah itu pertanyaannya dihapus."
  "Elements by origin: %d stated, %d inferred, %d decided, %d without origin.": "Elemen menurut asal: %d dinyatakan, %d disimpulkan, %d diputuskan, %d tanpa asal."
  "- Needed from: %s": "- Dibutuhkan dari: %s"
  "- Decided by: %s": "- Diputuskan oleh: %s"
  " (%s missing)": " (%s belum ada)"
  "- Blocks: %s": "- Memblokir: %s"
  "- Names: %s, the name the source gives for the key left out%s; it is written there once the specification declares an element of that name": "- Menyebut: %s, nama yang diberikan sumber untuk key yang tidak ada%s; nama ini ditulis di sana begitu spesifikasi mendeklarasikan elemen dengan nama itu"
  "- Options:": "- Pilihan:"
  "- Opened by: %s": "- Dibuka oleh: %s"
  "Extension blocks": "Blok extension"
  "Material to provide": "Bahan yang perlu diberikan"
  "What a stakeholder must send rather than decide: a document, a file, a screenshot or a record. Each is answered by providing it, declared as a source the specification cites, and a decision record that names the question under answers.": "Apa yang harus dikirim stakeholder, bukan diputuskan: dokumen, file, screenshot, atau record. Masing-masing dijawab dengan memberikannya, dideklarasikan sebagai sumber yang dikutip spesifikasi, ditambah decision record yang menyebut pertanyaan itu di answers."
  "References to other specifications": "Referensi ke spesifikasi lain"
  "1 reference names an element of another specification and is not resolved in this run": "1 referensi menyebut elemen dari spesifikasi lain dan belum ter-resolve di run ini"
  "%d references name elements of other specifications and are not resolved in this run": "%d referensi menyebut elemen dari spesifikasi lain dan belum ter-resolve di run ini"
  ": the specification named is not given with this one, or the element is blocked there by a must question. Give the other specification in the same run to check them; until then they are gaps, not errors.": ": spesifikasi yang disebut tidak diberikan bersama spesifikasi ini, atau elemennya diblokir di sana oleh pertanyaan must. Berikan spesifikasi lainnya di run yang sama untuk mengeceknya; sampai saat itu, ini dihitung sebagai gap, bukan error."
  "| At | Reference | Specification | Waits on |": "| Di | Referensi | Spesifikasi | Menunggu |"
  "Outputs": "Output"
  "What can be made from the specification now. A document is a draft while a must or should question blocks what it reads, or an error is in it; code generation waits for those questions, for every error to be fixed, and for the approval.": "Apa yang bisa dibuat dari spesifikasi saat ini. Sebuah dokumen berstatus draft selama ada pertanyaan must atau should yang memblokir bagian yang dibacanya, atau ada error di dalamnya; code generation menunggu pertanyaan-pertanyaan itu, semua error diperbaiki, dan approval."
  "| Output | State | Waits on |": "| Output | Status | Menunggu |"
  "the approval": "approval"
  "| %s | ready | |": "| %s | siap | |"
  "| %s | draft | %s |": "| %s | draft | %s |"
  "| %s | waits | %s |": "| %s | menunggu | %s |"
  "Decisions to take: ": "Keputusan yang perlu diambil: "
  "Material to provide: ": "Bahan yang perlu diberikan: "
  "%d more": "%d lagi"
  "in extension blocks": "di blok extension"
  ", which answered ": ", yang menjawab "
  " was opened by ": " dibuka oleh "
