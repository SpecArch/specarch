info:
  title: JavaScript and TypeScript source of server
  version: 0.1.0
  description: |
    The JavaScript and TypeScript source under server, read at commit e05b63e752316a4971c404da2a5a43e9405554fe by the TypeScript compiler 7.0.2 through the code-facts dump, by its syntax and the types it declares, with the message catalogues there read as data. Every element cites the line that declares it; what the source does not say as a literal, or through an idiom the reader knows, is a question, and so is what the meta-model cannot hold.
