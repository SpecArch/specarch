  # specarch-problem: question: open_question: (must, decision) Which methods does app/api/orders/route.ts serve at /api/orders, and for each, what does it do, what does it answer and which permission does it check? It blocks paths. Decided by system-owner. Answer with a decision record that names Q-11 under answers. [Q-11]
  Q-11:
    question: Which methods does app/api/orders/route.ts serve at /api/orders, and for each, what does it do, what does it answer and which permission does it check?
    kind: decision
    priority: must
    blocks: [paths]
    decidedBy: system-owner
    why: A route file's place gives its path and not its methods, which the handlers it exports decide; an operation is a method and a path, so none is written until the JavaScript reader reads the handlers or the owner says.
    cites:
      - {source: code, clause: app/api/orders/route.ts, says: 'The folder api/orders holds route.ts, so the router serves /api/orders from it.'}
  # specarch-problem: question: open_question: (must, decision) middleware.ts runs before every route its matcher selects, pages and route handlers alike, and may check who is signed in, send them elsewhere or answer by itself. Which pages and operations does it cover, and what does it check on them? It blocks paths. Decided by system-owner. Answer with a decision record that names Q-12 under answers. [Q-12]
  Q-12:
    question: middleware.ts runs before every route its matcher selects, pages and route handlers alike, and may check who is signed in, send them elsewhere or answer by itself. Which pages and operations does it cover, and what does it check on them?
    kind: decision
    priority: must
    blocks: ['#/pages/orders/permission', '#/pages/orders-by-order-id/permission', '#/pages/root/permission', '#/pages/status/permission', paths]
    decidedBy: system-owner
    why: Its place says the router runs it, and not which routes it acts on or what it checks; a check that runs before every route is how a permission is usually given, so it is asked, never assumed, until the JavaScript reader reads it.
    cites:
      - {source: code, clause: middleware.ts, says: Its place says the router runs it before the routes it covers.}
