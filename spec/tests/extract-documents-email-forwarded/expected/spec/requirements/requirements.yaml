    question: 'Not held: message "Loan limits": attachment 1: a picture at paragraph 9: a picture is not read; what it shows becomes a requirement only once a sentence says it. Does the specification need it, written another way or described by hand?'
    kind: decision
    priority: could
    blocks: [requirements]
    decidedBy: system-owner
    why: The source says it, and the meta-model cannot hold it as the source writes it, so the reader left it out or wrote it as the question says. Nothing waits for the answer.
    cites:
      - {source: loan-limits, clause: 'message "Loan limits": attachment 1: 2.1.2', says: 'Not held: message "Loan limits": attachment 1: a picture at paragraph 9: a picture is not read; what it shows becomes a requirement only once a sentence says it.'}
