  not held: lending-rules.docx: paragraph 10 holds tracked changes not yet accepted: the inserted text is read and the deleted text is not; accept or reject them in the document to settle which is meant; could question Q-7
  not held: the attachment desk.png, of type image/png: this build reads attachments in Markdown (.md, .markdown), PDF (.pdf), Word (.docx), PowerPoint (.pptx), Excel (.xlsx) and email messages (.eml); it is not read; could question Q-8
