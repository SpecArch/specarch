# Written by specarch decide; answers Q-15. Edit it as any decision.
decisions:
  ADR-015:
    title: 'api/handlers.go:47: the registration of POST /exportVault at api/endpoints.go:58 declares the response 200, and the handler api.ExportVault of POST /exportVault answers it nowhere in its own body, which calls no function of the module, nor does a middleware of its chain. Does the operation answer 200, or is the declaration stale?'
    status: accepted
    date: "2026-10-20"
    context: |-
      Q-15 asked: api/handlers.go:47: the registration of POST /exportVault at
      api/endpoints.go:58 declares the response 200, and the handler
      api.ExportVault of POST /exportVault answers it nowhere in its own body,
      which calls no function of the module, nor does a middleware of its
      chain. Does the operation answer 200, or is the declaration stale? It
      blocked #/paths/~1exportVault/post/responses/200. A response declared
      and never answered is in the contract clients are built against, and the
      code cannot produce it.
    decision: |-
      It answers 200 with the archive's bytes, which the service's own code
      streams.
    consequences: |-
      #/paths/~1exportVault/post/responses/200 is written from this answer,
      carrying origin decided and decidedIn ADR-015.
    answers: [Q-15]
    decidedBy: system-owner
    origin: stated
    cites:
      - {source: vault-owner, says: 'It answers 200 with the archive''s bytes, which the service''s own code streams.'}
