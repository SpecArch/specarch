  "The system is accepted when every criterion is met:": "Sistem diterima bila semua kriteria terpenuhi:"
  "| Criterion | Met |": "| Kriteria | Terpenuhi |"
  "| Role | Description | Name | Signature | Date |": "| Role | Deskripsi | Nama | Tanda tangan | Tanggal |"
  "State machines": "State machine"
  "Each entity with a state field is a state machine. A path runs from a state no move reaches to one no move leaves; a test about the entity alone walks one, and names it under covers. A path with no test is listed under the derived cases left out, or warned about when it moves through a transition that satisfies a requirement with a harm.": "Setiap entity yang punya field state adalah state machine. Sebuah path berjalan dari state yang tidak dicapai perpindahan mana pun ke state yang tidak ditinggalkan perpindahan mana pun; test yang hanya tentang entity itu menjalani satu path, dan menyebutnya di covers. Path tanpa test didaftar di derived case yang tidak dimuat, atau diberi warning bila melewati transition yang memenuhi requirement dengan dampak."
  "States of ": "State dari "
  "It has no path from an initial to a terminal state.": "Tidak ada path dari state awal ke state akhir."
  "| Path | Tests |": "| Path | Test |"
