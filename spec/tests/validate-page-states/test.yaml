command: validate
level: system
scenario: red
covers: [exit 1]
given: "pages with complete states, and pages whose states leave out a list's empty state, name a filtered empty state on a list without filters and an empty state on a form, give a message that is not a sentence, name a problem type the page cannot meet, leave one it can meet without a message or a default, and put a field on a view or one the form does not show"
when: "validate is run"
then: "it reports state ten times, and exits 1"
verifies: [SA-42]
