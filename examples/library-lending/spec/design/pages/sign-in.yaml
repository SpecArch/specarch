# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-1.0.schema.json
pages:
  sign-in:
    kind: task
    title: Sign in
    route: /sign-in
    permission: public
    submit: signIn
    fields: [email, password]
    states:
      failed:
        request-invalid: { message: Something in the request is missing or not in its form. Check it and try again. }
        sign-in-refused: { message: The email address or the password is wrong., field: password }
    onSubmitted:
      "200": { navigate: callerHome, message: You are signed in. }
      "201": { navigate: second-factor }
