  # specarch-problem: warning: requirement_unsatisfied: no design element satisfies requirement LENDINGRULES-4; add satisfies: [LENDINGRULES-4] to the entity, operation, command, page, algorithm or decision that meets it [requirement_unsatisfied@requirements/requirements.yaml#/requirements/LENDINGRULES-4]
