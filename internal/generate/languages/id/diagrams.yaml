  "  s%d -->|\"%s passes\"| %s\n": "  s%d -->|\"%s lewat\"| %s\n"
  "the deadline": "deadline"
  "What the handler does": "Yang dikerjakan handler"
  "The handler is %s. Read from the code at commit %s by `specarch extract go`, which followed the calls of functions of the same code up to %s deep from the handler: %s. Each chart's node carries its step's id, and the source under the chart is the function as it was at that commit, so the chart can be checked against the code.": "Handler-nya adalah %s. Dibaca dari code pada commit %s oleh `specarch extract go`, yang mengikuti pemanggilan function di code yang sama sampai kedalaman %s dari handler: %s. Tiap node di chart membawa id langkahnya, dan source di bawah chart adalah function seperti pada commit itu, jadi chart bisa dicek terhadap code-nya."
  "**%s**, %s lines %s to %s.": "**%s**, %s baris %s sampai %s."
  "%s at %s:%s (%s)": "%s di %s:%s (%s)"
  "Not followed: ": "Tidak diikuti: "
  "the handler alone, which calls no function of the code": "handler saja, yang tidak memanggil function apa pun di code"
  "the handler and 1 function it reaches": "handler dan 1 function yang dijangkaunya"
  "the handler and %d functions it reaches": "handler dan %d function yang dijangkaunya"
  "  begin([\"%s\"])\n": "  begin([\"%s\"])\n"
  "  finish([\"end of %s\"])\n": "  finish([\"akhir %s\"])\n"
  "each time": "setiap kali"
  "again": "lagi"
  "%s and %d more": "%s dan %d lagi"
  "  %s([\"%s (person)\"])\n": "  %s([\"%s (orang)\"])\n"
  "  person_anyone([\"anyone (person)\"])\n": "  person_anyone([\"siapa pun (orang)\"])\n"
  "  %s[\"%s (system, as %s)\"]\n": "  %s[\"%s (sistem, sebagai %s)\"]\n"
  "  %s>\"%s (channel)\"]\n": "  %s>\"%s (channel)\"]\n"
  ", implements %d": ", mengimplementasikan %d"
  ", environment ": ", environment "
  "  subgraph zone_%s[\"zone %s\"]\n": "  subgraph zone_%s[\"zone %s\"]\n"
  "  subgraph unreached_%s[\"not a server of %s\"]\n": "  subgraph unreached_%s[\"bukan server dari %s\"]\n"
  "%s reaches %s on port %s": "%s menjangkau %s di port %s"
  "The allowed connections, and no others: ": "Koneksi yang diizinkan, tidak ada yang lain: "
  "%s on %s": "%s di %s"
  "Ports listened on: ": "Port yang di-listen: "
  "The servers by zone, with the links allowed between them on their ports; a dependency no server of the deployment is stands apart, not reached.": "Server per zone, dengan link yang diizinkan di antaranya pada port masing-masing; dependency yang bukan server dari deployment ini digambar terpisah, tidak terjangkau."
  "The deployment declares no links between its servers, so the diagram draws none.": "Deployment ini tidak mendeklarasikan link antarserver, jadi diagramnya tidak menggambar link apa pun."
