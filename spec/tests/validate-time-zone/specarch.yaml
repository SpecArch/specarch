specarch: "1.0.0"
info: { title: Case, version: 1.0.0 }
timeZone: Asia/Jakarta
algorithms:
  calendarDay:
    inputs:
      at: { type: string, format: date-time }
    output: { type: string, format: date }
    formula: date(at)
    examples:
      - { name: written with the zone's offset, inputs: { at: "2026-10-27T03:00:00+07:00" }, expected: "2026-10-27" }
      - { name: the same instant written in Z, inputs: { at: "2026-10-26T20:00:00Z" }, expected: "2026-10-27" }
      - { name: the last second of the day before, inputs: { at: "2026-10-26T16:59:59Z" }, expected: "2026-10-26" }
    pseudocode: return the calendar date of at in the specification's time zone
