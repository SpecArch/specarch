    valueDescriptions:
      file_kind: a file given by name is neither `specarch.yaml` nor `*.specarch-implementation.yaml`, is part of a specification that should be checked as a whole, or its root key does not match its name
      yaml_syntax: an entry of the file, or the file as a whole, is not well-formed YAML; the entries that parse are still read (ADR-080)
      unquoted_date: a date written without quotes, which YAML reads as a timestamp
      duplicate_key: a mapping repeats a key, or two files of one specification define the same name
      schema: the file breaks the meta-model's JSON Schema
      stack_key: a specification carries a key that belongs to one implementation
      design_key: an implementation file carries a key that belongs to the specification
      ref_type: a `$ref` names an entity or enum the specification does not have
      relation_target: a relation's target is not an entity of the specification
      relation_via: a relation's `via` is not the field or join entity its kind needs
      reference: "a reference into another specification (`<dependency>#/<pointer>`) names no dependency, a dependency with no `specification`, stands where it may not (a one-to-many or many-to-many relation, a page that is not a list, a picker or list page whose entity and list are not of one dependency), or, when that specification is given, names an element it does not have, a list that does not list the entity, or a field the entity does not have; or a dependency's `version` is not the given specification's `info.version`; or a requirement's `fulfilledBy` names a requirement the given specification does not have"
      module: "an estate's module is not at its `location`, its specification's `info.version` is not the version the estate lists, its `info.name` is not the key the estate lists it under, or its operations' `calls` reach back to it through the other modules"
      field: a name that must be a field of an entity is not one (required, primaryKey, unique fields, page columns, fields and filters, an index's fields under its mapping), or indexes are under a mapping that is not an entity's
      state_field: the `stateField` is not a field whose type is an enum
      state_value: a transition's `from` or `to` is not a value of the state field's enum
      trigger: a transition's trigger is not an operation, command, channel message or algorithm
      requirement: a `satisfies` or `verifies` link names a requirement that is neither in the specification nor in a declared requirement set
      emits: an `emits` entry names a channel or message that does not exist
      dependency: a `calls` entry names a dependency that is not declared, a dependency's timeout is zero, or a dependency of kind `database`, `messageBroker` or `fileStore` names a `specification`
      channel: a channel's `carriedBy` entry names no declared dependency, or one of kind `database`, `fileStore` or `identityProvider`, which carry no messages
      idempotency_key: an `idempotencyKey` names no header parameter of its operation, or sits on a method that RFC 9110 already makes idempotent
      validity: a `validity` names a field the entity does not have, one that is not a date or a date-time, or a `from` and an `until` of different formats
      session: a session's idle or absolute timeout is zero
      guard: a `guard` names an entity that does not exist (its precondition is checked as a check constraint is)
      operation: a `source`, `submit` or operation action names an operationId that does not exist
      page: "a navigate action names a page that does not exist, compactColumns is on a page that is not a list or names a column the list lacks, or a page gives its fields as neither or both of fields and sections, shows a field in two sections, or is a list with sections, or childRows are on a page that is not a form, name a relation twice, or name one the form's entity lacks or one that is not one-to-many"
      algorithm: an `algorithm` reference names an algorithm that does not exist
      decision: a `supersededBy` names a decision that does not exist, or an implementation decision reuses a design decision's ID
      enum_value: a `valueDescriptions` key is not a value of its enum
      path_parameter: a `{name}` in a path has no path parameter, or a path parameter is not in the path
      duplicate_operation: two operations share an operationId
      permission_undeclared: an operation, command, page, action or role names a permission that is not declared
      permission_ungranted: a declared permission is granted by no role and is not `public`
      separation_of_duties: "a separation-of-duties set names a permission that is not declared or is `public`, asks for more of its permissions than it holds, or a role grants as many of the set's permissions as its cardinality"
      implies: "a permission implies a name that is not declared, implies `public`, is `public` and implies another, or implies itself through the implications"
      expression_syntax: a check, a unique constraint's condition or a formula does not parse
      expression_name: an expression names a field, input or function that does not exist
      expression_type: an expression combines values of types that do not fit
      example_input: a worked example's inputs are missing one, name an unknown one, or have the wrong type
      example_expected: a worked example's expected value does not have the output's type
      example_mismatch: the formula evaluated on a worked example's inputs does not give the expected value
      example_error: the formula cannot be evaluated on a worked example's inputs (division by zero, null in arithmetic)
      implements: an implementation file's `implements` does not name the root file of its specification at the same version
      design_ref: a pointer into the specification does not resolve
      unsafe_integer: an int64 or uint64 is carried as a JSON number without bounds inside 2^53
      change_log: a description reads as a change log instead of the current truth (a warning)
      test_subject: a test is about an operation, command, page, constraint or transition that does not exist
      test_case: a test covers a case its subject does not have, or a red case in a golden test
      test_golden_missing: a subject has no golden scenario; an error in a 0.2 file when the design gives the subject's success, which `specarch derive` writes, unless an open must or should question holds the subject up, and a warning otherwise
      test_red_missing: a subject has no red scenario and no derived red case (a warning, since there is no case to derive a test from)
      test_case_missing: a chosen case derived from the design has no test; a case is chosen when its subject satisfies a requirement with `harm`, when it is a failing dependency, or when users get it wrong often; an error in a 0.2 file unless an open must or should question holds the subject up, and a warning otherwise
      test_data: a test's fixture, input or expect names what the design does not have, carries a value of the wrong type, holds a record a check constraint refuses, or says the same thing as a data folder beside it
      suite: an implementation's test suite names a design test or subject that does not exist
      depends_on: a layout entry's `dependsOn` names no key of the layout, or the entry itself
      server: a deployment's server name is used twice, its `runs` names a package or target the file does not have, it runs packages and is not of kind `service`, it names a `dependency` and has a `kind` or `runs`, or its `dependency` is not declared
      layout: a file or a section is not where the tree layout puts it; the root file's `stages` and the folders disagree, a test folder has no `test.yaml`, or a folder is not a stage
      need: a requirement's `needs` names a need that does not exist
      stakeholder: a need's `stakeholders`, a question's `decidedBy`, a requirement's `ownedBy`, a mapping's `ownedBy` or the handover's `to` names a stakeholder that does not exist
      source: a citation names a source that is not declared under `sources`
      source_clause: a citation of a source that lists its `clauses` names no clause, or one that is neither a listed clause nor a part of one, such as section 3.3.1 under 3.3 or file.go:14 under file.go (a warning)
      environment: a check, an environment's `promotesTo` or an implementation's deployment names an environment that does not exist, or a deployment names none when the specification declares them
      setting: an implementation's deployment gives a value to a setting the specification does not declare, or an operation, command or page is enabledBy a name that is not a boolean setting
      secret_value: a setting marked secret carries a value, as a default or in a deployment
      monitor: an implementation's deployment watches a monitor the specification does not declare
      record_name: a record's file name is not its ID, its version, or its date and environment, or it does not sit in the folder of its kind under `records/`
      record_ref: a record names a stakeholder, requirement, `#/` pointer, test, environment or monitor the specification does not have, or a change, defect, incident, release or commissioning run that is not a record and not in a declared change-set or defect-set; or a requirement's release is not a planned or released release record
      change_applied: an implemented or released change's `adds` or `changes` do not resolve or its `removes` still do, or an open change's `changes` or `removes` do not resolve; an open change whose `adds` already resolve is a warning
      change_decision: an approved, implemented or released change has no decision with outcome approved, or a rejected one no decision with outcome rejected
      defect_test: a fixed or released defect names no test, or one that neither verifies a requirement the defect violates nor is about an element it violates
      defect_duplicate: a duplicate defect names no defect, one that does not exist, or one that is itself a duplicate
      incident_link: a resolved incident links to no defect or change and gives no `noChange` reason (a warning)
      commissioning_record: a commissioning record's results name a check that does not exist, or its version is not a release's
      release_contents: a released release includes a change that is not implemented or released or a defect that is not fixed or released, or a released change or defect and the release it names disagree
      release_bump: a released version steps from the previous released version by less than the largest impact of what it includes
      release_version: info.version is neither the newest released version nor a later pre-release of a planned release, or a release's specificationVersion is not its version
      need_unrefined: no requirement refines a need whose status is not rejected (a warning)
      acceptance_missing: a requirement has no acceptance criteria (a warning)
      requirement_unsatisfied: the specification has a design and no element of it satisfies a requirement that no other stakeholder owns (`ownedBy`) (a warning)
      requirement_unverified: the specification has tests, checks or monitors and none verifies a requirement that no other stakeholder owns (`ownedBy`) (a warning)
      question_block: a question's `blocks` entry is neither a stage, a section, nor a pointer to an element of the specification or to one missing key of it, or a question with `names` does not block exactly one key the specification leaves out
      question_stage: a question blocks more than one stage, or sits in a file of another stage than the one it blocks
      question_answered: an accepted decision answers a question that is still in the specification
      origin_citation: an element whose origin is stated cites nothing
      origin_reason: an element whose origin is inferred has no why
      origin_decision: an element whose origin is decided names no decision, or a decision that does not exist or is not accepted, or is a decision itself; or decidedIn is set without origin decided
      origin_missing: the specification tracks origin and an element of a section carries none (a warning)
      idiom_unknown: "an implementation file's `idioms` key, or an override's `overrides.idiom`, names no shipped idiom and none of the project's, or an override names no file in the idioms folder"
      idiom_part_unknown: "an override names a part the idiom does not have, or defines a part it does not list under `overrides.parts`"
      idiom_override_reason: "an idiom is excluded, or overridden, without `why`"
      idiom_stack: "an override renders a stack that is not the implementation file's: its language, the dialect of one of its targets, the framework of one of its ui targets, or `any`"
      idiom_version_behind: "an override was copied from an older version of the shipped idiom and does not say it stays behind on purpose (a warning)"
      idiom_contract: "an override changes a shipped contract statement, or a field has no row in a type rendering for a stack of the implementation file"
      sensitivity_exposed: "a credential field that is not writeOnly can appear in a response; a personal field can appear in the response of a public operation (a warning)"
      at_rest: "lookup without atRest encrypted, or an encrypted field that is a key or unique without lookup hash"
      audited: "an audited entity declares a field the system sets (createdAt, createdBy, lastModifiedAt, lastModifiedBy), or one with soft deletion declares deleted"
      list_of: "a listOf names an entity or a view the specification does not have, a view that carries rows, or a field the entity does not have, puts an encrypted field in searchable or sortable or in filterable without lookup hash, or has a default page size above its maximum"
      limits: "a rate's time is zero, or its burst is below its requests"
      problem: "a response or a middleware's refusal names a problem type not under errors, or one of another status, or the specification declares errors and a 4xx or 5xx response or a refusal names none"
      job: "a job acts as a role the specification does not have, reads or writes an entity it does not have, or consumes a message no channel declares"
      menu: "a menu entry opens a page the specification does not have"
      view: "a view reads from an entity the specification does not have, follows a path, counts a relation or carries the rows of a relation that does not lead where it must, repeats a field of its entity, shares an entity's name, or is used where it would be written"
      flow: "a page event is on a page or an action that does not raise it, leads to a page the specification does not have, does not give that page exactly its route parameters from fields of the page's entity, or carries a message that is not a full sentence; a list's action that opens a page does not give that page exactly its route parameters under with, from fields of the page's entity, or another page's action has with; or a flow's actor is not a role or may not open a page or take an action on the way, a step's page does not exist or does not raise its event, or an event leads somewhere other than the next step's page"
      state: "a page's states leave out the empty state a list shows or the filtered empty state its filters can reach, name one it cannot reach, leave a problem type the page can meet without a message and without a default, name a problem type it cannot meet, put a field on a page that is not a form or that the form does not show, or give a message that is not a full sentence"
      accessibility: "once the specification names its accessibility target, a field a page shows has no title, or two actions of a page share a label"
      theme: "a design token has no type, a type SpecArch does not take, or a value not of its type, an alias names no token or one of another type or leads back to itself, a mode gives a token that does not exist, or a pair of colours is translucent or has less contrast than WCAG 2.2 asks of its use"
      workflow: "a workflow's trigger is not an operation or does not answer 202, its subject is not an entity, an approver is not a role or does not grant the approval's permission, an approval's permission is the trigger's, a role grants both the trigger's and an approval's permission while a separation-of-duties set holds the pair, an approval's deadline is zero, an operation step names no operation, an escalation does not name a later approval step, or two steps share a name; a page that submits to a trigger has no event for its 202 answer or no message in it; or an inbox is on a page that is not a list, names no workflow or no approval step of it, or lists another entity than the subject or checks another permission than the step's"
      picker: "a picker is on a page that is not a form, or for a field the form does not show or that no many-to-one relation of its entity holds; its source is not an operationId of the specification, or not an operation whose listOf names the relation's target, or a role that may open the form may not call it; it shows a field the target lacks; or it fills a field the form does not show from a field the target lacks or of another type"
      action: "an action's when is on a form that loads no record, or its reason is on an action that runs no operation or names no property of the operation's request body, one the body does not require, or one that is not a string"
      form_field: "a page's fieldConditions name a field it does not show, make a field read-only on a page that is not a form, or give readOnly and readOnlyWhen together; its checks or enteredTwice are on a page that is not a form or a task, or a check's field or a field entered twice is not one the page shows; or a check's message is not a full sentence"
      value_object: "a relation leads to a schema, a schema is named like an entity or a view, storage is on a field that holds no schema or inside a value or is columns on a list, or a value kept in columns is optional with no required part that is never null or holds a list of schemas, itself or a reference to an entity"
      wire_name: "the specification names its wire names (info.wireNames) and two properties of one object, an entity's, a view's with its entity's, or a body's, a parameter's or a message's, go on the wire under one name; or it names its roles' wire names (info.roleNames) and two roles go on the wire under one name"
      meta_model_version: "the file says `specarch: \"0.1\"` or `\"0.2\"`, which are read until 1.0; for 0.1 run `specarch derive`, and for either change the line to \"0.3\" once nothing an expression can name is called caller (a warning, ADR-055, ADR-094)"
      output_folder: "document or generate is given no --out, and no implementation file of a specification names an output folder for the target under targets, so that specification has no such output (a warning, ADR-073, ADR-086)"
      audience: "an element for everyone (no `audience`) names an element whose audience is internal through a `$ref`, a relation's `target`, a page's `entity` or a requirement's `needs`, so a document for everyone would name what it may not show (ADR-119)"
      question_opened: "a decision names under `opens` a question that is neither open in the specification nor answered by a decision, or one it answers itself (ADR-120)"
      handover: "an environment the customer runs (`runBy: customer`) while the specification has no `handover`, `release` or `rollback`, a `handover` while no environment is run by the customer, or an implementation's deployment of such an environment without `build`, `method` or `infrastructure`; as warnings, such an environment with no commissioning check in it, no monitor in it, or no `backup` and `restore`, and a specification named to document handover with an output folder for it and no `handover`; a must question that blocks the stage or the section holds the problem (ADR-129)"
      build_task: "a deployment's `build` names under `task` or `sbom` a task the implementation file does not have under `tasks` (ADR-129)"
      request_body_open: "as a warning, an operation's request body is an object that names no property and does not say additionalProperties, so what it takes is not written; a must question that blocks the body holds it (ADR-130)"
      success_response_missing: "as a warning, an operation's responses are refusals alone, with no 1xx, 2xx or 3xx response and no default, so what it answers when it succeeds is not written; a must question that blocks the responses holds it (ADR-130)"
      middleware: "an operation names under middlewares a middleware the specification does not declare (ADR-131)"
      middleware_missing: "as a warning, the specification declares its middlewares and an operation names none, not even an empty list; a must question that blocks the operation or its middlewares holds it (ADR-131)"
      handler_source: "as a warning, a handler record of an implementation file no longer matches the code: the source it holds for a function is not what the cited file holds at the function's lines (whether the source moved or changed), the file is not under the folder the code source names, or the record cites no source with a folder (ADR-144)"
      handshake: "an operation names under handshake a handshake the specification does not declare, a handshake's establishedBy names no operation or one that itself travels in a handshake's envelope, or an operation travels in an envelope and streams an upload, whose body is the file and not a JSON body the envelope carries (ADR-145)"
      stream: "an upload stream is on a method other than post or put or its request body is not one media type whose schema is a string of format binary, a download stream's success responses are not each one such media type, or limits.maxResponseBytes is on an operation that streams no download (ADR-146)"
      caller_property: "an expression uses a dot outside caller.<property>, or names a property the caller does not declare, or names the caller where only a role's rows rule may (ADR-095)"
      rows: "a role's rows rule names an entity the specification does not have, names something that is neither a field of that entity nor a property of the caller, or does not give true or false (ADR-095)"
      reserved_name: "a file on meta-model 0.3 names a field, a schema's or a view's property or an algorithm's input caller, which 0.3 reserves for the caller record, since an expression naming it could mean either (ADR-094); a client is named people, nobody or public, or a role grants nobody, the reserved permission of a route closed on purpose (ADR-096, ADR-110)"
      client: "a client's kind is neither application nor service, it names a role the specification does not have, it holds roles with no proof or is a service with no proof, or its softwareVersion is not a range of two Semantic Versioning 2.0.0 versions written >=lower <upper (ADR-096, ADR-106)"
      client_unused: "as a warning, a service with no roles that no operation names in via, so nothing reaches it (ADR-106)"
      software_version: "a client says softwareVersion while no token declares a softwareVersion claim, so the edge has nothing to check the version against (ADR-106)"
      through: "a role's through names a permission the role does not grant, directly or by implies, a client the specification does not declare, or an empty list, or the specification carries no application a caller signed in through: no token declares client_id or tctx and a session carries none (ADR-106, ADR-108)"
      callers: "an operation's or command's callers is empty, is on a route closed with nobody, names what is neither people nor a declared client, lists a name twice, lists a service with no roles, or lists a client none of whose roles grants the permission (ADR-110)"
      proof: "a signedRequest proof names no algorithm, an algorithm RFC 9421 does not register or a covered component that is neither a derived component nor a header field name; a mutualTls, spiffe or wimse proof names an algorithm, covered components or a token; a token proof names no token, an undeclared one or a transaction token, which a workload must not authenticate itself with (ADR-096, ADR-111)"
      token: "a JWT with no signature, an opaque token with one, the algorithm none or one RFC 7518 does not register, two tokens marked default or none, an operation naming an undeclared token, a check that names what is not a claim or gives no bool, a transaction token that is not a JWT, lacks txn, sub, scope or req_wl, writes aud, or is accepted where a role's through reaches without tctx.application (ADR-097, ADR-111)"
      claim: "a registered claim of the JSON Web Token Claims registry retyped, a claim with an underscore outside the registry, or a claim of a caller property's name with another type (ADR-097, ADR-111)"
      via: "an operation accepting a transaction token or a token declaring act names no via, one accepting neither names it, or via is empty, names an undeclared client, an application, a client twice or a service without a workload-identity proof (ADR-111)"
      token_audience: "an access token some operation accepts declares no aud with const or enum, or an audience value with a colon that is not a URI (ADR-109)"
      security_events: "a specification with tokens and clients declares no securityEvents, or its store or alarm is not a dependency (ADR-109)"
    satisfies: [SA-2, SA-3, SA-4, SA-5, SA-6, SA-9, SA-10, SA-11, SA-12, SA-13, SA-17, SA-18, SA-23, SA-24, SA-27, SA-29, SA-41, SA-42, SA-47, SA-48, SA-49, SA-50, SA-62, SA-63, SA-67, SA-68, SA-69, SA-73, SA-77, SA-82, SA-83, SA-84]
