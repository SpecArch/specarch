# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-1.0.schema.json
pages:
  members-list:
    kind: list
    title: Members
    route: /members
    entity: Member
    permission: members.read
    source: listMembers
    columns: [cardNumber, fullName, email, tier, status, outstandingFees]
    filters: [tier]
    states:
      empty: { message: No members yet. Register the first one. }
      filteredEmpty: { message: No member is in this tier. }
      failed:
        request-invalid: { message: Something in the request is missing or not in its form. Check it and try again. }
        not-signed-in: { message: "Your session has ended. Sign in again, then try once more." }
        not-allowed: { message: Your role does not allow this. Ask a desk supervisor. }
        member-not-found: { message: "This member is no longer on record, so nothing changed." }
    onSelect: { navigate: member-view, with: { memberId: id } }
    actions:
      - { label: New member, kind: navigate, target: member-form, permission: members.write }
      - { label: Deactivate, kind: operation, target: deactivateMember, permission: members.write, when: 'status == "active"', confirm: "Deactivate this member? They will borrow nothing more.", reason: reason, then: { message: The member is deactivated. } }
