specarch: "0.1"
info: { title: Case, version: 1.0.0 }
stakeholders:
  owner: { description: The product owner. }

requirements:
  CASE-1:
    statement: A member shall borrow at most five books.
    kind: functional
    priority: must
    status: accepted
    acceptance: [A sixth loan is refused.]

entities:
  Loan:
    type: object
    description: A book lent to a member.
    properties:
      id: { type: string }
    primaryKey: [id]
    satisfies: [CASE-1]

questions:
  Q-1:
    question: Which operation names the loan's description?
    kind: decision
    priority: must
    blocks: ["#/entities/Loan/description"]
    decidedBy: owner
    names: describeLoan
  Q-2:
    question: Which operation does the loan name?
    kind: decision
    priority: must
    blocks: ["#/entities/Loan"]
    decidedBy: owner
    names: lendBook
  Q-3:
    question: Which operation is the loan's trigger, and what is its key?
    kind: decision
    priority: must
    blocks: ["#/entities/Loan/trigger", "#/entities/Loan/primaryKey"]
    decidedBy: owner
    names: lendBook
