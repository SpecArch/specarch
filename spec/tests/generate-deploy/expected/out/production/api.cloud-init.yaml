# Draft: the specification is not approved: there is no records/approvals/1.0.0.yaml beside the specification; this file is not the approved output.
# The host runs api as a container under systemd, through a Quadlet unit (podman 4.4 or later). The secrets are read from /etc/case-desk/secrets.env, which the operator writes on the host, holding DATABASE_URL; the unit refuses to start without it, naming what it misses, and this file never holds a value of it.
# api: service of the deployment production, https://case.example
package_update: true
packages:
  - podman
write_files:
  - path: "/etc/case-desk/production.env"
    permissions: "0640"
    content: |
      # Generated by specarch-gen-deploy from ../project/specarch.yaml, version 1.0.0; meta-model 1.0.0; digest sha256:a1a6c1039098666590affd14f400f47699d94c7b4e7cf9b84fabe6e094c946ec; the values of the settings in the deployment production of environment production. Do not edit this file: a change goes into the specification, the implementation file's deployments or the deploy target's settings.
      # Draft: the specification is not approved: there is no records/approvals/1.0.0.yaml beside the specification; this file is not the approved output.
      # A secret is not here: the form that runs the system reads it from the host.
      # specarch: #/configuration/dailyRate
      DAILY_RATE=0.75
      # specarch: #/configuration/pageSize
      PAGE_SIZE=20
      # specarch: #/configuration/databaseUrl
      # DATABASE_URL: databaseUrl is a secret of the specification, never written here
  - path: "/etc/containers/systemd/api.container"
    permissions: "0644"
    content: |
      [Unit]
      Description=The API host.
      AssertPathExists=/etc/case-desk/secrets.env
      [Container]
      Image=localhost/case-desk-api:latest
      ContainerName=api
      EnvironmentFile=/etc/case-desk/production.env
      EnvironmentFile=/etc/case-desk/secrets.env
      PublishPort=8080:8080
      [Service]
      ExecStartPre=/bin/sh -c 'for v in DATABASE_URL; do grep -q "^$${v}=" /etc/case-desk/secrets.env || { echo "$${v} is not in /etc/case-desk/secrets.env: write it there, from the secret store of the host" >&2; exit 1; }; done'
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  - "systemctl daemon-reload"
  - "systemctl start api.service || { echo \"api.service did not start; its reason: $(systemctl status api.service --no-pager 2>&1 | tail -n 5)\" >&2; exit 1; }"
