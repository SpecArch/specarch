questions:
  # specarch-problem: question: open_question: (must, decision) Which permission does POST /v1/things check? The document gives it no security. Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: Which permission does POST /v1/things check? The document gives it no security.
    kind: decision
    priority: must
    blocks: ['#/paths/~1v1~1things/post/permission']
    decidedBy: system-owner
    why: A security scheme says how a caller proves who it is, not what it may do, so the permission is asked and never written as public.
  # specarch-problem: question: open_question: (must, decision) Which permission does PUT /v1/things/{id} check? The document gives it no security. Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: Which permission does PUT /v1/things/{id} check? The document gives it no security.
    kind: decision
    priority: must
    blocks: ['#/paths/~1v1~1things~1{id}/put/permission']
    decidedBy: system-owner
    why: A security scheme says how a caller proves who it is, not what it may do, so the permission is asked and never written as public.
  # specarch-problem: question: open_question: (must, decision) POST /v1/things, request body, property name: it is Go's int64, which encoding/json writes as a number, and a number above 2^53 loses digits in JavaScript and other readers. Is it bounded within 2^53, or carried as text? Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: 'POST /v1/things, request body, property name: it is Go''s int64, which encoding/json writes as a number, and a number above 2^53 loses digits in JavaScript and other readers. Is it bounded within 2^53, or carried as text?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1v1~1things/post/requestBody/content/application~1json/schema']
    decidedBy: system-owner
    why: Every integer in a specification has a width, and a 64-bit one is held only within 2^53 or as text; which one the code needs is not in the source.
    cites:
      - {source: code, clause: 'api/server.go:9', says: 'POST /v1/things, request body, property name: Go''s int64.'}
  # specarch-problem: question: open_question: (must, decision) Which is right for #/paths/~1v1~1things/post/requestBody/content/application~1json/schema: {$ref: '#/schemas/CreateThingRequest'} or {type: object, properties: {code: {type: string}, name: {type: integer}}, required: [code]}? Decided by system-owner. Answer with a decision record that names Q-4 under answers. [Q-4]
  Q-4:
    question: 'Which is right for #/paths/~1v1~1things/post/requestBody/content/application~1json/schema: {$ref: ''#/schemas/CreateThingRequest''} or {type: object, properties: {code: {type: string}, name: {type: integer}}, required: [code]}?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1v1~1things/post/requestBody/content/application~1json/schema']
    decidedBy: system-owner
    options: ['{$ref: ''#/schemas/CreateThingRequest''}, as Things API has it', '{type: object, properties: {code: {type: string}, name: {type: integer}}, required: [code]}, as Go source of things has it']
    why: 'The sources disagree on the shape: CreateThingRequest.name is of type string, and Go source of things of type integer. The merge leaves the key out rather than choose between them.'
    cites:
      - {source: openapi, clause: /paths/~1v1~1things/post, says: 'POST /v1/things: Create a thing.'}
      - {source: code, clause: 'api/server.go:20', says: Registers POST /v1/things on a gin router; its handler is createThing.}
      - {source: code, clause: 'api/server.go:25', says: The handler of POST /v1/things reads no path parameter by name and decodes its body into req.}
  # specarch-problem: question: open_question: (should, decision) Is #/paths/~1v1~1things~1{id}/put/requestBody/content/application~1json/schema the schema UpdateThingRequest, as Things API gives it? The shapes agree where both speak, and Go source of things writes the property extra, which UpdateThingRequest does not list. Decided by system-owner. Answer with a decision record that names Q-5 under answers. [Q-5]
  Q-5:
    question: 'Is #/paths/~1v1~1things~1{id}/put/requestBody/content/application~1json/schema the schema UpdateThingRequest, as Things API gives it? The shapes agree where both speak, and Go source of things writes the property extra, which UpdateThingRequest does not list.'
    kind: decision
    priority: should
    blocks: ['#/paths/~1v1~1things~1{id}/put/requestBody/content/application~1json/schema']
    decidedBy: system-owner
    why: A reference is the one name for a shape, and is kept where the shape written in place agrees with it in all both say. A property only one side lists is no disagreement, and the merge neither writes it into the named shape nor leaves it out unsaid.
    cites:
      - {source: openapi, clause: '/paths/~1v1~1things~1{id}/put', says: 'PUT /v1/things/{id}: Replace a thing.'}
      - {source: code, clause: 'api/server.go:21', says: 'Registers PUT /v1/things/{id} on a gin router; its handler is updateThing.'}
      - {source: code, clause: 'api/server.go:34', says: 'The handler of PUT /v1/things/{id} reads the path parameter id and decodes its body into req.'}
