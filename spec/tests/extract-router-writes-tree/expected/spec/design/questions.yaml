  Q-5:
    question: POST /copies checks Copies:Write, which is not a permission name. Is it meant to be open to everyone (public), or which permission should it check?
    kind: decision
    priority: must
    blocks: ['#/paths/~1copies/post/permission']
    decidedBy: system-owner
    why: An operation open to everyone is how an open endpoint is usually found, so it is asked, never assumed.
