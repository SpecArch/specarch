  "# %s: commissioning procedure": "# %s: prosedur commissioning"
  "Version %s of the specification: %s run on the installed system before it is handed over, and the sign-off sheet. Fill in the Result column as each step is run; the filled-in run is kept as a record under `records/commissioning/`, beside the specification, not in it.": "Spesifikasi versi %s: %s yang dijalankan pada sistem terpasang sebelum diserahterimakan, dan lembar sign-off. Isi kolom Hasil setiap kali satu langkah dijalankan; hasil isiannya disimpan sebagai record di `records/commissioning/`, di samping spesifikasi, bukan di dalamnya."
  "to ": "ke "
