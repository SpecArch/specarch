specarch: "1.0.0"
info: { title: Till, version: 0.1.0 }
stakeholders:
  clerk: { description: Staff at the till. }
needs:
  NEED-1: { statement: Items must be findable by name., stakeholders: [clerk], status: accepted }
requirements:
  TILL-1:
    statement: An item shall have a non-empty name.
    kind: functional
    priority: must
    status: accepted
    verification: test
    needs: [NEED-1]
entities:
  Item:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      name: { type: string }
    required: [id, name]
    primaryKey: [id]
    relations:
      sales: { kind: one-to-many, target: Sael, via: itemId }
questions:
  Q-1:
    question: How long may an item's name be?
    priority: must
    kind: decision
    decidedBy: clerk
    blocks: ["#/entities/Item/properties/name"]
