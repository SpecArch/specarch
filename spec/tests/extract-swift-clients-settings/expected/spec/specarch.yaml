# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.5.0/schema/specarch-design-0.1.schema.json
specarch: "0.1"
info:
  title: Swift source of app
  version: 0.1.0
  description: |
    The Swift source under app, read at commit a33da2578ca6cd76e43505cf21d615b7eff6eb5e by SwiftSyntax 604.0.0 through the code-facts dump, by its syntax alone, with the property lists, build settings and Core Data models there read as data. Every element cites the line that declares it; what the source does not say as a literal, or through an idiom the reader knows, is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
  wireNames: snake_case
stages: [requirements, design, deployment]
sources:
  code:
    kind: code
    title: The code repository
    edition: a33da2578ca6cd76e43505cf21d615b7eff6eb5e
    url: ../repo
    clauses:
      - {clause: app/Api.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/Config/Debug.xcconfig, title: 'Build settings, read as data'}
      - {clause: app/Config/Release.xcconfig, title: 'Build settings, read as data'}
      - {clause: app/Info.plist, title: 'A property list the app is built with, read as data'}
      - {clause: app/Shelf.entitlements, title: 'The app''s entitlements, read as data'}
      - {clause: app/Widget-Info.plist, title: 'A property list the app is built with, read as data'}
    reading: parsed
