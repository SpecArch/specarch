# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.5.0/schema/specarch-design-0.1.schema.json
specarch: "0.1"
info:
  title: Swift source of app
  version: 0.1.0
  description: |
    The Swift source under app, read at commit 7194eeec25dad42547dfa83c33483244e0af76a6 by SwiftSyntax 604.0.0 through the code-facts dump, by its syntax alone, with the property lists, build settings and Core Data models there read as data. Every element cites the line that declares it; what the source does not say as a literal, or through an idiom the reader knows, is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
  wireNames: snake_case
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: 7194eeec25dad42547dfa83c33483244e0af76a6
    url: ../repo
    clauses:
      - {clause: app/Broken.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/Library.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/Payloads.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/Store.xcdatamodeld/.xccurrentversion, title: 'The current version of a Core Data model, read as data'}
      - {clause: app/Store.xcdatamodeld/Store 2.xcdatamodel/contents, title: 'A Core Data model, read as data'}
    reading: parsed
