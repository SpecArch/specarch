questions:
  # specarch-problem: question: open_question: (must, decision) What values does each path parameter of /loans/{loanId}/write-off-requests take: loanId? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: 'What values does each path parameter of /loans/{loanId}/write-off-requests take: loanId?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1loans~1{loanId}~1write-off-requests/parameters/0/schema']
    decidedBy: system-owner
    why: A route table names a path's parameters and not the values they take.
  # specarch-problem: question: open_question: (must, decision) What does POST /loans/{loanId}/write-off-requests do, and what does it answer? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: What does POST /loans/{loanId}/write-off-requests do, and what does it answer?
    kind: decision
    priority: must
    blocks: ['#/paths/~1loans~1{loanId}~1write-off-requests/post/summary', '#/paths/~1loans~1{loanId}~1write-off-requests/post/responses']
    decidedBy: system-owner
    why: A route table names the handler and not what it does or the responses it gives.
  # specarch-problem: question: open_question: (must, decision) What does each permission allow: loans.write? Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: 'What does each permission allow: loans.write?'
    kind: decision
    priority: must
    blocks: ['#/permissions/loans.write/description']
    decidedBy: system-owner
    why: A route table names the permission a route checks and not what it is for.
  # specarch-problem: question: open_question: (must, decision) Which role grants each permission: loans.write? Decided by system-owner. Answer with a decision record that names Q-4 under answers. [Q-4]
  Q-4:
    question: 'Which role grants each permission: loans.write?'
    kind: decision
    priority: must
    blocks: ['#/permissions/loans.write']
    decidedBy: system-owner
    why: A route table names the permission a route checks and not who holds it.
  # specarch-problem: question: open_question: (must, decision) Which entity holds the request of workflow write-off while it waits? Decided by system-owner. Answer with a decision record that names Q-5 under answers. [Q-5]
  Q-5:
    question: Which entity holds the request of workflow write-off while it waits?
    kind: decision
    priority: must
    blocks: ['#/workflows/write-off/subject']
    decidedBy: system-owner
    why: BPMN has no element for the record the request is kept in; the subject is where a page reads where the request is.
  # specarch-problem: question: open_question: (must, decision) Which permission does step approve of workflow write-off check? It cannot be the permission of the operation that starts the workflow. Decided by system-owner. Answer with a decision record that names Q-6 under answers. [Q-6]
  Q-6:
    question: Which permission does step approve of workflow write-off check? It cannot be the permission of the operation that starts the workflow.
    kind: decision
    priority: must
    blocks: ['#/workflows/write-off/steps/0/permission']
    decidedBy: system-owner
    why: BPMN names who may approve and not the permission the approval checks.
  # specarch-problem: question: open_question: (must, decision) Step writeOff of workflow write-off calls operation writeOffLoan, which the BPMN file names on its service task; the file does not declare it, so it waits for the tree that does. Is it that operation? Decided by system-owner. Answer with a decision record that names Q-7 under answers. [Q-7]
  Q-7:
    question: Step writeOff of workflow write-off calls operation writeOffLoan, which the BPMN file names on its service task; the file does not declare it, so it waits for the tree that does. Is it that operation?
    kind: decision
    priority: must
    blocks: ['#/workflows/write-off/steps/1/operation']
    decidedBy: system-owner
    names: writeOffLoan
    why: The file names the operation and not its method or path, so the step waits for the tree that declares it; specarch merge writes it once one does.
  # specarch-problem: question: open_question: (must, decision) Which permissions does role desk-supervisor grant? The BPMN file names it as a potential owner and says nothing of what it may do. Decided by system-owner. Answer with a decision record that names Q-8 under answers. [Q-8]
  Q-8:
    question: Which permissions does role desk-supervisor grant? The BPMN file names it as a potential owner and says nothing of what it may do.
    kind: decision
    priority: must
    blocks: ['#/roles/desk-supervisor/permissions']
    decidedBy: system-owner
    why: A potential owner in BPMN is a name; the grants are where the running permission check reads them.
  # specarch-problem: question: open_question: (must, decision) What is role desk-supervisor, in a sentence a reviewer can check? Decided by system-owner. Answer with a decision record that names Q-9 under answers. [Q-9]
  Q-9:
    question: What is role desk-supervisor, in a sentence a reviewer can check?
    kind: decision
    priority: must
    blocks: ['#/roles/desk-supervisor/description']
    decidedBy: system-owner
    why: The BPMN file names the role and does not describe it.
