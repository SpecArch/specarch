specarchRecord: "1.0.0"
kind: change
id: CR-32
title: Record test runs beside the specification and import JUnit XML results with specarch log test-run
raisedBy: specification-author
raised: "2026-11-03"
phase: development
type: perfective
urgency: normal
reason: Test results lived in the CI system only, so which tests of the specification had passed in which build could not be shown per element or per requirement, nor cited at acceptance.
cause: omitted
