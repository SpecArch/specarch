  # specarch-problem: question: open_question: (could, decision) The dependency catalogue is named after the value https://catalogue.library.example, since the gateway table gives the service no name. Is there a better name for it? Decided by system-owner. Answer with a decision record that names Q-6 under answers. [Q-6]
  Q-6:
    question: The dependency catalogue is named after the value https://catalogue.library.example, since the gateway table gives the service no name. Is there a better name for it?
    kind: decision
    priority: could
    blocks: ['#/dependencies/catalogue']
    decidedBy: system-owner
    why: A name made from an address is a guess at what the service is called.
    cites:
      - {source: gateway-table, clause: gateway, says: 'Row 2 of the gateway table: Forwards https://catalogue.library.example.'}
