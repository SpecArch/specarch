# yaml-language-server: $schema=../../../schema/specarch-fragment-design-0.1.schema.json
enums:
  Rule:
    type: string
    description: |
      Every check the validator makes. A diagnostic names one of these, so a
      test can assert the exact rule and a reader can look it up here.
    enum:
      - file_kind
      - yaml_syntax
      - unquoted_date
      - duplicate_key
      - schema
      - stack_key
      - design_key
      - ref_type
      - relation_target
      - relation_via
      - field
      - state_field
      - state_value
      - trigger
      - requirement
      - emits
      - dependency
      - idempotency_key
      - validity
      - session
      - guard
      - operation
      - page
      - algorithm
      - decision
      - enum_value
      - path_parameter
      - duplicate_operation
      - permission_undeclared
      - permission_ungranted
      - separation_of_duties
      - expression_syntax
      - expression_name
      - expression_type
      - example_input
      - example_expected
      - example_mismatch
      - example_error
      - implements
      - design_ref
      - unsafe_integer
      - change_log
      - test_subject
      - test_case
      - test_golden_missing
      - test_red_missing
      - test_case_missing
      - suite
      - test_data
      - layout
      - need
      - stakeholder
      - source
      - environment
      - setting
      - secret_value
      - monitor
      - record_name
      - record_ref
      - change_applied
      - change_decision
      - defect_test
      - defect_duplicate
      - incident_link
      - commissioning_record
      - release_contents
      - release_bump
      - release_version
      - need_unrefined
      - acceptance_missing
      - requirement_unsatisfied
      - requirement_unverified
      - question_block
      - question_stage
      - question_answered
      - origin_citation
      - origin_reason
      - origin_decision
      - origin_missing
      - idiom_unknown
      - idiom_part_unknown
      - idiom_override_reason
      - idiom_stack
      - idiom_version_behind
      - idiom_contract
      - sensitivity_exposed
      - at_rest
      - audited
      - list_of
      - limits
      - problem
      - job
      - menu
      - view
      - flow
      - state
      - accessibility
      - theme
      - workflow
      - picker
      - action
      - form_field
      - value_object
      - wire_name
    valueDescriptions:
      file_kind: a file given by name is neither `specarch.yaml` nor `*.specarch-implementation.yaml`, is part of a specification that should be checked as a whole, or its root key does not match its name
      yaml_syntax: the file is not well-formed YAML
      unquoted_date: a date written without quotes, which YAML reads as a timestamp
      duplicate_key: a mapping repeats a key, or two files of one specification define the same name
      schema: the file breaks the meta-model's JSON Schema
      stack_key: a specification carries a key that belongs to one implementation
      design_key: an implementation file carries a key that belongs to the specification
      ref_type: a `$ref` names an entity or enum the specification does not have
      relation_target: a relation's target is not an entity of the specification
      relation_via: a relation's `via` is not the field or join entity its kind needs
      field: a name that must be a field of an entity is not one (required, primaryKey, unique fields, page columns, fields and filters)
      state_field: the `stateField` is not a field whose type is an enum
      state_value: a transition's `from` or `to` is not a value of the state field's enum
      trigger: a transition's trigger is not an operation, command, channel message or algorithm
      requirement: a `satisfies` or `verifies` link names a requirement that is neither in the specification nor in a declared requirement set
      emits: an `emits` entry names a channel or message that does not exist
      dependency: a `calls` entry names a dependency that is not declared, or a dependency's timeout is zero
      idempotency_key: an `idempotencyKey` names no header parameter of its operation, or sits on a method that RFC 9110 already makes idempotent
      validity: a `validity` names a field the entity does not have, one that is not a date or a date-time, or a `from` and an `until` of different formats
      session: a session's idle or absolute timeout is zero
      guard: a `guard` names an entity that does not exist (its precondition is checked as a check constraint is)
      operation: a `source`, `submit` or operation action names an operationId that does not exist
      page: "a navigate action names a page that does not exist, compactColumns is on a page that is not a list or names a column the list lacks, or a page gives its fields as neither or both of fields and sections, shows a field in two sections, or is a list with sections, or childRows are on a page that is not a form, name a relation twice, or name one the form's entity lacks or one that is not one-to-many"
      algorithm: an `algorithm` reference names an algorithm that does not exist
      decision: a `supersededBy` names a decision that does not exist, or an implementation decision reuses a design decision's ID
      enum_value: a `valueDescriptions` key is not a value of its enum
      path_parameter: a `{name}` in a path has no path parameter, or a path parameter is not in the path
      duplicate_operation: two operations share an operationId
      permission_undeclared: an operation, command, page, action or role names a permission that is not declared
      permission_ungranted: a declared permission is granted by no role and is not `public`
      separation_of_duties: "a separation-of-duties set names a permission that is not declared or is `public`, asks for more of its permissions than it holds, or a role grants as many of the set's permissions as its cardinality"
      expression_syntax: a check, a unique constraint's condition or a formula does not parse
      expression_name: an expression names a field, input or function that does not exist
      expression_type: an expression combines values of types that do not fit
      example_input: a worked example's inputs are missing one, name an unknown one, or have the wrong type
      example_expected: a worked example's expected value does not have the output's type
      example_mismatch: the formula evaluated on a worked example's inputs does not give the expected value
      example_error: the formula cannot be evaluated on a worked example's inputs (division by zero, null in arithmetic)
      implements: an implementation file's `implements` does not name the root file of its specification at the same version
      design_ref: a pointer into the specification does not resolve
      unsafe_integer: an int64 or uint64 is carried as a JSON number without bounds inside 2^53
      change_log: a description reads as a change log instead of the current truth (a warning)
      test_subject: a test is about an operation, command, page, constraint or transition that does not exist
      test_case: a test covers a case its subject does not have, or a red case in a golden test
      test_golden_missing: a subject has no golden scenario (a warning in 0.1)
      test_red_missing: a subject has no red scenario and no derived red case (a warning in 0.1)
      test_case_missing: a chosen case derived from the design has no test; a case is chosen when its subject satisfies a requirement with `harm`, when it is a failing dependency, or when users get it wrong often (a warning in 0.1)
      test_data: a test's fixture, input or expect names what the design does not have, carries a value of the wrong type, holds a record a check constraint refuses, or says the same thing as a data folder beside it
      suite: an implementation's test suite names a design test or subject that does not exist
      layout: a file or a section is not where the tree layout puts it; the root file's `stages` and the folders disagree, a test folder has no `test.yaml`, or a folder is not a stage
      need: a requirement's `needs` names a need that does not exist
      stakeholder: a need's `stakeholders`, a question's `decidedBy` or a mapping's `ownedBy` names a stakeholder that does not exist
      source: a citation names a source that is not declared under `sources`
      environment: a check, an environment's `promotesTo` or an implementation's deployment names an environment that does not exist, or a deployment names none when the specification declares them
      setting: an implementation's deployment gives a value to a setting the specification does not declare, or an operation, command or page is enabledBy a name that is not a boolean setting
      secret_value: a setting marked secret carries a value, as a default or in a deployment
      monitor: an implementation's deployment watches a monitor the specification does not declare
      record_name: a record's file name is not its ID, its version, or its date and environment, or it does not sit in the folder of its kind under `records/`
      record_ref: a record names a stakeholder, requirement, `#/` pointer, test, environment or monitor the specification does not have, or a change, defect, incident, release or commissioning run that is not a record and not in a declared change-set or defect-set; or a requirement's release is not a planned or released release record
      change_applied: an implemented or released change's `adds` or `changes` do not resolve or its `removes` still do, or an open change's `changes` or `removes` do not resolve; an open change whose `adds` already resolve is a warning
      change_decision: an approved, implemented or released change has no decision with outcome approved, or a rejected one no decision with outcome rejected
      defect_test: a fixed or released defect names no test, or one that neither verifies a requirement the defect violates nor is about an element it violates
      defect_duplicate: a duplicate defect names no defect, one that does not exist, or one that is itself a duplicate
      incident_link: a resolved incident links to no defect or change and gives no `noChange` reason (a warning)
      commissioning_record: a commissioning record's results name a check that does not exist, or its version is not a release's
      release_contents: a released release includes a change that is not implemented or released or a defect that is not fixed or released, or a released change or defect and the release it names disagree
      release_bump: a released version steps from the previous released version by less than the largest impact of what it includes
      release_version: info.version is neither the newest released version nor a later pre-release of a planned release, or a release's specificationVersion is not its version
      need_unrefined: no requirement refines a need whose status is not rejected (a warning)
      acceptance_missing: a requirement has no acceptance criteria (a warning)
      requirement_unsatisfied: the specification has a design and no element of it satisfies a requirement (a warning)
      requirement_unverified: the specification has tests, checks or monitors and none verifies a requirement (a warning)
      question_block: a question's `blocks` entry is neither a stage, a section, nor a pointer to an element of the specification or to one missing key of it
      question_stage: a question blocks more than one stage, or sits in a file of another stage than the one it blocks
      question_answered: an accepted decision answers a question that is still in the specification
      origin_citation: an element whose origin is stated cites nothing
      origin_reason: an element whose origin is inferred has no why
      origin_decision: an element whose origin is decided names no decision, or a decision that does not exist or is not accepted, or is a decision itself; or decidedIn is set without origin decided
      origin_missing: the specification tracks origin and an element of a section carries none (a warning)
      idiom_unknown: "an implementation file's `idioms` key, or an override's `overrides.idiom`, names no shipped idiom and none of the project's, or an override names no file in the idioms folder"
      idiom_part_unknown: "an override names a part the idiom does not have, or defines a part it does not list under `overrides.parts`"
      idiom_override_reason: "an idiom is excluded, or overridden, without `why`"
      idiom_stack: "an override renders a stack that is not the implementation file's: its language, the dialect of one of its targets, or `any`"
      idiom_version_behind: "an override was copied from an older version of the shipped idiom and does not say it stays behind on purpose (a warning)"
      idiom_contract: "an override changes a shipped contract statement, or a field has no row in a type rendering for a stack of the implementation file"
      sensitivity_exposed: "a credential field that is not writeOnly can appear in a response; a personal field can appear in the response of a public operation (a warning)"
      at_rest: "lookup without atRest encrypted, or an encrypted field that is a key or unique without lookup hash"
      audited: "an audited entity declares a field the system sets (createdAt, createdBy, lastModifiedAt, lastModifiedBy), or one with soft deletion declares deleted"
      list_of: "a listOf names an entity the specification does not have or a field the entity does not have, puts an encrypted field in searchable or sortable or in filterable without lookup hash, or has a default page size above its maximum"
      limits: "a rate's time is zero, or its burst is below its requests"
      problem: "a response names a problem type not under errors, or one of another status, or the specification declares errors and a 4xx or 5xx response names none"
      job: "a job acts as a role the specification does not have, reads or writes an entity it does not have, or consumes a message no channel declares"
      menu: "a menu entry opens a page the specification does not have"
      view: "a view reads from an entity the specification does not have, follows a path or counts a relation that does not lead where it must, repeats a field of its entity, shares an entity's name, or is used where it would be written"
      flow: "a page event is on a page or an action that does not raise it, leads to a page the specification does not have, does not give that page exactly its route parameters from fields of the page's entity, or carries a message that is not a full sentence; or a flow's actor is not a role or may not open a page or take an action on the way, a step's page does not exist or does not raise its event, or an event leads somewhere other than the next step's page"
      state: "a page's states leave out the empty state a list shows or the filtered empty state its filters can reach, name one it cannot reach, leave a problem type the page can meet without a message and without a default, name a problem type it cannot meet, put a field on a page that is not a form or that the form does not show, or give a message that is not a full sentence"
      accessibility: "once the specification names its accessibility target, a field a page shows has no title, or two actions of a page share a label"
      theme: "a design token has no type, a type SpecArch does not take, or a value not of its type, an alias names no token or one of another type or leads back to itself, a mode gives a token that does not exist, or a pair of colours is translucent or has less contrast than WCAG 2.2 asks of its use"
      workflow: "a workflow's trigger is not an operation or does not answer 202, its subject is not an entity, an approver is not a role or does not grant the approval's permission, an approval's permission is the trigger's, a role grants both the trigger's and an approval's permission while a separation-of-duties set holds the pair, an approval's deadline is zero, an operation step names no operation, an escalation does not name a later approval step, or two steps share a name; a page that submits to a trigger has no event for its 202 answer or no message in it; or an inbox is on a page that is not a list, names no workflow or no approval step of it, or lists another entity than the subject or checks another permission than the step's"
      picker: "a picker is on a page that is not a form, or for a field the form does not show or that no many-to-one relation of its entity holds; its source is not an operationId of the specification, or not an operation whose listOf names the relation's target, or a role that may open the form may not call it; it shows a field the target lacks; or it fills a field the form does not show from a field the target lacks or of another type"
      action: "an action's when is on a form that loads no record, or its reason is on an action that runs no operation or names no property of the operation's request body, one the body does not require, or one that is not a string"
      form_field: "a page's fieldConditions name a field it does not show, make a field read-only on a page that is not a form, or give readOnly and readOnlyWhen together; its checks or enteredTwice are on a page that is not a form, or a check's field or a field entered twice is not one the form shows; or a check's message is not a full sentence"
      value_object: "a relation leads to a schema, an entity holds one in a field, or a schema is named like an entity or a view"
      wire_name: "the specification names its wire names (info.wireNames) and two properties of one object, an entity's, a view's with its entity's, or a body's, a parameter's or a message's, go on the wire under one name"
    satisfies: [SA-2, SA-3, SA-4, SA-5, SA-6, SA-9, SA-10, SA-11, SA-12, SA-13, SA-17, SA-18, SA-23, SA-24, SA-27, SA-29, SA-41, SA-42, SA-47, SA-48, SA-49]
