translations:
  "# %s: module map": "# %s: peta modul"
  "Version %s of the estate: %s. Each module is specified on its own; this map lists them, the version the estate holds each at, and what each names in another through its dependencies.": "Versi %s dari estate: %s. Tiap modul punya spesifikasinya sendiri; peta ini mendaftar modul-modul itu, versi yang dipegang estate untuk masing-masing, dan apa yang dirujuk tiap modul di modul lain lewat dependency-nya."
  "module": "modul"
  "modules": "modul"
  "**Problems:** %s the estate; each is shown below the modules, at its entry, and specarch validate prints them.": "**Masalah:** %s estate ini; masing-masing ditampilkan di bawah daftar modul, pada entry-nya, dan specarch validate juga mencetaknya."
  "problem concerns": "masalah menyangkut"
  "problems concern": "masalah menyangkut"
  "## Modules": "## Modul"
  "| Module | Held at | Specification | What it is |": "| Modul | Versi yang dipegang | Spesifikasi | Penjelasan |"
  "not found at ": "tidak ditemukan di "
  " (its specification is at %s)": " (spesifikasinya ada di %s)"
  "**Problem** at %s (%s:%d): %s": "**Masalah** di %s (%s:%d): %s"
  "## References between modules": "## Referensi antarmodul"
  "No module names another through a dependency.": "Tidak ada modul yang merujuk modul lain lewat dependency."
  "  %s[/\"%s, not in the estate\"/]\n": "  %s[/\"%s, tidak ada di estate\"/]\n"
  ", written against ": ", ditulis untuk "
  "| Module | Dependency | Specification it names | Written against |": "| Modul | Dependency | Spesifikasi yang dirujuk | Ditulis untuk |"
  " (not in the estate)": " (tidak ada di estate)"
same:
  - "<!-- Generated by specarch document techspec from %s, version %s; estate format %s. Do not edit this file: change the YAML and generate again. -->"
