    clauses:
      - {clause: 'A1:E4', title: loans}
      - {clause: 'A1:A4', title: Loan ID}
      - {clause: 'B1:B4', title: 'Column B, with no header'}
      - {clause: 'C1:C4', title: Member}
      - {clause: 'D1:D4', title: member}
      - {clause: 'E1:E4', title: Copies}
