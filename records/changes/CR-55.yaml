specarchRecord: "1.0.0"
kind: change
id: CR-55
title: Warn about seven design security weaknesses in the specification, at the element to change and in the problems file
raisedBy: specification-author
raised: "2026-11-14"
phase: development
type: additive
urgency: normal
reason: A specification could describe an operation that reaches any record by its key, an internal sequence number handed to callers, a refusal that tells whether a record exists, a query built from what a caller sends, roles with no separation of duties, a secret kept as it is or an audit trail that can be changed, and nothing said so before code was written from it.
