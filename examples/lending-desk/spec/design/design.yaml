# yaml-language-server: $schema=../../../../schema/specarch-fragment-design-0.1.schema.json
entities:
  Member:
    description: A card holder.
    type: object
    properties:
      cardNumber: { type: string, maxLength: 10, pattern: "^[0-9]{10}$", sensitivity: internal, description: The number printed on the card. }
      fullName: { type: string, minLength: 1, maxLength: 200, sensitivity: personal }
      phoneNumber: { type: string, sensitivity: personal, description: "In the manual and not in the database; Q-6 asks whether to build it." }
      address: { $ref: "#/schemas/Address", description: Where the member lives; a member may give none. }
    required: [cardNumber, fullName]
    primaryKey: [cardNumber]
    satisfies: [LEND-1]
    origin: stated
    cites:
      - { source: desk-manual, clause: "2.1", says: "A member is known by the card number printed on the card, and the desk records the member's full name." }
      - { source: desk-manual, clause: "2", says: "The desk keeps a member's card number (internal), full name (personal) and phone number (personal)." }
      - { source: desk-code, clause: "lending/model.go:14", says: "Member has CardNumber, 10 digits, and FullName." }
      - { source: desk-code, clause: "migrations/001_init.sql:1", says: "card_number CHAR(10) is the key; full_name VARCHAR(200) NOT NULL." }
      - { source: desk-code, clause: "lending/model.go:17", says: "Member has an Address, nil when the member gave none." }
  Book:
    description: One copy on the shelves.
    type: object
    properties:
      barcode: { type: string, minLength: 1, maxLength: 20 }
      title: { type: string, minLength: 1, maxLength: 300 }
    required: [barcode, title]
    primaryKey: [barcode]
    satisfies: [LEND-2]
    origin: stated
    cites:
      - { source: desk-manual, clause: "3.1", says: "Desk staff scan the book's barcode." }
      - { source: desk-code, clause: "migrations/001_init.sql:6", says: "barcode VARCHAR(20) is the key; title VARCHAR(300) NOT NULL." }
  Loan:
    description: One book lent to one member.
    type: object
    properties:
      id: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, readOnly: true, description: "A BIGSERIAL key, bounded so that a JSON reader keeps every digit." }
      cardNumber: { type: string, maxLength: 10, pattern: "^[0-9]{10}$" }
      barcode: { type: string, minLength: 1, maxLength: 20 }
      loanedOn: { type: string, format: date, readOnly: true }
      dueOn: { type: string, format: date, readOnly: true }
      returnedOn: { type: [string, "null"], format: date, readOnly: true }
    required: [id, cardNumber, barcode, loanedOn, dueOn]
    primaryKey: [id]
    relations:
      member: { target: Member, kind: many-to-one, via: cardNumber, onDelete: restrict }
      book: { target: Book, kind: many-to-one, via: barcode, onDelete: restrict }
    satisfies: [LEND-2, LEND-4, LEND-6]
    origin: stated
    cites:
      - { source: desk-manual, clause: "3.3", says: "The due date is printed on the slip." }
      - { source: desk-code, clause: "lending/model.go:35", says: "Loan has ID, CardNumber, Barcode, LoanedOn, DueOn and ReturnedOn, which is empty until the book is back." }
      - { source: desk-code, clause: "migrations/001_init.sql:11", says: "loans references members and books; returned_on may be null." }

schemas:
  Address:
    description: Where a member lives. One that is given has its street and city.
    type: object
    properties:
      street: { type: string, minLength: 1, maxLength: 200, sensitivity: personal }
      city: { type: string, minLength: 1, maxLength: 100, sensitivity: personal }
      postcode: { type: string, maxLength: 20, sensitivity: personal }
    required: [street, city]
    origin: stated
    cites:
      - { source: desk-code, clause: "lending/model.go:22", says: "Address has Street, City and Postcode; one that is given has its street and city, and the postcode may be left out." }
      - { source: desk-code, clause: "migrations/003_member_address.sql:1", says: "members gets address_street VARCHAR(200), address_city VARCHAR(100) and address_postcode VARCHAR(20), with a check that an address is wholly absent or has its street and city." }

permissions:
  members.write:
    description: Register members.
    satisfies: [LEND-1]
    origin: stated
    cites:
      - { source: desk-code, clause: "lending/routes.go:37", says: "POST /members checks members.write." }
  loans.write:
    description: Lend, renew and check in books.
    satisfies: [LEND-2, LEND-5, LEND-6]
    origin: stated
    cites:
      - { source: desk-code, clause: "lending/routes.go:38", says: "POST /loans and POST /loans/{loanId}/return check loans.write." }
  loans.read:
    description: See the loans of a member.
    satisfies: [LEND-7]
    origin: inferred
    why: Undocumented, from code; it stands or falls with LEND-7 and Q-2.
    cites:
      - { source: desk-code, clause: "lending/routes.go:42", says: "GET /members/{cardNumber}/loans checks loans.read." }

roles:
  desk-staff:
    description: Staff at the lending desk.
    permissions: [members.write, loans.write, loans.read]
    origin: stated
    cites:
      - { source: desk-manual, clause: "2.2", says: "Desk staff register new members." }
      - { source: desk-code, clause: "seeds/001_roles.sql:3", says: "desk-staff grants members.write, loans.write and loans.read." }

paths:
  /members:
    post:
      operationId: registerMember
      summary: Register a member
      permission: members.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/entities/Member" }
      responses:
        "201": { description: The member is registered. }
      satisfies: [LEND-1]
      origin: stated
      cites:
        - { source: desk-manual, clause: "2.2", says: "Desk staff register new members." }
        - { source: desk-code, clause: "lending/routes.go:47", says: "RegisterMember answers 201." }
  /loans:
    post:
      operationId: lendBook
      summary: Lend a book
      permission: loans.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardNumber: { type: string, maxLength: 10, pattern: "^[0-9]{10}$" }
                barcode: { type: string, minLength: 1, maxLength: 20 }
              required: [cardNumber, barcode]
      responses:
        "201":
          description: The loan.
          content:
            application/json:
              schema: { $ref: "#/entities/Loan" }
        "409": { description: The member already has five books on loan. }
      satisfies: [LEND-2, LEND-3]
      origin: stated
      cites:
        - { source: desk-manual, clause: "3.1", says: "Desk staff lend a book by scanning the member's card and the book's barcode." }
        - { source: desk-code, clause: "lending/routes.go:59", says: "LendBook answers 409 when the member has MaxOpenLoans books out, and 201 otherwise." }
  /loans/{loanId}/return:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 } }
    post:
      operationId: returnBook
      summary: Check a book in
      permission: loans.write
      responses:
        "200": { description: The loan is closed. }
      satisfies: [LEND-6]
      origin: stated
      cites:
        - { source: desk-manual, clause: "5.1", says: "Checking a book in closes the loan." }
        - { source: desk-code, clause: "lending/routes.go:73", says: "ReturnBook closes the loan and answers 200." }
  /loans/{loanId}/renew:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 } }
    post:
      operationId: renewLoan
      summary: Renew a loan
      permission: loans.write
      responses:
        "200": { description: "The loan, with its new due date." }
      satisfies: [LEND-5]
      origin: stated
      why: The manual has the member ask at the desk, so desk staff renew, under the permission the other loan changes use. The service does not serve it yet; Q-4 asks whether to build it.
      cites:
        - { source: desk-manual, clause: "4.1", says: "A member may renew a loan once, for one more loan period, by asking at the desk before the due date." }
  /members/{cardNumber}/loans:
    parameters:
      - { name: cardNumber, in: path, required: true, schema: { type: string, pattern: "^[0-9]{10}$" } }
    get:
      operationId: listMemberLoans
      summary: The loans of one member
      permission: loans.read
      responses:
        "200":
          description: The member's loans.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Loan" } }
      satisfies: [LEND-7]
      origin: inferred
      why: Undocumented, from code; Q-2 asks whether it is wanted.
      cites:
        - { source: desk-code, clause: "lending/routes.go:91", says: "ListMemberLoans answers 200 with the member's loans." }
