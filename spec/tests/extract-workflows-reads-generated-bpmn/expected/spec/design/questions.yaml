  # specarch-problem: question: open_question: (must, decision) Which permissions does role lead grant? The BPMN file names it as a potential owner and says nothing of what it may do. Decided by system-owner. Answer with a decision record that names Q-6 under answers. [Q-6]
  Q-6:
    question: Which permissions does role lead grant? The BPMN file names it as a potential owner and says nothing of what it may do.
    kind: decision
    priority: must
    blocks: ['#/roles/lead/permissions']
    decidedBy: system-owner
    why: A potential owner in BPMN is a name; the grants are where the running permission check reads them.
