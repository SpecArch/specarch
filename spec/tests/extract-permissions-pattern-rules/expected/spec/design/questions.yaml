questions:
  # specarch-problem: question: open_question: (must, decision) What is each role for, and who holds it: auditor, desk-staff, desk-supervisor? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: 'What is each role for, and who holds it: auditor, desk-staff, desk-supervisor?'
    kind: decision
    priority: must
    blocks: ['#/roles/auditor/description', '#/roles/desk-staff/description', '#/roles/desk-supervisor/description']
    decidedBy: system-owner
    why: A permission table names a role and what it grants, not who holds it.
  # specarch-problem: question: open_question: (must, decision) What does each permission allow: v1.all, v1.export.get, v1.get, v1.loans.renew.post, v1.reports.get, v2.get? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: 'What does each permission allow: v1.all, v1.export.get, v1.get, v1.loans.renew.post, v1.reports.get, v2.get?'
    kind: decision
    priority: must
    blocks: ['#/permissions/v1.all/description', '#/permissions/v1.export.get/description', '#/permissions/v1.get/description', '#/permissions/v1.loans.renew.post/description', '#/permissions/v1.reports.get/description', '#/permissions/v2.get/description']
    decidedBy: system-owner
    why: A permission table names the permissions a role grants and not what they are for.
  # specarch-problem: question: open_question: (could, decision) The permissions the rules give are named from their patterns' words and their methods: v1.all, v1.export.get, v1.get, v1.loans.renew.post, v1.reports.get, v2.get. Should any be renamed to say what it allows? Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: 'The permissions the rules give are named from their patterns'' words and their methods: v1.all, v1.export.get, v1.get, v1.loans.renew.post, v1.reports.get, v2.get. Should any be renamed to say what it allows?'
    kind: decision
    priority: could
    blocks: ['#/permissions/v1.all', '#/permissions/v1.export.get', '#/permissions/v1.get', '#/permissions/v1.loans.renew.post', '#/permissions/v1.reports.get', '#/permissions/v2.get']
    decidedBy: system-owner
    why: The names come from paths and not from a person, and a name is what a reviewer reads in the matrix. Nothing waits for the answer.
  # specarch-problem: question: open_question: (must, decision) What does GET /health do, and what does it answer? Decided by system-owner. Answer with a decision record that names Q-4 under answers. [Q-4]
  Q-4:
    question: What does GET /health do, and what does it answer?
    kind: decision
    priority: must
    blocks: ['#/paths/~1health/get/summary', '#/paths/~1health/get/responses']
    decidedBy: system-owner
    why: A route table names the handler and not what it does or the responses it gives.
  # specarch-problem: question: open_question: (must, decision) No rule of the permission table reaches GET /health. Is it closed on purpose, so that nobody may call it, or should a rule reach it? Decided by system-owner. Answer with a decision record that names Q-5 under answers. [Q-5]
  Q-5:
    question: No rule of the permission table reaches GET /health. Is it closed on purpose, so that nobody may call it, or should a rule reach it?
    kind: decision
    priority: must
    blocks: ['#/paths/~1health/get/permission']
    decidedBy: system-owner
    why: A route no rule reaches refuses every caller, and so does a route a rule was forgotten for, so it is asked, never assumed.
