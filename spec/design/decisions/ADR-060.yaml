decisions:
  ADR-060:
    title: Data passed around but not stored is a schema under schemas, after OpenAPI's components.schemas, with no key and no table, and an entity may not relate to one or hold one
    status: accepted
    date: "2026-10-09"
    context: |
      Step 7 of docs/meta-model-0.2.md. A diagnostic, a request summary or
      a token's claims as a body is passed around and never stored, and
      has no identity. Meta-model 0.1 can name an object only as an
      entity, which needs a primary key and becomes a table, so such data
      was written as an entity with a made-up key. The SQL generator gave
      it a table nobody uses, and a reader could not tell it from a
      stored record. Inline objects carry it once, but not when two
      operations or a message share it.
    decision: |
      schemas holds named object schemas keyed by PascalCase name, each
      with type object, properties and required, and the rationale keys
      every element has; it has no primaryKey, relations, constraints,
      states, validity, audit or deletion. A request body, a response, a
      message's payload and another schema's property may refer to one
      as '#/schemas/Name'. A relation whose target is a schema and an
      entity's field that refers to one are refused (value_object); so is
      a schema named like an entity or a view, since all three become
      schemas of one interface. A derived case reads a request body's
      required properties through a schema as it does through an entity.
      specarch generate sql writes nothing for a schema; specarch generate
      openapi writes it under components.schemas. specarch extract openapi
      writes a component schema of type object as an entity only when the
      document treats it as a resource: an operation's 201 response
      answers it, or a path with a parameter answers it as it is. Every
      other one is a schema, with no question about its key, and inside
      an entity a reference to one is written in place.
    why: |
      The name schemas, and the shape of an object schema, are OpenAPI's:
      components.schemas is where an OpenAPI document keeps the named
      shapes its operations share, and JSON Schema's properties and
      required are the field subset every entity already uses, so a
      schema reads as the component it becomes and a generator writes it
      unchanged. OpenAPI puts stored and unstored shapes in one namespace,
      and so does the generated document, which is why a schema may not
      share an entity's or a view's name. OpenAPI does not say what is
      stored; that is the design's, and keeping a schema apart from an
      entity is what lets generate sql leave it out and a reader see that
      it has no identity. An entity may not relate to a schema because a
      relation is a foreign key to a record, and a schema has no record
      to point at; an entity may not hold one in a field either, because
      the field would need a column whose shape no generator can read
      from the design, and a stored copy of passed-around data is a
      record, which is what an entity says. Keeping the rule narrow costs
      nothing: a schema may still refer to an entity, as a response
      carrying a record does. OpenAPI never says which fields identify a
      record, so the reader takes what the document does say: 201
      Created means the request created a resource (RFC 9110, 15.3.2),
      and a path parameter that selects what a response answers names
      one record of it; a component the document creates or addresses
      that way has an identity, and its key is asked for. A component
      the document only passes, such as a refusal's body, has none to
      ask for, so asking for a key would invite the made-up key this
      decision removes. The owner chose this rule over writing every
      component as a schema and letting merge turn it into an entity,
      which would move every extracted tree and merge's join.
    consequences: |
      Data with a made-up key can be rewritten as a schema without a
      version change, since schemas is an addition to the 0.1 design
      schema. A value held in a stored record is written as fields of the
      entity, or as an entity of its own with a key.
    satisfies: [SA-1, SA-48]
