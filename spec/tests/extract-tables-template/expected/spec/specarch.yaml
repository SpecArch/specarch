specarch: "1.0.0"
info:
  title: Loans
  version: 0.1.0
  description: |
    The registers in loans-2026-q3.csv and loans-template.xlsx, read at commit 366556749d0f86e581ee76f9afd383e295303702: each file is a document source cited as a spreadsheet program shows it (C17, or Register!C17 in a workbook), each register an entity whose fields are its columns, their types inferred from every value of every file unless a template or the instructions state them, and what the values do not settle a question.
