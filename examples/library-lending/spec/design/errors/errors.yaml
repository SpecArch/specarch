# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-0.1.schema.json
errors:
  email-taken:
    status: 409
    title: Email address already registered
    condition: A member with the same email address exists.
  member-not-found:
    status: 404
    title: No such member
    condition: No member has the id in the path.
  lending-refused:
    status: 409
    title: The copy cannot be lent
    condition: The member holds the most open loans their tier allows, has outstanding fees, or the book has no copy available.
  loan-closed:
    status: 409
    title: The loan is already closed
    condition: The loan was returned or reported lost before.
  fee-ledger-unavailable:
    status: 503
    title: The fee ledger is unavailable
    condition: The fee ledger failed or did not answer in time, and the loan stays as it was.
  sign-in-refused:
    status: 401
    title: Sign-in refused
    condition: No one has the email address, or the password does not match it.
