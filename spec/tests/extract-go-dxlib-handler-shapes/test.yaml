# yaml-language-server: $schema=../../../schema/specarch-fragment-test-0.2.schema.json
command: extract
level: system
scenario: golden
given: "a repository holding a Go module on dxlib whose endpoints mostly declare neither parameters nor responses where NewEndPoint registers them, and whose handlers decode the body themselves with json.Unmarshal of RequestBodyAsBytes and answer with WriteResponseAsJSON: a POST that decodes into a struct of the package with snake_case json tags, omitempty on some fields, a field left out with json:\"-\", a slice, a pointer to a time, a nested struct, and checks before it goes on that refuse an empty or long title, a priority outside a switch's cases, an estimate out of range and too many labels, and answers 201 with a literal map holding a literal map and a header; a GET that answers a value a call returns; a POST that decodes into a struct written in place with a check on its id and one that refuses two flags set together, and answers 200 with two literal maps of other keys and once with a status held in a variable; a POST that decodes into utils.JSON and answers a map with a key held in a variable and a body a function builds; a POST that decodes into a slice; and a POST whose registration declares a parameter and a response while its handler decodes a struct and answers a map of other fields"
when: "extract go is run on the module"
then: "it writes the first POST's body from the struct: camelCase properties of their types, the fields without omitempty required, the one left out absent, the time nullable with format date-time, the nested struct an object with its own required list, and the checks as minLength and maxLength, an enum, minimum and maximum and maxItems; its 201 response with the nested object, every key of the literal required; a could question for the header; for the GET a property known by name only with a must question on its type; for the struct written in place its body with exclusiveMinimum, a should question on the check of the two flags, a must question on the status held in a variable and one on the two bodies of 200; for utils.JSON a body of any object with a must question saying the map names no field, a must question on the key held in a variable, and one on the body a function builds; for the slice a must question saying dxlib refuses a body that is not an object with 422; for the last POST the declared parameter and response, with a must question on each where the handler names other fields; sets info.wireNames snake_case; and exits 0"
verifies: [SA-44]
