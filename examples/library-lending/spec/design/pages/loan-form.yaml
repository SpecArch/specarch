pages:
  loan-form:
    kind: form
    title: Lend a copy
    route: /loans/new
    entity: Loan
    permission: loans.create
    submit: createLoan
    fields: [memberId, bookId]
    onSubmitted: { navigate: member-view, with: { memberId: memberId }, message: The copy is lent. }
    satisfies: [LIB-7]
