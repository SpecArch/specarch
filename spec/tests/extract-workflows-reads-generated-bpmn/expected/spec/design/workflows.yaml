  waiver:
    description: A waiver is approved by the desk lead, or by the manager once a day has passed, before it is granted.
    steps:
      - name: lead
        kind: approval
        approvers: [lead]
        deadline: P1D
        onDeadline: escalate
        escalateTo: manager
      - name: manager
        kind: approval
        approvers: [manager]
        deadline: P3D
        onDeadline: refuse
      - name: grant
        kind: operation
    origin: stated
    cites:
      - {source: code, clause: workflows/waiver.bpmn, says: 'Line 31: Process waiver defines the workflow, with the tasks step-lead, step-manager and step-grant in that order.'}
