specarch: "0.1"
info: { title: Members, version: 1.0.0 }
stages: [implementation]
stakeholders:
  owner: { description: The product owner. }
  administration: { description: The team that builds the administration's screens. }
entities:
  Member:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      name: { type: string, title: Name, minLength: 1, maxLength: 100 }
      status: { type: string, enum: [active, inactive], title: Status }
      joinedOn: { type: string, format: date, title: Joined on }
      homeBranchId: { type: [string, "null"], format: uuid, title: Home branch }
      visits: { type: integer, format: int32, minimum: 0, maximum: 1000, title: Visits }
      newsletter: { type: boolean, title: Newsletter }
      notes: { type: [string, "null"], title: Notes }
      pin: { type: [string, "null"], pattern: "^[0-9]{4}$", maxLength: 4, title: PIN, writeOnly: true }
    required: [id, name, status, joinedOn, homeBranchId, visits, newsletter, notes, pin]
    primaryKey: [id]
    relations:
      homeBranch: { target: Branch, kind: many-to-one, via: homeBranchId, onDelete: restrict }
      visitLog: { target: Visit, kind: one-to-many, via: memberId }
  Visit:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true, title: Visit }
      memberId: { type: string, format: uuid }
      visitedOn: { type: string, format: date, title: Visited on }
      note: { type: [string, "null"], maxLength: 100, title: Note }
    required: [id, memberId, visitedOn, note]
    primaryKey: [id]
    relations:
      member: { target: Member, kind: many-to-one, via: memberId, onDelete: restrict }
  RemovalRequest:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      memberId: { type: string, format: uuid, title: Member }
      why: { type: string, minLength: 1, maxLength: 200, title: Why }
    required: [id, memberId, why]
    primaryKey: [id]
  Branch:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      name: { type: string, title: Name, minLength: 1, maxLength: 100 }
    required: [id, name]
    primaryKey: [id]
views:
  MemberWithVisits:
    from: Member
    properties:
      visitLog: { rows: visitLog }
workflows:
  removal:
    description: A member is removed only after a second clerk approves it.
    trigger: requestRemoval
    subject: RemovalRequest
    steps:
      - { name: approve, kind: approval, approvers: [supervisor], permission: members.approve, deadline: P2D, onDeadline: refuse }
errors:
  sign-in-refused: { status: 401, title: Sign-in refused, condition: The email address or the password is wrong. }
  invitation-used: { status: 409, title: Invitation used, condition: The invitation was used before. }
  member-gone: { status: 404, title: Member gone, condition: No member has that id. }
permissions:
  members.read: { description: See the members. }
  members.write: { description: Change the members. }
  members.approve: { description: Approve a member's removal. }
  public: { description: Open to everyone. }
roles:
  member: { description: A member., permissions: [members.read] }
  clerk: { description: Keeps the members., permissions: [members.read, members.write] }
  supervisor: { description: Approves removals., permissions: [members.read, members.approve] }
session: { description: A member signs in once and works in a session., idleTimeout: PT30M, absoluteTimeout: PT12H }
paths:
  /members:
    get:
      operationId: listMembers
      summary: The members
      permission: members.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      listOf:
        entity: Member
        sortable: [name, joinedOn]
        searchable: [name]
        filterable: [joinedOn]
        pageSize: { default: 25, maximum: 50 }
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Member" } }
    post:
      operationId: createMember
      summary: Register a member
      permission: members.write
      idempotencyKey: Idempotency-Key
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                status: { type: string, enum: [active, inactive] }
                joinedOn: { type: string, format: date }
                homeBranchId: { type: string, format: uuid }
                visits: { type: integer, format: int32, minimum: 0, maximum: 1000 }
                newsletter: { type: boolean }
                notes: { type: string }
                pin: { type: string, pattern: "^[0-9]{4}$", maxLength: 4 }
              required: [name, status, joinedOn]
      responses:
        "201":
          description: The member.
          content:
            application/json:
              schema: { $ref: "#/entities/Member" }
  /branches:
    get:
      operationId: listBranches
      summary: The branches
      permission: members.read
      listOf:
        entity: Branch
        searchable: [name]
        pageSize: { default: 20, maximum: 50 }
      responses:
        "200":
          description: The branches.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Branch" } }
  /directory:
    get:
      operationId: listDirectory
      summary: The members anyone may see
      permission: public
      listOf:
        entity: Member
        pageSize: { default: 10, maximum: 10 }
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Member" } }
  /members/{memberId}:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMember
      summary: One member
      permission: members.read
      responses:
        "200":
          description: The member, with their visits.
          content:
            application/json:
              schema: { $ref: "#/views/MemberWithVisits" }
        "404": { description: No such member., problem: member-gone }
    put:
      operationId: updateMember
      summary: Change a member
      permission: members.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                status: { type: string, enum: [active, inactive] }
              required: [name, status]
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema: { $ref: "#/entities/Member" }
        "404": { description: No such member., problem: member-gone }
  /members/{memberId}/suspend:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: suspendMember
      summary: Suspend a member
      permission: members.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                why: { type: string, minLength: 1, maxLength: 200, title: Why }
              required: [why]
      responses:
        "204": { description: Suspended. }
        "404": { description: No such member., problem: member-gone }
  /members/{memberId}/visits:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recordVisits
      summary: Record a member's visits
      permission: members.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitLog:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: object
                    properties:
                      visitedOn: { type: string, format: date }
                      note: { type: string, maxLength: 100 }
                    required: [visitedOn]
              required: [visitLog]
      responses:
        "201": { description: Recorded. }
        "404": { description: No such member., problem: member-gone }
  /members/{memberId}/removals:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestRemoval
      summary: Ask for a member to be removed
      permission: members.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                why: { type: string, minLength: 1, maxLength: 200 }
              required: [why]
      responses:
        "202":
          description: The request waits for a supervisor.
          content:
            application/json:
              schema: { $ref: "#/entities/RemovalRequest" }
  /removals:
    get:
      operationId: listRemovals
      summary: The removals waiting for approval
      permission: members.approve
      listOf:
        entity: RemovalRequest
        pageSize: { default: 20, maximum: 50 }
      responses:
        "200":
          description: The waiting removals.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/RemovalRequest" } }
  /removals/{removalId}/approve:
    parameters:
      - { name: removalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveRemoval
      summary: Approve a removal
      permission: members.approve
      responses:
        "204": { description: Approved. }
  /sessions/current:
    get:
      operationId: getSession
      summary: Who is signed in
      permission: public
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: boolean }
                  granted: { type: array, items: { type: string, maxLength: 100 }, maxItems: 50 }
                required: [open, granted]
  /sessions:
    post:
      operationId: signIn
      summary: Sign in
      permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, title: Email address, maxLength: 254 }
                password: { type: string, format: password, minLength: 12, maxLength: 128, pattern: "[0-9]", title: Password, writeOnly: true }
              required: [email, password]
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberId: { type: string, format: uuid }
                required: [memberId]
        "401": { description: Refused., problem: sign-in-refused }
  /invitations:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitation: { type: string, pattern: "^[A-Z]{8}$", maxLength: 8, title: Invitation }
                password: { type: string, format: password, minLength: 12, maxLength: 128, title: Password, writeOnly: true }
                repeat: { type: string, format: password, maxLength: 128, title: Password again, writeOnly: true }
                nickname: { type: string, maxLength: 30 }
              required: [invitation, password, repeat]
      responses:
        "204": { description: Accepted. }
        "409": { description: Used before., problem: invitation-used }
pages:
  sign-in:
    kind: task
    title: Sign in
    route: /sign-in
    permission: public
    submit: signIn
    fields: [email, password]
    states:
      failed:
        sign-in-refused: { message: The email address or the password is wrong. }
        default: { message: Signing in does not work right now. Try again later. }
    onSubmitted:
      "200": { navigate: member-view, with: { memberId: memberId }, message: You are signed in. }
  invitation:
    kind: task
    title: Accept your invitation
    route: /invitations
    permission: public
    submit: acceptInvitation
    fields: [invitation, password, repeat, nickname]
    checks:
      repeated: { expression: repeat == password, message: The two passwords differ., field: repeat }
      not-the-invitation: { expression: "!(password == invitation) && size(password) >= 12", message: Choose a password of your own. }
    states:
      failed:
        invitation-used: { message: This invitation was used before., field: invitation }
    onSubmitted:
      "204": { navigate: sign-in, message: Your account is ready. Sign in. }
  members-list:
    kind: list
    title: Members
    route: /members
    entity: Member
    permission: members.read
    source: listMembers
    columns: [name, status, joinedOn]
    compactColumns: [name]
    filters: [status, joinedOn]
    states:
      empty: { message: No member yet. }
      filteredEmpty: { message: No member matches. }
      failed:
        member-gone: { message: That member is gone. }
        default: { message: The members cannot be shown now. }
    onSelect: { navigate: member-view, with: { memberId: id } }
    actions:
      - { label: Invite, kind: navigate, target: invitation }
      - { label: Suspend, kind: operation, target: suspendMember, permission: members.write, when: 'status == "active"', confirm: "Suspend this member?", reason: why, then: { message: The member is suspended. } }
  directory:
    kind: list
    title: Directory
    route: /directory
    entity: Member
    permission: public
    source: listDirectory
    columns: [name]
    states:
      empty: { message: No member yet. }
  member-form:
    kind: form
    title: Register a member
    route: /members/new
    entity: Member
    permission: members.write
    submit: createMember
    sections:
      - { title: Who, fields: [name, status, joinedOn] }
      - { title: More, fields: [homeBranchId, visits, newsletter, notes, pin] }
    pickers:
      homeBranchId: { source: listBranches, shows: [name] }
    fieldConditions:
      visits: { readOnlyWhen: 'status == "inactive"' }
      notes: { hiddenWhen: "!newsletter" }
    checks:
      notes-not-the-name: { expression: notes != name, message: The notes repeat the name., field: notes }
    enteredTwice: [pin]
    onSubmitted: { navigate: member-view, with: { memberId: id }, message: The member is registered. }
  member-edit:
    kind: form
    title: Change a member
    route: /members/{memberId}/edit
    entity: Member
    permission: members.write
    source: getMember
    submit: updateMember
    fields: [joinedOn, name, status]
    fieldConditions:
      name: { readOnlyWhen: 'status == "inactive"' }
      joinedOn: { readOnly: true }
    states:
      failed:
        member-gone: { message: That member is gone. }
    onSubmitted: { navigate: member-view, with: { memberId: id }, message: The member is changed. }
  member-view:
    kind: view
    title: Member
    route: /members/{memberId}
    entity: Member
    permission: members.read
    source: getMember
    fields: [name, joinedOn]
    fieldConditions:
      joinedOn: { hiddenWhen: 'status == "inactive"' }
    states:
      failed:
        member-gone: { message: That member is gone. }
    actions:
      - { label: Change, kind: navigate, target: member-edit, permission: members.write }
      - { label: Suspend, kind: operation, target: suspendMember, permission: members.write, when: 'status == "active"', confirm: "Suspend this member?", reason: why, then: { message: The member is suspended. } }
  visits-form:
    kind: form
    title: Record visits
    route: /members/{memberId}/visits
    entity: Member
    permission: members.write
    source: getMember
    submit: recordVisits
    fields: [name]
    fieldConditions:
      name: { readOnly: true }
    childRows:
      - { relation: visitLog, title: Visits, fields: [visitedOn, note, id], maximum: 5, lockLoadedRows: true }
    states:
      failed:
        member-gone: { message: That member is gone. }
    onSubmitted: { navigate: member-view, with: { memberId: id }, message: The visits are recorded. }
  removal-form:
    kind: form
    title: Ask to remove a member
    route: /members/{memberId}/removal
    entity: RemovalRequest
    permission: members.write
    submit: requestRemoval
    fields: [why]
    onSubmitted: { navigate: members-list, message: Sent for approval. A supervisor answers within two days. }
  removals-inbox:
    kind: list
    title: Removals to approve
    route: /removals
    entity: RemovalRequest
    permission: members.approve
    source: listRemovals
    inbox: { workflow: removal, step: approve }
    columns: [memberId, why]
    actions:
      - { label: Approve, kind: operation, target: approveRemoval, confirm: "Approve this removal?", then: { message: The member is removed. } }
menus:
  people:
    title: People
    items:
      all: { title: All members, page: members-list }
      invite: { title: Invite someone, page: invitation }
      removals: { title: Removals to approve, page: removals-inbox }
  admin:
    title: Administration
    items:
      members: { title: Members, page: members-list }
accessibility: { standard: WCAG 2.2, level: AA }
