entities:
  Loan:
    type: object
    properties:
      loanId:
        type: integer
        format: int32
        minimum: 1
      cardNumber: {type: string, pattern: "^[0-9]{10}$"}
      loanedOn: {type: string, format: date}
      dueOn: {type: string, format: date}
      address1Line: {type: string, maxLength: 200}
      shelf:
        type: object
        properties:
          roomName: {type: string, maxLength: 40}
          bay:
            type: integer
            format: int32
            minimum: 1
            maximum: 99
        required: [roomName]
