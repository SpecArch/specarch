# Written by specarch decide; answers Q-2. Edit it as any decision.
decisions:
  ADR-222:
    title: Is the trace shown only in an environment with trace true, the last environment showing it a warning, or in every build except that of the last environment, with no key?
    status: accepted
    date: "2026-10-31"
    context: |-
      Q-2 asked: Is the trace shown only in an environment with trace true,
      the last environment showing it a warning, or in every build except that
      of the last environment, with no key? The options were: Only in an
      environment with trace: true, such as a user acceptance test
      environment; trace: true on the last environment, the one with no
      promotesTo, is a warning; In every build except that of the last
      environment, with no key. It blocked #/decisions/ADR-083. The second
      option takes the trace away from a project whose last environment is not
      its production, or that tests in it.
    decision: |-
      The trace is shown only in an environment whose entry says trace true,
      such as a user acceptance test environment: its builds carry the pointer
      in the web UI's data attributes and overlay and in the answer header. An
      environment that promotes to none, the last one, with trace true is a
      warning at that key, since it shows the inside of the system to its
      users. The alternative, showing the trace in every build except that of
      the last environment with no key, was not taken: it takes the trace away
      from a project whose last environment is not its production, or that
      tests in it.
    consequences: |-
      This decision rests on ADR-083, which stays as it is written unless this
      decision supersedes it.
    answers: [Q-2]
    decidedBy: owner
    restsOn: [ADR-083]
    origin: stated
    cites:
      - {source: owner-review-2026-10-31, says: 'The trace is shown only in an environment whose entry says trace true, such as a user acceptance test environment: its builds carry the pointer in the web UI''s data attributes and overlay and in the answer header. An environment that promotes to none, the last one, with trace true is a warning at that key, since it shows the inside of the system to its users. The alternative, showing the trace in every build except that of the last environment with no key, was not taken: it takes the trace away from a project whose last environment is not its production, or that tests in it.'}
