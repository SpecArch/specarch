  # specarch-problem: warning: test_case_missing: workflow refund has no red scenario for "approval without the permission of checkRefund"; add under tests refund-approval-without-the-permission-of-check-refund: { workflow: refund, scenario: red, covers: [approval without the permission of checkRefund], given: "a caller without the permission of checkRefund", when: "they approve a request waiting at checkRefund", then: "it is refused as not allowed, and the request still waits" } [test_case_missing.fa9ac8ca@design/workflows.yaml#/workflows/refund]
  # specarch-problem: warning: test_golden_missing: workflow refund has no golden scenario; add one under tests, for example refund-succeeds: { workflow: refund, scenario: golden, given: "any caller", when: "a request is made through its trigger and is approved at checkRefund and approveRefund", then: "it answers 202, then the operation of pay is called, and the request ends approved" } [test_golden_missing@design/workflows.yaml#/workflows/refund]
  refund:
    description: A refund above the clerk's limit is paid only after a clerk and then a manager approve it.
    steps:
      - name: checkRefund
        kind: approval
        approvers: [refund-clerk]
        deadline: PT4H
        onDeadline: escalate
        escalateTo: approveRefund
      - name: approveRefund
        kind: approval
        approvers: [branch-manager]
        onDeadline: refuse
      - name: pay
        kind: operation
    origin: stated
    cites:
      - {source: code, clause: processes/requests.bpmn, says: 'Line 13: Process Refund defines the workflow, with the tasks clerkCheck, managerCheck and pay in that order.'}
