specarch: "0.2"
info:
  title: Go source of things
  version: 0.1.0
  description: |
    The Go source under things, read at commit 9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b by the standard library's parser, by its syntax alone. Every operation cites the line that registers it; what the source does not say as a literal, or through a call the reader knows, is a question, and so is what the meta-model cannot hold.
