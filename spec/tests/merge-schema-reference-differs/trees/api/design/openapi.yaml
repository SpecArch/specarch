paths:
  /v1/things:
    post:
      operationId: createThing
      summary: Create a thing
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/schemas/CreateThingRequest'}
      responses:
        "201":
          description: The thing, created.
      origin: stated
      cites:
        - {source: openapi, clause: /paths/~1v1~1things/post, says: 'POST /v1/things: Create a thing.'}
  /v1/things/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: updateThing
      summary: Replace a thing
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/schemas/UpdateThingRequest'}
      responses:
        "204":
          description: The thing, replaced.
      origin: stated
      cites:
        - {source: openapi, clause: '/paths/~1v1~1things~1{id}/put', says: 'PUT /v1/things/{id}: Replace a thing.'}
schemas:
  CreateThingRequest:
    type: object
    properties:
      code: {type: string, maxLength: 20}
      name: {type: string}
    required: [code]
    origin: stated
    cites:
      - {source: openapi, clause: /components/schemas/CreateThingRequest, says: 'The schema CreateThingRequest, with the properties code and name.'}
  UpdateThingRequest:
    type: object
    properties:
      code: {type: string, maxLength: 20}
      name: {type: string}
    required: [code, name]
    origin: stated
    cites:
      - {source: openapi, clause: /components/schemas/UpdateThingRequest, says: 'The schema UpdateThingRequest, with the properties code and name.'}
