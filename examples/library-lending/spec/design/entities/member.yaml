# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-0.1.schema.json
entities:
  Member:
    description: A person with a library card.
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      cardNumber:
        title: Card number
        type: string
        pattern: "^[0-9]{8}$"
        maxLength: 8
        description: Printed on the card; assigned when the member joins.
      fullName: { title: Full name, type: string, minLength: 1, maxLength: 200, sensitivity: personal }
      email:
        title: Email address
        type: string
        format: email
        maxLength: 320
        sensitivity: personal
        atRest: encrypted
        lookup: hash
        description: Encrypted at rest, and found by a salted hash of it, since it must stay unique.
      tier: { title: Tier, $ref: "#/enums/MembershipTier" }
      address: { title: Address, $ref: "#/schemas/PostalAddress", sensitivity: personal }
      phones:
        title: Phone numbers
        type: array
        items: { $ref: "#/schemas/PhoneNumber" }
        maxItems: 3
        storage: json
        sensitivity: personal
      status: { title: Status, $ref: "#/enums/MemberStatus", default: active }
      joinedOn: { title: Joined on, type: string, format: date, readOnly: true }
      membershipEndsOn:
        title: Membership ends on
        type: string
        format: date
        readOnly: true
        description: The last day the card is valid; set a year after joining and moved on by each renewal.
      outstandingFees:
        title: Outstanding fees
        type: string
        format: decimal
        precision: 10
        scale: 2
        description: Sum of unpaid late fees and replacement charges, in the library's currency.
        readOnly: true
    required: [id, cardNumber, fullName, email, tier, status, joinedOn, membershipEndsOn, outstandingFees]
    primaryKey: [id]
    validity: { from: joinedOn, until: membershipEndsOn }
    audited: true
    deletion: soft
    relations:
      loans: { target: Loan, kind: one-to-many, via: memberId }
    constraints:
      member_card_number_unique:
        kind: unique
        fields: [cardNumber]
        message: A member with this card number already exists.
        satisfies: [LIB-1]
      member_email_unique:
        kind: unique
        fields: [email]
        message: A member with this email address already exists.
    satisfies: [LIB-1]
