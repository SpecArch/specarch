  # specarch-problem: question: open_question: (must, decision) proxy.ts runs before every route its matcher selects, pages and route handlers alike, and may check who is signed in, send them elsewhere or answer by itself. Which pages and operations does it cover, and what does it check on them? It blocks paths. Decided by system-owner. Answer with a decision record that names Q-11 under answers. [Q-11]
  Q-11:
    question: proxy.ts runs before every route its matcher selects, pages and route handlers alike, and may check who is signed in, send them elsewhere or answer by itself. Which pages and operations does it cover, and what does it check on them?
    kind: decision
    priority: must
    blocks: ['#/pages/about/permission', '#/pages/loans/permission', '#/pages/loans-by-loan-id/permission', '#/pages/root/permission', paths]
    decidedBy: system-owner
    why: Its place says the router runs it, and not which routes it acts on or what it checks; a check that runs before every route is how a permission is usually given, so it is asked, never assumed, until the JavaScript reader reads it.
    cites:
      - {source: code, clause: proxy.ts, says: Its place says the router runs it before the routes it covers.}
