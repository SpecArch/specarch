  # specarch-problem: warning: requirement_unsatisfied: no design element satisfies requirement LENDINGRULES-1; add satisfies: [LENDINGRULES-1] to the entity, operation, command, page, algorithm or decision that meets it [requirement_unsatisfied@requirements/requirements.yaml#/requirements/LENDINGRULES-1]
  LENDINGRULES-1:
    statement: A member shall borrow at most 5 books at a time.
    priority: must
    status: accepted
    origin: stated
    cites:
      - {source: lending-rules, clause: 2.1.1, says: A member shall borrow at most 5 books at a time.}
  # specarch-problem: warning: acceptance_missing: requirement LENDINGRULES-2 has no acceptance criteria, so no test can show it is met; add acceptance with one verifiable sentence per criterion [acceptance_missing@requirements/requirements.yaml#/requirements/LENDINGRULES-2]
