      other: { $value: [! 1, ! true, !custom 1, !custom true, !!binary aGk=, !<tag:yaml.org,2002:int> 5, !<tag:yaml.org,2002:str> 5, ! ~, ! '1', ! 2001-12-14, !!merge 1, !!seq 1] }
