  # specarch-problem: question: open_question: (must, decision) GET /invoices checks no permission the reader knows, since no implementation file names the project's checks. Is it meant to be open to everyone (public), or which permission should it check? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: GET /invoices checks no permission the reader knows, since no implementation file names the project's checks. Is it meant to be open to everyone (public), or which permission should it check?
    kind: decision
    priority: must
    blocks: ['#/paths/~1invoices/get/permission']
    decidedBy: system-owner
    why: An operation open to everyone is how an open endpoint is usually found, so it is asked, never assumed.
