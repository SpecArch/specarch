translations:
  "# %s: intent": "# %s: intent"
  "Version %s of the specification: why the system is built and what counts as success, %s, %s, %s and %s, in the shape of section 1 of arc42. Every other part of the specification is judged against this page.": "Spesifikasi versi %s: kenapa sistem ini dibangun dan apa yang dianggap berhasil, %s, %s, %s dan %s, mengikuti bentuk section 1 arc42. Bagian lain dari spesifikasi dinilai berdasarkan halaman ini."
  "goal": "goal"
  "goals": "goal"
  "out-of-scope entry": "entry out of scope"
  "out-of-scope entries": "entry out of scope"
  "quality goal": "quality goal"
  "quality goals": "quality goal"
  "the problem": "masalahnya"
  "no problem": "belum ada masalah yang ditulis"
  "Problem": "Masalah"
  "Who it hurts: ": "Yang terdampak: "
  "Today: ": "Kondisi saat ini: "
  "No problem is written, so nothing says what the system is for. Add problem with statement, the problem the system solves in plain words, and the stakeholders it hurts and how things stand today when they are known.": "Belum ada masalah yang ditulis, jadi belum jelas sistem ini untuk apa. Tambahkan problem dengan statement, yaitu masalah yang diselesaikan sistem dalam kata-kata sederhana, lalu stakeholder yang terdampak dan kondisi saat ini kalau sudah diketahui."
  "Goals": "Goal"
  "The outcomes the owner of the system wants, each with what is counted, the value today and the value wanted, and the needs that serve it.": "Hasil yang diinginkan pemilik sistem, masing-masing dengan apa yang dihitung, nilai saat ini, nilai yang dituju, dan kebutuhan yang mendukungnya."
  "| Goal | Statement | Measure | Baseline | Target | By | Priority | Status | Served by |": "| Goal | Pernyataan | Ukuran | Baseline | Target | Paling lambat | Prioritas | Status | Didukung oleh |"
  "%s is read on the live system by %s.": "%s dibaca di sistem live oleh %s."
  "No goal is written, so nothing says what counts as success. Add goals, each with statement, measure, baseline and target, and name the goals each need serves under goals on the need.": "Belum ada goal yang ditulis, jadi belum jelas apa yang dianggap berhasil. Tambahkan goals, masing-masing dengan statement, measure, baseline dan target, lalu sebutkan goal yang didukung tiap kebutuhan di goals pada kebutuhan itu."
  "Out of scope": "Out of scope"
  "What the system will not do, decided on purpose, so a question or a change request that asks for it is answered here.": "Hal yang memang diputuskan tidak dikerjakan sistem, jadi pertanyaan atau change request yang memintanya bisa dijawab dari sini."
  "| Entry | Statement | Until | Rules out |": "| Entry | Pernyataan | Sampai | Mengecualikan |"
  "not planned": "belum direncanakan"
  "Nothing is written out of scope, so a change request is triaged by a meeting, not a lookup. Add outOfScope with statement and why for each thing the system will not do.": "Belum ada yang ditulis sebagai out of scope, jadi triage change request masih perlu meeting, belum cukup dengan melihat spesifikasi. Tambahkan outOfScope dengan statement dan why untuk tiap hal yang tidak dikerjakan sistem."
  "Quality goals": "Quality goal"
  "The qualities that matter most, in rank order: when two pull apart, the higher rank wins.": "Kualitas yang paling penting, urut berdasarkan rank: kalau dua kualitas bertentangan, rank yang lebih tinggi yang dipilih."
  "| Rank | Quality goal | Quality | Statement | Requirements |": "| Rank | Quality goal | Kualitas | Pernyataan | Requirement |"
  "No quality goal is written, so a trade-off is argued rather than decided. Add qualityGoals, three to five, each with rank, quality and statement.": "Belum ada quality goal yang ditulis, jadi trade-off masih harus didiskusikan dulu, belum bisa langsung diputuskan. Tambahkan qualityGoals, tiga sampai lima, masing-masing dengan rank, quality dan statement."
  "%s (rank %s, %s)": "%s (rank %s, %s)"
  "Quality goals weighed, highest rank first: ": "Quality goal yang dipertimbangkan, rank tertinggi lebih dulu: "
  "Each goal with the value it started from, the value wanted, the latest value a monitor read, and how many of the requirements that serve it, through the needs that name the goal, are met: a requirement is met once the release it names is released. Rejected and retired requirements are not counted. No record holds a monitor's reading yet, so the latest value is none recorded.": "Tiap goal dengan nilai awalnya, nilai yang dituju, nilai terakhir yang dibaca monitor, dan berapa requirement yang mendukungnya, lewat kebutuhan yang menyebut goal itu, sudah terpenuhi: requirement dianggap terpenuhi begitu release yang disebutnya sudah di-release. Requirement yang rejected dan retired tidak dihitung. Belum ada record yang menyimpan hasil bacaan monitor, jadi nilai terakhir ditulis belum tercatat."
  "| Goal | Status | Baseline | Target | Latest reading | Requirements met |": "| Goal | Status | Baseline | Target | Bacaan terakhir | Requirement terpenuhi |"
  "none serves it": "belum ada yang mendukung"
  "%d of %d": "%d dari %d"
  "none recorded": "belum tercatat"
  " Goals |": " Goal |"
