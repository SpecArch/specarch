questions:
  Q-5:
    question: 'What is each setting for, where does its value come from, and is it a secret: DESK_API_KEY, DESK_CHECKS_ON?'
    kind: decision
    priority: must
    blocks: ['#/configuration/deskApiKey/description', '#/configuration/deskChecksOn/description', '#/configuration/deskChecksOn/secret']
    decidedBy: system-owner
    why: The source names the settings it reads and not what they are for; whether one is a secret is said only where the source marks it sensitive.
  Q-6:
    question: 'Is each of these settings a secret: DESK_API_KEY? Each name says it may hold a credential, and the source does not mark it sensitive.'
    kind: decision
    priority: must
    blocks: ['#/configuration/deskApiKey/secret']
    decidedBy: system-owner
    why: A secret's value is never written in a specification, and the name alone does not say which a setting is.
