  CASE-1:
    statement: A loan shall be due 21 days after it is made.
    kind: functional
    priority: must
    status: accepted
    acceptance: [A loan made on the first is due on the twenty-second.]
    verification: test
    needs: [NEED-1]
    why: The manual sets the period.
    cites:
      - { source: desk-manual, clause: "3.3.1", says: "The loan period is 21 days." }
