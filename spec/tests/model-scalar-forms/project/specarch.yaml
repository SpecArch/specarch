      exponents: { $value: [1e3, 1E3, 1e+3, 1e-3, 1.5e3, .5e3, 1.e3, 1e, e3, 1e3.5, 1e400, 1e-400, 1e6, 1e21, 1e-7, 2.5e-5, 1e+06] }
      notNumbers: { $value: [., +., -., .e3, 1.2.3, 0x1p3, 1.5f, $1, v1] }
      underscores: { $value: [1_0.5, 1.5_, 1._5, 1_.5, .5_0, ._5, .5_, _1.5, 1_e3, 1e_3, 1e3_, -_1.5] }
      special: { $value: [.inf, .Inf, .INF, +.inf, +.Inf, +.INF, -.inf, -.Inf, -.INF, .nan, .NaN, .NAN, -.nan, +.nan, .iNf, .nAn, inf, nan, Infinity, NaN] }
    booleans:
      plain: { $value: [true, True, TRUE, false, False, FALSE, tRue, fALSE, yes, Yes, YES, no, No, on, On, off, Off, y, Y, n, N] }
    nulls:
      plain: { $value: [null, Null, NULL, ~, nUll, none] }
