specarch: "1.0.0"
info: { title: Case, version: 1.0.0 }
entities:
  Loan:
    type: object
    properties:
      id: { type: string, format: uuid }
      memberId: { type: string, format: uuid }
    required: [id, memberId]
    primaryKey: [id]
caller:
  description: Who is making the call.
  properties:
    memberId: { type: [string, "null"], format: uuid, description: The member signed in. }
permissions:
  loans.read: { description: See loans. }
roles:
  member:
    description: A card holder.
    permissions: [loans.read]
    rowPolicies:
      Loans: memberId == caller.memberId
  auditor:
    description: An auditor.
    permissions: [loans.read]
    rowPolicies:
      Loan: memberId
  clerk:
    description: A clerk.
    permissions: [loans.read]
    rowPolicies:
      Loan: ownerId == caller.memberId
