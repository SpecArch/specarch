questions:
  Q-1:
    question: 'What values does each path parameter of /branches/{branchCode}/copies take: branchCode?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1branches~1{branchCode}~1copies/parameters/0/schema']
    decidedBy: system-owner
    why: A route table names a path's parameters and not the values they take.
  Q-2:
    question: What does GET /branches/{branchCode}/copies do, and what does it answer?
    kind: decision
    priority: must
    blocks: ['#/paths/~1branches~1{branchCode}~1copies/get/summary', '#/paths/~1branches~1{branchCode}~1copies/get/responses']
    decidedBy: system-owner
    why: A route table names the handler and not what it does or the responses it gives.
