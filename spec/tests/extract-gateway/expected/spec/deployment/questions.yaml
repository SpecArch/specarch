questions:
  # specarch-problem: question: open_question: (should, decision) Is each of these settings no secret, as an address is not: catalogueUrl, loansUrl? Decided by system-owner. Answer with a decision record that names Q-9 under answers. [Q-9]
  Q-9:
    question: 'Is each of these settings no secret, as an address is not: catalogueUrl, loansUrl?'
    kind: decision
    priority: should
    blocks: ['#/configuration/catalogueUrl/secret', '#/configuration/loansUrl/secret']
    decidedBy: system-owner
    why: The gateway table names the setting an address is read from and not whether it is sensitive.
  # specarch-problem: question: open_question: (must, decision) Is each of these settings a secret: reportsApiKey? Each name says it may hold a credential, and the gateway table reads an address from it. Decided by system-owner. Answer with a decision record that names Q-10 under answers. [Q-10]
  Q-10:
    question: 'Is each of these settings a secret: reportsApiKey? Each name says it may hold a credential, and the gateway table reads an address from it.'
    kind: decision
    priority: must
    blocks: ['#/configuration/reportsApiKey/secret']
    decidedBy: system-owner
    why: A secret's value is never written in a specification, and the name alone does not say which a setting is.
