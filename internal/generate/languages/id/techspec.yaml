translations:
  "%s, version %s": "%s, versi %s"
  "# %s: technical specification": "# %s: spesifikasi teknis"
  "Version %s of the specification: %s. The chapters follow arc42, and a chapter with nothing in the specification is left out.": "Spesifikasi versi %s: %s. Bab-babnya mengikuti arc42, dan bab yang isinya tidak ada di spesifikasi tidak dimuat."
