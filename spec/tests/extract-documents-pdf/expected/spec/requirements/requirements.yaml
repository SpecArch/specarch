stakeholders:
  system-owner:
    description: Whoever owns the system that was read and answers for it; the reviewer replaces this with the real role.
    origin: inferred
    why: The surface names no one, and every question needs a stakeholder to decide it.
requirements:
  # specarch-problem: warning: acceptance_missing: requirement LENDINGRULES-1 has no acceptance criteria, so no test can show it is met; add acceptance with one verifiable sentence per criterion [acceptance_missing@requirements/requirements.yaml#/requirements/LENDINGRULES-1]
  LENDINGRULES-1:
    statement: A member shall borrow at most 5 books at a time.
    priority: must
    status: accepted
    origin: stated
    cites:
      - {source: lending-rules, clause: "2.1", says: A member shall borrow at most 5 books at a time.}
  # specarch-problem: warning: acceptance_missing: requirement LENDINGRULES-2 has no acceptance criteria, so no test can show it is met; add acceptance with one verifiable sentence per criterion [acceptance_missing@requirements/requirements.yaml#/requirements/LENDINGRULES-2]
  LENDINGRULES-2:
    statement: A loan must be returned within 14 days.
    priority: must
    status: accepted
    origin: stated
    cites:
      - {source: lending-rules, clause: "2.2", says: A loan must be returned within 14 days.}
  # specarch-problem: warning: acceptance_missing: requirement LENDINGRULES-3 has no acceptance criteria, so no test can show it is met; add acceptance with one verifiable sentence per criterion [acceptance_missing@requirements/requirements.yaml#/requirements/LENDINGRULES-3]
  LENDINGRULES-3:
    statement: A fine should be paid at the desk.
    priority: should
    status: accepted
    origin: stated
    cites:
      - {source: lending-rules, clause: "3.1", says: A fine should be paid at the desk.}
questions:
  # specarch-problem: question: open_question: (must, decision) Section 3.1 says "It must be paid in cash.", and does not name what it commits; which element is it? It blocks requirements. Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: Section 3.1 says "It must be paid in cash.", and does not name what it commits; which element is it?
    kind: decision
    priority: must
    blocks: [requirements]
    decidedBy: system-owner
    why: A sentence that names its subject only by a word such as it or they cannot be placed as one element without guessing.
    cites:
      - {source: lending-rules, clause: "3.1", says: It must be paid in cash.}
  # specarch-problem: question: open_question: (must, decision) Which kind is each requirement read from the document: LENDINGRULES-1, LENDINGRULES-2, LENDINGRULES-3? Functional, quality, interface or constraint. Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: 'Which kind is each requirement read from the document: LENDINGRULES-1, LENDINGRULES-2, LENDINGRULES-3? Functional, quality, interface or constraint.'
    kind: decision
    priority: must
    blocks: ['#/requirements/LENDINGRULES-1/kind', '#/requirements/LENDINGRULES-2/kind', '#/requirements/LENDINGRULES-3/kind']
    decidedBy: system-owner
    why: A document states what is committed, not which kind of requirement it is.
  # specarch-problem: question: open_question: (could, decision) Not held: page 2 holds no text: a scanned page is a picture of text, which is not read; read the page's text from a copy that holds it. Does the specification need it, written another way or described by hand? It blocks requirements. Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: 'Not held: page 2 holds no text: a scanned page is a picture of text, which is not read; read the page''s text from a copy that holds it. Does the specification need it, written another way or described by hand?'
    kind: decision
    priority: could
    blocks: [requirements]
    decidedBy: system-owner
    why: The source says it, and the meta-model cannot hold it as the source writes it, so the reader left it out or wrote it as the question says. Nothing waits for the answer.
    cites:
      - {source: lending-rules, clause: page 2, says: 'Not held: page 2 holds no text: a scanned page is a picture of text, which is not read; read the page''s text from a copy that holds it.'}
