questions:
  # specarch-problem: question: open_question: (must, decision) Section 2.1 says "It must be returned to the branch that lent it.", and does not name what it commits; which element is it? It blocks requirements. Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: Section 2.1 says "It must be returned to the branch that lent it.", and does not name what it commits; which element is it?
    kind: decision
    priority: must
    blocks: [requirements]
    decidedBy: system-owner
    why: A sentence that names its subject only by a word such as it or they cannot be placed as one element without guessing.
    cites:
      - {source: handbook, clause: "2.1", says: It must be returned to the branch that lent it.}
  # specarch-problem: question: open_question: (must, decision) Which kind is each requirement read from the document: HANDBOOK-1, HANDBOOK-2, HANDBOOK-3, HANDBOOK-4? Functional, quality, interface or constraint. Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: 'Which kind is each requirement read from the document: HANDBOOK-1, HANDBOOK-2, HANDBOOK-3, HANDBOOK-4? Functional, quality, interface or constraint.'
    kind: decision
    priority: must
    blocks: ['#/requirements/HANDBOOK-1/kind', '#/requirements/HANDBOOK-2/kind', '#/requirements/HANDBOOK-3/kind', '#/requirements/HANDBOOK-4/kind']
    decidedBy: system-owner
    why: A document states what is committed, not which kind of requirement it is.
  # specarch-problem: question: open_question: (could, decision) Not held: a code block at line 40: code in a document is not read as a commitment. Does the specification need it, written another way or described by hand? It blocks requirements. Decided by system-owner. Answer with a decision record that names Q-6 under answers. [Q-6]
  Q-6:
    question: 'Not held: a code block at line 40: code in a document is not read as a commitment. Does the specification need it, written another way or described by hand?'
    kind: decision
    priority: could
    blocks: [requirements]
    decidedBy: system-owner
    why: The source says it, and the meta-model cannot hold it as the source writes it, so the reader left it out or wrote it as the question says. Nothing waits for the answer.
    cites:
      - {source: handbook, clause: "3", says: 'Not held: a code block at line 40: code in a document is not read as a commitment.'}
