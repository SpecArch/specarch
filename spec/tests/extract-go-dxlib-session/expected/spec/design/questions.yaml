  # specarch-problem: question: open_question: (must, decision) api/endpoints.go:40 registers POST /sync with EndPointTypeHTTPEndToEndEncryptionV3, a persistent-session envelope whose key exchange, cipher and session store the service supplies through dxlib's OnE2EEV3Unpack and OnE2EEV3Pack hooks, and the reader knows the envelope only when they open and seal dxlib's datablock: OnE2EEV3Unpack: api/hooks.go:25 sets it to passThrough, which does not call dxlib's datablock.UnpackLVPayload, followed through the functions it calls three deep; OnE2EEV3Pack: api/hooks.go:26 sets it to passBack, which does not call dxlib's datablock.PackLVPayload, followed through the functions it calls three deep. Which handshake does it travel in, with its key agreement, signature, cipher and the operation that establishes it? Decided by system-owner. Answer with a decision record that names Q-7 under answers. [Q-7]
  Q-7:
    question: 'api/endpoints.go:40 registers POST /sync with EndPointTypeHTTPEndToEndEncryptionV3, a persistent-session envelope whose key exchange, cipher and session store the service supplies through dxlib''s OnE2EEV3Unpack and OnE2EEV3Pack hooks, and the reader knows the envelope only when they open and seal dxlib''s datablock: OnE2EEV3Unpack: api/hooks.go:25 sets it to passThrough, which does not call dxlib''s datablock.UnpackLVPayload, followed through the functions it calls three deep; OnE2EEV3Pack: api/hooks.go:26 sets it to passBack, which does not call dxlib''s datablock.PackLVPayload, followed through the functions it calls three deep. Which handshake does it travel in, with its key agreement, signature, cipher and the operation that establishes it?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1sync/post/handshake']
    decidedBy: system-owner
    why: dxlib routes a V3 body to the host's hooks and fixes nothing of the envelope, so the reader cannot write the handshake from the type.
    cites:
      - {source: code, clause: 'api/endpoints.go:40', says: Registers POST /sync with EndPointTypeHTTPEndToEndEncryptionV3.}
