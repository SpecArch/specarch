# yaml-language-server: $schema=../../../schema/specarch-fragment-design-1.0.schema.json
decisions:
  ADR-192:
    title: Both validators check a machine's reachability, dead ends, unused states, causes, names and ambiguity with the same lines; the diagram draws causes, conditions and updates on the arrows, the variables as a note, nested states and parallel machines; the documents, the test plan and the guarded script follow; the step is minor, 1.3.0
    status: accepted
    date: "2026-10-26"
    context: |
      The validator checks a state field, a state value and a trigger
      and nothing else of a machine; the diagram draws the trigger on
      each arrow and marks the derived initial and final states; the test
      plan derives the paths from an initial to a terminal state. The
      owner asked for checks of unreachable states, dead ends without a
      final state, a trigger naming nothing, a condition or update naming
      an unknown variable, nondeterminism, and a transition missing for a
      state the requirements name, in both builds with the same output,
      and for a diagram showing the conditions and updates, the variables
      and the nested and parallel states. A 1.x may add a key a file is
      free to leave out and a warning, and never makes a valid 1.0 file
      invalid (ADR-186). Mermaid's stateDiagram-v2 was checked on
      2026-10-26 with mermaid-cli 12.0.0: nested states, the concurrency
      separator, labels with brackets and slashes and multi-line notes
      draw; a description line replaces a state's name; there is no
      history pseudostate, and an arrow from outside into a state drawn
      inside a composite pulls the state out of it.
    decision: |
      The checks of docs/state-machines.md, section 4, in both builds:
      state_field, state_value and trigger as today, widened to the full
      form; state_machine, an unknown entity, enum, within machine or a
      history target that is not composite; state_initial, an error for a
      composite without initial, a full-form entity machine whose field
      has no default and a standalone machine without initial, and a
      warning for a short-form entity whose derivation over the states its
      transitions name finds two or more initial states, or none because
      every state is reached; state_unreachable, a
      warning for a state that is not initial and that no transition
      reaches; state_dead_end, a warning for a full-form simple state no
      transition leaves that final does not name; state_final, an error
      for a transition from a final state; state_unused, a warning for an
      enum value no transition names that is not the machine's initial
      state, the field's default or initial, a value the derivation of
      the short form never makes initial since it runs over the states
      the transitions name; transition_cause, transition_ambiguous, a
      warning for two transitions with neither when nor otherwise and an
      error for the pairs that need either, and transition_overlap as
      ADR-190 says; transition_history, an
      error for enter: history to a state without history; time_zone, an
      error for a date in at in a specification that declares no
      timeZone, for a timeZone that is no IANA name, for a time-zone
      default or example that is no IANA name and for a local-date-time
      field without why, and a warning for a validity bounded by a date
      or a date() of an instant without timeZone (ADR-193) and for a
      date-time default or example written without its offset (ADR-194);
      state_field also for a field an entity declares under a name the
      machine's entry instants take and for the later of two states of the entity's
      machines whose <State>EnteredAt names are one; and the
      expression rules for when, set, invariant, at and the sets of entry
      and exit, at giving a timestamp or a date and, reading a name that
      may be null, carrying a when with <name> != null alone or as an
      operand of its top-level conjunction, and a set naming a control
      field or the primary key reported as expression_name. The
      diagram is one
      stateDiagram-v2 per machine, and stateDiagram <Entity> draws an
      entity's machines as the concurrent regions of one state named
      after it: each arrow labelled with its cause, then [when] or
      [otherwise], then a slash and each set as name = expression; after
      and at as the cause; a composite state as a nested state; a machine
      within another as a region with a note after it naming the machine
      and the states it is within; history as (history) after the cause
      on the arrow into the composite; entry, exit and invariant as a
      note at the state, one line each; the variables as a note at the
      machine, one per line with type and default. The technical
      specification adds the variables and transitions tables after each
      diagram and lists standalone machines with the entities'; the test
      plan derives paths over simple states per machine, a red case per
      when, the two cases of a timer and from wrong state as today, and a
      design test names a transition by its machine, from, to and, when
      two share those, its cause; specarch-gen-scripts takes when and set
      into the guarded script; specarch model lists the machines; generate
      sql writes the entry instant columns of a machine with after beside
      its state field, as the audit columns, and the technical
      specification lists them. The step is 1.3.0, the rule names frozen at
      that release.
    why: |
      Every check that can fire on a file written today is a warning,
      because ADR-186 forbids a 1.x to make a valid file invalid, and
      every error needs a key only the full form has or a pair that
      needs when or otherwise; on this repository's specification and
      the examples no line changes once the library lending example
      declares its timeZone, which time_zone would otherwise warn about
      at a date() of an instant and a validity bounded by dates, and
      seven conformance cases gain warning lines their expected output
      then records: state_unused for the enum value their transitions
      never name, which the derivation never makes initial,
      transition_cause for the transitions with no cause, which are not
      grouped for ambiguity, transition_ambiguous for a pair on one
      trigger with neither when nor otherwise, and time_zone for a
      validity bounded by a date. A machine within
      another is drawn as a region with a note, and not inside a
      composite state, because the states it names need not be one
      composite and one drawing for every case is read without a rule;
      the note stands after the region's block, since Mermaid refuses a
      note on a state it has not drawn yet, as the check showed.
      Unreachable and dead-end states are
      warnings and not errors because a machine with one is incomplete,
      not wrong, and the compiler reads an incomplete definition and says
      where. A transition missing for a state the requirements name is
      state_unused, the enum value no transition touches, because the
      validator does not read prose and the link from a requirement to a
      state is the enum value it asked for. The same lines in both builds
      is the rule every validator change follows. The arrow label follows
      UML's trigger [guard] / effect so that a reader of UML reads it
      without learning a notation; a note holds entry, exit, invariant
      and the variables because Mermaid has no other place for them and a
      description line would hide the state's name; history is a suffix
      on the arrow because Mermaid draws no history pseudostate and pulls
      a targeted nested state out of its composite. The step is minor
      because everything is an addition, as docs/maintenance.md rule 7
      reads semantic versioning. Compiler test: every rule reports at the
      entry and the diagram still draws the machine, the entry marked;
      acceptance test: a remark on a path in the test plan names the
      transition it is about by machine, from, to and cause.
    consequences: |
      Eleven rules join the Rule enum when they are built, and the
      conformance cases under spec/tests carry each. The documents of the
      examples do not change until an example uses the full form or
      declares a timeZone. generate sql writes an entity's entry instant
      columns for a machine with after.
    restsOn: [ADR-186, ADR-189, ADR-190, ADR-191]
    satisfies: [SA-98]
    cites:
      - source: uml-2-5-1
        clause: "14.2.4, Notation"
        says: "A transition is labelled trigger [guard] / effect, a composite state is drawn with its regions inside it, and concurrent regions are separated by a dashed line."
