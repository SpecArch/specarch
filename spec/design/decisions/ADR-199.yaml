# yaml-language-server: $schema=../../../schema/specarch-fragment-design-1.0.schema.json
decisions:
  ADR-199:
    title: An algorithm may be a decision table, its rules checked for overlap and gaps by its hit policy, each rule a worked example
    status: proposed
    date: "2026-10-27"
    context: |
      An algorithm is a formula in SpecArch's subset of CEL with worked
      examples (ADR-004). Many rules a business states are not
      arithmetic but a choice by cases: which members may borrow, what
      a fee is by membership and lateness. Written as a formula, such a
      rule is a chain of ?: that a business reader cannot check, and the
      cases nobody thought of stay hidden: the formula gives some value
      for them, and no example asks which. Business people already keep
      these rules as tables, a row per case.
    decision: |
      An algorithm gives table in place of formula, after DMN 1.5's
      decision table: the inputs are its columns, and rules, in order,
      each has when, a condition on each input it tests by the input's
      name, and then, the output, written as a worked example's expected
      value. An input a rule does not name matches any value, so a rule
      with no when matches every input.

      A condition is one of: a value, written as a worked example writes
      it, which the input equals; an operator <, <=, >, >= or != and a
      value, such as "< 6"; comparisons joined by and, such as ">= 3 and
      < 6"; null, for an input that is null; or a list of these, any of
      which may hold. A value never matches null, so a nullable input's
      null is matched only by null or by not naming the input. A table
      tests inputs of type int, uint, decimal, double, date, enum, bool
      and string; a string only for equality and !=. An input of another
      type may be given when no rule names it: every rule matches any
      value of it, and the table is checked over the other inputs. A
      string or enum condition that begins with <, > or != is read as a
      comparison, so a value that itself begins so cannot be matched by a
      table.

      hitPolicy is unique or first, one of them always written. Under
      unique at most one rule may match any inputs: two rules that both
      match some inputs are an error, table_overlap, at the later one,
      naming the inputs both match. Under first the first rule that
      matches gives the output: a rule the earlier rules match whenever
      it matches is never reached, a table_overlap warning. Under both,
      inputs no rule matches are an error, table_gap, naming them as a
      when that can be pasted in as a new rule. An input's minimum,
      maximum and exclusive bounds, an int32's range and a uint's zero
      bound limit the inputs the gap check asks about.

      A condition or an output that cannot be read is decision_table at
      it, and the table is then not checked for overlap and gaps, since
      the rule it is in could not be placed. A condition that holds for no
      value its input may take, such as "< 0" for an input of minimum 0,
      is a decision_table warning at it: the rule matches nothing.
      An input whose minimum and maximum leave it no value is
      decision_table at the input, and the table is not checked. Each rule is a worked
      example: its inputs are the first values it reaches that no
      earlier rule matches under first, or that no other rule matches
      under unique, and specarch try evaluates the table on each rule's
      example and on the algorithm's examples, which are checked against
      the table as a formula's are. examples is then optional; pseudocode
      is required as for a formula.
    consequences: |
      An algorithm with a formula is unchanged. The technical
      specification draws a table as a table, a column per input and the
      output, in rule order. specarch try prints a step per rule tested,
      whether it matches, and the rule that gives the output. The test
      generators still write a test per worked example under examples;
      a test per rule is a later addition, since a plug-in reads the
      specification as data and the rule's example is the validator's.
    why: |
      DMN 1.5 is the standard business modellers read for decision
      tables, so its words are taken: rule, hit policy, unique and first,
      a condition per input column, a blank cell matching anything. Its
      other hit policies are left out until a table needs one: any
      (overlap allowed when the outputs agree) hides the same case
      written twice; priority and output order rank rules by an order of
      the output's values the format does not hold; rule order and
      collect give a list or an aggregate, which an algorithm's single
      output does not take. unique is DMN's default, and is written
      rather than assumed, since a reader cannot tell a table that means
      first from one that means unique by its rows.

      A condition is DMN's unary test, the input left out, rather than a
      CEL expression per rule: a per-input test of a value, a comparison
      or a range is what a table's cell holds in DMN and in a
      spreadsheet, and it keeps overlap and gaps decidable, each rule a
      box of value sets, where a rule over any CEL expression would need
      a solver to say which inputs it matches. Values are written as a
      worked example writes them, so one value is written one way in the
      whole format, and FEEL's own syntax ([3..6), "a","b") is not
      taken, as a second expression language beside CEL. A range is two
      comparisons joined by and, a word, since a bracket's open or closed
      end is easy to misread. Timestamps, times of day and durations are
      left out until a table needs one: a cell that says "< PT2H" or an
      instant is better worked out by a formula from a date or a number.
      Such an input that no rule names is no cell at all, so the table
      is still checked rather than left unread: overlap, gaps and worked
      examples would otherwise go unchecked with no problem reported.
      A value beginning with an operator is not given a second, quoted
      way to be written: a quoted scalar is already how YAML writes a
      comparison, and one way to say one thing outweighs the rare value
      such as <none>, which a formula still tests.

      A gap is an error, not a warning: an algorithm gives its output for
      every input it accepts, and inputs no rule matches are a case the
      table's authors did not decide, which the error names so it can be
      decided; under first a last rule with no when is the decision
      "everything else", while under unique each gap needs a rule of its
      own, since a rule with no when overlaps every other. A rule never reached under first is a warning, since the
      table still gives an output for every input, but the rule says
      something the table never does.
    satisfies: [SA-104]
