arguments: [merge, --out, spec, trees/catalogue, trees/replica]
exitStatus: 0
standardOutput: |
  tree trees/catalogue: Catalogue database, on the code side: 2 elements and 0 questions
  tree trees/replica: Lending desk database, on the code side: 2 elements and 0 questions
