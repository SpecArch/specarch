permissions:
  branches.read:
    origin: inferred
    why: 'dxlib names the privilege BRANCHES.READ, and by the rule of ADR-076 a privilege named in capitals, digits and underscores, in segments joined by dots, is the permission of that name in lower case with every underscore a dot: branches.read.'
    cites:
      - {source: code, clause: 'api/endpoints.go:13', says: POST /branches/list checks BRANCHES.READ in its privileges.}
      - {source: code, clause: 'seed/seed.go:19', says: Grants BRANCHES.READ to desk-staff.}
  loans.read:
    description: Read the loans of any member.
    origin: inferred
    why: 'dxlib names the privilege LOANS.READ, and by the rule of ADR-076 a privilege named in capitals, digits and underscores, in segments joined by dots, is the permission of that name in lower case with every underscore a dot: loans.read.'
    cites:
      - {source: code, clause: 'api/endpoints.go:9', says: POST /loans/list checks LOANS.READ in its privileges.}
      - {source: code, clause: 'seed/seed.go:17', says: Grants LOANS.READ to desk-staff.}
      - {source: code, clause: 'seed/seed.go:14', says: Inserts the privilege LOANS.READ.}
  loans.renew:
    origin: inferred
    why: 'dxlib names the privilege LOANS.RENEW, and by the rule of ADR-076 a privilege named in capitals, digits and underscores, in segments joined by dots, is the permission of that name in lower case with every underscore a dot: loans.renew.'
    cites:
      - {source: code, clause: 'seed/seed.go:18', says: Grants LOANS.RENEW to desk-staff.}
      - {source: code, clause: 'seed/seed.go:15', says: Inserts the privilege LOANS.RENEW.}
