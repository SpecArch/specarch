# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.5.0/schema/specarch-design-0.1.schema.json
specarch: "0.1"
info:
  title: Pages of app
  version: 0.1.0
  description: |
    The pages and operations the file-system router rooted at app serves, read from the files git tracks there at commit fa34c2e0f9303ab285e8a4960125dd1d1f5e5ae7, with the content of each page that has a schema file from that file. Every page and operation cites its file; what the files' places and the schemas do not say is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: fa34c2e0f9303ab285e8a4960125dd1d1f5e5ae7
    url: ../site
    clauses:
      - {clause: 'app/(shop)/orders/[orderId]/page.schema.ts', title: 'The schema of the page at /orders/{orderId}'}
      - {clause: 'app/(shop)/orders/[orderId]/page.tsx', title: 'The page file of /orders/{orderId}'}
      - {clause: app/(shop)/orders/page.schema.ts, title: The schema of the page at /orders}
      - {clause: app/(shop)/orders/page.tsx, title: The page file of /orders}
      - {clause: app/api/orders/route.ts, title: The route file of /api/orders}
      - {clause: app/page.tsx, title: The page file of /}
      - {clause: app/status/page.js, title: The page file of /status}
      - {clause: middleware.ts, title: Middleware the router runs before the routes it covers}
