  # specarch-problem: question: open_question: (must, decision) No rule of the permission table reaches GET /status. Is it closed on purpose, so that nobody may call it, or should a rule reach it? Decided by system-owner. Answer with a decision record that names Q-9 under answers. [Q-9]
  Q-9:
    question: No rule of the permission table reaches GET /status. Is it closed on purpose, so that nobody may call it, or should a rule reach it?
    kind: decision
    priority: must
    blocks: ['#/paths/~1status/get/permission']
    decidedBy: system-owner
    why: A route no rule reaches refuses every caller, and so does a route a rule was forgotten for, so it is asked, never assumed.
