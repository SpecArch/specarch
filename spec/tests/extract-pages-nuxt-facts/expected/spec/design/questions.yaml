  # specarch-problem: question: open_question: (must, decision) Which framework serves the folder site/pages, Next.js or Nuxt? The reader read it as the pages of Nuxt, since no tracked package.json at or above site/pages names the framework; the folder holds .vue files, which only Nuxt serves. It blocks pages. Decided by system-owner. Answer with a decision record that names Q-10 under answers. [Q-10]
  Q-10:
    question: Which framework serves the folder site/pages, Next.js or Nuxt? The reader read it as the pages of Nuxt, since no tracked package.json at or above site/pages names the framework; the folder holds .vue files, which only Nuxt serves.
    kind: decision
    priority: must
    blocks: [pages]
    decidedBy: system-owner
    why: Next.js and Nuxt both serve pages from a folder named pages, by different rules, and the package that names the framework does not say which; the reader's choice is a guess, so it is asked.
