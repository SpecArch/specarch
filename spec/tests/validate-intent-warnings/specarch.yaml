specarch: "1.0.0"
info: { title: Case, version: 1.0.0 }
problem:
  statement: Clerks cannot find an item by name, so a sale waits while they search the shelves.
  stakeholders: [clerk]
goals:
  GOAL-1:
    statement: Sales wait less.
    measure: Seconds from a customer's request to the item on the counter.
    status: accepted
  GOAL-2:
    statement: Fewer items are lost.
    measure: Items written off per month.
    target: 2 items a month
    status: accepted
outOfScope:
  OUT-1:
    statement: The system does not order stock from suppliers.
    needs: [NEED-2]
qualityGoals:
  QG-1: { rank: 1, quality: functional-suitability, statement: A name search finds every item of that name. }
  QG-2: { rank: 1, quality: interaction-capability, statement: A clerk finds an item in under ten seconds. }
stakeholders:
  clerk: { description: Staff at the till. }
stakeholdersComplete: { by: clerk, date: "2026-11-05" }
needs:
  NEED-1: { statement: Items must be findable by name., stakeholders: [clerk], status: accepted, goals: [GOAL-1] }
  NEED-2: { statement: Stock should be reordered for me., stakeholders: [clerk], status: accepted }
requirements:
  CASE-1:
    statement: An item shall have a non-empty name.
    kind: functional
    priority: must
    status: accepted
    acceptance: [Saving an item with an empty name is refused.]
    verification: test
    needs: [NEED-1]
  CASE-2:
    statement: The system shall order stock when it runs low.
    kind: functional
    priority: could
    status: accepted
    acceptance: [An item below its minimum is ordered once.]
    verification: test
    needs: [NEED-2]
