questions:
  # specarch-problem: question: open_question: (must, decision) What does gateway api do, in a sentence a reviewer can check? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: What does gateway api do, in a sentence a reviewer can check?
    kind: decision
    priority: must
    blocks: ['#/gateways/api/description']
    decidedBy: system-owner
    why: The gateway table is a lookup and says nothing of what the gateway is for.
  # specarch-problem: question: open_question: (must, decision) Which token does gateway api verify before it reads aud, with its format, its signature algorithm and its claims? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: Which token does gateway api verify before it reads aud, with its format, its signature algorithm and its claims?
    kind: decision
    priority: must
    blocks: ['#/gateways/api/token']
    decidedBy: system-owner
    why: The gateway table shows a lookup by a claim and not the verifier that checks the token first; a claim read before the signature is checked is no gateway the meta-model holds.
  # specarch-problem: question: open_question: (should, decision) What does gateway api answer itself, with which status and problem type, when the token is missing or wrong, when the aud names no service, and when the service fails or does not answer in time? Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: What does gateway api answer itself, with which status and problem type, when the token is missing or wrong, when the aud names no service, and when the service fails or does not answer in time?
    kind: decision
    priority: should
    blocks: ['#/gateways/api/refusals']
    decidedBy: system-owner
    why: The gateway table holds the services and not the gateway's own answers.
  # specarch-problem: question: open_question: (must, decision) What is the service loans, and how long does the gateway wait for its answer? Decided by system-owner. Answer with a decision record that names Q-4 under answers. [Q-4]
  Q-4:
    question: What is the service loans, and how long does the gateway wait for its answer?
    kind: decision
    priority: must
    blocks: ['#/dependencies/loans/description', '#/dependencies/loans/timeout']
    decidedBy: system-owner
    why: The gateway table names the service and not what it is or how long a request to it may take.
    cites:
      - {source: gateway-table, clause: gateway, says: 'Row 1 of the gateway table: Forwards https://loans.library.example.'}
