specarchImplementation: "0.1"

info:
  title: The core in Go
  version: 0.1.0

implements:
  file: ../specarch.yaml
  version: 0.1.0

stack:
  language: { name: Go, version: "1.26" }

bindings:
  http:
    framework: github.com/go-chi/chi/v5
    permissionChecks:
      - package: core
        function: Server.Require
        permissionArgument: 1
    clientChecks:
      - package: core
        function: Server.RequireClients
        clientArgument: 1
      - package: core
        function: Server.RequireClient
        clientArgument: 1
    applicationChecks:
      - package: core
        function: Server.RequireApplication
        applicationArgument: 1
    callerChecks:
      - package: core
        function: Server.RequireCaller
        callerArgument: 1
    audienceChecks:
      - package: core
        function: Server.RequireAudience
        audienceArgument: 1
    eventWriters:
      - package: core
        function: Server.Audit
