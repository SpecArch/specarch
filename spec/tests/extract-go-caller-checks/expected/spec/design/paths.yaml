  /invoices/{invoiceId}/archive:
    parameters:
      - {name: invoiceId, in: path, required: true}
    post:
      operationId: archiveInvoice
      permission: invoices.delete
      origin: stated
      cites:
        - {source: code, clause: 'core/server.go:28', says: 'Registers POST /invoices/{invoiceId}/archive on a chi router; its handler is s.archiveInvoice, and it is checked by s.Require("invoices.delete"), and gated by s.RequireAudience.'}
        - {source: code, clause: 'core/server.go:68', says: 'The handler of POST /invoices/{invoiceId}/archive reads no path parameter by name.'}
  /invoices/{invoiceId}/send:
    parameters:
      - {name: invoiceId, in: path, required: true}
    post:
      operationId: sendInvoice
      permission: invoices.read
      callers: [mailer]
      origin: stated
      cites:
        - {source: code, clause: 'core/server.go:29', says: 'Registers POST /invoices/{invoiceId}/send on a chi router; its handler is s.sendInvoice, and it is checked by s.Require("invoices.read"), and gated by s.RequireAudience, s.RequireClients and s.RequireClient.'}
        - {source: code, clause: 'core/server.go:70', says: 'The handler of POST /invoices/{invoiceId}/send reads no path parameter by name.'}
  /invoices/{invoiceId}/void:
