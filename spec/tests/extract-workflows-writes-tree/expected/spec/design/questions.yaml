    why: An approval has a deadline, as an ISO 8601 duration in days, hours, minutes and seconds; the user task has no timer the subset holds.
  Q-14:
    question: Which permissions does role branch-manager grant? The BPMN file names it as a potential owner and says nothing of what it may do.
    kind: decision
    priority: must
    blocks: ['#/roles/branch-manager/permissions']
    decidedBy: system-owner
    why: A potential owner in BPMN is a name; the grants are where the running permission check reads them.
