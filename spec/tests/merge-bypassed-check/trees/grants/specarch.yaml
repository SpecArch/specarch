specarch: "0.2"
info:
  title: Permissions of access
  version: 0.1.0
  description: |
    The roles and the permissions each grants, as the permission check built from access reads them, from the permission table permissions.json, made at commit f6262759f5858d7bbb3599527f589cdf28e6b508; and the routes the router built from api registers, from the route table routes.json, made at commit 796dfa3183ce46543c4d694488ef6175e3d2984b, each route that checks no permission taking the one the table's rules give it. Every role, permission and operation cites its table; what the tables do not say is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: 38c370e9ec2d6f0fbee739f2120b1e151ff23ce0
    url: ../../src
    clauses:
      - {clause: access, title: The grants the permission check built from here reads}
      - {clause: api, title: The routes the router built from here registers}
    reading: printed
