# yaml-language-server: $schema=../../../schema/specarch-fragment-design-1.0.schema.json
decisions:
  ADR-109:
    title: The audience rule is per token kind, and every refusal of a caller derives a security event with a fixed name and severity, written to a declared append-only store with an alarm channel, after RFC 8417 and ASVS V16
    status: accepted
    date: "2026-10-14"
    context: |
      docs/caller-context.md, the owner's decision 4. The design as first
      proposed required aud with const or enum on every accepted token
      and, in the umbrella, refused two modules accepting one aud value.
      A Transaction Token's aud names the trust domain, one value for
      every hop in it, so that rule would refuse every Txn-Token domain.
      The owner also wants every refusal of a caller logged to a separate
      append-only store in a standard form, with severities and an alarm
      channel, and first asked that the validator refuse a refusal with
      no event declared.
    decision: |
      A token accepted without a fixed audience is an error
      (token_audience), and what fixed means is per token kind: an
      access token declares aud with const or enum naming the service
      that accepts it, as RFC 9068, section 4, and RFC 7519, section
      4.1.3, require; a Txn-Token (tokenType txn_token, ADR-111)
      declares no aud, since its audience is the identity module's
      trustDomain by the draft's rule, and aud written on one is refused
      as a second way to say it. The estate's check that two modules do
      not accept one aud value runs over access tokens only. A Txn-Token
      captured at one hop and replayed at another is refused not by its
      audience but by the workload identity of the immediate caller,
      which via binds to the caller's proof (ADR-111).
      Every refusal of a caller derives a security event with the case:
      nobody writes one per case, and a refusal with no event cannot
      exist. The event has a fixed name per rule, the identifier URI
      <trustDomain>/events/<rule>, and a fixed severity:
      a token for another audience, high; an immediate caller not listed
      in via, high; the confused deputy in each form, high; a caller not
      in callers, medium; an application not in through, medium; a
      version outside the admitted range, medium with a software
      statement and low without; an expired token, low. The identity
      module declares securityEvents with store, the dependency that is
      the separate append-only store every module writes to, and alarm,
      the dependency that is the alarm channel; an estate with a client
      and no securityEvents is refused (security_events). An event is a
      Security Event Token (RFC 8417): events keyed by the identifier
      URI, jti, iat, toe, txn always, and in the event the rule, the
      severity, the operation, the client, sub, req_wl, the jti of the
      refused token and the SHA-256 of it; never the token. An event
      of severity high, or a repeat of any event for one client within
      a window, goes to the alarm channel too; the count and the window
      are deployment values of the implementation file. The validator
      derives the event beside the red case; the techspec lists the
      events with their severities under a Security events heading.
    consequences: |
      A Txn-Token domain validates, and the replay the audience check
      refuses for access tokens is refused for Txn-Tokens by the caller's
      identity, which the design says in so many words. Every refusal
      of this design and of ADR-096 and ADR-097 is logged in one form,
      with one transaction identifier across the chain, to a store the
      specification names, and a reviewer reads the list of events in
      the techspec without reading the code. A project logs the token
      itself nowhere.
    why: |
      Per token kind rather than one rule, because the draft says a
      Txn-Token's aud "MUST identify the Trust Domain" and the first
      design's rule, right for access tokens, would have made every
      Txn-Token domain an error; the alternative, exempting Txn-Tokens
      from the audience rule altogether, lost because a token with no
      audience at all is the replay the rule exists to refuse, and the
      trust domain is an audience, checked at every hop. Events derived
      rather than declared, because the first form, "the validator
      errors when a refusal has no event declared", cannot hold for the
      derived cases nobody writes, and a case that someone could forget
      to log is the gap ASVS V16 exists to close: 16.3.2 wants failed
      authorisation attempts logged, every one. A fixed name per rule
      and a fixed table of severities, because two projects then log one
      refusal under one name at one severity, and a severity written per
      case would be a placeholder nobody fills; the identifier is a URI
      under the trust domain because RFC 8417 makes each event's member
      name a URI. The SET format because it is the published form of a
      security event as a JWT with txn, which the Txn-Token draft takes
      from the same RFC, so one identifier joins the refusal to the
      transaction it refused. jti and a hash and never the token,
      because the draft's security considerations say complete
      Txn-Tokens must not be logged verbatim and ASVS 16.2.5 allows a
      session token only hashed or masked. The author declares only the
      store and the channel because those are what the estate must
      provide, the interface boundary's test: operators depend on the
      store existing and on where an alarm arrives; the count and the
      window are tuning, per deployment. "alarm" is the owner's word.
      Compiler test: a refusal whose event the project does not write is
      a derived red case that fails, never a silent gap, and a missing
      securityEvents is one error at the identity module with every
      token still read. Acceptance test: the techspec's event table is
      the list a security reviewer asks for, one line per rule.
    cites:
      - source: ietf-oauth-transaction-tokens
        says: "aud MUST identify the Trust Domain; complete Txn-Tokens MUST NOT be logged verbatim, log a hash or the payload without the signature."
      - source: rfc-8417
        says: "A SET is a JWT; the events claim's member names are URIs identifying the event statements; txn is a unique transaction identifier used to correlate related JWTs."
      - source: owasp-asvs
        says: "16.3.2: failed authorization attempts are logged. 16.2.1: each log entry includes when, where, who and what. 16.2.5: session tokens are logged only hashed or masked. 16.4.2 and 16.4.3: logs cannot be modified and go to a logically separate system."
      - source: rfc-9068
        says: "The resource server MUST validate that the aud claim contains a resource indicator value corresponding to an identifier the resource server expects for itself, and MUST reject the token otherwise."
    satisfies: [SA-5, SA-29]
