      octal: { $value: [0o0, 0o7, 0O17, -0o7, +0o7, 0o, 0o8, 0o1777777777777777777777, 0o2000000000000000000000] }
      binary: { $value: [0b0, 0b101, 0B101, -0b1, +0b1, 0b, 0b2, 0b+1, 0b-1, -0b+1, 0o+7, -0o+7, 0x+1] }
