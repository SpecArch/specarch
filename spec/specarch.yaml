  ietf-oauth-transaction-tokens:
    kind: document
    title: Transaction Tokens, an Internet-Draft of the IETF OAuth working group (draft-ietf-oauth-transaction-tokens-11)
    edition: "11, 30 July 2026"
    author: IETF OAuth working group
    url: https://datatracker.ietf.org/doc/draft-ietf-oauth-transaction-tokens/
    description: A draft on the standards track, not a standard yet; cited for the Txn-Token's claims, its header, its audience as the trust domain, and the rule that a workload never authenticates with one. The claim names are the draft's at this version and may change before it is an RFC.
