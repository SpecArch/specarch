questions:
  # specarch-problem: question: open_question: (must, decision) What is a user told when each constraint of table public.loans fails: loans_loan_period? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: 'What is a user told when each constraint of table public.loans fails: loans_loan_period?'
    kind: decision
    priority: must
    blocks: ['#/entities/Loans/constraints/loans_loan_period/message']
    decidedBy: system-owner
    why: A constraint carries the message a user reads, and a database catalogue holds none.
  # specarch-problem: question: open_question: (must, decision) For the page at /loans/new, what are its kind (list, form, view or task), its title, the entity it shows, the operation it reads, the operation it submits to and the columns it lists? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: For the page at /loans/new, what are its kind (list, form, view or task), its title, the entity it shows, the operation it reads, the operation it submits to and the columns it lists?
    kind: decision
    priority: must
    blocks: ['#/pages/loans-new/kind', '#/pages/loans-new/title', '#/pages/loans-new/entity', '#/pages/loans-new/source', '#/pages/loans-new/submit', '#/pages/loans-new/columns']
    decidedBy: system-owner
    why: The folders name a page's route and not what it shows.
  # specarch-problem: question: open_question: (must, decision) Which permission does the page at /loans/new check, or is it open to everyone (public)? Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: Which permission does the page at /loans/new check, or is it open to everyone (public)?
    kind: decision
    priority: must
    blocks: ['#/pages/loans-new/permission']
    decidedBy: system-owner
    why: The folders name a page's route and not who may open it, and a page open to everyone is how an open screen is usually found, so it is asked, never assumed.
  # specarch-problem: question: open_question: (must, decision) The page at /members/{cardNumber}/loans reads operation listMemberLoans, which its schema names; this tree does not declare it, so it waits for the tree that does. Is it that operation? Decided by system-owner. Answer with a decision record that names Q-4 under answers. [Q-4]
  Q-4:
    question: The page at /members/{cardNumber}/loans reads operation listMemberLoans, which its schema names; this tree does not declare it, so it waits for the tree that does. Is it that operation?
    kind: decision
    priority: must
    blocks: ['#/pages/members-by-card-number-loans/source']
    decidedBy: system-owner
    names: listMemberLoans
    why: The schema names the operation and not its method or path, so the page's source waits for the tree that declares it; specarch merge writes it once one does.
