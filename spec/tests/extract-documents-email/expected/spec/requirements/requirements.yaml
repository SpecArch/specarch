questions:
  # specarch-problem: question: open_question: (must, decision) Section lending-rules.docx: Annex A says "It must be paid at the desk.", and does not name what it commits; which element is it? It blocks requirements. Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: 'Section lending-rules.docx: Annex A says "It must be paid at the desk.", and does not name what it commits; which element is it?'
    kind: decision
    priority: must
    blocks: [requirements]
    decidedBy: system-owner
    why: A sentence that names its subject only by a word such as it or they cannot be placed as one element without guessing.
    cites:
      - {source: rules-edition, clause: 'lending-rules.docx: Annex A', says: It must be paid at the desk.}
