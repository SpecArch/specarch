specarch: "0.3"
info: { title: Case, version: 1.0.0 }
permissions:
  invoices.delete: { description: Delete invoices. }
roles:
  invoice-manager:
    description: Staff who may delete invoices only from the administration application or the identity module's portal.
    permissions: [invoices.delete]
    through:
      invoices.delete: [admin-web, identity#/clients/portal]
clients:
  admin-web: { description: The administration application in the browser., kind: application }
  middleware: { description: The service that calls on the person's behalf., kind: service, proof: { kind: spiffe } }
dependencies:
  identity: { description: The identity module., timeout: PT2S }
paths:
  /invoices/{invoiceId}:
    delete:
      operationId: deleteInvoice
      summary: Delete an invoice
      permission: invoices.delete
      token: transaction
      via: [middleware, identity#/clients/gateway]
      responses:
        "204": { description: Deleted. }
