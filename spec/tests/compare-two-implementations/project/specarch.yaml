specarch: "1.0.0"
stages: [implementation]
info: { title: Lending, version: 1.0.0 }
timeZone: Asia/Jakarta
stakeholders:
  owner: { description: The product owner. }
  tester: { description: Runs the tests of each build. }
requirements:
  CASE-1:
    statement: A member shall borrow at most five books at once.
    kind: functional
    priority: must
    status: accepted
    acceptance: [A sixth loan is refused.]
  CASE-3:
    statement: A loan shall be saved within 200 ms for nine calls in ten, at 100 loans a second.
    kind: quality
    priority: should
    status: accepted
    acceptance: [Nine saves in ten of a load of 100 a second finish within 200 ms.]
  CASE-2:
    statement: A member shall be known by an opaque id.
    kind: functional
    priority: should
    status: accepted
    acceptance: [Two members never share an id.]
entities:
  Loan:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      memberId: { type: string, format: uuid }
    required: [id, memberId]
    primaryKey: [id]
    constraints:
      loan_once:
        kind: unique
        fields: [memberId, id]
        message: This loan is already recorded.
    satisfies: [CASE-1, CASE-3]
  Member:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      email: { type: string, maxLength: 200 }
    required: [id, email]
    primaryKey: [id]
    constraints:
      member_email_unique:
        kind: unique
        fields: [email]
        message: This email belongs to another member.
    satisfies: [CASE-2]
environments:
  staging: { description: "The build under test, before release." }
tests:
  loan-limit:
    entity: Loan
    constraint: loan_once
    level: system
    scenario: red
    covers: [duplicate loan_once]
    given: a member with five loans
    when: a sixth loan is saved
    then: the sixth loan is refused and the five stay
    verifies: [CASE-1]
  loan-return:
    entity: Loan
    constraint: loan_once
    level: system
    scenario: golden
    given: a member with one loan
    when: the loan is returned
    then: the member has no loan
    verifies: [CASE-1, CASE-3]
  member-key:
    entity: Member
    constraint: member_email_unique
    level: system
    scenario: golden
    given: two members saved
    when: their ids are read
    then: the ids differ
    verifies: [CASE-2]
  member-email-taken:
    entity: Member
    constraint: member_email_unique
    level: system
    scenario: red
    covers: [duplicate member_email_unique]
    given: a member with the email reader@example.org
    when: a second member is saved with that email
    then: the second member is refused and the first stays
    verifies: [CASE-2]
