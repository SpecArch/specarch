impact: minor
decision:
  by: specification-author
  date: "2026-11-14"
  outcome: approved
  why: "ADR-247, SA-146 and SA-147: validate warns object_unscoped, internal_key_exposed, refusal_reveals_record, query_from_caller, duties_unseparated, secret_unprotected and audit_not_append_only in both builds, each at the element to change, and the problems file's SARIF tags them as security rules; a hashed field that is a key, unique or searchable is refused under at_rest and list_of, and generate sql refuses one. secret_unprotected's rotation part holds only on meta-model 1.0 or later. Every new rule is a warning, so a specification valid on 1.7.0 stays valid; the hashed-field refusals reach only a design that could never have worked. The owner decided on 2026-11-23 to release it as 1.8.0, a minor step."
release: 1.8.0
status: released
