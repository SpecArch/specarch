entities:
  Branches:
    description: A branch that lends books.
    type: object
    properties:
      code: {type: integer, format: int32, minimum: -32768, maximum: 32767}
      name: {type: string, maxLength: 100}
      openedOn: {type: string, format: date, default: "2020-01-01"}
      finePerDay: {type: string, format: decimal, precision: 6, scale: 2, default: "0.50"}
    required: [code, name, openedOn, finePerDay]
    primaryKey: [code]
    constraints:
      # specarch-problem: warning: test_golden_missing: Branches constraint branches_fine_not_negative has no golden scenario; add one under tests, for example branches-fine-not-negative-succeeds: { entity: Branches, constraint: branches_fine_not_negative, scenario: golden, given: "...", when: "a Branches keeping it is saved", then: "it is saved" } [test_golden_missing@design/entities/branches.yaml#/entities/Branches/constraints/branches_fine_not_negative]
      branches_fine_not_negative: {kind: check, expression: 'finePerDay >= decimal("0", 0)'}
      # specarch-problem: warning: test_golden_missing: Branches constraint branches_name_unique has no golden scenario; add one under tests, for example branches-name-unique-succeeds: { entity: Branches, constraint: branches_name_unique, scenario: golden, given: "no Branches with the same values exists", when: "a Branches is saved", then: "it is saved" } [test_golden_missing@design/entities/branches.yaml#/entities/Branches/constraints/branches_name_unique]
      branches_name_unique: {kind: unique, fields: [name]}
    origin: stated
    cites:
      - {source: code, clause: migrations public.branches, says: 'Table public.branches: code smallint not null, name character varying(100) not null, opened_on date not null default ''2020-01-01''::date, fine_per_day numeric(6,2) not null default 0.50, float_cash money. branches_fine_not_negative CHECK ((fine_per_day >= (0)::numeric)); branches_name_unique UNIQUE (name); branches_pkey PRIMARY KEY (code).'}
