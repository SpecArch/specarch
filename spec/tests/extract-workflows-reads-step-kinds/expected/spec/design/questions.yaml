  # specarch-problem: question: open_question: (must, decision) Which entity holds the request of workflow refund while it waits? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: Which entity holds the request of workflow refund while it waits?
    kind: decision
    priority: must
    blocks: ['#/workflows/refund/subject']
    decidedBy: system-owner
    why: BPMN has no element for the record the request is kept in; the subject is where a page reads where the request is.
  # specarch-problem: question: open_question: (must, decision) Workflow refund is started by operation askRefund, which the BPMN file names on its start event; the file does not declare it, so it waits for the tree that does. Is it that operation? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
