questions:
  Q-1:
    question: 'What values does each path parameter of /members/{cardNumber}/loans take: cardNumber?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1members~1{cardNumber}~1loans/parameters/0/schema']
    decidedBy: system-owner
    why: A route table names a path's parameters and not the values they take.
  Q-2:
    question: What does GET /members/{cardNumber}/loans do, and what does it answer?
    kind: decision
    priority: must
    blocks: ['#/paths/~1members~1{cardNumber}~1loans/get/summary', '#/paths/~1members~1{cardNumber}~1loans/get/responses']
    decidedBy: system-owner
    why: A route table names the handler and not what it does or the responses it gives.
  Q-3:
    question: 'What does each permission allow: loans.read?'
    kind: decision
    priority: must
    blocks: ['#/permissions/loans.read/description']
    decidedBy: system-owner
    why: A route table names the permission a route checks and not what it is for.
  Q-4:
    question: 'Which role grants each permission: loans.read?'
    kind: decision
    priority: must
    blocks: ['#/permissions/loans.read']
    decidedBy: system-owner
    why: A route table names the permission a route checks and not who holds it.
  Q-5:
    question: For the page at /loans/new, what are its kind (list, form, view or task), its title, the entity it shows, the operation it reads, the operation it submits to and the columns it lists?
    kind: decision
    priority: must
    blocks: ['#/pages/loans-new/kind', '#/pages/loans-new/title', '#/pages/loans-new/entity', '#/pages/loans-new/source', '#/pages/loans-new/submit', '#/pages/loans-new/columns']
    decidedBy: system-owner
    why: The folders name a page's route and not what it shows.
  Q-6:
    question: Which permission does the page at /loans/new check, or is it open to everyone (public)?
    kind: decision
    priority: must
    blocks: ['#/pages/loans-new/permission']
    decidedBy: system-owner
    why: The folders name a page's route and not who may open it, and a page open to everyone is how an open screen is usually found, so it is asked, never assumed.
