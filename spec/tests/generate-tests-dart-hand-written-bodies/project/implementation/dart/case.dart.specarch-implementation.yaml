specarchImplementation: "0.1"
info: { title: Front desk in Dart, version: 1.0.0 }
implements: { file: ../../specarch.yaml, version: 1.0.0 }
stack: { language: { name: Dart, version: "3.5" } }
mappings:
  "#/entities/Item": { target: items }
targets:
  tests:
    output: ../../../test
testing:
  framework: package:test
  run: dart test
  suites:
    design:
      description: The design tests, through the harness in test/specarch_harness.dart.
      run: dart test test/specarch_design_test.dart
      level: system
      designTests: [add-item-succeeds, add-item-denied-without-items-write, item-reserved-within-stock]
