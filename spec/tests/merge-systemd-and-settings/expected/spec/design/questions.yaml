questions:
  # specarch-problem: question: open_question: (must, decision) When is process releasePrune started, as a cron expression of five fields in UTC? Its timer says OnCalendar=*-*-* 03:00:00, a systemd calendar expression read in the host's time zone, which is not cron. Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: When is process releasePrune started, as a cron expression of five fields in UTC? Its timer says OnCalendar=*-*-* 03:00:00, a systemd calendar expression read in the host's time zone, which is not cron.
    kind: decision
    priority: must
    blocks: ['#/processes/releasePrune/schedule']
    decidedBy: system-owner
    why: A calendar expression and cron differ (seconds, ranges of days, the time zone), so a translation by the reader would be a guess.
    cites:
      - {source: code, clause: units/release-prune.timer, says: 'Line 5: OnCalendar=*-*-* 03:00:00'}
  # specarch-problem: question: open_question: (should, decision) Which settings does process releaseWatcher read from /etc/release-watcher/secrets.env? The unit names the file and not what it holds. Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: Which settings does process releaseWatcher read from /etc/release-watcher/secrets.env? The unit names the file and not what it holds.
    kind: decision
    priority: should
    blocks: ['#/processes/releaseWatcher/configuration']
    decidedBy: system-owner
    why: An environment file is read on the host, and its values may be secrets, so the reader does not read it.
    cites:
      - {source: code, clause: units/release-watcher.service, says: 'Line 13: EnvironmentFile=/etc/release-watcher/secrets.env'}
  # specarch-problem: question: open_question: (must, decision) What does each exit status of process releaseWatcher mean, 0 among them, so they are written under exitCodes? Its unit names 78 (RestartPreventExitStatus=); a status RestartPreventExitStatus= names goes under restart.exceptExitCodes too. Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: What does each exit status of process releaseWatcher mean, 0 among them, so they are written under exitCodes? Its unit names 78 (RestartPreventExitStatus=); a status RestartPreventExitStatus= names goes under restart.exceptExitCodes too.
    kind: decision
    priority: must
    blocks: ['#/processes/releaseWatcher/exitCodes']
    decidedBy: system-owner
    why: The unit names the statuses and not what each means; exceptExitCodes names only statuses exitCodes declares.
