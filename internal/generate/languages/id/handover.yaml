translations:
  "| Environment | Purpose | Run by | Promotes to |": "| Environment | Tujuan | Dijalankan oleh | Naik ke |"
  "| Environment | Purpose | Promotes to |": "| Environment | Tujuan | Naik ke |"
  "Received by ": "Diterima oleh "
  "The source: ": "Source: "
  "The customer is responsible for:": "Customer bertanggung jawab atas:"
  "The vendor stays responsible for:": "Vendor tetap bertanggung jawab atas:"
  "Build command: %s (the task %s).": "Command build: %s (task %s)."
  "Base images": "Base image"
  "Every image the build starts from, pinned by its digest; a build from another digest is a different build.": "Setiap image yang menjadi titik awal build, di-pin dengan digest-nya; build dari digest lain adalah build yang berbeda."
  "| Image | Digest | Purpose |": "| Image | Digest | Tujuan |"
  "Comparing a build with the vendor's": "Membandingkan build dengan milik vendor"
  "Software bill of materials": "Software bill of materials"
  "The software bill of materials of the build, and its scan for known vulnerabilities, are written by %s (the task %s); the customer runs it on their build and compares the result with the vendor's.": "Software bill of materials dari build ini, beserta scan vulnerability-nya, ditulis oleh %s (task %s); customer menjalankannya pada build mereka dan membandingkan hasilnya dengan milik vendor."
  "Installed with ": "Dipasang dengan "
  ", from ": ", dari "
  "| Resource | What the hosts must provide |": "| Resource | Yang harus disediakan host |"
  "# %s: handover": "# %s: handover"
  "Version %s of %s.": "Versi %s dari %s."
  " The customer builds, installs and runs %s from the source.": " Customer mem-build, memasang, dan menjalankan %s dari source."
  " This document says what the customer receives, what stays whose responsibility, how a release is built and installed, what the hosts must provide, and how the installed system is checked and accepted. It is written for the customer's engineers and needs nothing else to be read.": " Dokumen ini menjelaskan apa yang diterima customer, tanggung jawab siapa saja, cara mem-build dan memasang release, apa yang harus disediakan host, serta cara sistem yang terpasang dicek dan diterima. Dokumen ini ditulis untuk engineer customer dan bisa dibaca tanpa bahan lain."
  "What the customer receives": "Yang diterima customer"
  "The handover goes to ": "Handover diberikan ke "
  " It holds:": " Isinya:"
  "- The source of each release: %s": "- Source tiap release: %s"
  "- How a release is built, with the exact toolchain, the base images and how a build is compared with the vendor's (Building a release).": "- Cara mem-build release, dengan toolchain yang persis, base image, dan cara membandingkan build dengan milik vendor (Mem-build release)."
  "- The software bill of materials of each release and its vulnerability scan (Building a release).": "- Software bill of materials tiap release dan scan vulnerability-nya (Mem-build release)."
  "- Every dependency with its version and licence (Building a release).": "- Setiap dependency dengan versi dan lisensinya (Mem-build release)."
  "- What the hosts must provide (What the hosts must provide).": "- Apa yang harus disediakan host (Yang harus disediakan host)."
  "- Every setting with its type, and where a secret's value comes from (Configuration).": "- Setiap setting dengan tipenya, dan asal nilai sebuah secret (Konfigurasi)."
  "- The data migrations, in the order they are applied (Data migrations).": "- Migrasi data, sesuai urutan penerapannya (Migrasi data)."
  "- How a release is installed and rolled back (Installing a release, Rolling back).": "- Cara memasang dan me-rollback release (Memasang release, Rollback)."
  "- How the data is backed up and restored (Backing up, Restoring).": "- Cara mem-backup dan me-restore data (Backup, Restore)."
  "- What is watched on the live system (Monitoring).": "- Apa yang dipantau di sistem live (Monitoring)."
  "- The checks to run after installing, and the acceptance tests (Checks after installing, Acceptance tests).": "- Pengecekan yang dijalankan setelah pemasangan, dan acceptance test (Pengecekan setelah pemasangan, Acceptance test)."
  "- The sign-off sheet (Sign-off sheet).": "- Lembar sign-off (Lembar sign-off)."
  "Responsibilities": "Tanggung jawab"
  "Building a release: ": "Mem-build release: "
  "the toolchain %s %s": "toolchain %s %s"
  "Built with ": "Di-build dengan "
  ". The versions are exact: a build with another version is a different build.": ". Versinya persis: build dengan versi lain adalah build yang berbeda."
  "Build": "Build"
  "Dependencies and their licences": "Dependency dan lisensinya"
  "| Library | Version | Licence | Purpose |": "| Library | Versi | Lisensi | Tujuan |"
  "What the hosts must provide": "Yang harus disediakan host"
  "Every setting the system reads at run time. A secret's value is never written here or in any document; its description says where the value comes from.": "Setiap setting yang dibaca sistem saat runtime. Nilai secret tidak pernah ditulis di sini atau di dokumen mana pun; deskripsinya menyebut dari mana nilainya berasal."
  "Values the vendor gives for %s (%s):": "Nilai yang diberikan vendor untuk %s (%s):"
  "Data migrations": "Migrasi data"
  "Applied in this order, each before the release that carries it is installed.": "Diterapkan sesuai urutan ini, masing-masing sebelum release yang membawanya dipasang."
  "Installing a release": "Memasang release"
  "How the vendor installs %s (%s):": "Cara vendor memasang %s (%s):"
  "Rolling back": "Rollback"
  "Backing up": "Backup"
  "Monitoring": "Monitoring"
  "How the vendor watches them in %s (%s):": "Cara vendor memantaunya di %s (%s):"
  "Checks after installing": "Pengecekan setelah pemasangan"
  "Run on the installed system before it is accepted. Fill in the Result column as each step is run, and keep the filled-in run.": "Dijalankan pada sistem yang terpasang sebelum diterima. Isi kolom Hasil setiap kali satu langkah dijalankan, dan simpan hasil isiannya."
  "%s (%s, in %s)": "%s (%s, di %s)"
  "Acceptance tests": "Acceptance test"
  "What the installed system must do for the people who use it, each as a scenario to run by hand or through the implementation's acceptance suite. A golden scenario succeeds; a red one is refused.": "Apa yang harus dilakukan sistem yang terpasang untuk orang yang memakainya, masing-masing sebagai skenario yang dijalankan manual atau lewat acceptance suite implementasi. Skenario golden berhasil; skenario red ditolak."
