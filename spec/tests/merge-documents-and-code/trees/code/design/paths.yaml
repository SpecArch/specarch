roles:
  clerk:
    description: Works the desk.
    permissions: [loans.read]
    origin: stated
    cites:
      - {source: code, clause: router, says: The router's role table has clerk with loans.read.}
permissions:
  loans.read:
    description: Read loans.
    origin: stated
    cites:
      - {source: code, clause: 'router GET /members/{cardNumber}/loans', says: It checks loans.read.}
paths:
  /members/{cardNumber}/loans:
    parameters:
      - {name: cardNumber, in: path, required: true, schema: {type: string, maxLength: 10}}
    get:
      operationId: listMemberLoans
      summary: Lists a member's loans
      permission: loans.read
      responses:
        "200": {description: The loans}
      origin: stated
      cites:
        - {source: code, clause: 'router GET /members/{cardNumber}/loans', says: 'GET /members/{cardNumber}/loans checks loans.read.'}
  /health:
    get:
      operationId: health
      summary: Says the service is up
      permission: loans.read
      responses:
        "200": {description: Up}
      origin: stated
      cites:
        - {source: code, clause: router GET /health, says: GET /health checks loans.read.}
