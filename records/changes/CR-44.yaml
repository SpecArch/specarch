specarchRecord: "1.0.0"
kind: change
id: CR-44
title: Ship an Indonesian vocabulary for extract documents and tables
raisedBy: specification-author
raised: "2026-11-04"
phase: development
type: additive
urgency: normal
reason: A team writing its source documents in Indonesian had to write and keep a vocabulary file of its own before extract documents could read them, though Indonesian is a language SpecArch's users write requirements in every day, with English column words mixed into their tables.
cause: omitted
affects:
  adds:
    - "#/decisions/ADR-240"
    - "#/tests/extract-documents-language-id"
  changes:
    - "#/requirements/SA-64"
impact: minor
decision:
  by: specification-author
  date: "2026-11-05"
  outcome: approved
  why: "extract documents --language id reads a document written in Indonesian by a vocabulary SpecArch ships beside the English one, its time limits written as phrases and its tables read with the English column words Indonesian teams mix in (ADR-240, SA-64). A language tag that gave a refusal before now reads; every command line accepted on 1.5.0 reads as before, so a minor release carries it (ADR-186, ADR-083)."
release: 1.6.0
status: released
