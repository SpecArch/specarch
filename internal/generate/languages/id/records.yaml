translations:
  "# %s: change and defect register": "# %s: register change dan defect"
  "Version %s of the specification: %s and %s are recorded beside it, %s open. Open items come first, then the ones carried out, then the ones closed without a change. The register is made from the records in `records/changes/` and `records/defects/`: they say what was asked and decided, and the specification says what is true now. Under each open change request stands what it reaches in the specification as it is now, before anything changes.": "Spesifikasi versi %s: %s dan %s tercatat di sampingnya, %s masih terbuka. Item terbuka ditulis lebih dulu, lalu yang sudah dikerjakan, lalu yang ditutup tanpa perubahan. Register ini dibuat dari record di `records/changes/` dan `records/defects/`: record menyatakan apa yang diminta dan diputuskan, sedangkan spesifikasi menyatakan apa yang berlaku sekarang. Di bawah tiap change request terbuka tertulis jangkauannya di spesifikasi saat ini, sebelum ada yang berubah."
  "change request": "change request"
  "change requests": "change request"
  "defect": "defect"
  "defects": "defect"
  "item": "item"
  "items": "item"
  "Change requests": "Change request"
  "| Change | Title | Status | Raised in | Type | Urgency | Impact | Cause | Release |": "| Change | Judul | Status | Diajukan pada | Tipe | Urgensi | Dampak | Penyebab | Release |"
  "Raised by %s on %s, in %s. %s, %s urgency%s. Status: %s.": "Diajukan oleh %s pada %s, di %s. %s, urgensi %s%s. Status: %s."
  "Cause: ": "Penyebab: "
  "The analysis raised ": "Analisisnya memunculkan "
  "the question": "pertanyaan"
  "the questions": "pertanyaan"
  "Affects: ": "Berdampak ke: "
  "Decision: %s by %s on %s. %s": "Keputusan: %s oleh %s pada %s. %s"
  "Released in ": "Di-release di "
  "Defects": "Defect"
  "No defect is recorded.": "Tidak ada defect yang tercatat."
  "| Defect | Title | Status | Severity | Found in | Violates | Test |": "| Defect | Judul | Status | Severity | Ditemukan di | Melanggar | Test |"
  ", on the ": ", pada "
  "Reported by %s on %s, %s. Severity %s. Status: %s.": "Dilaporkan oleh %s pada %s, %s. Severity %s. Status: %s."
  "The test ": "Test "
  " shows it fixed.": " menunjukkan sudah diperbaiki."
  "A duplicate of ": "Duplikat dari "
  "Not a defect; it became the change request ": "Bukan defect; berubah menjadi change request "
  "Fixed in ": "Diperbaiki di "
  "Transitions": "Transisi"
  "%s the as-is beside the to-be while the business process changes. Under each stands what moving from the as-is to the to-be adds, changes and removes, from the specification as it is now: the workflow's trigger, subject and messages, its steps, the roles that approve them or do their tasks, the operations it calls, and the pages and tests that rest on it. The generators write the to-be, and the as-is with `specarch generate --as-is`.": "%s as-is di samping to-be selama proses bisnisnya berubah. Di bawah masing-masing tertulis apa yang ditambah, diubah, dan dihapus saat pindah dari as-is ke to-be, menurut spesifikasi saat ini: trigger, subject, dan message workflow, langkah-langkahnya, role yang meng-approve atau mengerjakan task-nya, operasi yang dipanggilnya, serta halaman dan test yang bergantung padanya. Generator menulis to-be, dan as-is dengan `specarch generate --as-is`."
  "One workflow keeps": "Satu workflow menyimpan"
  "%d workflows keep": "%d workflow menyimpan"
  "; raised in ": "; diajukan pada "
  "the specification left it out": "spesifikasi tidak memuatnya"
  "the specification said it wrongly": "spesifikasi menyatakannya dengan keliru"
  "the need changed after it was written": "kebutuhannya berubah setelah ditulis"
  "the stakeholder who uses it was not asked": "stakeholder yang memakainya tidak ditanya"
  "Against the build of version ": "Terhadap build versi "
  "digest `": "digest `"
  "Seen at ": "Terlihat di "
  "Observed: ": "Yang terjadi: "
  " Expected: ": " Yang diharapkan: "
  "; impact ": "; dampak "
  "# %s: release notes": "# %s: release notes"
  "Version %s of the specification: %s recorded beside it, newest first. Each lists what it includes, grouped as added, changed, removed and fixed, from the change and defect records in `records/`, each change with where it was raised and why the result was not what was wanted, and the changes counted by cause: omitted, wrong and unheard measure the requirements work, changed is normal change.": "Spesifikasi versi %s: %s tercatat di sampingnya, yang terbaru lebih dulu. Masing-masing mendaftar isinya, dikelompokkan sebagai added, changed, removed, dan fixed, dari record change dan defect di `records/`, tiap perubahan dengan tempat diajukannya dan alasan hasilnya tidak sesuai harapan, serta jumlah perubahan per penyebab: omitted, wrong, dan unheard mengukur kualitas kerja requirement, sedangkan changed adalah perubahan yang wajar."
  "release is": "release"
  "releases are": "release"
  ": violated ": ": dilanggar "
  "Includes no recorded change or defect.": "Tidak memuat change atau defect yang tercatat."
  "Also includes, kept in a tracker: ": "Juga memuat, yang dicatat di tracker: "
  "%d with no cause written": "%d tanpa penyebab tertulis"
  "Changes by cause: ": "Perubahan per penyebab: "
  "Implementations: ": "Implementasi: "
  "Accepted by the commissioning ": "Diterima oleh commissioning "
  "Built from commit ": "Di-build dari commit "
same:
  - "<!-- Generated by specarch document %s from %s, version %s, and the records in %s/; meta-model %s. Do not edit this file: change the YAML and generate again. -->"
