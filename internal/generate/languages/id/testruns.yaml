translations:
  "# %s: test runs and failure trend": "# %s: test run dan tren kegagalan"
  "Version %s of the specification: %s recorded beside it": "Spesifikasi versi %s: %s tercatat di sampingnya"
  "test run is": "test run"
  "test runs are": "test run"
  ", from %s to %s. The latest, %s, has %s: %d passed, %d failed, %d errored, %d skipped, and %d %s to no test": ", dari %s sampai %s. Yang terbaru, %s, punya %s: %d passed, %d failed, %d errored, %d skipped, dan %d %s ke test mana pun"
  "result": "hasil"
  "results": "hasil"
  "maps": "tidak terpetakan"
  "map": "tidak terpetakan"
  ". The document is made from the records in `records/test-runs/` and `records/defects/`: each result names the test it ran, and through the test the element it is about and the requirements it verifies, or the algorithm or operation whose worked examples it ran.": ". Dokumen ini dibuat dari record di `records/test-runs/` dan `records/defects/`: tiap hasil menyebut test yang dijalankannya, dan lewat test itu elemen yang dibahas serta requirement yang diverifikasinya, atau algoritma atau operasi yang worked example-nya dijalankan."
  "Test runs": "Test run"
  "No test run is recorded. specarch log test-run records one from a JUnit XML file.": "Belum ada test run yang tercatat. specarch log test-run mencatatnya dari file JUnit XML."
  "| Run | At | Environment | Version | Build | Passed | Failed | Errored | Skipped | Unmapped |": "| Run | Waktu | Environment | Versi | Build | Passed | Failed | Errored | Skipped | Tidak terpetakan |"
  "%s | Open defects |": "%s | Defect terbuka |"
  "No test of %s ran in a recorded run: %s.": "Tidak ada test untuk %s yang jalan di run yang tercatat: %s."
  "Failures per element": "Kegagalan per elemen"
  "Each run is a column, oldest first. A cell counts the failed and errored results of the tests about the element in that run, and those of the results that name it as the algorithm or operation whose worked examples they ran; a dash says none of those tests ran, since a skipped result did not run. The open defects are the ones reported or confirmed that violate the element or name one of its tests.": "Tiap run adalah satu kolom, yang terlama lebih dulu. Satu sel menghitung hasil failed dan errored dari test tentang elemen itu di run tersebut, serta hasil yang menyebutnya sebagai algoritma atau operasi yang worked example-nya dijalankan; tanda strip berarti tidak ada test itu yang jalan, karena hasil skipped tidak dihitung jalan. Defect terbuka adalah yang dilaporkan atau dikonfirmasi melanggar elemen itu atau menyebut salah satu test-nya."
  "Element": "Elemen"
  "Failures per requirement": "Kegagalan per requirement"
  "Each run is a column, oldest first. A cell counts the failed and errored results of the tests that verify the requirement in that run; a dash says none of those tests ran. The open defects are the ones reported or confirmed that violate the requirement.": "Tiap run adalah satu kolom, yang terlama lebih dulu. Satu sel menghitung hasil failed dan errored dari test yang memverifikasi requirement itu di run tersebut; tanda strip berarti tidak ada test itu yang jalan. Defect terbuka adalah yang dilaporkan atau dikonfirmasi melanggar requirement itu."
  "Requirement": "Requirement"
  "Results that map to no test": "Hasil yang tidak terpetakan ke test"
  "Every result names the test it ran, or the element whose worked examples it ran.": "Setiap hasil menyebut test yang dijalankannya, atau elemen yang worked example-nya dijalankan."
  "%s to no test of the specification, so %s for no element or requirement above. A document for everyone does not name %s, since nothing tells whether %s an internal element.": "%s ke test mana pun di spesifikasi, jadi %s untuk elemen atau requirement mana pun di atas. Dokumen untuk semua orang tidak menyebut %s, karena tidak ada yang bisa memastikan apakah %s elemen internal."
  "result maps": "hasil tidak terpetakan"
  "results map": "hasil tidak terpetakan"
  "it counts": "tidak dihitung"
  "they count": "tidak dihitung"
  "it": "hasil itu"
  "them": "hasil-hasil itu"
  "it runs": "hasil itu menjalankan"
  "they run": "hasil-hasil itu menjalankan"
  "These results name no test of the specification, so they count for no element or requirement above; each is a test the specification does not have yet, or one whose name its record must give under test.": "Hasil-hasil ini tidak menyebut test mana pun di spesifikasi, jadi tidak dihitung untuk elemen atau requirement mana pun di atas; masing-masing adalah test yang belum ada di spesifikasi, atau test yang namanya harus ditulis di record-nya pada test."
  "| Run | Result | Outcome | Message |": "| Run | Hasil | Outcome | Pesan |"
  "Results by run": "Hasil per run"
  "%s: %s in %s, by %s": "%s: %s di %s, oleh %s"
  "the specification of digest ": "spesifikasi dengan digest "
  "Run on ": "Dijalankan pada "
  "Recorded without a results file as evidence.": "Dicatat tanpa file hasil sebagai bukti."
  "| Result | Test | Outcome | Message | Defect |": "| Hasil | Test | Outcome | Pesan | Defect |"
  "the worked examples of `": "worked example dari `"
  "%s of this run %s left out of a document for everyone: %s an internal test or element, or %s to no test (ADR-119).": "%s dari run ini%.0s tidak dimuat di dokumen untuk semua orang: %s test atau elemen internal, atau %s ke test mana pun (ADR-119)."
