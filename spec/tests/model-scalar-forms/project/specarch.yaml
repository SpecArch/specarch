      plain: { $value: [2001-12-14, 2001-1-2, 2001-12-14t21:59:43.10-05:00, 2001-12-14T21:59:43Z, 2001-12-14T21:59:43.1Z, 2001-12-14T21:59:43+07:00, 2001-12-14T21:59:43, 2001-12-14 21:59:43, 2001-12-14 21:59:43.5, 2001-12-14 21:59:43Z, 2001-13-01, 2001-12-14   21:59:43, 2001-12-14 21:59:43.123456789012, 2001-02-30, 2000-02-29, 2001-02-29, 2001-12-14T21:59:43.Z, 2001-12-14T24:00:00Z, 2001-12-14T23:60:00Z, 2001-12-14T23:59:60Z, 2001-12-14T21:59:43z, 2001-12-14T21:59:43+24:00, 2001-12-14T21:59:43+25:00, 2001-12-14T21:59:43+07:60, 2001-12-14T21:59:43+07:61, 2001-12-14T21:59:43+0700, 2001-12-14T21:59:43+07, 2001-12-14T1:2:3Z, 2001-12-14T001:2:3Z, 2001-012-14, 20011214, 2001-12, 01-12-14] }
      comma:
        $value:
          - 2001-12-14T21:59:43,5Z
          - 2001-12-14 21:59:43,5
          - 2001-12-14T21:59:43,Z
    quoted:
