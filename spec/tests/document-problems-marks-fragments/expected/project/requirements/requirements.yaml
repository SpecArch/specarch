# The requirements of the case, kept by hand.
stakeholders:
  owner: { description: The product owner. }

requirements:
  CASE-1:
    statement: A member shall borrow at most five books.
    kind: functional
    priority: must
    status: accepted
    acceptance: [A sixth loan is refused.]
    origin: inferred
    why: The desk has few books.   # said at the desk

  CASE-2:
    statement: A loan shall last the loan period.
    kind: functional
    priority: must
    status: accepted
    acceptance: [A loan is due after the loan period.]
    # The need below was renamed.
    needs:
      # specarch-problem: error: need: NEED-9 is not a need of the specification; there are none in the specification [need@requirements/requirements.yaml#/requirements/CASE-2/needs/0]
      - NEED-9
    origin: inferred
    why: The desk says so.
questions:
  # specarch-problem: question: open_question: (should, decision) Is the loan period 14 days or 21? It blocks design. Decided by owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  # specarch-problem: error: question_stage: question Q-1 sits under requirements/ but is about the design stage; move it to design/ [question_stage@requirements/requirements.yaml#/questions/Q-1]
  Q-1:
    question: Is the loan period 14 days or 21?
    kind: decision
    priority: should
    decidedBy: owner
    options: ["14 days", "21 days"]
    # specarch-problem: error: duplicate_key: key "blocks" is already defined on line 37 [duplicate_key@requirements/requirements.yaml#/questions/Q-1/blocks]
    blocks: [design]
    blocks: [design]
    why: The manual and the service differ.
