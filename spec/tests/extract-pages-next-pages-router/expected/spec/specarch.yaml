specarch: "1.0.0"
info:
  title: Pages of pages
  version: 0.1.0
  description: |
    The pages and operations the file-system router rooted at pages serves, read from the files git tracks there at commit 21032f4b9cb5ba999ea68c89840cebe551ec250b, with the content of each page that has a schema file from that file. Every page and operation cites its file; what the files' places and the schemas do not say is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: 21032f4b9cb5ba999ea68c89840cebe551ec250b
    url: ../site
    clauses:
      - {clause: package.json, title: The package that names the framework}
      - {clause: pages/about.tsx, title: The page file of /about}
      - {clause: 'pages/api/loans/[loanId].ts', title: 'The route file of /api/loans/{loanId}'}
      - {clause: pages/api/loans/index.ts, title: The route file of /api/loans}
      - {clause: pages/index.tsx, title: The page file of /}
      - {clause: 'pages/loans/[loanId].tsx', title: 'The page file of /loans/{loanId}'}
      - {clause: pages/loans/index.tsx, title: The page file of /loans}
      - {clause: proxy.ts, title: Middleware the router runs before the routes it covers}
      - {clause: pages/404.tsx, title: Set aside; the question that cites it says why}
      - {clause: pages/_app.tsx, title: Set aside; the question that cites it says why}
      - {clause: pages/_document.tsx, title: Set aside; the question that cites it says why}
      - {clause: pages/about/index.tsx, title: Set aside; the question that cites it says why}
      - {clause: 'pages/api/[...all].ts', title: Set aside; the question that cites it says why}
      - {clause: 'pages/docs/[...slug].tsx', title: Set aside; the question that cites it says why}
      - {clause: pages/terms.mdx, title: Set aside; the question that cites it says why}
