specarch: "1.0.0"
info:
  title: Pages of app
  version: 0.1.0
  description: |
    The pages and operations the file-system router rooted at app serves, read from the files git tracks there at commit 671bc9d2b53f5ec9d65b4233dd612255db9c5198, with the content of each page that has a schema file from that file. Every page and operation cites its file; what the files' places and the schemas do not say is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: 671bc9d2b53f5ec9d65b4233dd612255db9c5198
    url: ../site
    clauses:
      - {clause: app/members/page.schema.ts, title: The schema of the page at /members}
      - {clause: app/members/page.tsx, title: The page file of /members}
