specarch: "0.3"
info: { title: Case, version: 1.0.0 }
stages: [implementation]
entities:
  Loan:
    type: object
    properties:
      id: { type: string, format: uuid }
      memberId: { type: string, format: uuid }
      organisationId: { type: string, format: uuid }
      archived: { type: boolean }
    required: [id, memberId, organisationId, archived]
    primaryKey: [id]
caller:
  description: Who is making the call, once the session has been checked.
  properties:
    memberId: { type: [string, "null"], format: uuid, description: The member signed in; null for staff. }
    organisationId: { type: string, format: uuid, description: The organisation every caller belongs to. }
permissions:
  loans.read: { description: See loans. }
roles:
  member:
    description: A card holder, who sees only their own loans.
    permissions: [loans.read]
    rows:
      Loan: memberId == caller.memberId
  desk-staff:
    description: Staff of one organisation, who see its loans that are not archived.
    permissions: [loans.read]
    rows:
      Loan: organisationId == caller.organisationId && !archived
