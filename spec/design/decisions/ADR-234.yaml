# yaml-language-server: $schema=../../../schema/specarch-fragment-design-1.0.schema.json
decisions:
  ADR-234:
    title: The stakeholder list is confirmed complete by a role, under stakeholdersComplete, and until then the validator warns, every document carries a banner and approve warns
    status: proposed
    date: "2026-11-03"
    context: |
      A stakeholder nobody listed objects first at the acceptance test,
      when the change is dearest. The validator checks that every role a
      need, a question or a handover names is a stakeholder, and warns
      unheard of a role no record ever heard, but nothing says whether
      the list itself is complete, and nothing can: who has an interest
      in the system is a human finding, taken at a kickoff or an
      interview, not a rule a program can check. A specification is
      written in any order, and most start with the needs and the
      design long before every stakeholder is known.
    decision: |
      The root holds stakeholdersComplete, a single section of the
      requirements stage beside the stakeholders, with by, the
      stakeholder who confirms that the list is complete, date, and, when
      a declared source records the confirmation, source, that source,
      such as the kickoff interview. by must be a stakeholder (the rule
      stakeholder) and source, when given, a declared source (the rule
      source), as a decision's decidedBy and cites are checked. Until the key is set, validate
      warns stakeholders_unconfirmed at /stakeholders, every document
      specarch document writes and the overview of the HTML site carry
      the banner Stakeholders unconfirmed under their title, and
      specarch approve prints the same warning on standard error, writes
      the approval record and exits 0. A must question that blocks the
      stakeholders holds the warning and the banner alike, since the
      gap is then already asked about and the documents name the
      question. A specification that lists no stakeholders is told to
      list them first, since by names one of them. A file on a meta-model
      before 1.0.0 gets neither the warning nor the banner, since its
      schema has no stakeholdersComplete and its meta_model_version
      warning already tells it to upgrade. The key is the refinement's own record, not an
      element of the system: diff and the comparison leave it out, and
      origin tracking does not ask it for an origin.
    consequences: |
      Every specification on meta-model 1.0 without the key warns once, in validate and
      in each document, until a role confirms the list; the examples of
      this repository and its own specification show the warning until
      their lists are confirmed. The confirmation is one small object
      written once, and a role that was forgotten after it is a change
      request, not a reason to unset it.
    why: |
      A warning rather than an error, because the list's completeness
      is a decision only a person can take, and a compiler for
      specifications reads what it is given and marks what is missing
      rather than refusing it; writing order stays free, as it does for
      every other gap. The banner on every document rather than on the
      requirements document alone, because the reader of a technical
      specification or a handover who relies on it has the same risk of
      a missing role as the reader of the requirements, and the banner
      is the one place that reader looks. A declared source rather than
      free text, because the confirmation then rests on the same kind
      of evidence a decision rests on, and specarch gaps and the
      comparison can show it. by, date and source as plain keys rather
      than a cites list, because there is one confirmation, by one
      role, on one day; a citation object with a clause and what it
      says is more than the fact needs (the Low IQ Tax). source
      optional rather than required, because a small specification
      confirms its list at a talk it never declared as a source, as
      specarch decide asks for a declared source only where origin is
      tracked; when it is given, it is checked. Held, the warning and
      the banner alike, by a must question that blocks the
      stakeholders, because a question on the list is the same gap
      already tracked, with a stakeholder to answer it, and two marks
      for one gap are noise: the documents name the question in their
      Draft notice, and a banner beside it would say the same thing
      twice. An incomplete
      specification stays readable: the key missing is a warning at the
      list and a banner, and nothing else changes.
    satisfies: [SA-129]
    restsOn: [ADR-129, ADR-220]
    cites:
      - source: iso-29148
        clause: "5.2.2"
        says: "The stakeholders of the system are identified, so that every class of stakeholder with a legitimate interest in the system is represented."
