  # specarch-problem: question: open_question: (must, decision) The check RequireApplication admits only the application admin-web, the one the person signed in through, at 1 operation, which check invoices.delete. On every role that grants it, write through with the applications the check admits, here or in the identity module. POST /invoices/{invoiceId}/archive and POST /invoices/{invoiceId}/void check the same without it, and through narrows the grant there too: is it meant there? It blocks roles. Decided by system-owner. Answer with a decision record that names Q-12 under answers. [Q-12]
  Q-12:
    question: 'The check RequireApplication admits only the application admin-web, the one the person signed in through, at 1 operation, which check invoices.delete. On every role that grants it, write through with the applications the check admits, here or in the identity module. POST /invoices/{invoiceId}/archive and POST /invoices/{invoiceId}/void check the same without it, and through narrows the grant there too: is it meant there?'
    kind: decision
    priority: must
    blocks: [roles]
    decidedBy: system-owner
    why: The application is a condition on a grant, written on the role keyed by the permission (ADR-106); the reader writes no role, and the code shows the check, not which grant it narrows.
    cites:
      - {source: code, clause: 'core/server.go:26', says: 'Calls Server.RequireApplication, which the implementation file names as an application check.'}
  # specarch-problem: question: open_question: (must, decision) The check RequireAudience compares a token's aud with s.audience at 4 operations. Which audience names this service: the const of aud on the access token it accepts? A value per environment goes in the implementation file's deployments. It blocks tokens. Decided by system-owner. Answer with a decision record that names Q-13 under answers. [Q-13]
  Q-13:
    question: 'The check RequireAudience compares a token''s aud with s.audience at 4 operations. Which audience names this service: the const of aud on the access token it accepts? A value per environment goes in the implementation file''s deployments.'
    kind: decision
    priority: must
    blocks: [tokens]
    decidedBy: system-owner
    why: A token accepted without a fixed audience is refused, since a token minted for one service could be replayed at the next (ADR-109); the reader writes no token, and an audience read from a setting is the deployment's value.
    cites:
      - {source: code, clause: 'core/server.go:24', says: 'Calls Server.RequireAudience, which the implementation file names as an audience check.'}
  # specarch-problem: question: open_question: (must, decision) The check RequireCaller admits only the service middleware as the immediate caller on a person's behalf, written as the via of 1 operation. Declare each as a client of kind service with its workload-identity proof, mutualTls, spiffe or wimse, here or in the identity module, and the transaction token the operations accept with it. Decided by system-owner. Answer with a decision record that names Q-14 under answers. [Q-14]
  Q-14:
    question: The check RequireCaller admits only the service middleware as the immediate caller on a person's behalf, written as the via of 1 operation. Declare each as a client of kind service with its workload-identity proof, mutualTls, spiffe or wimse, here or in the identity module, and the transaction token the operations accept with it.
    kind: decision
    priority: must
    blocks: ['#/paths/~1invoices~1{invoiceId}/delete/via']
    decidedBy: system-owner
    why: The code names the services and not how each proves itself, which is the deployment's; via names the immediate callers one by one, each with a workload-identity proof, and needs the transaction token it is checked with (ADR-111).
    cites:
      - {source: code, clause: 'core/server.go:26', says: 'Calls Server.RequireCaller with "middleware", which the implementation file names as a caller check.'}
  # specarch-problem: question: open_question: (must, decision) The check RequireCaller compares the immediate caller's workload identity with the services s.callers gives, and it guards 1 operation. Which services call each of them on a person's behalf: its via? Decided by system-owner. Answer with a decision record that names Q-15 under answers. [Q-15]
  Q-15:
    question: 'The check RequireCaller compares the immediate caller''s workload identity with the services s.callers gives, and it guards 1 operation. Which services call each of them on a person''s behalf: its via?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1invoices~1{invoiceId}~1void/post/via']
    decidedBy: system-owner
    why: Names read at run time are not known by syntax. via names the immediate callers one by one, each a service with a workload-identity proof, with no wildcard, since a hop added later would then be admitted without anyone writing it (ADR-111).
    cites:
      - {source: code, clause: 'core/server.go:27', says: 'Calls Server.RequireCaller, which the implementation file names as a caller check.'}
  # specarch-problem: question: open_question: (must, decision) The check RequireClients admits only the clients reporting and archive, written as the callers of 1 operation. Declare each under clients with its kind, the roles that grant the permissions it calls with and its proof, here or in the identity module. Do people call any of them? Decided by system-owner. Answer with a decision record that names Q-16 under answers. [Q-16]
  Q-16:
    question: The check RequireClients admits only the clients reporting and archive, written as the callers of 1 operation. Declare each under clients with its kind, the roles that grant the permissions it calls with and its proof, here or in the identity module. Do people call any of them?
    kind: decision
