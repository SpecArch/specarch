questions:
  Q-1:
    question: 'What is each role for, and who holds it: auditor, desk-staff?'
    kind: decision
    priority: must
    blocks: ['#/roles/auditor/description', '#/roles/desk-staff/description']
    decidedBy: system-owner
    why: A permission table names a role and what it grants, not who holds it.
  Q-2:
    question: 'What does each permission allow: loans.read, loans.write?'
    kind: decision
    priority: must
    blocks: ['#/permissions/loans.read/description', '#/permissions/loans.write/description']
    decidedBy: system-owner
    why: A permission table names the permissions a role grants and not what they are for.
  Q-3:
    question: The check RequireAPIKey runs only when the setting DESK_API_KEY is present. Is an empty DESK_API_KEY ever meant to let every request through, or should the check refuse every request until it is set?
    kind: decision
    priority: must
    blocks: [roles]
    decidedBy: system-owner
    why: A check switched off by an empty setting fails open without an error, so no role's grants hold while it is off.
  Q-4:
    question: 'Not held: grant of public to auditor: public is open to everyone and granted by no role; left out. Does the specification need it, written another way or described by hand?'
    kind: decision
    priority: could
    blocks: [roles]
    decidedBy: system-owner
    why: The source says it, and the meta-model cannot hold it as the source writes it, so the reader left it out or wrote it as the question says. Nothing waits for the answer.
