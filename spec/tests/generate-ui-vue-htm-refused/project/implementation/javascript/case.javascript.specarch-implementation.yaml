specarchImplementation: "1.0.0"
info: { title: "Case in JavaScript on Vue and htm, refused", version: 1.0.0 }
implements: { file: ../../specarch.yaml, version: 1.0.0 }
stack: { language: { name: JavaScript, version: ES2020 } }
libraries:
  vue:
    version: 3.5.43
    licence: MIT
    purpose: The runtime-only build that draws the screens.
    files: { vendor/vue.runtime.global.prod.js: sha384-YWJj }
  htm:
    version: 3.1.1
    licence: Apache-2.0
    purpose: The tagged templates the screens write their markup in.
    files: { vendor/htm.umd.js: sha384-Ha/rZ1SM6j6GFVMjNonV3LKPW11co4wy3H4IgiMFL/XrLLE68h1euLps89na4wD1 }
  tables:
    version: 2.0.0
    licence: MIT
    purpose: A table library the list page draws through.
    files: { vendor/tables.js: sha384-wRUdzBb9rjxUOB/BX0Nvm1rGocQW6KpyyN7zTekdE+cKxpb0MwSmxzn04ePFtC+O }
  plain:
    version: 1.0.0
    licence: MIT
    purpose: A library with no file listed.
mappings:
  "#/menus/admin": { target: the administration's own menu, ownedBy: administration }
  "#/paths/~1sessions/post": { target: the administration's own sign-in route, ownedBy: administration }
  "#/pages/branch-list": { target: the branches page another team writes, ownedBy: administration }
targets:
  ui:
    output: ../../../web
    platform: web
    framework: vue-htm
    settings:
      language: en
      session: { operation: getSession, signedIn: open, permissions: granted, signIn: sign-in }
      hooks: { member-form: [joinedOn] }
      layouts: { member-form: tabs }
      translations: [en-GB]
      vendor: [htm, tables, plain]
      server:
        routes: /api
        service: MEMBERS_SERVICE_URL
        token: { cookie: members_session, header: Authorization, scheme: Bearer }
