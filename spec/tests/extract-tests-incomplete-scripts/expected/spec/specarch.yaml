specarch: "1.0.0"
info:
  title: Tests in notes.feature, sheet.csv
  version: 0.1.0
  description: |
    The tests in notes.feature, sheet.csv, read at commit 3712f73908ce4c79711352a7aae1720294a61275: each scenario of a feature file and each row of a test sheet is a test, inferred from the script, its precondition and test data as given, its steps as when and its expected result as then; each part the script leaves out, and the subject each test exercises, is a question.
