entities:
  # specarch-problem: warning: origin_missing: Note carries no origin, and the specification tracks origin; add origin: stated, inferred or decided [origin_missing@design/design.yaml#/entities/Note]
  Note:
    type: object
    primaryKey: [id]
    properties:
      id: {type: string, format: uuid}
      text: {type: string, minLength: 1, maxLength: 200}
    required: [id, text]
permissions:
  # specarch-problem: warning: origin_missing: notes.write carries no origin, and the specification tracks origin; add origin: stated, inferred or decided [origin_missing@design/design.yaml#/permissions/notes.write]
  notes.write:
    description: Write and read a note.
roles:
  # specarch-problem: warning: origin_missing: writer carries no origin, and the specification tracks origin; add origin: stated, inferred or decided [origin_missing@design/design.yaml#/roles/writer]
  writer:
    description: Someone who keeps notes.
    permissions: [notes.write]
paths:
  /notes:
    # specarch-problem: warning: origin_missing: operation createNote carries no origin, and the specification tracks origin; add origin: stated, inferred or decided [origin_missing@design/design.yaml#/paths/~1notes/post]
    post:
      operationId: createNote
      summary: Keep a note
      permission: notes.write
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/entities/Note'}
      responses:
        "201":
          description: The note is kept.
          content:
            application/json:
              schema: {$ref: '#/entities/Note'}
        "400":
          description: The note is not valid.
        "403":
          description: The caller may not keep notes.
  /notes/{noteId}:
    # specarch-problem: warning: origin_missing: operation readNote carries no origin, and the specification tracks origin; add origin: stated, inferred or decided [origin_missing@design/design.yaml#/paths/~1notes~1{noteId}/get]
    get:
      operationId: readNote
      summary: Read a note
      permission: notes.write
      parameters:
        - {name: noteId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema: {$ref: '#/entities/Note'}
        "404":
          description: No note has that key.
