  # specarch-problem: question: open_question: (must, decision) Is each of these settings a secret: SHELF_TOKEN? Each name says it may hold a credential, and the source does not say. Decided by system-owner. Answer with a decision record that names Q-12 under answers. [Q-12]
  Q-12:
    question: 'Is each of these settings a secret: SHELF_TOKEN? Each name says it may hold a credential, and the source does not say.'
    kind: decision
    priority: must
    blocks: ['#/configuration/shelfToken/secret']
    decidedBy: system-owner
    why: A secret's value is never written in a specification, and the name alone does not say which a setting is; an app's Info.plist is readable by anyone who has the app.
