    post:
      operationId: postLoansList
      summary: List loans
      description: Lists the loans a page at a time.
      permission: loans.read
      origin: stated
      cites:
        - {source: code, clause: 'api/endpoints.go:9', says: 'NewEndPoint registers POST /loans/list; its handler is LoanList.RequestSearchPagingList, its middlewares are RequireDeskKey and RequireChecks, and it checks LOANS.READ.'}
        - {source: code, clause: 'api/tables.go:5', says: 'The handler of POST /loans/list is dxlib''s RequestSearchPagingList of this table. NewDXTableSimple makes the table desk.loans: its paging list searches title, member_name; orders by due_on, title; filters by member_id, state.'}
