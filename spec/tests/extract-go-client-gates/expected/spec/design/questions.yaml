  # specarch-problem: question: open_question: (must, decision) The check RequireClient admits only a client, a caller on its own account rather than a person's, and it guards 1 operation. Which clients call each of them, and do people call any? Decided by system-owner. Answer with a decision record that names Q-11 under answers. [Q-11]
  Q-11:
    question: The check RequireClient admits only a client, a caller on its own account rather than a person's, and it guards 1 operation. Which clients call each of them, and do people call any?
    kind: decision
    priority: must
    blocks: ['#/paths/~1reconciliation~1loans/get/callers']
    decidedBy: system-owner
    why: Syntax shows that a check admits clients and not which ones, which a key or a token read at run time says. callers names who may call one by one, people and each client, with no word for every client, since a client added later would then be admitted without anyone writing it (ADR-110).
    cites:
      - {source: code, clause: 'desk/server.go:26', says: 'Calls Server.RequireClient, which the implementation file names as a client check.'}
