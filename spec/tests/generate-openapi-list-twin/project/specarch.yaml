specarch: "0.1"
info: { title: Case, version: 1.0.0 }
stages: [implementation]
stakeholders:
  owner: { description: The product owner. }
enums:
  Shelf:
    type: string
    enum: [fiction, reference]
entities:
  Book:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      title: { type: string, maxLength: 300 }
      shelf: { $ref: "#/enums/Shelf" }
    required: [id, title, shelf]
    primaryKey: [id]
    audited: true
errors:
  book-not-found: { status: 404, title: No such book, condition: No book has the id. }
permissions:
  books.read: { description: See books. }
roles:
  desk: { description: The desk., permissions: [books.read] }
paths:
  /books:
    get:
      operationId: listBooks
      summary: The books
      permission: books.read
      listOf:
        entity: Book
        searchable: [title]
        filterable: [shelf]
        sortable: [title]
        pageSize: { default: 20, maximum: 50 }
      responses:
        "200":
          description: A page of books.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Book" } }
  /books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBook
      summary: One book
      permission: books.read
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: { $ref: "#/entities/Book" }
        "404": { description: No such book., problem: book-not-found }
