  # specarch-problem: question: open_question: (must, decision) The check Require is skipped for every client: a client passes it whatever its roles grant. Is every client meant to reach each operation the check guards, or which ones are, and should the check hold the others to their roles' grants? Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: 'The check Require is skipped for every client: a client passes it whatever its roles grant. Is every client meant to reach each operation the check guards, or which ones are, and should the check hold the others to their roles'' grants?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1loans/get/permission', '#/paths/~1loans/post/permission', '#/paths/~1members~1{cardNumber}/get/permission']
    decidedBy: system-owner
    why: A check skipped for one kind of caller fails open for that kind without an error, so no role's grants hold for a client.
    cites:
      - {source: code, clause: access gate Require, says: The permission table declares that Require is skipped for every client.}
