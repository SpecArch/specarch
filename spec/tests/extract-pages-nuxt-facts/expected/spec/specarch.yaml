# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.5.0/schema/specarch-design-0.1.schema.json
specarch: "0.1"
info:
  title: Pages of site/pages
  version: 0.1.0
  description: |
    The pages and operations the file-system router rooted at site/pages serves, read from the files git tracks there at commit b72b487724494f43cdb8e5ad3a7f83bc2e23fcb5, with the content of each page that has a schema file from that file. Every page and operation cites its file; what the files' places and the schemas do not say is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: b72b487724494f43cdb8e5ad3a7f83bc2e23fcb5
    url: ../repo
    clauses:
      - {clause: site/middleware/auth.ts, title: 'Source the router''s files import, read through the code-facts dump'}
      - {clause: site/middleware/session.global.ts, title: Middleware the router runs before the routes it covers}
      - {clause: site/pages/loans/index.vue, title: The page file of /loans}
      - {clause: site/pages/loans/new.vue, title: The page file of /loans/new}
      - {clause: 'site/pages/members/[id].vue', title: 'The page file of /members/{id}'}
      - {clause: site/utils/auth.ts, title: 'Source the router''s files import, read through the code-facts dump'}
