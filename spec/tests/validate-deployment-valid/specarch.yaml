specarch: "0.1"
info: { title: Case, version: 1.0.0 }
environments:
  staging: { description: Where a release is tried., promotesTo: production }
  production: { description: The live system. }
configuration:
  dailyRate: { description: The fee per day., secret: false, schema: { type: string, format: decimal, precision: 10, scale: 2 } }
  databaseUrl: { description: "Where the database is; the value comes from the host's secret store.", secret: true, schema: { type: string, format: uri } }
release:
  steps:
    - { name: Install, action: Install the build on the environment., check: The smoke check passes. }
rollback:
  steps:
    - { name: Switch back, action: Point the service at the previous build., check: The smoke check passes. }
migrations:
  add-rate:
    description: Every item gets a rate.
    steps:
      - { name: Add the column, action: Add the rate column., check: The column exists. }
    rollback:
      - { name: Drop the column, action: Drop the rate column., check: The column is gone. }
checks:
  service-answers:
    kind: smoke
    description: The installed service answers.
    environment: production
    steps:
      - { name: Call it, action: Call the health endpoint., check: It answers 200. }
signoff:
  criteria: [Every check passed on production.]
  signers:
    - { role: head-clerk }
