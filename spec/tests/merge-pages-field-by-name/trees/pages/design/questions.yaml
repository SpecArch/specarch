questions:
  Q-1:
    question: For the page at /loans/new, what are its kind (list, form or view), its title, the entity it shows, the operation it reads, the operation it submits to and the columns it lists?
    kind: decision
    priority: must
    blocks: ['#/pages/loans-new/kind', '#/pages/loans-new/title', '#/pages/loans-new/entity', '#/pages/loans-new/source', '#/pages/loans-new/submit', '#/pages/loans-new/columns']
    decidedBy: system-owner
    why: The folders name a page's route and not what it shows.
  Q-2:
    question: Which permission does the page at /loans/new check, or is it open to everyone (public)?
    kind: decision
    priority: must
    blocks: ['#/pages/loans-new/permission']
    decidedBy: system-owner
    why: The folders name a page's route and not who may open it, and a page open to everyone is how an open screen is usually found, so it is asked, never assumed.
  Q-3:
    question: For the page at /members/{cardNumber}/loans, what is the operation it reads? Its schema names listMemberLoans as the operation it reads, which only the router's tree holds.
    kind: decision
    priority: must
    blocks: ['#/pages/members-by-card-number-loans/source']
    decidedBy: system-owner
    why: The folders name a page's route, and its schema does not give these, or names operations this tree does not hold.
  Q-4:
    question: For the page at /, what are its kind (list, form or view), its title, the entity it shows, the operation it reads, the operation it submits to and the columns it lists?
    kind: decision
    priority: must
    blocks: ['#/pages/root/kind', '#/pages/root/title', '#/pages/root/entity', '#/pages/root/source', '#/pages/root/submit', '#/pages/root/columns']
    decidedBy: system-owner
    why: The folders name a page's route and not what it shows.
  Q-5:
    question: Which permission does the page at / check, or is it open to everyone (public)?
    kind: decision
    priority: must
    blocks: ['#/pages/root/permission']
    decidedBy: system-owner
    why: The folders name a page's route and not who may open it, and a page open to everyone is how an open screen is usually found, so it is asked, never assumed.
  Q-6:
    question: 'What is the primary key of Loans, and what does each field the pages show hold: barcode, dueOn, loanedOn, returnedOn?'
    kind: decision
    priority: must
    blocks: ['#/entities/Loans/primaryKey', '#/entities/Loans/properties/barcode', '#/entities/Loans/properties/dueOn', '#/entities/Loans/properties/loanedOn', '#/entities/Loans/properties/returnedOn']
    decidedBy: system-owner
    why: The schema of the page at /members/{cardNumber}/loans names the entity and the fields it shows, not their types or the entity's key.
  Q-7:
    question: 'What does each permission allow: loans.read?'
    kind: decision
    priority: must
    blocks: ['#/permissions/loans.read/description']
    decidedBy: system-owner
    why: A page schema names the permission a page checks and not what it is for.
  Q-8:
    question: 'Which role grants each permission: loans.read?'
    kind: decision
    priority: must
    blocks: ['#/permissions/loans.read']
    decidedBy: system-owner
    why: A page schema names the permission a page checks and not who holds it.
