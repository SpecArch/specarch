  "No acceptance criteria yet.": "Belum ada acceptance criteria."
  "Constraints": "Batasan"
  "| Constraint | Kind | Statement |": "| Batasan | Jenis | Pernyataan |"
  "Assumptions": "Asumsi"
  "| Assumption | Statement |": "| Asumsi | Pernyataan |"
  "Glossary": "Glosarium"
  "| Term | Meaning |": "| Istilah | Arti |"
  "Requirements with the prefix %s are in %s.": "Requirement dengan prefix %s ada di %s."
  "Requirements kept elsewhere": "Requirement yang disimpan di tempat lain"
  "# %s: test plan": "# %s: test plan"
  "Version %s of the specification: %s, %d golden and %d red, about %s. Golden tests show a path that succeeds, red tests a path that is refused. The test cases follow the test case specification of ISO/IEC/IEEE 29119-3.": "Spesifikasi versi %s: %s, %d golden dan %d red, tentang %s. Test golden menunjukkan alur yang berhasil, test red alur yang ditolak. Test case mengikuti spesifikasi test case ISO/IEC/IEEE 29119-3."
  "design test": "design test"
  "design tests": "design test"
  "subject": "subject"
  "subjects": "subject"
  "%s marked not applicable, with the reason.": "%s ditandai tidak berlaku, beserta alasannya."
  "test is": "test"
  "tests are": "test"
  "Of the %s that apply, the tests target writes %d with their bodies, from their input and expected outcome, and %d with a body written by hand (section 1).": "Dari %s yang berlaku, target tests menulis %d lengkap dengan body-nya, dari input dan hasil yang diharapkan, dan %d dengan body yang ditulis manual (bagian 1)."
  "test": "test"
  "tests": "test"
  "Levels and how the tests run": "Level dan cara test dijalankan"
  "| Level | Design tests |": "| Level | Design test |"
  "System and acceptance tests are design tests, written in the specification and run by every implementation. Unit and integration tests belong to one implementation and are listed with it below.": "System test dan acceptance test adalah design test, ditulis di spesifikasi dan dijalankan oleh setiap implementasi. Unit test dan integration test milik satu implementasi dan didaftar bersama implementasinya di bawah."
  "| Subject | Design tests | Body generated | Body written by hand |": "| Subject | Design test | Body di-generate | Body ditulis manual |"
  "The tests target writes a test's body when the test is about an operation, a command or a page and gives its `input` or `expect`: the call, and the checks of what it answers. Every other test is generated with its given, when and then and a body written by hand beside the generated file. `specarch derive --fill` adds the fixture, input and expect the design fixes to the operation and command tests that have none; it drafts no call for a page or any other subject.": "Target tests menulis body sebuah test bila test itu tentang operasi, command, atau halaman dan memberikan `input` atau `expect`-nya: pemanggilannya, dan pengecekan atas jawabannya. Test lainnya di-generate dengan given, when, dan then, serta body yang ditulis manual di samping file hasil generate. `specarch derive --fill` menambahkan fixture, input, dan expect yang ditetapkan desain ke test operasi dan command yang belum punya; command ini tidak membuat draft pemanggilan untuk halaman atau subject lain."
  "Implementation: ": "Implementasi: "
  "Framework: %s. Run: `%s`.": "Framework: %s. Jalankan: `%s`."
  "| Suite | Level | Runs | Command |": "| Suite | Level | Menjalankan | Command |"
  "Test cases": "Test case"
  "Scenario: ": "Skenario: "
  "level: ": "level: "
  "Not applicable: ": "Tidak berlaku: "
  "- Given: %s": "- Given: %s"
  "- When: %s": "- When: %s"
  "- Then: %s": "- Then: %s"
  "Derived cases left out": "Derived case yang tidak dimuat"
  "%s the design implies %s no test and %s not written by default: none is about a subject that satisfies a requirement with a harm, none is a case nobody exercises by hand (a failing dependency, two writers on one record), and none is a mistake users make often. Writing a test that covers one removes it from this list.": "%s yang tersirat dari desain%.0s belum punya test dan%.0s tidak ditulis secara default: tidak ada yang tentang subject yang memenuhi requirement dengan dampak, tidak ada yang berupa case yang tidak pernah dicoba manual (dependency yang gagal, dua penulis pada satu record), dan tidak ada yang berupa kesalahan yang sering dibuat user. Menulis test yang meng-cover salah satunya menghapusnya dari daftar ini."
  "case": "case"
  "cases": "case"
  "| Subject | Case | Scenario | Why it is left out |": "| Subject | Case | Skenario | Alasan tidak dimuat |"
  "The checks run on the installed system before it is handed over are in the commissioning procedure.": "Pengecekan yang dijalankan pada sistem terpasang sebelum diserahterimakan ada di prosedur commissioning."
  "Requirements by release": "Requirement per release"
  "requirement names the release it is": "requirement menyebut release"
  "requirements name the release they are": "requirement menyebut release"
  " meant for. Each release lists its requirements and the design tests that verify them, so a release is tested with its own scope.": " tujuannya. Tiap release mendaftar requirement-nya dan design test yang memverifikasinya, jadi sebuah release dites sesuai scope-nya sendiri."
  "| Requirement | Priority | Verified by |": "| Requirement | Prioritas | Diverifikasi oleh |"
  "No release named": "Tanpa release"
  " Harm |": " Dampak |"
  "design tests ": "design test "
  "every design test of ": "semua design test dari "
  "tests of this implementation only": "hanya test implementasi ini"
  "# %s: traceability matrix": "# %s: traceability matrix"
  "Version %s of the specification: %s, %s, and %s.": "Spesifikasi versi %s: %s, %s, dan %s."
  "gap": "gap"
  "gaps": "gap"
  " Each requirement is traced back to the needs it refines and forward to what satisfies it in the design and what verifies it in the tests and commissioning checks": " Tiap requirement ditelusuri mundur ke kebutuhan yang dirincinya, dan maju ke apa yang memenuhinya di desain serta apa yang memverifikasinya di test dan pengecekan commissioning"
  "; %s held elsewhere, fulfilled by another stakeholder's component": "; %s dipegang di tempat lain, dipenuhi oleh komponen milik stakeholder lain"
  "requirement is": "requirement"
  "requirements are": "requirement"
  "Needs to requirements": "Kebutuhan ke requirement"
  "| Need | Status | Refined by |": "| Kebutuhan | Status | Dirinci oleh |"
  "Requirements to design and verification": "Requirement ke desain dan verifikasi"
  "| Requirement |%s Needs | Satisfied by | Verified by |": "| Requirement |%s Kebutuhan | Dipenuhi oleh | Diverifikasi oleh |"
  "Requirements held elsewhere": "Requirement yang dipegang di tempat lain"
  "The promises another stakeholder's component keeps: nothing in this specification satisfies or verifies them, so they are no gap here.": "Janji yang dipegang komponen milik stakeholder lain: tidak ada isi spesifikasi ini yang memenuhi atau memverifikasinya, jadi di sini tidak dihitung sebagai gap."
  "| Requirement | Needs | Owned by | Fulfilled by |": "| Requirement | Kebutuhan | Dimiliki oleh | Dipenuhi oleh |"
  "Gaps": "Gap"
  "None: every need is refined, and every requirement has acceptance criteria, is satisfied once there is a design, and is verified once there are tests, checks or monitors.": "Tidak ada: setiap kebutuhan sudah dirinci, dan setiap requirement punya acceptance criteria, dipenuhi begitu ada desain, dan diverifikasi begitu ada test, pengecekan, atau monitor."
  "Rejected needs and rejected or retired requirements are left out.": "Kebutuhan yang ditolak dan requirement yang ditolak atau dipensiunkan tidak dimuat."
  "Rejected needs, rejected or retired requirements and the satisfaction and verification of the requirements held elsewhere are left out.": "Kebutuhan yang ditolak, requirement yang ditolak atau dipensiunkan, serta pemenuhan dan verifikasi requirement yang dipegang di tempat lain tidak dimuat."
  "The work the specification still owes, the same gaps the validator warns about. ": "Pekerjaan yang masih menjadi utang spesifikasi, sama dengan gap yang diberi warning oleh validator. "
  "Needs no requirement refines": "Kebutuhan yang belum dirinci requirement mana pun"
  "Requirements without acceptance criteria": "Requirement tanpa acceptance criteria"
  "Requirements no design element satisfies": "Requirement yang belum dipenuhi elemen desain mana pun"
  "Requirements no test, check or monitor verifies": "Requirement yang belum diverifikasi test, pengecekan, atau monitor mana pun"
  "# %s: deployment guide": "# %s: panduan deployment"
  "Version %s of the specification: %s, %s and %s. Secrets are named here with where their value comes from, never with a value.": "Spesifikasi versi %s: %s, %s, dan %s. Secret disebut di sini beserta asal nilainya, tidak pernah dengan nilainya."
