specarch: "1.0.0"
info: { title: Case, version: 1.0.0 }
timeZone: Asia/Jakarta
sources:
  desk-interview:
    kind: interview
    title: Interview with the desk staff
    date: "2026-10-31"
    at: "2026-10-31T09:00:00+07:00"
    participants: [librarian, owner]
stakeholders:
  owner: { description: The product owner. }
  librarian: { description: Runs the lending desk. }
  library-board: { description: Decides the library's rules. }
needs:
  NEED-1:
    statement: Members may not take more than they bring back.
    stakeholders: [librarian]
requirements:
  CASE-1:
    statement: A member shall borrow at most five books at once.
    kind: functional
    priority: must
    status: accepted
    acceptance: [A sixth loan is refused.]
    needs: [NEED-1]
    ownedBy: library-board
    cites:
      - record: COM-4
        says: "The board has never allowed more than five."
entities:
  Loan:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
    required: [id]
    primaryKey: [id]
environments:
  production: { description: The live system. }
decisions:
  ADR-001:
    title: Five loans for every member
    status: accepted
    date: "2026-10-31"
    context: Q-1 asked how many loans a member may hold.
    decision: Five.
    consequences: CASE-1 says five.
    decidedBy: library-board
    answers: [Q-1]
    satisfies: [CASE-1]
    cites:
      - record: COM-9
        says: "Five."
  ADR-002:
    title: Reference copies are not lent
    status: accepted
    date: "2026-10-31"
    context: Whether a reference copy counts.
    decision: It is not lent at all.
    consequences: Nothing counts it.
    decidedBy: library-board
    cites:
      - record: COM-3
        says: "Could the desk see a member's open loans on one page?"
  ADR-003:
    title: A member may hold five loans
    status: accepted
    date: "2026-10-31"
    context: Q-3 asked how many.
    decision: Five.
    consequences: CASE-1 says five.
    decidedBy: library-board
    answers: [Q-3]
    cites:
      - record: COM-1
        says: "Five, as it has always been."
  ADR-004:
    title: A reservation holds a copy for three days
    status: accepted
    date: "2026-11-01"
    context: Q-4 asked how long a reservation holds a copy.
    decision: Three days.
    consequences: The reservation's expiry is three days after it is made.
    decidedBy: owner
    answers: [Q-4]
    cites:
      - record: COM-5
        says: "A reservation holds a copy for three days."
