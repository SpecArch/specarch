questions:
  # specarch-problem: question: open_question: (must, decision) POST /addEntry checks no privilege: it registers it with none, so dxlib lets through every caller its middlewares admit (it has no middleware). Is it meant to be open to everyone (public), or which permission should it check? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: 'POST /addEntry checks no privilege: it registers it with none, so dxlib lets through every caller its middlewares admit (it has no middleware). Is it meant to be open to everyone (public), or which permission should it check?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1addEntry/post/permission']
    decidedBy: system-owner
    why: dxlib checks no privilege on an endpoint that names none, and whether a caller must sign in is decided by its middlewares, which are code; an open endpoint is never written as public without the owner's word.
