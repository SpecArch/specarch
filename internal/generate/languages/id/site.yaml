translations:
  "<p class=\"mark question\">Held open by <a href=\"%s\">%s</a>: %s Decided by %s.</p>": "<p class=\"mark question\">Ditahan terbuka oleh <a href=\"%s\">%s</a>: %s Diputuskan oleh %s.</p>"
  "<html lang=\"en\">": "<html lang=\"id\">"
  "<header class=\"top\"><a class=\"home\" href=\"#overview\">%s</a> <span class=\"version\">version %s</span>": "<header class=\"top\"><a class=\"home\" href=\"#overview\">%s</a> <span class=\"version\">versi %s</span>"
  "<input id=\"search\" type=\"search\" placeholder=\"Search the specification\" aria-label=\"Search the specification\" autocomplete=\"off\"> <span id=\"found\" role=\"status\" aria-live=\"polite\"></span>": "<input id=\"search\" type=\"search\" placeholder=\"Cari di spesifikasi\" aria-label=\"Cari di spesifikasi\" autocomplete=\"off\"> <span id=\"found\" role=\"status\" aria-live=\"polite\"></span>"
  "<button id=\"theme\" type=\"button\" aria-label=\"Switch between light and dark\">Light / dark</button></header>": "<button id=\"theme\" type=\"button\" aria-label=\"Ganti tampilan terang dan gelap\">Terang / gelap</button></header>"
  "<figure class=\"diagram\">%s<figcaption>The entities and their relations; each box links to its entity.</figcaption></figure>": "<figure class=\"diagram\">%s<figcaption>Entity dan relasinya; tiap kotak menuju entity-nya.</figcaption></figure>"
  "<p class=\"note\">No screen previews: %s</p>": "<p class=\"note\">Tidak ada preview layar: %s</p>"
  "<h2>Other sections</h2>": "<h2>Bagian lain</h2>"
  "<p>Sections the meta-model does not know; the problems list says what is wrong with each.</p>": "<p>Bagian yang tidak dikenal meta-model; daftar masalah menyebut apa yang salah pada masing-masing.</p>"
  "<nav class=\"side\" aria-label=\"Contents\"><ol>": "<nav class=\"side\" aria-label=\"Daftar isi\"><ol>"
  "<li><a href=\"#overview\">Overview</a></li>": "<li><a href=\"#overview\">Ringkasan</a></li>"
  "<li><a href=\"#traceability\">Traceability</a></li>": "<li><a href=\"#traceability\">Traceability</a></li>"
  "<li><a href=\"#problems\">Problems</a> <span class=\"count\">%d</span></li>": "<li><a href=\"#problems\">Masalah</a> <span class=\"count\">%d</span></li>"
  "<p class=\"notice draft\"><strong>Draft:</strong> %s hold up what this page shows (%s); see <a href=\"#%s\">Open questions</a>.</p>": "<p class=\"notice draft\"><strong>Draft:</strong> %s menahan isi halaman ini (%s); lihat <a href=\"#%s\">Pertanyaan terbuka</a>.</p>"
  "must or should question": "pertanyaan must atau should"
  "must or should questions": "pertanyaan must atau should"
  "<p class=\"notice\"><strong>Approval:</strong> %s</p>": "<p class=\"notice\"><strong>Approval:</strong> %s</p>"
  "<p class=\"notice error\"><strong>Invalid:</strong> the specification has %s; this page shows what could be read of it, and each error is marked at its entry.</p>": "<p class=\"notice error\"><strong>Tidak valid:</strong> spesifikasi ini punya %s; halaman ini menampilkan bagian yang bisa dibaca, dan tiap error ditandai di entry-nya.</p>"
  "<p><a href=\"#problems\">%s, %s and %s</a>; each is listed under Problems and marked at the entry it concerns.</p>": "<p><a href=\"#problems\">%s, %s, dan %s</a>; masing-masing didaftar di Masalah dan ditandai di entry yang bersangkutan.</p>"
  "<table class=\"counts\"><thead><tr><th scope=\"col\">Section</th><th scope=\"col\">Elements</th></tr></thead><tbody>": "<table class=\"counts\"><thead><tr><th scope=\"col\">Bagian</th><th scope=\"col\">Elemen</th></tr></thead><tbody>"
  "<p class=\"how\">Every element carries its id, the pointer beside its name, such as <code>/entities/Name</code>. Link to it with <code>#</code> and the pointer after this page's address, and give the id when you report what you see, so the remark reaches the element it is about.</p>": "<p class=\"how\">Setiap elemen punya id, yaitu pointer di samping namanya, misalnya <code>/entities/Name</code>. Tautkan ke elemen itu dengan <code>#</code> dan pointer-nya setelah alamat halaman ini, dan sebutkan id-nya saat melaporkan apa yang Anda lihat, supaya catatannya sampai ke elemen yang dimaksud.</p>"
  "<figure class=\"diagram\"><img alt=\"The workflow %s as BPMN 2.0\" src=\"data:image/svg+xml;base64,%s\"><figcaption>As specarch generate bpmn draws it.</figcaption></figure>": "<figure class=\"diagram\"><img alt=\"Workflow %s sebagai BPMN 2.0\" src=\"data:image/svg+xml;base64,%s\"><figcaption>Seperti yang digambar specarch generate bpmn.</figcaption></figure>"
  "<figure class=\"preview\"><iframe sandbox=\"\" loading=\"lazy\" title=\"The screen %s\" srcdoc=\"%s\"></iframe><figcaption>The screen as specarch generate ui writes it, without its scripts, so it shows no data.</figcaption></figure>": "<figure class=\"preview\"><iframe sandbox=\"\" loading=\"lazy\" title=\"Layar %s\" srcdoc=\"%s\"></iframe><figcaption>Layar seperti yang ditulis specarch generate ui, tanpa script-nya, jadi tidak menampilkan data.</figcaption></figure>"
  "<p class=\"note\">No screen preview: %s</p>": "<p class=\"note\">Tidak ada preview layar: %s</p>"
  "<p class=\"trace\"><strong>Held elsewhere:</strong> %s.</p>": "<p class=\"trace\"><strong>Dipegang di tempat lain:</strong> %s.</p>"
  "<p class=\"trace\"><strong>Satisfied by:</strong> %s. <strong>Verified by:</strong> %s.</p>": "<p class=\"trace\"><strong>Dipenuhi oleh:</strong> %s. <strong>Diverifikasi oleh:</strong> %s.</p>"
  "nothing yet": "belum ada"
  " with ": " dengan "
  "<p class=\"trace\"><strong>Roles never given to one person:</strong> none; no roles together reach this set.</p>": "<p class=\"trace\"><strong>Role yang tidak boleh diberikan ke satu orang:</strong> tidak ada; tidak ada gabungan role yang mencapai set ini.</p>"
  "<p class=\"trace\"><strong>Roles never given to one person:</strong> %s.</p>": "<p class=\"trace\"><strong>Role yang tidak boleh diberikan ke satu orang:</strong> %s.</p>"
  "<p class=\"note\"><strong>Note:</strong> %s</p>": "<p class=\"note\"><strong>Catatan:</strong> %s</p>"
  "<div class=\"scroll\"><table class=\"fields\"><thead><tr><th scope=\"col\">Field</th><th scope=\"col\">Type</th><th scope=\"col\">Required</th><th scope=\"col\">Title and description</th><th scope=\"col\">Also</th></tr></thead><tbody>": "<div class=\"scroll\"><table class=\"fields\"><thead><tr><th scope=\"col\">Field</th><th scope=\"col\">Tipe</th><th scope=\"col\">Wajib</th><th scope=\"col\">Judul dan deskripsi</th><th scope=\"col\">Lainnya</th></tr></thead><tbody>"
  "<div class=\"scroll\"><table><thead><tr><th scope=\"col\">Name</th>": "<div class=\"scroll\"><table><thead><tr><th scope=\"col\">Nama</th>"
  "From <a href=\"%s\">%s</a>: %s": "Dari <a href=\"%s\">%s</a>: %s"
  "<div class=\"scroll\"><table class=\"overview\"><caption>Every HTTP operation, the permission it needs, and what it does.</caption>": "<div class=\"scroll\"><table class=\"overview\"><caption>Setiap operasi HTTP, permission yang dibutuhkannya, dan fungsinya.</caption>"
  "<thead><tr><th scope=\"col\">Method</th><th scope=\"col\">Route</th><th scope=\"col\">Operation</th><th scope=\"col\">Permission</th><th scope=\"col\">Summary</th></tr></thead><tbody>": "<thead><tr><th scope=\"col\">Method</th><th scope=\"col\">Route</th><th scope=\"col\">Operasi</th><th scope=\"col\">Permission</th><th scope=\"col\">Ringkasan</th></tr></thead><tbody>"
  "<div class=\"scroll\"><table class=\"matrix\"><caption>Which role grants which permission. Access is fail-closed: an operation, command or page needs the one permission it names.</caption><thead><tr><th scope=\"col\">Permission</th>": "<div class=\"scroll\"><table class=\"matrix\"><caption>Role mana memberikan permission mana. Akses bersifat fail-closed: operasi, command, atau halaman membutuhkan satu permission yang disebutnya.</caption><thead><tr><th scope=\"col\">Permission</th>"
  "<td class=\"yes\">through %s</td>": "<td class=\"yes\">lewat %s</td>"
  "<td class=\"yes\">yes</td>": "<td class=\"yes\">ya</td>"
  "<h3>Traceability</h3>": "<h3>Traceability</h3>"
  "<p>Each requirement, the needs it refines, and the elements that satisfy and verify it. A requirement nothing satisfies or verifies is a gap.</p>": "<p>Tiap requirement, kebutuhan yang dirincinya, dan elemen yang memenuhi serta memverifikasinya. Requirement yang tidak dipenuhi atau diverifikasi apa pun adalah gap.</p>"
  "<div class=\"scroll\"><table><thead><tr><th scope=\"col\">Requirement</th><th scope=\"col\">Needs</th><th scope=\"col\">Satisfied by</th><th scope=\"col\">Verified by</th></tr></thead><tbody>": "<div class=\"scroll\"><table><thead><tr><th scope=\"col\">Requirement</th><th scope=\"col\">Kebutuhan</th><th scope=\"col\">Dipenuhi oleh</th><th scope=\"col\">Diverifikasi oleh</th></tr></thead><tbody>"
  "<tr data-search><th scope=\"row\">%s</th><td>%s</td><td colspan=\"2\">Held elsewhere: %s</td></tr>": "<tr data-search><th scope=\"row\">%s</th><td>%s</td><td colspan=\"2\">Dipegang di tempat lain: %s</td></tr>"
  "nothing": "tidak ada"
  "<h2>Problems</h2>": "<h2>Masalah</h2>"
  "<p>The specification has no errors, no warnings and no open questions.</p>": "<p>Spesifikasi ini tidak punya error, warning, maupun pertanyaan terbuka.</p>"
  "<p>Every error, warning and open question, in the order of the problems file, each with the file and line it is at and the entry it marks. The same problems are in problems.txt and problems.sarif.</p>": "<p>Setiap error, warning, dan pertanyaan terbuka, sesuai urutan file masalah, masing-masing dengan file dan baris lokasinya serta entry yang ditandainya. Masalah yang sama ada di problems.txt dan problems.sarif.</p>"
  "<p>Marked at <a href=\"#%s\">%s</a>.</p>": "<p>Ditandai di <a href=\"#%s\">%s</a>.</p>"
  "<p>Not at an entry of the specification; the file and line above say where it is.</p>": "<p>Bukan di entry spesifikasi; file dan baris di atas menyebut lokasinya.</p>"
  "<p>At <code>%s</code>, which this page does not show.</p>": "<p>Di <code>%s</code>, yang tidak ditampilkan halaman ini.</p>"
  "<svg class=\"er\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 %d %d\" width=\"%d\" height=\"%d\" role=\"img\" aria-label=\"Entity relationship diagram\">": "<svg class=\"er\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 %d %d\" width=\"%d\" height=\"%d\" role=\"img\" aria-label=\"Diagram relasi entity\">"
  "<text class=\"er-field\" x=\"%d\" y=\"%d\">and %d more</text>": "<text class=\"er-field\" x=\"%d\" y=\"%d\">dan %d lagi</text>"
  "Specification": "Spesifikasi"
