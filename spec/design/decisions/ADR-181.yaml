# yaml-language-server: $schema=../../../schema/specarch-fragment-design-0.3.schema.json
decisions:
  ADR-181:
    title: A page of kind content shows ordered blocks of headings, paragraphs, images and links, loads and sends nothing, and every UI generator reads its blocks the one way
    status: accepted
    date: "2026-10-24"
    context: |
      A page was a list, a form or a view of an entity's records, or a
      task that submits to an operation. A website is mostly pages of
      copy, images and links, which have no entity and no operation, so
      such a site was written by hand around the generated forms, and its
      copy had no place among the strings a translation covers. sections
      already means a form's or a view's fields in titled groups.
    decision: |
      - kind content, with blocks, an ordered list in which each block is
        exactly one of heading (level 1 to 6 and text), text (a
        paragraph), image (path and alternativeText) and link (page, a
        page of the specification, or href, an address outside it, and
        label). The page's title is the heading of level 1.
      - A content page has no entity, source, submit, fields, sections,
        columns, filters or actions, each refused at its key (page);
        blocks on another kind of page are refused (page). Its route
        takes no parameter, and a link opens a page that exists and
        whose route takes none (page, flow): no record gives a parameter.
      - href is https, http or mailto, by the schema.
      - With an accessibility target, an image without its
        alternativeText, a link without its label and a heading that
        skips a level below the one before it are refused
        (accessibility). The schema asks for neither the text nor the
        label, so a page is read and every missing one reported.
      - A flow's step on a content page takes event action with the
        label of a link, and leads where the link's page is. The derived
        cases are those of a page that opens: the golden case, and
        denied without its permission and, with a session, denied with
        expired session when it is not public. The model holds a link's
        page as a reference to that page.
      - The UI generators read the blocks through one function of
        internal/genui, which refuses at the block an image without its
        text, a link without its label and a link to no page or to a page
        whose route takes a parameter. specarch-gen-ui writes a content
        page as HTML alone, and refuses one that needs a permission;
        specarch-gen-ui-typescript writes it as a schema and ContentPage,
        every text a string key under <page>.blocks.<n>, behind the Guard
        when it needs a permission, with a warning that its text reaches
        the browser; specarch-gen-ui-swiftui refuses it by name and
        writes nothing for it. ui-components 1.9.0 names the content-page
        part for nextjs-carbon.
    why: |
      A kind of its own rather than optional parts on the other kinds,
      because the other kinds' rules (a required entity, a submit, fields
      of a body) are what a content page lacks, and one way to say one
      thing keeps sections to its meaning. A block holds one key so that
      its kind is the key a person writes, with no type field beside it.
      The image's text and the link's label are left optional in the
      schema and checked by the accessibility rule, because a draft
      without them is still read and every missing one is reported at its
      block, rather than the page refused as unreadable; the generators
      refuse what they cannot write as the design asks, since an image
      with an empty alt or an unlabelled link would pass a build and fail
      a person who cannot see it (WCAG 2.2, 1.1.1 and 2.4.4). WCAG does
      not forbid a skipped heading level outright; 1.3.1 asks that the
      structure the headings show can be read from the markup, and a
      skipped level tells a screen reader of a section that is not there,
      so the design holds headings to the order a person reads. The HTML
      standard runs a javascript: URL as script in the page, and a data:
      URL carries a document of its own, so an href from the
      specification is held to https, http and mailto; an address inside
      the site is a page, whose route the generator knows. Positional
      string keys follow the sections' <page>.sections.<n>: a block has
      no name, and naming every block would be a key the copy does not
      need; a reordered page moves its keys, which the project's
      translation file follows. A page that needs a permission cannot
      keep its text from a reader on the web: the text is in the files
      the browser loads, so the plain files, which have no guard, are
      refused, and the guarded Next.js page is written with the guard and
      a warning, since the guard still keeps the page from showing to who
      lacks the permission. The SwiftUI generator refuses rather than
      draws, because an app's copy screens are the app's own and no
      reference screen exists to check one against.
    consequences: |
      A site of copy, images and links is written in the specification,
      and each web generator writes it beside the generated forms, its
      copy translated with the rest of the strings. Assets as files, a
      page's metadata for search engines, a sitemap and a static setting
      (G1.4 and G1.7) are left for later; the image's path is the
      project's, and nothing checks that the file is there.
    cites:
      - source: wcag-2-2
        clause: "1.1.1, Non-text Content"
        says: "All non-text content that is presented to the user has a text alternative that serves the equivalent purpose."
      - source: wcag-2-2
        clause: "1.3.1, Info and Relationships"
        says: "Information, structure, and relationships conveyed through presentation can be programmatically determined or are available in text."
      - source: wcag-2-2
        clause: "2.4.4, Link Purpose (In Context)"
        says: "The purpose of each link can be determined from the link text alone or from the link text together with its programmatically determined link context."
      - source: whatwg-html
        clause: "Navigating to a javascript: URL"
        says: "Navigating to a javascript: URL evaluates the script it holds in the context of the page that is navigated."
    satisfies: [SA-42, SA-92]
