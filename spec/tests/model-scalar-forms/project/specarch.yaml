specarch: "1.0.0"
info: { title: Scalar forms, version: 1.0.0 }
theme:
  tokens:
    integers:
      decimal: { $value: [0, 1, -1, +1, -0, +0, 10, 9223372036854775807, 9223372036854775808, -9223372036854775808, -9223372036854775809, 18446744073709551615, 18446744073709551616, 100000000000000000000, 1-2, 12:30, "1,000"] }
