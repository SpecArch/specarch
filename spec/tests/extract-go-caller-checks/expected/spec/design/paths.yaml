permissions:
  invoices.delete:
    origin: stated
    cites:
      - {source: code, clause: 'core/server.go:26', says: 'DELETE /invoices/{invoiceId}, POST /invoices/{invoiceId}/archive and POST /invoices/{invoiceId}/void check invoices.delete with s.Require.'}
  invoices.read:
    origin: stated
    cites:
      - {source: code, clause: 'core/server.go:25', says: 'GET /invoices and POST /invoices/{invoiceId}/send check invoices.read with s.Require.'}
paths:
  /invoices:
    get:
      operationId: listInvoices
      permission: invoices.read
      callers: [reporting, archive]
      origin: stated
      cites:
        - {source: code, clause: 'core/server.go:25', says: 'Registers GET /invoices on a chi router; its handler is s.listInvoices, and it is checked by s.Require("invoices.read"), and gated by s.RequireAudience and s.RequireClients.'}
        - {source: code, clause: 'core/server.go:58', says: The handler of GET /invoices reads no path parameter by name.}
  /invoices/{invoiceId}:
    parameters:
      - {name: invoiceId, in: path, required: true}
    delete:
      operationId: deleteInvoice
      permission: invoices.delete
      via: [middleware]
      origin: stated
      cites:
        - {source: code, clause: 'core/server.go:26', says: 'Registers DELETE /invoices/{invoiceId} on a chi router; its handler is s.deleteInvoice, and it is checked by s.Require("invoices.delete"), and gated by s.RequireAudience, s.RequireCaller, s.RequireApplication and s.Audit.'}
