questions:
  # specarch-problem: question: open_question: (must, decision) Which entity holds the request of workflow waiver while it waits? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: Which entity holds the request of workflow waiver while it waits?
    kind: decision
    priority: must
    blocks: ['#/workflows/waiver/subject']
    decidedBy: system-owner
    why: BPMN has no element for the record the request is kept in; the subject is where a page reads where the request is.
  # specarch-problem: question: open_question: (must, decision) Workflow waiver is started by operation askWaiver, which the BPMN file names on its start event; the file does not declare it, so it waits for the tree that does. Is it that operation? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: Workflow waiver is started by operation askWaiver, which the BPMN file names on its start event; the file does not declare it, so it waits for the tree that does. Is it that operation?
    kind: decision
    priority: must
    blocks: ['#/workflows/waiver/trigger']
    decidedBy: system-owner
    names: askWaiver
    why: The file names the operation and not its method or path, so the workflow's trigger waits for the tree that declares it; specarch merge writes it once one does.
  # specarch-problem: question: open_question: (must, decision) Which permission does step lead of workflow waiver check? It cannot be the permission of the operation that starts the workflow. Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: Which permission does step lead of workflow waiver check? It cannot be the permission of the operation that starts the workflow.
    kind: decision
    priority: must
    blocks: ['#/workflows/waiver/steps/0/permission']
    decidedBy: system-owner
    why: BPMN names who may approve and not the permission the approval checks.
