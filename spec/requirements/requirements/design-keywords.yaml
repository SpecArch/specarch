# yaml-language-server: $schema=../../../schema/specarch-fragment-requirements-0.3.schema.json
requirements:
  SA-33:
    statement: A specification shall be able to say how sensitive a field is, that it is encrypted at rest and how it is still found, and that an entity is audited or deleted softly, and specarch validate shall check each against the design and derive the cases a soft delete implies.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A credential field that a response can carry and that is not writeOnly is reported as sensitivity_exposed; a personal field in the response of a public operation is warned about.
      - A lookup on a field that is not encrypted, and an encrypted key or unique field without lookup hash, are reported as at_rest.
      - An audited entity that declares createdAt, createdBy, lastModifiedAt or lastModifiedBy, and one with soft deletion that declares deleted, is reported as audited.
      - A list of an entity with soft deletion gets the case deleted record not listed, and a read by id the case deleted record read, answered as not found.
    verification: test
    needs: [NEED-1, NEED-2]
    why: Which fields are personal, which are encrypted and whether a delete can be undone are facts a client, a tester and an auditor need; written in the design, they are checked where a mistake would leak data, and the tests follow from them.
  SA-34:
    statement: A specification shall be able to say that an operation answers a page of an entity's records with the fields it searches, filters and sorts by and its page size, the limits a client keeps to, and the catalogue of problem types its refusals answer with, and specarch validate shall check each against the design and derive the cases each implies.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A list naming a field its entity lacks, an encrypted field to search or sort by or to filter by without a hash, or a default page above the maximum is reported as list_of.
      - A rate over no time, or with a burst below its requests, is reported as limits.
      - A response naming a problem type that is not under errors or has another status, and a 4xx or 5xx response that names none once errors exist, is reported as problem.
      - A list gets the cases page beyond last, page size above the maximum, and sort and filter outside the lists; a limit gets request too large and rate exceeded.
    verification: test
    needs: [NEED-1, NEED-2]
    why: Which fields a client may filter and sort by, how large a page or a request may be, and what a refusal looks like are part of the interface; a client that guesses them is refused, and a tester who does not know them misses the cases at their edges.
    cites:
      - source: rfc-9457
        clause: "3"
        says: "A problem details object carries a type URI that identifies the problem type, a short human-readable title, and the HTTP status code; a client branches on the type."
  SA-35:
    statement: A specification shall be able to declare the jobs the system runs on its own, with what starts each, the role it acts as, what it reads, writes, calls and publishes, and how it retries, and the menus that lead to its pages; specarch validate shall check each against the design, and a job shall be a subject of tests with the cases it implies.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A job acting as a role the specification lacks, reading or writing an entity it lacks, or consuming a message no channel declares is reported as job; a menu entry opening a page that does not exist is reported as menu.
      - A test may name a job as its subject, and a job gets the cases runs twice, a dependency failing or timing out for each it calls, and an item failing every try when it retries.
    verification: test
    needs: [NEED-1, NEED-5]
    why: What runs at night or on a queue is the part of a system nobody watches, and the part a test plan forgets; written in the design, its tests follow from it like an operation's.
  SA-47:
    statement: A specification shall be able to declare workflows, requests that finish after people approve them, as a sequential subset of BPMN 2.0, with the operation that starts each, the entity that holds the request while it waits, and approval and operation steps in order; specarch validate shall check each against the design, and a workflow shall be a subject of tests whose cases include the requester approving their own request.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A trigger that is not an operation or does not answer 202, a subject that is not an entity, an approver that is not a role or does not grant the approval's permission, an approval's permission that is the trigger's, a role granting both the trigger's and an approval's permission while a separation-of-duties set holds the pair, an operation step naming no operation, an escalation to a step that is not a later approval, an approval deadline of zero and two steps with one name are each reported as workflow, and an approval's undeclared permission as permission_undeclared, the same in both builds.
      - A test may name a workflow as its subject, and a workflow gets the approved path as its golden case, and the cases refused at each approval, each deadline passing, the requester approving their own request, which is critical whatever the harm, and an approval by someone without its permission.
      - The techspec draws each workflow as a flowchart of its steps, with each deadline on the edge it takes.
      - A form or task page that submits to a workflow's trigger acts on the 202 answer, a form with its onSubmitted and a task under 202, with a message that says the request waits; a page without that event or message is refused as workflow, and its derived case is the pending message shown.
      - A list page may be the inbox of a workflow's approval step; one that is not a list, names no workflow or no approval step of it, lists another entity than the workflow's subject or checks another permission than the step's is refused as workflow, the same in both builds.
      - A workflow may name the channel messages it publishes when it ends, as channel/Message; one that does not exist is refused as emits.
    verification: test
    needs: [NEED-1, NEED-5]
    why: An approval that lives only in an external engine's configuration, or in prose, cannot be checked against the roles and permissions of the design, and the rule most worth testing, that nobody approves their own request, is the one a hand-written test plan forgets.
  SA-36:
    statement: specarch generate openapi shall write, through a plug-in, the OpenAPI 3.1 document of a specification in the standard dialect, with the problem catalogue as the error responses and every list expanded through the paginated-list idiom that applies, so that a standard OpenAPI code generator can write the server interface from it.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - The document of the library lending example parses, is OpenAPI 3.1.0, pages its list of loans by the idiom's names in the idiom's envelope, answers its refusals with RFC 9457 problem documents naming their types, carries an audited entity's audit fields as read-only, and carries SpecArch's own keywords as x-specarch- extensions.
      - A list by a method other than GET takes its paging in its request body, and a body that is a reference to an entity is reported.
      - Each view is a read-only schema under components, its entity's fields and the ones it adds, a path with the type of the field it ends in and null allowed when a relation on the way may have no record or the field is not required, a count as a 64-bit integer, rows as an array of the relation's target; a list over a view filters and sorts by the view's fields, in both dialects.
      - Each implementation file in a plug-in's request carries the idioms it uses, with the content of the idiom that applies and the project's override.
    verification: test
    needs: [NEED-2, NEED-3]
    why: The server interface of a Go service is written by a standard OpenAPI generator in strict mode, so the document is where the design reaches the code; written by hand, it drifts from the design on the first change.
  SA-37:
    statement: specarch generate sql shall write, through a plug-in, the forward migrations of a specification's schema in PostgreSQL, SQL Server, Oracle or MariaDB, every column type through the type-rendering idiom of the target's dialect, with a snapshot of the schema beside them, and shall refuse what the dialect cannot hold.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - The library lending example renders on each dialect with the type-rendering rows, Oracle text as VARCHAR2 with character semantics and wider text as CLOB, an encrypted field as its ciphertext type with a hash column the unique constraint is on, the enum and boolean checks, the audit and deleted columns, the check constraints translated, and ON DELETE as the dialect writes it.
      - A key or unique text column without a maxLength of at most 255, and a check whose function SQL is not given, are refused.
      - A unique constraint with a where is a partial unique index on PostgreSQL and a filtered index on SQL Server, whose filter holds only fields compared with values joined with &&; Oracle and MariaDB, which have no such index, refuse it, and so does SQL Server for a condition its filter cannot hold.
      - A second run on an unchanged schema answers only the snapshot.
      - Each plug-in request carries the files already in the output folder.
      - Each view becomes a SQL view after the tables and their foreign keys, listing its entity's columns, joining each relation a path follows with a LEFT JOIN, and counting a relation to many in a subquery that leaves out softly deleted records, with a 64-bit count on every dialect; rows are no column, and a view that adds only rows becomes no SQL view; on SQL Server the statement runs through EXEC, since CREATE VIEW must start a batch. An added field named like an audit, deleted or hash column, and a path ending in a field only written, are refused.
    verification: test
    needs: [NEED-2]
    why: The schema is where a design reaches the data, and four engines read one design four ways; the rows say each way once, and the migration written from them cannot drift from the design.
  SA-38:
    statement: specarch generate sql shall write the migration of what changed since the last snapshot as new files only, what only adds in an expand migration and what can lose data in a contract migration of its own that the target's settings must allow, and shall refuse a change it cannot tell from a rewrite.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A new nullable column, a wider text column, a new table with its foreign key, and a new enum value are written in the next expand migration, and the earlier migrations are left as they are.
      - A dropped column, a narrower column and a removed enum value are refused until destructive is true in the sql target's settings, and then written in a contract migration of their own.
      - A new required column without a default, a changed type, a changed key and a changed default are refused with what to do instead.
      - A view that changed, or that reads an entity or an enum that changed, is dropped at the top of the expand migration and created at its end, and again around a contract migration; a view that came is created and one that went is dropped, in the expand migration, since a view holds no rows.
    verification: test
    needs: [NEED-2]
    why: A migration that has run on a database is history; writing the next one from the design, and refusing what could lose data unless it is asked for, is the expand and contract pattern kept honest by the tool.
  SA-39:
    statement: specarch generate openapi shall write, for an openapi target of the dxlib dialect, the document dxlib's OpenAPI reader binds, saying only what dxlib's server enforces and listing on each field what it does not.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - Every operation is a POST at /<operationId> with all of its parameters in one JSON body, carries its endpoint type and its privileges, and answers a refusal with dxlib's error body named by its problem type and a list in dxlib's list envelope.
      - Every field carries its dxlib type, no field carries a constraint dxlib's validator does not apply, and each such constraint is listed under x-specarch-unenforced on the field.
      - dxlib's own reader reads and validates the document, where a dxlib checkout is at hand.
    verification: test
    needs: [NEED-2]
    why: A service on dxlib binds its handlers to the document at start, so the document is the route table; written from the design, the route table cannot drift from it, and the list of unenforced constraints says where the service checks what the library does not.
  SA-40:
    statement: specarch generate go-dxlib shall write, for a go-dxlib target, one Go file a service on dxlib compiles beside its own code, holding the tables, a handler per operation, the privileges, roles and menu as data, and a task per repeating job.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - Each entity is a dxlib table, a DXTable when audited or softly deleted and a DXRawTable otherwise, with the search, order and filter fields its lists allow.
      - An entity listed through a view pages through it as the table's list view, named as specarch-gen-sql names the view; an entity listed through two views, or both directly and through a view, is refused, since dxlib reads a table through one list view.
      - Each operation has a handler registered by its operationId that reads every parameter with dxlib's typed getters, checks every constraint the dxlib dialect lists as unenforced, and runs dxlib's standard list, create or read operation where the design gives one, and otherwise calls a body the service writes.
      - Each permission and role is a seed row, public excluded, each menu entry is a menu item, and each job that repeats at an interval is a dxlib task calling a job function the service writes; any other job is reported and left out.
      - The file compiles against dxlib, where a dxlib checkout is at hand.
    verification: test
    needs: [NEED-2]
    why: The handlers, tables and seeds of a dxlib service follow from its design and its dxlib document; written by hand they drift from both, and the constraints dxlib does not enforce are easy to miss.
  SA-41:
    statement: A specification shall declare a read model under views, an entity's row with fields read through its relations, counts of its related records and the rows of a one-to-many relation added, which is never written, and specarch validate shall check every path, count, rows and use of a view.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - A view names the entity it reads from, and adds properties that are each a path through many-to-one or one-to-one relations ending in a field, a count of a one-to-many or many-to-many relation, or the rows of a one-to-many relation; it carries every field of its entity besides.
      - A path through a relation that does not exist or does not lead to one record, a count of a relation that does not lead to many, rows of a relation that is not one-to-many, a property that repeats a field of the entity, and a view named like an entity are refused (view).
      - A list may read from a view without rows, with its whitelists naming the view's fields, and a list over a view with rows is refused (list_of); a view under a request body is refused, since a view is never written.
      - The techspec shows each view with the source and the type of every added property.
    verification: test
    needs: [NEED-2]
    why: Every list page shows a row with names and counts joined onto it; written by hand, the join drifts from the relations it follows, and a client cannot tell from the document which fields it may filter by.
  SA-42:
    statement: A specification shall define the behaviour, structure and rules of a user interface without naming a stack, the events of a page and where each leads among them, and specarch validate shall check them.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - A form's onSubmitted, a list's onSelect and an operation action's then lead to a page with exactly that page's route parameters, each from a field of the page's entity, and may carry a message, a full sentence; an event on a page or action that does not raise it, a page that does not exist, a route parameter missing or not the target's, a field the entity lacks and a message that is not a sentence are refused (flow). A list's action of kind navigate that opens a page whose route takes a parameter gives each one under with, from a field of the row, exactly as an event does, and is refused the same way at the action (flow); with on another page's action is refused (flow).
      - A flow names a task across pages, its actor and its steps, each a page and the event on it that leads to the next step's page; an actor that is not a role or may not open a page or take an action on the way, a page that does not exist, an event the page does not raise and an event that leads elsewhere are refused (flow). A test may name a flow as its subject.
      - A page may declare its states, each with a message in a full sentence; once it does, a list has empty, a list with filters has filteredEmpty, and every problem type the page's operations answer has a message under failed or a default, and a failed state of a form or a task may name the field it is about; anything else is refused (state). Each state is a derived case of the page.
      - A list may name compactColumns, the columns a compact screen keeps, each one of its columns; on another page, or naming another column, it is refused (page).
      - A specification may name its accessibility target, WCAG 2.2 at level A, AA or AAA; with it, a field a page shows or filters by without a title and two actions of a page with one label are refused (accessibility), and the techspec lists the criteria of the level the design settles or leaves to the generator, with who meets each.
      - A theme holds design tokens in the W3C Design Tokens format, modes and pairs of colours; a token without a type or with a value not of its type, a colour outside srgb, a hex that is not its components, a broken or circular alias, a mode naming no token, a number not written in decimals, and a pair below the contrast WCAG 2.2 asks of its use at AA, or AAA when that is the target, in any mode, are refused (theme), and the techspec lists the tokens and each pair's contrast.
      - A form or a view gives its fields once, as fields or as titled sections in reading order; neither, both, a field in two sections and sections on a list are refused (page).
      - A task page submits to an operation without loading a record. It has no entity, source, columns or filters, its fields are properties of the operation's request body and include every required one, and its onSubmitted is keyed by the success statuses the operation declares, each leading to a page whose route parameters come from that response's body; anything else, and an operation that takes no body, is refused (page, flow). A flow's step that submits it leads on when any answer leads to the next page. Its derived cases are a golden case per success the operation answers and a red case per problem type.
      - A form or a task page may check rules across the fields it shows, each an expression giving true or false with a message in a full sentence, and name fields a person types twice; on a task the fields are the properties of the request body it shows. Checks or fields entered twice on any other kind of page are refused (form_field), and so are a check's field or a field entered twice that the page does not show, a message that is not a sentence, and an expression that does not parse, names what the page does not show or does not give true or false (form_field and the expression rules), and each way a check breaks and each field entered twice differently is a derived case of the page.
      - The techspec's screen-flow diagram draws every event, each answer of a task page under its status, and each flow is drawn as its steps.
    verification: test
    needs: [NEED-2]
    why: Left out of the design, where a person goes after each step is decided by whoever builds the screen, so screens of one application drift apart, and no reviewer sees the flow until it runs.
  SA-43:
    statement: specarch generate ui shall write, through a plug-in, the list pages of a specification for the web in plain JavaScript, with no package, bundler or build step, so that the screens follow the design's pages, events, states, accessibility and theme.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - Each list page becomes an HTML page and an ES module that reads its list a page at a time by the paginated-list idiom, filters by the source operation's query parameters, hides on a compact screen the columns compactColumns leaves out, runs its operation actions with their confirmation and message, and shows its states in a status line announced without moving focus.
      - Every event of the screens is declared once in events.js as an UPPERCASE constant with its payload, and each component subscribes where it is created.
      - The theme's tokens become CSS custom properties with the dark mode under prefers-color-scheme, and the target's settings say which tokens play which part.
      - A target that is not platform web in plain-javascript, one without a language, a filter that is neither a query parameter of the list's operation nor filterable in its listOf, a list whose path takes a parameter or that does not page, a service whose API is in the dxlib dialect, two events with one name, and a token name that cannot be a custom property are refused; forms, views, navigation, actions that take a request body and modes other than dark are reported and left out.
      - The library lending example's loans list, written by hand before the generator, was reproduced by it apart from its header.
    verification: test
    needs: [NEED-2]
    why: A screen written by hand drifts from the pages, states and messages the owner reviewed; written from them, it says what the design says, and a change to the design reaches the screen on the next run.
  SA-52:
    statement: specarch generate ui shall write, through specarch-gen-ui-typescript, the task pages of a specification for the web on Next.js's app router and IBM's Carbon design system, from an implementation file in TypeScript, so that sign-in and the forms like it follow the design's fields, checks, refusals and events, drawn by the components the ui-components idiom names.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - Each task page becomes a schema file under app/ at its route that holds data only, one object literal typed with satisfies by the task-page part's schema type, and a page.tsx that builds the texts of the schema, hands both to the part's component with the routes its events lead to, and reads returnTo; the keys of the schema are the names of the ui-components idiom, the project's override first.
      - A field is the request body's property, of type string, drawn by the text, email or password field part by its format, and checked before the request is sent by its required, minLength, maxLength and pattern; a password field shows those rules under it. A check across fields becomes a rule in the schema's data, of names, constants, comparisons, &&, ||, ! and size.
      - A refusal is shown under the field the failed state names, or above the form, the default failed state for a problem the page names no message for; each success the operation answers leads to its page with its route parameters taken from the answer, and its message is announced there without moving focus. An event to another task page hands on returnTo, the page sign-in was asked for from, and an event to any other page gives way to it when the browser reads it as a path of the same origin.
      - The components that read the schemas are written once under screens/ on plain Carbon, and every text once in strings.ts in the target's language, each a string key the schemas name, typed so that a key without an entry fails tsc.
      - A target that is not platform web in nextjs-carbon, a file not in TypeScript, a target with no language, a field that is not of type string or holds an enum or a format other than email and password, fields given in sections, fields entered twice, actions, enabledBy, a permission other than public, a check with any other operator or function, a refusal the operation does not answer, a success the operation answers with no event, and a file in the output folder this plug-in did not write are refused; other page kinds are reported and left out.
      - The library lending example's generated screens build with tsc --noEmit, its lint with no warning and next build, and generated over its sign-in and second-factor screens written by hand they differ only by the header.
    verification: test
    needs: [NEED-2]
    why: The project that asked builds its screens on Next.js and Carbon, and a screen written by hand there drifts from the design as one in plain JavaScript does; sign-in comes first because it stands in front of every other screen.
  SA-53:
    statement: specarch generate ui shall write, through specarch-gen-ui-typescript, the list pages of a specification on Next.js and Carbon, the menu, and a guard that opens each page only to someone who holds its permission, from one permission each, with a derived test per page and of the menu, drawn through the ui-components idiom a project may override.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - Each list becomes a schema and a page.tsx at its route; the service pages, sorts by the fields listOf makes sortable, searches when listOf names searchable fields, and filters by the operation's query parameters or, through the paginated-list idiom's filter name, by the fields listOf makes filterable, an enum as a list of its values and a date as a date. The list has a column picker, a refresh that keeps its page, and keeps its compactColumns on a compact screen.
      - An action of kind navigate that opens a page whose route takes no parameter is a button of the list's toolbar, and one whose page's route takes parameters is offered on a row while its when holds for the row and its permission is held, and opens the page with its route filled from the row's fields its with names; one of kind operation is offered on a row while its when holds for the row and its permission is held, runs after its confirmation, sends the reason it names as the only property of the request body, takes its path's parameters from the row's fields or its primary key, and shows its message or the refusal its failed states give; onSelect opens its page from the row's first column.
      - application.ts holds how the session is read, from the operation, the properties and the sign-in page the ui target's settings name under session, and the menu, each entry with the permission of the page it opens. The guard and the menu read one decision, so a menu entry is shown only to someone its page opens to; the guard sends someone signed out to sign in with returnTo, shows anyone else without the permission the refusal, and never makes the page, which so calls no operation.
      - Each list that needs a permission gets a derived test that it is refused to someone signed in without it, sends someone signed out to sign in and opens to someone who holds it, and the menu a derived test that no entry is shown without its page's permission, run by node's test runner.
      - A part of the idiom that names import draws through that package's component and schema type, so a project's override renders its lists through its own library; two implementation files of one stack with their own outputs are two front ends, each generated in a run of its own.
      - A page, a menu or a menu entry marked ownedBy is left out; a list whose source is not a GET, whose path takes a parameter or that does not page, a filter the operation cannot take, a row action whose request body holds more than its reason or that leads to a page, a row's action that opens a page after a confirmation, enabledBy, and a list that needs a permission when the settings name no session are refused.
      - The library lending example's loans list opens the fee-waiver form from a returned loan's row. Its members, loans and fee waivers lists build on plain Carbon and through the stub of a fictional library, @acme/screens, their derived tests pass, and generate --check reports a schema edited by hand.
    verification: test
    needs: [NEED-2]
    why: A menu entry that opens a page its reader is refused is reported as a broken feature, and a list is most of what a back-office screen is; the guard and the menu read one permission so they cannot drift apart.
  SA-54:
    statement: specarch generate ui shall write, through specarch-gen-ui-typescript, the forms and views of a specification on Next.js and Carbon, each field drawn by its type and format or picked from a list, checked by its keywords and the page's checks across fields, read-only or hidden by its conditions, and started by a hook the project writes where the ui target's settings name one.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - Each form and each view becomes a schema and a page.tsx at its route behind the guard, with the derived test that it is refused without its permission; a route's parameters are handed to the page, and fill the path of the operation a form or a view loads its record from.
      - A form's fields come in its sections, each under its title, laid out as the ui target's settings.layouts say, on one page, as tabs or as steps; a field is drawn by the part of its type and format (text, text area, email, password, number, date, an enum's values, a check box), or by the lookup part when the page picks it, reading its source a page at a time and searching through the service when listOf names searchable fields.
      - A field is checked before the request is sent by its keywords and its second entry when the page asks for it twice; readOnly, readOnlyWhen and hiddenWhen and the page's checks become rules over the record, of names, constants, comparisons, &&, ||, ! and size, a hidden field neither checked nor sent; the request sends the fields its body takes, and an idempotency key in the header the operation names, kept for a retry of a request that got no answer and chosen anew after an answer, since a key used again is answered as its first request was.
      - A field the ui target's settings.hooks name starts with the value of the hook of its name, which page.client.tsx imports from page.hooks.ts beside the page, a file the project writes, so a missing hook fails tsc.
      - A view shows its sections read-only, a field hidden while its condition holds, and offers the actions that open a page to whoever holds their permission.
      - A field holding a schema is a nested section of its parts under the field's title, and a field holding a list of them a repeating group of items added and removed between the body's minItems and maxItems, each part drawn and checked as a field is; an optional value is left out while none of its parts is given and has its required parts required once one is; a view shows a value's parts and a list's items.
      - A field of another type or format, a hook or a second entry on a field holding a value, a value among a child row's fields or in a list's column, a schema met again inside itself, a required property of the request body the form does not show, a field the body does not take that is not read-only, a rule that orders a decimal or uses any other operator or function, a hook or a layout the settings give a page that is not a form or a field it does not show, and a layout other than page, tabs or steps are refused.
      - The library lending example's loan form picks the member and the book, checks that the copy is due after the day it is lent, and starts that day with a hook; the member's form takes an address and phone numbers, which the member's view shows; it and the member's form and view build on plain Carbon and through the stub of @acme/screens.
    verification: test
    needs: [NEED-2]
    why: Forms and views are the rest of a back-office screen, and a form that checks less than the service refuses, or a different rule than it, sends the person a refusal they could have been spared; a hook keeps what the design cannot say in a file the generator never overwrites.
  SA-55:
    statement: specarch generate ui shall write, through specarch-gen-ui-typescript, a form's child rows, the actions of a view that run an operation with the confirmation and the reason they ask for, a form that starts an approval, and the inbox of an approval step, on Next.js and Carbon.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - A form's child rows are sent as the array of its request body named for the relation, each row with the fields the array's items take; a field the items do not take is shown on the loaded rows only, and every property the items require is shown.
      - A form that loads its record shows the loaded rows read-only, read from the property of the view its source answers that adds the relation's rows, and sends only the rows added; the rows added are checked by their fields' keywords, at least as many as the body's minItems and no more than the maximum with the loaded ones.
      - A view's action that runs an operation is offered while its rule holds for the record and its permission is held, asks its confirmation with the reason it requires, sends the reason as the body's property it names, and on a success says its message and reads the record again.
      - A form whose submit operation is a workflow's trigger acts on the 202 answer, its event the page's pending state; the inbox of an approval step is a list with its permission and its row actions.
      - Child rows whose body has no array of the relation's name, a loaded form whose source's answer carries no rows of the relation, loaded rows that are not locked, and an action that leads to another page once it succeeds are refused at their entry.
      - The library lending example's member lends copies as rows under the member's loans, deactivates from the member's view with a reason, asks for a fee waiver that waits for approval, and the desk supervisor approves or refuses it with a reason from the inbox; all build on plain Carbon and through the stub of @acme/screens.
