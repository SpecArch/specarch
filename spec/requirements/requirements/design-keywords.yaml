  SA-56:
    statement: specarch generate ui shall write, through specarch-gen-ui-typescript, the server routes that forward the operations the pages call, the strings in the specification's language and every translation the settings name, and the theme as Carbon's tokens in light and dark, on Next.js and Carbon.
