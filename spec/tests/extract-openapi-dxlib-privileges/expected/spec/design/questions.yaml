questions:
  # specarch-problem: question: open_question: (must, decision) POST /auditLoan checks the privilege Loans.Audit, which is not a permission name (lower-case words joined by dots), nor a privilege in capitals that the rule of ADR-076 maps to one. Which permission should it check? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: POST /auditLoan checks the privilege Loans.Audit, which is not a permission name (lower-case words joined by dots), nor a privilege in capitals that the rule of ADR-076 maps to one. Which permission should it check?
    kind: decision
    priority: must
    blocks: ['#/paths/~1auditLoan/post/permission']
    decidedBy: system-owner
    why: The meta-model names a permission in lower-case words joined by dots, and renaming the privilege by a rule of the reader's own would write a check the code does not make.
  # specarch-problem: question: open_question: (must, decision) POST /cancelLoan checks the privileges loans.write and loans.supervise: dxlib lets a caller holding any one of them through, and an operation checks one permission. Which permission should it check? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: 'POST /cancelLoan checks the privileges loans.write and loans.supervise: dxlib lets a caller holding any one of them through, and an operation checks one permission. Which permission should it check?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1cancelLoan/post/permission']
    decidedBy: system-owner
    why: An operation names one permission; choosing one of dxlib's would write a check the code does not make.
  # specarch-problem: question: open_question: (must, decision) POST /health checks the privilege public, which dxlib grants only to a role that holds it, while public in a specification means open to everyone. Which permission should it check, or is it meant to be open? Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: POST /health checks the privilege public, which dxlib grants only to a role that holds it, while public in a specification means open to everyone. Which permission should it check, or is it meant to be open?
    kind: decision
    priority: must
    blocks: ['#/paths/~1health/post/permission']
    decidedBy: system-owner
    why: Writing the privilege public as the permission public would open the operation to everyone, which the code does not do.
  # specarch-problem: question: open_question: (must, decision) POST /listBooks checks no privilege: its x-dxlib-privileges is empty or absent, so dxlib lets through every caller its middleware admits, and its middlewares are example.com/lending/api.RequireSession and example.com/lending/api.Audit. Is it meant to be open to everyone (public), or which permission should it check? Decided by system-owner. Answer with a decision record that names Q-4 under answers. [Q-4]
  Q-4:
    question: 'POST /listBooks checks no privilege: its x-dxlib-privileges is empty or absent, so dxlib lets through every caller its middleware admits, and its middlewares are example.com/lending/api.RequireSession and example.com/lending/api.Audit. Is it meant to be open to everyone (public), or which permission should it check?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1listBooks/post/permission']
    decidedBy: system-owner
    why: dxlib checks no privilege on an endpoint that names none, and whether a caller must sign in is decided by its middlewares, which are code; an open endpoint is never written as public without the owner's word.
  # specarch-problem: question: open_question: (must, decision) Which permission does POST /renewLoan check? The document gives it the security mutualTLS. Decided by system-owner. Answer with a decision record that names Q-5 under answers. [Q-5]
  Q-5:
    question: Which permission does POST /renewLoan check? The document gives it the security mutualTLS.
    kind: decision
    priority: must
    blocks: ['#/paths/~1renewLoan/post/permission']
    decidedBy: system-owner
    why: A security scheme says how a caller proves who it is, not what it may do, so the permission is asked and never written as public.
  # specarch-problem: question: open_question: (must, decision) POST /runReport checks the privilege REPORT_RUN, which gives the permission report.run, and so does REPORT.RUN, which dxlib checks as another privilege. Which permission should it check? Decided by system-owner. Answer with a decision record that names Q-6 under answers. [Q-6]
  Q-6:
    question: POST /runReport checks the privilege REPORT_RUN, which gives the permission report.run, and so does REPORT.RUN, which dxlib checks as another privilege. Which permission should it check?
    kind: decision
    priority: must
    blocks: ['#/paths/~1runReport/post/permission']
    decidedBy: system-owner
    why: Two privileges dxlib tells apart would become one permission, which would write a check the code does not make.
