  # specarch-problem: warning: acceptance_missing: requirement LENDINGRULES-3 has no acceptance criteria, so no test can show it is met; add acceptance with one verifiable sentence per criterion [acceptance_missing@requirements/requirements.yaml#/requirements/LENDINGRULES-3]
  # specarch-problem: warning: requirement_unsatisfied: no design element satisfies requirement LENDINGRULES-3; add satisfies: [LENDINGRULES-3] to the entity, operation, command, page, algorithm or decision that meets it [requirement_unsatisfied@requirements/requirements.yaml#/requirements/LENDINGRULES-3]
