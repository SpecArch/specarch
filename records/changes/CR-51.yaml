decision:
  by: specification-author
  date: "2026-11-05"
  outcome: approved
  why: "Intent phase 1 (ADR-244, SA-135 to SA-139): problem, goals, outOfScope and qualityGoals are optional requirements-stage keys of the 1.0 schemas; validate warns problem_missing, goal_unmeasured, goal_unserved, need_without_goal, scope_conflict and quality_goal_rank, gated as stakeholders_unconfirmed is; document intent writes intent.md and the techspec, traceability and progress documents show the intent where it is stated; gaps --next asks for the intent first; init takes --problem, --goal and --out-of-scope and, on a terminal with none given, asks the three questions. SpecArch's own specification states its intent, and its needs name the goals they serve. Every key is optional and every new rule a warning, so a specification clean on 1.5.0 gets no new error: validate on v1.5.0's own tree gives 0 errors and four problem_missing warnings with this build. init on a pipe or in a script writes what it wrote before; on a terminal it now asks before writing, which specarch diff counts as a major change to what init writes. The owner decided on 2026-11-05 to release it as 1.6.0, a minor step."
release: 1.6.0
status: released
