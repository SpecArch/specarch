environments:
  production:
    description: The host whose services the watcher keeps current.
    runBy: vendor

configuration:
  registryAddress:
    description: The address of the registry the watcher asks for new releases.
    secret: false
    schema: { type: string, format: uri }
  registryToken:
    description: The token the watcher reads the registry with, from the environment file only root reads.
    # specarch-problem: warning: secret_unprotected: setting registryToken is a secret with no rotation, so a value that leaks stays good until someone notices; add rotation, the longest time one value is used before it is replaced, such as P90D [secret_unprotected@deployment/configuration.yaml#/configuration/registryToken/secret]
    secret: true
    schema: { type: string }
  logLevel:
    description: How much the watcher logs.
    secret: false
    schema: { type: string, enum: [error, info, debug] }
