# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.4.0/schema/specarch-design-0.1.schema.json
specarch: "0.1"
info:
  title: Lending desk API
  version: 0.1.0
  description: |
    The OpenAPI document openapi.yaml: every operation and component schema is a clause, every operation is written under its path citing it, and every component schema of type object is an entity. What the document does not say is a question.
  tracksOrigin: true
stages: [requirements, design]
sources:
  openapi:
    kind: document
    title: Lending desk API
    edition: "1.0.0"
    url: https://example.invalid/lending-desk-api.yaml
    clauses:
      - {clause: /paths/~1loans/post, title: POST /loans}
      - {clause: '/paths/~1loans~1{loanId}~1renew/post', title: 'POST /loans/{loanId}/renew'}
      - {clause: '/paths/~1loans~1{loanId}~1return/post', title: 'POST /loans/{loanId}/return'}
      - {clause: /paths/~1members/post, title: POST /members}
      - {clause: '/paths/~1members~1{cardNumber}~1loans/get', title: 'GET /members/{cardNumber}/loans'}
      - {clause: /components/schemas/Loan, title: schema Loan}
      - {clause: /components/schemas/Member, title: schema Member}
