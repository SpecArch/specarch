stakeholders:
  # specarch-problem: warning: stakeholders_unconfirmed: the stakeholder list is not confirmed complete, so a role with an interest in the system may still be missing from it; once it is complete, add stakeholdersComplete with by, the role that confirms it, and date, and name under source the declared source that records the confirmation, when there is one; the key ends this warning, the banner on every generated document and the warning of specarch approve [stakeholders_unconfirmed@requirements/requirements.yaml#/stakeholders]
  # specarch-problem: warning: unheard: host-owner was never heard: no communication record names it, no session lists it present, no interview lists it and no decision is by it, while requirement RW-1, requirement RW-2 and requirement RW-3 rely on it; hear it before acceptance, and record what it said with specarch log; no communication, session or test session record is kept yet, so start by logging the first conversation [unheard@requirements/requirements.yaml#/stakeholders/host-owner]
  host-owner:
    description: The person who runs the host and its services.

needs:
  NEED-1:
    statement: The host's services run their latest release without a person installing each one.
    stakeholders: [host-owner]
    status: accepted

requirements:
  RW-1:
    statement: The release watcher shall install a new release of a service within two minutes of its publication in the registry.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A release published while the watcher runs is installed within two minutes.
    verification: test
    needs: [NEED-1]
  RW-2:
    statement: The release watcher shall come back after a crash, and a person shall be told when it stops for good.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - After a crash the watcher runs again within five seconds.
      - After five crashes within ten minutes it stays stopped and the monitor watcher-running alerts.
    verification: test
    harm: [availability]
    needs: [NEED-1]
  RW-3:
    statement: The host shall keep the last three releases of each service and no more.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - After the nightly prune each service has at most three releases on disk.
    verification: test
    needs: [NEED-1]
