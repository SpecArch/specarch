specarchRecord: "1.0.0"
kind: change
id: CR-6
title: Keep each proposal for the specification as an idea record with its status, decision and what it became, checked by the validator and named by specarch decision why and rests
raisedBy: specification-author
raised: "2026-10-27"
phase: development
type: perfective
urgency: normal
reason: A proposal raised in a conversation, a table, an example or a review was lost once taken or turned down, so a reader of a decision could not see the idea it came from, nor an author the ideas still open; the specification needs each one kept beside it as a record, checked, and named on the decision it became.
affects:
  adds:
    - SA-101
    - "#/decisions/ADR-196"
    - "#/tests/validate-idea-decision"
    - "#/tests/validate-idea-question"
    - "#/tests/validate-idea-ref"
    - "#/tests/validate-ideas-valid"
    - "#/tests/decision-why-ideas"
    - "#/tests/decision-rests-ideas-json"
  changes:
    - "#/enums/Rule"
    - "#/commands/validate"
    - "#/commands/decision why"
    - "#/commands/decision rests"
impact: minor
decision:
  by: specification-author
  date: "2026-10-27"
  outcome: approved
  why: The idea kind is one more kind in the 1.0 record schema and two rules (idea_decision, idea_question), and validate, decision why and decision rests read records/ideas/ beside the specification as well. specarch diff calls those three commands' change major, since each change is the description of an entry of their reads, a list whose items have no name, and the rule for such a list is cautious on purpose so that a person decides. It is not breaking. A 1.2.0 tree with no records/ideas/ is read, checked and printed as before, and one that held an idea file got an error from 1.2.0 for a kind it did not know. So no file that is clean on 1.2.0 gets a new error, nothing a 1.2.0 run prints or writes changes, and a minor release carries it (ADR-186, ADR-196). specarch diff's version error for this release is named in the history file.
release: 1.3.0
status: released
