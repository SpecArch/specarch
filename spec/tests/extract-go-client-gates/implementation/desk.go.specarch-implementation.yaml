specarchImplementation: "0.1"

info:
  title: The desk in Go
  version: 0.1.0

implements:
  file: ../specarch.yaml
  version: 0.1.0

stack:
  language: { name: Go, version: "1.26" }

bindings:
  http:
    framework: github.com/go-chi/chi/v5
    permissionChecks:
      - package: desk
        function: Server.Require
        permissionArgument: 1
    clientChecks:
      - package: desk
        function: Server.RequireClient
    signatureChecks:
      - package: desk
        function: VerifySignature
      - package: desk
        function: Server.Require
