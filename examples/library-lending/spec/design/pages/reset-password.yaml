# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-0.1.schema.json
pages:
  reset-password:
    kind: task
    title: Set a new password
    route: /reset-password
    permission: public
    submit: resetPassword
    fields: [code, newPassword, confirmPassword]
    checks:
      confirmation-matches: { expression: confirmPassword == newPassword, message: The two passwords are not the same., field: confirmPassword }
    states:
      failed:
        reset-code-refused: { message: "The reset code is wrong, used or expired. Ask for a new one.", field: code }
    onSubmitted:
      "204": { navigate: sign-in, message: Your password is set. Sign in with it. }
