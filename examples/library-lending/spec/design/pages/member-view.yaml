pages:
  member-view:
    kind: view
    title: Member
    route: /members/{memberId}
    entity: Member
    permission: members.read
    source: getMember
    sections:
      - { title: Member, fields: [cardNumber, fullName, email, tier] }
      - { title: Membership, fields: [joinedOn, membershipEndsOn, outstandingFees] }
    states:
      failed:
        member-not-found: { message: There is no member with this card. }
    actions:
      - { label: Lend a book, kind: navigate, target: loan-form, permission: loans.create }
