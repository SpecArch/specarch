specarch: "0.1"
info: { title: Customer registry, version: 2.4.0, name: customer-registry }
dependencies:
  streets:
    description: The streets an address names.
    timeout: PT2S
    specification: places
    version: 3.1.0
permissions:
  public: { description: Open to everyone. }
enums:
  Country:
    description: Where an address is.
    type: string
    enum: [indonesia, singapore, malaysia]
entities:
  Customer:
    type: object
    properties:
      id: { type: string, format: uuid }
      fullName: { type: string, maxLength: 200 }
    required: [id, fullName]
    primaryKey: [id]
schemas:
  Address:
    description: Where a customer lives.
    type: object
    properties:
      street: { $ref: "streets#/schemas/Street" }
      country: { $ref: "#/enums/Country" }
    required: [street]
paths:
  /customers:
    get:
      operationId: listCustomers
      summary: List customers
      permission: public
      listOf: { entity: Customer, pageSize: { default: 20, maximum: 100 } }
      responses:
        "200": { description: The customers. }
