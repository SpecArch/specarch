specarchRecord: "1.0.0"
kind: change
id: CR-5
title: Let an author evaluate an algorithm on its worked examples or on given inputs and see each step of its formula, with specarch try
raisedBy: specification-author
raised: "2026-10-26"
phase: development
type: perfective
urgency: normal
reason: An author changing an algorithm's formula could only learn whether it still gives each worked example's expected value by generating code and running it; the specification needs a command that evaluates the formula as written, or a proposed one, on its examples or on given inputs, and shows every step.
affects:
  adds:
    - SA-100
    - "#/commands/try"
    - "#/decisions/ADR-195"
    - "#/tests/try-example-fails"
    - "#/tests/try-example-others-fail"
    - "#/tests/try-exit-2"
    - "#/tests/try-file"
    - "#/tests/try-file-problem"
    - "#/tests/try-file-unrounded"
    - "#/tests/try-inputs"
    - "#/tests/try-inputs-unread"
    - "#/tests/try-json"
    - "#/tests/try-short-circuit"
    - "#/tests/try-succeeds"
    - "#/tests/try-unknown-algorithm"
    - "#/tests/try-usage-error"
    - "#/tests/try-values"
    - "#/tests/try-values-double"
    - "#/tests/try-values-duration"
impact: minor
decision:
  by: specification-author
  date: "2026-10-27"
  outcome: approved
  why: One new command, try, that reads a specification and writes nothing; no schema, rule or existing command changes, so nothing a 1.2.0 file or run does changes, and a minor release carries it (ADR-186, ADR-195).
release: 1.3.0
status: released
