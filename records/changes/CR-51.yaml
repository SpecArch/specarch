specarchRecord: "1.0.0"
kind: change
id: CR-51
title: State the intent, a problem, measured goals, what is out of scope and ranked quality goals, and validate, document and ask for it first
raisedBy: specification-author
raised: "2026-11-05"
phase: development
type: additive
urgency: normal
reason: A specification held what the system must do but not why, so no requirement could be judged against the problem it should solve or a goal it should reach, a request outside the scope was taken like any other, and gaps --next and init asked for requirements before anyone had said what the system is for.
