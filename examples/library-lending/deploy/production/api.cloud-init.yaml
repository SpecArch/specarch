# Draft: the specification is not approved: there is no records/approvals/0.1.0.yaml beside the specification; this file is not the approved output.
# The host runs api as a container under systemd, through a Quadlet unit (podman 4.4 or later). The secrets are read from /etc/library-lending/secrets.env, which the operator writes on the host, holding DATABASE_URL, FEE_LEDGER_TOKEN; the unit refuses to start without it, naming what it misses, and this file never holds a value of it.
# api: service of the deployment production, https://library.example
package_update: true
packages:
  - podman
write_files:
  - path: "/etc/library-lending/production.env"
    permissions: "0640"
    content: |
      # Generated by specarch-gen-deploy from ../spec/specarch.yaml, version 0.1.0; meta-model 1.0.0; digest sha256:895f8a1082cb02e5894d8e5348b89a834b5cf5fb2b6a6506ef933ceef8a8ae9a; the values of the settings in the deployment production of environment production. Do not edit this file: a change goes into the specification, the implementation file's deployments or the deploy target's settings.
      # Draft: the specification is not approved: there is no records/approvals/0.1.0.yaml beside the specification; this file is not the approved output.
      # A secret is not here: the form that runs the system reads it from the host.
      # specarch: #/configuration/dailyRate
      DAILY_RATE=0.50
      # specarch: #/configuration/notificationChannelUrl
      NOTIFICATION_CHANNEL_URL=https://notify.library.example/events
      # specarch: #/configuration/databaseUrl
      # specarch-problem: warning: secret_unprotected: setting databaseUrl is a secret with no rotation, so a value that leaks stays good until someone notices; add rotation, the longest time one value is used before it is replaced, such as P90D [secret_unprotected@deployment/configuration/configuration.yaml#/configuration/databaseUrl/secret]
      # DATABASE_URL: databaseUrl is a secret of the specification, never written here
      # specarch: #/configuration/feeLedgerToken
      # specarch-problem: warning: secret_unprotected: setting feeLedgerToken is a secret with no rotation, so a value that leaks stays good until someone notices; add rotation, the longest time one value is used before it is replaced, such as P90D [secret_unprotected@deployment/configuration/configuration.yaml#/configuration/feeLedgerToken/secret]
      # FEE_LEDGER_TOKEN: feeLedgerToken is a secret of the specification, never written here
  - path: "/etc/containers/systemd/api.container"
    permissions: "0644"
    content: |
      [Unit]
      Description=The API behind the desk screens.
      AssertPathExists=/etc/library-lending/secrets.env
      [Container]
      Image=localhost/library-lending-api:latest
      ContainerName=api
      EnvironmentFile=/etc/library-lending/production.env
      EnvironmentFile=/etc/library-lending/secrets.env
      PublishPort=8080:8080
      [Service]
      ExecStartPre=/bin/sh -c 'for v in DATABASE_URL FEE_LEDGER_TOKEN; do grep -q "^$${v}=" /etc/library-lending/secrets.env || { echo "$${v} is not in /etc/library-lending/secrets.env: write it there, from the secret store of the host" >&2; exit 1; }; done'
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  - "systemctl daemon-reload"
  - "systemctl start api.service || { echo \"api.service did not start; its reason: $(systemctl status api.service --no-pager 2>&1 | tail -n 5)\" >&2; exit 1; }"
