questions:
  # specarch-problem: question: open_question: (must, decision) What is each role for, and who holds it: desk-staff, desk-supervisor? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: 'What is each role for, and who holds it: desk-staff, desk-supervisor?'
    kind: decision
    priority: must
    blocks: ['#/roles/desk-staff/description', '#/roles/desk-supervisor/description']
    decidedBy: system-owner
    why: A permission table names a role and what it grants, not who holds it.
  # specarch-problem: question: open_question: (must, decision) What does each permission allow: loans.read, loans.write? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: 'What does each permission allow: loans.read, loans.write?'
    kind: decision
    priority: must
    blocks: ['#/permissions/loans.read/description', '#/permissions/loans.write/description']
    decidedBy: system-owner
    why: A permission table names the permissions a role grants and not what they are for.
  # specarch-problem: question: open_question: (must, decision) The check Authorise is skipped for every client: a client passes it whatever its roles grant. Is every client meant to reach each operation the check guards, or which ones are, and should the check hold the others to their roles' grants? Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: 'The check Authorise is skipped for every client: a client passes it whatever its roles grant. Is every client meant to reach each operation the check guards, or which ones are, and should the check hold the others to their roles'' grants?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1v1~1loans/get/permission', '#/paths/~1v1~1loans/post/permission', '#/paths/~1v1~1loans~1{id}/get/permission']
    decidedBy: system-owner
    why: A check skipped for one kind of caller fails open for that kind without an error, so no role's grants hold for a client.
    cites:
      - {source: code, clause: access gate Authorise, says: The permission table declares that Authorise is skipped for every client.}
  # specarch-problem: question: open_question: (must, decision) The check Authorise runs only when the setting AUTHORISATION_URL is present. Is an empty AUTHORISATION_URL ever meant to let every request through, or should the check refuse every request until it is set? It blocks roles. Decided by system-owner. Answer with a decision record that names Q-4 under answers. [Q-4]
  Q-4:
    question: The check Authorise runs only when the setting AUTHORISATION_URL is present. Is an empty AUTHORISATION_URL ever meant to let every request through, or should the check refuse every request until it is set?
    kind: decision
    priority: must
    blocks: [roles]
    decidedBy: system-owner
    why: A check switched off by an empty setting fails open without an error, so no role's grants hold while it is off.
    cites:
      - {source: code, clause: access gate Authorise, says: The permission table declares that Authorise runs only when AUTHORISATION_URL is present.}
  # specarch-problem: question: open_question: (must, decision) What does GET /health do, and what does it answer? Decided by system-owner. Answer with a decision record that names Q-5 under answers. [Q-5]
  Q-5:
    question: What does GET /health do, and what does it answer?
    kind: decision
    priority: must
    blocks: ['#/paths/~1health/get/summary', '#/paths/~1health/get/responses']
    decidedBy: system-owner
    why: A route table names the handler and not what it does or the responses it gives.
  # specarch-problem: question: open_question: (must, decision) No rule of the permission table reaches GET /health. Is it closed on purpose, so that nobody may call it, or should a rule reach it? Decided by system-owner. Answer with a decision record that names Q-6 under answers. [Q-6]
  Q-6:
    question: No rule of the permission table reaches GET /health. Is it closed on purpose, so that nobody may call it, or should a rule reach it?
    kind: decision
    priority: must
    blocks: ['#/paths/~1health/get/permission']
    decidedBy: system-owner
    why: A route no rule reaches refuses every caller, and so does a route a rule was forgotten for, so it is asked, never assumed.
