    question: web/proxy.js runs before / and /api/ping and may check who is signed in, send them elsewhere or answer by itself. The reader cannot tell which routes web/proxy.js covers, since its matcher holds the pattern "/((?!api|_next).*)", a regular expression the reader does not read. Which permission does each of them check, or is it open to everyone (public)?
