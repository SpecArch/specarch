specarch: "1.0.0"
info: { title: Customer registry, version: 2.4.0, name: customer-registry }
permissions:
  public: { description: Open to everyone. }
entities:
  Customer:
    type: object
    properties:
      id: { type: string, format: uuid }
      fullName: { type: string, maxLength: 200 }
    required: [id, fullName]
    primaryKey: [id]
schemas:
  Address:
    type: object
    properties:
      street: { type: string, maxLength: 200 }
    required: [street]
paths:
  /customers:
    get:
      operationId: listCustomers
      summary: List customers
      permission: public
      listOf: { entity: Customer, pageSize: { default: 20, maximum: 100 } }
      responses:
        "200": { description: The customers. }
