  # specarch-problem: question: open_question: (must, decision) Which methods does pages/api/loans/index.ts serve at /api/loans, and for each, what does it do, what does it answer and which permission does it check? It blocks paths. Decided by system-owner. Answer with a decision record that names Q-9 under answers. [Q-9]
  Q-9:
    question: Which methods does pages/api/loans/index.ts serve at /api/loans, and for each, what does it do, what does it answer and which permission does it check?
    kind: decision
    priority: must
    blocks: [paths]
    decidedBy: system-owner
    why: A route file's place gives its path and not its methods, which the handlers it exports decide; an operation is a method and a path, so none is written until the JavaScript reader reads the handlers or the owner says.
    cites:
      - {source: code, clause: pages/api/loans/index.ts, says: 'The file api/loans/index.ts is under pages/api, so the router serves the API route /api/loans from it.'}
