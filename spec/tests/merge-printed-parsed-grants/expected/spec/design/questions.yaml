    question: The check RequireAudit runs only when the setting AUDIT_ON is present. Is an empty AUDIT_ON ever meant to let every request through, or should the check refuse every request until it is set?
    kind: decision
    priority: must
    blocks: [roles]
    decidedBy: system-owner
    why: A check switched off by an empty setting fails open without an error, so no role's grants hold while it is off.
    cites:
      - {source: code, clause: access gate RequireAudit, says: The permission table declares that RequireAudit runs only when AUDIT_ON is present.}
