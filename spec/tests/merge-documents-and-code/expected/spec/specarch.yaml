# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.4.0/schema/specarch-design-0.1.schema.json
specarch: "0.1"
info:
  title: Merge of 2 trees
  version: 0.1.0
  description: |
    The elements of these trees, merged in this order: Desk code; Desk manual. Every element cites where it was read; where the trees disagree, or the documents and the code do, a question asks which is right.
  tracksOrigin: true
stages: [requirements, design, implementation]
sources:
  code:
    kind: code
    title: The code repository
    edition: 2ddae4f53139c036e8b99477922186064bdb4d6f
    url: https://example.invalid/desk.git
    clauses:
      - {clause: migrations, title: The tables}
      - {clause: router, title: The routes}
  manual:
    kind: document
    title: The lending desk manual
    edition: "3"
    clauses:
      - {clause: "2", title: Members}
      - {clause: "3", title: Loans}
  api:
    kind: document
    title: The published members interface
    edition: "1.0"
    givenOutside: true
    clauses:
      - {clause: "4", title: Fines}
