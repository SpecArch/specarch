specarch: "1.0.0"
info: { title: Case, version: 1.0.0 }
stakeholders:
  clerk: { description: Staff at the till. }
stakeholdersComplete: { by: clerk, date: "2026-11-05" }
problem:
  statement: Clerks cannot find an item by name, so a sale waits while they search.
  stakeholders: [clerk]
goals:
  GOAL-1: { statement: Sales wait less., measure: Seconds from request to counter., baseline: 90 seconds, target: 20 seconds, priority: must, status: accepted }
  GOAL-2: { statement: Fewer items are lost., measure: Items written off each month., baseline: 12 items, target: 4 items, priority: should, status: proposed }
needs:
  NEED-1: { statement: Items must be findable by name., stakeholders: [clerk], status: accepted, goals: [GOAL-1] }
requirements:
  CASE-1:
    statement: An item shall have a non-empty name.
    kind: functional
    priority: must
    status: accepted
    acceptance: [Saving an item with an empty name is refused.]
    verification: test
    needs: [NEED-1]
    release: 1.0.0
  CASE-2:
    statement: A name search shall list every item whose name holds the words given.
    kind: functional
    priority: must
    status: accepted
    acceptance: [A search for "red cup" lists the item named "Red cup, large".]
    verification: test
    needs: [NEED-1]
    release: 1.1.0
  CASE-3:
    statement: A name search shall correct a misspelled word.
    kind: functional
    priority: could
    status: rejected
    acceptance: [A search for "rde cup" lists the item named "Red cup".]
    verification: test
    needs: [NEED-1]
    release: 1.0.0
