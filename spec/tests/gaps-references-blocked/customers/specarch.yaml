specarch: "0.1"
info: { title: Customer registry, version: 2.4.0, name: customer-registry }
permissions:
  public: { description: Open to everyone. }
entities:
  Customer:
    type: object
    properties:
      id: { type: string, format: uuid }
      fullName: { type: string, maxLength: 200 }
    required: [id, fullName]
    primaryKey: [id]
schemas:
  Address:
    type: object
    properties:
      street: { type: string, maxLength: 200 }
paths:
  /customers:
    get:
      operationId: listCustomers
      summary: List customers
      permission: public
      listOf: { entity: Customer, pageSize: { default: 20, maximum: 100 } }
      responses:
        "200": { description: The customers. }
stakeholders:
  registry-owner: { description: The team that keeps the customer registry. }
questions:
  Q-1:
    question: Which parts of an address does the registry keep, beyond the street?
    kind: decision
    priority: must
    blocks: ["#/schemas/Address"]
    decidedBy: registry-owner
