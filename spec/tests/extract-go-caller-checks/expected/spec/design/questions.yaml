    blocks: ['#/paths/~1invoices/get/callers']
    decidedBy: system-owner
    why: 'The code names the clients and not what each is: its kind, its roles and its proof are the registration''s, never in syntax. callers names who may call one by one (ADR-110).'
    cites:
      - {source: code, clause: 'core/server.go:25', says: 'Calls Server.RequireClients with "reporting" and "archive", which the implementation file names as a client check.'}
