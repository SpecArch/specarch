questions:
  Q-1:
    question: Which permission does POST /loans check? The document gives it the security deskStaff.
    kind: decision
    priority: must
    blocks: ['#/paths/~1loans/post/permission']
    decidedBy: system-owner
    why: A security scheme says how a caller proves who it is, not what it may do, so the permission is asked and never written as public.
