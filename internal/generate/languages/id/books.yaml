  "No problem or gap is marked in this book.": "Tidak ada masalah atau gap yang ditandai di buku ini."
  "page %d": "halaman %d"
  "Page %d of %d": "Halaman %d dari %d"
  "Mermaid diagram, printed as its source: the PDF does not draw it, and the html document draws the entity diagram and the workflows.": "Diagram Mermaid, dicetak sebagai source-nya: PDF ini tidak menggambarnya, sedangkan dokumen html menggambar diagram entity dan workflow."
