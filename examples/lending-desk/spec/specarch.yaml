# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v1.2.0/schema/specarch-design-1.0.schema.json
specarch: "1.0.0"

info:
  title: Lending Desk
  name: lending-desk
  version: 0.1.0
  tracksOrigin: true
  wireNames: snake_case
  description: |
    The as-built specification of a small lending desk, written from its
    desk manual and its code by the procedure in docs/from-sources.md. Every
    element says how it is known and cites the manual section or the code
    file and line it came from. Where the two disagree, or a source is
    silent, the specification asks instead of choosing. It is an example,
    not a real library's system.

stages: [requirements, design, implementation, tests]

sources:
  desk-manual:
    kind: document
    title: Lending desk manual
    edition: "2025"
    author: The desk team
    url: ../sources/manual.md
    clauses:
      - { clause: "1", title: Purpose }
      - { clause: "2", title: Members }
      - { clause: "2.1", title: Who may borrow }
      - { clause: "2.2", title: Registering members }
      - { clause: "3.1", title: Lending a book }
      - { clause: "3.2", title: The five-book limit }
      - { clause: "3.3", title: The loan period }
      - { clause: "3.4", title: The book records }
      - { clause: "4.1", title: Renewals }
      - { clause: "5.1", title: Returns }
      - { clause: "6", title: Opening hours }
  desk-code:
    kind: code
    title: The lending desk service
    edition: 85f06f82a430a81cc24648d198454426a37c16c9
    author: The desk team
    url: ../sources/code
    clauses:
      - { clause: lending/model.go, title: The records and the lending limits }
      - { clause: lending/routes.go, title: The served routes and their handlers }
      - { clause: lending/access.go, title: The permission check }
      - { clause: migrations/001_init.sql, title: The tables }
      - { clause: migrations/002_roles.sql, title: The roles tables }
      - { clause: migrations/003_member_address.sql, title: The member's address }
      - { clause: migrations/004_loan_reference.sql, title: The loan's reference and the loans' indexes }
      - { clause: seeds/001_roles.sql, title: The seed of the roles tables }

  estate-gateway:
    kind: document
    title: The library estate's gateway specification
    edition: 0.1.0
    author: The estate's maintainers
    url: ../../estate/gateway/specarch.yaml
    clauses:
      - { clause: gateways.api, title: The gateway's forwards by audience }
