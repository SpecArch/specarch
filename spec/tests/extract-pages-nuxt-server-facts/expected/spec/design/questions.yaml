  # specarch-problem: question: open_question: (must, decision) Which methods does site/server/api/loans/[id].ts serve at /api/loans/{id}, and for each, what does it do, what does it answer and which permission does it check? Its path parameters are id. Its handler is at site/server/api/loans/[id].ts:1. It blocks paths. Decided by system-owner. Answer with a decision record that names Q-6 under answers. [Q-6]
  Q-6:
    question: Which methods does site/server/api/loans/[id].ts serve at /api/loans/{id}, and for each, what does it do, what does it answer and which permission does it check? Its path parameters are id. Its handler is at site/server/api/loans/[id].ts:1.
    kind: decision
    priority: must
    blocks: [paths]
    decidedBy: system-owner
    why: A route file's place gives its path and not its methods; its code exports no handler named after a method, or its handler compares req.method with no literal, so the methods are not known by syntax.
