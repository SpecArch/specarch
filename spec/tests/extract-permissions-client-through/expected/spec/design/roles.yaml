permissions:
  invoices.delete:
    origin: stated
    cites:
      - {source: code, clause: access role clerk, says: clerk and invoice-manager grant invoices.delete.}
  invoices.read:
    origin: stated
    cites:
      - {source: code, clause: access role admin-web, says: 'admin-web, clerk, invoice-manager and reporting grant invoices.read.'}
roles:
  admin-web:
    permissions: [invoices.read]
    origin: stated
    cites:
      - {source: code, clause: access role admin-web, says: admin-web grants invoices.read.}
  clerk:
    permissions: [invoices.delete, invoices.read]
    origin: stated
    cites:
      - {source: code, clause: access role clerk, says: clerk grants invoices.delete and invoices.read.}
  invoice-manager:
    permissions: [invoices.delete, invoices.read]
    through:
      invoices.delete: [admin-web]
    origin: stated
    cites:
      - {source: code, clause: access role invoice-manager, says: invoice-manager grants invoices.delete and invoices.read.}
  reporting:
    permissions: [invoices.read]
    origin: stated
    cites:
      - {source: code, clause: access role reporting, says: reporting grants invoices.read.}
clients:
  admin-web:
    kind: service
    roles: [admin-web]
    origin: stated
    cites:
      - {source: code, clause: access client admin-web, says: The table grants admin-web permissions directly.}
  mobile:
    kind: application
    origin: stated
    cites:
      - {source: code, clause: access client mobile, says: The table narrows a grant to mobile.}
  reporting:
    kind: service
    roles: [reporting]
    origin: stated
    cites:
      - {source: code, clause: access client reporting, says: The table grants reporting permissions directly.}
