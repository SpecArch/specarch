# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.5.0/schema/specarch-implementation-0.1.schema.json
specarchImplementation: "0.1"

info:
  title: Library Lending's web screens in TypeScript on Next.js and Carbon
  version: 0.1.0
  description: |
    The librarians' and members' web screens as a Next.js app router
    application drawn with IBM's Carbon design system. It is a deliverable
    of its own beside the service, so it has its own implementation file;
    the application around the generated pages (the layout, the styles,
    the package and its configuration) is written by hand in
    examples/library-lending/web-nextjs.

implements:
  file: ../../specarch.yaml
  version: 0.1.0

stack:
  language: { name: TypeScript, version: "6.0" }
  toolchain: { name: pnpm, version: "12.9.1" }

libraries:
  next: { version: 16.4.0, licence: MIT, purpose: "The app router, the server components and the build." }
  react: { version: 19.3.0, licence: MIT, purpose: Rendering. }
  react-dom: { version: 19.3.0, licence: MIT, purpose: Rendering. }
  "@carbon/react": { version: 1.118.0, licence: Apache-2.0, purpose: "The components that draw every page." }
  "@carbon/styles": { version: 1.117.0, licence: Apache-2.0, purpose: "Carbon's styles, compiled from Sass." }
  "@carbon/themes": { version: 11.83.0, licence: Apache-2.0, purpose: "Carbon's theme tokens." }
  "@carbon/icons-react": { version: 11.90.0, licence: Apache-2.0, purpose: Icons. }
  sass: { version: 1.105.1, licence: MIT, purpose: "Compiles Carbon's Sass.", scope: build }
  typescript:
    version: 6.0.3
    licence: Apache-2.0
    purpose: Type-checks the application with tsc --noEmit under strict.
    scope: build
    why: 7.0 is outside the range typescript-eslint takes (below 6.1), and eslint-config-next lints with it.
  eslint:
    version: 9.39.5
    licence: MIT
    purpose: The lint, with no rule turned off.
    scope: build
    why: 10 is outside the range of the React, accessibility and import plug-ins eslint-config-next brings.
  eslint-config-next: { version: 16.4.0, licence: MIT, purpose: "Next.js's lint rules, core web vitals and TypeScript.", scope: build }
  "@types/react": { version: 19.3.0, licence: MIT, purpose: Types., scope: build }
  "@types/react-dom": { version: 19.3.0, licence: MIT, purpose: Types., scope: build }
  "@types/node": { version: 26.6.4, licence: MIT, purpose: Types., scope: build }

targets:
  ui:
    output: ../../../web-nextjs/src
    platform: web
    framework: nextjs-carbon
    description: |
      The pages as schema files and thin page.tsx files under app/, the
      components that read the schemas under screens/, and every text in
      strings.ts. The service is called directly, at NEXT_PUBLIC_API_URL.
    settings:
      language: en

tasks:
  install: { run: pnpm install --frozen-lockfile, ci: true }
  typecheck: { run: pnpm typecheck, ci: true }
  lint: { run: pnpm lint, ci: true }
  build: { run: pnpm build, ci: true }

decisions:
  ADR-201:
    title: The build's dependencies are accepted as the owner decided, and run no install script
    status: accepted
    date: "2026-10-09"
    context: |
      The SBOM scan of the lock file (syft, grype, osv-scanner) found sharp
      with its LGPL-3.0-or-later libvips build, two data packages under
      licences that are not OSI-approved, an advisory with no fixed version,
      and an install script in every Carbon and IBM Plex package that runs
      IBM's telemetry.
    decision: |
      sharp is removed by overrides in pnpm-workspace.yaml; the pages
      resize no images. caniuse-lite (CC-BY-4.0), the browser data Next.js
      reads while it builds, and language-subtag-registry (CC0-1.0), a list
      the accessibility lint reads, are accepted as data read at build time
      and never shipped in a page. braces 3.0.3, GHSA-vfj7-8cjw-p6xm, is
      accepted for the lint only, which reads the project's own patterns,
      until 2027-04-09 or a fixed release. No dependency runs an install
      script: allowBuilds in pnpm-workspace.yaml denies each by name, and
      CI sets IBM_TELEMETRY_DISABLED and NEXT_TELEMETRY_DISABLED as well.
    consequences: The repository's .dependency-allowlist.json holds the two licence exceptions and the advisory with their reasons, so the dependency scan passes with them on record.
    why: The owner answered Q10 of docs/ui-nextjs-carbon.md so on 2026-10-09.
