info:
  title: Merge of 2 trees
  version: 0.1.0
  description: |
    The elements of these trees, merged in this order: Note keeper; Tests in notes.feature, sheet.csv. Every element cites where it was read; where the trees disagree, or the documents and the code do, a question asks which is right.
  tracksOrigin: true
stages: [requirements, design, tests, deployment]
