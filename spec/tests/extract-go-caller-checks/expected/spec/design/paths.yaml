      permission: invoices.delete
      origin: stated
      cites:
        - {source: code, clause: 'core/server.go:27', says: 'Registers POST /invoices/{invoiceId}/void on a chi router; its handler is s.voidInvoice, and it is checked by s.Require("invoices.delete"), and gated by s.RequireAudience and s.RequireCaller.'}
