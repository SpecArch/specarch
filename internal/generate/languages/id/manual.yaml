  "When the system refuses:": "Saat sistem menolak:"
  "| You see | Why | What to do |": "| Yang terlihat | Penyebab | Yang perlu dilakukan |"
  "Any other problem the system reports.": "Masalah lain yang dilaporkan sistem."
  "Anyone opens it, signed in or not.": "Siapa pun bisa membukanya, sudah sign-in atau belum."
  "Every person opens it once signed in, whatever their roles.": "Setiap orang bisa membukanya setelah sign-in, apa pun role-nya."
  "Opened by who holds the permission ": "Dibuka oleh yang memegang permission "
