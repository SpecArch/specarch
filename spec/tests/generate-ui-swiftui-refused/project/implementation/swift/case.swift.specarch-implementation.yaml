specarchImplementation: "0.1"
info: { title: Case in Swift, version: 1.0.0 }
implements: { file: ../../specarch.yaml, version: 1.0.0 }
stack: { language: { name: Swift, version: "6.0" } }
mappings:
  "#/menus/admin": { target: the administration's own menu, ownedBy: administration }
targets:
  ui:
    output: ../../../ios
    platform: iphone
    settings:
      language: en
      module: Library Screens
      session: { operation: getSession, signedIn: open, permissions: granted, signIn: sign-in }
      hooks: { member-view: [name], member-form: [joinedOn] }
      layouts: { member-form: accordion }
      translations: [id]
      server:
        routes: /api
        service: MEMBERS_SERVICE_URL
        token: { cookie: members_session, header: Authorization, scheme: Bearer }
