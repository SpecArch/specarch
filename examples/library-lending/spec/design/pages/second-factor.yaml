# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-1.0.schema.json
pages:
  second-factor:
    kind: task
    title: Confirm it is you
    route: /sign-in/second-factor
    permission: public
    submit: confirmSecondFactor
    fields: [code]
    states:
      failed:
        second-factor-refused: { message: "The code is wrong, or it came too late. Type the code the app shows now, or sign in again.", field: code }
    onSubmitted:
      "200": { navigate: callerHome, message: You are signed in. }
