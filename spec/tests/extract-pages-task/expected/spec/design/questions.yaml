  # specarch-problem: question: open_question: (must, decision) Which permission does the page at /members check, or is it open to everyone (public)? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: Which permission does the page at /members check, or is it open to everyone (public)?
    kind: decision
    priority: must
    blocks: ['#/pages/members/permission']
    decidedBy: system-owner
    why: The folders name a page's route and not who may open it, and a page open to everyone is how an open screen is usually found, so it is asked, never assumed.
  # specarch-problem: question: open_question: (must, decision) The page at /sign-in submits to operation signIn, which its schema names; this tree does not declare it, so it waits for the tree that does. Is it that operation? Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: The page at /sign-in submits to operation signIn, which its schema names; this tree does not declare it, so it waits for the tree that does. Is it that operation?
    kind: decision
    priority: must
    blocks: ['#/pages/sign-in/submit']
    decidedBy: system-owner
    names: signIn
    why: The schema names the operation and not its method or path, so the page's submit waits for the tree that declares it; specarch merge writes it once one does.
  # specarch-problem: question: open_question: (could, decision) Not held: app/sign-in/page.schema.ts: entity Member is for a list, a form or a view, and the page is a task, which submits without loading a record; left out. Does the specification need it, written another way or described by hand? Decided by system-owner. Answer with a decision record that names Q-4 under answers. [Q-4]
