specarch: "0.1"
info: { title: Case, version: 1.0.0 }
requirements:
  CASE-1: { statement: One., kind: functional, priority: must, status: accepted, acceptance: [One.] }
entities:
  Loan:
    type: object
    properties:
      id: { type: string, format: uuid }
      receipt: { $ref: "#/schemas/Receipt" }
    primaryKey: [id]
    relations:
      summary: { target: Receipt, kind: many-to-one, via: id }
    satisfies: [CASE-1]
schemas:
  Receipt:
    type: object
    properties:
      dueOn: { type: string, format: date }
    required: [dueOn, returnedOn]
    satisfies: [CASE-1]
  Loan:
    type: object
    properties:
      note: { type: string, maxLength: 200 }
    satisfies: [CASE-1]
  Notice:
    type: object
    properties:
      receipt: { $ref: "#/schemas/Reciept" }
    satisfies: [CASE-1]
