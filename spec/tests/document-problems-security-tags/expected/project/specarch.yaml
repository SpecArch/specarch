specarch: "1.0.0"
info: { title: Case, version: 1.0.0 }
stakeholders:
  # specarch-problem: warning: stakeholders_unconfirmed: the stakeholder list is not confirmed complete, so a role with an interest in the system may still be missing from it; once it is complete, add stakeholdersComplete with by, the role that confirms it, and date, and name under source the declared source that records the confirmation, when there is one; the key ends this warning, the banner on every generated document and the warning of specarch approve [stakeholders_unconfirmed@specarch.yaml#/stakeholders]
  owner: { description: The product owner. }
entities:
  Loan:
    type: object
    properties:
      id: { type: string, format: uuid }
      memberId: { type: string, format: uuid }
    required: [id, memberId]
    primaryKey: [id]
permissions:
  signedIn: { description: Every signed-in caller. }
  public: { description: Every caller. }
paths:
  /loans/{loanId}:
    get:
      operationId: getLoan
      summary: Read one loan.
      # specarch-problem: warning: object_unscoped: getLoan reaches one Loan by its key, and its permission signedIn is held by every caller once signed in, with no row policy on Loan, so any caller reaches any Loan by changing the key; give the operation a permission a role grants, or give the roles a row policy on Loan that compares a field of it with caller.<property> [object_unscoped@specarch.yaml#/paths/~1loans~1{loanId}/get/permission]
      permission: signedIn
      parameters:
        - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The loan.
          content:
            application/json:
              schema: { $ref: "#/entities/Loan" }
        "404": { description: No loan has that key. }
  /loans/{id}:
    put:
      operationId: replaceLoan
      summary: Replace one loan.
      # specarch-problem: warning: object_unscoped: replaceLoan reaches one Loan by its key, and its permission public is held by every caller, signed in or not, with no row policy on Loan, so any caller reaches any Loan by changing the key; give the operation a permission a role grants, or give the roles a row policy on Loan that compares a field of it with caller.<property> [object_unscoped@specarch.yaml#/paths/~1loans~1{id}/put/permission]
      permission: public
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/entities/Loan" }
      responses:
        "204": { description: Replaced. }
        "404": { description: No loan has that key. }
tests:
  get-loan-denied-when-not-signed-in: { level: system, operation: getLoan, scenario: red, covers: [denied when not signed in], given: "a caller who is not signed in", when: "getLoan is called", then: "it is refused as not signed in" }
  get-loan-loan-id-not-a-valid-uuid: { level: system, operation: getLoan, scenario: red, covers: [loanId not a valid uuid], given: "a signed-in caller", when: "getLoan is called with loanId that is not a valid uuid", then: "it is refused" }
  get-loan-not-found-loan-id: { level: system, operation: getLoan, scenario: red, covers: [not found loanId], given: "no record has that loanId", when: "getLoan is called with that loanId", then: "it is refused as not found" }
  get-loan-succeeds: { level: system, operation: getLoan, scenario: golden, given: "a signed-in caller", when: "getLoan is called with values inside every limit", then: "it answers 200: The loan." }
  replace-loan-id-not-a-valid-uuid: { level: system, operation: replaceLoan, scenario: red, covers: [id not a valid uuid], given: "a signed-in caller", when: "replaceLoan is called with id that is not a valid uuid", then: "it is refused" }
  replace-loan-member-id-not-a-valid-uuid: { level: system, operation: replaceLoan, scenario: red, covers: [memberId not a valid uuid], given: "a signed-in caller", when: "replaceLoan is called with memberId that is not a valid uuid", then: "it is refused" }
  replace-loan-missing-id: { level: system, operation: replaceLoan, scenario: red, covers: [missing id], given: "a signed-in caller", when: "replaceLoan is called without id", then: "it is refused" }
  replace-loan-missing-member-id: { level: system, operation: replaceLoan, scenario: red, covers: [missing memberId], given: "a signed-in caller", when: "replaceLoan is called without memberId", then: "it is refused" }
  replace-loan-not-found-id: { level: system, operation: replaceLoan, scenario: red, covers: [not found id], given: "no record has that id", when: "replaceLoan is called with that id", then: "it is refused as not found" }
  replace-loan-succeeds: { level: system, operation: replaceLoan, scenario: golden, given: "any caller", when: "replaceLoan is called with values inside every limit", then: "it answers 204: Replaced." }
