specarch: "0.1"
info: { title: Case, version: 1.0.0 }
permissions:
  items.create: { description: Add items. }
roles:
  clerk: { description: Staff., permissions: [items.create] }
paths:
  /items:
    post:
      operationId: createItem
      summary: Add an item
      permission: items.create
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
              required: [name]
      responses:
        "201": { description: Added. }
        "409": { description: An item with that name exists. }
tests:
  create-item-succeeds:
    operation: createItem
    scenario: golden
    covers: [name of 1 character, name of 40 characters]
    given: a clerk
    when: createItem is called with a name of 1 character, and again with one of 40
    then: both items are added
  create-item-missing-name:
    operation: createItem
    scenario: red
    covers: [missing title]
    given: a clerk
    when: createItem is called without a name
    then: it is refused
  create-item-name-length:
    operation: createItem
    scenario: red
    covers: [name shorter than 1 character, name longer than 40 characters]
    given: a clerk
    when: createItem is called with an empty name, and again with 41 characters
    then: both are refused
  create-item-denied:
    operation: createItem
    scenario: red
    covers: [denied without items.create]
    given: a caller without items.create
    when: createItem is called
    then: it is refused as not allowed
  create-item-duplicate:
    operation: createItem
    scenario: red
    covers: [response 409]
    notApplicable: Covered by the store's own unique index test; the design keeps no unique constraint on items.
