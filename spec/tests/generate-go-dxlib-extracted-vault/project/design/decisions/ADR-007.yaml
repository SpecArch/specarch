# Written by specarch decide; answers Q-6. Edit it as any decision.
decisions:
  ADR-007:
    title: 'operation POST /uploadAttachment, response 200, property size: it is Go''s int64, which encoding/json writes as a number, and a number above 2^53 loses digits in JavaScript and other readers. Is it bounded within 2^53, or carried as text?'
    status: accepted
    date: "2026-10-20"
    context: |-
      Q-6 asked: operation POST /uploadAttachment, response 200, property
      size: it is Go's int64, which encoding/json writes as a number, and a
      number above 2^53 loses digits in JavaScript and other readers. Is it
      bounded within 2^53, or carried as text? It blocked
      #/paths/~1uploadAttachment/post/responses/200/content/application~1json/schema/properties/size/format.
      Every integer in a specification has a width, and a 64-bit one is held
      only within 2^53 or as text; which one the code needs is not in the
      source.
    decision: |-
      Bounded within 2^53: a size is the count of an upload's bytes, at most
      the one-gibibyte ceiling of the upload.
    consequences: |-
      #/paths/~1uploadAttachment/post/responses/200/content/application~1json/schema/properties/size/format
      is written from this answer, carrying origin decided and decidedIn
      ADR-007.
    answers: [Q-6]
    decidedBy: system-owner
    origin: stated
    cites:
      - {source: vault-owner, says: 'Bounded within 2^53: a size is the count of an upload''s bytes, at most the one-gibibyte ceiling of the upload.'}
