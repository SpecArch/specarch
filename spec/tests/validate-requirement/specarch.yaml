specarch: "0.1"
info: { title: Case, version: 1.0.0 }
requirements:
  LIB-1: { statement: The total is the count times the price., kind: functional, priority: must, status: accepted, acceptance: [Three items at 2.50 total 7.50.] }
algorithms:
  total:
    inputs:
      count: { type: integer, format: int32, minimum: 0 }
      price: { type: string, format: decimal, precision: 10, scale: 2 }
    output: { type: string, format: decimal, precision: 12, scale: 2 }
    formula: decimal(count, 0) * price
    examples:
      - { name: three items, inputs: { count: 3, price: "2.50" }, expected: "7.50" }
    pseudocode: return count * price
    satisfies: [LIB-1, SHOP-1]
