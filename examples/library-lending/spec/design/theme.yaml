# yaml-language-server: $schema=../../../../schema/specarch-fragment-design-0.1.schema.json
theme:
  tokens:
    color:
      $type: color
      text: { $value: { colorSpace: srgb, components: [0.1059, 0.1216, 0.1412], hex: "#1b1f24" } }
      background: { $value: { colorSpace: srgb, components: [1, 1, 1], hex: "#ffffff" } }
      accent: { $value: { colorSpace: srgb, components: [0.0431, 0.3608, 0.6784], hex: "#0b5cad" } }
      danger: { $value: { colorSpace: srgb, components: [0.702, 0.149, 0.1176], hex: "#b3261e" } }
      border: { $value: { colorSpace: srgb, components: [0.4314, 0.4667, 0.5059], hex: "#6e7781" } }
      link: { $value: "{color.accent}" }
    space:
      $type: dimension
      small: { $value: { value: 8, unit: px } }
      medium: { $value: { value: 16, unit: px } }
    font:
      body: { $type: fontFamily, $value: [system-ui, sans-serif] }
      strong: { $type: fontWeight, $value: 600 }
  modes:
    dark:
      color.text: { colorSpace: srgb, components: [0.902, 0.9098, 0.9216], hex: "#e6e8eb" }
      color.background: { colorSpace: srgb, components: [0.0627, 0.0706, 0.0784], hex: "#101214" }
      color.accent: { colorSpace: srgb, components: [0.4235, 0.6902, 0.9608], hex: "#6cb0f5" }
      color.danger: { colorSpace: srgb, components: [0.949, 0.7216, 0.7098], hex: "#f2b8b5" }
      color.border: { colorSpace: srgb, components: [0.549, 0.5843, 0.6235], hex: "#8c959f" }
  pairs:
    - { text: color.text, background: color.background, use: text }
    - { text: color.link, background: color.background, use: text }
    - { text: color.danger, background: color.background, use: text }
    - { text: color.border, background: color.background, use: control }
