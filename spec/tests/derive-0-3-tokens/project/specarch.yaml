specarch: "1.0.0"
info: { title: Case, version: 1.0.0 }
stages: [tests]
entities:
  Invoice:
    type: object
    properties:
      id: { type: string, maxLength: 36 }
      organisationId: { type: string, maxLength: 36 }
    required: [id, organisationId]
    primaryKey: [id]
caller:
  description: Who is making the call, once the token has been checked.
  properties:
    organisationId: { type: string, maxLength: 36, description: The organisation the caller belongs to. }
permissions:
  invoices.read: { description: See invoices. }
  invoices.delete: { description: Delete invoices. }
  invoices.import: { description: Import invoices from the bank. }
roles:
  invoice-manager:
    description: Staff who manage invoices, who may delete them only from the administration application.
    permissions: [invoices.read, invoices.delete]
    through:
      invoices.delete: [admin-web]
  importer:
    description: The reconciliation job's own role.
    permissions: [invoices.import]
clients:
  admin-web:
    description: The administration application in the browser, where staff sign in.
    kind: application
    softwareVersion: ">=1.2.0 <2.0.0"
    softwareStatement: true
  middleware:
    description: The service between the front ends' backend and this one, which calls on the person's behalf.
    kind: service
    proof: { kind: spiffe }
  recon:
    description: The nightly reconciliation, which signs each request and presents no token.
    kind: service
    roles: [importer]
    proof:
      kind: signedRequest
      algorithm: hmac-sha256
      covers: ["@method", "@path", content-digest, date]
dependencies:
  securityLog:
    description: The append-only store of security events.
    timeout: PT2S
  pager:
    description: The alarm channel.
    timeout: PT2S
securityEvents:
  store: securityLog
  alarm: pager
tokens:
  access:
    description: What a signed-in person presents on every call at the edge.
    format: jwt
    lifetime: PT15M
    signature: ES256
    claims:
      sub: { description: The person's identifier. }
      aud: { const: "https://invoices.example.org" }
      client_id: { description: The application the person signed in through. }
      softwareVersion: { type: string, maxLength: 20, description: "The application's version, as the issuer registered it." }
      organisationId: { type: string, maxLength: 36, description: The organisation the person belongs to. }
    checks:
      organisation-known: { expression: size(organisationId) > 0, message: The organisation is known. }
    default: true
  transaction:
    description: What a hop presents when it calls the next on a person's behalf, inside the trust domain.
    format: jwt
    tokenType: txn_token
    lifetime: PT5M
    signature: ES256
    claims:
      txn: { description: "The transaction's identifier, one for the whole call." }
      sub: { description: The person acted for. }
      scope: { description: The permission the edge operation checked. }
      req_wl: { description: The edge workload that requested the token. }
      tctx:
        properties:
          application: { description: The software_id of the application the person signed in through. }
paths:
  /invoices:
    get:
      operationId: listInvoices
      summary: List invoices
      permission: invoices.read
      responses:
        "200": { description: The invoices. }
  /invoices/{invoiceId}:
    parameters:
      - { name: invoiceId, in: path, required: true, schema: { type: string, maxLength: 36 } }
    delete:
      operationId: deleteInvoice
      summary: Delete an invoice, called by the middleware on a person's behalf
      permission: invoices.delete
      token: transaction
      via: [middleware]
      responses:
        "204": { description: Deleted. }
  /invoices/imports:
    post:
      operationId: importInvoices
      summary: Import the bank's invoices, called only by the reconciliation
      permission: invoices.import
      callers: [recon]
      responses:
        "202": { description: Accepted. }
