translations:
  "in summary": "berupa ringkasan"
  "Recorded without evidence: the record holds what %s wrote down and nothing that shows it.": "Dicatat tanpa bukti: record ini hanya memuat apa yang ditulis %s, tanpa apa pun yang menunjukkannya."
  "Evidence: ": "Bukti: "
  "Touches: ": "Menyentuh: "
  "%s: test session “%s” (%s on %s, version %s)": "%s: test session “%s” (%s di %s, versi %s)"
  "%s: session “%s” (%s)": "%s: session “%s” (%s)"
  "%s: %s from %s to %s (%s)": "%s: %s dari %s ke %s (%s)"
  "# %s: communication history": "# %s: riwayat komunikasi"
  "Version %s of the specification: %s, %s and %s are recorded beside it, in `records/communications/`, `records/sessions/` and `records/test-sessions/`. They come first in time order, then the history of each stakeholder and of each question, decision and element they touch. Each record says who said what to whom, when, by which channel and whether the words are verbatim or a summary; %s. People are named by role.": "Spesifikasi versi %s: %s, %s, dan %s tercatat di sampingnya, di `records/communications/`, `records/sessions/`, dan `records/test-sessions/`. Semuanya ditulis lebih dulu sesuai urutan waktu, lalu riwayat tiap stakeholder dan tiap pertanyaan, keputusan, dan elemen yang disentuhnya. Tiap record menyatakan siapa mengatakan apa kepada siapa, kapan, lewat channel apa, dan apakah kata-katanya verbatim atau ringkasan; %s. Orang disebut menurut role-nya."
  "communication": "komunikasi"
  "communications": "komunikasi"
  "session": "session"
  "sessions": "session"
  "test session": "test session"
  "test sessions": "test session"
  "This document is for everyone: the person labels the records carry are left out, and so is what touches an internal element.": "Dokumen ini untuk semua orang: label orang yang ada di record tidak dimuat, begitu juga apa pun yang menyentuh elemen internal."
  "In time order": "Urutan waktu"
  "Nothing is recorded.": "Belum ada yang tercatat."
  "Reply, %s: %s": "Balasan, %s: %s"
  "Person: ": "Orang: "
  "Said in it: ": "Yang disampaikan: "
  "By stakeholder": "Per stakeholder"
  "invited, absent": "diundang, tidak hadir"
  "Never heard: no communication names it, and no session lists it.": "Belum pernah didengar: tidak ada komunikasi yang menyebutnya, dan tidak ada session yang mendaftarnya."
  "Never heard: invited and absent every time, and no communication names it.": "Belum pernah didengar: selalu diundang tapi tidak hadir, dan tidak ada komunikasi yang menyebutnya."
  "By question, decision and element": "Per pertanyaan, keputusan, dan elemen"
  "No record touches a question, a decision or an element.": "Tidak ada record yang menyentuh pertanyaan, keputusan, atau elemen."
  "none is recorded yet": "belum ada yang tercatat"
  "every communication carries evidence": "setiap komunikasi punya bukti"
  "none carries evidence, so each reads as what its recorder wrote down": "tidak ada yang punya bukti, jadi masing-masing dibaca sebagai apa yang ditulis pencatatnya"
  "1 communication carries no evidence and reads as what its recorder wrote down": "1 komunikasi tidak punya bukti dan dibaca sebagai apa yang ditulis pencatatnya"
  "%d communications carry no evidence and read as what their recorder wrote down": "%d komunikasi tidak punya bukti dan dibaca sebagai apa yang ditulis pencatatnya"
  "In, said by the stakeholder to the project": "Masuk, disampaikan stakeholder ke proyek"
  "Out, said by the project to the stakeholder": "Keluar, disampaikan proyek ke stakeholder"
  "%s: from %s to %s, by %s, at %s": "%s: dari %s ke %s, lewat %s, pada %s"
  ", in ": ", di "
  ", part of the source ": ", bagian dari sumber "
  ". Recorded by ": ". Dicatat oleh "
  ", build ": ", build "
  ". Invited: %s. Present: %s. Absent: %s.": ". Diundang: %s. Hadir: %s. Tidak hadir: %s."
  " Result: ": " Hasil: "
  " Recorded by ": " Dicatat oleh "
  "UTC, since the specification declares no time zone": "UTC, karena spesifikasi tidak mendeklarasikan zona waktu"
  "# %s: timeline": "# %s: timeline"
  "Version %s of the specification: %s in one time order, from the records beside it and the specification's decisions: communications, sessions, test sessions, test runs, deploys, releases, commissioning runs, incidents, defects, change requests, ideas, decisions and approvals. An event with an instant is placed at it; one with a date alone is placed at the start of that day in the specification's time zone (%s) and shown by its date; one whose record gives no date yet, such as a planned release, comes last. Then the same events by stakeholder, by requirement, decision or element, and by release.": "Spesifikasi versi %s: %s dalam satu urutan waktu, dari record di sampingnya dan keputusan di spesifikasi: komunikasi, session, test session, test run, deploy, release, commissioning run, insiden, defect, change request, ide, keputusan, dan approval. Event yang punya waktu persis ditempatkan pada waktu itu; event yang hanya punya tanggal ditempatkan di awal hari itu menurut zona waktu spesifikasi (%s) dan ditampilkan dengan tanggalnya; event yang record-nya belum punya tanggal, seperti release yang direncanakan, ditaruh paling akhir. Setelah itu event yang sama per stakeholder, per requirement, keputusan, atau elemen, dan per release."
  "event": "event"
  "events": "event"
  "This document is for everyone: what touches an internal element is left out.": "Dokumen ini untuk semua orang: apa pun yang menyentuh elemen internal tidak dimuat."
  "Every event": "Semua event"
  "| When | Event | What | Links |": "| Kapan | Event | Apa | Tautan |"
  "No event names it.": "Tidak ada event yang menyebutnya."
  "By requirement, decision and element": "Per requirement, keputusan, dan elemen"
  "No event touches a requirement, a decision or an element.": "Tidak ada event yang menyentuh requirement, keputusan, atau elemen."
  "By release": "Per release"
  "No event names a release.": "Tidak ada event yang menyebut release."
  "Result: ": "Hasil: "
  " Present: %s; absent: %s.": " Hadir: %s; tidak hadir: %s."
  "%s: deploy of %s to %s by %s": "%s: deploy %s ke %s oleh %s"
  "%d passed, %d failed, %d errored, %d skipped, %d mapping to no test.": "%d passed, %d failed, %d errored, %d skipped, %d tidak terpetakan ke test."
  "%s: test run in %s by %s": "%s: test run di %s oleh %s"
  "Includes nothing recorded.": "Tidak memuat apa pun yang tercatat."
  "release %s, %s": "release %s, %s"
  "%s passed, %s failed.": "%s passed, %s failed."
  "check": "pengecekan"
  "checks": "pengecekan"
  " Signed off by %s on %s.": " Di-sign-off oleh %s pada %s."
  "commissioning run of %s on %s by %s": "commissioning run %s di %s oleh %s"
  "%s: incident on %s, %s": "%s: insiden di %s, %s"
  "%s: defect reported by %s, %s": "%s: defect dilaporkan oleh %s, %s"
  "%s: change request raised by %s": "%s: change request diajukan oleh %s"
  "%s: change request %s by %s": "%s: change request %s oleh %s"
  "%s: idea raised%s, %s": "%s: ide diajukan%s, %s"
  "%s: idea %s by %s": "%s: ide %s oleh %s"
  "approval of %s by %s": "approval %s oleh %s"
  "Documents: ": "Dokumen: "
  " Decided by ": " Diputuskan oleh "
  "%s: decision, %s": "%s: keputusan, %s"
  "no date": "tanpa tanggal"
