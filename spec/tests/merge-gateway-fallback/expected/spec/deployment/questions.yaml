questions:
  # specarch-problem: question: open_question: (must, decision) What is each setting for, where does its value come from, and is it a secret: SHADOW? Decided by system-owner. Answer with a decision record that names Q-27 under answers. [Q-27]
  Q-27:
    question: 'What is each setting for, where does its value come from, and is it a secret: SHADOW?'
    kind: decision
    priority: must
    blocks: ['#/configuration/shadow/description', '#/configuration/shadow/secret']
    decidedBy: system-owner
    why: The source names the settings it reads and not what they are for; whether one is a secret is said only where the source marks it sensitive.
  # specarch-problem: question: open_question: (should, decision) Is each of these settings no secret, as an address is not: catalogueUrl, loansUrl? Decided by system-owner. Answer with a decision record that names Q-36 under answers. [Q-36]
  Q-36:
    question: 'Is each of these settings no secret, as an address is not: catalogueUrl, loansUrl?'
    kind: decision
    priority: should
    blocks: ['#/configuration/catalogueUrl/secret', '#/configuration/loansUrl/secret']
    decidedBy: system-owner
    why: The gateway table names the setting an address is read from and not whether it is sensitive.
  # specarch-problem: question: open_question: (must, decision) Is each of these settings a secret: reportsApiKey? Each name says it may hold a credential, and the gateway table reads an address from it. Decided by system-owner. Answer with a decision record that names Q-37 under answers. [Q-37]
  Q-37:
    question: 'Is each of these settings a secret: reportsApiKey? Each name says it may hold a credential, and the gateway table reads an address from it.'
    kind: decision
    priority: must
    blocks: ['#/configuration/reportsApiKey/secret']
    decidedBy: system-owner
    why: A secret's value is never written in a specification, and the name alone does not say which a setting is.
