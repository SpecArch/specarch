specarch: "0.1"
info:
  title: Pages of site/app
  version: 0.1.0
  description: |
    The pages and operations the file-system router rooted at site/app serves, read from the files git tracks there at commit afbd90b6d33a0306821d89a9566d5463da28fd33, with the content of each page that has a schema file from that file. Every page and operation cites its file; what the files' places and the schemas do not say is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
  code:
    kind: code
    title: The code repository
    edition: afbd90b6d33a0306821d89a9566d5463da28fd33
    url: ../repo
    clauses:
      - {clause: site/app/api/health/route.ts, title: The route file of /api/health}
      - {clause: 'site/app/api/loans/[loanId]/route.ts', title: 'The route file of /api/loans/{loanId}'}
      - {clause: site/app/api/loans/route.ts, title: The route file of /api/loans}
      - {clause: 'site/app/loans/[loanId]/page.tsx', title: 'The page file of /loans/{loanId}'}
      - {clause: site/app/loans/new/actions.ts, title: 'Source the router''s files import, read through the code-facts dump'}
      - {clause: site/app/loans/new/page.tsx, title: The page file of /loans/new}
      - {clause: site/app/loans/page.schema.ts, title: The schema of the page at /loans}
      - {clause: site/app/loans/page.tsx, title: The page file of /loans}
      - {clause: site/lib/auth.ts, title: 'Source the router''s files import, read through the code-facts dump'}
      - {clause: site/lib/schemas.ts, title: 'Source the router''s files import, read through the code-facts dump'}
      - {clause: site/middleware.ts, title: Middleware the router runs before the routes it covers}
