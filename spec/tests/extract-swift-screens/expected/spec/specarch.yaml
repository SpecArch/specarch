specarch: "0.1"
info:
  title: Swift source of app
  version: 0.1.0
  description: |
    The Swift source under app, read at commit f9e2706ec00fc4821849aab40a089d04d71000e3 by SwiftSyntax 604.0.0 through the code-facts dump, by its syntax alone, with the property lists, build settings and Core Data models there read as data. Every element cites the line that declares it; what the source does not say as a literal, or through an idiom the reader knows, is a question, and so is what the meta-model cannot hold.
  tracksOrigin: true
stages: [requirements, design]
sources:
