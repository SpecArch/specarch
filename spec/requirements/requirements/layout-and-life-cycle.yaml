# yaml-language-server: $schema=../../../schema/specarch-fragment-requirements-1.0.schema.json
requirements:
  SA-11:
    statement: A specification shall be a folder tree with one root file, specarch.yaml, and one folder per life-cycle stage it keeps, in which a file holds one or a few objects of one kind.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A tree whose root lists its stages and holds each stage's files under that folder validates.
      - A file in the wrong folder, a section in the wrong file, a listed stage without a folder, and a folder that is not a stage are each reported as layout.
    verification: test
    needs: [NEED-4]
    why: One file for a whole system grows past what a reader can navigate; a tree whose folder names say what is inside lets the reader walk to a thing.
  SA-12:
    statement: A specification shall be able to hold every stage of the life cycle, from stakeholders and needs through requirements, design, implementation, tests, deployment, commissioning and operation, each optional until the project reaches it.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A specification with only a requirements stage validates with no error.
      - A requirement no design element satisfies, a requirement no test, check or monitor verifies, and a need no requirement refines are reported as warnings once the later stage exists.
    verification: test
    needs: [NEED-5]
    cites:
      - source: iso-12207
        clause: "6.4"
        says: "The technical processes run from business or mission analysis and stakeholder needs definition (6.4.2) through requirements definition (6.4.3), design (6.4.4 and 6.4.5), implementation (6.4.7), verification (6.4.9), transition (6.4.10) and validation (6.4.11)."
      - source: iso-29148
        clause: "6.3 and 6.4"
        says: "Stakeholder needs are defined first and then transformed into system requirements; each requirement carries attributes and traces to its source."
  SA-23:
    statement: The validator shall check the records kept beside a specification (change requests, defects, releases, incidents, commissioning runs and approvals) against their schema and against the specification they point into, without the specification pointing back at them.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A record whose file name is not its ID or version, or that sits in another kind's folder, is reported as record_name.
      - A record naming a role, requirement, pointer, test, environment or monitor the specification does not have is reported as record_ref, unless the ID falls in a declared change-set or defect-set.
      - An implemented change whose additions are not in the specification, a change approved without a decision, a fixed defect without a test that shows the fix, a duplicate of a duplicate, and a commissioning run naming a check that does not exist are each reported under their rule.
      - A resolved incident that leads to no defect and no change, and says nothing in noChange, is reported as a warning.
    verification: test
    needs: [NEED-5]
    why: A change, a defect or a release happens once and moves through statuses; kept in the specification it would turn it into a change log, and kept nowhere it could not be checked against what the specification says.
    cites:
      - source: iso-12207
        clause: "6.3.5 and 6.4.13"
        says: "Configuration management records and controls changes to the system and its baselines; maintenance handles the problems and modification requests raised after transition."
  SA-24:
    statement: The system's version shall be the specification's info.version under Semantic Versioning 2.0.0, and the validator shall check each released version against the release before it and against what it includes.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A released release that includes a change still approved, or a released change whose release does not include it, is reported as release_contents.
      - A release that includes a major change but steps only the minor number after 1.0.0, or only the patch number before it, is reported as release_bump.
      - An info.version that is not the newest released version, and not a later pre-release whose release is planned, is reported as release_version.
      - A requirement's release that is not a release record, or names a withdrawn one, is reported as record_ref, and the test plan groups the requirements by release.
    verification: test
    needs: [NEED-5]
    why: A version number is a promise to everyone who depends on the system; one that steps less than its contents say breaks a client that trusted it.
    cites:
      - source: semver
        clause: "rules 4, 6 to 9 and 11"
        says: "A major version zero is for initial development; patch, minor and major versions step for fixes, additions and incompatible changes; a pre-release version is marked with a hyphen; precedence compares major, minor and patch numerically, and a pre-release ranks below its normal version."
  SA-25:
    statement: The toolchain shall compare two versions of a specification, list what was added, changed and removed with the version step each needs, and check the release of the later version against that list.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - Two versions that differ in one operation, one entity and one requirement are listed as three lines, each with its impact.
      - A release that steps less than the largest change, or that includes no change request or defect naming a changed element, is reported and the command exits 1.
      - An invalid specification on either side is compared as far as it can be read, its errors are printed, and the command exits 1.
    verification: test
    needs: [NEED-5]
    why: A release record says what a release carries; only a comparison of the two versions shows whether the specification changed that way.
  SA-13:
    statement: Every element of a specification, at every stage, may carry a rationale (why) and citations of declared sources (cites), and the validator shall check that every citation names a declared source.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An element with why and cites validates, and a citation of a source that is not declared is reported as source.
    verification: test
    needs: [NEED-6]
    cites:
      - source: iso-29148
        clause: "5.2.8"
        says: "Rationale and source are attributes every requirement should carry."
  SA-73:
    statement: A specification shall say who runs each environment, the team that builds the system or the customer, and for an environment the customer runs it shall hold a handover, what the customer receives to build, install and run it and what stays whose responsibility, which specarch document shall write for the customer's engineers.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An environment marked runBy customer in a specification with no handover, no release or no rollback is reported as handover at the environment, a handover in a specification with no environment the customer runs is reported as handover, and a handover whose to names no stakeholder is reported as stakeholder, the same in both builds.
      - An environment the customer runs with no commissioning check in it, no monitor in it, or no backup and restore procedure is a warning at the environment, held by a must question that blocks the section.
      - An implementation's deployment of an environment the customer runs without build, method or infrastructure is reported as handover at the deployment, and a build naming a task the file does not have is reported as build_task.
      - specarch document handover writes handover.md with what the customer receives, the responsibilities, each implementation's build with its toolchain, base images and the licences of its dependencies, what the hosts must provide, every setting, the migrations, the release, rollback, backup and restore steps, the monitors, the checks and acceptance tests in that environment and the sign-off sheet, in plain words a reader with no SpecArch knowledge follows; a specification with an output folder for it and no handover is passed over with a warning.
      - A specification without runBy, handover, backup, restore, build, method or infrastructure gets the same deployment guide and technical specification as before.
    verification: test
    needs: [NEED-5]
    why: Regulated customers take the source into a repository of their own and build and run production themselves; a deployment guide written for the vendor's hosts says nothing to them, and a handover written by hand drifts from the specification.
    cites:
      - source: iso-12207
        clause: "6.4.10"
        says: "The transition process establishes the capability to provide the service in its operational environment."
  SA-96:
    statement: An installed specarch, with no source checkout or docs folder, shall say what it can do and how to use it, from the definitions it was built with, for a person and for a program; every command shall take --json, printing one JSON object on standard output and on a failure one error object with a stable code on standard error; every command that writes shall take --dry-run, listing each file it would write and writing nothing; and no command shall ask anything.
    kind: interface
    priority: should
    status: accepted
    acceptance:
      - specarch help prints the usage and the topics; specarch help <topic> prints the area's guide or the command's reference made from its definition, with each option, what it prints and writes, and each exit status with its remedy; an unknown topic is exit status 2 naming the topics.
      - specarch capabilities --json prints one object whose tools hold one entry per command, each with a name, a description, an inputSchema in JSON Schema draft 2020-12 whose properties are exactly the command's arguments and options, its outputs and its exit codes; and one entry per target the plug-ins on PATH write, each plug-in answering --capabilities with its target, what it writes and what it does not write.
      - specarch guide --agent prints the workflow, how to read problems, when to ask the owner, the limits and the conventions, the facts capabilities --json lists under the same names, and the repository's AGENTS.md holds the same text up to the plug-ins found.
      - A command or an option the program takes with no definition in the specification, or a definition the program does not take, fails the build's tests.
      - Every command run with --json prints exactly one JSON object on standard output and nothing else, and on exit status 2 exactly one error object on standard error naming a code from the listing's errorCodes.
      - Every command that writes, run with --dry-run, writes nothing and lists, as would write <path> or would remove <path>, each file the same run without it writes or removes.
      - No command reads standard input, except a plug-in, which reads its request there, and specarch mcp, which reads the messages of its client there.
    verification: test
    needs: [NEED-7]
    why: The installed program is often all a person, a CI job or an agent has; a description built from the same definitions as the program cannot name a flag it lacks, a JSON form lets a program drive it without parsing text, and a dry run shows each file before any is written.
  SA-119:
    statement: SpecArch shall explain every feature by the situation it is for, in one guide organised by situation rather than by command, for people and for agents, in English and in Indonesian, each situation saying when it happens, what to run, a worked example with the output the program prints, what to watch for and where the deeper document is; the installed program shall print the same situations as a help topic; and every command, document target, extract source, plug-in, help topic and format shall appear in at least one situation, checked by the build's tests so the guide cannot drift from the program.
    kind: interface
    priority: should
    status: proposed
    acceptance:
      - specarch help situations prints one entry per situation, each with its id, when it happens, what to run and the topic or command that explains it, within 80 columns, and names the full guide's file.
      - docs/guide-by-situation.md and docs/id/guide-by-situation.md hold the same situation ids in the same order, and the help topic holds the same ids in the same order.
      - Every command the specification defines, every document target, every extract source, every plug-in in the repository, every help topic and every format the program reads is named in both guides; a feature missing from either guide fails the build's tests, as does a situation in one guide and not the other.
      - specarch guide and specarch guide --agent name specarch help situations as the way to find the feature for a situation.
    verification: test
    needs: [NEED-7]
    why: The facts a person or an agent needs to pick a feature are spread over the agent guide, the capabilities listing, the help topics, the manual and the design documents, each organised by command; a person in a situation does not know which command to look up, and a guide that is not checked against the program names features it no longer has within a release or two.
  SA-112:
    statement: An installed specarch shall offer every command to an agent's client as a tool of the Model Context Protocol over standard input and output, and shall write an agent skill in the Agent Skills format, both made from the command definitions it was built with, with no network and no prompts.
    kind: interface
    priority: should
    status: proposed
    acceptance:
      - specarch mcp answers initialize, ping, tools/list and tools/call over the stdio transport, one JSON-RPC 2.0 message per line on standard output and nothing else there, and exits 0 when standard input ends.
      - Its tools/list holds exactly the tools capabilities --json lists but its own, each with the same name, title, description, inputSchema and annotations.
      - Its tools/call runs the command with --json and answers with the object that run prints, exit status 2 marked as an error; an input the tool does not take, a required one left out or one of the wrong type is answered as an error naming it, before anything runs.
      - specarch skill --out <folder> writes <folder>/specarch/SKILL.md, whose body is the agent guide up to the plug-ins, and one reference per command made from its definition; --check fails when a file differs; the repository holds the skill the program writes, and the build's tests fail when it differs.
    verification: test
    needs: [NEED-7]
    why: An agent uses a tool it is handed and a skill it has loaded far more readily than a command a repository tells it about; made from the same definitions as help and capabilities, neither can name an input the program does not take (ADR-214).
  SA-101:
    statement: The validator shall check, in both builds, the ideas kept beside a specification, one record each in records/ideas/, holding a proposal for the specification from a conversation, a table, an example, a document, code, a recording or a review, the element it is about, the text it proposes and its status as a person set it, against the record schema and the specification; and decision why and decision rests shall name, on each decision's line, the ideas that became it.
    kind: functional
    priority: must
    status: proposed
    acceptance:
      - Ideas in every status, proposed, discussed, accepted, rejected and question, each naming only what the specification and its records have, validate with nothing printed and exit 0; an open idea may be about an element the specification does not have yet under one it has or under a section of the meta-model.
      - An idea naming a role, a source, a requirement, a pointer, a decision, a question, a change or a defect that the specification or its records do not have is reported as record_ref at the key; an accepted or rejected idea's about is not checked; a question a decision answers is still a question an idea may name.
      - An accepted idea without a decision whose outcome is accepted, or a rejected one without a decision whose outcome is rejected, is reported as idea_decision; an idea whose status is question naming no question under became is reported as idea_question.
      - The Go build and the Swift build print the same lines on each case.
      - decision why and decision rests print "from idea" and the IDs of the ideas whose became names the decision on that decision's line.
    verification: test
    needs: [NEED-5, NEED-10]
    why: A proposal that is not yet part of the specification is lost when it is only said, and once it is in the text nobody can tell what was proposed, by which way it came in, and what was turned down and why; kept as a record it is checked like the other records, the person's decision on it is written down, and the decision it became can be traced back to it (ADR-196).
  SA-117:
    statement: A specification shall keep beside it, as records in records/, who said what to whom and when - a communication record for each thing a stakeholder said or was told, with its direction, roles, instant with offset, channel, type, words marked verbatim or summary, evidence hashed with SHA-256 or none, and the questions, decisions, elements, changes, defects and ideas it touches; a session record with its attendance by role; a test session record with its level, environment, version, build, attendance and result; and a deploy record with its version, environment, instant, actor and result - which the validator shall check in both builds, a citation shall be able to rest on, and the communications and timeline documents shall be written from.
    kind: functional
    priority: must
    status: proposed
    acceptance:
      - Communications of every type, an answer with evidence whose SHA-256 matches, a question with its reply, a request, information from a call with no evidence and an objection, a session and a test session with invited and present, a deploy, an interview source with at and participants, a decision citing the answer record and a requirement citing the information record, each naming only what the specification and the records have, validate with nothing printed and exit 0.
      - A communication, session, test session or deploy record naming a role, a question, a decision, an element, a change, a defect, an idea, a session or a source that the specification or its records do not have is reported as record_ref at the key; a question a decision answers is still a question a record may link.
      - Evidence naming a file that is not under records/, or whose SHA-256 is not the one recorded, is reported as evidence at the key, with the hash the file has now.
      - A citation naming a communication record that does not exist, or one whose type is a request, a question or an objection, is reported as record_cited at the citation; so is a decision that answers questions citing an answer record that links none of them.
      - A stakeholder that an accepted requirement needs, or that a page of an approved specification is for, while no communication names it, no session lists it present, no interview lists it and no decision is by it, is warned as unheard at the stakeholder, naming the requirements and pages; with no communication, session or test session record kept yet, every such stakeholder is warned, the warning adding that none is kept yet and to start by logging the first conversation, and one communication record naming a role clears that role alone.
      - The Go build and the Swift build print the same lines on each case.
      - document communications writes every communication, session and test session in time order and then per stakeholder and per element, a person label left out of a document for everyone; document timeline writes every event of the records and the specification in one time order, a date-only event at the start of its day in the specification's time zone, then by stakeholder, by element and by release; neither is a draft.
    verification: test
    needs: [NEED-5, NEED-6, NEED-10]
    why: Real requirements come from conversations, meetings, chats and emails that leave no record of who said what and when; kept as records beside the specification, checked like the others and cited by the decisions they led to, a stakeholder's words are traceable, a changed attachment shows, and a role nobody heard shows before it objects at acceptance (ADR-220).
    cites:
      - source: iso-29148
        clause: "6.4.3"
        says: "Each requirement is traceable to its source: the stakeholder need or the document it comes from."
  SA-132:
    statement: SpecArch shall write a progress document from a specification and the records beside it, counting only what they hold - the specification's size as its elements by stage and section, the open questions by priority and by the role that decides them, the roles warned unheard, whether a role has confirmed the stakeholder list complete, the effort recorded on each change request with the change requests that record none counted and named as missing, and a burn-up of the elements the change requests of each release name, approved and generated, cumulative from release to release - and shall invent no estimate.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - document progress writes progress.md with the elements of each stage and section, the open questions by priority and by deciding role, the unheard roles, the stakeholder list's confirmation or the line that it is not confirmed, the effort table and the burn-up table, and exits 0.
      - A change request without effort, or whose effort holds no positive number of hours, is counted as missing effort and named, with no figure in its place; a value that is not a positive number is shown as written and marked not counted; the hours recorded are summed estimated and spent apart, and no total, average or forecast is made from fewer records than are counted.
      - An open question whose priority is not must, should or could is counted under another priority and named with the value as written, a question with no decidedBy is counted on a row that says so, and the rows of the open-work table add up to its total.
      - Two releases give two points in the burn-up, in version order, each the cumulative count of distinct elements the included change requests name in affects (adds and changes), a requirement named by its ID and by its pointer once and a pointer inside an element as that element, a reference to what the size does not count named with why and left out, approved once the request's decision approves it and it is not withdrawn or rejected, and generated once it is implemented or released, beside the elements the specification holds now.
      - A change record with effort estimatedHours or spentHours, each a positive number of hours, validates in both builds; an empty effort, a value that is not a positive number, or a key that is not one of them or an extension key, is an error at the key.
      - The progress document is never a draft, and with --audience external it leaves the elements and questions of the internal elements out of its counts.
    verification: test
    needs: [NEED-5, NEED-10]
    why: A team that delivers from a specification is asked how big it is, what is still open and with whom, and how far it has come; answered from what the specification and its records hold, the answer is the same for everyone who asks, and an effort nobody recorded shows as missing instead of being guessed (ADR-237).
  SA-125:
    statement: A specification shall keep beside it, as records in records/test-runs/, each run of its tests - the environment, the version, the build, the specification's digest, the instant with its offset, the role that ran it, the results file as evidence and each result with the test it maps to, its outcome, its message and the defect it opened - and specarch log test-run shall write one from a JUnit XML file, mapping each testcase to a test by the names the test generators write, keeping and reporting a testcase that maps to no test, and opening a defect for a failure only for a test it is told to; the validator shall check the record in both builds, and the testruns document shall write the runs and the failures per element and per requirement, run by run.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - log test-run with a JUnit XML file under records/, the environment, the instant and the role writes records/test-runs/TR-<n>.yaml under the next number, with the file as evidence with its SHA-256 and one result per testcase in the file's order, each mapped to its test by its name, Test or test and the name in Pascal case, or the name and a colon, and exits 0.
      - A testcase whose name is a test the generators write for an algorithm's or a call mapping's worked examples names that algorithm or the path of the operation under element, with no test and no unmapped line, and counts for that element in the testruns document.
      - A testcase whose name maps to no test and no element, or to two, is kept in the record without either, printed as an unmapped line naming it and why, and listed under log.unmapped with --json; validate warns test_unmapped at that result.
      - log test-run without the results file, the environment, the instant or the role prints one line per missing option and writes nothing, with exit 1; it refuses a results file outside records/ or not JUnit XML, one with no testcase, an environment, version, role or digest the specification and its records do not have, and an --open-defect for a test that did not fail in the run, or without --severity and --phase.
      - With --open-defect naming a failed test, it writes records/defects/DEF-<n>.yaml, reported, violating the requirements the test verifies or the element it is about, naming the test, observed from the failure's message and expected from the test's then, and links it from the result.
      - A test-run record naming an environment, a version, a role, a test or a defect the specification or its records do not have is reported as record_ref at the key, in the Go build and the Swift build alike.
      - document testruns lists the runs oldest first with their passed, failed, errored, skipped and unmapped counts, then the failures per element and per requirement with one column per run and the open defects, then the unmapped results; the timeline places each run at its instant.
    verification: test
    needs: [NEED-5, NEED-10]
    why: Whether the tests passed is known only to the build that ran them, in a results file a CI job throws away; kept as a record with each result tied to the test and so to the elements and requirements it verifies, the question of which requirement was shown met on which build and which element keeps failing is answered from the records, and a testcase the specification does not know shows instead of being lost (ADR-230).
    cites:
      - source: iso-29119-3
        clause: "8"
        says: "Actual results, test results and the test execution log are dynamic test documentation items: what was run, when, and with what outcome."
  SA-127:
    statement: specarch compare shall write, for alternative implementation files of one specification, one table as Markdown and JSON from each implementation's test-run record or JUnit XML results file, the scan of its software bill of materials and a measurements file - the derived cases passed, the latency and throughput beside the requirements a measurement names, the libraries with their licences, the scan findings, the build time, the lines of code and the deploy steps - marking every missing result as a gap in its cell and in a list of gaps rather than stopping, and printing the source entry by which a decision cites the comparison.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - compare with two implementation files of the specification, each with a JUnit XML results file or a test-run record, a scan and a measurements file under records/, prints the table as Markdown with one column per implementation in the order given, and with --out writes comparison.md and comparison.json and prints their paths and the sources entry, and exits 0.
      - A derived case shows failed when a result of a test that covers it failed or errored, passed when one passed, skipped when one was skipped, and gap with no test or not run otherwise; a requirement a measurements file names shows each implementation's value and unit beside the requirement's statement.
      - An implementation with no results, no scan or no measurements, or a measurements file that leaves out a key another gives, is written gap in each cell it leaves empty, with the reason, and listed under Gaps with the option that fills it, and compare exits 0.
      - compare refuses, with exit 1 and nothing written, an implementation file that is not the specification's, an option whose name is no implementation given, --test-run and --results for one implementation, a test-run record the records do not hold, and an input file outside records/, unreadable or not of its format.
      - A decision that cites the comparison through the sources entry compare printed validates without an error.
    verification: test
    needs: [NEED-2, NEED-6]
    why: Choosing between two implementations of one design is a decision taken from CI logs, scan reports and what people remember of the build; one table built from the kept inputs, every missing result marked rather than left blank and the comparison cited by the decision as a source, makes the choice quick to take and to review and keeps it traceable to its evidence (ADR-232).
