specarch: "1.0.0"
info: { title: Case, version: 1.0.0 }
stakeholders:
  owner: { description: The product owner. }
  librarian: { description: Runs the lending desk. }
  member: { description: Borrows books. }
stakeholdersComplete: { by: auditor, date: "2026-11-03" }
needs:
  NEED-1:
    statement: Members may not take more than they bring back.
    stakeholders: [librarian, member]
requirements:
  CASE-1:
    statement: A member shall borrow at most five books at once.
    kind: functional
    priority: must
    status: accepted
    acceptance: [A sixth loan is refused.]
    needs: [NEED-1]
  CASE-2:
    statement: A member shall see the loans they hold.
    kind: functional
    priority: should
    status: proposed
    acceptance: [The member's page lists each open loan.]
    needs: [NEED-1]
entities:
  Loan:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
    required: [id]
    primaryKey: [id]
    satisfies: [CASE-1, CASE-2]
environments:
  production: { description: The live system. }
questions:
  Q-1:
    question: How long may a member keep a book?
    kind: decision
    priority: must
    blocks: ["#/entities/Loan"]
    decidedBy: owner
  Q-2:
    question: Is a loan renewed by the desk alone?
    kind: decision
    priority: should
    blocks: ["#/requirements/CASE-2"]
    decidedBy: librarian
  Q-3:
    question: Should the desk see a member's past loans?
    kind: decision
    priority: Could
    blocks: ["#/requirements/CASE-2"]
