openapi: 3.0.3
info:
  title: Lending desk API
  version: 1.0.0
  description: The interface the desk's terminals call. Renewals are planned for the next release.
security:
  - deskStaff: []
paths:
  /members:
    post:
      operationId: registerMember
      summary: Register a new member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Member" }
      responses:
        "201":
          description: The member, registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /members/{cardNumber}/loans:
    parameters:
      - name: cardNumber
        in: path
        required: true
        description: The number printed on the member's card.
        schema: { type: string, pattern: "^[0-9]{10}$", example: "0000012345" }
    get:
      operationId: listMemberLoans
      summary: List the loans of one member
      responses:
        "200":
          description: The member's loans, open and returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Loan" }
  /loans:
    post:
      operationId: lendBook
      summary: Lend a book to a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card_number: { type: string, pattern: "^[0-9]{10}$" }
                barcode: { type: string, maxLength: 20 }
              required: [card_number, barcode]
      responses:
        "201":
          description: The new loan, with its due date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "409":
          description: The member already has the most books on loan at a time.
  /loans/{loanId}/return:
    parameters:
      - name: loanId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
    post:
      operationId: returnBook
      summary: Check a returned book in, which closes the loan
      responses:
        "200":
          description: The closed loan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
  /loans/{loanId}/renew:
    parameters:
      - name: loanId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
    post:
      operationId: renewLoan
      summary: Renew a loan once, for one more loan period
      responses:
        "200":
          description: The loan, with its new due date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "409":
          description: The loan was renewed already, or is past its due date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenewalRefusal" }
  /loans/{loanId}/write-off-requests:
    parameters:
      - name: loanId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
    post:
      operationId: requestWriteOff
      summary: Ask for a lost book's loan to be written off, which a desk supervisor approves
      responses:
        "202":
          description: The request is accepted and waits for a desk supervisor.
components:
  securitySchemes:
    deskStaff:
      type: http
      scheme: bearer
  schemas:
    Member:
      type: object
      properties:
        card_number: { type: string, pattern: "^[0-9]{10}$" }
        full_name: { type: string, maxLength: 200 }
        address: { $ref: "#/components/schemas/Address" }
      required: [card_number, full_name]
    Address:
      type: object
      description: Where a member lives.
      properties:
        street: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        postcode: { type: string, maxLength: 20 }
      required: [street, city]
    Loan:
      type: object
      properties:
        id: { type: integer, format: int64, readOnly: true }
        card_number: { type: string, pattern: "^[0-9]{10}$" }
        barcode: { type: string, maxLength: 20 }
        loaned_on: { type: string, format: date }
        due_on: { type: string, format: date }
        returned_on: { type: string, format: date, nullable: true }
      required: [id, card_number, barcode, loaned_on, due_on]
    RenewalRefusal:
      type: object
      description: Why a loan cannot be renewed, answered to the desk and never kept.
      properties:
        reason: { type: string, enum: [renewed_already, past_due] }
        due_on: { type: string, format: date }
      required: [reason, due_on]
