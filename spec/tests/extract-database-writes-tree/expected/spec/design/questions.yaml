  Q-3:
    question: Table public.notes has no primary key in the catalogue. Which fields identify one of its records?
    kind: decision
    priority: must
    blocks: ['#/entities/Notes/primaryKey']
    decidedBy: system-owner
    why: Every entity names the fields that identify a record, and the catalogue gives none for this table.
