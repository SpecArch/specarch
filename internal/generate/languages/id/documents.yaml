translations:
  "# %s: requirements specification": "# %s: spesifikasi requirement"
  "Version %s of the specification: %s, %s and %s. The order follows the requirements specification of ISO/IEC/IEEE 29148: who has a stake, what they need, then each requirement with its attributes.": "Spesifikasi versi %s: %s, %s, dan %s. Urutannya mengikuti spesifikasi requirement ISO/IEC/IEEE 29148: siapa yang berkepentingan, apa yang mereka butuhkan, lalu tiap requirement dengan atributnya."
  "stakeholder": "stakeholder"
  "stakeholders": "stakeholder"
  "need": "kebutuhan"
  "needs": "kebutuhan"
  "requirement": "requirement"
  "requirements": "requirement"
  "Purpose and scope": "Tujuan dan cakupan"
  "Owners: ": "Pemilik: "
  "Stakeholders": "Stakeholder"
  "| Stakeholder | Who they are | Concerns |": "| Stakeholder | Siapa mereka | Kepentingan |"
  "Needs": "Kebutuhan"
  "What the stakeholders said they need, before it was shaped into requirements, and the requirements that refine each need.": "Apa yang menurut stakeholder mereka butuhkan, sebelum dibentuk menjadi requirement, beserta requirement yang merinci tiap kebutuhan."
  "| Need | Statement | Stakeholders | Status | Refined by |": "| Kebutuhan | Pernyataan | Stakeholder | Status | Dirinci oleh |"
