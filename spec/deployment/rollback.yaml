# yaml-language-server: $schema=../../schema/specarch-fragment-deployment-0.3.schema.json
rollback:
  description: A user who hits a problem in a release installs the previous tag; the tags of every release stay.
  steps:
    - name: Install the previous tag
      action: Install the program from the previous release tag with the implementation's install task.
      check: specarch version prints the previous version.
    - name: Record the problem
      action: Add a BUG-NNN entry naming the release and the problem to BUG_OUTSTANDING.md, and note the rollback in the history file.
      check: The entry is in BUG_OUTSTANDING.md and the history file names it.
