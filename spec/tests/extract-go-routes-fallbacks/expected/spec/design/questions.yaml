  # specarch-problem: question: open_question: (must, decision) chifallback/router.go:13 registers every method under /assets with the rest of the path matched by *, a catch-all that takes every request under the prefix. What does its handler answer or forward, and by which claim of the token does it pick the service? It blocks design. Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: chifallback/router.go:13 registers every method under /assets with the rest of the path matched by *, a catch-all that takes every request under the prefix. What does its handler answer or forward, and by which claim of the token does it pick the service?
    kind: decision
    priority: must
    blocks: [design]
    decidedBy: system-owner
    why: A route whose path ends in a catch-all takes every request under its prefix, as a fallback handler takes every request no route answers; a path parameter holds one segment, so no operation is written, and syntax cannot tell a gateway from a file server.
    cites:
      - {source: code, clause: 'chifallback/router.go:13', says: Registers every method /assets/*.}
