# yaml-language-server: $schema=../../../../../schema/specarch-fragment-deployment-1.0.schema.json
environments:
  development:
    description: A developer's machine, with a throwaway database.
    promotesTo: staging
  staging:
    description: A copy of production the librarians try a release on before it goes live.
    promotesTo: production
  production:
    description: The live system at the desk, on the library's own hosts.
    runBy: customer
    why: The library's board keeps member data on hosts it controls, so its IT staff build each release from the source and run production themselves; the vendor runs development and staging.
