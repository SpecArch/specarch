# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/main/schema/specarch-design-0.1.schema.json
specarch: "0.1"

info:
  title: Library Lending
  version: 0.1.0
  description: |
    A small public library lends books to its members. Members borrow a copy,
    keep it for a fixed loan period, and pay a late fee when they return it
    after the due date. This example exists to exercise every concept of
    meta-model 0.1 in one place; it is not a real library's system.
  owners: [example-maintainers]

requirementSources:
  LIB:
    description: Requirement list for the lending example, kept in `library-lending.specarch-design.md` under "Requirements".

enums:
  LoanStatus:
    type: string
    enum: [open, overdue, returned, lost]
    valueDescriptions:
      open: the copy is with the member and the due date has not passed
      overdue: the due date has passed and the copy is still out
      returned: the copy is back on the shelf
      lost: the member reported the copy lost; the replacement cost was charged
  MembershipTier:
    type: string
    enum: [standard, extended]
    valueDescriptions:
      standard: up to 3 open loans, 21-day loan period
      extended: up to 6 open loans, 28-day loan period

entities:
  Member:
    description: A person with a library card.
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      cardNumber:
        type: string
        pattern: "^[0-9]{8}$"
        description: Printed on the card; assigned when the member joins.
      fullName: { type: string, minLength: 1, maxLength: 200 }
      email: { type: string, format: email, maxLength: 320 }
      tier: { $ref: "#/enums/MembershipTier" }
      joinedOn: { type: string, format: date, readOnly: true }
      outstandingFees:
        type: string
        format: decimal
        precision: 10
        scale: 2
        description: Sum of unpaid late fees and replacement charges, in the library's currency.
        readOnly: true
    required: [id, cardNumber, fullName, email, tier, joinedOn, outstandingFees]
    primaryKey: [id]
    relations:
      loans: { target: Loan, kind: one-to-many, via: memberId }
    constraints:
      member_card_number_unique:
        kind: unique
        fields: [cardNumber]
        message: A member with this card number already exists.
        requirements: [LIB-1]
      member_email_unique:
        kind: unique
        fields: [email]
        message: A member with this email address already exists.
    requirements: [LIB-1]

  Book:
    description: A title the library owns, with the number of physical copies.
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      isbn: { type: string, pattern: "^[0-9]{13}$" }
      title: { type: string, minLength: 1, maxLength: 500 }
      author: { type: string, minLength: 1, maxLength: 200 }
      copiesOwned: { type: integer, format: int32, minimum: 0 }
      copiesAvailable: { type: integer, format: int32, minimum: 0, readOnly: true }
      replacementCost: { type: string, format: decimal, precision: 10, scale: 2 }
    required: [id, isbn, title, author, copiesOwned, copiesAvailable, replacementCost]
    primaryKey: [id]
    relations:
      loans: { target: Loan, kind: one-to-many, via: bookId }
    constraints:
      book_isbn_unique:
        kind: unique
        fields: [isbn]
        message: This ISBN is already in the catalogue.
      book_available_within_owned:
        kind: check
        expression: copiesAvailable <= copiesOwned
        message: Available copies cannot exceed the copies owned.
    requirements: [LIB-2]

  Loan:
    description: One copy of one book lent to one member for a period.
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      memberId: { type: string, format: uuid }
      bookId: { type: string, format: uuid }
      loanedAt: { type: string, format: date-time, readOnly: true }
      dueOn: { type: string, format: date, readOnly: true }
      returnedAt: { type: [string, "null"], format: date-time, readOnly: true }
      status: { $ref: "#/enums/LoanStatus" }
      lateFee:
        type: string
        format: decimal
        precision: 10
        scale: 2
        readOnly: true
        description: Computed by the lateFee algorithm when the copy is returned; zero until then.
    required: [id, memberId, bookId, loanedAt, dueOn, status, lateFee]
    primaryKey: [id]
    relations:
      member: { target: Member, kind: many-to-one, via: memberId, onDelete: restrict }
      book: { target: Book, kind: many-to-one, via: bookId, onDelete: restrict }
    constraints:
      loan_due_after_loaned:
        kind: check
        expression: dueOn > date(loanedAt)
        message: The due date must be after the loan date.
      loan_returned_after_loaned:
        kind: check
        expression: returnedAt == null || returnedAt >= loanedAt
        message: A copy cannot be returned before it was lent.
    stateField: status
    transitions:
      - { from: open, to: overdue, trigger: loan.overdue/LoanOverdue, description: "Nightly job finds the due date has passed.", requirements: [LIB-4] }
      - { from: open, to: returned, trigger: returnLoan }
      - { from: overdue, to: returned, trigger: returnLoan }
      - { from: open, to: lost, trigger: reportLost }
      - { from: overdue, to: lost, trigger: reportLost }
    requirements: [LIB-3, LIB-4]

permissions:
  members.read: { description: See member records. }
  members.write: { description: Create and change member records. }
  catalogue.read: { description: Browse the catalogue. }
  loans.read: { description: See loans. }
  loans.create: { description: Lend a copy to a member. }
  loans.return: { description: Record a return or a lost copy. }
  public: { description: "Open to everyone, including visitors without a card.", requirements: [LIB-2] }

roles:
  librarian:
    description: Staff at the desk.
    permissions: [members.read, members.write, catalogue.read, loans.read, loans.create, loans.return]
  member:
    description: A card holder, limited to their own records by the service.
    permissions: [catalogue.read, loans.read]

paths:
  /books:
    get:
      operationId: listBooks
      summary: Browse the catalogue
      permission: public
      parameters:
        - name: q
          in: query
          description: Free-text search over title and author.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Matching books.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Book" } }
      requirements: [LIB-2]

  /members:
    get:
      operationId: listMembers
      summary: List members
      permission: members.read
      responses:
        "200":
          description: All members.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Member" } }
    post:
      operationId: createMember
      summary: Register a new member
      permission: members.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, format: email }
                tier: { $ref: "#/enums/MembershipTier" }
              required: [fullName, email, tier]
      responses:
        "201":
          description: The member, with card number assigned.
          content:
            application/json:
              schema: { $ref: "#/entities/Member" }
        "409": { description: Email address already registered. }
      requirements: [LIB-1]

  /members/{memberId}:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMember
      summary: One member with their loans
      permission: members.read
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema: { $ref: "#/entities/Member" }
        "404": { description: No such member. }

  /loans:
    get:
      operationId: listLoans
      summary: List loans
      permission: loans.read
      parameters:
        - { name: status, in: query, schema: { $ref: "#/enums/LoanStatus" } }
        - { name: memberId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Matching loans.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Loan" } }
    post:
      operationId: createLoan
      summary: Lend a copy to a member
      description: |
        Refused when the member already holds the maximum open loans for their
        tier, has outstanding fees, or the book has no copy available.
      permission: loans.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId: { type: string, format: uuid }
                bookId: { type: string, format: uuid }
              required: [memberId, bookId]
      responses:
        "201":
          description: The new loan, with the due date set from the member's tier.
          content:
            application/json:
              schema: { $ref: "#/entities/Loan" }
        "409": { description: "Loan limit reached, fees outstanding, or no copy available." }
      emits: [loan.lifecycle/LoanCreated]
      requirements: [LIB-3]

  /loans/{loanId}/return:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: returnLoan
      summary: Record the return of a copy
      permission: loans.return
      algorithm: lateFee
      responses:
        "200":
          description: The closed loan, with the late fee computed.
          content:
            application/json:
              schema: { $ref: "#/entities/Loan" }
        "409": { description: The loan is already closed. }
      emits: [loan.lifecycle/LoanReturned]
      requirements: [LIB-4, LIB-5]

  /loans/{loanId}/lost:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reportLost
      summary: Record a lost copy and charge its replacement cost
      permission: loans.return
      responses:
        "200":
          description: The closed loan.
          content:
            application/json:
              schema: { $ref: "#/entities/Loan" }
        "409": { description: The loan is already closed. }
      emits: [loan.lifecycle/LoanLost]

channels:
  loan.lifecycle:
    description: Every change in a loan's state, for the notification service and the audit log.
    messages:
      LoanCreated:
        summary: A copy was lent.
        payload: { $ref: "#/entities/Loan" }
      LoanReturned:
        summary: A copy came back; the payload carries the fee charged.
        payload: { $ref: "#/entities/Loan" }
      LoanLost:
        summary: A copy was reported lost.
        payload: { $ref: "#/entities/Loan" }
  loan.overdue:
    description: Published by the nightly job for each loan whose due date passed.
    requirements: [LIB-4]
    messages:
      LoanOverdue:
        summary: A loan became overdue.
        payload:
          type: object
          properties:
            loanId: { type: string, format: uuid }
            memberId: { type: string, format: uuid }
            daysLate: { type: integer, format: int32, minimum: 1 }
          required: [loanId, memberId, daysLate]
        requirements: [LIB-4]

pages:
  members-list:
    kind: list
    title: Members
    route: /members
    entity: Member
    permission: members.read
    source: listMembers
    columns: [cardNumber, fullName, email, tier, outstandingFees]
    filters: [tier]
    actions:
      - { label: New member, kind: navigate, target: member-form, permission: members.write }
  member-form:
    kind: form
    title: Register member
    route: /members/new
    entity: Member
    permission: members.write
    submit: createMember
    fields: [fullName, email, tier]
  member-view:
    kind: view
    title: Member
    route: /members/{memberId}
    entity: Member
    permission: members.read
    source: getMember
    fields: [cardNumber, fullName, email, tier, joinedOn, outstandingFees]
    actions:
      - { label: Lend a book, kind: navigate, target: loan-form, permission: loans.create }
  loan-form:
    kind: form
    title: Lend a copy
    route: /loans/new
    entity: Loan
    permission: loans.create
    submit: createLoan
    fields: [memberId, bookId]
  loans-list:
    kind: list
    title: Loans
    route: /loans
    entity: Loan
    permission: loans.read
    source: listLoans
    columns: [memberId, bookId, loanedAt, dueOn, status, lateFee]
    filters: [status, memberId]
    actions:
      - { label: Return, kind: operation, target: returnLoan, permission: loans.return, confirm: "Record this copy as returned?" }
      - { label: Lost, kind: operation, target: reportLost, permission: loans.return, confirm: "Charge the replacement cost and close this loan?" }

algorithms:
  lateFee:
    description: |
      Fee charged when a copy comes back after its due date. A flat daily rate,
      capped so that a long-overdue book never costs more than replacing it.
    inputs:
      daysLate: { type: integer, format: int32, minimum: 0, description: Whole days after dueOn; 0 when returned on time. }
      dailyRate: { type: string, format: decimal, precision: 10, scale: 2, description: "Library setting, currently 0.50." }
      replacementCost: { type: string, format: decimal, precision: 10, scale: 2, description: The book's replacementCost. }
    output: { type: string, format: decimal, precision: 10, scale: 2 }
    formula: min(decimal(daysLate, 0) * dailyRate, replacementCost)
    examples:
      - name: returned on time
        inputs: { daysLate: 0, dailyRate: "0.50", replacementCost: "25.00" }
        expected: "0.00"
      - name: one week late
        inputs: { daysLate: 7, dailyRate: "0.50", replacementCost: "25.00" }
        expected: "3.50"
        note: 7 × 0.50 = 3.50, below the cap.
      - name: capped at replacement cost
        inputs: { daysLate: 90, dailyRate: "0.50", replacementCost: "25.00" }
        expected: "25.00"
        note: 90 × 0.50 = 45.00 exceeds the 25.00 replacement cost, so the cap applies.
      - name: cheap book, cap reached early
        inputs: { daysLate: 10, dailyRate: "0.50", replacementCost: "4.00" }
        expected: "4.00"
    pseudocode: |
      function lateFee(daysLate, dailyRate, replacementCost):
          if daysLate <= 0:
              return 0.00
          fee = daysLate * dailyRate          # decimal arithmetic, 2 places
          if fee > replacementCost:
              fee = replacementCost
          return fee
    requirements: [LIB-5]

tests:
  # Operations
  browse-catalogue:
    operation: listBooks
    scenario: golden
    covers: [q of 200 characters]
    given: three books by two authors, and a visitor without a card
    when: listBooks is called with q set to one author's name, and again with a 200-character q
    then: the first call answers that author's books, the second an empty list
    requirements: [LIB-2]
  browse-catalogue-query-too-long:
    { operation: listBooks, scenario: red, covers: [q longer than 200 characters], given: a visitor, when: listBooks is called with a 201-character q, then: it is refused as invalid input }
  list-members:
    { operation: listMembers, scenario: golden, given: two members and a librarian, when: listMembers is called, then: both members are answered }
  list-members-denied:
    { operation: listMembers, scenario: red, covers: [denied without members.read], given: a caller holding only the member role, when: listMembers is called, then: it is refused as not allowed }
  register-member:
    operation: createMember
    scenario: golden
    covers: [fullName of 1 character, fullName of 200 characters]
    given: a librarian
    when: createMember is called for a standard-tier member with a one-letter name, and again with a 200-character name
    then: both members are created, each with a new eight-digit card number and no fees
    requirements: [LIB-1]
  register-member-missing-field:
    { operation: createMember, scenario: red, covers: [missing fullName, missing email, missing tier], given: a librarian, when: createMember is called three times each time without one of fullName and email and tier, then: each call is refused as invalid input }
  register-member-name-length:
    { operation: createMember, scenario: red, covers: [fullName shorter than 1 character, fullName longer than 200 characters], given: a librarian, when: createMember is called with an empty fullName and with a 201-character one, then: both are refused as invalid input }
  register-member-bad-values:
    { operation: createMember, scenario: red, covers: [email not a valid email, tier not one of its values], given: a librarian, when: "createMember is called with email set to 'not-an-address', and with tier set to gold", then: both are refused as invalid input }
  register-member-denied:
    { operation: createMember, scenario: red, covers: [denied without members.write], given: a caller holding only the member role, when: createMember is called, then: it is refused as not allowed }
  register-member-email-taken:
    operation: createMember
    scenario: red
    covers: [duplicate member_email_unique, response 409]
    given: a member registered with ana@example.org
    when: createMember is called with the same email address
    then: it answers 409 and no member is created
    requirements: [LIB-1]
  register-member-card-number-clash:
    operation: createMember
    scenario: red
    covers: [duplicate member_card_number_unique]
    notApplicable: The card number is assigned by the system, never sent by a client, so a request cannot clash on it. The constraint itself is tested under member-card-number-twice.
  show-member:
    { operation: getMember, scenario: golden, given: a member and a librarian, when: getMember is called with the member's id, then: the member is answered }
  show-member-not-found:
    { operation: getMember, scenario: red, covers: [not found memberId, response 404], given: a librarian and no member with a given id, when: getMember is called with that id, then: it answers 404 }
  show-member-bad-id:
    { operation: getMember, scenario: red, covers: [memberId not a valid uuid], given: a librarian, when: getMember is called with memberId abc, then: it is refused as invalid input }
  show-member-denied:
    { operation: getMember, scenario: red, covers: [denied without members.read], given: a caller holding only the member role, when: getMember is called, then: it is refused as not allowed }
  list-loans:
    { operation: listLoans, scenario: golden, given: an open loan and a returned loan, when: listLoans is called with status open, then: only the open loan is answered }
  list-loans-bad-filter:
    { operation: listLoans, scenario: red, covers: [status not one of its values, memberId not a valid uuid], given: a librarian, when: listLoans is called with status lent and again with memberId abc, then: both are refused as invalid input }
  list-loans-denied:
    { operation: listLoans, scenario: red, covers: [denied without loans.read], given: a caller holding no role, when: listLoans is called, then: it is refused as not allowed }
  lend-a-copy:
    operation: createLoan
    scenario: golden
    given: a standard-tier member with no loans and no fees, and a book with one copy available
    when: createLoan is called for them
    then: an open loan due in 21 days is created, the book has no copy available, and LoanCreated is published
    requirements: [LIB-3]
  lend-missing-field:
    { operation: createLoan, scenario: red, covers: [missing memberId, missing bookId], given: a librarian, when: createLoan is called without memberId and again without bookId, then: both are refused as invalid input }
  lend-bad-ids:
    { operation: createLoan, scenario: red, covers: [memberId not a valid uuid, bookId not a valid uuid], given: a librarian, when: createLoan is called with memberId abc and again with bookId abc, then: both are refused as invalid input }
  lend-unknown-member-or-book:
    { operation: createLoan, scenario: red, covers: [not found memberId, not found bookId], given: a librarian, when: createLoan is called with a memberId and then a bookId that no record has, then: both are refused as not found }
  lend-limit-reached:
    operation: createLoan
    scenario: red
    covers: [response 409]
    given: a standard-tier member with three open loans
    when: createLoan is called for a fourth book
    then: it answers 409 and no loan is created
    requirements: [LIB-3]
  lend-denied:
    { operation: createLoan, scenario: red, covers: [denied without loans.create], given: a caller holding only the member role, when: createLoan is called, then: it is refused as not allowed }
  lend-event-not-delivered:
    { operation: createLoan, scenario: red, covers: [dependency fails loan.lifecycle], given: the loan.lifecycle channel is unavailable, when: createLoan is called, then: "no loan is created and the call fails, so a loan never exists without its event" }
  return-late:
    operation: returnLoan
    scenario: golden
    given: an overdue loan returned 7 days late, a daily rate of 0.50 and a replacement cost of 25.00
    when: returnLoan is called
    then: the loan is returned with a late fee of 3.50, the copy is available again, and LoanReturned is published
    requirements: [LIB-5]
  return-already-closed:
    { operation: returnLoan, scenario: red, covers: [response 409], given: a loan already returned, when: returnLoan is called on it, then: it answers 409 and nothing changes }
  return-unknown-loan:
    { operation: returnLoan, scenario: red, covers: [not found loanId, loanId not a valid uuid], given: a librarian, when: returnLoan is called with an id no loan has and again with abc, then: the first is refused as not found and the second as invalid input }
  return-denied:
    { operation: returnLoan, scenario: red, covers: [denied without loans.return], given: a caller holding only the member role, when: returnLoan is called, then: it is refused as not allowed }
  return-event-not-delivered:
    { operation: returnLoan, scenario: red, covers: [dependency fails loan.lifecycle], given: the loan.lifecycle channel is unavailable, when: returnLoan is called, then: the loan stays open and the call fails }
  report-lost:
    { operation: reportLost, scenario: golden, given: an open loan of a book whose replacement cost is 25.00, when: reportLost is called, then: the loan is lost and 25.00 is added to the member's outstanding fees }
  report-lost-already-closed:
    { operation: reportLost, scenario: red, covers: [response 409], given: a loan already lost, when: reportLost is called on it, then: it answers 409 and nothing is charged twice }
  report-lost-unknown-loan:
    { operation: reportLost, scenario: red, covers: [not found loanId, loanId not a valid uuid], given: a librarian, when: reportLost is called with an id no loan has and again with abc, then: the first is refused as not found and the second as invalid input }
  report-lost-denied:
    { operation: reportLost, scenario: red, covers: [denied without loans.return], given: a caller holding only the member role, when: reportLost is called, then: it is refused as not allowed }
  report-lost-event-not-delivered:
    { operation: reportLost, scenario: red, covers: [dependency fails loan.lifecycle], given: the loan.lifecycle channel is unavailable, when: reportLost is called, then: "the loan stays open, nothing is charged, and the call fails" }

  # Pages
  members-list-shown:
    { page: members-list, scenario: golden, given: a librarian, when: the page members-list is opened, then: "it lists members with card number, name, email, tier and fees" }
  members-list-denied:
    { page: members-list, scenario: red, covers: [denied without members.read], given: a caller holding only the member role, when: the page members-list is opened, then: it is not shown }
  member-form-shown:
    { page: member-form, scenario: golden, given: a librarian, when: the page member-form is filled in and sent, then: the member is registered }
  member-form-denied:
    { page: member-form, scenario: red, covers: [denied without members.write], given: a caller holding only the member role, when: the page member-form is opened, then: it is not shown }
  member-view-shown:
    { page: member-view, scenario: golden, given: a librarian and a member, when: the page member-view is opened for that member, then: it shows the member and offers Lend a book }
  member-view-not-found:
    { page: member-view, scenario: red, covers: [not found memberId], given: a librarian, when: the page member-view is opened for an id no member has, then: it says the member was not found }
  member-view-denied:
    { page: member-view, scenario: red, covers: [denied without members.read], given: a caller holding only the member role, when: the page member-view is opened, then: it is not shown }
  loan-form-shown:
    { page: loan-form, scenario: golden, given: a librarian, when: the page loan-form is filled in and sent, then: the copy is lent }
  loan-form-denied:
    { page: loan-form, scenario: red, covers: [denied without loans.create], given: a caller holding only the member role, when: the page loan-form is opened, then: it is not shown }
  loans-list-shown:
    { page: loans-list, scenario: golden, given: a librarian and some loans, when: the page loans-list is opened, then: "it lists the loans with their due dates, states and fees" }
  loans-list-denied:
    { page: loans-list, scenario: red, covers: [denied without loans.read], given: a caller holding no role, when: the page loans-list is opened, then: it is not shown }

  # Constraints
  member-card-number-once:
    { entity: Member, constraint: member_card_number_unique, scenario: golden, given: no member with card number 00000001, when: a member with that card number is saved, then: it is saved }
  member-card-number-twice:
    { entity: Member, constraint: member_card_number_unique, scenario: red, covers: [duplicate member_card_number_unique], given: a member with card number 00000001, when: another member with that card number is saved, then: it is refused }
  member-email-once:
    { entity: Member, constraint: member_email_unique, scenario: golden, given: no member with ana@example.org, when: a member with that address is saved, then: it is saved }
  member-email-twice:
    { entity: Member, constraint: member_email_unique, scenario: red, covers: [duplicate member_email_unique], given: a member with ana@example.org, when: another member with that address is saved, then: it is refused }
  book-isbn-once:
    { entity: Book, constraint: book_isbn_unique, scenario: golden, given: no book with ISBN 9780000000001, when: a book with that ISBN is saved, then: it is saved }
  book-isbn-twice:
    { entity: Book, constraint: book_isbn_unique, scenario: red, covers: [duplicate book_isbn_unique], given: a book with ISBN 9780000000001, when: another book with that ISBN is saved, then: it is refused }
  book-available-at-most-owned:
    { entity: Book, constraint: book_available_within_owned, scenario: golden, given: a book with 2 copies owned, when: it is saved with 2 available, then: it is saved }
  book-available-above-owned:
    { entity: Book, constraint: book_available_within_owned, scenario: red, covers: [violates book_available_within_owned], given: a book with 2 copies owned, when: it is saved with 3 available, then: it is refused }
  loan-due-after-loaned:
    { entity: Loan, constraint: loan_due_after_loaned, scenario: golden, given: a loan made on 2026-10-07, when: it is saved due on 2026-10-28, then: it is saved }
  loan-due-on-loan-day:
    { entity: Loan, constraint: loan_due_after_loaned, scenario: red, covers: [violates loan_due_after_loaned], given: a loan made on 2026-10-07, when: it is saved due on 2026-10-07, then: it is refused }
  loan-returned-after-loaned:
    { entity: Loan, constraint: loan_returned_after_loaned, scenario: golden, given: a loan made at 2026-10-07T10:00:00Z, when: it is saved returned at 2026-10-08T10:00:00Z, then: it is saved }
  loan-returned-before-loaned:
    { entity: Loan, constraint: loan_returned_after_loaned, scenario: red, covers: [violates loan_returned_after_loaned], given: a loan made at 2026-10-07T10:00:00Z, when: it is saved returned at 2026-10-06T10:00:00Z, then: it is refused }

  # Transitions
  loan-becomes-overdue:
    { entity: Loan, transition: { from: open, to: overdue }, scenario: golden, given: an open loan due yesterday, when: the nightly job runs, then: the loan is overdue and LoanOverdue is published, requirements: [LIB-4] }
  loan-overdue-only-from-open:
    { entity: Loan, transition: { from: open, to: overdue }, scenario: red, covers: [from wrong state], given: a returned loan due last week, when: the nightly job runs, then: the loan stays returned }
  loan-returned-on-time:
    { entity: Loan, transition: { from: open, to: returned }, scenario: golden, given: an open loan, when: returnLoan is called, then: the loan is returned with no fee }
  loan-returned-only-when-out:
    { entity: Loan, transition: { from: open, to: returned }, scenario: red, covers: [from wrong state], given: a lost loan, when: returnLoan is called, then: it is refused and the loan stays lost }
  overdue-loan-returned:
    { entity: Loan, transition: { from: overdue, to: returned }, scenario: golden, given: an overdue loan, when: returnLoan is called, then: the loan is returned with its late fee }
  overdue-loan-returned-twice:
    { entity: Loan, transition: { from: overdue, to: returned }, scenario: red, covers: [from wrong state], given: a loan already returned, when: returnLoan is called again, then: it is refused and the fee is not charged twice }
  open-loan-lost:
    { entity: Loan, transition: { from: open, to: lost }, scenario: golden, given: an open loan, when: reportLost is called, then: the loan is lost and the replacement cost is charged }
  open-loan-lost-after-return:
    { entity: Loan, transition: { from: open, to: lost }, scenario: red, covers: [from wrong state], given: a returned loan, when: reportLost is called, then: it is refused and the loan stays returned }
  overdue-loan-lost:
    { entity: Loan, transition: { from: overdue, to: lost }, scenario: golden, given: an overdue loan, when: reportLost is called, then: the loan is lost and the replacement cost is charged }
  overdue-loan-lost-twice:
    { entity: Loan, transition: { from: overdue, to: lost }, scenario: red, covers: [from wrong state], given: a loan already lost, when: reportLost is called again, then: it is refused and nothing is charged twice }

decisions:
  ADR-001:
    title: Late fees are a flat daily rate capped at the replacement cost
    status: accepted
    date: "2026-10-07"
    context: |
      Tiered rates (cheaper for the first week, dearer after) were considered.
      They are harder to explain at the desk and the difference in revenue is
      small for a library of this size.
    decision: |
      One daily rate for every book, capped at that book's replacement cost.
      The rate is a library setting, not a per-book value.
    consequences: |
      The fee can be computed from three numbers and checked by hand. A very
      long-overdue book costs the same as a lost one, which is what we want:
      at that point the member should be told to treat it as lost.
    requirements: [LIB-5]
  ADR-002:
    title: Money is carried as decimal strings, never floats
    status: accepted
    date: "2026-10-07"
    context: |
      JSON has no decimal type. Fees and costs must round the way a cashier
      expects.
    decision: |
      Every money field is `type: string, format: decimal` with `precision`
      and `scale`. Generators map it to the target's decimal type and the API
      transports it as a string.
    consequences: |
      Clients must parse the string; in return no sum ever drifts by a cent.
