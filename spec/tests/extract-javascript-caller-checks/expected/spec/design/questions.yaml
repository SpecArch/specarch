  # specarch-problem: question: open_question: (must, decision) server/src/app.ts:14: requireClient passes "only the mailer sends invoices" after "mailer", the argument the implementation file names as the check's. Is it a name the check admits too, or something else, such as a reason? Decided by system-owner. Answer with a decision record that names Q-19 under answers. [Q-19]
  Q-19:
    question: 'server/src/app.ts:14: requireClient passes "only the mailer sends invoices" after "mailer", the argument the implementation file names as the check''s. Is it a name the check admits too, or something else, such as a reason?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1invoices~1{invoiceId}~1send/post/callers']
    decidedBy: system-owner
    why: Syntax does not say whether a check takes its names as one argument or as every argument from it on; the reader writes the named argument alone and asks about the rest, so neither a name is dropped nor a reason admitted as a caller.
    cites:
      - {source: code, clause: 'server/src/app.ts:14', says: 'Calls requireClient with "mailer", then "only the mailer sends invoices".'}
  # specarch-problem: question: open_question: (must, decision) The check requireApplication admits only the application admin-web, the one the person signed in through, at 1 operation, which check invoices.delete. On every role that grants it, write through with the applications the check admits, here or in the identity module. POST /invoices/{invoiceId}/archive and POST /invoices/{invoiceId}/void check the same without it, and through narrows the grant there too: is it meant there? It blocks roles. Decided by system-owner. Answer with a decision record that names Q-20 under answers. [Q-20]
  Q-20:
    question: 'The check requireApplication admits only the application admin-web, the one the person signed in through, at 1 operation, which check invoices.delete. On every role that grants it, write through with the applications the check admits, here or in the identity module. POST /invoices/{invoiceId}/archive and POST /invoices/{invoiceId}/void check the same without it, and through narrows the grant there too: is it meant there?'
    kind: decision
    priority: must
    blocks: [roles]
    decidedBy: system-owner
    why: The application is a condition on a grant, written on the role keyed by the permission (ADR-106); the reader writes no role, and the code shows the check, not which grant it narrows.
    cites:
      - {source: code, clause: 'server/src/app.ts:11', says: 'Calls requireApplication, which the implementation file names as an application check.'}
  # specarch-problem: question: open_question: (must, decision) The check requireAudience compares a token's aud with process.env.TOKEN_AUDIENCE ?? '' at 5 operations. Which audience names this service: the const of aud on the access token it accepts? A value per environment goes in the implementation file's deployments. It blocks tokens. Decided by system-owner. Answer with a decision record that names Q-21 under answers. [Q-21]
  Q-21:
    question: 'The check requireAudience compares a token''s aud with process.env.TOKEN_AUDIENCE ?? '''' at 5 operations. Which audience names this service: the const of aud on the access token it accepts? A value per environment goes in the implementation file''s deployments.'
    kind: decision
    priority: must
    blocks: [tokens]
    decidedBy: system-owner
    why: A token accepted without a fixed audience is refused, since a token minted for one service could be replayed at the next (ADR-109); the reader writes no token, and an audience read from a setting is the deployment's value.
    cites:
      - {source: code, clause: 'server/src/app.ts:9', says: 'Calls requireAudience, which the implementation file names as an audience check.'}
  # specarch-problem: question: open_question: (must, decision) The check requireCaller admits only the service middleware as the immediate caller on a person's behalf, written as the via of 1 operation. Declare each as a client of kind service with its workload-identity proof, mutualTls, spiffe or wimse, here or in the identity module, and the transaction token the operations accept with it. Decided by system-owner. Answer with a decision record that names Q-22 under answers. [Q-22]
  Q-22:
    question: The check requireCaller admits only the service middleware as the immediate caller on a person's behalf, written as the via of 1 operation. Declare each as a client of kind service with its workload-identity proof, mutualTls, spiffe or wimse, here or in the identity module, and the transaction token the operations accept with it.
    kind: decision
    priority: must
    blocks: ['#/paths/~1invoices~1{invoiceId}/delete/via']
    decidedBy: system-owner
    why: The code names the services and not how each proves itself, which is the deployment's; via names the immediate callers one by one, each with a workload-identity proof, and needs the transaction token it is checked with (ADR-111).
    cites:
      - {source: code, clause: 'server/src/app.ts:11', says: 'Calls requireCaller with "middleware", which the implementation file names as a caller check.'}
  # specarch-problem: question: open_question: (must, decision) The check requireCaller compares the immediate caller's workload identity with the services callers gives, and it guards 1 operation. Which services call each of them on a person's behalf: its via? Decided by system-owner. Answer with a decision record that names Q-23 under answers. [Q-23]
  Q-23:
    question: 'The check requireCaller compares the immediate caller''s workload identity with the services callers gives, and it guards 1 operation. Which services call each of them on a person''s behalf: its via?'
    kind: decision
    priority: must
    blocks: ['#/paths/~1invoices~1{invoiceId}~1void/post/via']
    decidedBy: system-owner
    why: Names read at run time are not known by syntax. via names the immediate callers one by one, each a service with a workload-identity proof, with no wildcard, since a hop added later would then be admitted without anyone writing it (ADR-111).
    cites:
      - {source: code, clause: 'server/src/app.ts:12', says: 'Calls requireCaller, which the implementation file names as a caller check.'}
