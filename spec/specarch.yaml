# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.7.5/schema/specarch-design-0.3.schema.json
specarch: "0.3"

info:
  title: SpecArch toolchain
  version: 0.7.6-dev
  program: specarch
  description: |
    The `specarch` command: it validates SpecArch specifications and makes
    documents and code from them. This folder is the specification, with no
    language, library or build tool in it; how one stack implements it is in
    `implementation/<stack>/`.
  owners: [specarch-maintainers]

stages: [requirements, design, implementation, tests, deployment, commissioning, operation]

sources:
  iso-29148:
    kind: standard
    title: ISO/IEC/IEEE 29148, Systems and software engineering, Life cycle processes, Requirements engineering
    edition: "2018"
    author: ISO, IEC and IEEE
    url: https://www.iso.org/standard/72089.html
  ieee-830:
    kind: standard
    title: IEEE Std 830-1998, IEEE Recommended Practice for Software Requirements Specifications
    edition: "1998"
    author: IEEE
    description: Replaced by ISO/IEC/IEEE 29148; cited for its rule on to-be-determined items, which 29148 keeps in substance.
  iso-29119-1:
    kind: standard
    title: ISO/IEC/IEEE 29119-1, Software and systems engineering, Software testing, Part 1, General concepts
    edition: "2022"
    author: ISO, IEC and IEEE
  iso-29119-3:
    kind: standard
    title: ISO/IEC/IEEE 29119-3, Software and systems engineering, Software testing, Part 3, Test documentation
    edition: "2021"
    author: ISO, IEC and IEEE
    url: https://www.iso.org/standard/79429.html
  iso-29119-4:
