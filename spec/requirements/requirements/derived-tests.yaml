# yaml-language-server: $schema=../../../schema/specarch-fragment-requirements-1.0.schema.json
# specarch-problem: warning: problem_missing: the specification has requirements and no problem, so nothing says what the system is for, and no goal or requirement can be judged against it; add problem with statement, the problem the system solves in plain words, and, when they are known, the stakeholders it hurts, how things stand today and why [problem_missing@requirements/requirements/derived-tests.yaml#/problem]
requirements:
  SA-31:
    statement: specarch generate tests shall write, through the plug-in for an implementation file's stack, one test per design test and one per worked example, in Go, in Swift with Swift Testing, or in Dart with package:test or flutter_test, setting up the fixture, making the call and checking the expected outcome through a harness the project writes, so that the generated tests are the same on every project of that language.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - generate looks up specarch-gen-<target>-<stack> for an implementation file in Go before specarch-gen-<target>, and falls back to the second when the first is not on PATH.
      - The tests generated from the library lending example compile beside a harness that does nothing and an empty body for each test the design gives no call for, in Go, in Swift and in Dart for both frameworks, and a worked example's expected decimal is compared as a decimal.
      - The Go, Swift and Dart tests generated from one specification hold the same tests, calls and checks.
      - A Swift or Dart implementation file whose testing framework is not one the plug-in writes for is refused by name, and nothing is written.
    verification: test
    needs: [NEED-9]
    why: A test the specification implies is worth most when it runs; what differs between two projects in one language (how a caller signs in, how a record is stored, how a request is sent) is the harness, so the generated file needs nothing but it.
  SA-120:
    statement: specarch generate tests, given a module and the estate it belongs to, shall write one integration test per call the module makes into another module of the estate, pinning both modules by name and version, with the golden path and the red paths the called operation's contract implies, in the test language of the calling module's implementation file, the tests of the calls into one module in one file of their own.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - generate tests --estate <estate> <module> writes one test per operation of another module the module calls through a calls entry, a list page or a picker, naming every place that calls it, the calling and the called module with their versions, the dependency, the method and path and the caller's time limit.
      - Each test runs the golden path with the operation's permission and the called module's golden input, the harness filling every required value that input does not give, checking the success status and every field the answer requires, and the red paths the called operation implies, each with the status it declares or else a refusal - denied without the permission, each required query, header or body field left out, each other answer it declares, the called module failing and the called module not answering within the time limit.
      - A change in one called module's contract changes only the file of the calls into that module.
      - A call into a module the run does not give is named in the generated design tests' file with its place and module, and the rest is written.
      - The Go, Swift and Dart integration tests of one module hold the same tests and checks.
    verification: test
    needs: [NEED-9]
    why: What breaks at the system integration test of an estate is most often a call between two modules owned by different teams; the two designs already say the request, the answers, the permission and the time limit, so a test of each call needs nothing but a harness that runs the two modules (ADR-226).
  SA-29:
    statement: A specification shall be able to declare the dependencies an operation calls with a time limit per call, an idempotency key on an operation, the validity of an entity's records, how a session ends, and a guard on a data change, and specarch validate shall check each against the design and derive the red cases each implies.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - A calls entry naming no declared dependency, an idempotency key naming no header parameter or sitting on a GET, a validity naming a field that is not a date, a timeout of zero, and a guard naming no entity are each reported under their rule.
      - A guard's writes on a PUT of its entity by its key or on a DELETE by its key, a delete beside a transition the entry triggers, a set of a field the entity lacks, of its key or of its state field, and a value that is neither given nor a literal of the field's type are each reported under guard.
      - An operation that calls a dependency gets the cases dependency fails and dependency times out, one with an idempotency key the repeated and reused cases, one taking a record of an entity with validity the expired case, one with a guard the concurrent write case, and every non-public subject the expired session case once a session is declared.
    verification: test
    needs: [NEED-9]
    why: The red paths a specification could not express, a dependency down or slow, a retry, expired data, an expired session, two writers on one record, are the ones a tester forgets and a live system meets; once the design says them, the tests follow from it like every other case.
    cites:
      - source: rfc-9110
        clause: "9.2.2"
        says: "A request method is idempotent if the intended effect on the server of multiple identical requests with that method is the same as the effect for a single such request; PUT, DELETE and the safe methods are idempotent."
      - source: owasp-session-management
        says: "All sessions should implement an idle timeout and an absolute timeout."
  SA-28:
    statement: specarch derive shall write a draft test for every derived case that no test covers, and shall never overwrite a test or write one for a subject an open must or should question holds up.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - A specification with uncovered chosen cases gets one test folder per case, each marked origin inferred, and validates afterwards.
      - A test folder that exists is kept as it is.
      - A subject a must question blocks gets no test, and derive names it.
      - Two subjects of different kinds that give the same name get drafts of different names, and a draft whose name is still taken is not written; derive names it and exits 1.
    verification: test
    needs: [NEED-9]
    why: The tests a specification implies are only worth listing if writing them out is cheap; a draft the author completes is cheaper than a warning the author copies.
  SA-111:
    statement: specarch derive shall draft the fixture, input and expected outcome of a derived case wherever the design fixes them, shall add them on request to a test that has none, and the test plan shall say how many tests the tests target writes with their bodies.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - "A draft of an operation's case carries a caller, a valid value of every required parameter and body field, the records those values name and the status the case answers, when the operation declares that status: the success status, 403 denied, 404 not found, 401 not signed in, 400 or 422 for a missing field or a value of the wrong form or past a limit; a value test_data would refuse is never written."
      - derive --fill adds that data at the end of each test that has none of fixture, input and expect, leaves a test of several cases whose data differ as it is and names it with the reason, and leaves a test with an input/ or expected/ folder as it is.
      - The test plan says how many of the tests that apply are generated with their bodies and counts them by kind of subject.
    verification: test
    needs: [NEED-9]
    why: A generated test whose body is written by hand is a test nobody runs until someone writes it; most of a call is already in the design, and saying how many bodies are owed shows what is left (ADR-213).
  SA-27:
    statement: A design test may carry its fixture, input and expected outcome as structured data in the design's own vocabulary, and the validator shall check that data against the design.
    kind: functional
    priority: should
    status: accepted
    acceptance:
      - A fixture naming a field the entity does not have, a value of the wrong type, or a record a check constraint refuses is reported as test_data.
      - An input naming a parameter the operation does not have, or an expected status that is not one of its responses, is reported as test_data.
      - A test with input and an input/ folder beside it is reported as test_data.
    verification: test
    needs: [NEED-9]
    why: A generator can only write a test from data it can read, and data checked against the design cannot describe a record that could never exist.
  SA-21:
    statement: specarch validate shall rank every test case it derives as critical, frequent or other, from the harm of the requirements its subject satisfies and from how often users get its field wrong, and shall warn only for the critical and frequent cases no test covers.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - An operation that satisfies no requirement with harm gets no warning for the boundary cases of its fields, and still gets one for a missing required field and for a caller without the permission.
      - The same operation, once it satisfies a requirement with harm, gets a warning for every derived case no test covers.
      - A field with mistakes rare loses the warnings for its cases, and a field with mistakes frequent gains them.
      - A failing channel is warned about whatever the harm of the operation.
    verification: test
    needs: [NEED-9]
    why: Every case a design implies cannot be tested on every project, so the sample is chosen by risk, and the risk is read from the specification rather than from a tester's memory.
    cites:
      - source: iso-29119-1
        clause: "4.1.6"
        says: "Exhaustive testing is not possible in practice, so the tests run are a sample of all the tests that could be run."
      - source: iso-29119-1
        clause: "4.2.2"
        says: "Risk-based testing uses the risks of the item under test to decide what to test and how much."
      - source: iso-29119-4
        clause: "5.4.1"
        says: "Error guessing designs test cases from knowledge of the mistakes that are commonly made."
  SA-22:
    statement: specarch document shall list in the test plan, under Derived cases left out, every derived case of rank other that no test covers, with its subject and the reason it was left out, and shall show each requirement's harm in the traceability matrix once a requirement names one.
    kind: functional
    priority: must
    status: accepted
    acceptance:
      - The test plan of a specification with an uncovered boundary case on a subject with no harm has a row for that case, and the row is gone once a test covers it.
      - The traceability matrix of a specification with a requirement that names a harm has a Harm column, and one without has none.
    verification: test
    needs: [NEED-9, NEED-3]
    why: A case left out is a decision, and a decision the reader cannot see is one nobody can question.
  SA-128:
    statement: specarch generate tests --package <environment> shall write a test package of one specification for one of its environments - every test, and every chosen derived case no test covers drafted as derive drafts it, each as a request to the environment's servers with what its answer must show, or with the reason it cannot run from outside - holding back a test an open must or should question holds up until it is answered, and holding no credential; specarch run shall run the package against the environment, signing each role in with headers it is given and putting a case's records in place through a program it is given, and write the results as JUnit XML that specarch log test-run maps back to each test, or to a derived case's subject.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - generate tests --package with an environment of the specification, --out and --unapproved writes specarch-test-package.yaml with the generated header, the environment's servers that answer requests and one case per test and per chosen derived case no test covers, a derived case marked derived with its subject's element, and lists a test a must question blocks under held, naming the question.
      - A case whose test gives no request, is about a command or a page, or expects only the state after is in the package with the reason it cannot run from outside, and no case holds a credential.
      - run with the package, --base-url of a fixture service, --callers and --results writes JUnit XML with one testcase per case, named as the case, passed when the answer has the status and the body fields expected, failed naming the status or field that differs, and skipped with the reason for a case the package marks so, a role --callers does not give, or records with no --setup; it exits 0 when no case failed or errored and 1 otherwise.
      - log test-run on that JUnit XML maps each testcase to its test, and each derived case to its subject's element, with no unmapped result.
      - generate tests --package refuses another target, no --out and an environment the specification does not have with status 2; run refuses a package with several servers and neither --base-url nor --server, naming them, with status 2.
    verification: test
    needs: [NEED-9, NEED-10]
    why: The tests a specification implies are only worth what a run of them in the customer's environment shows, and that environment is run by people who have neither the specification nor the project's harness; a package that holds the cases as data, run by the program that made it, needs nothing on their host but that program, and its results come back as a file the specification's own test-run record maps case by case (ADR-233).
    cites:
      - source: iso-29119-3
        clause: "8"
        says: "Actual results, test results and the test execution log are dynamic test documentation items: what was run, when, and with what outcome."
  SA-131:
    statement: specarch extract tests shall read existing test scripts and test sheets, complete or not - Gherkin feature files and CSV, TSV or Excel sheets - into tests inferred from them, each citing where it was read, with one must question for the subject each exercises and one for each given, step or expected result the script leaves out, and specarch merge shall keep those tests and the questions that block only them, so that once the questions are decided and their answers written, each test joins the test package.
    kind: functional
    priority: should
    status: proposed
    acceptance:
      - extract tests on a feature file with a Background, a scenario with every step, one with no Then and a Scenario Outline of two examples, and a sheet with a row missing its test data and a row with nothing but its ID and title writes one test per scenario, example and row, each origin inferred with why and a citation of its line or range, and one must question per test for its subject plus one per given, step or expected result left out, each blocking that test or that key; the tree passes validate.
      - merge of a design tree and that tree keeps each read test whole under tests/ with the questions that block only it, and a line counts them.
      - After decide answers each question of a read test and the answer's keys are written, generate tests --package lists the test among the cases instead of under held, and run passes it against a service that answers as the test expects.
    verification: test
    needs: [NEED-8, NEED-9]
    why: A team that already has test scripts has the test cases a stakeholder wrote down, often with a step or a result missing; reading them into the specification, with a question for each missing part instead of a guess, puts that knowledge where the derived cases are, and the test joins the package once a person settles what is missing (ADR-235).
    cites:
      - source: iso-29119-3
        clause: "8"
        says: "Actual results, test results and the test execution log are dynamic test documentation items: what was run, when, and with what outcome."
