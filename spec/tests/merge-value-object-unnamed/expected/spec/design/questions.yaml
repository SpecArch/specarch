questions:
  # specarch-problem: question: open_question: (should, decision) Are the fields addressCity, addressPostcode and addressStreet of Members one value, a field address holding the schema Address kept in columns, or fields of their own? They are the columns specarch generate sql writes for such a field. Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: Are the fields addressCity, addressPostcode and addressStreet of Members one value, a field address holding the schema Address kept in columns, or fields of their own? They are the columns specarch generate sql writes for such a field.
    kind: decision
    priority: should
    blocks: ['#/entities/Members/properties/addressCity', '#/entities/Members/properties/addressPostcode', '#/entities/Members/properties/addressStreet']
    decidedBy: system-owner
    why: Columns that share a prefix are often fields of their own, and the catalogue cannot tell; these are every part of Address, and no tree gives Members a field address, so the merge asks rather than joins them (ADR-077).
    cites:
      - {source: code, clause: migrations public.members, says: Table public.members.}
      - {source: api, clause: /components/schemas/Members, says: 'The schema Members, with the properties cardNumber.'}
      - {source: api, clause: /components/schemas/Address, says: 'The schema Address, with the properties street, city and postcode.'}
