translations:
  "# %s: the old documents against the refined specification": "# %s: dokumen lama dibandingkan spesifikasi yang sudah disempurnakan"
  "Version %s of the specification against its %s: %s kept from them, %s clarified, %s added, %s corrected, and of the clauses the sources list, %s produced nothing.": "Spesifikasi versi %s dibandingkan dengan %s: %s dipertahankan, %s diperjelas, %s ditambahkan, %s dikoreksi, dan dari klausul yang didaftar sumber, %s tidak menghasilkan apa-apa."
  "source": "sumber"
  "sources": "sumber"
  "element": "elemen"
  "elements": "elemen"
  "clause": "klausul"
  "clauses": "klausul"
  " %s without an origin %s left out of the four groups.": " %s tanpa asal%.0s tidak dimasukkan ke empat kelompok itu."
  "Kept: a source says it, and the element cites where. Clarified: the sources left it implicit, and the element says from what it was concluded. Added or corrected: a stakeholder decided it, answering a question; corrected when the element also cites a source, which said something else there, added when no source said anything. Dropped: a clause of a source's outline that no element cites, either not read yet or holding nothing the specification needs; a citation from a decision or a question does not count, since neither is compared, and a clause only a question cites is named as asked about.": "Dipertahankan: sebuah sumber menyatakannya, dan elemennya mengutip lokasinya. Diperjelas: sumber hanya menyiratkannya, dan elemennya menyebut dari mana kesimpulan itu diambil. Ditambahkan atau dikoreksi: stakeholder memutuskannya sebagai jawaban atas sebuah pertanyaan; dikoreksi bila elemennya juga mengutip sumber yang di situ menyatakan hal lain, ditambahkan bila tidak ada sumber yang menyatakan apa pun. Dibuang: klausul di outline sumber yang tidak dikutip elemen mana pun, entah belum dibaca atau memang tidak memuat apa pun yang dibutuhkan spesifikasi; kutipan dari keputusan atau pertanyaan tidak dihitung, karena keduanya tidak dibandingkan, dan klausul yang hanya dikutip pertanyaan disebut sebagai sedang ditanyakan."
  "Kept": "Dipertahankan"
  "No element is stated by a source.": "Tidak ada elemen yang dinyatakan oleh sumber."
  "| Element | Clause | Says |": "| Elemen | Klausul | Isinya |"
  "Stated, citing without naming a source": "Dinyatakan, mengutip tanpa menyebut sumber"
  "These elements cite a clause and name no source for it; the validator reports each (schema). Name the source at the citation.": "Elemen-elemen ini mengutip klausul tanpa menyebut sumbernya; validator melaporkan masing-masing (schema). Sebutkan sumbernya di kutipan."
  "%s, a source the root file does not declare": "%s, sumber yang tidak dideklarasikan di root file"
  "Stated, citing nothing": "Dinyatakan, tanpa kutipan"
  "These elements say a source states them and cite none; the validator reports each (origin_citation). Add the citation, or change the origin.": "Elemen-elemen ini menyebut dinyatakan oleh sumber tapi tidak mengutip apa pun; validator melaporkan masing-masing (origin_citation). Tambahkan kutipannya, atau ubah asalnya."
  "Clarified": "Diperjelas"
  "No element was inferred.": "Tidak ada elemen yang disimpulkan."
  "| Element | Concluded from |": "| Elemen | Disimpulkan dari |"
  "not said; the validator reports it (origin_reason)": "tidak disebut; validator melaporkannya (origin_reason)"
  "Added or corrected": "Ditambahkan atau dikoreksi"
  "No element was decided.": "Tidak ada elemen yang diputuskan."
  "| Element | Decided in | Which | Why |": "| Elemen | Diputuskan di | Yang mana | Alasan |"
  "not said; the validator reports it (origin_decision)": "tidak disebut; validator melaporkannya (origin_decision)"
  ", which the specification does not hold": ", yang tidak ada di spesifikasi"
  "Dropped": "Dibuang"
  "No source lists its clauses, so nothing can be said to be dropped: list each source's outline under clauses, and this section names the clauses no element cites.": "Tidak ada sumber yang mendaftar klausulnya, jadi tidak ada yang bisa dinyatakan dibuang: daftarkan outline tiap sumber di clauses, dan bagian ini akan menyebut klausul yang tidak dikutip elemen mana pun."
  "%s of %d produced nothing.": "%s dari %d tidak menghasilkan apa-apa."
  "| Clause | Title |": "| Klausul | Judul |"
  "Cited by a question only, so asked about rather than dropped: ": "Hanya dikutip oleh pertanyaan, jadi sedang ditanyakan, bukan dibuang: "
  "Without an origin": "Tanpa asal"
  "These elements carry no origin although the specification tracks it; the validator reports each (origin_missing). Say for each whether a source states it, it was inferred, or a decision settled it.": "Elemen-elemen ini tidak punya asal padahal spesifikasi melacaknya; validator melaporkan masing-masing (origin_missing). Untuk tiap elemen, sebutkan apakah dinyatakan sumber, disimpulkan, atau diputuskan lewat keputusan."
  "These elements carry no origin: they were written spec-first, or the specification does not track origin yet (info.tracksOrigin).": "Elemen-elemen ini tidak punya asal: ditulis secara spec-first, atau spesifikasi belum melacak asal (info.tracksOrigin)."
  "Sources": "Sumber"
