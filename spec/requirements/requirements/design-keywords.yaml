  SA-78:
    statement: specarch generate ui shall write, through specarch-gen-ui-swiftui, the task, list and form pages and the views of a specification for the iPhone in SwiftUI, from an implementation file in Swift whose ui target is platform iphone, so that the screens follow the design's fields, checks, refusals, events and permissions as the Next.js and Carbon screens do, drawn by the components the ui-components idiom names for swiftui.
