translations:
  "**Problem%s:** %s: %s: %s [%s]": "**Masalah%s:** %s: %s: %s [%s]"
  "The specification has %s, so it is invalid, and this document shows what could be read of it.": "Spesifikasi ini punya %s, jadi tidak valid, dan dokumen ini menampilkan bagian yang masih bisa dibaca."
  "error": "error"
  "errors": "error"
  "None of them is in what this document covers.": "Tidak ada satu pun yang termasuk cakupan dokumen ini."
  "warning": "warning"
  "warnings": "warning"
  "%s concerns this document; it is marked by a Problem paragraph at its element, or below when the document shows no element for it.": "%s menyangkut dokumen ini; ditandai dengan paragraf Masalah di elemennya, atau di bawah bila dokumen ini tidak menampilkan elemennya."
  "%s concern this document; each is marked by a Problem paragraph at its element, or below when the document shows no element for it.": "%s menyangkut dokumen ini; masing-masing ditandai dengan paragraf Masalah di elemennya, atau di bawah bila dokumen ini tidak menampilkan elemennya."
  "The problems file lists every problem, and specarch validate prints them.": "File masalah memuat semua masalah, dan specarch validate juga mencetaknya."
  "Errors": "Error"
  "The specification has %s, so it is invalid: the questions below are those of what could be read, and nothing is ready until the errors are fixed. Each line gives the file, line and column, the pointer, the rule and how to fix it.": "Spesifikasi ini punya %s, jadi tidak valid: pertanyaan di bawah berasal dari bagian yang bisa dibaca, dan belum ada yang siap sampai error-nya diperbaiki. Tiap baris memuat file, baris dan kolom, pointer, rule, dan cara memperbaikinya."
  "Problems of %s: no problems.": "Masalah di %s: tidak ada masalah."
  "Problems of %s: %s.": "Masalah di %s: %s."
  " (%d must, %d should, %d could)": " (%d must, %d should, %d could)"
  "open question": "pertanyaan terbuka"
  "open questions": "pertanyaan terbuka"
same:
  - "```text"
