# yaml-language-server: $schema=../../../schema/specarch-fragment-test-0.2.schema.json
command: extract
level: system
scenario: golden
given: "a repository holding a Go module on dxlib whose endpoints declare what they take and answer where NewEndPoint registers them: a JSON POST with a literal parameter list in snake_case of typed parameters (a positive int64, a non-empty string with a maximum length and a pattern given through a pointer helper, a nullable date, money, a JSON object with children, one of them of a type a function computes, an array of a JSON template, a map of strings and an array of strings) and response possibilities with a success carrying a data template and a refusal with a header; a GET whose parameters a module function returns as its one statement, with bounds and an enum; a POST whose parameters a package variable holds; a POST whose parameters and responses functions build with statements; a JSON POST that declares no parameter and whose handler decodes its body itself; a PUT of an octet stream with a parameter; and a PATCH with a parameter, a method dxlib refuses with 422"
when: "extract go is run on the module"
then: "it writes the JSON POST's body as an object of camelCase fields with their types, formats, bounds, enums, required lists, children, items and map values as dxlib's emitter writes them, the field of a computed type known by name only with a must question on it, its 200 response with its description and body, and its 409 response with its description and the problem the handler answers; the GET's parameters as query parameters; the variable's parameters as the body; a must question for the parameters and the responses functions build, naming the call, and none besides on the success those responses would give; the body that declares nothing as any object with a must question on its fields, which says its handler decodes Request.Body, a stream dxlib has already read to its end for a JSON endpoint; the octet stream as a binary body; one must question on the widths of the int64 fields; a could question for the header and for the parameters dxlib reads from the X-Var header; no parameter for the PATCH, with a must question on the operation that says dxlib refuses that method; a must question for each operation with no success response and for a response with no description; lists no middleware on any operation, since each is registered with none; sets info.wireNames snake_case; and exits 0"
verifies: [SA-44]
