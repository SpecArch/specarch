#cloud-config
# Generated by specarch-gen-deploy from ../spec/specarch.yaml, version 0.1.0; meta-model 1.0.0; digest sha256:ef87a100f8b5d25cab00c51d536392d4c8d983189d958d0f2400a350d8f7af82; the host db of the deployment production of environment production as a cloud-init file. Do not edit this file: a change goes into the specification, the implementation file's deployments or the deploy target's settings.
# Draft: the specification is not approved: there is no records/approvals/0.1.0.yaml beside the specification; this file is not the approved output.
# The host runs db as a container under systemd, through a Quadlet unit (podman 4.4 or later). The secrets are read from /etc/library-lending/secrets.env, which the operator writes on the host, holding DB_PASSWORD; the unit refuses to start without it, naming what it misses, and this file never holds a value of it.
# The image reads the password as POSTGRES_PASSWORD: the unit copies the line DB_PASSWORD of /etc/library-lending/secrets.env under that name into /run/library-lending/db.env, which root alone reads, before it starts.
# db: database of the deployment production, postgresql://db.library.internal:5432
package_update: true
packages:
  - podman
write_files:
  - path: "/etc/containers/systemd/db-data.volume"
    permissions: "0644"
    content: |
      [Volume]
      VolumeName=db-data
  - path: "/etc/containers/systemd/db.container"
    permissions: "0644"
    content: |
      [Unit]
      Description=The loans database.
      AssertPathExists=/etc/library-lending/secrets.env
      [Container]
      Image=docker.io/library/postgres:16
      ContainerName=db
      EnvironmentFile=/run/library-lending/db.env
      Environment=POSTGRES_DB=library_lending
      Volume=db-data.volume:/var/lib/postgresql/data
      PublishPort=5432:5432
      [Service]
      ExecStartPre=/bin/sh -c 'for v in DB_PASSWORD; do grep -q "^$${v}=" /etc/library-lending/secrets.env || { echo "$${v} is not in /etc/library-lending/secrets.env: write it there, from the secret store of the host" >&2; exit 1; }; done'
      ExecStartPre=/bin/sh -c 'umask 077 && mkdir -p /run/library-lending && sed -n "s/^DB_PASSWORD=/POSTGRES_PASSWORD=/p" /etc/library-lending/secrets.env >/run/library-lending/db.env'
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  - "systemctl daemon-reload"
  - "systemctl start db.service || { echo \"db.service did not start; its reason: $(systemctl status db.service --no-pager 2>&1 | tail -n 5)\" >&2; exit 1; }"
