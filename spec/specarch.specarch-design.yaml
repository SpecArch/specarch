# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/main/schema/specarch-design-0.1.schema.json
specarch: "0.1"

info:
  title: SpecArch toolchain
  version: 0.1.0
  description: |
    The `specarch` command: it validates SpecArch files and generates
    documents and code from them. This file is the design, with no language,
    library or build tool in it. How one stack implements it is in
    `specarch.go.specarch-implementation.yaml` beside it.
  owners: [specarch-maintainers]

requirementSources:
  SA:
    description: Requirement list of the SpecArch toolchain, kept in `specarch.specarch-design.md` under "Requirements".

enums:
  DocumentKind:
    type: string
    enum: [design, implementation]
    valueDescriptions:
      design: a SpecArch Definition File (SDF), `*.specarch-design.yaml`, the design
      implementation: a SpecArch Implementation File (SIF), `*.specarch-implementation.yaml`, one stack's implementation of a design file
    requirements: [SA-1, SA-9]
  Rule:
    type: string
    description: |
      Every check the validator makes. A diagnostic names one of these, so a
      test can assert the exact rule and a reader can look it up here.
    enum:
      - file_kind
      - yaml_syntax
      - unquoted_date
      - duplicate_key
      - schema
      - stack_key
      - design_key
      - ref_type
      - relation_target
      - relation_via
      - field
      - state_field
      - state_value
      - trigger
      - requirement
      - emits
      - operation
      - page
      - algorithm
      - decision
      - enum_value
      - path_parameter
      - duplicate_operation
      - permission_undeclared
      - permission_ungranted
      - expression_syntax
      - expression_name
      - expression_type
      - example_input
      - example_expected
      - example_mismatch
      - example_error
      - implements
      - design_ref
      - unsafe_integer
      - change_log
      - test_subject
      - test_case
      - test_golden_missing
      - test_red_missing
      - test_case_missing
      - suite
    valueDescriptions:
      file_kind: the file name ends in neither `.specarch-design.yaml` nor `.specarch-implementation.yaml`, or its root key does not match its name
      yaml_syntax: the file is not well-formed YAML
      unquoted_date: a date written without quotes, which YAML reads as a timestamp
      duplicate_key: a mapping repeats a key
      schema: the file breaks the meta-model's JSON Schema
      stack_key: a design file carries a key that belongs to one implementation
      design_key: an implementation file carries a key that belongs to the design
      ref_type: a `$ref` names an entity or enum the file does not have
      relation_target: a relation's target is not an entity of the file
      relation_via: a relation's `via` is not the field or join entity its kind needs
      field: a name that must be a field of an entity is not one (required, primaryKey, unique fields, page columns, fields and filters)
      state_field: the `stateField` is not a field whose type is an enum
      state_value: a transition's `from` or `to` is not a value of the state field's enum
      trigger: a transition's trigger is not an operation, command, channel message or algorithm
      requirement: a requirement link's prefix is not a requirement source
      emits: an `emits` entry names a channel or message that does not exist
      operation: a `source`, `submit` or operation action names an operationId that does not exist
      page: a navigate action names a page that does not exist
      algorithm: an `algorithm` reference names an algorithm that does not exist
      decision: a `supersededBy` names a decision that does not exist, or an implementation decision reuses a design decision's ID
      enum_value: a `valueDescriptions` key is not a value of its enum
      path_parameter: a `{name}` in a path has no path parameter, or a path parameter is not in the path
      duplicate_operation: two operations share an operationId
      permission_undeclared: an operation, command, page, action or role names a permission that is not declared
      permission_ungranted: a declared permission is granted by no role and is not `public`
      expression_syntax: a check or formula does not parse
      expression_name: an expression names a field, input or function that does not exist
      expression_type: an expression combines values of types that do not fit
      example_input: a worked example's inputs are missing one, name an unknown one, or have the wrong type
      example_expected: a worked example's expected value does not have the output's type
      example_mismatch: the formula evaluated on a worked example's inputs does not give the expected value
      example_error: the formula cannot be evaluated on a worked example's inputs (division by zero, null in arithmetic)
      implements: an implementation file's `implements` does not name a readable design file of the same version
      design_ref: a pointer into the design file does not resolve
      unsafe_integer: an int64 or uint64 is carried as a JSON number without bounds inside 2^53
      change_log: a description reads as a change log instead of the current truth (a warning)
      test_subject: a test is about an operation, command, page, constraint or transition that does not exist
      test_case: a test covers a case its subject does not have, or a red case in a golden test
      test_golden_missing: a subject has no golden scenario (a warning in 0.1)
      test_red_missing: a subject has no red scenario and no derived red case (a warning in 0.1)
      test_case_missing: a case derived from the design has no test (a warning in 0.1)
      suite: an implementation's test suite names a design test or subject that does not exist
    requirements: [SA-2, SA-3, SA-4, SA-5, SA-6, SA-9, SA-10]
  Severity:
    type: string
    enum: [error, warning]
    valueDescriptions:
      error: the file is invalid
      warning: printed, but the file stays valid; in 0.1 only missing test scenarios and change-log phrases
    requirements: [SA-6]
  GeneratorTarget:
    type: string
    enum: [techspec, openapi, sql, ui, tests, manual, scripts]
    valueDescriptions:
      techspec: arc42 technical specification in Markdown with generated Mermaid diagrams
      openapi: OpenAPI 3.1 document
      sql: forward SQL migrations, new files only
      ui: page definitions for the target component library
      tests: one test per worked example
      manual: user manual and operations guide
      scripts: guarded operational scripts for data changes
    requirements: [SA-7]

entities:
  SpecFile:
    description: One file given to a command, as the command read it.
    type: object
    properties:
      path: { type: string, description: The path as given on the command line or found under a given folder. }
      kind: { $ref: "#/enums/DocumentKind" }
      metaModel: { type: string, description: "The meta-model version the file declares: `specarch` for a design file, `specarchImplementation` for an implementation file." }
      version: { type: string, description: The file's own `info.version`. }
    required: [path, kind, metaModel, version]
    primaryKey: [path]
    requirements: [SA-1]

  Diagnostic:
    description: |
      One problem found in one file. Printed as one line:
      `file:line: severity: /yaml/path: rule: message`.
    type: object
    properties:
      file: { type: string, description: The file's path as given. }
      severity: { $ref: "#/enums/Severity" }
      line: { type: integer, format: int32, minimum: 1, description: "Line of the YAML node the problem is at; for an expression, the line inside the expression." }
      path: { type: string, description: "JSON pointer to the node, such as `/entities/Loan/relations/member/target`; `/` for the whole file." }
      rule: { $ref: "#/enums/Rule" }
      message: { type: string, minLength: 1, description: "What is wrong and how to fix it, in one plain sentence." }
    required: [file, line, severity, path, rule, message]
    primaryKey: [file, line, path, rule]
    relations:
      specFile: { target: SpecFile, kind: many-to-one, via: file }
    constraints:
      diagnostic_line_positive:
        kind: check
        expression: line >= 1
        message: Every diagnostic points at a line.
    requirements: [SA-6]

  GeneratedFile:
    description: A file a generator wrote. Its header names where it came from.
    type: object
    properties:
      path: { type: string, description: Path inside the generator's own folder. }
      target: { $ref: "#/enums/GeneratorTarget" }
      sourceFile: { type: string, description: The design file it was generated from. }
      sourceVersion: { type: string, description: That file's `info.version`. }
      metaModel: { type: string, description: The meta-model version of that file. }
      markersOnly: { type: boolean, description: "True for a hand-written Markdown document, where only the text between `specarch:generate` markers is rewritten." }
    required: [path, target, sourceFile, sourceVersion, metaModel, markersOnly]
    primaryKey: [path]
    relations:
      source: { target: SpecFile, kind: many-to-one, via: sourceFile }
    requirements: [SA-7, SA-8]

permissions:
  public: { description: "Anyone who has the program may run it. It reads and writes local files only." }

commands:
  validate:
    summary: Check SpecArch files
    description: |
      Checks every file given, and every `*.specarch-design.yaml` and
      `*.specarch-implementation.yaml` under every folder given, against the meta-model
      and against the rules JSON Schema cannot express. It reports every
      problem in every file, not only the first.
    permission: public
    arguments:
      - name: paths
        description: Files and folders. A folder is searched recursively.
        required: true
        repeatable: true
        schema: { type: string }
    reads:
      - { path: "{paths}", description: Definition and implementation files. }
      - { path: "the design file named in each implementation file's `implements`", description: Read to resolve the implementation file's references. }
    standardOutput: One line per diagnostic, sorted by file, then line, then path, then rule.
    standardError: A usage message on a usage error, the reason on an unreadable file, and a one-line count at the end.
    exitCodes:
      "0": every file is valid
      "1": at least one file has an error
      "2": usage error, a file or folder could not be read, or a folder holds no SpecArch file
    algorithm: exitStatus
    requirements: [SA-1, SA-2, SA-3, SA-4, SA-5, SA-6, SA-9, SA-10]

  generate:
    summary: Generate one target from design files
    description: |
      Validates its input first and generates nothing from an invalid file.
      Then writes the target into the folder it owns, and nothing outside it,
      except the regions between `specarch:generate` markers in the
      hand-written `<name>.specarch-design.md` beside each design file. Every
      generated file starts with a header naming the design file, its
      `info.version`, the implementation file when one was given, and the
      meta-model version. With `--check` nothing is written: the output is
      generated in memory and compared with what is on disk.

      The techspec target writes `<name>.techspec.md`: an arc42 technical
      specification of the design file, with chapters only for what the
      design holds. Diagrams are Mermaid: an entity diagram, a state diagram
      for each entity with a state field, a sequence diagram for each
      operation and command, a flowchart of the pages, and a permissions
      table. Chapter 7, deployment and implementation, comes from the
      implementation file and is left out without one. A marker names what
      goes in its region: `erDiagram`, `stateDiagram <Entity>`,
      `sequenceDiagram <operationId or command>`, `flowchart pages` or
      `permissions`.
    permission: public
    arguments:
      - name: target
        required: true
        schema: { $ref: "#/enums/GeneratorTarget" }
      - name: paths
        description: Design files, and for each the implementation file that names it, when the target needs one. A folder is searched as validate searches it.
        required: true
        repeatable: true
        schema: { type: string }
    options:
      out:
        description: The folder the target owns. Without it, the folder the implementation file's generators name for the target, relative to that file.
        schema: { type: string }
      check:
        description: Generate in memory and fail when the files on disk differ. Writes nothing.
        schema: { type: boolean, default: false }
    reads:
      - { path: "{paths}", description: The design and implementation files. }
      - { path: "<name>.specarch-design.md", description: "The hand-written document beside each design file, when there is one." }
      - { path: "{out}", description: "The current output, with `--check`." }
    writes:
      - { path: "{out}/<name>.techspec.md", description: "The technical specification of each design file. Nothing is written with `--check`." }
      - { path: "<name>.specarch-design.md", description: "Only the regions between markers. Nothing is written with `--check`." }
    standardOutput: |
      The diagnostics of an invalid input file and the errors of a marker,
      one line each. With `--check`, one line per file that differs or is
      missing, and per techspec file in the folder that no given design file
      produces.
    standardError: A usage message on a usage error, the reason a file cannot be read or written, and a one-line count at the end.
    exitCodes:
      "0": generated, or with `--check` the output is current
      "1": an input file has an error, a marker is wrong, or with `--check` the output differs
      "2": usage error, a target the program does not offer, no output folder, or a file that could not be read or written
    algorithm: checkStatus
    requirements: [SA-7, SA-8]

  version:
    summary: Print the program version and the meta-model versions it reads
    permission: public
    standardOutput: The program version, then one line per meta-model version it supports.
    exitCodes:
      "0": printed

algorithms:
  exitStatus:
    description: |
      The status of a whole `validate` run. A usage or read error outranks
      diagnostics, because a run that could not read its input has not
      checked it.
    inputs:
      usageError: { type: boolean }
      ioError: { type: boolean }
      errors: { type: integer, format: int32, minimum: 0, description: Diagnostics with severity error. }
    output: { type: integer, format: int32 }
    formula: "usageError || ioError ? 2 : (errors > 0 ? 1 : 0)"
    examples:
      - name: every file valid
        inputs: { usageError: false, ioError: false, errors: 0 }
        expected: 0
      - name: three problems
        inputs: { usageError: false, ioError: false, errors: 3 }
        expected: 1
      - name: no arguments
        inputs: { usageError: true, ioError: false, errors: 0 }
        expected: 2
      - name: one file unreadable, another invalid
        inputs: { usageError: false, ioError: true, errors: 2 }
        expected: 2
    pseudocode: |
      function exitStatus(usageError, ioError, errors):
          if usageError or ioError:
              return 2
          if errors > 0:
              return 1
          return 0
    requirements: [SA-6]

  referenceResolves:
    description: |
      Every cross-reference check is the same question: of the objects of the
      kind the reference names, in the same file, how many carry that name?
      Exactly one resolves. None is a dangling reference. Two can only
      happen for operationIds, which are not map keys, and is reported as a
      duplicate.
    inputs:
      definitions: { type: integer, format: int32, minimum: 0, description: "Objects of the referenced kind with that name, in the same file." }
    output: { type: boolean }
    formula: definitions == 1
    examples:
      - name: relation target exists
        inputs: { definitions: 1 }
        expected: true
      - name: relation target misspelt
        inputs: { definitions: 0 }
        expected: false
        note: "`target: Lone` in a file with an entity `Loan`."
      - name: operationId used twice
        inputs: { definitions: 2 }
        expected: false
    pseudocode: |
      for each reference r in the file, in document order:
          candidates = objects of kind(r) in the file whose name is r.name
          if count(candidates) == 0:
              report r.rule at r: "<name> is not a <kind> of this file"
          # duplicates are reported once, at the second definition
      for each operationId seen more than once:
          report duplicate_operation at the second and later uses
    requirements: [SA-2]

  permissionGranted:
    description: |
      Fail-closed access. A permission an operation, command, page, action or
      role names must be declared. A declared permission must be granted by
      at least one role, unless it is `public`. An operation with no
      permission at all is already a schema error.
    inputs:
      declared: { type: boolean }
      name: { type: string }
      grantingRoles: { type: integer, format: int32, minimum: 0 }
    output: { type: boolean }
    formula: declared && (name == "public" || grantingRoles >= 1)
    examples:
      - name: granted by the librarian role
        inputs: { declared: true, name: loans.create, grantingRoles: 1 }
        expected: true
      - name: public needs no role
        inputs: { declared: true, name: public, grantingRoles: 0 }
        expected: true
      - name: declared but nobody holds it
        inputs: { declared: true, name: loans.export, grantingRoles: 0 }
        expected: false
        note: Nobody could ever call an operation guarded by it.
      - name: used but never declared
        inputs: { declared: false, name: loans.delete, grantingRoles: 0 }
        expected: false
    pseudocode: |
      for each use u of a permission (operation, command, page, action, role):
          if u.name not in permissions:
              report permission_undeclared at u
      for each declared permission p other than "public":
          if no role lists p:
              report permission_ungranted at p
    requirements: [SA-5]

  workedExampleHolds:
    description: |
      A worked example holds when the formula, evaluated on the example's
      inputs with exact decimal arithmetic, gives the expected value. The
      type checker has already made sure a decimal result has no more places
      than the output's scale, so the comparison is exact and by value:
      "3.50" equals "3.5". Where the design wants rounding, the formula says
      so with round(x, places), which rounds half away from zero.
    inputs:
      computed: { type: string, format: decimal, precision: 38, scale: 6, description: The formula's result. }
      expected: { type: string, format: decimal, precision: 38, scale: 6 }
    output: { type: boolean }
    formula: computed == expected
    examples:
      - name: same value, written with a trailing zero
        inputs: { computed: "3.5", expected: "3.50" }
        expected: true
      - name: the example forgot the cap
        inputs: { computed: "25.00", expected: "45.00" }
        expected: false
        note: "A wrong example fails validation instead of becoming a wrong test."
    pseudocode: |
      for each algorithm a, for each example e in a.examples:
          check e.inputs has exactly the names of a.inputs, each of its type
          check e.expected has the type of a.output
          values = e.inputs read by their declared types: int, uint and
                   decimal as exact numbers, dates and timestamps as instants
          result = evaluate(a.formula, values)     # error -> example_error
          if result != e.expected:                  # by value: 3.5 == 3.50
              report example_mismatch: "gives <result>, expected <expected>"
    requirements: [SA-4]

  checkStatus:
    description: The status of `generate --check`.
    inputs:
      invalidInput: { type: boolean }
      differingFiles: { type: integer, format: int32, minimum: 0 }
    output: { type: integer, format: int32 }
    formula: "invalidInput || differingFiles > 0 ? 1 : 0"
    examples:
      - name: output is current
        inputs: { invalidInput: false, differingFiles: 0 }
        expected: 0
      - name: a diagram was edited by hand
        inputs: { invalidInput: false, differingFiles: 1 }
        expected: 1
      - name: the spec does not validate
        inputs: { invalidInput: true, differingFiles: 0 }
        expected: 1
    pseudocode: |
      if validate(paths) has diagnostics:
          return 1
      wanted = generate(target, paths) in memory
      differing = files in wanted whose bytes differ from disk,
                  plus files on disk in the target's folder not in wanted
      print each differing path
      return 1 if differing else 0
    requirements: [SA-7]

  markersWellFormed:
    description: |
      A hand-written Markdown document is rewritten only between its markers:
      `<!-- specarch:generate <what> -->` and `<!-- specarch:end -->`. Every
      begin has its end before the next begin, so regions never nest.
    inputs:
      begins: { type: integer, format: int32, minimum: 0 }
      ends: { type: integer, format: int32, minimum: 0 }
      nested: { type: integer, format: int32, minimum: 0, description: Begins found inside an open region. }
    output: { type: boolean }
    formula: begins == ends && nested == 0
    examples:
      - name: two diagrams
        inputs: { begins: 2, ends: 2, nested: 0 }
        expected: true
      - name: an end deleted by hand
        inputs: { begins: 2, ends: 1, nested: 1 }
        expected: false
    pseudocode: |
      open = none
      for each line l of the document:
          if l is a begin marker:
              if open: error "marker inside an open region"
              open = l
          else if l is an end marker:
              if not open: error "end without begin"
              replace the lines between open and l with generate(open.what)
              open = none
      if open: error "begin without end"
      if open.what names an object that no longer exists: error, never an empty block
    requirements: [SA-8]

tests:
  validate-valid-design:
    command: validate
    scenario: golden
    given: "a design file with only specarch and info"
    when: "validate is run on its folder"
    then: "it prints nothing and exits 0"
  validate-valid-implementation:
    command: validate
    scenario: golden
    given: "a design file and an implementation file that names it at the same version"
    when: "validate is run on their folder"
    then: "it prints nothing and exits 0"
  validate-folder-search:
    command: validate
    scenario: golden
    given: "a folder holding a design file two levels down and a text file"
    when: "validate is run on the folder"
    then: "it finds and checks the design file, ignores the text file, and exits 0"
  validate-derived-cases-listed:
    command: validate
    scenario: golden
    given: "an operation with a required field, length limits, a permission and a 409 response, and no tests"
    when: "validate is run"
    then: "it warns once for every derived case no test covers, each with a test to copy, and exits 0"
  validate-derived-cases-covered:
    command: validate
    scenario: golden
    given: "an operation whose every derived case is covered by a test, one of them marked not applicable with a reason"
    when: "validate is run"
    then: "it prints nothing and exits 0"
  validate-change-log-warning:
    command: validate
    scenario: golden
    given: "a description that says how the file changed"
    when: "validate is run"
    then: "it warns with change_log and exits 0, since the file is still valid"
  version-prints-versions:
    command: version
    scenario: golden
    given: "the program"
    when: "version is run"
    then: "it prints the program version and the meta-model versions it reads, and exits 0"
  validate-yaml-syntax:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a flow mapping that is never closed"
    when: "validate is run"
    then: "it reports yaml_syntax with the line and exits 1"
  validate-unquoted-date:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a decision date written without quotes"
    when: "validate is run"
    then: "it reports unquoted_date and exits 1"
  validate-duplicate-key:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a file with info twice"
    when: "validate is run"
    then: "it reports duplicate_key at the second info and exits 1"
  validate-file-kind-root:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a file named as a design file that starts with specarchImplementation"
    when: "validate is run"
    then: "it reports file_kind and exits 1"
  validate-file-kind-name:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a file whose name ends in neither SpecArch suffix, given by name"
    when: "validate is run"
    then: "it reports file_kind and exits 1"
  validate-schema-operation-without-permission:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "an operation with no permission"
    when: "validate is run"
    then: "it reports the missing permission with rule schema and exits 1"
  validate-schema-empty-role:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a role that grants an empty list of permissions"
    when: "validate is run"
    then: "it reports the empty list with rule schema and exits 1"
  validate-schema-algorithm-without-pseudocode:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "an algorithm without pseudocode"
    when: "validate is run"
    then: "it reports the missing pseudocode with rule schema and exits 1"
  validate-schema-list-page-without-source:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a list page without a source operation"
    when: "validate is run"
    then: "it reports the missing source with rule schema and exits 1"
  validate-schema-requirement-link-form:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a role whose requirement link is in lower case"
    when: "validate is run"
    then: "it reports the link's form with rule schema and exits 1"
  validate-schema-requirements-on-field:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a field that carries its own requirements"
    when: "validate is run"
    then: "it reports requirements as a key a field cannot have and exits 1"
  validate-schema-untyped-integer:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "an integer field without a format"
    when: "validate is run"
    then: "it reports the missing format with rule schema and exits 1"
  validate-stack-key:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a design file with an x-oapi-codegen key on an operation"
    when: "validate is run"
    then: "it reports stack_key and exits 1"
  validate-design-key:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "an implementation file with an entities key"
    when: "validate is run"
    then: "it reports design_key and exits 1"
  validate-ref-type:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a field whose $ref names an enum that does not exist"
    when: "validate is run"
    then: "it reports ref_type and exits 1"
  validate-relation-target:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a relation whose target is misspelt"
    when: "validate is run"
    then: "it reports relation_target and exits 1"
  validate-relation-via:
    command: validate
    scenario: red
    covers: [exit 1]
    given: "a many-to-one relation whose via field does not exist"
    when: "validate is run"
    then: "it reports relation_via and exits 1"
  validate-field:
    command: validate
    scenario: red
