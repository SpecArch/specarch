    clauses:
      - {clause: line 11, title: Keep an empty note}
      - {clause: line 14, title: Read a note}
      - {clause: line 7, title: Keep a note}
  sheet:
    kind: document
    title: sheet.csv
    edition: 3712f73908ce4c79711352a7aae1720294a61275
