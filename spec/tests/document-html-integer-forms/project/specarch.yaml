specarch: "0.3"
info: { title: Lending, version: 1.0.0 }
entities:
  Member:
    type: object
    properties:
      id: { type: string, maxLength: 36 }
      fullName: { title: Full name, type: string, minLength: 0o1, maxLength: 0x40 }
      outstandingFees: { title: Outstanding fees, type: string, format: decimal, precision: 0x0A, scale: 0b10 }
      nicknames: { title: Nicknames, type: array, items: { type: string, maxLength: 1_0 }, minItems: 01, maxItems: 0b11 }
    required: [id, fullName, outstandingFees]
    primaryKey: [id]
    relations:
      loans: { target: Loan, kind: one-to-many, via: memberId }
  Loan:
    type: object
    properties:
      id: { type: string, maxLength: 36 }
      memberId: { type: string, maxLength: 36 }
      dueOn: { title: Due on, type: string, maxLength: 10 }
      renewals: { title: Renewals, type: integer, format: int32, minimum: 0b0, maximum: 1_00 }
    required: [id, memberId, dueOn]
    primaryKey: [id]
permissions:
  loans.read: { description: See loans. }
  loans.write: { description: Change loans. }
  loans.renew: { description: Renew loans. }
roles:
  reader:
    description: Sees loans.
    permissions: [loans.read]
  clerk:
    description: Changes loans.
    permissions: [loans.write]
  supervisor:
    description: Renews loans.
    permissions: [loans.renew]
paths:
  /loans:
    get:
      operationId: listLoans
      summary: List loans
      permission: loans.read
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 2_00 } }
      listOf: { entity: Loan, pageSize: { default: 0b10100, maximum: 0x64 } }
      responses:
        "200":
          description: The loans.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Loan" } }
    post:
      operationId: createLoan
      summary: Lend a copy
      permission: loans.write
      limits: { maxRequestBytes: 0o2000, rate: { requests: 0036, per: PT1M, burst: 0b111100 } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/entities/Loan" }
      responses:
        "201": { description: Lent. }
  /members/{memberId}:
    parameters:
      - { name: memberId, in: path, required: true, schema: { type: string, maxLength: 36 } }
    get:
      operationId: getMember
      summary: One member with their loans
      permission: loans.read
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema: { $ref: "#/entities/Member" }
    put:
      operationId: lendCopies
      summary: Lend copies to a member
      permission: loans.write
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/entities/Member" }
      responses:
        "200": { description: Lent. }
separationOfDuties:
  read-write-renew:
    description: Nobody both reads, changes and renews loans.
    permissions: [loans.read, loans.write, loans.renew]
    cardinality: 0b11
    why: Renewing a loan one has lent and can see hides an overdue copy.
pages:
  member-loans:
    kind: form
    title: Lend copies
    description: The desk adds a row per copy lent.
    route: /members/{memberId}/loans
    entity: Member
    permission: loans.write
    source: getMember
    submit: lendCopies
    fields: [fullName, outstandingFees]
    childRows:
      - { relation: loans, title: Loans, fields: [dueOn, renewals], maximum: 0x6 }
tests:
  list-loans-succeeds: { operation: listLoans, level: system, scenario: golden, given: a caller with loans.read, when: listLoans is called, then: it answers 200 }
  list-loans-denied: { operation: listLoans, level: system, scenario: red, covers: [denied without loans.read], given: a caller without loans.read, when: listLoans is called, then: it is refused }
  create-loan-succeeds: { operation: createLoan, level: system, scenario: golden, given: a clerk, when: createLoan is called with every field, then: it answers 201 }
  create-loan-denied: { operation: createLoan, level: system, scenario: red, covers: [denied without loans.write], given: a caller without loans.write, when: createLoan is called, then: it is refused }
  create-loan-missing: { operation: createLoan, level: system, scenario: red, covers: [missing id, missing memberId, missing dueOn], given: a clerk, when: createLoan is called without a required field, then: it is refused }
  get-member-succeeds: { operation: getMember, level: system, scenario: golden, given: a caller with loans.read and a member, when: getMember is called with its memberId, then: it answers 200 }
  get-member-denied: { operation: getMember, level: system, scenario: red, covers: [denied without loans.read], given: a caller without loans.read, when: getMember is called, then: it is refused }
  get-member-not-found: { operation: getMember, level: system, scenario: red, covers: [not found memberId], given: no member with that memberId, when: getMember is called, then: it is refused as not found }
  lend-copies-succeeds: { operation: lendCopies, level: system, scenario: golden, given: a clerk and a member, when: lendCopies is called with every field, then: it answers 200 }
  lend-copies-denied: { operation: lendCopies, level: system, scenario: red, covers: [denied without loans.write], given: a caller without loans.write, when: lendCopies is called, then: it is refused }
  lend-copies-missing: { operation: lendCopies, level: system, scenario: red, covers: [missing id, missing fullName, missing outstandingFees], given: a clerk, when: lendCopies is called without a required field, then: it is refused }
  lend-copies-not-found: { operation: lendCopies, level: system, scenario: red, covers: [not found memberId], given: no member with that memberId, when: lendCopies is called, then: it is refused as not found }
  lend-copies-fees-not-decimal: { operation: lendCopies, level: system, scenario: red, covers: [outstandingFees not a valid decimal], given: a clerk, when: lendCopies is called with outstandingFees that is not a valid decimal, then: it is refused }
  member-loans-succeeds: { page: member-loans, level: system, scenario: golden, given: a clerk and a member, when: the page member-loans is opened for that member, then: it shows the page }
  member-loans-denied: { page: member-loans, level: system, scenario: red, covers: [denied without loans.write], given: a caller without loans.write, when: the page member-loans is opened, then: it is refused }
  member-loans-not-found: { page: member-loans, level: system, scenario: red, covers: [not found memberId], given: no member with that memberId, when: the page member-loans is opened for that memberId, then: it says the record was not found }
