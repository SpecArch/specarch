permissions:
  v1.all:
    implies: [v1.get, v1.loans.renew.post]
    origin: inferred
    why: 'The permission table''s rules reach /v1/* with every method, and by the fixed rule of ADR-100 a pattern and method pair is the permission named by the pattern''s literal words in lower case, then all for every method or the method: v1.all.'
    cites:
      - {source: code, clause: access role desk-supervisor, says: desk-supervisor reaches /v1/* with every method through admin-web.}
  v1.export.get:
    origin: inferred
    why: 'The permission table''s rules reach /v1/:kind/export with GET, and by the fixed rule of ADR-100 a pattern and method pair is the permission named by the pattern''s literal words in lower case, then all for every method or the method: v1.export.get.'
    cites:
      - {source: code, clause: access role desk-staff, says: 'desk-staff reaches /v1/:kind/export with GET.'}
  v1.get:
    implies: [v1.export.get, v1.reports.get]
    origin: inferred
    why: 'The permission table''s rules reach /v1/* with GET, and by the fixed rule of ADR-100 a pattern and method pair is the permission named by the pattern''s literal words in lower case, then all for every method or the method: v1.get.'
    cites:
      - {source: code, clause: access role desk-staff, says: desk-staff reaches /v1/* with GET through desk-web.}
  v1.loans.renew.post:
    origin: inferred
    why: 'The permission table''s rules reach /v1/loans/:id/renew with POST, and by the fixed rule of ADR-100 a pattern and method pair is the permission named by the pattern''s literal words in lower case, then all for every method or the method: v1.loans.renew.post.'
    cites:
      - {source: code, clause: access role desk-staff, says: 'desk-staff reaches /v1/loans/:id/renew with POST through desk-web.'}
  v1.reports.get:
    origin: inferred
    why: 'The permission table''s rules reach /v1/reports/* with GET, and by the fixed rule of ADR-100 a pattern and method pair is the permission named by the pattern''s literal words in lower case, then all for every method or the method: v1.reports.get.'
    cites:
      - {source: code, clause: access role auditor, says: auditor reaches /v1/reports/* with GET through admin-web; auditor reaches /v1/reports/* with GET.}
  v2.get:
    origin: inferred
    why: 'The permission table''s rules reach /v2/* with GET, and by the fixed rule of ADR-100 a pattern and method pair is the permission named by the pattern''s literal words in lower case, then all for every method or the method: v2.get.'
    cites:
      - {source: code, clause: access role auditor, says: auditor reaches /v2/* with GET.}
roles:
  auditor:
    permissions: [v1.reports.get, v2.get]
    origin: stated
    cites:
      - {source: code, clause: access role auditor, says: auditor reaches /v1/reports/* with GET through admin-web; /v1/reports/* with GET; /v2/* with GET.}
  desk-staff:
    permissions: [v1.export.get, v1.get, v1.loans.renew.post]
    through:
      v1.get: [desk-web]
      v1.loans.renew.post: [desk-web]
    origin: stated
    cites:
      - {source: code, clause: access role desk-staff, says: 'desk-staff reaches /v1/* with GET through desk-web; /v1/loans/:id/renew with POST through desk-web; /v1/:kind/export with GET.'}
  desk-supervisor:
    permissions: [v1.all]
    through:
      v1.all: [admin-web]
    origin: stated
    cites:
      - {source: code, clause: access role desk-supervisor, says: desk-supervisor reaches /v1/* with every method through admin-web.}
clients:
  admin-web:
    kind: application
    origin: stated
    cites:
      - {source: code, clause: access client admin-web, says: The table narrows a grant to admin-web.}
  desk-web:
    kind: application
    origin: stated
    cites:
      - {source: code, clause: access client desk-web, says: The table narrows a grant to desk-web.}
