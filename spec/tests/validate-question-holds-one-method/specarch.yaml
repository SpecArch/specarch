  clerk:
    description: Staff at the desk.
    permissions: [parcels.read, parcels.write]
paths:
  /parcels:
    get:
      operationId: listParcels
      summary: List the parcels
      permission: parcels.read
      responses:
        "200": { description: The parcels. }
