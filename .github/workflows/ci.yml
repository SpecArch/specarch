name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # specarch extract names the commit that last changed each path
          # it reads, and refuses a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test, including the conformance suite
        run: go test ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Validate SpecArch's own specification and every example
        run: go run ./cmd/specarch validate spec examples
      - name: The fragment schemas and every fragment's hint line are current with the design schema
        # go test checks it too; this step names what to run when it fails.
        run: go run ./tools/fragment-schemas -check
      - name: The lending desk's database extracts the same twice and validates
        run: |
          for run in one two; do go run ./cmd/specarch extract database --out "$RUNNER_TEMP/$run" examples/lending-desk/sources/catalogue/catalogue.json > "$RUNNER_TEMP/$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/one" "$RUNNER_TEMP/two" && cmp "$RUNNER_TEMP/one.txt" "$RUNNER_TEMP/two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/one"
      - name: The lending desk's routes extract the same twice and validate
        run: |
          for run in one two; do go run ./cmd/specarch extract router --out "$RUNNER_TEMP/routes-$run" examples/lending-desk/sources/routes/routes.json > "$RUNNER_TEMP/routes-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/routes-one" "$RUNNER_TEMP/routes-two" && cmp "$RUNNER_TEMP/routes-one.txt" "$RUNNER_TEMP/routes-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/routes-one"
      - name: The lending desk's database and routes merge the same twice, validate and give their gaps
        # gaps exits 1 while a must or should question is open, which is
        # the normal state of a specification read from sources. Seventeen
        # must: what each of the seven routes does, the values of the five
        # paths' parameters, what the permissions allow and which role
        # grants each, the members route that checks no permission, and
        # the messages of the loans table's check and the members table's
        # address check. Two could: the card numbers of the
        # loans and members tables, CHAR columns written as strings.
        run: |
          for run in one two; do go run ./cmd/specarch merge --out "$RUNNER_TEMP/merged-$run" "$RUNNER_TEMP/one" "$RUNNER_TEMP/routes-one" > "$RUNNER_TEMP/merged-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/merged-one" "$RUNNER_TEMP/merged-two" && cmp "$RUNNER_TEMP/merged-one.txt" "$RUNNER_TEMP/merged-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/merged-one"
          status=0; go run ./cmd/specarch gaps "$RUNNER_TEMP/merged-one" > "$RUNNER_TEMP/gaps.txt" || status=$?
          test "$status" -eq 1 && grep -q '19 open questions (17 must, 0 should, 2 could)' "$RUNNER_TEMP/gaps.txt"
      - name: The lending desk's manual extracts the same twice, and merged with the code gives the loan period as one must question
        # The manual says 21 days at clause 3.3; the loans table checks 14.
        run: |
          for run in one two; do go run ./cmd/specarch extract documents --out "$RUNNER_TEMP/manual-$run" examples/lending-desk/sources/manual.md > "$RUNNER_TEMP/manual-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/manual-one" "$RUNNER_TEMP/manual-two" && cmp "$RUNNER_TEMP/manual-one.txt" "$RUNNER_TEMP/manual-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/manual-one"
          for run in one two; do go run ./cmd/specarch merge --out "$RUNNER_TEMP/whole-$run" "$RUNNER_TEMP/manual-one" "$RUNNER_TEMP/one" "$RUNNER_TEMP/routes-one" > "$RUNNER_TEMP/whole-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/whole-one" "$RUNNER_TEMP/whole-two" && cmp "$RUNNER_TEMP/whole-one.txt" "$RUNNER_TEMP/whole-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/whole-one"
          test "$(grep -c 'the document says 21 days, the check loans_loan_period of Loans says 14' "$RUNNER_TEMP/whole-one.txt")" -eq 1
          grep -q "blocks: \['#/requirements/MANUAL-2/statement'\]" "$RUNNER_TEMP/whole-one/requirements/questions.yaml"
      - name: The lending desk's OpenAPI document extracts the same twice with its snake_case names, and merged with the routes asks one question, naming the path the router does not serve
        # The document has the four routes and a renewal, and names its
        # properties in snake_case; the router answers its permission
        # questions and it answers the router's.
        run: |
          for run in one two; do go run ./cmd/specarch extract openapi --out "$RUNNER_TEMP/api-$run" examples/lending-desk/sources/openapi/openapi.yaml > "$RUNNER_TEMP/api-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/api-one" "$RUNNER_TEMP/api-two" && cmp "$RUNNER_TEMP/api-one.txt" "$RUNNER_TEMP/api-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/api-one"
          grep -q '^  wireNames: snake_case$' "$RUNNER_TEMP/api-one/specarch.yaml"
          if grep -q '^not held: .*, property [a-z_0-9]*: \(its name\|read as\)' "$RUNNER_TEMP/api-one.txt"; then echo "a property was left out for its name"; exit 1; fi
          grep -q 'required: \[id, cardNumber, barcode, loanedOn, dueOn\]' "$RUNNER_TEMP/api-one/design/openapi.yaml"
          for run in one two; do go run ./cmd/specarch merge --out "$RUNNER_TEMP/served-$run" "$RUNNER_TEMP/api-one" "$RUNNER_TEMP/routes-one" > "$RUNNER_TEMP/served-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/served-one" "$RUNNER_TEMP/served-two" && cmp "$RUNNER_TEMP/served-one.txt" "$RUNNER_TEMP/served-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/served-one"
          test "$(grep -c 'not built yet' "$RUNNER_TEMP/served-one.txt")" -eq 1
          grep -q '#/paths/~1loans~1{loanId}~1renew/post: not built yet' "$RUNNER_TEMP/served-one.txt"
      - name: The lending desk's permission table extracts the same twice, and merged with the database and the routes asks what the permissions allow once and reports no unchecked grant
        # The seed grants desk-staff three permissions the routes check and
        # desk-supervisor the write-off and reading the loans.
        run: |
          for run in one two; do go run ./cmd/specarch extract permissions --out "$RUNNER_TEMP/grants-$run" examples/lending-desk/sources/permissions/permissions.json > "$RUNNER_TEMP/grants-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/grants-one" "$RUNNER_TEMP/grants-two" && cmp "$RUNNER_TEMP/grants-one.txt" "$RUNNER_TEMP/grants-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/grants-one"
          grep -q 'wrote 2 roles, 4 permissions' "$RUNNER_TEMP/grants-one.txt"
          for run in one two; do go run ./cmd/specarch merge --out "$RUNNER_TEMP/granted-$run" "$RUNNER_TEMP/one" "$RUNNER_TEMP/routes-one" "$RUNNER_TEMP/grants-one" > "$RUNNER_TEMP/granted-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/granted-one" "$RUNNER_TEMP/granted-two" && cmp "$RUNNER_TEMP/granted-one.txt" "$RUNNER_TEMP/granted-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/granted-one"
          test "$(grep -c '^asked twice: ' "$RUNNER_TEMP/granted-one.txt")" -eq 1
          if grep -q '^unchecked: ' "$RUNNER_TEMP/granted-one.txt"; then echo "a granted permission was reported unchecked"; exit 1; fi
      - name: The lending desk's app folder extracts the same twice, and merged with the database the loans entity's question is answered
        # Three pages, one in a route group with a dynamic segment and a
        # schema file that names the loans entity and its columns.
        run: |
          for run in one two; do go run ./cmd/specarch extract pages --out "$RUNNER_TEMP/pages-$run" examples/lending-desk/sources/web/app > "$RUNNER_TEMP/pages-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/pages-one" "$RUNNER_TEMP/pages-two" && cmp "$RUNNER_TEMP/pages-one.txt" "$RUNNER_TEMP/pages-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/pages-one"
          grep -q 'wrote 3 pages, 1 entity, 1 permission' "$RUNNER_TEMP/pages-one.txt"
          grep -q 'columns: \[barcode, loanedOn, dueOn, returnedOn\]' "$RUNNER_TEMP/pages-one/design/pages.yaml"
          for run in one two; do go run ./cmd/specarch merge --out "$RUNNER_TEMP/paged-$run" "$RUNNER_TEMP/one" "$RUNNER_TEMP/pages-one" > "$RUNNER_TEMP/paged-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/paged-one" "$RUNNER_TEMP/paged-two" && cmp "$RUNNER_TEMP/paged-one.txt" "$RUNNER_TEMP/paged-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/paged-one"
          grep -q '^answered: .*#/entities/Loans/primaryKey' "$RUNNER_TEMP/paged-one.txt"
      - name: The lending desk's BPMN file extracts the same twice, and merged with the routes and the OpenAPI document its trigger and write-off step are joined
        # One process: an approval by desk-supervisor within two days that
        # refuses when it passes, and a service task. The file names the
        # operations and declares neither, so each is a must question that
        # names it; the router declares both and the OpenAPI document
        # gives the trigger its 202.
        run: |
          for run in one two; do go run ./cmd/specarch extract workflows --out "$RUNNER_TEMP/flows-$run" examples/lending-desk/sources/workflows/write-off.bpmn > "$RUNNER_TEMP/flows-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/flows-one" "$RUNNER_TEMP/flows-two" && cmp "$RUNNER_TEMP/flows-one.txt" "$RUNNER_TEMP/flows-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/flows-one"
          grep -q 'wrote 1 workflow, 1 role' "$RUNNER_TEMP/flows-one.txt"
          grep -q '^    names: requestWriteOff$' "$RUNNER_TEMP/flows-one/design/questions.yaml"
          for run in one two; do go run ./cmd/specarch merge --out "$RUNNER_TEMP/flowed-$run" "$RUNNER_TEMP/api-one" "$RUNNER_TEMP/routes-one" "$RUNNER_TEMP/flows-one" > "$RUNNER_TEMP/flowed-$run.txt" || exit 1; done
          diff -r "$RUNNER_TEMP/flowed-one" "$RUNNER_TEMP/flowed-two" && cmp "$RUNNER_TEMP/flowed-one.txt" "$RUNNER_TEMP/flowed-two.txt"
          go run ./cmd/specarch validate "$RUNNER_TEMP/flowed-one" 2>&1 | grep -q ': 0 errors,'
          grep -q '^joined: .* on #/workflows/write-off/trigger, ' "$RUNNER_TEMP/flowed-one.txt"
          grep -q '^joined: .* on #/workflows/write-off/steps/1/operation, ' "$RUNNER_TEMP/flowed-one.txt"
          grep -q '^    trigger: requestWriteOff$' "$RUNNER_TEMP/flowed-one/design/workflows.yaml"
      - name: The lending desk's SQL and OpenAPI leave out the book records another team owns, the same twice
        # Book's mapping names the catalogue team under ownedBy: no table
        # and no schema for it, the loans table's foreign key to books
        # kept, and validate and gaps still reading Book.
        run: |
          go build -o "$RUNNER_TEMP/bin/specarch-gen-sql" ./cmd/specarch-gen-sql
          go build -o "$RUNNER_TEMP/bin/specarch-gen-openapi" ./cmd/specarch-gen-openapi
          export PATH="$RUNNER_TEMP/bin:$PATH"
          for run in one two; do
            go run ./cmd/specarch generate sql --unapproved --out "$RUNNER_TEMP/owned-$run/sql" examples/lending-desk || exit 1
            go run ./cmd/specarch generate openapi --unapproved --out "$RUNNER_TEMP/owned-$run/openapi" examples/lending-desk || exit 1
          done
          diff -r "$RUNNER_TEMP/owned-one" "$RUNNER_TEMP/owned-two"
          if grep -q 'CREATE TABLE books' "$RUNNER_TEMP/owned-one/sql/0001_expand.sql"; then echo "books was generated"; exit 1; fi
          grep -q 'CREATE TABLE loans' "$RUNNER_TEMP/owned-one/sql/0001_expand.sql"
          grep -q 'REFERENCES books (barcode)' "$RUNNER_TEMP/owned-one/sql/0001_expand.sql"
          if grep -q '^    Book:$' "$RUNNER_TEMP/owned-one/openapi/openapi.yaml"; then echo "the Book schema was generated"; exit 1; fi
          grep -q '^    Loan:$' "$RUNNER_TEMP/owned-one/openapi/openapi.yaml"
          # The specification names its wire snake_case, so the schemas
          # carry the names the desk's OpenAPI document gives.
          for name in card_number full_name barcode loaned_on due_on returned_on; do grep -q "^        $name:$" "$RUNNER_TEMP/owned-one/openapi/openapi.yaml" || { echo "$name is not on the wire"; exit 1; }; done
          if grep -qE '^ +(cardNumber|fullName|loanedOn|dueOn|returnedOn):$' "$RUNNER_TEMP/owned-one/openapi/openapi.yaml"; then echo "a camelCase name went on the wire"; exit 1; fi
          status=0; go run ./cmd/specarch gaps examples/lending-desk > "$RUNNER_TEMP/owned-gaps.txt" || status=$?
          test "$status" -eq 1 && grep -q '#/entities/Book' "$RUNNER_TEMP/owned-gaps.txt"
      - name: The lending desk extracts end to end the same twice, and gaps lists the phone number and the open member route as must questions
        # The manual has a personal phone number the members table does not;
        # the router serves GET /members/{cardNumber} with no permission,
        # and no document mentions it. The Go source is read with the
        # check the implementation file names, and the route table answers
        # its question whether the running system registers each of the
        # seven routes.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/specarch" ./cmd/specarch
          for run in one two; do SPECARCH="$RUNNER_TEMP/bin/specarch" examples/lending-desk/extract.sh "$RUNNER_TEMP/desk-$run" || exit 1; done
          diff -r "$RUNNER_TEMP/desk-one" "$RUNNER_TEMP/desk-two"
          grep -q ': 0 errors,' "$RUNNER_TEMP/desk-one/validate.txt"
          grep -q '^  wireNames: snake_case$' "$RUNNER_TEMP/desk-one/spec/specarch.yaml"
          grep -q '^joined: .* on #/workflows/write-off/trigger, ' "$RUNNER_TEMP/desk-one/merge.txt"
          grep -q '^joined: .* on #/pages/members-by-card-number-loans/source, ' "$RUNNER_TEMP/desk-one/merge.txt"
          grep -F -B2 'Not built yet. The documents have field phoneNumber of entity Members' "$RUNNER_TEMP/desk-one/gaps.txt" | grep -q '(must, decision)'
          grep -F -B2 'Undocumented, from code: is operation showMember (GET /members/{cardNumber})' "$RUNNER_TEMP/desk-one/gaps.txt" | grep -q '(must, decision)'
          grep -F -B2 'GET /members/{cardNumber} checks no permission' "$RUNNER_TEMP/desk-one/gaps.txt" | grep -q '(must, decision)'
          test "$(grep -c 'prints it as the running system registers it' "$RUNNER_TEMP/desk-one/merge.txt")" -eq 7
          grep -q '^merged .* and 0 keys the trees disagree on$' "$RUNNER_TEMP/desk-one/merge.txt"
          grep -rhF 'lending/routes.go:38' "$RUNNER_TEMP/desk-one/spec/design" | grep -q 's.Require("loans.write")'
          grep -F -B2 'sources/web/middleware.ts runs before every route its matcher selects' "$RUNNER_TEMP/desk-one/gaps.txt" | grep -q '(must, decision)'
      - name: The notice board extracts from dxlib's document and its Go source the same twice, and every operation cites both
        # The document dxlib emitted is printed and answers the Go tree's
        # question whether the running system registers each operation;
        # GET /v1/health checks no privilege, and the create handler reads
        # a parameter its endpoint does not declare. The source also
        # declares the notice table, seeds roles with a grant of
        # EVERYTHING, reads a configuration file with a sensitive key, and
        # has a session check a setting switches off.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/specarch" ./cmd/specarch
          for run in one two; do SPECARCH="$RUNNER_TEMP/bin/specarch" examples/notice-board/extract.sh "$RUNNER_TEMP/board-$run" || exit 1; done
          diff -r "$RUNNER_TEMP/board-one" "$RUNNER_TEMP/board-two"
          grep -q ': 0 errors,' "$RUNNER_TEMP/board-one/validate.txt"
          test "$(grep -c 'prints it as the running system registers it' "$RUNNER_TEMP/board-one/merge.txt")" -eq 6
          grep -q '^    reading: parsed$' "$RUNNER_TEMP/board-one/spec/specarch.yaml"
          grep -q '^    reading: printed$' "$RUNNER_TEMP/board-one/spec/specarch.yaml"
          grep -F 'GET /v1/health checks no privilege' "$RUNNER_TEMP/board-one/gaps.txt"
          grep -F 'reads the parameter pinned, which the endpoint does not declare' "$RUNNER_TEMP/board-one/gaps.txt"
          grep -F 'Does the database hold table board.notice?' "$RUNNER_TEMP/board-one/gaps.txt"
          grep -F 'admin is granted EVERYTHING' "$RUNNER_TEMP/board-one/gaps.txt"
          grep -F 'The check RequireSession runs only when the setting NOTICE_BOARD_SESSIONS_ON is true' "$RUNNER_TEMP/board-one/gaps.txt"
          grep -A2 '^  boardDatabasePassword:$' "$RUNNER_TEMP/board-one/spec/deployment/configuration.yaml" | grep -q '^    secret: true$'
      - name: The reading list extracts from the code-facts dumps of its Swift app and server the same twice, and validates
        # The dumps are committed, so this step needs no Swift toolchain.
        # The app gives six screens, a link labelled Reviews, its SwiftData
        # models and the snake_case names its review's CodingKeys give;
        # the server gives the permission its own check names on two
        # routes, a route registered in a loop and a handler that reads a
        # parameter its path does not have.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/specarch" ./cmd/specarch
          for run in one two; do SPECARCH="$RUNNER_TEMP/bin/specarch" examples/reading-list/extract.sh "$RUNNER_TEMP/shelf-$run" || exit 1; done
          diff -r "$RUNNER_TEMP/shelf-one" "$RUNNER_TEMP/shelf-two"
          grep -q ': 0 errors,' "$RUNNER_TEMP/shelf-one/validate.txt"
          grep -q '^wrote 6 pages, 2 entities, 2 schemas' "$RUNNER_TEMP/shelf-one/app.txt"
          grep -qF -- '- {label: Reviews, kind: navigate, target: review-list}' "$RUNNER_TEMP/shelf-one/spec/design/pages.yaml"
          test "$(grep -c 'permission: books.write' "$RUNNER_TEMP/shelf-one/spec/design/paths.yaml")" -eq 2
          grep -q '^  wireNames: snake_case$' "$RUNNER_TEMP/shelf-one/spec/specarch.yaml"
          grep -qF 'registers a route in a loop' "$RUNNER_TEMP/shelf-one/gaps.txt"
          grep -qF 'reads the path parameter reviewID' "$RUNNER_TEMP/shelf-one/gaps.txt"
      - name: Generated documents are current
        # The first loop is the one CONTRIBUTING.md gives, over every
        # specification at once. examples/lending-desk is a partial
        # specification written from sources and configures only the
        # documents an owner reads while questions are open
        # (docs/from-sources.md, section 4), so that loop warns for it at
        # testplan, deployment and commissioning and goes on (ADR-073).
        run: |
          for target in techspec requirements testplan traceability deployment commissioning; do go run ./cmd/specarch document $target --check spec examples || exit 1; done
          for target in techspec requirements testplan traceability deployment commissioning questions problems changes releases html; do go run ./cmd/specarch document $target --check spec examples/library-lending || exit 1; done
          for target in techspec requirements traceability questions problems html; do go run ./cmd/specarch document $target --check examples/lending-desk || exit 1; done
      - name: Generated code and data are current
        # The library's migrations, OpenAPI document, workflows as BPMN and SVG, and screens, in plain
        # JavaScript and on Next.js, are checked in, so a design change that
        # leaves them stale fails here. The
        # example is not approved, hence --unapproved. Its tests target
        # writes into the service's own tree, which the example does not
        # hold, and the lending desk's SQL and OpenAPI are generated only
        # with --out, in the step above.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for generator in sql openapi ui ui-typescript bpmn; do go build -o "$RUNNER_TEMP/bin/specarch-gen-$generator" ./cmd/specarch-gen-$generator || exit 1; done
          export PATH="$RUNNER_TEMP/bin:$PATH"
          for target in sql openapi ui bpmn; do go run ./cmd/specarch generate $target --check --unapproved examples/library-lending || exit 1; done
      - name: A generated schema edited by hand is reported
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          schema=examples/library-lending/web-nextjs/acme/src/app/members/page.schema.ts
          sed -i 's/"members-list.columns.email", sortable: false/"members-list.columns.email", sortable: true/' "$schema"
          status=0; go run ./cmd/specarch generate ui --check --unapproved examples/library-lending > "$RUNNER_TEMP/edited.txt" || status=$?
          git checkout -- "$schema"
          test "$status" -eq 1 && grep -q "^$schema: differs from what generate writes" "$RUNNER_TEMP/edited.txt"

  web:
    # The library lending example's web screens on Next.js, on plain Carbon
    # and through the stub of @acme/screens: the workspace installed from
    # its lock file with no install scripts, each application type-checked,
    # linted with no rule turned off, its derived tests run, and built.
    runs-on: ubuntu-latest
    env:
      IBM_TELEMETRY_DISABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: examples/library-lending/web-nextjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: examples/library-lending/web-nextjs/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Derived tests
        run: pnpm test
      - name: Build
        run: pnpm build

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c release --package-path swift
      - name: Test, including the conformance suite
        run: swift test --package-path swift
      - name: Validate SpecArch's own specification and every example
        run: swift/.build/release/specarch validate spec examples
