decision:
  by: specification-author
  date: "2026-11-04"
  outcome: approved
  why: The communication, session, test session and deploy records are new kinds of the 1.0 record schema, log is a new command and decide --record a new option; decide's exit status 1 gains reasons only --record can give. unheard is a warning, so a specification clean on 1.4.0 gains warnings but no error; the four validate cases it changed gain that warning. A minor release carries it (ADR-186, ADR-220).
release: 1.5.0
