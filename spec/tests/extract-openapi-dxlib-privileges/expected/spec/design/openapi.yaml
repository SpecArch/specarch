permissions:
  everything:
    origin: inferred
    why: 'dxlib names the privilege EVERYTHING, and by the rule of ADR-076 a privilege named in capitals, digits and underscores, in segments joined by dots, is the permission of that name in lower case with every underscore a dot: everything. dxlib_module lets a caller holding EVERYTHING through every check, so only a role granted EVERYTHING holds this permission.'
    cites:
      - {source: openapi, clause: /paths/~1purgeAll/post, says: POST /purgeAll checks EVERYTHING in x-dxlib-privileges.}
  export.all:
    origin: inferred
    why: 'dxlib names the privilege EXPORT_ALL, and by the rule of ADR-076 a privilege named in capitals, digits and underscores, in segments joined by dots, is the permission of that name in lower case with every underscore a dot: export.all.'
    cites:
      - {source: openapi, clause: /paths/~1exportAll/post, says: POST /exportAll checks EXPORT_ALL in x-dxlib-privileges.}
  global.set.maintenance.mode:
    origin: inferred
    why: 'dxlib names the privilege GLOBAL.SET_MAINTENANCE_MODE, and by the rule of ADR-076 a privilege named in capitals, digits and underscores, in segments joined by dots, is the permission of that name in lower case with every underscore a dot: global.set.maintenance.mode.'
    cites:
      - {source: openapi, clause: /paths/~1setMaintenance/post, says: POST /setMaintenance checks GLOBAL.SET_MAINTENANCE_MODE in x-dxlib-privileges.}
  loans.read:
    origin: stated
    cites:
      - {source: openapi, clause: /paths/~1listLoans/post, says: POST /listLoans and POST /showLoan check loans.read in x-dxlib-privileges.}
  loans.write:
    origin: stated
    cites:
      - {source: openapi, clause: /paths/~1archiveLoan/post, says: POST /archiveLoan and POST /createLoan check loans.write in x-dxlib-privileges.}
