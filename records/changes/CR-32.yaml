    - "#/tests/log-test-run-results-outside"
    - "#/tests/log-test-run-usage-error"
    - "#/tests/log-test-run-writes-record"
    - "#/tests/validate-test-run-ref"
impact: minor
decision:
  by: specification-author
  date: "2026-11-04"
  outcome: approved
  why: The test-run record is a new kind of the 1.0 record schema and log test-run a new subcommand; a specification without test runs is checked and documented as before, so a minor release carries it (ADR-186, ADR-230).
