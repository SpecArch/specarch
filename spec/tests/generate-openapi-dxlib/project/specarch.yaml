specarch: "0.1"
info: { title: Catalogue, version: 1.0.0 }
stages: [implementation]
stakeholders:
  owner: { description: The product owner. }
enums:
  Shelf:
    type: string
    enum: [fiction, reference]
entities:
  Book:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      title: { type: string, minLength: 1, maxLength: 300 }
      shelf: { $ref: "#/enums/Shelf" }
      pages: { type: integer, format: int32, minimum: 1, maximum: 5000 }
      price: { type: string, format: decimal, precision: 23, scale: 4 }
      contactEmail: { type: string, format: email, sensitivity: personal }
      subtitle: { type: [string, "null"], maxLength: 300 }
      edition: { type: [integer, "null"], format: int32, minimum: 1, default: 1 }
    required: [id, title, shelf, pages, price, edition]
    primaryKey: [id]
    audited: true
    deletion: soft
errors:
  book-not-found: { status: 404, title: No such book, condition: No book has the id. }
permissions:
  books.read: { description: See books. }
  books.write: { description: Add books. }
  public: { description: Open to everyone. }
roles:
  desk: { description: The desk., permissions: [books.read, books.write] }
paths:
  /books:
    get:
      operationId: listBooks
      summary: The books
      permission: books.read
      listOf:
        entity: Book
        searchable: [title]
        filterable: [shelf]
        sortable: [title, pages]
        pageSize: { default: 20, maximum: 100 }
      responses:
        "200":
          description: A page of books.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/entities/Book" } }
    post:
      operationId: createBook
      summary: Add a book
      permission: books.write
      limits: { maxRequestBytes: 4096, rate: { requests: 10, per: PT1M } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/entities/Book" }
      responses:
        "201":
          description: The book.
          content:
            application/json:
              schema: { $ref: "#/entities/Book" }
  /books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBook
      summary: One book
      permission: public
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: { $ref: "#/entities/Book" }
        "404": { description: No such book., problem: book-not-found }
