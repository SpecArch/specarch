translations:
  "# %s: operations guide": "# %s: panduan operasional"
  "Version %s of the specification: %s, %s, %s and %s. For the people who run the live system: where it runs, what to look at each day, what to do when a monitor's objective is missed, what runs on its own, what it depends on, and how its data is saved and brought back.": "Spesifikasi versi %s: %s, %s, %s, dan %s. Untuk orang yang menjalankan sistem live: di mana sistem berjalan, apa yang perlu dilihat tiap hari, apa yang dilakukan saat target sebuah monitor tidak tercapai, apa yang berjalan sendiri, apa yang menjadi dependency-nya, serta cara datanya disimpan dan dikembalikan."
  "monitor": "monitor"
  "monitors": "monitor"
  "job": "job"
  "jobs": "job"
  "dependency": "dependency"
  "dependencies": "dependency"
  "endpoint": "endpoint"
  "endpoints": "endpoint"
  "Where it runs": "Tempat sistem berjalan"
  "The specification has no environments; each place the system runs, and the one a release is promoted to next, is written under environments.": "Spesifikasi ini tidak punya environment; tiap tempat sistem berjalan, dan environment tujuan promosi release berikutnya, ditulis di environments."
  "| Host | Address | Runs | Description |": "| Host | Alamat | Menjalankan | Deskripsi |"
  "the dependency ": "dependency "
  "host %d": "host %d"
  "Daily checklist": "Checklist harian"
  "The specification has no monitors, jobs, processes or dependencies, so there is nothing to look at each day; they are written under monitors, jobs, processes and dependencies.": "Spesifikasi ini tidak punya monitor, job, process, atau dependency, jadi tidak ada yang perlu dilihat tiap hari; semuanya ditulis di monitors, jobs, processes, dan dependencies."
  "What to look at on the live system each day. Tick the last column as each is seen to be as expected.": "Apa yang perlu dilihat di sistem live tiap hari. Centang kolom terakhir setiap kali satu item terlihat sesuai harapan."
  "| Check | What to look at | Expected | Seen |": "| Pengecekan | Yang dilihat | Yang diharapkan | Terlihat |"
  "| Monitor %s (%s) | %s | %s | %s |": "| Monitor %s (%s) | %s | %s | %s |"
  "It ran, and failed on no item.": "Sudah jalan, dan tidak gagal di item mana pun."
  "It ran, and no item is kept apart after its last try.": "Sudah jalan, dan tidak ada item yang disisihkan setelah percobaan terakhirnya."
  "It ran, and no item is kept apart after its last try; the section Jobs says where a kept item is.": "Sudah jalan, dan tidak ada item yang disisihkan setelah percobaan terakhirnya; bagian Job menyebut di mana item yang disisihkan berada."
  "| Job %s | %s | %s | %s |": "| Job %s | %s | %s | %s |"
  "Its last run, ": "Run terakhirnya, "
  "Its last run.": "Run terakhirnya."
  "It ran, and exited 0.": "Sudah jalan, dan exit 0."
  "That it is running.": "Bahwa process-nya sedang jalan."
  "It is running, and has not been started again since the last check.": "Sedang jalan, dan belum di-start ulang sejak pengecekan terakhir."
  "It is running and healthy: ": "Sedang jalan dan sehat: "
  "| Process %s | %s | %s | %s |": "| Process %s | %s | %s | %s |"
  "That it answers": "Bahwa ia menjawab"
  "It answers.": "Menjawab."
  "It answers within ": "Menjawab dalam waktu "
  "| Dependency %s | %s | %s | %s |": "| Dependency %s | %s | %s | %s |"
  "The specification has no monitors; what is watched on the live system, and the objective it must meet, is written under monitors.": "Spesifikasi ini tidak punya monitor; apa yang dipantau di sistem live, dan target yang harus dipenuhinya, ditulis di monitors."
  "%s In %s. Objective: %s": "%s Di %s. Target: %s"
  "Watched in %s (%s) with %s": "Dipantau di %s (%s) dengan %s"
  " Alert: ": " Alert: "
  "When the objective is missed:": "Saat target tidak tercapai:"
  "The specification does not say what to do when the objective is missed; the steps are written under the monitor's response.": "Spesifikasi tidak menyebut apa yang dilakukan saat target tidak tercapai; langkah-langkahnya ditulis di response milik monitor."
  "Jobs": "Job"
  "The specification has no jobs; what the system runs on its own, on a schedule or for each message, is written under jobs.": "Spesifikasi ini tidak punya job; apa yang dijalankan sistem sendiri, sesuai jadwal atau untuk tiap message, ditulis di jobs."
  "What the system runs on its own. A job acts as its role and may do only what the role's permissions allow.": "Apa yang dijalankan sistem sendiri. Sebuah job bertindak sebagai role-nya dan hanya boleh melakukan apa yang diizinkan permission role itu."
  "| Job | Starts | Acts as | After a failure | Description |": "| Job | Mulai | Bertindak sebagai | Setelah gagal | Deskripsi |"
  ": an item kept apart": ": item yang disisihkan"
  "The specification does not say what a person does with an item the job keeps apart; who handles it, where it is kept and the steps to try it again or discard it are written under the job's deadLetter.": "Spesifikasi tidak menyebut apa yang dilakukan orang terhadap item yang disisihkan job; siapa yang menanganinya, di mana disimpannya, dan langkah untuk mencobanya lagi atau membuangnya ditulis di deadLetter milik job."
  "Handled by the ": "Ditangani oleh role "
  " role: a person who holds it looks at each kept item, then tries it again or discards it.": ": orang yang memegang role ini melihat tiap item yang disisihkan, lalu mencobanya lagi atau membuangnya."
  "Processes": "Process"
  "The specification has no processes; a program a service manager starts and watches, kept running, started on a schedule or on demand, is written under processes.": "Spesifikasi ini tidak punya process; program yang di-start dan dipantau service manager, yang terus jalan, di-start sesuai jadwal, atau sesuai permintaan, ditulis di processes."
  "The programs the service manager starts and watches. A process acts as no role: the jobs it runs act as theirs.": "Program yang di-start dan dipantau service manager. Sebuah process tidak bertindak sebagai role apa pun: job yang dijalankannya bertindak sebagai role masing-masing."
  "| Process | Runs | Jobs | Restarted | Description |": "| Process | Menjalankan | Job | Di-restart | Deskripsi |"
  "Reads the settings ": "Membaca setting "
  " when it starts; the section Settings says what each is.": " saat start; bagian Setting menjelaskan masing-masing."
  "| Signal | What it does |": "| Signal | Fungsinya |"
  ", within ": ", dalam waktu "
  "The specification does not say which signals it honours; each is written under the process's signals.": "Spesifikasi tidak menyebut signal mana yang dipatuhinya; masing-masing ditulis di signals milik process."
  "| Exit status | Meaning | Started again |": "| Exit status | Arti | Di-start ulang |"
  "as Restarted says": "sesuai kolom Di-restart"
  "Healthy when ": "Sehat bila "
  " Looked at every ": " Dicek setiap "
  "the monitor ": "monitor "
  "the monitors ": "monitor "
  "Watched by ": "Dipantau oleh "
  "; the section Monitors says what to do when one is missed.": "; bagian Monitor menyebut apa yang dilakukan saat salah satunya tidak tercapai."
  "The specification names no monitor that watches it, so nobody is told when the service manager gives it up; the monitor is named under the process's monitors.": "Spesifikasi tidak menyebut monitor yang memantaunya, jadi tidak ada yang diberi tahu saat service manager menyerah menjalankannya; monitor-nya disebut di monitors milik process."
  "Channels": "Channel"
  "The specification has no channels; the messages the system publishes and consumes are written under channels.": "Spesifikasi ini tidak punya channel; message yang di-publish dan di-consume sistem ditulis di channels."
  "Each message, what carries it and who publishes and consumes it. A channel no dependency carries is the system's own.": "Tiap message, apa yang membawanya, serta siapa yang mem-publish dan meng-consume-nya. Channel yang tidak dibawa dependency mana pun adalah milik sistem sendiri."
  "| Channel | Carried by | Message | Published by | Consumed by |": "| Channel | Dibawa oleh | Message | Di-publish oleh | Di-consume oleh |"
  "the system itself": "sistem itu sendiri"
  "Dependencies": "Dependency"
  "The specification has no dependencies; each system it calls or that carries its channels is written under dependencies.": "Spesifikasi ini tidak punya dependency; tiap sistem yang dipanggilnya atau yang membawa channel-nya ditulis di dependencies."
  "What fails or waits when a dependency is down: every operation, job, gateway and channel that uses it.": "Apa yang gagal atau menunggu saat sebuah dependency mati: setiap operasi, job, gateway, dan channel yang memakainya."
  "| Dependency | Kind | Protocol | Time limit | Used by | Description |": "| Dependency | Jenis | Protokol | Batas waktu | Dipakai oleh | Deskripsi |"
  "Endpoints": "Endpoint"
  "The specification has no endpoints; each operation the system serves is written under paths.": "Spesifikasi ini tidak punya endpoint; tiap operasi yang dilayani sistem ditulis di paths."
  "Every endpoint the system serves, with the permission a caller needs; public is open to everyone.": "Setiap endpoint yang dilayani sistem, beserta permission yang dibutuhkan pemanggil; public terbuka untuk semua orang."
  "| Method | Path | Operation | Permission | Summary |": "| Method | Path | Operasi | Permission | Ringkasan |"
  "Settings": "Setting"
  "The specification has no settings; each value the system reads at run time is written under configuration.": "Spesifikasi ini tidak punya setting; tiap nilai yang dibaca sistem saat runtime ditulis di configuration."
  "Every setting the system reads at run time. A secret's value is never written here; its description says where the value comes from.": "Setiap setting yang dibaca sistem saat runtime. Nilai secret tidak pernah ditulis di sini; deskripsinya menyebut asal nilainya."
  "The specification has no backup; how the data of the live system is saved is written under backup.": "Spesifikasi ini tidak punya backup; cara data sistem live disimpan ditulis di backup."
  "The specification has no restore; how saved data is brought back is written under restore.": "Spesifikasi ini tidak punya restore; cara data yang disimpan dikembalikan ditulis di restore."
  "The specification has no rollback; how a release is taken back is written under rollback.": "Spesifikasi ini tidak punya rollback; cara sebuah release ditarik kembali ditulis di rollback."
  "always, from the host's start": "selalu, sejak host start"
  "on the schedule `": "sesuai jadwal `"
  "` (UTC)": "` (UTC)"
  "when a job it runs is due": "saat job yang dijalankannya jatuh tempo"
  "when started by a person or another program": "saat di-start oleh orang atau program lain"
  "not said": "tidak disebut"
  "whenever it ends": "setiap kali berhenti"
  "when it fails": "saat gagal"
  ", after ": ", setelah "
  "; given up after %s starts within %s": "; dihentikan setelah %s kali start dalam %s"
  "for each ": "untuk tiap "
  "when started by hand": "saat di-start manual"
  "not tried again": "tidak dicoba lagi"
  "tried again up to %s %s, then ": "dicoba lagi sampai %s %s, lalu "
  "times": "kali"
  "time": "kali"
  "kept apart for the %s role": "disisihkan untuk role %s"
  "kept apart for a person": "disisihkan untuk ditangani orang"
