    # specarch-problem: warning: test_case_missing: operation listMemberLoans has no red scenario for "cardNumber not matching its pattern"; add under tests list-member-loans-card-number-not-matching-its-pattern: { operation: listMemberLoans, scenario: red, covers: [cardNumber not matching its pattern], given: "...", when: "listMemberLoans is called with cardNumber in the wrong form", then: "it is refused" } [test_case_missing.856e2e15@design/openapi.yaml#/paths/~1members~1{cardNumber}~1loans/get]
