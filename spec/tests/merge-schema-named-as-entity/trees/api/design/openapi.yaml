paths:
  /notes:
    get:
      operationId: listNotes
      summary: List the notes
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema: {$ref: '#/schemas/NoteList'}
      origin: stated
      cites:
        - {source: openapi, clause: /paths/~1notes/get, says: 'GET /notes: List the notes.'}
schemas:
  Note:
    type: object
    properties:
      id: {type: string, maxLength: 36}
      title: {type: string, maxLength: 200}
    required: [id, title]
    origin: stated
    cites:
      - {source: openapi, clause: /components/schemas/Note, says: 'The schema Note, with the properties id and title.'}
  NoteList:
    type: object
    properties:
      items:
        type: array
        items: {$ref: '#/schemas/Note'}
    required: [items]
    origin: stated
    cites:
      - {source: openapi, clause: /components/schemas/NoteList, says: 'The schema NoteList, with the properties items.'}
