# yaml-language-server: $schema=../../../../../schema/specarch-fragment-design-0.1.schema.json
entities:
  Loan:
    description: One copy of one book lent to one member for a period.
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      memberId: { title: Member, type: string, format: uuid }
      bookId: { title: Book, type: string, format: uuid }
      loanedAt: { title: Recorded at, type: string, format: date-time, readOnly: true, description: When the loan was recorded. }
      lentOn: { title: Lent on, type: [string, "null"], format: date, description: "The day the copy left the desk: today, or an earlier day for a loan the desk made while the system was down. Null for a loan recorded before the desk gave the day, which was lent on the day of loanedAt." }
      dueOn: { title: Due on, type: string, format: date, description: "The day the copy is due back, no later than the member's tier allows." }
      returnedAt: { type: [string, "null"], format: date-time, readOnly: true }
      status: { title: Status, $ref: "#/enums/LoanStatus" }
      lateFee:
        title: Late fee
        type: string
        format: decimal
        precision: 10
        scale: 2
        readOnly: true
        description: Computed by the lateFee algorithm when the copy is returned; zero until then.
    required: [id, memberId, bookId, loanedAt, lentOn, dueOn, status, lateFee]
    primaryKey: [id]
    relations:
      member: { target: Member, kind: many-to-one, via: memberId, onDelete: restrict }
      book: { target: Book, kind: many-to-one, via: bookId, onDelete: restrict }
    constraints:
      loan_due_after_lent:
        kind: check
        expression: lentOn == null || dueOn > lentOn
        message: A copy is due after the day it is lent.
      loan_lent_by_recording:
        kind: check
        expression: lentOn == null || lentOn <= date(loanedAt)
        message: A copy is lent no later than the day its loan is recorded.
      loan_returned_after_loaned:
        kind: check
        expression: returnedAt == null || returnedAt >= loanedAt
        message: A copy cannot be returned before it was lent.
    stateField: status
    transitions:
      - { from: open, to: overdue, trigger: loan.overdue/LoanOverdue, description: "Nightly job finds the due date has passed.", satisfies: [LIB-4] }
      - { from: open, to: returned, trigger: returnLoan }
      - { from: overdue, to: returned, trigger: returnLoan }
      - { from: open, to: lost, trigger: reportLost }
      - { from: overdue, to: lost, trigger: reportLost }
    satisfies: [LIB-3, LIB-4]
