translations:
  "Handshakes": "Handshake"
  "Before it calls an operation that names one, a client performs the handshake; its requests on that operation and the answers then travel in an envelope encrypted with the cipher under a key both sides derived and signed by the sender, so that nothing between them reads or alters a body. The bytes of the envelope are the implementation's.": "Sebelum memanggil operasi yang menyebut sebuah handshake, client melakukan handshake itu; request-nya ke operasi tersebut dan jawabannya kemudian dikirim dalam envelope yang dienkripsi dengan cipher memakai key yang diturunkan kedua pihak dan ditandatangani pengirimnya, supaya tidak ada pihak di tengah yang bisa membaca atau mengubah body. Format byte envelope ditentukan oleh implementasi."
  "| Handshake | Key agreement | Signature | Cipher | Established by | Lifetime | Envelopes per handshake |": "| Handshake | Key agreement | Signature | Cipher | Dibentuk oleh | Masa berlaku | Envelope per handshake |"
  "does not expire by time": "tidak kedaluwarsa berdasarkan waktu"
  "any number": "berapa pun"
  "What a client does for %s:": "Yang dilakukan client untuk %s:"
  "1. It makes a signing key pair (%s) and two key-agreement pairs (%s).": "1. Client membuat satu signing key pair (%s) dan dua key-agreement pair (%s)."
  "2. It calls %s with its three public keys and receives the service's three public keys and the handshake's index.": "2. Client memanggil %s dengan tiga public key-nya dan menerima tiga public key milik service serta index handshake."
  "3. It derives two shared secrets by %s, one from each agreement pair: the first seals its requests, the second opens the answers.": "3. Client menurunkan dua shared secret dengan %s, satu dari tiap agreement pair: yang pertama menyegel request-nya, yang kedua membuka jawabannya."
  "4. For each operation under the handshake it encrypts the request body with %s under the first secret, signs the result with its %s key and sends it with the index; it opens each answer under the second secret and verifies the service's signature.": "4. Untuk tiap operasi di bawah handshake itu, client mengenkripsi request body dengan %s memakai secret pertama, menandatangani hasilnya dengan key %s miliknya, lalu mengirimnya bersama index; client membuka tiap jawaban dengan secret kedua dan memverifikasi signature service."
  "after it has carried %s %s": "setelah membawa %s %s"
  "5. %s, the handshake is no longer accepted, and the client performs it again before its next call.": "5. %s, handshake tidak lagi diterima, dan client melakukannya lagi sebelum panggilan berikutnya."
  ", or ": ", atau "
  "5. The handshake is accepted until the service refuses it, when the client performs it again before its next call.": "5. Handshake diterima sampai service menolaknya, dan saat itu client melakukannya lagi sebelum panggilan berikutnya."
  "Travels in the envelope of handshake %s, established by %s: the client seals and signs the request below and opens the answer": "Dikirim dalam envelope handshake %s, yang dibentuk oleh %s: client menyegel dan menandatangani request di bawah lalu membuka jawabannya"
  "; the file it answers comes back outside the envelope, as a stream": "; file yang dijawabnya kembali di luar envelope, sebagai stream"
  " (see Handshakes above).": " (lihat Handshake di atas)."
  "Streams the request body in as a file": "Men-stream request body masuk sebagai file"
  ", of at most ": ", maksimal "
  ", read as it arrives and never held whole; the body is the file, and the parameters listed below travel beside it.": ", dibaca sambil diterima dan tidak pernah ditampung utuh; body-nya adalah file itu, dan parameter yang terdaftar di bawah dikirim bersamanya."
  ", read as it arrives and never held whole; the body is the file and carries no fields.": ", dibaca sambil diterima dan tidak pernah ditampung utuh; body-nya adalah file itu dan tidak membawa field."
  "Streams the response body out as a file": "Men-stream response body keluar sebagai file"
  ", written as it is read and never held whole; a refusal is answered as a problem document instead of the file.": ", ditulis sambil dibaca dan tidak pernah ditampung utuh; penolakan dijawab sebagai problem document, bukan file."
