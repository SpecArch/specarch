arguments: [help, version]
exitStatus: 0
standardOutput: |
  specarch version

  Print the program version and the meta-model versions it reads.

  Output
    The program version, then one line for specifications, one for
    implementation files, records, idioms and estates, and one for
    vocabularies. Each line names the version a file of its kind is written in
    and the earlier versions still read beside it, each with a warning that
    the file is on an earlier version where the kind has one: `specifications:
    meta-model 1.0.0 and any later 1.0 patch, and 0.3, 0.2 and 0.1 with a
    warning`. The versions are the ones the validator reads by, so the line
    cannot name a version the validator does not read.

  Exit status
    0: printed

  specarch capabilities --json has the full description of version.
