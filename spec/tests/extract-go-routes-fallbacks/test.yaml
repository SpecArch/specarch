# yaml-language-server: $schema=../../../schema/specarch-fragment-test-0.2.schema.json
command: extract
level: system
scenario: golden
given: "a repository holding Go packages that each register a health route of their own and a fallback: on gin, NoRoute and NoMethod, Any under a group with a catch-all path, Match with a catch-all path, and Any on a plain path; on chi, NotFound and MethodNotAllowed and Handle with a catch-all; on gorilla/mux, PathPrefix given a router of the module with a route of its own, PathPrefix with Methods given another router of the module, PathPrefix given a handler that is no router, two routes whose last variable has a pattern that can match a slash, and the NotFoundHandler and MethodNotAllowedHandler fields set through a struct field that keeps the router, the second behind a condition; on echo, the HTTPErrorHandler field; and on net/http's ServeMux, a wildcard pattern, the pattern / with no method handing every request to another mux, and the pattern / with no method given a handler that is no router"
when: "extract go is run on the module"
then: "it writes one operation per health route, one for the route of the mux handed every request under /, and one for the route of each router PathPrefix is given, each mounted under no prefix, with a line for the Methods on the second mount; asks a must question blocking the design stage, counted as a registration, for each fallback registration and field, through the struct field too, naming the handler and the requests it takes, for the pattern / given a handler that is no router, for each route whose path ends in a catch-all, the gorilla/mux variables whose pattern matches a slash among them, and for PathPrefix given a handler that is no router, naming its prefix and its methods, every method for Any, Handle and PathPrefix; asks the question for a registration behind a condition for the field set behind one; asks the question for every method for the plain Any as before; and exits 0"
verifies: [SA-78]
