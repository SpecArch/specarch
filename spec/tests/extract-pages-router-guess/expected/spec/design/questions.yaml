questions:
  # specarch-problem: question: open_question: (must, decision) For the page at /, what are its kind (list, form, view or task), its title, the entity it shows, the operation it reads, the operation it submits to and the columns it lists? Decided by system-owner. Answer with a decision record that names Q-1 under answers. [Q-1]
  Q-1:
    question: For the page at /, what are its kind (list, form, view or task), its title, the entity it shows, the operation it reads, the operation it submits to and the columns it lists?
    kind: decision
    priority: must
    blocks: ['#/pages/root/kind', '#/pages/root/title', '#/pages/root/entity', '#/pages/root/source', '#/pages/root/submit', '#/pages/root/columns']
    decidedBy: system-owner
    why: The folders name a page's route and not what it shows.
  # specarch-problem: question: open_question: (must, decision) Which permission does the page at / check, or is it open to everyone (public)? Decided by system-owner. Answer with a decision record that names Q-2 under answers. [Q-2]
  Q-2:
    question: Which permission does the page at / check, or is it open to everyone (public)?
    kind: decision
    priority: must
    blocks: ['#/pages/root/permission']
    decidedBy: system-owner
    why: The folders name a page's route and not who may open it, and a page open to everyone is how an open screen is usually found, so it is asked, never assumed.
  # specarch-problem: question: open_question: (must, decision) Which framework serves the folder pages, Next.js or Nuxt? The reader read it as the pages of Nuxt, since package.json names neither next nor nuxt among its dependencies; the folder holds .vue files, which only Nuxt serves. It blocks pages. Decided by system-owner. Answer with a decision record that names Q-3 under answers. [Q-3]
  Q-3:
    question: Which framework serves the folder pages, Next.js or Nuxt? The reader read it as the pages of Nuxt, since package.json names neither next nor nuxt among its dependencies; the folder holds .vue files, which only Nuxt serves.
    kind: decision
    priority: must
    blocks: [pages]
    decidedBy: system-owner
    why: Next.js and Nuxt both serve pages from a folder named pages, by different rules, and the package that names the framework does not say which; the reader's choice is a guess, so it is asked.
    cites:
      - {source: code, clause: package.json, says: It does not name exactly one of next and nuxt among its dependencies.}
