specarch: "0.1"
info:
  title: Shop
  version: 1.0.0
  description: A small shop that takes orders and payments.
requirements:
  SHOP-1:
    statement: A clerk shall be able to take payment for an open order, after which the order is paid.
    kind: functional
    priority: must
    status: accepted
    acceptance: [Paying an open order makes it paid and publishes OrderPaid.]
enums:
  OrderState:
    type: string
    enum: [open, paid]
    valueDescriptions: { open: Being filled., paid: Paid in full. }
entities:
  Customer:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      name: { type: string, minLength: 1, maxLength: 80 }
    required: [id, name]
    primaryKey: [id]
    relations:
      orders: { target: Order, kind: one-to-many, via: customerId }
  Order:
    type: object
    properties:
      id: { type: string, format: uuid, readOnly: true }
      customerId: { type: string, format: uuid }
      state: { $ref: "#/enums/OrderState" }
      total: { type: string, format: decimal, precision: 10, scale: 2 }
    required: [id, customerId, state, total]
    primaryKey: [id]
    relations:
      customer: { target: Customer, kind: many-to-one, via: customerId }
    stateField: state
    transitions:
      - { from: open, to: paid, trigger: payOrder }
    satisfies: [SHOP-1]
permissions:
  orders.pay: { description: Take payment for an order. }
  public: { description: Everyone. }
roles:
  clerk: { description: Staff at the till., permissions: [orders.pay] }
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      permission: public
      responses:
        "200":
          description: The orders.
          content: { application/json: { schema: { type: array, items: { $ref: "#/entities/Order" } } } }
  /orders/{orderId}/pay:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: payOrder
      summary: Take payment for an order
      permission: orders.pay
      emits: [order.events/OrderPaid]
      responses:
        "200":
          description: The paid order.
          content: { application/json: { schema: { $ref: "#/entities/Order" } } }
        "409": { description: The order is already paid. }
channels:
  order.events:
    messages:
      OrderPaid: { summary: An order was paid., payload: { $ref: "#/entities/Order" } }
pages:
  orders-list:
    kind: list
    title: Orders
    route: /orders
    entity: Order
    permission: public
    source: listOrders
    columns: [customerId, state, total]
    actions:
      - { label: Pay, kind: operation, target: payOrder, permission: orders.pay }
