# yaml-language-server: $schema=../../../schema/specarch-fragment-design-0.1.schema.json
commands:
  gaps:
    summary: List the open questions and what they hold up
    description: |
      Validates its input first, and prints the open questions document
      of a specification with errors too (ADR-065), the text
      `document questions` writes, from its title: the counts by
      priority, the elements by origin when the specification tracks it,
      the errors, one problem line each, when it has any, the questions
      of what could be read grouped by stage in
      life-cycle order and within a stage by priority then ID, each with
      who decides, what it blocks (and for a blocked element, which keys
      are missing there), the name it gives for the key it blocks with
      the file and line of the element that leaves the key out, its
      options, its Insight and Notes; then, when
      a source lists its clauses, the coverage: per such source, the
      elements each clause produced, how many clauses produced nothing,
      and the citations outside the listed clauses; then the outputs, one row per document target and per code target the
      implementation files name, each ready, a draft (the questions and
      the errors that concern it) or waiting (the errors, the questions,
      and the approval that is missing or void).
    permission: public
    arguments:
      - name: paths
        description: Folders holding specifications, searched as validate searches them.
        required: true
        repeatable: true
        schema: { type: string }
    reads:
      - { path: "{paths}", description: The specifications and their implementation files. }
      - { path: "records/approvals/<version>.yaml", description: "The approval of the specification's version, beside its folder, when there is one." }
    standardOutput: The open questions document of each specification, with its errors listed in it.
    standardError: A usage message on a usage error, and the reason on an unreadable path.
    exitCodes:
      "0": no must or should question is open and no specification has an error
      "1": at least one must or should question is open, or a specification has an error
      "2": usage error, or a path that could not be read
    satisfies: [SA-19, SA-30]
    why: |
      The owner and the agent run validate after every edit, so validate
      counts the open questions and lists none; this verb is the list, with
      what each question holds up, so that the next decision is always in
      view. The same text is the document, because the people who decide
      read documents, not terminals.
    cites:
      - source: iso-29148
        clause: "6.6.3"
        says: "The closure of to-be-determined and to-be-resolved items against plan is a measure of the requirements work."
