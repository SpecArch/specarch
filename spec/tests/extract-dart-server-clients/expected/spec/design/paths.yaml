permissions:
  notes.read:
    origin: stated
    cites:
      - {source: code, clause: 'svc/lib/server.dart:9', says: 'GET /api/notes and GET /notes/{id} check notes.read.'}
  notes.write:
    origin: stated
    cites:
      - {source: code, clause: 'svc/lib/server.dart:10', says: POST /api/notes checks notes.write.}
paths:
  /api/notes:
    get:
      operationId: list
      permission: notes.read
      origin: stated
      cites:
        - {source: code, clause: 'svc/lib/server.dart:9', says: 'Registers GET /api/notes on api. Its check at svc/lib/server.dart:9 names notes.read.'}
        - {source: code, clause: 'svc/lib/server.dart:16', says: The handler _list.}
    post:
      operationId: create
      permission: notes.write
      origin: stated
      cites:
        - {source: code, clause: 'svc/lib/server.dart:10', says: 'Registers POST /api/notes on api. Its check at svc/lib/server.dart:19 names notes.write.'}
        - {source: code, clause: 'svc/lib/server.dart:18', says: The handler _create.}
  /api/notes/{noteId}:
    parameters:
      - {name: noteId, in: path, required: true}
    get:
      operationId: getApiNotesByNoteId
      origin: stated
      cites:
        - {source: code, clause: 'svc/lib/server.dart:11', says: Registers GET /api/notes/<noteId> on api.}
  /notes/{id}:
    parameters:
      - {name: id, in: path, required: true}
    get:
      operationId: getNotesById
      permission: notes.read
      origin: stated
      cites:
        - {source: code, clause: 'svc/frog/routes/notes/[id].dart:5', says: 'dart_frog serves GET /notes/{id} from svc/frog/routes/notes/[id].dart. Its check at svc/frog/routes/notes/[id].dart:8 names notes.read.'}
    delete:
      operationId: deleteNotesById
      origin: stated
      cites:
        - {source: code, clause: 'svc/frog/routes/notes/[id].dart:5', says: 'dart_frog serves DELETE /notes/{id} from svc/frog/routes/notes/[id].dart.'}
dependencies:
  archiveExampleOrg:
    origin: stated
    cites:
      - {source: code, clause: 'svc/lib/api.dart:9', says: 'Calls GET https://archive.example.org/v2/notes/{id} with retrofit''s @GET.'}
      - {source: code, clause: 'svc/lib/api.dart:12', says: 'Calls POST https://archive.example.org/v2/notes with retrofit''s @POST.'}
  statusExampleOrg:
    origin: stated
    cites:
      - {source: code, clause: 'svc/lib/api.dart:17', says: 'Calls GET https://status.example.org/ping with dio''s get.'}
  weatherExampleOrg:
    origin: stated
    cites:
      - {source: code, clause: 'svc/lib/api.dart:19', says: 'Calls GET https://weather.example.org/today/{id} with http.get.'}
