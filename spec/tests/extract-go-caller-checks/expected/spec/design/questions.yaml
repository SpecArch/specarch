  # specarch-problem: question: open_question: (must, decision) core/server.go:56: the handler of DELETE /invoices/{invoiceId} reads the Txn-Token header, so the operation accepts a transaction token. Declare it under tokens with tokenType txn_token and its claims, name it in the operation's token, and list the services that call it on a person's behalf in via. Decided by system-owner. Answer with a decision record that names Q-23 under answers. [Q-23]
  Q-23:
    question: 'core/server.go:56: the handler of DELETE /invoices/{invoiceId} reads the Txn-Token header, so the operation accepts a transaction token. Declare it under tokens with tokenType txn_token and its claims, name it in the operation''s token, and list the services that call it on a person''s behalf in via.'
    kind: decision
    priority: must
    blocks: ['#/paths/~1invoices~1{invoiceId}/delete/token', '#/paths/~1invoices~1{invoiceId}/delete/via']
    decidedBy: system-owner
    why: The Txn-Token header carries a transaction token and nothing else (the Transaction Tokens draft, section 12); its claims and the immediate callers are the design's, and the code shows only that the header is read.
    cites:
      - {source: code, clause: 'core/server.go:56', says: Reads the header Txn-Token.}
