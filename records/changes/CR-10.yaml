specarchRecord: "1.0.0"
kind: change
id: CR-10
title: Let a dependency say how it is reached and called, and a call how it is made, mapped, retried and answered, with the cases they make derived
raisedBy: specification-author
raised: "2026-10-28"
phase: development
type: perfective
urgency: normal
reason: A dependency was a name, a kind, a protocol and a time limit, so how this system proves itself to it, how often it may be called, how our values map to theirs, the key sent, the retries and which of their answers become ours were left to the code and not tested.
affects:
  adds:
    - SA-105
    - "#/decisions/ADR-200"
    - "#/tests/validate-integration-contract"
    - "#/tests/validate-integration-contract-refused"
    - "#/tests/validate-integration-contract-null"
    - "#/tests/derive-integration-contract"
    - "#/tests/derive-integration-contract-per-call"
    - "#/tests/document-techspec-integration"
  changes: ["#/enums/Rule"]
impact: minor
decision:
  by: specification-author
  date: "2026-10-28"
  outcome: approved
  why: Every new key of a dependency and of a call is optional in the 1.0 design schema, and a call may still be a plain name; the rule integration reaches only those keys, so a 1.2.0 file gets no new error and derives the cases it derived before, and a minor release carries it (ADR-186, ADR-200).
release: 1.3.0
status: released
