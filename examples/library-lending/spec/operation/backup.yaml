# yaml-language-server: $schema=../../../../schema/specarch-fragment-operation-0.3.schema.json
backup:
  description: The database is the only state; a nightly dump of it, kept for ninety days, is the backup.
  steps:
    - name: Dump the database
      action: Every night after closing, dump the whole database to the backup store with the date in the file name.
      check: The dump of the night is in the store and restores on a scratch server without error.
    - name: Keep ninety days
      action: Remove dumps older than ninety days.
      check: The store holds ninety dumps, the newest from last night.
