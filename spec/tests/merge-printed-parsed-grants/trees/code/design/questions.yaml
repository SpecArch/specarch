questions:
  Q-1:
    question: Does the database hold table desk.loans? It is declared at db/model.go:10, and no catalogue of the running database was read with it.
    kind: decision
    priority: must
    blocks: ['#/entities/DeskLoans']
    decidedBy: system-owner
    why: Syntax shows a declaration and not what the database holds; the catalogue dump after every migration says it, and merging it answers this.
    cites:
      - {source: code, clause: 'db/model.go:10', says: Declares desk.loans with NewModelDBTable.}
