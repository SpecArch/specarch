# yaml-language-server: $schema=https://raw.githubusercontent.com/SpecArch/specarch/v0.5.0/schema/specarch-design-0.1.schema.json
specarch: "0.1"
info:
  title: Service template sample
  version: 0.1.0
  description: |
    The OpenAPI document sample.json: every operation and component schema is a clause, every operation is written under its path citing it, and every component schema of type object is an entity. What the document does not say is a question.
  tracksOrigin: true
stages: [requirements, design]
sources:
  sample:
    kind: document
    title: Service template sample
    edition: "0.0.1"
    url: https://example.invalid/service-template-sample.json
    clauses:
      - {clause: /paths/~1health/head, title: HEAD /health}
      - {clause: /paths/~1health/get, title: GET /health}
      - {clause: /paths/~1hello/get, title: GET /hello}
