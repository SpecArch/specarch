permissions:
  loans.read:
    origin: inferred
    why: 'dxlib names the privilege LOANS.READ, and by the rule of ADR-076 a privilege named in capitals, digits and underscores, in segments joined by dots, is the permission of that name in lower case with every underscore a dot: loans.read.'
    cites:
      - {source: code, clause: access role auditor, says: auditor and desk-staff grant LOANS.READ.}
      - {source: code, clause: 'api/endpoints.go:12', says: POST /loans/read checks LOANS.READ in its privileges.}
      - {source: code, clause: 'seed/seed.go:14', says: Grants LOANS.READ to desk-staff.}
      - {source: code, clause: 'seed/seed.go:17', says: Grants LOANS.READ to clerk.}
  loans.write:
    origin: inferred
    why: 'dxlib names the privilege LOANS.WRITE, and by the rule of ADR-076 a privilege named in capitals, digits and underscores, in segments joined by dots, is the permission of that name in lower case with every underscore a dot: loans.write.'
    cites:
      - {source: code, clause: access role desk-staff, says: desk-staff grants LOANS.WRITE.}
roles:
  auditor:
    permissions: [loans.read]
    origin: stated
    cites:
      - {source: code, clause: access role auditor, says: auditor grants LOANS.READ.}
  desk-staff:
    permissions: [loans.read, loans.write]
    origin: stated
    cites:
      - {source: code, clause: access role desk-staff, says: 'desk-staff grants LOANS.READ and LOANS.WRITE.'}
      - {source: code, clause: 'seed/seed.go:13', says: Inserts the role desk-staff.}
      - {source: code, clause: 'seed/seed.go:14', says: Grants LOANS.READ to desk-staff.}
      - {source: code, clause: 'seed/seed.go:15', says: Grants LOANS.RENEW to desk-staff.}
    description: Works at the desk.
  clerk:
    description: Files the paperwork.
    permissions: [loans.read]
    origin: stated
    cites:
      - {source: code, clause: 'seed/seed.go:16', says: Inserts the role clerk.}
      - {source: code, clause: 'seed/seed.go:17', says: Grants LOANS.READ to clerk.}
