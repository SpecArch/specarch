specarchImplementation: "0.1"
info: { title: Branches in TypeScript, version: 1.0.0 }
implements: { file: ../../specarch.yaml, version: 1.0.0 }
stack: { language: { name: TypeScript, version: "6.0" } }
targets:
  ui:
    output: ../../../web
    platform: web
    framework: nextjs-carbon
    settings:
      language: en
      server:
        routes: /api
        service: BRANCHES_SERVICE_URL
        token: { cookie: branches_session, header: Authorization, scheme: Bearer }
        pages: { listAllBranches: { pageSize: 25, maximum: 100 } }
