  Q-1:
    question: The page at /orders reads operation listOrders, which its schema names; this tree does not declare it, so it waits for the tree that does. Is it that operation?
    kind: decision
    priority: must
    blocks: ['#/pages/orders/source']
    decidedBy: system-owner
    names: listOrders
    why: The schema names the operation and not its method or path, so the page's source waits for the tree that declares it; specarch merge writes it once one does.
