    kind: code
    title: The code repository
    edition: f9e2706ec00fc4821849aab40a089d04d71000e3
    url: ../repo
    clauses:
      - {clause: app/HomeView.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/Item.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/ItemDetailView.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/ItemFormView.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/Others.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/ShelfApp.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/ShelfListView.swift, title: 'Swift source, read by its syntax'}
      - {clause: app/Styles.swift, title: 'Swift source, read by its syntax'}
    reading: parsed
