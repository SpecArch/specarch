  "1. Introduction and goals": "1. Pendahuluan dan tujuan"
  "2. Constraints": "2. Batasan"
  "3. Context": "3. Konteks"
  "The interfaces the system offers, as its clients see them.": "Interface yang disediakan sistem, seperti yang dilihat client-nya."
  "Who uses the system and what it reaches: a person per role, a system per calling service with the roles it holds, and the dependencies by kind with their protocol, each edge naming the operations and jobs that call it or the channel it carries.": "Siapa yang memakai sistem dan apa yang dijangkaunya: satu orang per role, satu sistem per service pemanggil beserta role yang dipegangnya, dan dependency per jenis beserta protokolnya; tiap garis menyebut operasi dan job yang memanggilnya atau channel yang dibawanya."
  "Every property goes on the wire in snake_case (info.wireNames): a field this specification names dueOn is due_on in a body, a parameter's schema and a message. A parameter's own name is written as it is on the wire.": "Setiap property dikirim di wire dalam snake_case (info.wireNames): field yang di spesifikasi ini bernama dueOn menjadi due_on di body, di schema parameter, dan di message. Nama parameter sendiri ditulis seperti di wire."
  "| Method and path | Operation | Summary | Permission | Middlewares, in order |": "| Method dan path | Operasi | Ringkasan | Permission | Middleware, berurutan |"
  "| Method and path | Operation | Summary | Permission |": "| Method dan path | Operasi | Ringkasan | Permission |"
  "| Command | Summary | Permission | Exit statuses |": "| Command | Ringkasan | Permission | Exit status |"
  "| Channel | Message | Summary |": "| Channel | Message | Ringkasan |"
  "External systems the operations call. A call that fails, or that does not answer within its time limit, is given up, and the operation answers as its failure response says.": "Sistem eksternal yang dipanggil operasi. Panggilan yang gagal, atau yang tidak menjawab dalam batas waktunya, dihentikan, dan operasinya menjawab sesuai response kegagalannya."
  "| Dependency | Time limit per call | Called by | Description |": "| Dependency | Batas waktu per panggilan | Dipanggil oleh | Deskripsi |"
  "Specified on its own as %s; the references were written against version %s. %s": "Punya spesifikasi sendiri sebagai %s; referensinya ditulis untuk versi %s. %s"
  "5. Building blocks": "5. Building block"
  "Primary key: ": "Primary key: "
  "Validity: a record is current from its %s until its %s; outside that it is refused where it is used.": "Masa berlaku: sebuah record berlaku dari %s sampai %s-nya; di luar itu record ditolak di tempat pemakaiannya."
  "Validity: a record is current until its %s; after that it is refused where it is used.": "Masa berlaku: sebuah record berlaku sampai %s-nya; setelah itu record ditolak di tempat pemakaiannya."
  "Audited: every record also carries createdAt, createdBy, lastModifiedAt and lastModifiedBy, set by the system and never by a caller (the audit-fields idiom).": "Diaudit: setiap record juga membawa createdAt, createdBy, lastModifiedAt, dan lastModifiedBy, yang diisi sistem dan tidak pernah oleh pemanggil (idiom audit-fields)."
  "Deletion is soft: a deleted record keeps a deleted flag set by the system, is not listed, and reads as not found (the soft-delete idiom).": "Penghapusannya soft delete: record yang dihapus menyimpan flag deleted yang diisi sistem, tidak muncul di list, dan terbaca sebagai not found (idiom soft-delete)."
  "| Relation | Kind | Target | Via | On delete |": "| Relasi | Jenis | Target | Via | Saat dihapus |"
  "| Constraint | Rule | Message |": "| Constraint | Rule | Pesan |"
  "check `": "check `"
  "unique: ": "unique: "
  "Views": "View"
  "A view is a read model: one row per record of the entity it reads from, with every field of that entity and the fields below. It is never written. A path is null when a relation on it has no record; a count leaves out softly deleted records, and so do rows.": "View adalah read model: satu baris per record dari entity sumbernya, dengan semua field entity itu dan field di bawah. View tidak pernah ditulis. Sebuah path bernilai null bila relasi di jalurnya tidak punya record; count tidak menghitung record yang di-soft-delete, begitu juga rows."
  "| Field | Type | Read from | Description |": "| Field | Tipe | Dibaca dari | Deskripsi |"
  "integer, 64-bit": "integer, 64-bit"
  "count of ": "jumlah "
  "rows of ": "baris dari "
  "Reads from: ": "Dibaca dari: "
  "Schemas": "Schema"
  "A schema is data passed around but not stored: it has no key and no table, and a request body, a response, a message or another schema carries it.": "Schema adalah data yang dioper tapi tidak disimpan: tidak punya key maupun tabel, dan dibawa oleh request body, response, message, atau schema lain."
  "Enums": "Enum"
  "| Enum | Value | Meaning |": "| Enum | Nilai | Arti |"
  "Components: ": "Komponen: "
  "The packages of %s and which calls which, from its layout's dependsOn, with the libraries it uses apart.": "Package dari %s dan siapa memanggil siapa, dari dependsOn di layout-nya, dengan library yang dipakainya digambar terpisah."
  "6. Runtime view": "6. Runtime view"
  "%s to %s": "%s ke %s"
  "Problem types": "Tipe problem"
  "Every refusal is an RFC 9457 problem document of one of these types; each operation below names the ones it answers with.": "Setiap penolakan adalah problem document RFC 9457 dengan salah satu tipe ini; tiap operasi di bawah menyebut tipe yang dipakainya untuk menjawab."
  "| Problem type | Status | Title | When |": "| Tipe problem | Status | Judul | Kapan |"
  "Fixed routes": "Route tetap"
  "The routes the server answers beside its operations, GET and HEAD alone (ADR-216): the application's document, served at its path and at every page route under it with its content security policy and a nonce made for each response; the files of a folder, never a listing; the health of the service, 200 while healthy and 503 with the reason. Each is closed unless its permission is held, and Caching is its Cache-Control header: a stored response is public when the route is public and private otherwise.": "Route yang dijawab server di samping operasinya, hanya GET dan HEAD (ADR-216): dokumen aplikasi, yang disajikan di path-nya dan di setiap route halaman di bawahnya dengan content security policy dan nonce yang dibuat untuk tiap response; file dari sebuah folder, tidak pernah berupa listing; health service, 200 saat sehat dan 503 dengan alasannya. Masing-masing tertutup kecuali permission-nya dipegang, dan Caching adalah header Cache-Control-nya: response yang disimpan bersifat public bila route-nya public, dan private bila tidak."
  "| Route | Path | Serves | Permission | Caching |": "| Route | Path | Menyajikan | Permission | Caching |"
  "Route %s answers with Content-Security-Policy: %s; nonce stands for the value made for each response.": "Route %s menjawab dengan Content-Security-Policy: %s; nonce adalah nilai yang dibuat untuk tiap response."
  "not stated": "tidak disebut"
  "Runs no middleware before its handler.": "Tidak menjalankan middleware sebelum handler-nya."
  " (refuses with ": " (menolak dengan "
  "Runs before its handler, in this order: ": "Dijalankan sebelum handler-nya, dengan urutan: "
  " a page at a time": " satu halaman sekali jalan"
  " records by default": " record secara default"
  ", at most ": ", maksimal "
  " a page.": " per halaman."
  "A search matches": "Pencarian mencocokkan"
  "A filter may name": "Filter boleh menyebut"
  "It may be sorted by": "Boleh diurutkan berdasarkan"
  " A request outside these is refused, not ignored (the paginated-list idiom).": " Request di luar ini ditolak, bukan diabaikan (idiom paginated-list)."
  "a request body of at most ": "request body maksimal "
  " requests per ": " request per "
  ", with bursts of up to ": ", dengan burst sampai "
  "Limits: ": "Batasan: "
  "Idempotent by the %s header: a request repeated with the same key is answered as the first was and has no second effect; a different request with a key already used is refused.": "Idempotent lewat header %s: request yang diulang dengan key yang sama dijawab seperti yang pertama dan tidak berefek kedua kali; request berbeda dengan key yang sudah dipakai ditolak."
  "Guard: the change writes %s %s %s": "Guard: perubahan menulis %s %s %s"
  ", and `": ", dan `"
  "` must hold on each as it is at the moment of the change": "` harus berlaku pada masing-masing seperti kondisinya saat perubahan terjadi"
  "; a change that finds otherwise is refused and changes nothing, so a second writer on the same record is refused rather than overwriting the first.": "; perubahan yang mendapati kondisi lain ditolak dan tidak mengubah apa pun, jadi penulis kedua pada record yang sama ditolak, bukan menimpa yang pertama."
  "| Argument or option | Type | Required | Description |": "| Argument atau option | Tipe | Wajib | Deskripsi |"
  ", one or more": ", satu atau lebih"
  "Standard output": "Standard output"
  "Standard error": "Standard error"
  "8. Cross-cutting concepts": "8. Konsep lintas bagian"
  "Sensitive data": "Data sensitif"
  "The entity fields that are not public, and the ones encrypted at rest. A personal field is masked in logs and shown only to who may see it; a credential is never answered (the pii-in-logs and encrypted-column idioms).": "Field entity yang tidak public, dan yang dienkripsi at rest. Field personal di-mask di log dan hanya ditampilkan kepada yang berhak melihatnya; credential tidak pernah dikirim balik (idiom pii-in-logs dan encrypted-column)."
  "| Field | Sensitivity | At rest |": "| Field | Sensitivitas | At rest |"
  "Permissions": "Permission"
  "Access is fail-closed: every operation, command, page and route names the one permission it needs, and only the roles below grant one.": "Akses bersifat fail-closed: setiap operasi, command, halaman, dan route menyebut satu permission yang dibutuhkannya, dan hanya role di bawah yang memberikannya."
  "The roles grant the permissions of the modules that enforce them, each named with its module: this is the estate's one matrix, and each module's technical specification shows the roles that reach its own permissions.": "Role memberikan permission dari modul yang menegakkannya, masing-masing disebut dengan modulnya: inilah satu-satunya matrix di estate, dan spesifikasi teknis tiap modul menampilkan role yang menjangkau permission miliknya."
  "A column named with another module is a role or a client of the identity module, which grants this module's permissions by reference.": "Kolom yang disebut dengan modul lain adalah role atau client dari modul identity, yang memberikan permission modul ini lewat referensi."
  "The trust domain is %s: the audience of every transaction token across the estate, and the base of every security event's identifier, %s/events/<rule>.": "Trust domain-nya adalah %s: audience dari setiap transaction token di seluruh estate, dan dasar identifier setiap security event, %s/events/<rule>."
  "A permission implies the ones it lists: its holder holds them too, and what they imply. A cell that says through a permission is one the role holds only by that permission's implications.": "Sebuah permission mengimplikasikan permission yang didaftarnya: pemegangnya ikut memegang permission itu, dan apa yang diimplikasikannya. Sel yang bertuliskan lewat sebuah permission adalah permission yang dipegang role itu hanya karena implikasi permission tersebut."
  "| Permission | Implies |": "| Permission | Mengimplikasikan |"
  "The caller is who is making the call, as the service knows it once the session or token has been checked: one record with the properties below, which a role's rows rule names as caller.<property>. A property the caller may lack allows null, and a comparison with it is false then.": "Caller adalah siapa yang melakukan panggilan, seperti yang diketahui service setelah session atau token dicek: satu record dengan property di bawah, yang disebut rule rows milik role sebagai caller.<property>. Property yang mungkin tidak dimiliki caller boleh null, dan perbandingan dengannya bernilai false bila begitu."
  "| Property | Type | Description |": "| Property | Tipe | Deskripsi |"
  "No entity is shared.": "Tidak ada entity yang dipakai bersama."
  "Every tenant reads ": "Setiap tenant membaca "
  "The tenant scope: every role reaches only the records of an entity that carries %s whose %s is the caller's %s, and the table below holds that rule for each such entity, unless the role writes its own rule for it. %s": "Scope tenant: setiap role hanya menjangkau record dari entity yang membawa %s dengan %s sama dengan %s milik caller, dan tabel di bawah memuat rule itu untuk tiap entity tersebut, kecuali role menulis rule-nya sendiri. %s"
  "A role with a rows rule reaches only the records of the entity the rule holds for, through every operation, page and job; an entity not listed is reached whole, and a caller holding several roles reaches the union of their rows. A list shows only the rows, a read by key outside them answers not found, and a change that would leave them is refused.": "Role dengan rule rows hanya menjangkau record dari entity yang dicakup rule itu, lewat setiap operasi, halaman, dan job; entity yang tidak terdaftar dijangkau utuh, dan caller yang memegang beberapa role menjangkau gabungan rows-nya. List hanya menampilkan rows itu, pembacaan lewat key di luarnya menjawab not found, dan perubahan yang akan keluar dari rows itu ditolak."
  "| Role | Entity | Rows |": "| Role | Entity | Rows |"
  "The permission signedIn is held by every caller once signed in, a person or a client, whatever their roles, and granted by no role: it opens what every person has, such as their own profile.": "Permission signedIn dipegang setiap caller setelah sign-in, orang maupun client, apa pun role-nya, dan tidak diberikan oleh role mana pun: permission ini membuka apa yang dimiliki setiap orang, seperti profilnya sendiri."
  "The page each role is shown after signing in, its home; a person holding several roles is shown the home of the first of them, in the order the session answers them, that has one: ": "Halaman yang ditampilkan untuk tiap role setelah sign-in, yaitu home-nya; orang yang memegang beberapa role ditampilkan home dari role pertama, sesuai urutan jawaban session, yang punya home: "
  "The permission nobody closes a route on purpose: it stays in the contract and refuses every caller with the problem the design declares, so that a client still calling it is told, not given a 404 that looks like a wrong path. No role grants it.": "Permission nobody menutup sebuah route dengan sengaja: route tetap ada di kontrak dan menolak setiap caller dengan problem yang dideklarasikan desain, supaya client yang masih memanggilnya diberi tahu, bukan diberi 404 yang terlihat seperti path yang salah. Tidak ada role yang memberikannya."
  "The clients: the programs that call the system, each by its software_id. An application is where a person signs in; a service calls on its own account with the roles it holds and a proof of its identity on each request, or carries a person's call. A client with roles is a column of the matrix above. A client is admitted only where an operation's callers lists it; a public client, one with no proof, has a name that is the issuer's word and no proof of origin.": "Client: program yang memanggil sistem, masing-masing dengan software_id-nya. Application adalah tempat orang sign-in; service memanggil atas namanya sendiri dengan role yang dipegangnya dan bukti identitas di tiap request, atau membawa panggilan seseorang. Client yang punya role menjadi satu kolom di matrix di atas. Client hanya diterima di operasi yang callers-nya mendaftar client itu; public client, yaitu yang tanpa bukti, punya nama yang hanya berdasarkan klaim issuer tanpa bukti asal."
  "| Client | Kind | Admitted versions | Roles | Proof |": "| Client | Jenis | Versi yang diterima | Role | Bukti |"
  ", a security check: the publisher's version, in its signed software statement": ", pengecekan keamanan: versi dari publisher, di software statement yang ditandatanganinya"
  ", a compatibility check: self-asserted": ", pengecekan kompatibilitas: dinyatakan sendiri"
  "closed: nobody": "tertutup: nobody"
  "Who may call: an operation or command that lists its callers admits exactly them, people (anyone signed in, whose roles decide the rest) and the clients named; one that lists none admits people and refuses every client; one closed with nobody refuses everyone.": "Siapa yang boleh memanggil: operasi atau command yang mendaftar callers-nya hanya menerima mereka, yaitu orang (siapa pun yang sudah sign-in, sisanya ditentukan role-nya) dan client yang disebut; yang tidak mendaftar siapa pun menerima orang dan menolak setiap client; yang ditutup dengan nobody menolak semua."
  "| Operation or command | Callers |": "| Operasi atau command | Callers |"
  "The tokens: the formats the service issues and accepts. An access token rides in the Authorization header as a bearer token and is accepted only for the audience it names; a transaction token rides in the Txn-Token header across the trust domain, minted once at the edge and passed on unmodified, and each hop accepts it only from the immediate callers its via names, each proving its workload identity. A claim fills the caller's property of the same name. The one default token is what every operation accepts unless it names another.": "Token: format yang diterbitkan dan diterima service. Access token dikirim di header Authorization sebagai bearer token dan hanya diterima untuk audience yang disebutnya; transaction token dikirim di header Txn-Token di seluruh trust domain, dibuat sekali di edge dan diteruskan tanpa diubah, dan tiap hop hanya menerimanya dari immediate caller yang disebut via-nya, masing-masing membuktikan workload identity-nya. Sebuah claim mengisi property caller dengan nama yang sama. Satu token default adalah yang diterima setiap operasi kecuali operasi itu menyebut token lain."
  "| Token | Kind | Header | Audience | Lifetime | Signature | Claims | Accepted by |": "| Token | Jenis | Header | Audience | Masa berlaku | Signature | Claim | Diterima oleh |"
  "access token": "access token"
  "Authorization: Bearer": "Authorization: Bearer"
  "none fixed": "tidak ditetapkan"
  "transaction token": "transaction token"
  "the trust domain": "trust domain"
  "no operation": "tidak ada operasi"
  "none: opaque": "tidak ada: opaque"
  "The delegation chains that reach the operations with a via, as the induction through calls finds them across the modules given with this one: from the person's application at the edge, hop by hop, with the token each hop accepts and the workload identity the caller presents on each arrow.": "Rantai delegasi yang menjangkau operasi yang punya via, seperti yang ditemukan induksi lewat pemanggilan di seluruh modul yang diberikan bersama modul ini: dari application milik orang itu di edge, hop demi hop, dengan token yang diterima tiap hop dan workload identity yang ditunjukkan caller di tiap panah."
  "The delegation chain each operation accepts, hop by hop, with the token on each arrow: the services via names call the operation on the person's behalf, each presenting its workload identity.": "Rantai delegasi yang diterima tiap operasi, hop demi hop, dengan token di tiap panah: service yang disebut via memanggil operasi itu atas nama orang tersebut, masing-masing menunjukkan workload identity-nya."
  "Security events": "Security event"
  "Every refusal of a caller writes a security event, a Security Event Token (RFC 8417) holding the rule, the severity, the operation, the client, the subject and the hash of the refused token, never the token itself, to %s, the append-only store; an event of severity high, or a repeat for one client within the window the deployment sets, goes to %s, the alarm channel, as well. The events, by the rule that refuses:": "Setiap penolakan caller menulis security event, yaitu Security Event Token (RFC 8417) yang memuat rule, severity, operasi, client, subject, dan hash dari token yang ditolak, tidak pernah token itu sendiri, ke %s, yaitu store append-only; event dengan severity high, atau yang berulang untuk satu client dalam window yang ditetapkan deployment, juga dikirim ke %s, yaitu channel alarm. Event-nya, per rule yang menolak:"
  "| Refusal | Rule | Severity |": "| Penolakan | Rule | Severity |"
  "| a token for another audience | token_audience | high |": "| token untuk audience lain | token_audience | high |"
  "| an immediate caller not listed in via | via | high |": "| immediate caller yang tidak terdaftar di via | via | high |"
  "| the confused deputy, each form | deputy | high |": "| confused deputy, semua bentuknya | deputy | high |"
  "| a caller not in callers, or a closed route | callers | medium |": "| caller yang tidak ada di callers, atau route yang ditutup | callers | medium |"
  "| an application not in through | through | medium |": "| application yang tidak ada di through | through | medium |"
  "| a version outside the admitted range, with a software statement | software_version | medium |": "| versi di luar rentang yang diterima, dengan software statement | software_version | medium |"
  "| a version outside the admitted range, self-asserted | software_version | low |": "| versi di luar rentang yang diterima, dinyatakan sendiri | software_version | low |"
  "| an expired token | token | low |": "| token yang kedaluwarsa | token | low |"
  "| at the sign-in callback, %s | %s | %s |": "| di callback sign-in, %s | %s | %s |"
  "Every role goes on the wire in upper snake case (info.roleNames): in a token's roles claim and in the tables the permission check reads, a role is its name in capitals with each hyphen an underscore.": "Setiap role dikirim di wire dalam upper snake case (info.roleNames): di claim roles milik token dan di tabel yang dibaca pengecekan permission, sebuah role ditulis dengan huruf kapital dan tiap tanda hubung menjadi underscore."
  "| Role | On the wire |": "| Role | Di wire |"
  "No role grants as many of a set's permissions as its cardinality; the validator refuses one that does. Which person holds which roles is data the specification does not hold, so each set lists the combinations of roles that together reach it: roles never to be given to one person.": "Tidak ada role yang memberikan permission dari sebuah set sebanyak cardinality-nya; validator menolak role yang melakukannya. Siapa memegang role apa adalah data yang tidak dimuat spesifikasi, jadi tiap set mendaftar kombinasi role yang bersama-sama mencapainya: role yang tidak boleh diberikan ke satu orang."
  "| Set | Permissions | Cardinality | Roles never given to one person |": "| Set | Permission | Cardinality | Role yang tidak boleh diberikan ke satu orang |"
  "none: no roles together reach it": "tidak ada: tidak ada gabungan role yang mencapainya"
  "Middlewares": "Middleware"
  "The steps a request passes before an operation's handler runs, each declared once. Each operation names the ones it runs, in order, under HTTP operations; a refusal answers in place of the handler.": "Langkah yang dilewati request sebelum handler operasi dijalankan, masing-masing dideklarasikan sekali. Tiap operasi menyebut middleware yang dijalankannya, berurutan, di Operasi HTTP; penolakan menjawab menggantikan handler."
  "| Middleware | What it checks or does | Refusals | Run by |": "| Middleware | Yang dicek atau dikerjakan | Penolakan | Dijalankan oleh |"
  "Sessions": "Session"
  " without a request": " tanpa request"
  " from signing in, whatever the caller does": " sejak sign-in, apa pun yang dilakukan caller"
  "A caller's session expires ": "Session caller kedaluwarsa "
  ", and ": ", dan "
  ". Every operation, command and page with a permission other than public refuses a caller whose session has expired.": ". Setiap operasi, command, dan halaman dengan permission selain public menolak caller yang session-nya sudah kedaluwarsa."
  "The menu, each entry shown to who may open its page:": "Menu, tiap entry ditampilkan kepada yang boleh membuka halamannya:"
  "| Page | Kind | Route | Entity | Permission | Shows |": "| Halaman | Jenis | Route | Entity | Permission | Menampilkan |"
  "; on a compact screen ": "; di layar compact "
  "none; submits to ": "tidak ada; mengirim ke "
  "none; loads and sends nothing": "tidak ada; tidak memuat dan tidak mengirim apa pun"
  "the project's own screen, built by hand": "layar milik proyek sendiri, dibuat manual"
  "filtered empty": "kosong setelah difilter"
  "failed: ": "gagal: "
  ", beside ": ", di samping "
