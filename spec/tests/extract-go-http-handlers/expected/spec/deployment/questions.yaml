questions:
  # specarch-problem: question: open_question: (must, decision) The setting max-body-bytes is read as a whole number. How wide is it? Decided by system-owner. Answer with a decision record that names Q-6 under answers. [Q-6]
  Q-6:
    question: The setting max-body-bytes is read as a whole number. How wide is it?
    kind: decision
    priority: must
    blocks: ['#/configuration/maxBodyBytes/schema/format']
    decidedBy: system-owner
    why: Go's int and a number in a file have no width the source states, and every integer in a specification has one.
    cites:
      - {source: code, clause: 'cmd/desk/main.go:14', says: Reads max-body-bytes as a whole number.}
  # specarch-problem: question: open_question: (must, decision) What is each setting for, where does its value come from, and is it a secret: api-token, DESK_CHECKS, DESK_SCOPE, DESK_UPSTREAM, listen-addr, max-body-bytes, verbose? Decided by system-owner. Answer with a decision record that names Q-7 under answers. [Q-7]
  Q-7:
    question: 'What is each setting for, where does its value come from, and is it a secret: api-token, DESK_CHECKS, DESK_SCOPE, DESK_UPSTREAM, listen-addr, max-body-bytes, verbose?'
    kind: decision
    priority: must
    blocks: ['#/configuration/apiToken/description', '#/configuration/deskChecks/description', '#/configuration/deskChecks/secret', '#/configuration/deskScope/description', '#/configuration/deskScope/secret', '#/configuration/deskUpstream/description', '#/configuration/deskUpstream/secret', '#/configuration/listenAddr/description', '#/configuration/listenAddr/secret', '#/configuration/maxBodyBytes/description', '#/configuration/maxBodyBytes/secret', '#/configuration/verbose/description', '#/configuration/verbose/secret']
    decidedBy: system-owner
    why: The source names the settings it reads and not what they are for; whether one is a secret is said only where the source marks it sensitive.
  # specarch-problem: question: open_question: (must, decision) Is each of these settings a secret: api-token? Each name says it may hold a credential, and the source does not mark it sensitive. Decided by system-owner. Answer with a decision record that names Q-8 under answers. [Q-8]
  Q-8:
    question: 'Is each of these settings a secret: api-token? Each name says it may hold a credential, and the source does not mark it sensitive.'
    kind: decision
    priority: must
    blocks: ['#/configuration/apiToken/secret']
    decidedBy: system-owner
    why: A secret's value is never written in a specification, and the name alone does not say which a setting is.
