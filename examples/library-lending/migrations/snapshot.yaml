# The schema as it stood after the last migration, written by specarch-gen-sql. Do not edit this file.
dialect: postgresql
entities:
  Book:
    constraints:
      book_available_within_owned:
        expression: copiesAvailable <= copiesOwned
        kind: check
      book_isbn_unique:
        fields:
          - isbn
        kind: unique
    primaryKey:
      - id
    properties:
      author:
        maxLength: 200
        type: string
      copiesAvailable:
        format: int32
        type: integer
      copiesOwned:
        format: int32
        type: integer
      id:
        format: uuid
        type: string
      isbn:
        maxLength: 13
        type: string
      replacementCost:
        format: decimal
        precision: 10
        scale: 2
        type: string
      title:
        maxLength: 500
        type: string
    relations:
      loans:
        kind: one-to-many
        target: Loan
        via: bookId
    required:
      - id
      - isbn
      - title
      - author
      - copiesOwned
      - copiesAvailable
      - replacementCost
  Loan:
    constraints:
      loan_due_after_loaned:
        expression: dueOn > date(loanedAt)
        kind: check
      loan_returned_after_loaned:
        expression: returnedAt == null || returnedAt >= loanedAt
        kind: check
    primaryKey:
      - id
    properties:
      bookId:
        format: uuid
        type: string
      dueOn:
        format: date
        type: string
      id:
        format: uuid
        type: string
      lateFee:
        format: decimal
        precision: 10
        scale: 2
        type: string
      loanedAt:
        format: date-time
        type: string
      memberId:
        format: uuid
        type: string
      returnedAt:
        format: date-time
        type:
          - string
          - "null"
      status:
        $ref: '#/enums/LoanStatus'
    relations:
      book:
        kind: many-to-one
        onDelete: restrict
        target: Book
        via: bookId
      member:
        kind: many-to-one
        onDelete: restrict
        target: Member
        via: memberId
    required:
      - id
      - memberId
      - bookId
      - loanedAt
      - dueOn
      - status
      - lateFee
  Member:
    audited: true
    constraints:
      member_card_number_unique:
        fields:
          - cardNumber
        kind: unique
      member_email_unique:
        fields:
          - email
        kind: unique
    deletion: soft
    primaryKey:
      - id
    properties:
      cardNumber:
        maxLength: 8
        type: string
      email:
        atRest: encrypted
        format: email
        lookup: hash
        maxLength: 320
        type: string
      fullName:
        maxLength: 200
        type: string
      id:
        format: uuid
        type: string
      joinedOn:
        format: date
        type: string
      membershipEndsOn:
        format: date
        type: string
      outstandingFees:
        format: decimal
        precision: 10
        scale: 2
        type: string
      tier:
        $ref: '#/enums/MembershipTier'
    relations:
      loans:
        kind: one-to-many
        target: Loan
        via: memberId
    required:
      - id
      - cardNumber
      - fullName
      - email
      - tier
      - joinedOn
      - membershipEndsOn
      - outstandingFees
enums:
  LoanStatus:
    enum:
      - open
      - overdue
      - returned
      - lost
    type: string
  MembershipTier:
    enum:
      - standard
      - extended
    type: string
mappings:
  '#/entities/Book': table books
  '#/entities/Loan': table loans
  '#/entities/Member': table members
typeRendering: 1.2.0
